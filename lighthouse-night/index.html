<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lighthouse at Night - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1420; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 0; z-index:5; }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#d8e2ea; text-transform:uppercase; text-shadow:0 1px 8px rgba(4,8,14,.8); }
  header .rule { width:44px; height:1px; background:rgba(216,226,234,.5); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#c9d6e2; transition:opacity 1.2s ease; text-shadow:0 1px 2px rgba(4,8,14,1), 0 0 12px rgba(4,8,14,.85); }
  #hint.faded { opacity:.42; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(201,214,226,.55); }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Lighthouse at Night</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// pass markers for deploy verification
// pass 2: visibility/light pass - scene read as near-black void with solid-grey beam cone; lifted moon/hemisphere,
//          lighter sheen sea, narrow warm double-cone beam, brighter foam/pool/lamp
// pass 3: structure pass (main direction) - faceted multi-frequency sea surface (was flat+camo shadow acne; added
//          normalBias), beam alpha fades to zero before the far rim (kills opaque endcap), foam broken into
//          irregular jittered patches (was a flat band), fill light so slab strata read
// pass 4: normalBias did not cure the acne - sea no longer receives shadow maps (camo patches gone),
//          fake radial contact shadow under the islet instead
// pass 5: the patches were never acne - wave troughs dipped below the strata top face (y=0) and the grey slab
//          poked through the water. Sea raised to y=0.28 (trough 0.04 > 0), waterline dependents moved with it
// pass 6: foam as soft lacy texture patches (flat cutout discs), lighter readable strata, moon moved front-right
//          as key light for sea facets / tower / strata
// pass 1: first lighthouse-night build - marine night palette, striped tower on rocky islet, drag beam sweep, tap fog, course-correcting ships, exact corner-fit camera

const PAL = {
  sky: 0x0a1420, sea: 0x1b4551, seaDeep: 0x0d232c, foam: 0xcfe8e4,
  rock: 0x4a525c, rockDark: 0x363c45,
  towerWhite: 0xf2ede2, towerRed: 0x8e3b34, lampRoom: 0x2a2f38,
  beam: 0xffd98a, hut: 0x4a3f36, hutRoof: 0x33302c, window: 0xffc46b
};

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.sky);
scene.fog = new THREE.FogExp2(PAL.sky, 0.008);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.52; controls.enablePan = false;

// ---------- lights ----------
const moon = new THREE.DirectionalLight(0xa9c0d8, 1.35);
moon.position.set(9, 11, 5);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -14; moon.shadow.camera.right = 14;
moon.shadow.camera.top = 14; moon.shadow.camera.bottom = -14;
moon.shadow.camera.far = 60; moon.shadow.bias = -0.0001; moon.shadow.normalBias = 0.06;
scene.add(moon);
scene.add(new THREE.HemisphereLight(0x3a5068, 0x14222a, 1.15));
const fill = new THREE.DirectionalLight(0x6a8299, 0.35);
fill.position.set(4, 5, 12); scene.add(fill);
const lampLight = new THREE.PointLight(PAL.beam, 40, 34, 1.6);
scene.add(lampLight);

// stars
{
  const n = 160, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, e = Math.random()*Math.PI*0.42 + 0.08, r = 80;
    pos[i*3] = Math.cos(a)*Math.cos(e)*r; pos[i*3+1] = Math.sin(e)*r; pos[i*3+2] = Math.sin(a)*Math.cos(e)*r;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcdd8e4, size: 0.55, sizeAttenuation: false, fog: false })));
}

// ---------- slab with sea top ----------
const SLAB = 16, SLAB_H = 3.2;
const slabGroup = new THREE.Group(); scene.add(slabGroup);
function strata(h, y, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(SLAB, h, SLAB),
    new THREE.MeshStandardMaterial({ color, roughness: 0.95 }));
  m.position.y = y; m.receiveShadow = true; slabGroup.add(m);
}
strata(0.9, -SLAB_H + 0.45, 0x39424d);
strata(1.1, -SLAB_H + 0.9 + 0.55, 0x455060);
strata(1.2, -SLAB_H + 2.0 + 0.6, 0x525f6e);

// animated sea surface
const seaGeo = new THREE.PlaneGeometry(SLAB, SLAB, 64, 64);
const seaMat = new THREE.MeshStandardMaterial({ color: PAL.sea, roughness: 0.42, metalness: 0.25, flatShading: true });
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.rotation.x = -Math.PI/2; sea.position.y = 0.28; sea.receiveShadow = false; // shadow-map acne made camo patches

// fake soft contact shadow under the islet (replaces real shadow-mapped water)
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0, 'rgba(4,10,14,0.62)'); gr.addColorStop(0.55, 'rgba(4,10,14,0.30)'); gr.addColorStop(1, 'rgba(4,10,14,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(c);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(4.1, 32),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI/2; sh.position.y = 0.295; slabGroup.add(sh);
}
slabGroup.add(sea);
const seaBase = seaGeo.attributes.position.array.slice();

// ---------- rocky islet ----------
const islet = new THREE.Group(); slabGroup.add(islet);
const rockMat = new THREE.MeshStandardMaterial({ color: PAL.rock, roughness: 0.95, flatShading: true });
const rockDarkMat = new THREE.MeshStandardMaterial({ color: PAL.rockDark, roughness: 1, flatShading: true });
const ROCKS = [
  [0,0.55,0,2.2,rockMat],[1.6,0.35,0.7,1.5,rockDarkMat],[-1.5,0.4,0.5,1.6,rockMat],
  [0.4,0.3,-1.5,1.4,rockDarkMat],[-0.9,0.3,-1.1,1.2,rockMat],[1.1,0.25,1.6,1.1,rockDarkMat],
  [-1.9,0.22,1.4,0.9,rockDarkMat],[2.2,0.18,-0.6,0.8,rockMat],[-2.3,0.15,-0.5,0.75,rockMat]
];
for (const [x,y,z,s,m] of ROCKS) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), m);
  r.position.set(x,y,z); r.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
  r.scale.y = 0.72; r.castShadow = true; r.receiveShadow = true; islet.add(r);
}

// foam ring + flecks
const foamFlecks = [];
function foamTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 26; i++) {  // cluster of soft specks -> lacy irregular patch
    const x = 34 + Math.random()*60, y = 34 + Math.random()*60, r = 4 + Math.random()*14;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(228,244,240,0.55)'); gr.addColorStop(1, 'rgba(228,244,240,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const foamMap = foamTex();
for (let i = 0; i < 20; i++) {
  const a = Math.random()*Math.PI*2, r = 2.35 + Math.random()*1.2;
  const f = new THREE.Mesh(new THREE.CircleGeometry(0.2 + Math.random()*0.3, 10),
    new THREE.MeshBasicMaterial({ map: foamMap, transparent: true, depthWrite: false,
      opacity: 0.3 + Math.random()*0.4 }));
  f.rotation.x = -Math.PI/2; f.rotation.z = Math.random()*Math.PI*2;
  f.position.set(Math.cos(a)*r, 0.32 + Math.random()*0.02, Math.sin(a)*r);
  slabGroup.add(f); foamFlecks.push(f);
}

// ---------- lighthouse ----------
const tower = new THREE.Group(); islet.add(tower);
const TOWER_H = 6.4, BASE_Y = 0.9;
function band(y0, h, r0, r1, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, h, 18),
    new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
  m.position.y = BASE_Y + y0 + h/2; m.castShadow = true; tower.add(m); return m;
}
band(0.0, 1.3, 0.95, 0.85, PAL.towerRed);
band(1.3, 1.3, 0.85, 0.76, PAL.towerWhite);
band(2.6, 1.3, 0.76, 0.67, PAL.towerRed);
band(3.9, 1.25, 0.67, 0.58, PAL.towerWhite);
// gallery
const gallery = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.14, 18),
  new THREE.MeshStandardMaterial({ color: PAL.lampRoom, roughness: 0.7 }));
gallery.position.y = BASE_Y + 5.22; gallery.castShadow = true; tower.add(gallery);
const rail = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.03, 6, 24),
  new THREE.MeshStandardMaterial({ color: 0x1c2027, roughness: 0.6 }));
rail.rotation.x = Math.PI/2; rail.position.y = BASE_Y + 5.55; tower.add(rail);
// lamp room + lens
const lampRoom = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.85, 14),
  new THREE.MeshStandardMaterial({ color: PAL.lampRoom, roughness: 0.5, metalness: 0.3 }));
lampRoom.position.y = BASE_Y + 5.72; lampRoom.castShadow = true; tower.add(lampRoom);
const lens = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12),
  new THREE.MeshBasicMaterial({ color: PAL.beam }));
lens.position.y = BASE_Y + 5.72; tower.add(lens);
const roof = new THREE.Mesh(new THREE.ConeGeometry(0.62, 0.6, 14),
  new THREE.MeshStandardMaterial({ color: PAL.towerRed, roughness: 0.7 }));
roof.position.y = BASE_Y + 6.45; roof.castShadow = true; tower.add(roof);
const LENS_Y = BASE_Y + 5.72;
lampLight.position.set(0, LENS_Y, 0);

// keeper's hut
const hut = new THREE.Group();
const hutBody = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 1.0),
  new THREE.MeshStandardMaterial({ color: PAL.hut, roughness: 1 }));
hutBody.position.y = 0.4; hutBody.castShadow = true; hut.add(hutBody);
const hutRoof = new THREE.Mesh(new THREE.ConeGeometry(1.0, 0.55, 4),
  new THREE.MeshStandardMaterial({ color: PAL.hutRoof, roughness: 1 }));
hutRoof.position.y = 1.05; hutRoof.rotation.y = Math.PI/4; hutRoof.castShadow = true; hut.add(hutRoof);
const hutWin = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.26),
  new THREE.MeshBasicMaterial({ color: PAL.window }));
hutWin.position.set(0.2, 0.45, 0.51); hut.add(hutWin);
hut.position.set(1.7, 0.75, 1.2); hut.rotation.y = -0.5; islet.add(hut);

// ---------- beam ----------
const beamGroup = new THREE.Group(); beamGroup.position.set(0, LENS_Y, 0); scene.add(beamGroup);
const BEAM_LEN = 9;
function beamAlphaTex() {
  // alpha fades from the lens (v=1, canvas top) to zero well before the far rim: no endcap
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, 'rgb(0,255,0)');
  gr.addColorStop(0.55, 'rgb(0,140,0)');
  gr.addColorStop(0.85, 'rgb(0,0,0)');
  gr.addColorStop(1, 'rgb(0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  return new THREE.CanvasTexture(c);
}
const beamAlpha = beamAlphaTex();
function beamCone(radius, len, opacity) {
  const g = new THREE.ConeGeometry(radius, len, 20, 1, true);
  g.translate(0, -len/2, 0);
  g.rotateX(-Math.PI/2); // point +z
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xffe2a8, transparent: true,
    opacity, alphaMap: beamAlpha, blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide, depthWrite: false, fog: false }));
}
const beamOuter = beamCone(1.45, BEAM_LEN, 0.14);
const beamInner = beamCone(0.5, BEAM_LEN, 0.30);
beamGroup.add(beamOuter); beamGroup.add(beamInner);
const beamMat = { get opacity() { return beamOuter.material.opacity; },
  set opacity(v) { beamOuter.material.opacity = v; beamInner.material.opacity = v * 2.4; } };
// lens glow
function glowTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,4,64,64,64);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const lensGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgba(255,222,150,0.95)','rgba(255,222,150,0)'),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
lensGlow.scale.setScalar(3.2); beamGroup.add(lensGlow);
// light pool where the beam points on the sea
const pool = new THREE.Mesh(new THREE.CircleGeometry(1.5, 24),
  new THREE.MeshBasicMaterial({ color: PAL.beam, transparent: true, opacity: 0.30,
    blending: THREE.AdditiveBlending, depthWrite: false }));
pool.rotation.x = -Math.PI/2; scene.add(pool);

// ---------- ships ----------
const ships = [];
function ship(laneR, laneA, speed) {
  const s = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.22, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x141a22, roughness: 0.9 }));
  hull.castShadow = true; s.add(hull);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.55, 6),
    new THREE.MeshStandardMaterial({ color: 0x1d242e }));
  mast.position.y = 0.35; s.add(mast);
  const win = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgba(255,196,107,0.9)','rgba(255,196,107,0)'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  win.scale.setScalar(0.35); win.position.set(0.15, 0.16, 0); s.add(win);
  s.userData = { laneR, a: laneA, speed, heading: 0, targetHeading: 0, win };
  scene.add(s); ships.push(s); return s;
}
ship(6.1, 0.6, 0.05); ship(6.8, 2.7, -0.04); ship(5.6, 4.4, 0.06);

// ---------- camera: exact corner-fit ----------
const frameBox = new THREE.Box3(
  new THREE.Vector3(-SLAB/2 - 2.5, -SLAB_H, -SLAB/2 - 2.5),
  new THREE.Vector3(SLAB/2 + 2.5, BASE_Y + 8.2, SLAB/2 + 2.5));
function frameInitialCamera() {
  const center = frameBox.getCenter(new THREE.Vector3());
  center.y = 2.6;
  const dir = new THREE.Vector3(0.66, 0.4, 1).normalize();
  const fwd = dir.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const fovH = 2 * Math.atan(Math.tan(fovV/2) * camera.aspect);
  let dist = 8;
  for (const bx of [frameBox.min.x, frameBox.max.x])
    for (const by of [frameBox.min.y, frameBox.max.y])
      for (const bz of [frameBox.min.z, frameBox.max.z]) {
        const rel = new THREE.Vector3(bx, by, bz).sub(center);
        const cz = rel.dot(dir);
        dist = Math.max(dist,
          cz + Math.abs(rel.dot(right)) / Math.tan(fovH/2),
          cz + Math.abs(rel.dot(up)) / Math.tan(fovV/2));
      }
  dist *= 1.05;
  camera.position.copy(center).addScaledVector(dir, dist);
  controls.target.copy(center);
  camera.updateProjectionMatrix(); controls.update();
}
frameInitialCamera();

// ---------- hints ----------
const hintEl = document.getElementById('hint');
const HINTS = {
  idle: 'Drag to sweep the beam - tap the lamp for fog',
  sweep: 'Painting the dark water',
  fogIn: 'The fog rolls in',
  fogOut: 'The fog lifts'
};
let fogOn = false;
function setHint(s) {
  hintEl.textContent = HINTS[s]; hintEl.classList.remove('faded');
  clearTimeout(setHint._t);
  setHint._t = setTimeout(() => hintEl.classList.add('faded'), 6000);
}
setHint('idle');

// ---------- interaction ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let sweeping = false, downAt = 0, downXY = [0,0], lastX = 0, hitLamp = false, beamYaw = 0, autoSweep = true;
function toNDC(e) { ndc.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1); }
function hitsTower(e) {
  toNDC(e); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(tower, true);
  if (!hits.length) return false;
  hitLamp = hits[0].object === lampRoom || hits[0].object === lens;
  return true;
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  camera.updateMatrixWorld(true); tower.updateMatrixWorld(true);
  downAt = performance.now(); downXY = [e.clientX, e.clientY]; lastX = e.clientX; hitLamp = false;
  if (hitsTower(e)) { sweeping = true; controls.enabled = false; autoSweep = false; if (!hitLamp) setHint('sweep'); }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!sweeping) return;
  beamYaw += (e.clientX - lastX) * 0.008; lastX = e.clientX;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  const dt = performance.now() - downAt;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  if (sweeping) {
    sweeping = false; controls.enabled = true;
    if (moved < 7 && dt < 450 && hitLamp) {
      fogOn = !fogOn; setHint(fogOn ? 'fogIn' : 'fogOut');
    } else setHint('idle');
    setTimeout(() => { autoSweep = true; }, 6000);
  }
});

// ---------- animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // sea swell
  const pos = seaGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = seaBase[i*3], y = seaBase[i*3+1];
    pos.setZ(i, Math.sin(x*0.9 + t*1.2)*0.10 + Math.cos(y*1.3 + t*0.9)*0.07
              + Math.sin((x+y)*2.1 + t*1.7)*0.045 + Math.cos((x-y)*3.1 + t*2.3)*0.025);
  }
  pos.needsUpdate = true; seaGeo.computeVertexNormals();

  // foam: each patch breathes on its own phase, occasional drift
  foamFlecks.forEach((f,i) => {
    f.material.opacity = 0.15 + 0.4*Math.abs(Math.sin(t*0.9 + i*1.7));
    f.rotation.z += dt * 0.05 * (i % 2 ? 1 : -1);
  });

  // beam yaw: idle auto-sweep + manual offset
  if (autoSweep) beamYaw += Math.sin(t*0.3) * dt * 0.5;
  beamGroup.rotation.y = beamYaw;
  const bdir = new THREE.Vector3(Math.sin(beamYaw), 0, Math.cos(beamYaw));
  pool.position.copy(bdir).multiplyScalar(6.2); pool.position.y = 0.35;
  pool.material.opacity = fogOn ? 0.12 : 0.30;
  beamMat.opacity += ((fogOn ? 0.30 : 0.16) - beamMat.opacity) * dt * 2.5;
  lensGlow.material.opacity = 0.85 + Math.sin(t*2.2)*0.15;
  lampLight.intensity = 38 + Math.sin(t*2.2)*7;

  // fog ease
  const targetD = fogOn ? 0.055 : 0.008;
  scene.fog.density += (targetD - scene.fog.density) * dt * 1.4;

  // ships: drift lanes, correct course near beam
  for (const s of ships) {
    const u = s.userData;
    u.a += u.speed * dt;
    const sx = Math.cos(u.a) * u.laneR, sz = Math.sin(u.a) * u.laneR;
    s.position.set(sx, 0.38 + Math.sin(t*1.5 + u.a*3)*0.04, sz);
    s.rotation.z = Math.sin(t*1.3 + u.a*2)*0.05;
    // heading: tangent to lane by default
    const tangent = Math.atan2(u.speed > 0 ? -Math.sin(u.a) : Math.sin(u.a), u.speed > 0 ? Math.cos(u.a) : -Math.cos(u.a));
    // beam dwell -> turn broadside (parallel to shore = tangent stays, else turn to face beam)
    const shipA = Math.atan2(sx, sz);
    let dA = Math.abs(((beamYaw % (Math.PI*2)) - shipA) % (Math.PI*2));
    if (dA > Math.PI) dA = Math.PI*2 - dA;
    u.targetHeading = dA < 0.35 ? Math.atan2(bdir.x, bdir.z) + Math.PI/2 : tangent;
    let dh = u.targetHeading - s.rotation.y;
    while (dh > Math.PI) dh -= Math.PI*2; while (dh < -Math.PI) dh += Math.PI*2;
    s.rotation.y += dh * Math.min(1, dt * (dA < 0.35 ? 0.8 : 0.3));
    u.win.material.opacity = fogOn ? 0.35 : 0.9;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();
});
setTimeout(() => hintEl.classList.add('faded'), 6000);
</script>
</body>
