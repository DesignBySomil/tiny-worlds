<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Avalanche slope — a tiny world</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(165deg, #d7e9f7 0%, #bfd9f0 48%, #a7c7e4 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #173047;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #canvas-wrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 12px 16px 8px;
      text-align: center;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(215, 233, 247, 0.92) 0%, rgba(215, 233, 247, 0.65) 75%, rgba(215, 233, 247, 0) 100%);
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: clamp(1.08rem, 3.2vw, 1.38rem);
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #12293d;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    .subtitle {
      font-size: clamp(0.78rem, 2.3vw, 0.92rem);
      font-weight: 500;
      color: #3f6382;
      font-style: italic;
    }
    .hint {
      margin-top: 3px;
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 600;
      color: #284b6a;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: inline-block;
      padding: 3px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 6px rgba(18, 41, 61, 0.06);
    }
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 6px 16px 10px;
      text-align: center;
      pointer-events: none;
      font-size: clamp(0.68rem, 1.8vw, 0.76rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3d607e;
      background: linear-gradient(0deg, rgba(167, 199, 228, 0.9) 0%, rgba(167, 199, 228, 0.5) 70%, rgba(167, 199, 228, 0) 100%);
    }
    #fallback {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #d7e9f7;
      color: #173047;
      font-size: 0.95rem;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="ui-header">
      <div class="title-row">
        <h1>Avalanche slope</h1>
        <span class="subtitle">a tiny world</span>
      </div>
      <div class="hint">tap the slope for an avalanche - tap the pines</div>
    </header>
    <div id="canvas-wrap"></div>
    <footer id="ui-footer">A tiny world</footer>
    <div id="fallback">WebGL could not be initialized on this device or browser. Please ensure hardware acceleration is enabled.</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261103)
    function mulberry32(a) {
      return function() {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261103);
    const randRange = (min, max) => min + (max - min) * rand();

    const wrap = document.getElementById('canvas-wrap');
    const headerEl = document.getElementById('ui-header');
    const footerEl = document.getElementById('ui-footer');
    const fallbackEl = document.getElementById('fallback');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }
    if (!renderer || !renderer.getContext()) {
      fallbackEl.style.display = 'flex';
      throw new Error('WebGL context unavailable');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(36, 1, 0.5, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.minPolarAngle = THREE.MathUtils.degToRad(34);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(66);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-40);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(40);

    // Alpine daylight lighting
    const hemiLight = new THREE.HemisphereLight(0xeef7ff, 0x8bb0d4, 1.35);
    hemiLight.position.set(0, 18, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff9ee, 2.05);
    sunLight.position.set(9.5, 16.5, 8.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    sunLight.shadow.camera.near = 4;
    sunLight.shadow.camera.far = 34;
    const dShadow = 8.4;
    sunLight.shadow.camera.left = -dShadow;
    sunLight.shadow.camera.right = dShadow;
    sunLight.shadow.camera.top = dShadow;
    sunLight.shadow.camera.bottom = -dShadow;
    sunLight.shadow.bias = -0.0006;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0xa3cbf0, 0.72);
    rimLight.position.set(-10, 8, -9);
    scene.add(rimLight);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // Shared materials (cold alpine palette)
    const matSnowPure = new THREE.MeshStandardMaterial({
      color: 0xf7fbff,
      roughness: 0.72,
      metalness: 0.03,
      flatShading: true
    });
    const matSnowShade = new THREE.MeshStandardMaterial({
      color: 0xdcebf8,
      roughness: 0.76,
      metalness: 0.03,
      flatShading: true
    });
    const matCrownScarp = new THREE.MeshStandardMaterial({
      color: 0xb5d3ec,
      roughness: 0.58,
      metalness: 0.06,
      flatShading: true
    });
    const matRockDark = new THREE.MeshStandardMaterial({
      color: 0x566575,
      roughness: 0.88,
      metalness: 0.05,
      flatShading: true
    });
    const matRockMid = new THREE.MeshStandardMaterial({
      color: 0x6f8092,
      roughness: 0.85,
      metalness: 0.05,
      flatShading: true
    });
    const matSlabBase = new THREE.MeshStandardMaterial({
      color: 0x3b4856,
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });
    const matPineDark = new THREE.MeshStandardMaterial({
      color: 0x1d4a3d,
      roughness: 0.82,
      flatShading: true
    });
    const matPineMid = new THREE.MeshStandardMaterial({
      color: 0x265c4b,
      roughness: 0.8,
      flatShading: true
    });
    const matTrunk = new THREE.MeshStandardMaterial({
      color: 0x4f3829,
      roughness: 0.9,
      flatShading: true
    });
    const matCloud = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.92,
      metalness: 0.0,
      flatShading: true,
      transparent: true,
      opacity: 0.9
    });
    const matCrackGlow = new THREE.MeshBasicMaterial({
      color: 0x7fc4fd,
      transparent: true,
      opacity: 0.0
    });

    // Mathematical terrain function for the slope surface
    // Z goes from -4.4 (peak back) to +4.4 (runout front)
    // X goes from -4.4 (left) to +4.4 (right)
    function getSlopeHeight(x, z) {
      // Normalized front-to-back coordinate u in [0, 1] where 0 is back (-4.4) and 1 is front (+4.4)
      const u = THREE.MathUtils.clamp((z + 4.4) / 8.8, 0, 1);
      // Steep upper slope curving smoothly into flat runout valley floor
      const baseCurve = Math.pow(1 - u, 1.68) * 5.25;

      // Central chute shallow concavity vs lateral shoulders
      const chuteFactor = Math.exp(-(x * x) / 6.2);
      const ridgeShoulders = (1 - chuteFactor) * (1 - u * 0.72) * 0.52;

      // Wind-carved diagonal sastrugi & relief ridges
      const wind1 = Math.sin(x * 2.1 + z * 1.65) * 0.09 * (1 - u * 0.45);
      const wind2 = Math.cos(x * 3.8 - z * 2.4) * 0.045 * (1 - u * 0.6);

      // Steep peak crest near the back
      const peakBoost = Math.max(0, 1 - Math.hypot(x * 0.65, z + 3.85) / 2.9) * 0.72;

      return 0.55 + baseCurve + ridgeShoulders + wind1 + wind2 + peakBoost;
    }

    function getSlopeNormal(x, z) {
      const eps = 0.08;
      const hL = getSlopeHeight(x - eps, z);
      const hR = getSlopeHeight(x + eps, z);
      const hD = getSlopeHeight(x, z - eps);
      const hU = getSlopeHeight(x, z + eps);
      const v = new THREE.Vector3(hL - hR, 2 * eps, hD - hU).normalize();
      return v;
    }

    // Build Sculptural Diorama Slab Base + Snow Surface Mesh
    const SLAB_HALF = 4.4;
    const SEGMENTS = 56;

    function buildDioramaSlab() {
      const group = new THREE.Group();

      // 1. Top snow surface with bevelled skirt edges
      const topGeo = new THREE.PlaneGeometry(SLAB_HALF * 2, SLAB_HALF * 2, SEGMENTS, SEGMENTS);
      topGeo.rotateX(-Math.PI / 2);
      const pos = topGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const cPure = new THREE.Color(0xf8fcff);
      const cBlue = new THREE.Color(0xd2e6f7);
      const cRidge = new THREE.Color(0xffffff);
      const tmpColor = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i);
        const edgeDist = Math.max(Math.abs(vx), Math.abs(vz));
        const bevel = edgeDist > 4.18 ? (edgeDist - 4.18) * 0.55 : 0;
        const h = getSlopeHeight(vx, vz) - bevel;
        pos.setY(i, h);

        const u = (vz + 4.4) / 8.8;
        const windShade = Math.sin(vx * 2.1 + vz * 1.65) * 0.5 + 0.5;
        tmpColor.copy(cBlue).lerp(cPure, 0.45 + 0.45 * windShade);
        if (h > 4.2) tmpColor.lerp(cRidge, 0.35);
        if (u > 0.7) tmpColor.lerp(cPure, 0.25);
        colors[i * 3] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;
      }
      topGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      topGeo.computeVertexNormals();

      const snowTopMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.7,
        metalness: 0.04,
        flatShading: true
      });
      const snowTopMesh = new THREE.Mesh(topGeo, snowTopMat);
      snowTopMesh.receiveShadow = true;
      snowTopMesh.castShadow = true;
      group.add(snowTopMesh);

      // 2. Rock Cutaway Cliff Walls around the 4 sides down to y = -0.55
      const baseBottom = -0.55;
      const wallPositions = [];
      const wallColors = [];
      const cRock1 = new THREE.Color(0x526171);
      const cRock2 = new THREE.Color(0x6b7c8e);
      const cSnowLip = new THREE.Color(0xdcebf7);

      function pushQuad(p1, p2, p3, p4, colTop, colBot) {
        wallPositions.push(
          p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z,
          p1.x, p1.y, p1.z, p3.x, p3.y, p3.z, p4.x, p4.y, p4.z
        );
        wallColors.push(
          colTop.r, colTop.g, colTop.b,
          colTop.r, colTop.g, colTop.b,
          colBot.r, colBot.g, colBot.b,
          colTop.r, colTop.g, colTop.b,
          colBot.r, colBot.g, colBot.b,
          colBot.r, colBot.g, colBot.b
        );
      }

      const step = (SLAB_HALF * 2) / SEGMENTS;
      const sides = [
        { start: [-SLAB_HALF, SLAB_HALF], dir: [1, 0] },   // front (+Z)
        { start: [SLAB_HALF, SLAB_HALF], dir: [0, -1] },   // right (+X)
        { start: [SLAB_HALF, -SLAB_HALF], dir: [-1, 0] },  // back (-Z)
        { start: [-SLAB_HALF, -SLAB_HALF], dir: [0, 1] }   // left (-X)
      ];

      sides.forEach((side) => {
        for (let s = 0; s < SEGMENTS; s++) {
          const x0 = side.start[0] + side.dir[0] * s * step;
          const z0 = side.start[1] + side.dir[1] * s * step;
          const x1 = side.start[0] + side.dir[0] * (s + 1) * step;
          const z1 = side.start[1] + side.dir[1] * (s + 1) * step;

          const y0 = getSlopeHeight(x0, z0) - 0.12;
          const y1 = getSlopeHeight(x1, z1) - 0.12;
          const yMid0 = baseBottom + (y0 - baseBottom) * 0.78;
          const yMid1 = baseBottom + (y1 - baseBottom) * 0.78;

          // Upper snow lip band
          pushQuad(
            new THREE.Vector3(x0, y0, z0),
            new THREE.Vector3(x1, y1, z1),
            new THREE.Vector3(x1 * 1.004, yMid1, z1 * 1.004),
            new THREE.Vector3(x0 * 1.004, yMid0, z0 * 1.004),
            cSnowLip,
            cRock2
          );
          // Lower faceted rock slab wall
          pushQuad(
            new THREE.Vector3(x0 * 1.004, yMid0, z0 * 1.004),
            new THREE.Vector3(x1 * 1.004, yMid1, z1 * 1.004),
            new THREE.Vector3(x1 * 0.99, baseBottom, z1 * 0.99),
            new THREE.Vector3(x0 * 0.99, baseBottom, z0 * 0.99),
            cRock2,
            cRock1
          );
        }
      });

      const wallGeo = new THREE.BufferGeometry();
      wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallPositions, 3));
      wallGeo.setAttribute('color', new THREE.Float32BufferAttribute(wallColors, 3));
      wallGeo.computeVertexNormals();
      const wallMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.86,
        metalness: 0.05,
        flatShading: true
      });
      const wallMesh = new THREE.Mesh(wallGeo, wallMat);
      wallMesh.castShadow = true;
      wallMesh.receiveShadow = true;
      group.add(wallMesh);

      // 3. Tactile Bevelled Pedestal Plinth Base
      const plinthGeo = new THREE.BoxGeometry(SLAB_HALF * 2.02, 0.34, SLAB_HALF * 2.02);
      plinthGeo.translate(0, baseBottom - 0.17, 0);
      const plinthMesh = new THREE.Mesh(plinthGeo, matSlabBase);
      plinthMesh.receiveShadow = true;
      plinthMesh.castShadow = true;
      group.add(plinthMesh);

      // 4. Exposed craggy rock outcrops near the peak and ridges
      const rockGeo = new THREE.DodecahedronGeometry(0.65, 1);
      const rockConfigs = [
        { x: -2.45, z: -3.2, sx: 1.35, sy: 0.85, sz: 1.0, ry: 0.5 },
        { x: 2.35, z: -3.0, sx: 1.4, sy: 0.9, sz: 0.95, ry: -0.7 },
        { x: -0.35, z: -3.85, sx: 1.6, sy: 0.95, sz: 0.85, ry: 0.2 },
        { x: -3.3, z: -1.1, sx: 1.1, sy: 0.68, sz: 1.1, ry: 1.1 },
        { x: 3.25, z: -0.8, sx: 1.05, sy: 0.65, sz: 1.15, ry: -1.2 }
      ];
      rockConfigs.forEach((rc) => {
        const m = new THREE.Mesh(rockGeo, matRockDark);
        const y = getSlopeHeight(rc.x, rc.z) - 0.15;
        m.position.set(rc.x, y, rc.z);
        m.scale.set(rc.sx, rc.sy, rc.sz);
        m.rotation.set(0.25, rc.ry, -0.15);
        m.castShadow = true;
        m.receiveShadow = true;
        group.add(m);
      });

      return group;
    }

    const slabGroup = buildDioramaSlab();
    worldGroup.add(slabGroup);

    // Build Crown Scarp Face & Releasable Upper Snow Slab + Jagged Crack Line
    const crownGroup = new THREE.Group();
    worldGroup.add(crownGroup);

    // Crown scarp bed wall (revealed when slab fractures, and subtly visible as a ridge line before release)
    const crownPoints = [
      { x: -2.35, z: -2.15 },
      { x: -1.55, z: -2.48 },
      { x: -0.75, z: -2.28 },
      { x: 0.05, z: -2.56 },
      { x: 0.88, z: -2.25 },
      { x: 1.68, z: -2.42 },
      { x: 2.35, z: -2.05 }
    ];

    function getCrownZAtX(x) {
      for (let i = 0; i < crownPoints.length - 1; i++) {
        const p0 = crownPoints[i];
        const p1 = crownPoints[i + 1];
        if (x >= p0.x && x <= p1.x) {
          const t = (x - p0.x) / (p1.x - p0.x);
          return THREE.MathUtils.lerp(p0.z, p1.z, t);
        }
      }
      return -2.3;
    }

    // Build visible bevelled crown scarp step & jagged crack segments
    const crackSegments = [];
    const scarpGeo = new THREE.BoxGeometry(0.86, 0.34, 0.24);
    const crackLineGeo = new THREE.BoxGeometry(0.88, 0.12, 0.09);

    for (let i = 0; i < crownPoints.length - 1; i++) {
      const p0 = crownPoints[i];
      const p1 = crownPoints[i + 1];
      const mx = (p0.x + p1.x) * 0.5;
      const mz = (p0.z + p1.z) * 0.5;
      const my = getSlopeHeight(mx, mz);
      const len = Math.hypot(p1.x - p0.x, p1.z - p0.z);
      const ang = Math.atan2(p1.z - p0.z, p1.x - p0.x);

      // Crown scarp face
      const scarp = new THREE.Mesh(scarpGeo, matCrownScarp);
      scarp.position.set(mx, my + 0.11, mz);
      scarp.scale.x = len / 0.82;
      scarp.rotation.y = -ang;
      scarp.rotation.x = 0.42;
      scarp.castShadow = true;
      scarp.receiveShadow = true;
      crownGroup.add(scarp);

      // Flashing jagged crack indicator
      const crackMesh = new THREE.Mesh(crackLineGeo, matCrackGlow.clone());
      crackMesh.position.set(mx, my + 0.29, mz + 0.07);
      crackMesh.scale.x = len / 0.84;
      crackMesh.rotation.y = -ang;
      crackMesh.rotation.x = 0.42;
      crownGroup.add(crackMesh);
      crackSegments.push(crackMesh);
    }

    // Fracturing Upper Snow Slab Chunks (sit smoothly on the upper slope until triggered)
    const slabChunks = [];
    const chunkBaseGeo = new THREE.DodecahedronGeometry(0.38, 0);
    // Flatten dodecahedron into a tactile tabular snow slab block
    chunkBaseGeo.scale(1.18, 0.38, 0.95);

    const rows = 4;
    const cols = 7;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const u = (c + 0.5) / cols;
        const x = THREE.MathUtils.lerp(-2.05, 2.05, u) + randRange(-0.12, 0.12);
        const zCrown = getCrownZAtX(x);
        const z = zCrown + 0.26 + r * 0.36 + randRange(-0.06, 0.06);
        const y = getSlopeHeight(x, z) + 0.08;
        const norm = getSlopeNormal(x, z);

        const mesh = new THREE.Mesh(chunkBaseGeo, (r + c) % 2 === 0 ? matSnowPure : matSnowShade);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const baseScale = new THREE.Vector3(
          randRange(0.75, 1.12),
          randRange(0.75, 1.05),
          randRange(0.75, 1.1)
        );
        mesh.scale.copy(baseScale);

        const dummy = new THREE.Object3D();
        dummy.position.set(x, y, z);
        const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), norm);
        dummy.quaternion.copy(qAlign);
        dummy.rotateY(randRange(-0.4, 0.4));

        mesh.position.copy(dummy.position);
        mesh.quaternion.copy(dummy.quaternion);
        crownGroup.add(mesh);

        slabChunks.push({
          mesh,
          homePos: dummy.position.clone(),
          homeQuat: dummy.quaternion.clone(),
          baseScale: baseScale.clone(),
          delay: r * 0.055 + Math.abs(x) * 0.04 + randRange(0, 0.06),
          speed: randRange(2.4, 3.35),
          lateralDrift: x * randRange(0.12, 0.26) + randRange(-0.2, 0.2),
          spinAxis: new THREE.Vector3(randRange(0.7, 1.2), randRange(-0.5, 0.5), randRange(-0.5, 0.5)).normalize(),
          spinRate: randRange(4.5, 8.5),
          runoutStopZ: randRange(2.25, 3.65)
        });
      }
    }

    // Half-buried Boulders on the Lower Slope & Runout with Dynamic Snow Caps
    const boulders = [];
    const boulderGeo = new THREE.DodecahedronGeometry(0.46, 1);
    const boulderCapGeo = new THREE.SphereGeometry(0.38, 10, 8);
    boulderCapGeo.scale(1.12, 0.42, 1.05);

    const boulderSpecs = [
      { x: -1.35, z: 1.05, s: 1.08, ry: 0.4 },
      { x: 1.15, z: 0.72, s: 0.94, ry: 1.7 },
      { x: -0.25, z: 2.05, s: 0.82, ry: 2.5 },
      { x: 1.85, z: 2.45, s: 1.15, ry: 0.9 },

    boulderSpecs.forEach((bs) => {

    // Cluster of Small Alpine Pines on Lower Slope & Runout
    const pines = [];
    const pineConeGeo = new THREE.ConeGeometry(0.42, 0.68, 7);
    const pineCapGeo = new THREE.ConeGeometry(0.43, 0.28, 7);
    const trunkGeo = new THREE.CylinderGeometry(0.07, 0.1, 0.36, 6);

    const pineSpecs = [
      // Main interactive cluster on right-front & left-front lower slope / runout

      { x: -1.25, z: 2.38, s: 1.18 },

      { x: 1.05, z: 1.72, s: 1.12 },
      { x: 1.68, z: 1.95, s: 0.92 },

    pineSpecs.forEach((ps, idx) => {

    // Soft Sculptural Clouds Behind the Peak
    const clouds = [];
    const cloudPuffGeo = new THREE.DodecahedronGeometry(0.55, 1);

    const cloudConfigs = [

    cloudConfigs.forEach((cc) => {

    // Runout Fresh Uneven Debris Blanket (stays after avalanche until re-triggered)
    const debrisMounds = [];
    const debrisGeo = new THREE.DodecahedronGeometry(0.45, 1);

    for (let i = 0; i < 38; i++) {

    // Instanced Meshes for Hundreds of Snowballs, Rolling Powder Cloud, Pine Spray & Ambient Snowfall
    const dummyObj = new THREE.Object3D();

    // 1. Tumbling Avalanche Snowballs (320 instances)
    const SNOWBALL_COUNT = 320;
    const snowballGeo = new THREE.IcosahedronGeometry(0.13, 0);
    const snowballInst = new THREE.InstancedMesh(snowballGeo, matSnowPure, SNOWBALL_COUNT);
    snowballInst.castShadow = true;
    snowballInst.receiveShadow = true;
    worldGroup.add(snowballInst);

    const snowballData = [];
    for (let i = 0; i < SNOWBALL_COUNT; i++) {
      const startX = randRange(-2.15, 2.15);

    snowballInst.instanceMatrix.needsUpdate = true;

    // 2. Rolling Billowing Powder Cloud & Spray Front (360 instances)
    const POWDER_COUNT = 360;
    const powderGeo = new THREE.DodecahedronGeometry(0.32, 0);
    const powderMat = new THREE.MeshStandardMaterial({

    });
    const powderInst = new THREE.InstancedMesh(powderGeo, powderMat, POWDER_COUNT);
    worldGroup.add(powderInst);

    const powderData = [];
    for (let i = 0; i < POWDER_COUNT; i++) {
      const startX = randRange(-2.1, 2.1);
      const startZ = getCrownZAtX(startX) + randRange(0.0, 0.95);
      const endZ = randRange(1.9, 4.05);
      powderData.push({

        dissipateDuration: randRange(0.22, 0.36),
        maxLift: randRange(0.22, 1.15),

      });
      dummyObj.position.set(0, -50, 0);
      dummyObj.scale.setScalar(0.0001);
      dummyObj.updateMatrix();
      powderInst.setMatrixAt(i, dummyObj.matrix);
    }
    powderInst.instanceMatrix.needsUpdate = true;

    // 3. Dislodged Pine Branch Snow Spray (180 instances)
    const PINE_SPRAY_COUNT = 180;
    const pineSprayGeo = new THREE.OctahedronGeometry(0.085, 0);
    const pineSprayInst = new THREE.InstancedMesh(pineSprayGeo, matSnowPure, PINE_SPRAY_COUNT);
    worldGroup.add(pineSprayInst);

    const pineSprayData = [];
    for (let i = 0; i < PINE_SPRAY_COUNT; i++) {
      const pineIdx = i % pines.length;
      const p = pines[pineIdx];
      const angle = randRange(0, Math.PI * 2);
      const speedH = randRange(0.25, 0.95);
      pineSprayData.push({
        pineIdx,
        ox: p.x + Math.cos(angle) * randRange(0.08, 0.34) * p.scale,
        oy: p.y + randRange(0.38, 1.05) * p.scale,
        oz: p.z + Math.sin(angle) * randRange(0.08, 0.34) * p.scale,
        vx: Math.cos(angle) * speedH,
        vy: randRange(0.35, 1.15),
        vz: Math.sin(angle) * speedH,
        delay: randRange(0, 0.18),
        scale: randRange(0.55, 1.35)
      });
      dummyObj.position.set(0, -50, 0);
      dummyObj.scale.setScalar(0.0001);
      dummyObj.updateMatrix();
      pineSprayInst.setMatrixAt(i, dummyObj.matrix);
    }
    pineSprayInst.instanceMatrix.needsUpdate = true;

    // 4. Ambient Gentle Snowfall + Occasional Tiny Natural Ridge Sluffs (240 instances)
    const SNOWFALL_COUNT = 200;
    const SLUFF_COUNT = 40;
    const flakeGeo = new THREE.OctahedronGeometry(0.048, 0);
    const snowfallInst = new THREE.InstancedMesh(flakeGeo, matSnowPure, SNOWFALL_COUNT + SLUFF_COUNT);
    worldGroup.add(snowfallInst);

    const snowfallData = [];
    for (let i = 0; i < SNOWFALL_COUNT; i++) {
      snowfallData.push({
        x: randRange(-4.1, 4.1),
        z: randRange(-4.1, 4.1),
        yOffset: randRange(0, 5.2),
        fallSpeed: randRange(0.45, 0.85),
        swayAmp: randRange(0.08, 0.22),
        swayFreq: randRange(0.8, 1.7),
        phase: randRange(0, Math.PI * 2),
        scale: randRange(0.65, 1.35)
      });
    }

    const sluffData = [];
    for (let i = 0; i < SLUFF_COUNT; i++) {
      const ridgeCluster = i < SLUFF_COUNT / 2 ? -1.45 : 1.35;
      sluffData.push({
        startX: ridgeCluster + randRange(-0.45, 0.45),
        startZ: randRange(-3.55, -2.85),
        travelDist: randRange(1.1, 1.95),
        offsetTime: (i < SLUFF_COUNT / 2 ? 0 : 2.7) + randRange(0, 0.45),
        cyclePeriod: 5.4,
        scale: randRange(0.85, 1.55)
      });
    }

    // Generous Invisible Hit Proxies for Reliable Tap at 320px
    const proxyMat = new THREE.MeshBasicMaterial({ visible: false });
    const interactiveProxies = [];

    // Upper slope / crown face proxy
    const slopeProxyGeo = new THREE.BoxGeometry(6.8, 3.8, 4.8);
    const slopeProxy = new THREE.Mesh(slopeProxyGeo, proxyMat);
    slopeProxy.position.set(0, 4.1, -2.0);
    slopeProxy.rotation.x = 0.55;
    slopeProxy.userData.targetType = 'avalanche';
    worldGroup.add(slopeProxy);
    interactiveProxies.push(slopeProxy);

    // Lower slope / pine cluster generous proxies (left cluster, right cluster, and front bridge)
    const pineProxyGeoL = new THREE.BoxGeometry(3.6, 2.8, 3.4);
    const pineProxyL = new THREE.Mesh(pineProxyGeoL, proxyMat);
    pineProxyL.position.set(-1.6, 1.4, 2.3);
    pineProxyL.userData.targetType = 'pines';
    worldGroup.add(pineProxyL);
    interactiveProxies.push(pineProxyL);

    const pineProxyGeoR = new THREE.BoxGeometry(3.6, 2.8, 3.4);
    const pineProxyR = new THREE.Mesh(pineProxyGeoR, proxyMat);
    pineProxyR.position.set(1.5, 1.4, 2.2);
    pineProxyR.userData.targetType = 'pines';
    worldGroup.add(pineProxyR);
    interactiveProxies.push(pineProxyR);

    // State Management (Independent Timers, Clean Re-trigger, Never Locks)
    const AVALANCHE_DURATION = 8.0; // ~8 seconds hero sequence
    const PINE_SHAKE_DURATION = 2.6;

    const state = {
      avalancheStartTime: -1,
      avalancheActive: false,
      hasDebrisBlanket: false,
      resetTransitionStart: -1,
      resetTransitionDuration: 0.42,
      pineShakeStartTime: -1,
      pineShakeActive: false
    };

    function triggerAvalanche(nowSec) {
      // If a previous avalanche left debris or is mid-run, perform a clean, brisk snow-state reset at the start of the cycle
      if (state.hasDebrisBlanket || state.avalancheActive) {
        state.resetTransitionStart = nowSec;
      }
      state.avalancheStartTime = nowSec;
      state.avalancheActive = true;
      state.hasDebrisBlanket = true;
    }

    function triggerPineCluster(nowSec) {
      state.pineShakeStartTime = nowSec;
      state.pineShakeActive = true;
    }

    // Raycaster & Pointer Tap vs Drag Detection
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let pointerDownPos = null;
    let pointerDownTime = 0;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const dt = performance.now() - pointerDownTime;
      pointerDownPos = null;

      // Distinguish intentional tap from camera orbit drag
      if (dist > 9 || dt > 600) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNDC, camera);
      const nowSec = performance.now() * 0.001;

      // 1. Check generous target proxies first
      const hits = raycaster.intersectObjects(interactiveProxies, false);
      if (hits.length > 0) {
        const type = hits[0].object.userData.targetType;
        if (type === 'pines') {
          triggerPineCluster(nowSec);
          return;
        }
        if (type === 'avalanche') {
          triggerAvalanche(nowSec);
          return;
        }
      }

      // 2. Fallback: intersect visible scene geometry so any tap on the slab routes intuitively
      const meshHits = raycaster.intersectObjects(worldGroup.children, true);
      if (meshHits.length > 0) {
        const pt = meshHits[0].point;
        if (pt.z > 0.85) {
          triggerPineCluster(nowSec);
        } else {
          triggerAvalanche(nowSec);
        }
      }
    });

    // Framing & Responsive Camera Distance Computation from Projected Bounding Box
    // Includes slab base, peak top, clouds, powder cloud headroom, and debris runout
    const framingBoundsPoints = [
      new THREE.Vector3(-4.65, -0.92, -4.65),
      new THREE.Vector3(4.65, -0.92, -4.65),
      new THREE.Vector3(-4.65, -0.92, 4.65),
      new THREE.Vector3(4.65, -0.92, 4.65),
      new THREE.Vector3(-4.65, 3.1, 4.65),
      new THREE.Vector3(4.65, 3.1, 4.65),
      new THREE.Vector3(-3.8, 7.25, -4.75),
      new THREE.Vector3(3.8, 7.25, -4.75),
      new THREE.Vector3(0, 7.45, -3.5),
      new THREE.Vector3(0, 5.2, 0.5)
    ];

    const sceneCenter = new THREE.Vector3(0, 2.35, -0.15);
    // Slightly elevated three-quarter view direction
    const baseViewDir = new THREE.Vector3(0.46, 0.62, 0.92).normalize();

    function updateFramingAndSize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      renderer.setSize(vw, vh);

      const headerH = headerEl.getBoundingClientRect().height || 58;
      const footerH = footerEl.getBoundingClientRect().height || 30;

      // Safe vertical fraction between header and footer
      const safeTopFrac = (headerH + 8) / vh;
      const safeBotFrac = (footerH + 8) / vh;
      const usableHeightFrac = Math.max(0.45, 1.0 - safeTopFrac - safeBotFrac);
      const usableWidthFrac = 0.91;

      const aspect = vw / Math.max(1, vh);
      // Aspect-aware FOV (portrait wider)
      camera.fov = aspect < 0.85 ? 43 : aspect < 1.15 ? 38 : 34;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Build camera basis vectors along baseViewDir
      const forward = baseViewDir.clone().negate();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, forward).normalize();

      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const tanHalfVFov = Math.tan(vFovRad * 0.5) * usableHeightFrac;
      const tanHalfHFov = Math.tan(vFovRad * 0.5) * aspect * usableWidthFrac;

      let requiredDist = 11.0;
      const rel = new THREE.Vector3();

      for (let i = 0; i < framingBoundsPoints.length; i++) {
        rel.subVectors(framingBoundsPoints[i], sceneCenter);
        const projX = Math.abs(rel.dot(right));
        const projY = Math.abs(rel.dot(up));
        const projZ = rel.dot(forward); // depth along view ray

        const distForX = projX / Math.max(0.05, tanHalfHFov) - projZ;
        const distForY = projY / Math.max(0.05, tanHalfVFov) - projZ;
        requiredDist = Math.max(requiredDist, distForX, distForY);
      }

      // Small padding so nothing touches the edges or crosses header/footer
      const finalDist = requiredDist * 1.07;

      // Shift target slightly vertically to center inside the asymmetric header/footer safe box
      const verticalBias = (safeTopFrac - safeBotFrac) * 1.15;
      controls.target.set(sceneCenter.x, sceneCenter.y + verticalBias, sceneCenter.z);

      camera.position.copy(controls.target).addScaledVector(baseViewDir, finalDist);
      controls.minDistance = finalDist * 0.84;
      controls.maxDistance = finalDist * 1.22;
      controls.update();
    }

    window.addEventListener('resize', updateFramingAndSize);
    updateFramingAndSize();

    // Animation Helpers
    const qTmp = new THREE.Quaternion();
    const eulerTmp = new THREE.Euler();

    function updateScene(nowMs) {
      const now = nowMs * 0.001;

      // 1. IDLE: Soft Clouds Sliding Behind the Peak
      for (let i = 0; i < clouds.length; i++) {
        const c = clouds[i];
        c.group.position.x = c.baseX + Math.sin(now * c.speed + c.phase) * c.range;
        c.group.position.y = c.baseY + Math.cos(now * c.speed * 1.4 + c.phase) * 0.07;
      }

      // 2. IDLE: Sparse Snowfall & Periodic Natural Ridge Sluffs (clamped strictly to slab airspace)
      for (let i = 0; i < SNOWFALL_COUNT; i++) {
        const sf = snowfallData[i];
        const groundY = getSlopeHeight(sf.x, sf.z);
        const maxAirY = 6.55; // Keeps flakes below header safe zone
        const span = Math.max(1.2, maxAirY - groundY);
        const progress = ((now * sf.fallSpeed + sf.yOffset) % span) / span;
        const y = maxAirY - progress * span;
        const x = sf.x + Math.sin(now * sf.swayFreq + sf.phase) * sf.swayAmp;
        const z = sf.z + Math.cos(now * sf.swayFreq * 0.8 + sf.phase) * sf.swayAmp;

        // Soft fade-in at top and fade-out near surface
        const edgeFade = Math.min(1, progress * 5, (1 - progress) * 6);
        dummyObj.position.set(x, y, z);
        dummyObj.rotation.set(now + sf.phase, now * 0.7, 0);
        dummyObj.scale.setScalar(sf.scale * edgeFade);
        dummyObj.updateMatrix();
        snowfallInst.setMatrixAt(i, dummyObj.matrix);
      }

      for (let i = 0; i < SLUFF_COUNT; i++) {
        const sl = sluffData[i];
        const idx = SNOWFALL_COUNT + i;
        const cycleTime = (now + sl.offsetTime) % sl.cyclePeriod;
        if (cycleTime < 1.8) {
          const p = cycleTime / 1.8;
          const easeP = p * p * (3 - 2 * p);
          const z = sl.startZ + easeP * sl.travelDist;
          const x = sl.startX + Math.sin(p * 6 + i) * 0.08;
          const y = getSlopeHeight(x, z) + 0.05 + Math.sin(p * Math.PI) * 0.06;
          const s = sl.scale * Math.sin(p * Math.PI);
          dummyObj.position.set(x, y, z);
          dummyObj.rotation.set(now * 5, i, 0);
          dummyObj.scale.setScalar(s);
        } else {
          dummyObj.position.set(0, -50, 0);
          dummyObj.scale.setScalar(0.0001);
        }
        dummyObj.updateMatrix();
        snowfallInst.setMatrixAt(idx, dummyObj.matrix);
      }
      snowfallInst.instanceMatrix.needsUpdate = true;

      // 3. INTERACTION 1: AVALANCHE HERO SEQUENCE (~8.0 seconds)
      let avaProgress = -1;
      if (state.avalancheActive) {
        const elapsed = now - state.avalancheStartTime;
        if (elapsed <= AVALANCHE_DURATION) {
          avaProgress = elapsed / AVALANCHE_DURATION;
        } else {
          state.avalancheActive = false;
          avaProgress = 1.0;
        }
      }

      // Crown Crack Flash (0.0s -> 1.3s)
      for (let i = 0; i < crackSegments.length; i++) {
        const seg = crackSegments[i];
        if (state.avalancheActive && avaProgress < 0.22) {
          const localP = THREE.MathUtils.clamp((avaProgress - i * 0.012) / 0.14, 0, 1);
          const flash = Math.sin(localP * Math.PI);
          seg.material.opacity = flash * 0.95;
          seg.scale.y = 1 + flash * 1.6;
        } else {
          seg.material.opacity = 0;
          seg.scale.y = 1;
        }
      }

      // Upper Snow Slab Chunks Fracturing & Tumbling Downhill
      for (let i = 0; i < slabChunks.length; i++) {
        const ch = slabChunks[i];
        if (!state.avalancheActive && !state.hasDebrisBlanket) {
          ch.mesh.position.copy(ch.homePos);
          ch.mesh.quaternion.copy(ch.homeQuat);
          ch.mesh.scale.copy(ch.baseScale);
        } else if (state.avalancheActive) {
          const elapsed = now - state.avalancheStartTime;
          // Clean quick reset reform during first 0.22s if re-triggered
          if (elapsed < ch.delay) {
            const reformP = THREE.MathUtils.clamp(elapsed / Math.max(0.08, ch.delay), 0, 1);
            ch.mesh.position.copy(ch.homePos);
            ch.mesh.quaternion.copy(ch.homeQuat);
            ch.mesh.scale.copy(ch.baseScale).multiplyScalar(0.35 + 0.65 * reformP);
          } else {
            const moveTime = elapsed - ch.delay;
            const slideDur = 2.65;
            const t = THREE.MathUtils.clamp(moveTime / slideDur, 0, 1);
            // Accelerate under gravity then decelerate in runout
            const easeT = t < 0.7 ? 1.42 * t * t : 1 - Math.pow(1 - t, 2.4) * 0.55;
            const curZ = THREE.MathUtils.lerp(ch.homePos.z, ch.runoutStopZ, THREE.MathUtils.clamp(easeT, 0, 1));
            const curX = ch.homePos.x + ch.lateralDrift * t;
            const bounce = t < 0.92 ? Math.abs(Math.sin(moveTime * 9.5 + i)) * 0.16 * (1 - t) : 0;
            const curY = getSlopeHeight(curX, curZ) + 0.07 + bounce;

            ch.mesh.position.set(curX, curY, curZ);
            qTmp.setFromAxisAngle(ch.spinAxis, moveTime * ch.spinRate * (1 - t * 0.55));
            ch.mesh.quaternion.copy(ch.homeQuat).multiply(qTmp);

            // Chunks break down and merge into the runout debris blanket
            const shrink = t > 0.55 ? 1 - (t - 0.55) / 0.45 : 1.0;
            ch.mesh.scale.copy(ch.baseScale).multiplyScalar(Math.max(0.0001, shrink));
          }
        } else if (state.hasDebrisBlanket) {
          // Gradually reform upper snow pack after avalanche settles so slope is ready and natural
          ch.mesh.position.copy(ch.homePos);
          ch.mesh.quaternion.copy(ch.homeQuat);
          ch.mesh.scale.copy(ch.baseScale);
        }
      }

      // Hundreds of Instanced Tumbling Snowballs
      if (state.avalancheActive) {
        for (let i = 0; i < SNOWBALL_COUNT; i++) {
          const sb = snowballData[i];
          const localP = (avaProgress - sb.delay) / sb.duration;
          if (localP > 0 && localP < 1) {
            const ease = localP < 0.72
              ? 1.35 * localP * localP
              : 1 - Math.pow(1 - localP, 2.2) * 0.3;
            const cEase = THREE.MathUtils.clamp(ease, 0, 1);
            const z = THREE.MathUtils.lerp(sb.startZ, sb.stopZ, cEase);
            const x = sb.startX + sb.spreadX * cEase + Math.sin(localP * 10 + sb.phase) * 0.09;
            const bounce = Math.abs(Math.sin(localP * sb.bounceFreq + sb.phase)) * sb.bounceAmp * (1 - localP * 0.75);
            const y = getSlopeHeight(x, z) + 0.08 + bounce;

            const env = Math.sin(localP * Math.PI);
            const s = sb.radiusScale * Math.min(1.0, env * 2.2);

            dummyObj.position.set(x, y, z);
            dummyObj.rotation.set(localP * 18 + sb.phase, localP * 12, 0);
            dummyObj.scale.setScalar(Math.max(0.0001, s));
          } else {
            dummyObj.position.set(0, -50, 0);
            dummyObj.scale.setScalar(0.0001);
          }
          dummyObj.updateMatrix();
          snowballInst.setMatrixAt(i, dummyObj.matrix);
        }
        snowballInst.instanceMatrix.needsUpdate = true;
      } else {
        // Ensure hidden when idle
        for (let i = 0; i < SNOWBALL_COUNT; i++) {
          dummyObj.position.set(0, -50, 0);
          dummyObj.scale.setScalar(0.0001);
          dummyObj.updateMatrix();
          snowballInst.setMatrixAt(i, dummyObj.matrix);
        }
        snowballInst.instanceMatrix.needsUpdate = true;
      }

      // Billowing Rolling Powder Cloud & Spray Front (clamped below y = 6.3 to protect header)
      if (state.avalancheActive) {
        for (let i = 0; i < POWDER_COUNT; i++) {
          const pw = powderData[i];
          const totalDur = pw.travelDuration + pw.dissipateDuration;
          const localT = avaProgress - pw.delay;
          if (localT > 0 && localT < totalDur) {
            const moveP = THREE.MathUtils.clamp(localT / pw.travelDuration, 0, 1);
            const easeMove = 1 - Math.pow(1 - moveP, 1.85);
            const z = THREE.MathUtils.lerp(pw.startZ, pw.endZ, easeMove);
            const x = pw.startX + pw.spreadX * easeMove + Math.sin(localT * pw.turbulence + pw.phase) * 0.16;

            const billowLift = Math.sin(moveP * Math.PI) * pw.maxLift +
              (localT > pw.travelDuration ? (localT - pw.travelDuration) * 0.85 : 0);
            const rawY = getSlopeHeight(x, z) + 0.16 + billowLift;
            const y = Math.min(6.15, rawY); // Keep powder cloud strictly within diorama headroom

            let scaleEnv = 1.0;
            if (localT < 0.07) {
              scaleEnv = localT / 0.07;
            } else if (localT > pw.travelDuration) {
              const dissP = (localT - pw.travelDuration) / pw.dissipateDuration;
              scaleEnv = Math.max(0, 1 - dissP * dissP);
            }

            const s = pw.maxScale * scaleEnv * (0.65 + 0.55 * moveP);
            dummyObj.position.set(x, y, z);
            dummyObj.rotation.set(
              localT * pw.turbulence + pw.phase,
              localT * 3.2,
              pw.phase
            );
            dummyObj.scale.set(
              Math.max(0.0001, s * 1.18),
              Math.max(0.0001, s * 0.88),
              Math.max(0.0001, s * 1.12)
            );
          } else {
            dummyObj.position.set(0, -50, 0);
            dummyObj.scale.setScalar(0.0001);
          }
          dummyObj.updateMatrix();
          powderInst.setMatrixAt(i, dummyObj.matrix);
        }
        powderInst.instanceMatrix.needsUpdate = true;
      } else {
        for (let i = 0; i < POWDER_COUNT; i++) {
          dummyObj.position.set(0, -50, 0);
          dummyObj.scale.setScalar(0.0001);
          dummyObj.updateMatrix();
          powderInst.setMatrixAt(i, dummyObj.matrix);
        }
        powderInst.instanceMatrix.needsUpdate = true;
      }

      // Runout Uneven Debris Blanket & Boulder Dusting
      for (let i = 0; i < debrisMounds.length; i++) {
        const dm = debrisMounds[i];
        let factor = 0;
        if (state.avalancheActive) {
          if (avaProgress < 0.12 && state.resetTransitionStart > 0) {
            // Quick clean reset wipe before new avalanche wave arrives
            factor = Math.max(0, 1 - avaProgress / 0.1);
          } else if (avaProgress >= dm.appearDelay) {
            const growP = THREE.MathUtils.clamp((avaProgress - dm.appearDelay) / 0.22, 0, 1);
            factor = growP * growP * (3 - 2 * growP);
          }
        } else if (state.hasDebrisBlanket) {
          factor = 1.0;
        }
        const s = Math.max(0.0001, factor);
        dm.mesh.scale.set(
          dm.targetScale.x * s,
          dm.targetScale.y * s,
          dm.targetScale.z * s
        );
      }

      for (let i = 0; i < boulders.length; i++) {
        const b = boulders[i];
        let dustBoost = 0;
        if (state.avalancheActive) {
          const hitP = 0.18 + ((b.z + 1.0) / 4.5) * 0.22;
          if (avaProgress > hitP) {
            dustBoost = THREE.MathUtils.clamp((avaProgress - hitP) / 0.18, 0, 1) * 0.34;
          }
        } else if (state.hasDebrisBlanket) {
          dustBoost = 0.34;
        }
        const cs = b.baseCapScale + dustBoost;
        b.capMesh.scale.set(cs * 1.12, cs * 0.95, cs * 1.08);
      }

      // 4. INTERACTION 2 & AVALANCHE BUFFETING: Pines Sway, Wobble & Shed Branch Snow
      let pineTapProgress = -1;
      if (state.pineShakeActive) {
        const pElapsed = now - state.pineShakeStartTime;
        if (pElapsed <= PINE_SHAKE_DURATION) {
          pineTapProgress = pElapsed / PINE_SHAKE_DURATION;
        } else {
          state.pineShakeActive = false;
        }
      }

      for (let i = 0; i < pines.length; i++) {
        const p = pines[i];
        // Gentle idle wind sway
        let rotX = Math.sin(now * 1.5 + p.phase) * 0.028;
        let rotZ = Math.cos(now * 1.2 + p.phase) * 0.024;
        let capScaleFactor = 1.0;

        // Avalanche wave hitting lower slope pines
        if (state.avalancheActive) {
          const waveArrival = 0.22 + ((p.z - 1.2) / 2.5) * 0.18;
          if (avaProgress > waveArrival && avaProgress < waveArrival + 0.45) {
            const wP = (avaProgress - waveArrival) / 0.45;
            const env = Math.pow(1 - wP, 1.8);
            const strength = p.inAvalanchePath ? 0.42 : 0.24;
            rotX += (Math.sin(wP * 28 + p.phase) * 0.65 + 0.55) * strength * env;
            rotZ += Math.cos(wP * 24 + p.phase) * strength * 0.6 * env;
          }
          if (avaProgress > waveArrival) {
            // Shed branch snow during avalanche hit, then softly restore toward end of 8s cycle
            const shedT = (avaProgress - waveArrival) / (1 - waveArrival);
            if (shedT < 0.65) {
              capScaleFactor = Math.max(0.18, 1 - (shedT / 0.18) * 0.82);
            } else {
              const regrow = (shedT - 0.65) / 0.35;
              capScaleFactor = 0.18 + 0.82 * (regrow * regrow * (3 - 2 * regrow));
            }
          }
        }

        // Direct tap on pine cluster
        if (state.pineShakeActive && pineTapProgress >= 0) {
          const damp = Math.exp(-pineTapProgress * 4.2);
          rotX += Math.sin(pineTapProgress * 32 + p.phase) * 0.32 * damp;
          rotZ += Math.cos(pineTapProgress * 28 + p.phase) * 0.28 * damp;

          // Shed snow puff then cleanly restore baseline
          if (pineTapProgress < 0.15) {
            capScaleFactor = Math.min(capScaleFactor, 1 - (pineTapProgress / 0.15) * 0.78);
          } else if (pineTapProgress < 0.55) {
            capScaleFactor = Math.min(capScaleFactor, 0.22);
          } else {
            const restoreP = (pineTapProgress - 0.55) / 0.45;
            const smoothRestore = restoreP * restoreP * (3 - 2 * restoreP);
            capScaleFactor = Math.min(capScaleFactor, 0.22 + 0.78 * smoothRestore);
          }
        }

        p.pivot.rotation.set(rotX, 0, rotZ);
        for (let c = 0; c < p.snowCaps.length; c++) {
          const sc = p.snowCaps[c];
          sc.mesh.scale.setScalar(sc.baseScale * capScaleFactor);
        }
      }

      // Dislodged Pine Branch Snow Spray (triggered either by tapping pines or when avalanche wave hits pines)
      let sprayActiveTime = -1;
      if (state.pineShakeActive) {
        sprayActiveTime = (now - state.pineShakeStartTime) / 1.45;
      } else if (state.avalancheActive && avaProgress > 0.23 && avaProgress < 0.52) {
        sprayActiveTime = (avaProgress - 0.23) / 0.22;
      }

      if (sprayActiveTime >= 0 && sprayActiveTime <= 1.2) {
        for (let i = 0; i < PINE_SPRAY_COUNT; i++) {
          const ps = pineSprayData[i];
          const t = sprayActiveTime - ps.delay;
          if (t > 0 && t < 0.95) {
            const x = ps.ox + ps.vx * t;
            const z = ps.oz + ps.vz * t;
            const groundY = getSlopeHeight(x, z) + 0.03;
            const y = Math.max(groundY, ps.oy + ps.vy * t - 2.6 * t * t);
            const fade = 1 - t / 0.95;
            dummyObj.position.set(x, y, z);
            dummyObj.rotation.set(t * 10, t * 8, i);
            dummyObj.scale.setScalar(Math.max(0.0001, ps.scale * fade));
          } else {
            dummyObj.position.set(0, -50, 0);
            dummyObj.scale.setScalar(0.0001);
          }
          dummyObj.updateMatrix();
          pineSprayInst.setMatrixAt(i, dummyObj.matrix);
        }
        pineSprayInst.instanceMatrix.needsUpdate = true;
      } else {
        for (let i = 0; i < PINE_SPRAY_COUNT; i++) {
          dummyObj.position.set(0, -50, 0);
          dummyObj.scale.setScalar(0.0001);
          dummyObj.updateMatrix();
          pineSprayInst.setMatrixAt(i, dummyObj.matrix);
        }
        pineSprayInst.instanceMatrix.needsUpdate = true;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const nowMs = performance.now();
      updateScene(nowMs);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
