function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function pickFov() {

  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);

}

sun.shadow.mapSize.set(1024, 1024);

sun.shadow.camera.top = 11; sun.shadow.camera.bottom = -11;

// ---------- islands ----------
function makeIsland(r, topH, depth) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.96, topH, 24), M.grass);
  top.position.y = -topH / 2; top.receiveShadow = true; top.castShadow = true;
  g.add(top);
  const under = new THREE.Mesh(new THREE.ConeGeometry(r * 0.97, depth, 20), M.rock);
  under.rotation.x = Math.PI; under.position.y = -topH - depth / 2; under.castShadow = true;
  g.add(under);
  // rocky bumps on the underside
  for (let i = 0; i < 5; i++) {
    const a = rand() * Math.PI * 2, rr = r * (0.35 + rand() * 0.4);
    const chunk = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16 + rand() * 0.2, 0), M.rockDark);
    chunk.position.set(Math.cos(a) * rr, -topH - depth * (0.25 + rand() * 0.35), Math.sin(a) * rr);
    chunk.castShadow = true; g.add(chunk);
  }
  // grass rim tufts
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + rand() * 0.4;
    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.12 + rand() * 0.08, 8, 6), M.grass2);
    tuft.scale.y = 0.6;
    tuft.position.set(Math.cos(a) * r * 0.92, 0.02, Math.sin(a) * r * 0.92);
    g.add(tuft);
  }
  return g;
}

const mainIsland = makeIsland(3.0, 0.5, 2.2);

// ---------- houses ----------
function makeHouse(w, h, d, roofMat, wallMat) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  body.position.y = h / 2; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.hypot(w, d) * 0.62, h * 0.75, 4), roofMat);
  roof.position.y = h + h * 0.36; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
  g.add(roof);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.28, h * 0.3), M.win);
  win.position.set(w * 0.18, h * 0.55, d / 2 + 0.005);
  g.add(win);
  const win2 = win.clone(); win2.position.x = -w * 0.18; g.add(win2);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.24, h * 0.26), M.win);
  side.position.set(w / 2 + 0.005, h * 0.55, 0); side.rotation.y = Math.PI / 2;
  g.add(side);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.24, h * 0.42), M.woodDark);
  door.position.set(0, h * 0.21, d / 2 + 0.005);
  g.add(door);
  const chim = new THREE.Mesh(new THREE.BoxGeometry(w * 0.14, h * 0.5, w * 0.14), M.rockDark);
  chim.position.set(w * 0.28, h + h * 0.4, -d * 0.15); chim.castShadow = true;
  g.add(chim);
  return { g, chimTop: new THREE.Vector3(w * 0.28, h + h * 0.68, -d * 0.15) };
}

const chimneys = [];
function placeHouse(island, x, z, rot, s, roofMat, wallMat) {
  const h = makeHouse(0.62, 0.55, 0.55, roofMat, wallMat);
  h.g.scale.setScalar(s);
  h.g.position.set(x, 0, z); h.g.rotation.y = rot;
  island.add(h.g);
  const wp = h.chimTop.clone().multiplyScalar(s).applyAxisAngle(new THREE.Vector3(0,1,0), rot);
  wp.add(island.position);
  chimneys.push(wp);
}
placeHouse(mainIsland, -1.4, 0.6, 0.5, 1.0, M.roofT, M.wall);
placeHouse(mainIsland, -0.2, 1.35, -0.25, 0.9, M.roofB, M.wall2);

// ---------- trees ----------
function makeTree(s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.28, 6), M.woodDark);
  trunk.position.y = 0.14; trunk.castShadow = true; g.add(trunk);

  c2.position.y = 0.78; c2.castShadow = true; g.add(c2);
  g.scale.setScalar(s);
  return g;
}
function putTree(island, s, x, z) { const t = makeTree(s); t.position.set(x, 0, z); island.add(t); }

// ---------- rope bridges ----------
function makeBridge(from, to, sag) {
  const g = new THREE.Group();
  const dir = to.clone().sub(from);
  const len = dir.length();
  const N = 9;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const p = from.clone().addScaledVector(dir, t);
    p.y -= Math.sin(t * Math.PI) * sag;
    pts.push(p);
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.025, 5), M.rope));
  const up = new THREE.Vector3(0, 0.22, 0);
  const c2 = new THREE.CatmullRomCurve3(pts.map(p => p.clone().add(up)));
  const c3 = new THREE.CatmullRomCurve3(pts.map(p => p.clone().add(up)));
  const side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize().multiplyScalar(0.18);
  const rail1 = new THREE.Mesh(new THREE.TubeGeometry(c2, 16, 0.018, 5), M.rope);
  rail1.position.copy(side); g.add(rail1);
  const rail2 = new THREE.Mesh(new THREE.TubeGeometry(c3, 16, 0.018, 5), M.rope);
  rail2.position.copy(side.clone().negate()); g.add(rail2);
  for (let i = 1; i < N; i++) {
    const t = i / N;
    const p = curve.getPoint(t);
    const plank = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.035, len / N * 0.8), M.wood);
    plank.position.copy(p);
    plank.lookAt(p.clone().add(dir));
    plank.rotateY(Math.PI / 2);
    plank.castShadow = true;
    g.add(plank);
  }
  return g;
}
scene.add(makeBridge(new THREE.Vector3(-2.9, 0.05, -0.8), new THREE.Vector3(-3.6, 0.8, -1.4), 0.35));
scene.add(makeBridge(new THREE.Vector3(2.9, 0.02, -1.1), new THREE.Vector3(3.5, -0.45, -1.9), 0.3));

// ---------- hot air balloon ----------
const balloon = new THREE.Group();
{
  const env = new THREE.Group();

  for (let i = 0; i < nSeg; i++) {

      new THREE.SphereGeometry(0.62, 8, 12, (i / nSeg) * Math.PI * 2, (Math.PI * 2) / nSeg, 0, Math.PI * 0.82),

}

// ---------- fitCamera ----------
const fitBox = new THREE.Box3(
  new THREE.Vector3(-6.4, -2.6, -4.4),
  new THREE.Vector3(6.4, 3.6, 3.6));
const fitDir = new THREE.Vector3(0.36, 0.42, 1).normalize();
function fitCamera() {
  const center = fitBox.getCenter(new THREE.Vector3());
  const corners = [];
  for (const x of [fitBox.min.x, fitBox.max.x])
    for (const y of [fitBox.min.y, fitBox.max.y])
      for (const z of [fitBox.min.z, fitBox.max.z])
        corners.push(new THREE.Vector3(x, y, z));
  const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 240);
  probe.position.copy(center).addScaledVector(fitDir, 0.001); probe.lookAt(center); probe.updateMatrixWorld();
  const inv = probe.matrixWorldInverse;
  let need = 0;
  for (const c of corners) {
    const v = c.clone().applyMatrix4(inv);
    const d = Math.max(
      Math.abs(v.y) / Math.tan(THREE.MathUtils.degToRad(probe.fov / 2)),
      Math.abs(v.x) / (Math.tan(THREE.MathUtils.degToRad(probe.fov / 2)) * probe.aspect));
    need = Math.max(need, d + v.z * -1 * 0 + Math.abs(v.z));
  }
  const dist = need * 1.1 + 0.2;
  camera.position.copy(center).addScaledVector(fitDir, dist);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.target.y += -0.35; camera.position.y += -0.35;
  camera.lookAt(controls.target);
  controls.update();
}
fitCamera();

// ---------- hints / interaction ----------
const hintIdle = 'Launch the balloon';
const hintUp = 'Up she goes';
let hintOwner = null;
function setHint(text, owner) {
  if (owner) hintOwner = owner;
  hintEl.textContent = text;
  hintEl.classList.remove('faded');
}
function resetHintIf(owner) {
  if (hintOwner === owner) { hintOwner = null; setHint(hintIdle, null); }
}
setHint(hintIdle, null);
setTimeout(() => hintEl.classList.add('faded'), 6000);

let launchT = -1; // performance.now() seconds at launch
const FLIGHT = 8.0;

const ray = new THREE.Raycaster();
function onTap(e) {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(new THREE.Vector2(x, y), camera);
  if (launchT < 0 && ray.intersectObject(balloonProxy, false).length) {
    launchT = performance.now() / 1000;
    setHint(hintUp, 'user');
  }
}
renderer.domElement.addEventListener('pointerdown', onTap);

// ---------- resize ----------
addEventListener('resize', () => {
  pickFov();
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
function smooth(t) { return t * t * (3 - 2 * t); }
const ndc = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.3);
  const now = performance.now() / 1000;

  // windmill
  millHub.rotation.z += dt * 1.1;

  // balloon flight: closed loop, wall-clock, ends exactly at dock
  if (launchT >= 0) {
    const p = (now - launchT) / FLIGHT;
    if (p >= 1) {
      balloon.position.copy(BALLOON_DOCK);
      launchT = -1;
      resetHintIf('user');
    } else {
      const q = smooth(Math.min(p * 1.15, 1)); // ease in fast, settle back smooth
      const w = Math.sin(Math.PI * q);
      balloon.position.set(
        BALLOON_DOCK.x + Math.sin(q * Math.PI * 2) * 2.6,
        BALLOON_DOCK.y + w * 2.6,
        BALLOON_DOCK.z + Math.sin(q * Math.PI * 2) * 1.1 - w * 0.6);
      balloon.rotation.y = q * Math.PI * 2;
    }
    balloonProxy.position.copy(balloon.position);
  } else {
    balloon.position.y = BALLOON_DOCK.y + Math.sin(now * 1.4) * 0.05;
    balloon.rotation.y = Math.sin(now * 0.5) * 0.08;
    balloonProxy.position.copy(balloon.position);
  }

  // cloud sea bobbing
  let ci = 0;
  for (const p of cloudSea.children) {
    p.position.y += Math.sin(now * 0.6 + ci * 1.3) * 0.0012;
    ci++;
  }

  // drifting clouds + title-band dim
  for (const d of drifters) {
    d.g.position.x += dt * d.speed;
    if (d.g.position.x > 14) d.g.position.x = -14;
    d.g.position.y = d.baseY + Math.sin(now * 0.4 + d.baseY) * 0.15;
    ndc.copy(d.g.position).project(camera);
    const inBand = ndc.y > 0.45 && Math.abs(ndc.x) < 0.62 && ndc.z < 1;
    for (const s of d.g.children) s.material.opacity += ((inBand ? 0.18 : 0.92) - s.material.opacity) * Math.min(dt * 4, 1);
  }

  // birds
  for (const b of birds) {
    const a = now * b.sp + b.ph;
    b.g.position.set(Math.cos(a) * b.r, b.h + Math.sin(now * 0.7 + b.ph) * 0.3, Math.sin(a) * b.r * 0.75);
    b.g.rotation.y = -a;
    const flap = Math.sin(now * 7 + b.ph) * 0.45;
    b.w1.rotation.z = 0.35 + flap;
    b.w2.rotation.z = -0.35 - flap;
  }

  // chimney smoke (wall-clock loops)
  for (const s of smokes) {
    for (let i = 0; i < 3; i++) {
      const t = ((now * 0.22 + s.ph + i / 3) % 1);
      const p = s.puffs[i];
      p.position.set(s.c.x + t * 0.35, s.c.y + t * 1.0, s.c.z + t * 0.1);
      const sc = 0.5 + t * 1.4;
      p.scale.setScalar(sc);
      p.material.opacity = 0.5 * (1 - t);
    }
  }

  // flag ripple
  const pos = flag.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const fx = pos.getX(i);
    pos.setZ(i, Math.sin(fx * 8 + now * 5) * 0.05 * (fx + 0.17));
  }
  pos.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
