<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monsoon street — a tiny world</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1f2e47;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f4f7fb;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: radial-gradient(circle at 50% 40%, #44628c 0%, #263a59 62%, #172338 100%);
    transition: filter 0.08s ease;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }
  #ui-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 14px 16px 10px;
    text-align: center;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(16,25,40,0.86) 0%, rgba(16,25,40,0.48) 68%, rgba(16,25,40,0) 100%);
  }
  .title {
    font-size: clamp(19px, 4.5vw, 24px);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    line-height: 1.15;
  }
  .subtitle {
    font-size: clamp(11px, 2.8vw, 13px);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #ffd175;
    margin-top: 2px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.65);
  }
  .hint {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: clamp(11px, 2.8vw, 12.5px);
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #e6eef8;
    background: rgba(24, 36, 56, 0.78);
    border: 1px solid rgba(255, 212, 128, 0.28);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  #ui-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 10px 16px 14px;
    text-align: center;
    pointer-events: none;
    background: linear-gradient(to top, rgba(16,25,40,0.85) 0%, rgba(16,25,40,0.4) 65%, rgba(16,25,40,0) 100%);
  }

    font-size: clamp(10.5px, 2.5vw, 12px);
    font-weight: 600;
    letter-spacing: 0.18em;

    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  #fallback {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    align-items: center;

    background: #1f2e47;
    color: #f4f7fb;
    font-size: 14px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <header id="ui-header">
    <h1 class="title">Monsoon street</h1>
    <div class="subtitle">a tiny world</div>
    <div class="hint">tap the sky for thunder - tap the boat to sail</div>
  </header>

  <div id="canvas-container"></div>

  <footer id="ui-footer">
    <div class="footer-text">A tiny world</div>
  </footer>

  <div id="fallback">WebGL context is unavailable or paused. Reload to restore the miniature.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Seeded mulberry32 RNG
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260412);
const randRange = (min, max) => min + rng() * (max - min);

const container = document.getElementById('canvas-container');
const headerEl = document.getElementById('ui-header');
const footerEl = document.getElementById('ui-footer');
const fallbackEl = document.getElementById('fallback');

let renderer, scene, camera, controls;
let isTabHidden = false;
let contextLost = false;

try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.42;
  container.appendChild(renderer.domElement);
} catch (err) {
  fallbackEl.style.display = 'flex';
  throw err;
}

renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  contextLost = true;
}, false);

renderer.domElement.addEventListener('webglcontextrestored', () => {
  contextLost = false;
  fitCameraToDiorama();
}, false);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 120);
camera.position.set(11.8, 9.2, 13.8);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.14;
controls.maxPolarAngle = Math.PI * 0.45;
controls.minAzimuthAngle = -Math.PI * 0.38;
controls.maxAzimuthAngle = Math.PI * 0.38;
controls.target.set(0, 2.8, 0.2);

// Root group for diorama
const world = new THREE.Group();
scene.add(world);

// Bounding points for exact viewport framing inside safe band
const framingPoints = [
  new THREE.Vector3(-4.1, -0.75, -3.5),
  new THREE.Vector3( 4.1, -0.75, -3.5),
  new THREE.Vector3(-4.1, -0.75,  3.5),
  new THREE.Vector3( 4.1, -0.75,  3.5),
  new THREE.Vector3(-3.9,  7.55, -2.8),
  new THREE.Vector3( 3.9,  7.55, -2.8),
  new THREE.Vector3(-3.9,  7.55,  2.8),
  new THREE.Vector3( 3.9,  7.55,  2.8),
  new THREE.Vector3( 0.0,  7.75,  0.0),
  new THREE.Vector3( 0.0, -0.80,  3.6)
];

// Procedural Canvas Textures
function createStripedAwningTexture(colorA, colorB) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const stripes = 8;
  const w = c.width / stripes;
  for (let i = 0; i < stripes; i++) {
    ctx.fillStyle = i % 2 === 0 ? colorA : colorB;
    ctx.fillRect(i * w, 0, w + 1, c.height);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, c.height - 28, c.width, 28);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

function createWindowGlowTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64, 72, 8, 64, 64, 74);
  grad.addColorStop(0, '#fff7dc');
  grad.addColorStop(0.55, '#ffc25c');
  grad.addColorStop(1, '#d97a1c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createPuddleReflectionTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2c4a70';
  ctx.fillRect(0, 0, 256, 256);

  const g1 = ctx.createRadialGradient(142, 112, 8, 142, 112, 105);
  g1.addColorStop(0, 'rgba(255, 232, 155, 0.96)');
  g1.addColorStop(0.42, 'rgba(255, 182, 82, 0.65)');
  g1.addColorStop(1, 'rgba(44, 74, 112, 0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, 256, 256);

  const g2 = ctx.createRadialGradient(82, 142, 6, 82, 142, 85);
  g2.addColorStop(0, 'rgba(165, 220, 255, 0.72)');
  g2.addColorStop(0.55, 'rgba(95, 165, 235, 0.38)');
  g2.addColorStop(1, 'rgba(44, 74, 112, 0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, 256, 256);

  const g3 = ctx.createRadialGradient(178, 155, 4, 178, 155, 58);
  g3.addColorStop(0, 'rgba(255, 110, 95, 0.58)');
  g3.addColorStop(1, 'rgba(44, 74, 112, 0)');
  ctx.fillStyle = g3;
  ctx.fillRect(0, 0, 256, 256);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const windowTex = createWindowGlowTexture();
const puddleTex = createPuddleReflectionTexture();
const awningTexTeal = createStripedAwningTexture('#e85a47', '#fff4e4');
const awningTexTerra = createStripedAwningTexture('#1b8a7a', '#fff4e4');
const awningTexCorner = createStripedAwningTexture('#f2a93b', '#fff5e6');

// Shared Materials (Lifted wet slate & cobble tones for luminous monsoon dusk)
const matSlabOuter = new THREE.MeshStandardMaterial({ color: 0x304057, roughness: 0.70, metalness: 0.08 });
const matSlabTrim = new THREE.MeshStandardMaterial({ color: 0x485f7d, roughness: 0.50, metalness: 0.12 });
const matRoad = new THREE.MeshStandardMaterial({
  color: 0x3b4f6b,
  emissive: 0x1a2738,
  emissiveIntensity: 0.35,
  roughness: 0.22,
  metalness: 0.22
});
const matSidewalk = new THREE.MeshStandardMaterial({ color: 0x5c718c, roughness: 0.38, metalness: 0.08 });
const matCurb = new THREE.MeshStandardMaterial({ color: 0x738aa8, roughness: 0.35, metalness: 0.08 });

const matTealWall = new THREE.MeshStandardMaterial({ color: 0x2b8794, roughness: 0.50, metalness: 0.05 });
const matTerracottaWall = new THREE.MeshStandardMaterial({ color: 0xdc6d4e, roughness: 0.52, metalness: 0.05 });
const matOchreWall = new THREE.MeshStandardMaterial({ color: 0xe6a850, roughness: 0.52, metalness: 0.05 });
const matCreamTrim = new THREE.MeshStandardMaterial({ color: 0xf4eadb, roughness: 0.46, metalness: 0.05 });
const matDarkRoof = new THREE.MeshStandardMaterial({ color: 0x324359, roughness: 0.42, metalness: 0.15 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x69412b, roughness: 0.58, metalness: 0.05 });
const matIron = new THREE.MeshStandardMaterial({ color: 0x263140, roughness: 0.35, metalness: 0.65 });
const matCopper = new THREE.MeshStandardMaterial({ color: 0x4d8f80, roughness: 0.40, metalness: 0.35 });

// Flicker-reactive emissive materials
const matWindowGlow = new THREE.MeshStandardMaterial({
  color: 0xffdf9e,
  map: windowTex,
  emissive: 0xff9d2e,
  emissiveMap: windowTex,
  emissiveIntensity: 1.85,
  roughness: 0.2
});

const matShopWindowGlow = new THREE.MeshStandardMaterial({
  color: 0xfff0c4,
  map: windowTex,
  emissive: 0xffaa3b,
  emissiveMap: windowTex,
  emissiveIntensity: 2.2,
  roughness: 0.15
});

const matLampGlass = new THREE.MeshStandardMaterial({
  color: 0xfff6d6,
  emissive: 0xffae38,
  emissiveIntensity: 3.1,
  roughness: 0.1
});

const matStringBulb = new THREE.MeshStandardMaterial({
  color: 0xfff3c4,
  emissive: 0xffa834,
  emissiveIntensity: 2.7,
  roughness: 0.15
});

const matPuddle = new THREE.MeshStandardMaterial({
  color: 0x8cc8ff,
  map: puddleTex,
  emissive: 0x628ec2,
  emissiveMap: puddleTex,
  emissiveIntensity: 1.35,
  roughness: 0.04,
  metalness: 0.72,
  transparent: true,
  opacity: 0.95
});

// Helper: beveled box mesh
function makeBox(w, h, d, mat, x = 0, y = 0, z = 0, cast = true, receive = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

// 1. Lighting Setup (Luminous monsoon dusk: gentle soft cool sky fill + warm amber shop/lamp glow)
const ambientSky = new THREE.AmbientLight(0x88b4e8, 0.78);
scene.add(ambientSky);

const hemiLight = new THREE.HemisphereLight(0xaad2ff, 0x526b8a, 2.35);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xb4d6ff, 2.15);
dirLight.position.set(7.5, 13.5, 8.5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 2;
dirLight.shadow.camera.far = 30;
const dCam = 6.2;
dirLight.shadow.camera.left = -dCam;
dirLight.shadow.camera.right = dCam;
dirLight.shadow.camera.top = dCam;
dirLight.shadow.camera.bottom = -dCam;
dirLight.shadow.bias = -0.0008;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xffd29c, 1.15);
fillLight.position.set(-7, 6, 6);
scene.add(fillLight);

// Dedicated cool overhead sky bounce so wet cobbles and puddles shimmer clearly
const streetSkyBounce = new THREE.DirectionalLight(0x95c4ff, 0.95);
streetSkyBounce.position.set(0, 10, 9);
scene.add(streetSkyBounce);

const streetLampLight = new THREE.PointLight(0xffaa3b, 5.8, 12.5, 1.3);
streetLampLight.position.set(1.25, 2.75, 0.25);
streetLampLight.castShadow = true;
streetLampLight.shadow.bias = -0.001;
world.add(streetLampLight);

const shopWarmLight = new THREE.PointLight(0xff9e3d, 4.2, 10.5, 1.35);
shopWarmLight.position.set(-1.2, 1.45, -0.20);
world.add(shopWarmLight);

const cornerWarmLight = new THREE.PointLight(0xffb454, 3.4, 9.5, 1.35);
cornerWarmLight.position.set(2.2, 1.5, 0.25);
world.add(cornerWarmLight);

// Warm street-level bounce light over main puddle & wet cobbles
const puddleWarmBounce = new THREE.PointLight(0xffb84d, 2.6, 7.5, 1.3);
puddleWarmBounce.position.set(0.1, 0.95, 1.08);
world.add(puddleWarmBounce);

// Lightning Flash Light (Controlled intensity so buildings keep their rich colors)
const lightningLight = new THREE.DirectionalLight(0xc8e4ff, 0);
lightningLight.position.set(-2, 14, 5);
scene.add(lightningLight);

// 2. Sculptural Diorama Slab & Wet Cobblestone Street
const slabGroup = new THREE.Group();
world.add(slabGroup);

// Tiered diorama base
slabGroup.add(makeBox(8.0, 0.56, 6.6, matSlabOuter, 0, -0.38, 0, false, true));
slabGroup.add(makeBox(8.22, 0.16, 6.82, matSlabTrim, 0, -0.08, 0, false, true));
slabGroup.add(makeBox(7.84, 0.14, 6.44, matRoad, 0, 0.0, 0, false, true));

// Brass plaque on front of slab
const matBrass = new THREE.MeshStandardMaterial({ color: 0xe6b35a, roughness: 0.3, metalness: 0.7, emissive: 0x4a3210, emissiveIntensity: 0.35 });
slabGroup.add(makeBox(1.5, 0.22, 0.08, matBrass, 0, -0.32, 3.32, false, false));

// Rear sidewalk (where row buildings stand)
slabGroup.add(makeBox(7.82, 0.18, 2.65, matSidewalk, 0, 0.11, -1.88, true, true));
slabGroup.add(makeBox(7.84, 0.2, 0.14, matCurb, 0, 0.11, -0.54, true, true));

// Front right corner sidewalk
slabGroup.add(makeBox(7.82, 0.16, 0.85, matSidewalk, 0, 0.10, 2.78, true, true));
slabGroup.add(makeBox(7.84, 0.18, 0.14, matCurb, 0, 0.10, 2.34, true, true));

// Sidewalk stone tiles
for (let ix = -3.6; ix <= 3.6; ix += 0.6) {
  slabGroup.add(makeBox(0.54, 0.02, 0.72, matCurb, ix, 0.205, -0.18, false, true));
  slabGroup.add(makeBox(0.54, 0.02, 0.68, matCurb, ix, 0.185, 2.76, false, true));
}

// Drain grate near curb
const matGrate = new THREE.MeshStandardMaterial({ color: 0x18202c, roughness: 0.4, metalness: 0.8 });
slabGroup.add(makeBox(0.55, 0.02, 0.32, matGrate, -2.1, 0.075, -0.25, false, true));

// Wet Cobblestones (InstancedMesh with glossy wet sheen and warm reflected light)
const cobbleCols = 23;
const cobbleRows = 9;
const cobbleGeo = new THREE.BoxGeometry(0.28, 0.045, 0.21);
const matCobble = new THREE.MeshStandardMaterial({
  color: 0x526b8c,
  emissive: 0x24344a,
  emissiveIntensity: 0.38,
  roughness: 0.18,
  metalness: 0.32
});
const cobbleInst = new THREE.InstancedMesh(cobbleGeo, matCobble, cobbleCols * cobbleRows);
cobbleInst.receiveShadow = true;
const dummy = new THREE.Object3D();
const cColor = new THREE.Color();
let cIdx = 0;

for (let r = 0; r < cobbleRows; r++) {
  const z = -0.25 + r * 0.29;
  for (let c = 0; c < cobbleCols; c++) {
    const stagger = (r % 2) * 0.15;
    const x = -3.45 + c * 0.31 + stagger;
    // Skip deep interior of the expanded main puddle and left puddle so puddles read as glassy mirror basins
    const inMainPuddle = ((x - 0.05) * (x - 0.05)) / (2.32 * 2.32) + ((z - 1.06) * (z - 1.06)) / (1.06 * 1.06) < 0.84;
    const inLeftPuddle = ((x + 2.55) * (x + 2.55)) / (0.85 * 0.85) + ((z - 0.55) * (z - 0.55)) / (0.46 * 0.46) < 0.76;
    const y = (inMainPuddle || inLeftPuddle) ? 0.035 : 0.062 + randRange(-0.006, 0.01);
    dummy.position.set(x, y, z);
    dummy.rotation.set(randRange(-0.02, 0.02), randRange(-0.06, 0.06), randRange(-0.02, 0.02));
    dummy.scale.set(randRange(0.92, 1.08), 1, randRange(0.92, 1.08));
    dummy.updateMatrix();
    cobbleInst.setMatrixAt(cIdx, dummy.matrix);
    const shade = randRange(0.88, 1.22);
    cColor.setRGB(0.32 * shade, 0.42 * shade, 0.56 * shade);
    cobbleInst.setColorAt(cIdx, cColor);
    cIdx++;
  }
}
cobbleInst.instanceMatrix.needsUpdate = true;
if (cobbleInst.instanceColor) cobbleInst.instanceColor.needsUpdate = true;
slabGroup.add(cobbleInst);

// Subtle wet-street warm reflection streaks outside puddles so the whole street shimmers
const streetSheenGeo = new THREE.PlaneGeometry(6.8, 1.85);
streetSheenGeo.rotateX(-Math.PI / 2);
const matStreetSheen = new THREE.MeshBasicMaterial({
  map: puddleTex,
  transparent: true,
  opacity: 0.24,
  depthWrite: false
});
const streetSheen = new THREE.Mesh(streetSheenGeo, matStreetSheen);
streetSheen.position.set(0.1, 0.083, 0.92);
slabGroup.add(streetSheen);

// 3. Reflective Puddles & Animated Ripple Rings (Main Puddle Clearly Larger for 320px Readability)
const puddleGroup = new THREE.Group();
world.add(puddleGroup);

function createPuddle(x, z, rx, rz, rotY = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0.075, z);
  g.rotation.y = rotY;

  const geo = new THREE.CylinderGeometry(1, 1, 0.012, 48);
  geo.scale(rx, 1, rz);
  const mesh = new THREE.Mesh(geo, matPuddle);
  mesh.receiveShadow = true;
  g.add(mesh);

  // Luminous rim highlight for high readability at 320px
  const rimGeo = new THREE.RingGeometry(0.955, 1.01, 48);
  rimGeo.rotateX(-Math.PI / 2);
  rimGeo.scale(rx, 1, rz);
  const rimMat = new THREE.MeshBasicMaterial({ color: 0xbbe0ff, transparent: true, opacity: 0.58 });
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.position.y = 0.008;
  g.add(rim);

  // Reflected warm window glow patch inside puddle
  const glowGeo = new THREE.CircleGeometry(0.58, 32);
  glowGeo.rotateX(-Math.PI / 2);
  glowGeo.scale(rx * 0.76, 1, rz * 0.68);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffc864, transparent: true, opacity: 0.52 });
  const glowPatch = new THREE.Mesh(glowGeo, glowMat);
  glowPatch.position.set(0.06 * rx, 0.007, -0.06 * rz);
  g.add(glowPatch);

  puddleGroup.add(g);
  return { group: g, mesh, glowMat, x, z, rx, rz };
}

// Expanded main puddle (rx: 2.32, rz: 1.05) plus two companion puddles
const mainPuddle = createPuddle(0.05, 1.06, 2.32, 1.05, 0.03);
const leftPuddle = createPuddle(-2.62, 0.55, 0.86, 0.48, -0.12);
const rightPuddle = createPuddle(2.78, 1.52, 0.78, 0.44, 0.15);
const puddles = [mainPuddle, leftPuddle, rightPuddle];

// 4. Three Charming Row Buildings (Teal, Terracotta, Warm Ochre Corner)
const buildingsGroup = new THREE.Group();
world.add(buildingsGroup);

function addFramedWindow(parent, x, y, z, w, h, hasShutters = true, hasBox = false) {
  const wg = new THREE.Group();
  wg.position.set(x, y, z);

  // Outer cream frame
  wg.add(makeBox(w + 0.12, h + 0.12, 0.08, matCreamTrim, 0, 0, 0.01));
  // Glowing glass pane
  wg.add(makeBox(w, h, 0.06, matWindowGlow, 0, 0, 0.03, false, false));
  // Mullions
  wg.add(makeBox(w, 0.04, 0.08, matWood, 0, 0.05, 0.04, false, false));
  wg.add(makeBox(0.04, h, 0.08, matWood, 0, 0, 0.04, false, false));
  // Sill
  wg.add(makeBox(w + 0.2, 0.07, 0.16, matCreamTrim, 0, -h / 2 - 0.04, 0.05));

  if (hasShutters) {
    const sw = w * 0.34;
    wg.add(makeBox(sw, h + 0.04, 0.05, matWood, -w / 2 - sw / 2 - 0.04, 0, 0.04));
    wg.add(makeBox(sw, h + 0.04, 0.05, matWood,  w / 2 + sw / 2 + 0.04, 0, 0.04));
  }
  if (hasBox) {
    wg.add(makeBox(w + 0.08, 0.14, 0.16, matTerracottaWall, 0, -h / 2 - 0.11, 0.09));

function addStripedAwning(parent, x, y, z, width, depth, tex) {
  const ag = new THREE.Group();
  ag.position.set(x, y, z);

  const slope = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.07, depth),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 })
  );
  slope.rotation.x = 0.38;
  slope.castShadow = true;
  slope.receiveShadow = true;
  ag.add(slope);

  // Scalloped front valance
  const valY = -Math.sin(0.38) * (depth / 2) - 0.06;
  const valZ =  Math.cos(0.38) * (depth / 2);
  const valance = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.13, 0.05),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 })
  );
  valance.position.set(0, valY, valZ);
  ag.add(valance);

  // Iron side brackets
  for (const s of [-1, 1]) {
    const strut = makeBox(0.04, 0.04, depth * 0.9, matIron, s * (width * 0.46), -0.14, 0);
    strut.rotation.x = -0.15;
    ag.add(strut);
  }

  parent.add(ag);
}

for (let s = 0; s < stringLightCurves.length; s++) {

    const t = b / (cfg.bulbs + 1);

    const sock = new THREE.Mesh(socketGeo, matIron);
    sock.position.set(pt.x, pt.y - 0.03, pt.z);

    const bulb = new THREE.Mesh(bulbGeo, matStringBulb);
    bulb.position.set(pt.x, pt.y - 0.085, pt.z);

  stringStrands.push({ group: pivotGroup, phase: s * 1.4 });
}

  const cg = new THREE.Group();
  cg.position.set(cfg.x, cfg.y, cfg.z);
  cg.scale.setScalar(cfg.scale);

  const puffs = [
    [0, 0, 0, 1.25, 0.78, 1.0],
    [-0.68, -0.08, 0.12, 0.92, 0.68, 0.85],
    [ 0.72, -0.06, 0.08, 0.96, 0.70, 0.88],
    [-0.28, 0.28, -0.15, 0.88, 0.72, 0.82],
    [ 0.34, 0.24,  0.18, 0.82, 0.68, 0.78],
    [ 0.0, -0.14,  0.42, 0.95, 0.60, 0.75]
  ];
  for (const p of puffs) {
    const m = new THREE.Mesh(puffGeo, matCloud);
    m.position.set(p[0], p[1], p[2]);
    m.scale.set(p[3], p[4], p[5]);
    m.castShadow = true;
    cg.add(m);
  }
  cloudsGroup.add(cg);
  cloudClusters.push({ group: cg, baseX: cfg.x, baseY: cfg.y, speed: cfg.speed, phase: cfg.phase });
}

// Jagged Lightning Bolt Geometry (Crisp bright core + electric blue halo)
const boltGroup = new THREE.Group();
boltGroup.visible = false;
world.add(boltGroup);

const matBoltCore = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matBoltHalo = new THREE.MeshBasicMaterial({ color: 0x7ac5ff, transparent: true, opacity: 0.82 });
let boltCoreMesh = null;
let boltHaloMesh = null;
let boltBranchMesh = null;

// Ground strike impact ring
const strikeRingGeo = new THREE.RingGeometry(0.18, 0.62, 28);
strikeRingGeo.rotateX(-Math.PI / 2);
const matStrikeRing = new THREE.MeshBasicMaterial({ color: 0xdff2ff, transparent: true, opacity: 0.92, side: THREE.DoubleSide });
const strikeRingMesh = new THREE.Mesh(strikeRingGeo, matStrikeRing);
strikeRingMesh.position.set(-0.2, 0.11, 0.65);
boltGroup.add(strikeRingMesh);

function rebuildLightningBolt() {
  if (boltCoreMesh) {
    boltGroup.remove(boltCoreMesh);
    boltCoreMesh.geometry.dispose();
  }
  if (boltHaloMesh) {
    boltGroup.remove(boltHaloMesh);
    boltHaloMesh.geometry.dispose();
  }
  if (boltBranchMesh) {
    boltGroup.remove(boltBranchMesh);
    boltBranchMesh.geometry.dispose();
  }

  const startX = randRange(-1.1, 1.1);
  const endX = randRange(-0.85, 0.75);
  const endZ = randRange(0.25, 1.05);
  const pts = [];
  const steps = 9;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const y = THREE.MathUtils.lerp(6.1, 0.12, t);
    const jitter = (i === 0 || i === steps) ? 0 : randRange(-0.48, 0.48);
    const x = THREE.MathUtils.lerp(startX, endX, t) + jitter;
    const z = THREE.MathUtils.lerp(-0.1, endZ, t) + ((i === 0 || i === steps) ? 0 : randRange(-0.22, 0.22));
    pts.push(new THREE.Vector3(x, y, z));
  }
  const path = new THREE.CatmullRomCurve3(pts);
  const coreGeo = new THREE.TubeGeometry(path, 24, 0.065, 6, false);
  boltCoreMesh = new THREE.Mesh(coreGeo, matBoltCore);
  boltGroup.add(boltCoreMesh);

  const haloGeo = new THREE.TubeGeometry(path, 24, 0.135, 6, false);
  boltHaloMesh = new THREE.Mesh(haloGeo, matBoltHalo);
  boltGroup.add(boltHaloMesh);

  // Secondary branch
  const midPt = pts[3].clone();
  const bPts = [
    midPt,
    midPt.clone().add(new THREE.Vector3(randRange(0.4, 0.85), -0.95, randRange(-0.2, 0.2))),
    midPt.clone().add(new THREE.Vector3(randRange(0.8, 1.35), -1.85, randRange(-0.3, 0.3)))
  ];
  const bPath = new THREE.CatmullRomCurve3(bPts);
  const branchGeo = new THREE.TubeGeometry(bPath, 10, 0.042, 5, false);
  boltBranchMesh = new THREE.Mesh(branchGeo, matBoltCore);
  boltGroup.add(boltBranchMesh);

  strikeRingMesh.position.set(endX, 0.11, endZ);
}
rebuildLightningBolt();

// 10. Steady Rain Streaks & Tiny Splash Pops on the Street
const RAIN_COUNT = 340;
const rainGeo = new THREE.CylinderGeometry(0.011, 0.011, 0.56, 4);
rainGeo.rotateZ(0.09); // Slight monsoon wind slant
const matRain = new THREE.MeshBasicMaterial({ color: 0xd4ebff, transparent: true, opacity: 0.65 });
const rainInst = new THREE.InstancedMesh(rainGeo, matRain, RAIN_COUNT);
world.add(rainInst);

const rainDrops = [];
for (let i = 0; i < RAIN_COUNT; i++) {
  rainDrops.push({
    x: randRange(-3.65, 3.65),
    y: randRange(0.2, 6.0),
    z: randRange(-2.6, 3.0),
    speed: randRange(9.2, 13.5),
    lenScale: randRange(0.8, 1.35)
  });
}

// Splash pops on cobblestones & puddles
const SPLASH_COUNT = 56;
const splashGeo = new THREE.RingGeometry(0.038, 0.082, 14);
splashGeo.rotateX(-Math.PI / 2);
const matSplash = new THREE.MeshBasicMaterial({ color: 0xe0f2ff, transparent: true, opacity: 0.72, side: THREE.DoubleSide });
const splashInst = new THREE.InstancedMesh(splashGeo, matSplash, SPLASH_COUNT);
world.add(splashInst);

const splashes = [];
for (let i = 0; i < SPLASH_COUNT; i++) {
  const z = randRange(-0.4, 2.25);
  splashes.push({
    x: randRange(-3.4, 3.4),
    y: z < -0.45 ? 0.21 : 0.09,
    z,
    phase: rng(),
    speed: randRange(1.8, 3.1)
  });
}

// 11. Generous Invisible Raycast Hit Proxies (Unmistakable at 320px)
const proxyMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

// Sky & Clouds Proxy (covers upper cloud stack & sky area generously)
const skyProxy = new THREE.Mesh(new THREE.BoxGeometry(9.2, 3.6, 6.2), proxyMat);
skyProxy.position.set(0, 6.1, 0);
skyProxy.userData.action = 'thunder';
world.add(skyProxy);

// Paper Boat & Puddle Proxy (expanded generous touch volume over main puddle & boat)
const boatProxy = new THREE.Mesh(new THREE.CylinderGeometry(2.55, 2.55, 1.25, 24), proxyMat);
boatProxy.position.set(0.05, 0.38, 1.08);
boatProxy.userData.action = 'sail';
world.add(boatProxy);

const interactables = [boatProxy, skyProxy];

// 12. Interaction State Machines (Retriggerable on every tap, never locks)
const thunderState = {
  active: false,
  startTime: 0,
  duration: 1350
};

const sailState = {
  active: false,
  startTime: 0,
  duration: 3100,
  lastWakeTime: 0
};

function triggerThunder(now) {
  thunderState.active = true;
  thunderState.startTime = now;
  rebuildLightningBolt();
}

function triggerBoatSail(now) {
  sailState.active = true;
  sailState.startTime = now;
  sailState.lastWakeTime = 0;
  spawnWakeRing(boatGroup.position.x, boatGroup.position.z, now);
}

// Pointer Tap Handling (distinguishes tap from orbit drag)
const raycaster = new THREE.Raycaster();
const pointerDownPos = new THREE.Vector2();
const pointerNDC = new THREE.Vector2();
let pointerDownTime = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos.set(e.clientX, e.clientY);
  pointerDownTime = performance.now();
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.hypot(dx, dy);
  const elapsed = performance.now() - pointerDownTime;
  if (dist > 14 || elapsed > 600) return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(interactables, false);
  const now = performance.now();

  if (hits.length > 0) {
    const action = hits[0].object.userData.action;
    if (action === 'sail') {
      triggerBoatSail(now);
      return;
    }
    if (action === 'thunder') {
      triggerThunder(now);
      return;
    }
  }

  // Fallback screen-zone check so tapping upper sky always triggers thunder
  const headerBottom = headerEl.getBoundingClientRect().bottom;
  if (e.clientY > headerBottom && e.clientY < rect.height * 0.42) {
    triggerThunder(now);
  }
});

// 13. Projected Bounding-Box Camera Framing with Safe Header/Footer Clearance
const viewDir = new THREE.Vector3(0.60, 0.36, 0.715).normalize();

function fitCameraToDiorama() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  if (!width || !height) return;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(width, height);
  camera.aspect = width / height;

  const headerH = headerEl.getBoundingClientRect().height || 78;
  const footerH = footerEl.getBoundingClientRect().height || 40;

  const topSafePx = headerH + 10;
  const bottomSafePx = footerH + 10;
  const usableH = Math.max(140, height - topSafePx - bottomSafePx);

  // Adjust FOV subtly for tall portrait phones vs desktop
  camera.fov = camera.aspect < 0.75 ? 36 : 32;
  camera.updateProjectionMatrix();

  const vFovRad = THREE.MathUtils.degToRad(camera.fov);
  const tanHalfVFov = Math.tan(vFovRad / 2);
  const tanHalfHFov = tanHalfVFov * camera.aspect;

  const usableVFraction = (usableH / height) * 0.90;
  const usableHFraction = 0.89;

  // Target center slightly shifted so safe band center aligns with diorama center
  const bandCenterNormY = ((height - bottomSafePx + topSafePx) * 0.5 / height - 0.5) * 2;
  const sceneCenter = new THREE.Vector3(0.0, 3.35, 0.05);

  // Build camera basis vectors from viewDir
  const forward = viewDir.clone().negate();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(forward, worldUp).normalize();
  const up = new THREE.Vector3().crossVectors(right, forward).normalize();

  let requiredDist = 8.0;
  for (const pt of framingPoints) {
    const rel = pt.clone().sub(sceneCenter);
    const xCam = rel.dot(right);
    const yCam = rel.dot(up);
    const zCam = rel.dot( viewDir );

    const dH = Math.abs(xCam) / (tanHalfHFov * usableHFraction) + zCam;
    const dV = Math.abs(yCam) / (tanHalfVFov * usableVFraction) + zCam;
    requiredDist = Math.max(requiredDist, dH, dV);
  }

  // Offset target vertically to account for asymmetric header/footer safe margins
  const verticalTargetShift = bandCenterNormY * requiredDist * tanHalfVFov * 0.55;
  controls.target.set(sceneCenter.x, sceneCenter.y + verticalTargetShift, sceneCenter.z);

  camera.position.copy(controls.target).addScaledVector(viewDir, requiredDist);
  controls.minDistance = requiredDist * 0.68;
  controls.maxDistance = requiredDist * 1.45;
  controls.update();
}

window.addEventListener('resize', fitCameraToDiorama);
fitCameraToDiorama();
requestAnimationFrame(fitCameraToDiorama);

document.addEventListener('visibilitychange', () => {
  isTabHidden = document.hidden;
});

// 14. Smooth Animation Loop (Driven by performance.now)
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  if (isTabHidden || contextLost) {
    lastTime = now;
    return;
  }

  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const tSec = now * 0.001;

  // --- A. INTERACTION 1: Monsoon Thunder Beat (Balanced flash that preserves building colors) ---
  let rainRateMult = 1.0;
  let rainLenMult = 1.0;
  let lampFlicker = 1.0;
  let windowFlicker = 1.0;
  let lightningIntensity = 0.0;
  let cloudFlashBoost = 0.0;
  let boltVisible = false;

  if (thunderState.active) {
    const elapsed = now - thunderState.startTime;
    const p = elapsed / thunderState.duration;
    if (p >= 1.0) {
      thunderState.active = false;
      container.style.filter = 'none';
    } else {
      // Crisp double-pulse lightning strike: bright bolt, controlled scene illumination (max 2.15)
      if (p < 0.08) {
        lightningIntensity = 1.85;
        cloudFlashBoost = 1.1;
        boltVisible = true;
      } else if (p < 0.13) {
        lightningIntensity = 0.35;
        cloudFlashBoost = 0.25;
        boltVisible = false;
      } else if (p < 0.24) {
        lightningIntensity = 2.15;
        cloudFlashBoost = 1.35;
        boltVisible = true;
      } else if (p < 0.44) {
        const decay = 1 - (p - 0.24) / 0.20;
        lightningIntensity = decay * 0.95;
        cloudFlashBoost = decay * 0.6;
        boltVisible = p < 0.29;
      }

      // Streetlamp and shop windows flicker during strike then recover warmly
      if (p > 0.06 && p < 0.55) {
        const flickWave = Math.sin(elapsed * 0.075) * Math.cos(elapsed * 0.13);
        lampFlicker = flickWave > 0 ? 1.18 : 0.24;
        windowFlicker = flickWave > -0.2 ? 1.12 : 0.38;
      }

      // Rain bursts heavier for a moment then settles back
      const burstEnv = Math.sin(Math.min(1, p * 1.15) * Math.PI);
      rainRateMult = 1.0 + 1.15 * burstEnv;
      rainLenMult = 1.0 + 0.55 * burstEnv;

      // Subtle sky-flash lift without washing out building facades
      if (lightningIntensity > 0.5) {
        container.style.filter = `brightness(${(1 + lightningIntensity * 0.055).toFixed(3)})`;
      } else {
        container.style.filter = 'none';
      }
    }
  }

  boltGroup.visible = boltVisible;
  if (boltVisible) {
    const s = 0.85 + 0.55 * Math.sin(now * 0.05);
    strikeRingMesh.scale.set(s, 1, s);
  }
  lightningLight.intensity = lightningIntensity;
  matCloud.emissiveIntensity = 0.48 + cloudFlashBoost;

  // Apply warm lamp/window glow + subtle idle shimmer
  const idleWarmPulse = 1.0 + 0.035 * Math.sin(tSec * 4.2);
  streetLampLight.intensity = 5.8 * lampFlicker * idleWarmPulse;
  matLampGlass.emissiveIntensity = 3.1 * lampFlicker * idleWarmPulse;
  lampHalo.material.opacity = 0.32 * lampFlicker;
  matWindowGlow.emissiveIntensity = 1.85 * windowFlicker;
  matShopWindowGlow.emissiveIntensity = 2.2 * windowFlicker;
  matStringBulb.emissiveIntensity = 2.7 * lampFlicker;

  // --- B. INTERACTION 2: Paper Boat Sets Sail (Wide, Unmistakable Glide & Spin at 320px) ---
  if (sailState.active) {
    const elapsed = now - sailState.startTime;
    const u = elapsed / sailState.duration;
    if (u >= 1.0) {
      sailState.active = false;
    } else {
      // Wide, sweeping voyage across the expanded puddle:
      // Glides from left-front (-0.62, 1.12) -> right-back (+1.18, 0.82) -> center spin -> front-right -> back to mooring
      const env = Math.sin(u * Math.PI);
      const loopAngle = u * Math.PI * 2;

      const glideX = (1 - Math.cos(loopAngle)) * 0.88 + Math.sin(loopAngle) * 0.52;
      const glideZ = -Math.sin(loopAngle * 2) * 0.42;

      const bx = boatAnchor.x + glideX * env;
      const bz = boatAnchor.z + glideZ * env;

      // Tangent heading along path + cheerful 360 twirl near center of puddle (u in 0.36..0.70)
      const dx = (Math.sin(loopAngle) * 0.88 + Math.cos(loopAngle) * 0.52);
      const dz = -Math.cos(loopAngle * 2) * 0.84;
      const pathHeading = Math.atan2(-dz, dx) * 0.55 * env;

      let spinBonus = 0;
      if (u > 0.36 && u < 0.70) {
        const su = (u - 0.36) / 0.34;
        spinBonus = (0.5 - 0.5 * Math.cos(su * Math.PI)) * Math.PI * 2;
      }

      boatGroup.position.x = bx;
      boatGroup.position.z = bz;
      boatGroup.position.y = boatAnchor.y + Math.sin(tSec * 10.0) * 0.024 + 0.018 * env;
      boatGroup.rotation.y = boatAnchor.rotY + pathHeading + spinBonus;
      boatGroup.rotation.z = Math.sin(tSec * 8.5) * 0.11;
      boatGroup.rotation.x = Math.cos(tSec * 7.0) * 0.075;

      if (now - sailState.lastWakeTime > 95) {
        sailState.lastWakeTime = now;
        spawnWakeRing(bx, bz, now);
      }
    }
  } else {
    // Ongoing gentle idle bobble in its mooring spot
    boatGroup.position.x = boatAnchor.x + Math.sin(tSec * 1.4) * 0.06;
    boatGroup.position.z = boatAnchor.z + Math.cos(tSec * 1.1) * 0.045;
    boatGroup.position.y = boatAnchor.y + Math.sin(tSec * 3.6) * 0.018;
    boatGroup.rotation.y = boatAnchor.rotY + Math.sin(tSec * 1.2) * 0.14;
    boatGroup.rotation.z = Math.sin(tSec * 2.9) * 0.07;
    boatGroup.rotation.x = Math.cos(tSec * 2.3) * 0.05;
  }

  // Update active wake rings
  for (let i = 0; i < wakeRings.length; i++) {
    const w = wakeRings[i];
    if (w.active) {
      const age = now - w.birth;
      if (age >= w.duration) {
        w.active = false;
        w.mesh.visible = false;
      } else {
        const k = age / w.duration;
        const sc = 0.75 + k * 3.85;
        w.mesh.scale.set(sc, 1, sc);
        w.mat.opacity = (1 - k) * 0.88;
      }
    }
  }

  // --- C. IDLE ANIMATIONS: Rain, Splashes, Puddles, String Lights, Walkers, Clouds ---
  // 1. Rain streaks falling within diorama bounds (never crossing header/footer)
  for (let i = 0; i < RAIN_COUNT; i++) {
    const r = rainDrops[i];
    r.y -= r.speed * rainRateMult * dt;
    r.x -= r.speed * 0.09 * rainRateMult * dt;
    if (r.y < 0.15) {
      r.y = 5.95 + (r.y % 0.4);
      r.x = randRange(-3.6, 3.6);
    }
    dummy.position.set(r.x, r.y, r.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, r.lenScale * rainLenMult, 1);
    dummy.updateMatrix();
    rainInst.setMatrixAt(i, dummy.matrix);
  }
  rainInst.instanceMatrix.needsUpdate = true;

  // 2. Splash pops on the wet street
  for (let i = 0; i < SPLASH_COUNT; i++) {
    const s = splashes[i];
    s.phase = (s.phase + dt * s.speed * rainRateMult) % 1.0;
    const sc = 0.35 + s.phase * 1.65;
    const visScale = s.phase < 0.85 ? sc : 0.001;
    dummy.position.set(s.x, s.y, s.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(visScale, 1, visScale);
    dummy.updateMatrix();
    splashInst.setMatrixAt(i, dummy.matrix);
  }
  splashInst.instanceMatrix.needsUpdate = true;

  // 3. Puddle reflected light shimmer
  for (let i = 0; i < puddles.length; i++) {
    const p = puddles[i];
    p.glowMat.opacity = (0.46 + 0.12 * Math.sin(tSec * 3.8 + i * 1.7)) * lampFlicker;
  }

  // 4. String lights gentle sway
  for (let i = 0; i < stringLightCurves.length; i++) {
    const st = stringStrands[i];
    st.group.rotation.z = Math.sin(tSec * 1.85 + st.phase) * 0.012;
    st.group.rotation.x = Math.cos(tSec * 1.45 + st.phase) * 0.010;
  }

  // 5. Umbrella figures bobbing as they walk in place
  const strideA = tSec * 5.6;
  walkerRed.bodyGroup.position.y = Math.abs(Math.sin(strideA)) * 0.048;
  walkerRed.bodyGroup.rotation.z = Math.sin(strideA) * 0.045;
  walkerRed.leftLeg.rotation.x = Math.sin(strideA) * 0.42;
  walkerRed.rightLeg.rotation.x = -Math.sin(strideA) * 0.42;
  walkerRed.umbGroup.rotation.z = -0.06 + Math.sin(strideA * 0.5) * 0.05;

  const strideB = tSec * 5.2 + 1.4;
  walkerYellow.bodyGroup.position.y = Math.abs(Math.sin(strideB)) * 0.048;
  walkerYellow.bodyGroup.rotation.z = Math.sin(strideB) * 0.045;
  walkerYellow.leftLeg.rotation.x = Math.sin(strideB) * 0.42;
  walkerYellow.rightLeg.rotation.x = -Math.sin(strideB) * 0.42;
  walkerYellow.umbGroup.rotation.z = -0.06 + Math.cos(strideB * 0.5) * 0.05;

  // 6. Clouds drifting slowly above
  for (let i = 0; i < cloudClusters.length; i++) {
    const cl = cloudClusters[i];
    cl.group.position.x = cl.baseX + Math.sin(tSec * cl.speed + cl.phase) * 0.28;
    cl.group.position.y = cl.baseY + Math.cos(tSec * (cl.speed * 1.3) + cl.phase) * 0.06;
  }

  controls.update();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
