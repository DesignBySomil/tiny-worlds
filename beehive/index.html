<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beehive — A Tiny World</title>
  <style>
    :root {
      --bg-top: #fef3d6;
      --bg-mid: #f7ddb0;
      --bg-bot: #ecc488;
      --ink-dark: #3b2614;
      --ink-soft: #6e4c2b;
      --pill-bg: rgba(255, 250, 238, 0.78);
      --pill-border: rgba(212, 162, 89, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 58%, var(--bg-bot) 100%);
      font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
      color: var(--ink-dark);
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #canvas-wrap.dragging {
      cursor: grabbing;
    }

    #canvas-wrap.hover-target {
      cursor: pointer;
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-left: 14px;
      padding-right: 14px;
    }

    #hud-header {
      top: 0;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: 8px;
      background: linear-gradient(180deg, rgba(254, 243, 214, 0.92) 0%, rgba(254, 243, 214, 0.65) 72%, rgba(254, 243, 214, 0) 100%);
    }

    .title {
      font-size: clamp(1.38rem, 4.2vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.08;
      color: var(--ink-dark);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .subtitle {
      font-size: clamp(0.78rem, 2.3vw, 0.92rem);
      font-style: italic;
      color: var(--ink-soft);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .hint-pill {
      margin-top: 6px;
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.025em;
      color: #5c3d1e;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(120, 78, 24, 0.08);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #hud-footer {
      bottom: 0;
      padding-top: 8px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(236, 196, 136, 0.88) 0%, rgba(236, 196, 136, 0.45) 68%, rgba(236, 196, 136, 0) 100%);
    }

    .footer-text {
      font-size: clamp(0.72rem, 2vw, 0.82rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      color: rgba(68, 43, 21, 0.78);
      text-shadow: 0 1px 0 rgba(255, 248, 232, 0.5);
    }

    #fallback-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fef3d6;
      color: #3b2614;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #fallback-msg .card {
      max-width: 360px;
      background: #fff9eb;
      border: 1px solid #d9b37c;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(80, 50, 20, 0.12);
    }

    #fallback-msg h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    #fallback-msg p {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #6e4c2b;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header id="hud-header" class="hud">
    <h1 class="title">Beehive</h1>
    <div class="subtitle">a tiny world</div>
    <div class="hint-pill">tap the hive to wake the bees - tap the flowers</div>
  </header>

  <div id="canvas-wrap"></div>

  <footer id="hud-footer" class="hud">
    <div class="footer-text">A tiny world</div>
  </footer>

  <div id="fallback-msg">
    <div class="card">
      <h2>WebGL Required</h2>
      <p>Your browser or device could not initialize 3D graphics for the Beehive meadow miniature. Please try enabling hardware acceleration or opening in a modern WebGL-capable browser.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261103)
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const rand = mulberry32(20261103);
    const randRange = (min, max) => min + rand() * (max - min);

    const container = document.getElementById('canvas-wrap');
    const fallbackEl = document.getElementById('fallback-msg');
    const headerEl = document.getElementById('hud-header');
    const footerEl = document.getElementById('hud-footer');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: false
      });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    if (!renderer || !renderer.getContext()) {
      fallbackEl.style.display = 'flex';
      throw new Error('WebGL context creation failed');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Warm golden-hour sky dome texture
    function createSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, '#fff5db');
      grad.addColorStop(0.45, '#fde6ba');
      grad.addColorStop(0.78, '#f7d192');
      grad.addColorStop(1.0, '#eab972');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    scene.background = createSkyTexture();
    scene.fog = new THREE.FogExp2(0xf8ddb0, 0.016);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 90);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.rotateSpeed = 0.65;
    controls.minPolarAngle = THREE.MathUtils.degToRad(46);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(74);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-42);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(42);

    // Lighting — bright, sunny, luminous golden hour with soft fill
    const hemiLight = new THREE.HemisphereLight(0xfff7e2, 0xc99c58, 1.38);
    hemiLight.position.set(0, 18, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffe9b8, 2.55);
    sunLight.position.set(8.5, 13.5, 7.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 32;
    const sc = 5.4;
    sunLight.shadow.camera.left = -sc;
    sunLight.shadow.camera.right = sc;
    sunLight.shadow.camera.top = sc;
    sunLight.shadow.camera.bottom = -sc;
    sunLight.shadow.bias = -0.0006;
    sunLight.shadow.normalBias = 0.025;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xffdfb0, 1.05);
    fillLight.position.set(-8.0, 6.0, -5.5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xfff1c9, 0.85);
    rimLight.position.set(1.5, 5.0, -9.0);
    scene.add(rimLight);

    // Warm glow near the hive so bands and bees pop at 320px
    const hiveGlowLight = new THREE.PointLight(0xffbe4f, 1.2, 6.5, 1.5);
    hiveGlowLight.position.set(0.75, 2.05, 0.45);
    scene.add(hiveGlowLight);

    // Master World Root
    const worldRoot = new THREE.Group();
    scene.add(worldRoot);

    // Procedural striped bee texture
    function createBeeStripeTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffbe24';
      ctx.fillRect(0, 0, 128, 64);
      ctx.fillStyle = '#241509';
      ctx.fillRect(0, 0, 22, 64);
      ctx.fillRect(38, 0, 18, 64);
      ctx.fillRect(72, 0, 18, 64);
      ctx.fillRect(104, 0, 24, 64);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Shared Materials
    const materials = {
      soilBottom: new THREE.MeshStandardMaterial({ color: 0x6e472b, roughness: 0.88, metalness: 0.02 }),
      soilMid: new THREE.MeshStandardMaterial({ color: 0x8c5c38, roughness: 0.85, metalness: 0.02 }),
      soilRim: new THREE.MeshStandardMaterial({ color: 0xa47147, roughness: 0.82, metalness: 0.02 }),
      turfCap: new THREE.MeshStandardMaterial({ color: 0x68a83c, roughness: 0.76, metalness: 0.02 }),
      turfLip: new THREE.MeshStandardMaterial({ color: 0x7cb949, roughness: 0.72, metalness: 0.02 }),
      bark: new THREE.MeshStandardMaterial({ color: 0x6f4729, roughness: 0.82, metalness: 0.03 }),
      barkDark: new THREE.MeshStandardMaterial({ color: 0x54341c, roughness: 0.88, metalness: 0.02 }),
      canopyBright: new THREE.MeshStandardMaterial({ color: 0x7ac143, roughness: 0.62, metalness: 0.02 }),
      canopyMid: new THREE.MeshStandardMaterial({ color: 0x5ca632, roughness: 0.66, metalness: 0.02 }),
      canopyWarm: new THREE.MeshStandardMaterial({ color: 0x97cf4c, roughness: 0.58, metalness: 0.02 }),
      hiveGold: new THREE.MeshStandardMaterial({
        color: 0xf4a825,
        emissive: 0x633500,
        emissiveIntensity: 0.24,
        roughness: 0.52,
        metalness: 0.06
      }),
      hiveBandAlt: new THREE.MeshStandardMaterial({
        color: 0xdf8b16,
        emissive: 0x522800,
        emissiveIntensity: 0.22,
        roughness: 0.56,
        metalness: 0.05
      }),
      hiveComb: new THREE.MeshStandardMaterial({
        color: 0xffc636,
        emissive: 0x854900,
        emissiveIntensity: 0.35,
        roughness: 0.35,
        metalness: 0.1
      }),
      hiveHole: new THREE.MeshBasicMaterial({ color: 0x1b0d04 }),
      hiveHoleRim: new THREE.MeshStandardMaterial({
        color: 0xffca4b,
        emissive: 0x6b3a00,
        emissiveIntensity: 0.28,
        roughness: 0.45
      }),
      cord: new THREE.MeshStandardMaterial({ color: 0xc29356, roughness: 0.78 }),
      pebbleA: new THREE.MeshStandardMaterial({ color: 0xc4b7a2, roughness: 0.68 }),
      pebbleB: new THREE.MeshStandardMaterial({ color: 0xa89b87, roughness: 0.74 }),
      pebbleC: new THREE.MeshStandardMaterial({ color: 0xd8ccb8, roughness: 0.62 }),
      mushroomStem: new THREE.MeshStandardMaterial({ color: 0xf6ebd4, roughness: 0.65 }),
      mushroomCap: new THREE.MeshStandardMaterial({ color: 0xd95638, roughness: 0.52 }),
      mushroomSpot: new THREE.MeshStandardMaterial({ color: 0xfff8eb, roughness: 0.5 }),
      grassBlade: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.64,
        metalness: 0.02,
        side: THREE.DoubleSide
      }),
      cloverLeaf: new THREE.MeshStandardMaterial({
        color: 0x4e992c,
        roughness: 0.62,
        metalness: 0.02
      }),
      stemMat: new THREE.MeshStandardMaterial({ color: 0x4b8f29, roughness: 0.7 }),
      flowerCenter: new THREE.MeshStandardMaterial({
        color: 0xffb319,
        emissive: 0x5c3400,
        emissiveIntensity: 0.22,
        roughness: 0.48
      }),
      flowerCenterDark: new THREE.MeshStandardMaterial({
        color: 0xe67e17,
        emissive: 0x4a2100,
        emissiveIntensity: 0.2,
        roughness: 0.5
      }),
      petalWhite: new THREE.MeshStandardMaterial({
        color: 0xfffcf2,
        emissive: 0x3b3222,
        emissiveIntensity: 0.15,
        roughness: 0.45
      }),
      petalPurple: new THREE.MeshStandardMaterial({
        color: 0xb97cf7,
        emissive: 0x331654,
        emissiveIntensity: 0.2,
        roughness: 0.46
      }),
      petalYellow: new THREE.MeshStandardMaterial({
        color: 0xffdf38,
        emissive: 0x574100,
        emissiveIntensity: 0.22,
        roughness: 0.42
      }),
      beeBody: new THREE.MeshStandardMaterial({
        map: createBeeStripeTexture(),
        roughness: 0.42,
        metalness: 0.05,
        emissive: 0x422800,
        emissiveIntensity: 0.18
      }),
      beeHead: new THREE.MeshStandardMaterial({ color: 0x26160a, roughness: 0.4 }),
      beeWing: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xfff3d6,
        emissiveIntensity: 0.42,
        transparent: true,
        opacity: 0.74,
        roughness: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      pollenMote: new THREE.MeshBasicMaterial({ color: 0xffe478 }),
      seedFluff: new THREE.MeshBasicMaterial({ color: 0xfffdf6 }),
      seedStem: new THREE.MeshBasicMaterial({ color: 0xc8aa78 })
    };

    // Helper height function for the sculpted meadow hillock
    function getMeadowY(x, z) {
      const r2 = x * x + z * z;
      const dome = Math.max(0, 1 - r2 / (3.35 * 3.35)) * 0.26;
      const undulation = Math.sin(x * 0.85 + 0.5) * Math.cos(z * 0.85 - 0.3) * 0.05;
      return dome + undulation;
    }

    // ==========================================
    // 1. SCULPTURAL DIORAMA SLAB
    // ==========================================
    const slabGroup = new THREE.Group();
    worldRoot.add(slabGroup);

    function createBeveledDisc(radiusTop, radiusBottom, height, radialSegs, deformAmt) {
      const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegs, 4);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const angle = Math.atan2(v.z, v.x);
        const rad = Math.hypot(v.x, v.z);
        if (rad > 0.001) {
          const lobe = 1.0
            + Math.sin(angle * 3 + 0.7) * 0.035
            + Math.cos(angle * 5 - 1.1) * 0.022
            + Math.sin(angle * 7 + 2.0) * deformAmt;
          v.x *= lobe;
          v.z *= lobe;
        }
        // Soften top/bottom rim for tactile bevel
        const normY = v.y / (height * 0.5);
        if (Math.abs(normY) > 0.75) {
          const pinch = 1.0 - (Math.abs(normY) - 0.75) * 0.16;
          v.x *= pinch;
          v.z *= pinch;
        }
        if (v.y > 0) {
          v.y += getMeadowY(v.x, v.z) * (v.y / (height * 0.5));
        }
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const baseBottomMesh = new THREE.Mesh(createBeveledDisc(3.22, 2.92, 0.38, 48, 0.012), materials.soilBottom);
    baseBottomMesh.position.y = -0.58;
    baseBottomMesh.receiveShadow = true;
    slabGroup.add(baseBottomMesh);

    const baseMidMesh = new THREE.Mesh(createBeveledDisc(3.38, 3.20, 0.34, 48, 0.015), materials.soilMid);
    baseMidMesh.position.y = -0.34;
    baseMidMesh.receiveShadow = true;
    slabGroup.add(baseMidMesh);

    const turfLipMesh = new THREE.Mesh(createBeveledDisc(3.52, 3.38, 0.24, 56, 0.016), materials.turfLip);
    turfLipMesh.position.y = -0.14;
    turfLipMesh.castShadow = true;
    turfLipMesh.receiveShadow = true;
    slabGroup.add(turfLipMesh);

    const turfCapMesh = new THREE.Mesh(createBeveledDisc(3.46, 3.50, 0.18, 56, 0.014), materials.turfCap);
    turfCapMesh.position.y = -0.05;
    turfCapMesh.receiveShadow = true;
    slabGroup.add(turfCapMesh);

    // ==========================================
    // 2. GNARLED TREE & LEAFY CANOPY
    // ==========================================
    const treeGroup = new THREE.Group();
    worldRoot.add(treeGroup);

    function createBranchTube(points, rStart, rEnd, tubularSegs, radialSegs, mat) {
      const curve = new THREE.CatmullRomCurve3(points);
      const geo = new THREE.TubeGeometry(curve, tubularSegs, 1, radialSegs, false);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      const cPt = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        const u = Math.min(1, Math.floor(i / (radialSegs + 1)) / tubularSegs);
        curve.getPointAt(u, cPt);
        v.fromBufferAttribute(pos, i);
        const dir = v.clone().sub(cPt);
        const angle = Math.atan2(dir.z, dir.x);
        const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(u, 0.82));
        const barkFlute = 1.0 + Math.sin(angle * 5 + u * 8) * 0.08 + Math.cos(angle * 3 - u * 5) * 0.05;
        v.copy(cPt).addScaledVector(dir, radius * barkFlute);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Main gnarled trunk curving over the meadow
    const mainTrunkPts = [
      new THREE.Vector3(-1.55, getMeadowY(-1.55, -0.55) - 0.12, -0.55),
      new THREE.Vector3(-1.62, 0.85, -0.52),
      new THREE.Vector3(-1.42, 1.95, -0.35),
      new THREE.Vector3(-1.02, 2.95, -0.15),
      new THREE.Vector3(-0.62, 3.55, -0.05)
    ];
    treeGroup.add(createBranchTube(mainTrunkPts, 0.46, 0.22, 28, 12, materials.bark));

    // Hive-bearing front limb reaching right and slightly forward
    const hiveAnchorPos = new THREE.Vector3(0.65, 3.05, 0.22);
    const hiveBranchPts = [
      new THREE.Vector3(-1.18, 2.55, -0.24),
      new THREE.Vector3(-0.45, 3.08, 0.02),
      hiveAnchorPos,
      new THREE.Vector3(1.18, 3.16, 0.30)
    ];
    treeGroup.add(createBranchTube(hiveBranchPts, 0.24, 0.085, 22, 10, materials.bark));

    // Back-left upper bough
    const backBoughPts = [
      new THREE.Vector3(-1.32, 2.25, -0.32),
      new THREE.Vector3(-1.88, 2.95, -0.68),
      new THREE.Vector3(-2.15, 3.48, -0.82)
    ];
    treeGroup.add(createBranchTube(backBoughPts, 0.22, 0.10, 16, 9, materials.bark));

    // Surface roots hugging the meadow
    const rootDefs = [
      [
        new THREE.Vector3(-1.45, 0.35, -0.42),
        new THREE.Vector3(-1.05, getMeadowY(-1.05, -0.10) + 0.05, -0.10),
        new THREE.Vector3(-0.62, getMeadowY(-0.62, 0.15) - 0.03, 0.15)
      ],
      [
        new THREE.Vector3(-1.65, 0.32, -0.45),
        new THREE.Vector3(-2.10, getMeadowY(-2.10, -0.12) + 0.04, -0.12),
        new THREE.Vector3(-2.48, getMeadowY(-2.48, 0.18) - 0.04, 0.18)
      ],
      [
        new THREE.Vector3(-1.55, 0.30, -0.68),
        new THREE.Vector3(-1.38, getMeadowY(-1.38, -1.25) + 0.04, -1.25),
        new THREE.Vector3(-1.15, getMeadowY(-1.15, -1.72) - 0.04, -1.72)
      ]
    ];
    for (const rPts of rootDefs) {
      treeGroup.add(createBranchTube(rPts, 0.20, 0.05, 14, 8, materials.barkDark));
    }

    // Sculpted leafy canopy clusters
    const canopyGroup = new THREE.Group();
    treeGroup.add(canopyGroup);

    const canopyPuffGeo = new THREE.IcosahedronGeometry(1, 2);
    {
      const pos = canopyPuffGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const n = 1.0
          + Math.sin(v.x * 4.2 + v.y * 3.1) * 0.08
          + Math.cos(v.z * 4.5 - v.y * 2.7) * 0.07;
        v.multiplyScalar(n);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      canopyPuffGeo.computeVertexNormals();
    }

    const canopyBlobs = [
      { pos: [-0.85, 3.85, -0.18], scale: [1.35, 0.92, 1.18], mat: materials.canopyBright },
      { pos: [-1.78, 3.62, -0.55], scale: [1.18, 0.85, 1.05], mat: materials.canopyMid },
      { pos: [-0.05, 3.68, 0.08], scale: [1.05, 0.78, 0.95], mat: materials.canopyWarm },
      { pos: [-1.28, 4.18, -0.35], scale: [1.12, 0.82, 0.98], mat: materials.canopyWarm },

    // ==========================================
    // 5. INSTANCED GRASS TUFTS & CLOVER
    // ==========================================
    // Tapered curved grass blade geometry
    function createGrassBladeGeo() {
      const geo = new THREE.PlaneGeometry(0.058, 0.38, 1, 4);
      geo.translate(0, 0.19, 0);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const t = y / 0.38;
        const taper = 1.0 - Math.pow(t, 1.35) * 0.88;
        const bend = Math.pow(t, 1.8) * 0.085;
        pos.setX(i, pos.getX(i) * taper);
        pos.setZ(i, pos.getZ(i) + bend);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const grassCount = 1350;
    const grassGeo = createGrassBladeGeo();
    const grassInstanced = new THREE.InstancedMesh(grassGeo, materials.grassBlade, grassCount);
    grassInstanced.castShadow = true;
    grassInstanced.receiveShadow = true;
    worldRoot.add(grassInstanced);

    const grassBaseData = [];
    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();
    const grassPalette = [0x6eb63e, 0x7ec447, 0x5ca131, 0x8ecf4e, 0x64ab37];

    let gIdx = 0;
    while (gIdx < grassCount) {
      const r = Math.sqrt(rand()) * 3.18;
      const theta = rand() * Math.PI * 2;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;

      // Avoid trunk core
      if (Math.hypot(x + 1.55, z + 0.55) < 0.42) continue;

      const y = getMeadowY(x, z);
      const rotY = rand() * Math.PI * 2;
      const tiltX = randRange(-0.18, 0.22);
      const scaleY = randRange(0.65, 1.38) * (1.0 - (r / 3.5) * 0.25);
      const scaleXZ = randRange(0.85, 1.25);

      dummy.position.set(x, y - 0.015, z);
      dummy.rotation.set(tiltX, rotY, 0);
      dummy.scale.set(scaleXZ, scaleY, scaleXZ);
      dummy.updateMatrix();
      grassInstanced.setMatrixAt(gIdx, dummy.matrix);

      tmpColor.setHex(grassPalette[gIdx % grassPalette.length]);
      tmpColor.offsetHSL(randRange(-0.02, 0.02), randRange(-0.04, 0.04), randRange(-0.04, 0.05));
      grassInstanced.setColorAt(gIdx, tmpColor);

      grassBaseData.push({
        x, y: y - 0.015, z,
        rotY, tiltX, scaleXZ, scaleY,
        phase: x * 0.9 + z * 0.7 + rand() * 1.5
      });
      gIdx++;
    }
    grassInstanced.instanceMatrix.needsUpdate = true;
    grassInstanced.instanceColor.needsUpdate = true;

    // Instanced 3-leaf Clover bed across the meadow
    const cloverLeafCount = 360;
    const cloverGeo = new THREE.CylinderGeometry(0.048, 0.032, 0.014, 7);
    const cloverInstanced = new THREE.InstancedMesh(cloverGeo, materials.cloverLeaf, cloverLeafCount);
    cloverInstanced.receiveShadow = true;
    worldRoot.add(cloverInstanced);

    let cIdx = 0;
    for (let patch = 0; patch < 120; patch++) {
      const r = Math.sqrt(rand()) * 2.95;
      const theta = rand() * Math.PI * 2;
      const cx = Math.cos(theta) * r;
      const cz = Math.sin(theta) * r;
      if (Math.hypot(cx + 1.55, cz + 0.55) < 0.48) {
        patch--;
        continue;
      }
      const cy = getMeadowY(cx, cz) + 0.025;
      const baseAngle = rand() * Math.PI * 2;
      for (let lf = 0; lf < 3; lf++) {
        if (cIdx >= cloverLeafCount) break;
        const a = baseAngle + lf * ((Math.PI * 2) / 3);
        dummy.position.set(cx + Math.cos(a) * 0.042, cy, cz + Math.sin(a) * 0.042);
        dummy.rotation.set(randRange(-0.18, 0.18), a, randRange(-0.18, 0.18));
        const sc = randRange(0.85, 1.25);
        dummy.scale.set(sc, 1, sc * 1.15);
        dummy.updateMatrix();
        cloverInstanced.setMatrixAt(cIdx++, dummy.matrix);
      }
    }
    cloverInstanced.instanceMatrix.needsUpdate = true;

    // ==========================================
    // 6. WILDFLOWER PATCHES (Instanced + Tap Targets)
    // ==========================================
    const flowerPatches = [
      {
        id: 0,

    const flowerTargetProxies = [];

    const stemGeo = new THREE.CylinderGeometry(0.016, 0.022, 0.34, 6);
    stemGeo.translate(0, 0.17, 0);

    const centerDiscGeo = new THREE.SphereGeometry(0.058, 10, 8);

    flowerPatches.forEach((patch) => {
      patch.center.y = getMeadowY(patch.center.x, patch.center.z);

      worldRoot.add(patchGroup);

      const stemsInst = new THREE.InstancedMesh(stemGeo, materials.stemMat, patch.count);
      const centersInst = new THREE.InstancedMesh(centerDiscGeo, patch.centerMat, patch.count);

      stemsInst.castShadow = true;
      centersInst.castShadow = true;
      petalsInst.castShadow = true;

      patchGroup.add(stemsInst, centersInst, petalsInst);

      const flowersList = [];
      for (let i = 0; i < patch.count; i++) {
        const rad = Math.sqrt((i + 0.3) / patch.count) * (patch.radius * 0.85);
        const ang = i * 2.39996 + randRange(-0.25, 0.25);
        const fx = patch.center.x + Math.cos(ang) * rad;
        const fz = patch.center.z + Math.sin(ang) * rad;
        const fy = getMeadowY(fx, fz) - 0.01;
        const scale = randRange(0.82, 1.25);
        const height = 0.34 * scale;
        const tiltX = randRange(-0.18, 0.18);
        const tiltZ = randRange(-0.18, 0.18);
        const yaw = rand() * Math.PI * 2;

        flowersList.push({
          fx, fy, fz, scale, height, tiltX, tiltZ, yaw,
          phase: fx * 1.1 + fz * 0.9 + rand()
        });
      }

      // Generous invisible tap proxy sphere per flower patch for 320px viewports
      const proxyMesh = new THREE.Mesh(
        new THREE.SphereGeometry(patch.radius * 1.18, 12, 10),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      proxyMesh.position.set(patch.center.x, patch.center.y + 0.25, patch.center.z);
      proxyMesh.userData = { type: 'flowerPatch', patchId: patch.id };
      worldRoot.add(proxyMesh);
      flowerTargetProxies.push(proxyMesh);

      patchAnimState.push({
        patch,
        stemsInst,
        centersInst,
        petalsInst,
        flowersList,
        lastTriggerTime: -99999
      });
    });

    const headQuat = new THREE.Quaternion();
    const petalQuat = new THREE.Quaternion();
    const yAxis = new THREE.Vector3(0, 1, 0);

    function updateFlowerPatches(timeSec, nowMs) {
      for (const st of patchAnimState) {
        const elapsedTap = (nowMs - st.lastTriggerTime) * 0.001;
        let tapShake = 0;
        let tapBounce = 1.0;
        if (elapsedTap >= 0 && elapsedTap < 2.2) {
          const env = Math.exp(-elapsedTap * 2.6);
          tapShake = Math.sin(elapsedTap * 26) * 0.22 * env;
          tapBounce = 1.0 + Math.sin(elapsedTap * 18) * 0.18 * env;
        }

        let pIdx = 0;
        for (let i = 0; i < st.flowersList.length; i++) {
          const fl = st.flowersList[i];
          const windX = Math.sin(timeSec * 1.85 + fl.phase) * 0.055 + tapShake;
          const windZ = Math.cos(timeSec * 1.55 + fl.phase) * 0.045 + tapShake * 0.7;

          const rx = fl.tiltX + windX;
          const rz = fl.tiltZ + windZ;

          // Stem matrix
          dummy.position.set(fl.fx, fl.fy, fl.fz);
          dummy.rotation.set(rx, fl.yaw, rz);
          dummy.scale.set(fl.scale, fl.scale * tapBounce, fl.scale);
          dummy.updateMatrix();
          st.stemsInst.setMatrixAt(i, dummy.matrix);

          // Flower head position at top of bent stem
          const topOffset = new THREE.Vector3(0, fl.height * tapBounce, 0).applyEuler(dummy.rotation);
          const hx = fl.fx + topOffset.x;
          const hy = fl.fy + topOffset.y;
          const hz = fl.fz + topOffset.z;

          dummy.position.set(hx, hy, hz);
          dummy.rotation.set(rx * 1.15, fl.yaw, rz * 1.15);
          dummy.scale.setScalar(fl.scale * tapBounce);
          dummy.updateMatrix();
          st.centersInst.setMatrixAt(i, dummy.matrix);

          headQuat.copy(dummy.quaternion);

          for (let p = 0; p < petalsPerFlower; p++) {
            const pAngle = (p / petalsPerFlower) * Math.PI * 2;
            petalQuat.setFromAxisAngle(yAxis, pAngle);
            dummy.quaternion.copy(headQuat).multiply(petalQuat);
            dummy.updateMatrix();
            st.petalsInst.setMatrixAt(pIdx++, dummy.matrix);
          }
        }
        st.stemsInst.instanceMatrix.needsUpdate = true;
        st.centersInst.instanceMatrix.needsUpdate = true;
        st.petalsInst.instanceMatrix.needsUpdate = true;
      }
    }

    // ==========================================

    worldRoot.add(beesGroup);

    const beeBodyGeo = new THREE.CapsuleGeometry(0.068, 0.085, 8, 12);
    beeBodyGeo.rotateZ(Math.PI * 0.5);
    const beeHeadGeo = new THREE.SphereGeometry(0.052, 8, 8);

    for (let i = 0; i < beeCount; i++) {
      const beeRoot = new THREE.Group();

      const bodyMesh = new THREE.Mesh(beeBodyGeo, materials.beeBody);
      bodyMesh.castShadow = true;
      beeRoot.add(bodyMesh);

      const headMesh = new THREE.Mesh(beeHeadGeo, materials.beeHead);

      const wingL = new THREE.Mesh(beeWingGeo, materials.beeWing);

      const wingR = new THREE.Mesh(beeWingGeo, materials.beeWing);
      wingR.position.set(0.01, 0.055, -0.02);
      wingR.rotation.y = Math.PI;
      beeRoot.add(wingR);

      const beeScale = randRange(0.95, 1.22);
      beeRoot.scale.setScalar(beeScale);
      beesGroup.add(beeRoot);

      bees.push({
        root: beeRoot,
        wingL,
        wingR,
        baseRadius: randRange(0.68, 1.32),
        burstExtraRadius: randRange(1.05, 1.65),
        baseSpeed: randRange(1.25, 1.95) * (i % 2 === 0 ? 1 : -1),
        phase: (i / beeCount) * Math.PI * 2 + randRange(-0.2, 0.2),
        yOffset: randRange(-0.48, 0.48),
        bobSpeed: randRange(2.4, 3.8),
        bobAmp: randRange(0.10, 0.20),
        tiltPhase: rand() * Math.PI * 2,
        prevPos: new THREE.Vector3()
      });
    }

    // ==========================================
    // 8. BUTTERFLIES (Idle Figure-8s + Flower Flutter Visitors)
    // ==========================================
    const butterfliesGroup = new THREE.Group();
    worldRoot.add(butterfliesGroup);

    const bfWingShapeGeo = new THREE.CircleGeometry(0.11, 12);
    bfWingShapeGeo.scale(1.15, 0.85, 1.0);
    bfWingShapeGeo.translate(0, 0, 0.085);

    const bfColors = [0xff9a3c, 0x7ad7f0, 0xff82b2, 0xffe047, 0xc48aff];

    function createButterflyUnit(colorHex, scale) {
      const root = new THREE.Group();
      root.scale.setScalar(scale);

      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 0.28,
        roughness: 0.35,
        side: THREE.DoubleSide
      });

      const thorax = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.018, 0.09, 4, 6),
        materials.beeHead
      );
      thorax.rotation.z = Math.PI * 0.5;
      root.add(thorax);

      const wingL = new THREE.Mesh(bfWingShapeGeo, mat);
      const wingR = new THREE.Mesh(bfWingShapeGeo, mat);
      wingR.rotation.y = Math.PI;

      root.add(wingL, wingR);
      butterfliesGroup.add(root);
      return { root, wingL, wingR, prevPos: new THREE.Vector3() };
    }

    // 4 Idle Butterflies looping figure-eights over the flowers
    const idleButterflies = [];
    for (let i = 0; i < 4; i++) {
      const bf = createButterflyUnit(bfColors[i % bfColors.length], randRange(0.95, 1.18));
      idleButterflies.push({
        ...bf,
        centerX: randRange(-0.6, 0.9),
        centerZ: randRange(-0.4, 0.9),
        baseY: randRange(0.85, 1.45),
        radiusX: randRange(1.05, 1.55),
        radiusZ: randRange(0.75, 1.15),
        speed: randRange(0.62, 0.88),
        phase: i * 1.65 + 0.4
      });
    }

    // Per-patch flutter visitors (3 per flower patch = 15 total)
    const patchVisitors = [];
    flowerPatches.forEach((patch, pIdx) => {
      const groupList = [];
      for (let v = 0; v < 3; v++) {
        const bf = createButterflyUnit(bfColors[(pIdx + v) % bfColors.length], randRange(0.88, 1.08));
        const restAngle = (v / 3) * Math.PI * 2 + pIdx * 0.7;
        const restRad = randRange(0.18, 0.42);
        const rx = patch.center.x + Math.cos(restAngle) * restRad;
        const rz = patch.center.z + Math.sin(restAngle) * restRad;
        const ry = getMeadowY(rx, rz) + 0.34;

        groupList.push({
          ...bf,
          restPos: new THREE.Vector3(rx, ry, rz),
          restYaw: restAngle + Math.PI * 0.5,
          loopRadius: randRange(0.42, 0.68),
          loopHeight: randRange(1.05, 1.48),
          phaseOffset: (v / 3) * Math.PI * 2
        });
      }
      patchVisitors.push(groupList);
    });

    // ==========================================
    // 9. DRIFTING DANDELION SEEDS & POLLEN MOTES (Instanced)
    // ==========================================
    // Ambient golden pollen motes (180 instanced)
    const pollenCount = 180;
    const pollenGeo = new THREE.IcosahedronGeometry(0.024, 0);
    const pollenInstanced = new THREE.InstancedMesh(pollenGeo, materials.pollenMote, pollenCount);
    worldRoot.add(pollenInstanced);

    const pollenData = [];
    for (let i = 0; i < pollenCount; i++) {
      const r = Math.sqrt(rand()) * 3.15;
      const theta = rand() * Math.PI * 2;
      pollenData.push({
        baseX: Math.cos(theta) * r,
        baseY: randRange(0.35, 3.35),
        baseZ: Math.sin(theta) * r,
        phase: rand() * Math.PI * 2,
        speed: randRange(0.45, 1.05),
        driftAmp: randRange(0.12, 0.28),
        scale: randRange(0.65, 1.35)
      });
    }

    // Drifting Dandelion Seeds (48 instanced composite fluff + stem)
    const seedCount = 48;
    const seedFluffGeo = new THREE.ConeGeometry(0.052, 0.075, 7, 1, true);
    seedFluffGeo.rotateX(Math.PI);
    seedFluffGeo.translate(0, 0.06, 0);

    const seedStemGeo = new THREE.CylinderGeometry(0.005, 0.008, 0.085, 5);
    seedStemGeo.translate(0, 0.02, 0);

    const seedFluffInst = new THREE.InstancedMesh(seedFluffGeo, materials.seedFluff, seedCount);
    const seedStemInst = new THREE.InstancedMesh(seedStemGeo, materials.seedStem, seedCount);
    worldRoot.add(seedFluffInst, seedStemInst);

    const seedData = [];
    for (let i = 0; i < seedCount; i++) {
      seedData.push({
        angle: rand() * Math.PI * 2,
        radius: randRange(0.45, 2.95),
        baseY: randRange(0.65, 3.25),
        speed: randRange(0.14, 0.28),
        bobPhase: rand() * Math.PI * 2,
        scale: randRange(0.82, 1.25)
      });
    }

    // ==========================================
    // 10. FLOWER PUFF BURST PARTICLES (On Flower Tap)
    // ==========================================
    const puffSlots = 6;
    const particlesPerPuff = 28;
    const totalPuffParticles = puffSlots * particlesPerPuff;
    const puffGeo = new THREE.DodecahedronGeometry(0.036, 0);
    const puffMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const puffInstanced = new THREE.InstancedMesh(puffGeo, puffMat, totalPuffParticles);
    worldRoot.add(puffInstanced);

    const activePuffs = [];
    for (let s = 0; s < puffSlots; s++) {
      const dirs = [];
      for (let p = 0; p < particlesPerPuff; p++) {
        const theta = rand() * Math.PI * 2;
        const spread = randRange(0.25, 0.85);
        dirs.push({
          vx: Math.cos(theta) * spread,
          vy: randRange(0.65, 1.45),
          vz: Math.sin(theta) * spread,
          rotSpeed: randRange(2.0, 5.0),
          scale: randRange(0.75, 1.35)
        });
      }
      activePuffs.push({
        startTime: -99999,
        origin: new THREE.Vector3(),
        color: new THREE.Color(0xfff5b8),
        dirs
      });
    }
    let nextPuffSlot = 0;

    function triggerFlowerPuff(origin, hexColor, nowMs) {
      const slot = activePuffs[nextPuffSlot];
      nextPuffSlot = (nextPuffSlot + 1) % puffSlots;
      slot.startTime = nowMs;
      slot.origin.copy(origin);
      slot.color.setHex(hexColor);
    }

    // ==========================================
    // 11. INTERACTION STATE & RAYCASTING
    // ==========================================
    const hiveSwarmState = {
      triggerTime: -99999,
      durationSec: 4.35
    };

    // Envelope for the Hive Swarm Burst: fast ramp up, sustained cloud, smooth settle
    function getHiveSwarmIntensity(nowMs) {
      const elapsed = (nowMs - hiveSwarmState.triggerTime) * 0.001;
      if (elapsed < 0 || elapsed > hiveSwarmState.durationSec) return 0;
      if (elapsed < 0.28) {
        const t = elapsed / 0.28;
        return 1 - Math.pow(1 - t, 3);
      }
      if (elapsed < 2.45) {
        return 1.0;
      }
      const t = (elapsed - 2.45) / (hiveSwarmState.durationSec - 2.45);
      return 0.5 * (1 + Math.cos(Math.PI * Math.min(1, t)));
    }

    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const interactiveTargets = [hiveHitProxy, ...flowerTargetProxies];

    let pointerDownPos = { x: 0, y: 0 };
    let isPointerDown = false;
    let isDraggingView = false;

    function updatePointerNdc(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      isDraggingView = false;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (isPointerDown) {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist > 6) {
          isDraggingView = true;
          container.classList.add('dragging');
        }
      } else if (e.pointerType === 'mouse') {
        updatePointerNdc(e.clientX, e.clientY);
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(interactiveTargets, false);
        container.classList.toggle('hover-target', hits.length > 0);
      }
    });

    function clearPointerState() {
      isPointerDown = false;
      isDraggingView = false;
      container.classList.remove('dragging');
    }

    renderer.domElement.addEventListener('pointercancel', clearPointerState);

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      clearPointerState();

      // Distinguish genuine tap from orbit drag
      if (dist > 11) return;

      updatePointerNdc(e.clientX, e.clientY);
      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(interactiveTargets, false);
      if (hits.length === 0) return;

      const hitObj = hits[0].object;
      const nowMs = performance.now();

      if (hitObj.userData.type === 'hive') {
        // Retriggerable forever without locking
        hiveSwarmState.triggerTime = nowMs;
      } else if (hitObj.userData.type === 'flowerPatch') {
        const pId = hitObj.userData.patchId;
        const st = patchAnimState[pId];
        if (st) {
          st.lastTriggerTime = nowMs;
          const puffOrigin = st.patch.center.clone();
          puffOrigin.y += 0.28;
          triggerFlowerPuff(puffOrigin, st.patch.puffColor, nowMs);
        }
      }
    });

    // ==========================================
    // 12. BOUNDING BOX & SAFE VIEWPORT FRAMING
    // ==========================================
    // Encompasses full slab, tree canopy at full height, hanging hive, bee swarm burst & seed band
    const sceneBoundsBox = new THREE.Box3(
      new THREE.Vector3(-3.55, -0.78, -3.55),
      new THREE.Vector3(3.55, 4.65, 3.55)
    );
    const boxCenter = new THREE.Vector3();
    sceneBoundsBox.getCenter(boxCenter);

    const boundingCorners = [
      new THREE.Vector3(sceneBoundsBox.min.x, sceneBoundsBox.min.y, sceneBoundsBox.min.z),
      new THREE.Vector3(sceneBoundsBox.max.x, sceneBoundsBox.min.y, sceneBoundsBox.min.z),
      new THREE.Vector3(sceneBoundsBox.min.x, sceneBoundsBox.max.y, sceneBoundsBox.min.z),
      new THREE.Vector3(sceneBoundsBox.max.x, sceneBoundsBox.max.y, sceneBoundsBox.min.z),
      new THREE.Vector3(sceneBoundsBox.min.x, sceneBoundsBox.min.y, sceneBoundsBox.max.z),
      new THREE.Vector3(sceneBoundsBox.max.x, sceneBoundsBox.min.y, sceneBoundsBox.max.z),
      new THREE.Vector3(sceneBoundsBox.min.x, sceneBoundsBox.max.y, sceneBoundsBox.max.z),
      new THREE.Vector3(sceneBoundsBox.max.x, sceneBoundsBox.max.y, sceneBoundsBox.max.z),
      // Extra sample points around the circular meadow perimeter and canopy crown
      new THREE.Vector3(0, 4.68, 0),
      new THREE.Vector3(0, -0.78, 3.55),
      new THREE.Vector3(3.55, 1.9, 0),
      new THREE.Vector3(-3.55, 1.9, 0)
    ];

    // Slightly elevated three-quarter viewing direction
    const baseViewDir = new THREE.Vector3(0.24, 0.36, 0.90).normalize();

    function updateCameraFraming() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const aspect = vw / Math.max(1, vh);

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(vw, vh);

      // Aspect-aware FOV: slightly wider on narrow portrait viewports
      camera.fov = aspect < 0.78 ? 42 : (aspect < 1.0 ? 38 : 34);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Measure actual DOM header and footer safe heights
      const headerH = headerEl.getBoundingClientRect().height || 86;
      const footerH = footerEl.getBoundingClientRect().height || 40;

      const safeTopPx = headerH + 8;
      const safeBotPx = footerH + 8;
      const usableHeightPx = Math.max(160, vh - safeTopPx - safeBotPx);

      // Compute asymmetric vertical offset so the miniature centers inside the safe zone
      const safeCenterY = safeTopPx + usableHeightPx * 0.5;
      const screenCenterY = vh * 0.5;
      const shiftNormalizedY = (safeCenterY - screenCenterY) / (vh * 0.5);

      const halfFovRad = THREE.MathUtils.degToRad(camera.fov * 0.5);
      const tanHalfVFov = Math.tan(halfFovRad);
      const tanHalfHFov = tanHalfVFov * aspect;

      // Usable fractions of viewport (keeping ~5% side margins and safe vertical margins)
      const usableWidthFrac = 0.90;
      const usableHeightFrac = (usableHeightPx / vh) * 0.93;

      // Camera basis vectors along baseViewDir
      const camForward = baseViewDir.clone().negate();
      const camRight = new THREE.Vector3().crossVectors(camForward, yAxis).normalize();
      const camUp = new THREE.Vector3().crossVectors(camRight, camForward).normalize();

      // Shift target slightly vertically so projected bounds sit cleanly between header & footer
      const target = new THREE.Vector3(0.0, 1.76 - shiftNormalizedY * 1.15, 0.0);

      let requiredDist = 8.0;
      const rel = new THREE.Vector3();

      for (const pt of boundingCorners) {
        rel.subVectors(pt, target);
        const zProj = rel.dot(camForward);
        const xProj = Math.abs(rel.dot(camRight));
        const yProj = Math.abs(rel.dot(camUp));

        const distForX = (xProj / (tanHalfHFov * usableWidthFrac)) - zProj;
        const distForY = (yProj / (tanHalfVFov * usableHeightFrac)) - zProj;

        if (distForX > requiredDist) requiredDist = distForX;
        if (distForY > requiredDist) requiredDist = distForY;
      }

      controls.target.copy(target);
      camera.position.copy(target).addScaledVector(baseViewDir, requiredDist);
      controls.minDistance = requiredDist * 0.86;
      controls.maxDistance = requiredDist * 1.18;
      controls.update();
    }

    window.addEventListener('resize', updateCameraFraming);
    requestAnimationFrame(updateCameraFraming);

    // ==========================================
    // 13. MAIN ANIMATION LOOP (performance.now)
    // ==========================================
    const hiveWorldCenter = new THREE.Vector3();
    const tmpVec = new THREE.Vector3();

    function animate(nowMs) {
      requestAnimationFrame(animate);

      const timeSec = nowMs * 0.001;
      const swarmIntensity = getHiveSwarmIntensity(nowMs);
      const swarmElapsed = (nowMs - hiveSwarmState.triggerTime) * 0.001;

      // 1. Warm light pulse & swarm glow boost
      sunLight.intensity = 2.52 + Math.sin(timeSec * 1.3) * 0.10;
      hiveGlowLight.intensity = 1.2 + Math.sin(timeSec * 2.1) * 0.15 + swarmIntensity * 1.65;

      // 2. Hive gentle idle sway + energetic rocking when tapped
      const idleRockZ = Math.sin(timeSec * 1.45) * 0.022;
      const idleRockX = Math.cos(timeSec * 1.15) * 0.016;
      const burstRockEnv = swarmElapsed >= 0 && swarmElapsed < 4.2
        ? Math.exp(-swarmElapsed * 0.85) * swarmIntensity
        : 0;
      const burstRockZ = Math.sin(swarmElapsed * 11.5) * 0.21 * burstRockEnv;
      const burstRockX = Math.cos(swarmElapsed * 9.2) * 0.14 * burstRockEnv;

      hivePivot.rotation.z = idleRockZ + burstRockZ;
      hivePivot.rotation.x = idleRockX + burstRockX;

      // Scale pulse on hive body right when tapped
      const hiveScaleBounce = (swarmElapsed >= 0 && swarmElapsed < 0.65)
        ? 1.0 + Math.sin((swarmElapsed / 0.65) * Math.PI) * 0.11 * (1 - swarmElapsed / 0.65)
        : 1.0;
      hiveBody.scale.setScalar(hiveScaleBounce);

      hiveBody.getWorldPosition(hiveWorldCenter);

      // 3. Bees orbit + unmistakable outward spiral swarm burst on tap
      for (let i = 0; i < bees.length; i++) {
        const b = bees[i];
        const speedMult = 1.0 + swarmIntensity * 3.6;
        const angle = b.phase + timeSec * b.baseSpeed * speedMult + swarmIntensity * 3.2 * Math.sin(timeSec * 3.5 + i);

        const currentRadius = b.baseRadius + swarmIntensity * b.burstExtraRadius * (0.75 + 0.25 * Math.sin(timeSec * 5.0 + i));
        const spiralLift = swarmIntensity * Math.sin(angle * 2.0 + i) * 0.52;

        const bx = hiveWorldCenter.x + Math.cos(angle) * currentRadius;
        const bz = hiveWorldCenter.z + Math.sin(angle) * currentRadius;
        const by = THREE.MathUtils.clamp(
          hiveWorldCenter.y + b.yOffset + Math.sin(timeSec * b.bobSpeed + b.phase) * b.bobAmp + spiralLift,
          0.65,
          3.95
        );

        tmpVec.set(bx, by, bz);
        const moveDir = tmpVec.clone().sub(b.prevPos);
        if (moveDir.lengthSq() > 0.000001) {
          const heading = Math.atan2(-moveDir.z, moveDir.x);
          b.root.rotation.y = heading;
          b.root.rotation.z = Math.sin(timeSec * 6.0 + b.tiltPhase) * (0.12 + swarmIntensity * 0.25);
        }
        b.prevPos.copy(tmpVec);
        b.root.position.copy(tmpVec);

        // High-speed wing blur flutter
        const wingFreq = 42.0 + swarmIntensity * 38.0;
        const flap = Math.sin(timeSec * wingFreq + i * 1.7) * 0.68;
        b.wingL.rotation.x = 0.35 + flap;
        b.wingR.rotation.x = 0.35 + flap;
      }

      // 4. Idle Figure-Eight Butterflies
      for (let i = 0; i < idleButterflies.length; i++) {
        const bf = idleButterflies[i];
        const t = timeSec * bf.speed + bf.phase;
        const x = bf.centerX + Math.sin(t) * bf.radiusX;
        const z = bf.centerZ + Math.sin(t * 2.0) * bf.radiusZ * 0.65;
        const y = bf.baseY + Math.sin(t * 3.2) * 0.18;

        tmpVec.set(x, y, z);
        const dx = x - bf.prevPos.x;
        const dz = z - bf.prevPos.z;
        if (dx * dx + dz * dz > 0.000001) {
          bf.root.rotation.y = Math.atan2(-dz, dx);
        }
        bf.prevPos.copy(tmpVec);
        bf.root.position.copy(tmpVec);

        const flap = Math.sin(timeSec * 15.0 + i * 2.1) * 0.82;
        bf.wingL.rotation.x = flap;
        bf.wingR.rotation.x = flap;
      }

      // 5. Flower Patch Flutter Visitors (Lift off, loop overhead, resettle on flower tap)
      const flutterDuration = 3.1;
      for (let pIdx = 0; pIdx < patchVisitors.length; pIdx++) {
        const st = patchAnimState[pIdx];
        const elapsed = (nowMs - st.lastTriggerTime) * 0.001;
        const visitors = patchVisitors[pIdx];

        for (let v = 0; v < visitors.length; v++) {
          const vis = visitors[v];
          if (elapsed >= 0 && elapsed < flutterDuration) {
            const u = elapsed / flutterDuration;
            // Smooth bell curve for lift-off and landing
            const heightEnv = Math.sin(u * Math.PI);
            const loopAngle = vis.phaseOffset + u * Math.PI * 2.4;
            const curRad = vis.loopRadius * Math.sin(u * Math.PI);

            const x = vis.restPos.x + Math.cos(loopAngle) * curRad;
            const z = vis.restPos.z + Math.sin(loopAngle) * curRad;
            const y = vis.restPos.y + heightEnv * vis.loopHeight + Math.sin(u * Math.PI * 6) * 0.08 * heightEnv;

            tmpVec.set(x, y, z);
            const dx = x - vis.prevPos.x;
            const dz = z - vis.prevPos.z;
            if (dx * dx + dz * dz > 0.000001) {
              vis.root.rotation.y = Math.atan2(-dz, dx);
            }
            vis.prevPos.copy(tmpVec);
            vis.root.position.copy(tmpVec);

            const flap = Math.sin(timeSec * 24.0 + v * 1.9) * 0.92;
            vis.wingL.rotation.x = flap;
            vis.wingR.rotation.x = flap;
          } else {
            // Calm perched idle breathing on the flower patch
            vis.root.position.set(
              vis.restPos.x,
              vis.restPos.y + Math.sin(timeSec * 1.85 + vis.phaseOffset) * 0.015,
              vis.restPos.z
            );
            vis.root.rotation.y = vis.restYaw + Math.sin(timeSec * 0.9 + v) * 0.08;
            const slowFlap = 0.45 + Math.sin(timeSec * 2.8 + v * 1.5) * 0.28;
            vis.wingL.rotation.x = slowFlap;
            vis.wingR.rotation.x = slowFlap;
            vis.prevPos.copy(vis.root.position);
          }
        }
      }

      // 6. Grass & Flower sway
      for (let i = 0; i < grassCount; i++) {
        const g = grassBaseData[i];
        const sway = Math.sin(timeSec * 1.65 + g.phase) * 0.075;
        dummy.position.set(g.x, g.y, g.z);
        dummy.rotation.set(g.tiltX + sway, g.rotY, sway * 0.6);
        dummy.scale.set(g.scaleXZ, g.scaleY, g.scaleXZ);
        dummy.updateMatrix();
        grassInstanced.setMatrixAt(i, dummy.matrix);
      }
      grassInstanced.instanceMatrix.needsUpdate = true;

      updateFlowerPatches(timeSec, nowMs);

      // 7. Drifting Pollen Motes & Dandelion Seeds (clamped inside safe vertical band)
      for (let i = 0; i < pollenCount; i++) {
        const pm = pollenData[i];
        const px = pm.baseX + Math.sin(timeSec * pm.speed + pm.phase) * pm.driftAmp;
        const pz = pm.baseZ + Math.cos(timeSec * pm.speed * 0.85 + pm.phase) * pm.driftAmp;
        const py = 0.35 + ((pm.baseY + timeSec * 0.12 * pm.speed) % 3.15);

        dummy.position.set(px, py, pz);
        dummy.rotation.set(timeSec, timeSec * 0.7, 0);
        const pulse = pm.scale * (0.8 + 0.25 * Math.sin(timeSec * 2.5 + pm.phase));
        dummy.scale.setScalar(pulse);
        dummy.updateMatrix();
        pollenInstanced.setMatrixAt(i, dummy.matrix);
      }
      pollenInstanced.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < seedCount; i++) {
        const sd = seedData[i];
        const curA = sd.angle + timeSec * sd.speed;
        const sx = Math.cos(curA) * sd.radius;
        const sz = Math.sin(curA) * sd.radius;
        const sy = sd.baseY + Math.sin(timeSec * 1.1 + sd.bobPhase) * 0.22;

        dummy.position.set(sx, sy, sz);
        dummy.rotation.set(
          Math.sin(timeSec * 1.4 + sd.bobPhase) * 0.22,
          curA,
          Math.cos(timeSec * 1.2 + sd.bobPhase) * 0.22
        );
        dummy.scale.setScalar(sd.scale);
        dummy.updateMatrix();
        seedFluffInst.setMatrixAt(i, dummy.matrix);
        seedStemInst.setMatrixAt(i, dummy.matrix);
      }
      seedFluffInst.instanceMatrix.needsUpdate = true;
      seedStemInst.instanceMatrix.needsUpdate = true;

      // 8. Flower Puff Burst Particles
      let puffIdx = 0;
      for (let s = 0; s < puffSlots; s++) {
        const slot = activePuffs[s];
        const age = (nowMs - slot.startTime) * 0.001;
        const active = age >= 0 && age < 1.75;

        for (let p = 0; p < particlesPerPuff; p++) {
          if (!active) {
            dummy.position.set(0, -50, 0);
            dummy.scale.setScalar(0.001);
            dummy.updateMatrix();
            puffInstanced.setMatrixAt(puffIdx++, dummy.matrix);
          } else {
            const d = slot.dirs[p];
            const decel = 1.0 - Math.pow(age / 1.75, 0.65) * 0.55;
            const px = slot.origin.x + d.vx * age * decel;
            const py = slot.origin.y + d.vy * age - 0.32 * age * age;
            const pz = slot.origin.z + d.vz * age * decel;
            const fadeScale = d.scale * Math.sin((age / 1.75) * Math.PI);

            dummy.position.set(px, py, pz);
            dummy.rotation.set(age * d.rotSpeed, age * d.rotSpeed, 0);
            dummy.scale.setScalar(Math.max(0.001, fadeScale));
            dummy.updateMatrix();
            puffInstanced.setMatrixAt(puffIdx, dummy.matrix);
            puffInstanced.setColorAt(puffIdx, slot.color);
            puffIdx++;
          }
        }
      }
      puffInstanced.instanceMatrix.needsUpdate = true;
      if (puffInstanced.instanceColor) puffInstanced.instanceColor.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
