<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beehive - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#d7e2bd; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 18px; z-index:5;
    background: linear-gradient(rgba(70,84,40,.42), rgba(70,84,40,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#fbf7e8; text-transform:uppercase; text-shadow:0 1px 8px rgba(60,72,35,.7); }
  header .rule { width:44px; height:1px; background:rgba(251,247,232,.55); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#fdfaf0; transition:opacity 1.2s ease; text-shadow:0 1px 2px rgba(60,72,35,.85), 0 0 12px rgba(60,72,35,.6); }
  #hint.faded { opacity:.45; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(251,247,232,.55); }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Beehive</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7e2bd);
scene.fog = new THREE.Fog(0xd7e2bd, 55, 130);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);
  camera.updateProjectionMatrix();
}
pickFov();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * 0.52; controls.enablePan = false;

// ---------- lights (warm afternoon sun) ----------
const sun = new THREE.DirectionalLight(0xffe9c2, 2.3);
sun.position.set(10, 16, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13; sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0012;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xe8f0d0, 0x8a7a52, 1.1));

// ---------- seeded rng + noise ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
const rand = (a, b) => a + rng() * (b - a);
function n2(x, z, s) {
  return Math.sin(x * 1.9 + s) * Math.sin(z * 2.2 + s * 0.4)
       + 0.5 * Math.sin(x * 4.3 + z * 2.8 + s + 2.2)
       + 0.25 * Math.sin(x * 7.1 - z * 5.9 + s + 4.1);
}

// ---------- palette ----------
const PAL = {
  grass: 0x6a9a44, grassDeep: 0x527c33, clover: 0x86b45a, strata1: 0x8a6f4d,
  strata2: 0x6b5238, strata3: 0x4a3826, bark: 0x5d4630, leaf: 0x4e7a32,
  leafLight: 0x639241, hive: 0xd9a03c, hiveDark: 0xb57f28, bee: 0xf0c040,
  beeDark: 0x2e2418, poppy: 0xc2452e, daisy: 0xf6f2e2, lavender: 0x8a6fc0
};

const SLAB_HALF = 7.5;
const slabGroup = new THREE.Group(); scene.add(slabGroup);

// ---------- strata ----------
{
  const layers = [[PAL.strata1, 0.42, -0.21], [PAL.strata2, 0.52, -0.68], [PAL.strata3, 0.56, -1.22]];
  for (const [color, h, cy] of layers) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(SLAB_HALF*2, h, SLAB_HALF*2),
      new THREE.MeshStandardMaterial({ color, roughness: 0.95, flatShading: true }));
    m.position.y = cy; m.receiveShadow = true; slabGroup.add(m);
  }
}

// ---------- meadow ----------
{
  const g = new THREE.PlaneGeometry(SLAB_HALF*2 - 0.24, SLAB_HALF*2 - 0.24, 52, 52);
  g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const edge = Math.max(Math.abs(x), Math.abs(z)) / (SLAB_HALF - 0.12);
    let y = 0.10 + 0.09 * n2(x * 0.55, z * 0.55, 3.1);
    y -= Math.max(0, edge - 0.86) * 1.4;
    p.setY(i, y);
  }
  g.computeVertexNormals();
  const meadow = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: PAL.grass, roughness: 0.9, flatShading: true }));
  meadow.receiveShadow = true; slabGroup.add(meadow);
}
// clover patches (low-freq, lifted to avoid z-fight)
{
  const clMat = new THREE.MeshStandardMaterial({ color: PAL.clover, roughness: 0.9, transparent: true, opacity: 0.85, flatShading: true });
  for (let i = 0; i < 10; i++) {
    const d = new THREE.Mesh(new THREE.CircleGeometry(rand(0.5, 1.2), 10), clMat);
    d.rotation.x = -Math.PI/2;
    d.position.set(rand(-6, 6), 0.16 + i * 0.004, rand(-6, 6));
    d.scale.set(1, rand(0.5, 0.8), 1);
    d.receiveShadow = true; slabGroup.add(d);
  }
}
// grass tufts
{
  const tuftMat = new THREE.MeshStandardMaterial({ color: PAL.grassDeep, roughness: 0.9, flatShading: true });
  for (let i = 0; i < 60; i++) {
    const t = new THREE.Mesh(new THREE.ConeGeometry(rand(0.04, 0.08), rand(0.14, 0.3), 4), tuftMat);
    t.position.set(rand(-7, 7), 0.22, rand(-7, 7));
    t.rotation.set(rand(-0.2, 0.2), rng() * 6.28, rand(-0.2, 0.2));
    slabGroup.add(t);
  }
}
// wildflowers
{
  const heads = [PAL.poppy, PAL.daisy, PAL.lavender];
  const stemMat = new THREE.MeshStandardMaterial({ color: PAL.grassDeep, roughness: 0.9, flatShading: true });
  for (let i = 0; i < 14; i++) {
    const f = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.34, 4), stemMat);
    stem.position.y = 0.17; f.add(stem);
    const head = new THREE.Mesh(new THREE.SphereGeometry(rand(0.06, 0.1), 6, 5),
      new THREE.MeshStandardMaterial({ color: heads[i % 3], roughness: 0.7, flatShading: true }));
    head.position.y = 0.36; head.castShadow = true; f.add(head);
    const a = rng() * 6.28, r = rand(2, 6.4);
    f.position.set(Math.cos(a) * r, 0.16, Math.sin(a) * r);
    slabGroup.add(f);
  }
}
// mushrooms at the tree base
{
  const stemM = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.85, flatShading: true });
  const capM = new THREE.MeshStandardMaterial({ color: 0xc25a3a, roughness: 0.8, flatShading: true });
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Group();
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.18, 6), stemM);
    st.position.y = 0.09; m.add(st);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.12, 8), capM);
    cap.position.y = 0.22; cap.castShadow = true; m.add(cap);
    m.position.set(-3.4 + rand(-0.7, 0.9), 0.16, -1.7 + rand(-0.6, 0.8));
    slabGroup.add(m);
  }
}
// rocks
{
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8d8578, roughness: 0.9, flatShading: true });
  for (let i = 0; i < 4; i++) {
    const r = rand(0.14, 0.3);
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), rockMat);
    const a = rng() * 6.28, d = rand(4.5, 6.6);
    rock.position.set(Math.cos(a) * d, 0.18 + r * 0.4, Math.sin(a) * d);
    rock.castShadow = true; slabGroup.add(rock);
  }
}

// ---------- tree with hive branch ----------
const HIVE_POS = new THREE.Vector3(-0.6, 2.1, -1.6);
{
  const barkMat = new THREE.MeshStandardMaterial({ color: PAL.bark, roughness: 0.95, flatShading: true });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.55, 3.6, 8), barkMat);
  trunk.position.set(-3.5, 1.95, -2.5); trunk.castShadow = true; slabGroup.add(trunk);
  // branch reaching toward the hive
  const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.2, 3.6, 6), barkMat);
  branch.position.set(-2.1, 3.55, -2.05); branch.rotation.z = 1.32; branch.rotation.y = 0.3;
  branch.castShadow = true; slabGroup.add(branch);
  // foliage blobs
  const leafM1 = new THREE.MeshStandardMaterial({ color: PAL.leaf, roughness: 0.9, flatShading: true });
  const leafM2 = new THREE.MeshStandardMaterial({ color: PAL.leafLight, roughness: 0.9, flatShading: true });
  const blobs = [[-3.5, 4.4, -2.5, 1.9], [-4.8, 3.7, -2.0, 1.3], [-2.4, 4.2, -3.1, 1.4], [-3.3, 5.3, -2.2, 1.3], [-4.2, 4.6, -3.4, 1.1]];
  let bi = 0;
  for (const [x, y, z, r] of blobs) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), bi++ % 2 ? leafM1 : leafM2);
    b.position.set(x, y, z); b.castShadow = true; slabGroup.add(b);
  }
}

// ---------- the hive (banded skep hanging from the branch) ----------
const hiveGroup = new THREE.Group();
{
  const bands = 8;
  for (let i = 0; i < bands; i++) {
    const f = i / (bands - 1);                       // 0 top -> 1 bottom
    const rr = 0.28 + 0.62 * Math.sin(Math.PI * (0.12 + f * 0.82));
    const band = new THREE.Mesh(new THREE.CylinderGeometry(rr * 0.94, rr, 0.24, 10),
      new THREE.MeshStandardMaterial({ color: i % 2 ? PAL.hive : PAL.hiveDark, roughness: 0.8, flatShading: true }));
    band.position.y = 0.95 - i * 0.22;
    band.castShadow = true; hiveGroup.add(band);
  }
  // entrance hole
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.13, 8),
    new THREE.MeshBasicMaterial({ color: 0x2e1f10 }));
  hole.position.set(0, -0.62, 0.86); hiveGroup.add(hole);
  // hex comb decals near the bottom
  const hexMat = new THREE.MeshBasicMaterial({ color: 0xa8781f });
  for (let i = 0; i < 6; i++) {
    const hx = new THREE.Mesh(new THREE.CircleGeometry(0.07, 6), hexMat);
    const a = rand(-0.7, 0.7);
    hx.position.set(Math.sin(a) * 0.8, -0.35 - rand(0, 0.3), Math.cos(a) * 0.8);
    hx.lookAt(hx.position.clone().multiplyScalar(2).add(new THREE.Vector3(0, hx.position.y, 0)));
    hiveGroup.add(hx);
  }
  // hanging cord
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.75, 4),
    new THREE.MeshStandardMaterial({ color: PAL.bark, roughness: 0.95 }));
  cord.position.y = 1.45; hiveGroup.add(cord);
  hiveGroup.position.copy(HIVE_POS);
  slabGroup.add(hiveGroup);
}
// fat invisible tap proxy around the hive
const hiveProxy = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 2.6, 8),
  new THREE.MeshBasicMaterial({ visible: false }));
hiveProxy.position.copy(HIVE_POS);
slabGroup.add(hiveProxy);

// ---------- bees ----------
const bees = [];
{
  const bodyMat = new THREE.MeshStandardMaterial({ color: PAL.bee, roughness: 0.6, flatShading: true });
  const darkMat = new THREE.MeshStandardMaterial({ color: PAL.beeDark, roughness: 0.7, flatShading: true });
  const wingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  for (let i = 0; i < 16; i++) {
    const b = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.09, 7, 6), bodyMat);
    body.scale.set(1.5, 1, 1); b.add(body);
    const s1 = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.028, 4, 8), darkMat);
    s1.rotation.y = Math.PI/2; s1.position.x = 0.02; b.add(s1);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 5), darkMat);
    head.position.x = 0.15; b.add(head);
    const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.09), wingMat);
    w1.position.set(0, 0.09, 0.06); w1.rotation.x = -0.5; b.add(w1);
    const w2 = w1.clone(); w2.position.z = -0.06; w2.rotation.x = 0.5; b.add(w2);
    b.userData = {
      a: rng() * 6.28, r: rand(0.9, 1.8), spd: rand(0.5, 1.3) * (rng() < 0.5 ? 1 : -1),
      dy: rand(-0.5, 0.6), wob: rng() * 6, burstR: rand(2.2, 4.6), w1, w2
    };
    slabGroup.add(b); bees.push(b);
  }
}
// butterflies
const butterflies = [];
{
  const cols = [0xe88fc0, 0xf0e08a, 0x9fc8f0];
  for (let i = 0; i < 3; i++) {
    const b = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ color: cols[i], side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
    const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.12), mat);
    w1.position.x = -0.07; b.add(w1);
    const w2 = w1.clone(); w2.position.x = 0.07; b.add(w2);
    b.userData = { cx: rand(-4, 5), cz: rand(-3, 5), r: rand(0.8, 2), spd: rand(0.25, 0.5), wob: rng() * 6, w1, w2 };
    slabGroup.add(b); butterflies.push(b);
  }
}

// ---------- fit points ----------
const FIT_CENTER = new THREE.Vector3(-0.6, 1.7, -0.6);
const FIT_PTS = [];
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  FIT_PTS.push(new THREE.Vector3(sx * SLAB_HALF, 0.3, sz * SLAB_HALF));
  FIT_PTS.push(new THREE.Vector3(sx * SLAB_HALF, -1.5, sz * SLAB_HALF));
}
FIT_PTS.push(new THREE.Vector3(-3.5, 6.6, -2.5));
FIT_PTS.push(new THREE.Vector3(HIVE_POS.x, HIVE_POS.y + 1.2, HIVE_POS.z));

// ---------- camera fit ----------
function fitDir() {
  const a = innerWidth / innerHeight;
  if (a < 0.62) return new THREE.Vector3(0.14, 0.4, 1).normalize();
  if (a < 0.9) return new THREE.Vector3(0.44, 0.4, 1).normalize();
  return new THREE.Vector3(0.62, 0.42, 1).normalize();
}
const _rel = new THREE.Vector3();
function requiredDistance(right, up, fwd, target) {
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const tanH = Math.tan(Math.atan(Math.tan(fovV/2) * camera.aspect));
  const tanV = Math.tan(fovV/2);
  let d = 4;
  for (const c of FIT_PTS) {
    _rel.copy(c).sub(target);
    const cf = _rel.dot(fwd);
    d = Math.max(d, Math.abs(_rel.dot(right)) / tanH - cf, Math.abs(_rel.dot(up)) / tanV - cf);
  }
  return d;
}
function frameInitialCamera() {
  pickFov();
  const fd = fitDir();
  const fwd = fd.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const dist = requiredDistance(right, up, fwd, FIT_CENTER) * 1.06;
  camera.position.copy(FIT_CENTER).addScaledVector(fd, dist);
  controls.target.copy(FIT_CENTER);
  camera.updateProjectionMatrix(); controls.update();
}
frameInitialCamera();

// ---------- hint ----------
const HINTS = { idle: 'Tap the hive to wake the bees', swarm: 'The bees swarm out' };
function setHint(k) {
  hintEl.textContent = HINTS[k];
  hintEl.classList.toggle('faded', k !== 'idle');
}
setHint('idle');

// ---------- swarm state ----------
let swarmK = 0, swarmTarget = 0, swarmHold = 0;

// ---------- tap ----------
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 7 || performance.now() - downT > 450) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(hiveProxy, false);
  if (!hits.length) return;
  swarmTarget = 1; swarmHold = 2.2;
  setHint('swarm');
  clearTimeout(setHint._t);
  setHint._t = setTimeout(() => setHint('idle'), 7000);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (swarmHold > 0) swarmHold -= dt; else swarmTarget = 0;
  swarmK += (swarmTarget - swarmK) * Math.min(1, dt * (swarmTarget ? 1.6 : 0.7));

  for (const b of bees) {
    const u = b.userData;
    const spd = u.spd * (1 + swarmK * 3.5);
    const a = u.a + t * spd;
    const r = u.r + swarmK * u.burstR;
    b.position.x = HIVE_POS.x + Math.cos(a) * r;
    b.position.z = HIVE_POS.z + Math.sin(a) * r * 0.85;
    b.position.y = HIVE_POS.y + u.dy + 0.15 * Math.sin(t * 2.2 + u.wob) + swarmK * (0.9 + 0.5 * Math.sin(t * 1.7 + u.wob));
    b.rotation.y = -a + (u.spd > 0 ? 0 : Math.PI);
    const flap = 0.5 + 0.45 * Math.sin(t * 42 + u.wob);
    u.w1.rotation.x = -flap; u.w2.rotation.x = flap;
  }
  for (const b of butterflies) {
    const u = b.userData;
    const a = t * u.spd + u.wob;
    b.position.x = u.cx + Math.cos(a) * u.r;
    b.position.z = u.cz + Math.sin(a * 1.3) * u.r;
    b.position.y = 0.7 + 0.3 * Math.sin(t * 1.4 + u.wob);
    b.rotation.y = -a;
    const flap = 0.9 * Math.sin(t * 14 + u.wob);
    u.w1.rotation.y = flap; u.w2.rotation.y = -flap;
  }

  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up2 = new THREE.Vector3().crossVectors(right, fwd).normalize();
  controls.minDistance = Math.min(requiredDistance(right, up2, fwd, controls.target) * 1.04, 26);

  controls.update();
  renderer.render(scene, camera);
}
animate();
// pass 1: beehive initial build - warm meadow, banded skep hive, 16 orbiting bees,
// butterflies, wildflowers; tap hive = swarm burst then settle
</script>
</body>
</html>
