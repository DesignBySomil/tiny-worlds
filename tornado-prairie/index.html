<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tornado prairie — a tiny world</title>
  <style>
    :root {
      --bg-top: #181c22;
      --bg-mid: #222830;
      --bg-bot: #15171b;
      --text-main: #e2dcd0;
      --text-muted: #9a9488;
      --accent-warm: #ffc878;
      --divider: rgba(226, 220, 208, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, var(--bg-mid) 0%, var(--bg-top) 55%, var(--bg-bot) 100%);
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      color: var(--text-main);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #canvas-container.pointer-hover {
      cursor: pointer;
    }

    /* UI Overlay */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 12px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 94vw;
      background: linear-gradient(180deg, rgba(20, 23, 28, 0.72) 0%, rgba(20, 23, 28, 0.35) 75%, rgba(20, 23, 28, 0) 100%);
      padding: 4px 18px 10px;
      border-radius: 12px;
    }

    .title {
      font-size: clamp(1.05rem, 2.5vw, 1.38rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
      line-height: 1.2;
    }

    .subtitle {
      font-size: clamp(0.68rem, 1.6vw, 0.78rem);
      font-style: italic;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .divider {
      width: clamp(72px, 18vw, 120px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--divider), transparent);
      margin: 7px 0 6px;
    }

    .hint {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.62rem, 1.5vw, 0.72rem);
      font-weight: 400;
      letter-spacing: 0.09em;
      color: #b8b1a3;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      line-height: 1.35;
      max-width: 90vw;
    }

    footer {
      text-align: center;
      padding: 6px 16px 2px;
      background: linear-gradient(0deg, rgba(20, 23, 28, 0.65) 0%, rgba(20, 23, 28, 0) 100%);
      border-radius: 10px;
    }

    .footer-text {
      font-size: clamp(0.62rem, 1.4vw, 0.72rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(154, 148, 136, 0.78);
    }

    #fallback-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #181c22;
      color: var(--text-main);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }

    @media (max-height: 600px) {
      .ui-layer {
        padding: 8px 12px 6px;
      }
      .divider {
        margin: 4px 0;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-layer">
    <header id="ui-header">
      <h1 class="title">Tornado prairie</h1>
      <div class="subtitle">a tiny world</div>
      <div class="divider"></div>
      <div class="hint">tap the storm to touch down - tap the barn for shelter</div>
    </header>
    <footer id="ui-footer">
      <div class="footer-text">A tiny world</div>
    </footer>
  </div>

  <div id="fallback-msg">WebGL context unavailable. Please reload or view on a WebGL-enabled browser.</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ------------------------------------------------------------
    // 1. SEEDED RNG (mulberry32) & NOISE HELPERS
    // ------------------------------------------------------------
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const rng = mulberry32(4092026);
    const randRange = (min, max) => min + rng() * (max - min);

    // Deterministic 2D value noise for prairie undulations and strata
    function hash2(x, y) {
      let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function noise2D(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm(x, y, octaves = 3) {
      let v = 0, amp = 0.5, freq = 1;
      for (let i = 0; i < octaves; i++) {
        v += amp * (noise2D(x * freq, y * freq) * 2 - 1);
        freq *= 2.05;
        amp *= 0.5;
      }
      return v;
    }

    // Ground height function across the 11 x 8.5 prairie slab
    const SLAB_W = 11.2;
    const SLAB_D = 8.8;
    const SLAB_H = 1.35;

    function getGroundHeight(x, z) {
      // Gentle rolling prairie swell + slight depression along dirt path
      const roll = Math.sin(x * 0.35 + 0.4) * Math.cos(z * 0.4 - 0.2) * 0.18
                 + fbm(x * 0.25, z * 0.25, 2) * 0.14;
      // Path curve from front-right (+2.2, +4.4) toward barn/farmhouse (-2.5, -1.8)
      const pathCenterX = -0.35 - z * 0.48 + Math.sin(z * 0.55) * 0.45;
      const distToPath = Math.abs(x - pathCenterX);
      const pathDip = Math.exp(-(distToPath * distToPath) / 0.38) * 0.055;
      return roll - pathDip;
    }

    function isNearPath(x, z) {
      const pathCenterX = -0.35 - z * 0.48 + Math.sin(z * 0.55) * 0.45;
      return Math.abs(x - pathCenterX) < 0.36 && z > -2.5 && z < 4.25;
    }

    // ------------------------------------------------------------
    // 2. RENDERER, SCENE, CAMERA & CONTROLS
    // ------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const fallbackEl = document.getElementById('fallback-msg');
    const headerEl = document.getElementById('ui-header');
    const footerEl = document.getElementById('ui-footer');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: true
      });
    } catch (e) {
      fallbackEl.style.display = 'flex';
      throw e;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    // Handle WebGL context loss gracefully
    let contextLost = false;
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      contextLost = true;
    }, false);
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      onResize();
    }, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b2129);
    scene.fog = new THREE.FogExp2(0x1f252d, 0.022);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minPolarAngle = Math.PI * 0.18;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.minAzimuthAngle = -Math.PI * 0.45;
    controls.maxAzimuthAngle = Math.PI * 0.45;

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // ------------------------------------------------------------
    // 3. MOODY STORM LIGHTING & RIM CONTRAST
    // ------------------------------------------------------------
    // Deep charcoal-blue storm light with crisp rim light so forms pop at 320px
    const hemiLight = new THREE.HemisphereLight(0x627386, 0x3b3022, 0.92);
    scene.add(hemiLight);

    // Main directional moody storm sun breaking from low horizon gap
    const dirLight = new THREE.DirectionalLight(0xc8bfa8, 1.45);
    dirLight.position.set(8.5, 13.5, 9.5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 34;
    const dCam = 8.2;
    dirLight.shadow.camera.left = -dCam;
    dirLight.shadow.camera.right = dCam;
    dirLight.shadow.camera.top = dCam;
    dirLight.shadow.camera.bottom = -dCam;
    dirLight.shadow.bias = -0.0008;
    scene.add(dirLight);

    // Cool steel-blue rim light from back-left to carve silhouettes against dark cloud
    const rimLight = new THREE.DirectionalLight(0x7c9ab8, 1.15);
    rimLight.position.set(-10, 8.5, -9);
    scene.add(rimLight);

    // Warm golden bounce under-light from the wheat prairie
    const prairieBounce = new THREE.DirectionalLight(0xb99a45, 0.42);
    prairieBounce.position.set(0, -6, 4);
    scene.add(prairieBounce);

    // Sheet lightning light inside the cloud bank (Interaction 1)
    const lightningLight = new THREE.PointLight(0xd8e8ff, 0, 22, 1.5);
    lightningLight.position.set(1.2, 6.2, 0.4);
    worldGroup.add(lightningLight);

    // Warm shelter point light near farmhouse & barn (Interaction 2 + subtle idle glow)
    const shelterGlowLight = new THREE.PointLight(0xffc878, 0.55, 7.5, 1.8);
    shelterGlowLight.position.set(-2.9, 1.1, -1.5);
    worldGroup.add(shelterGlowLight);

    // ------------------------------------------------------------
    // 4. SHARED MATERIALS
    // ------------------------------------------------------------
    const mats = {
      topSoil: new THREE.MeshStandardMaterial({
        color: 0x4b3b26,
        roughness: 0.95,
        metalness: 0.02,
        flatShading: true
      }),
      strataUpper: new THREE.MeshStandardMaterial({
        color: 0x7a6240,
        roughness: 0.92,
        flatShading: true
      }),
      strataLower: new THREE.MeshStandardMaterial({
        color: 0x6e5638,
        roughness: 0.95,
        flatShading: true
      }),
      strataBase: new THREE.MeshStandardMaterial({
        color: 0x4f3d27,
        roughness: 0.96,
        flatShading: true
      }),
      rockClast: new THREE.MeshStandardMaterial({
        color: 0x5c5346,
        roughness: 0.88,
        flatShading: true
      }),
      barnRed: new THREE.MeshStandardMaterial({
        color: 0x9c3d32,
        roughness: 0.82,
        flatShading: true
      }),
      barnRedDark: new THREE.MeshStandardMaterial({
        color: 0x7d2e25,
        roughness: 0.86,
        flatShading: true
      }),
      trimCream: new THREE.MeshStandardMaterial({
        color: 0xd5cbb8,
        roughness: 0.78,
        flatShading: true
      }),
      farmhouseWall: new THREE.MeshStandardMaterial({
        color: 0xc9bfa8,
        roughness: 0.82,
        flatShading: true
      }),
      shingleDark: new THREE.MeshStandardMaterial({
        color: 0x3b3834,
        roughness: 0.88,
        flatShading: true
      }),
      shingleMid: new THREE.MeshStandardMaterial({
        color: 0x4a453f,
        roughness: 0.86,
        flatShading: true
      }),
      weatheredWood: new THREE.MeshStandardMaterial({
        color: 0x685642,
        roughness: 0.9,
        flatShading: true
      }),
      galvanizedSteel: new THREE.MeshStandardMaterial({
        color: 0x8d959c,
        roughness: 0.52,
        metalness: 0.45,
        flatShading: true
      }),
      siloBand: new THREE.MeshStandardMaterial({
        color: 0x484e54,
        roughness: 0.5,
        metalness: 0.6
      }),
      windowGlow: new THREE.MeshStandardMaterial({
        color: 0xffc878,
        emissive: 0xffb852,
        emissiveIntensity: 1.35,
        roughness: 0.3
      }),
      doorLampGlow: new THREE.MeshStandardMaterial({
        color: 0xffe2a8,
        emissive: 0xffc878,
        emissiveIntensity: 0.9,
        roughness: 0.25
      })
    };

    // ------------------------------------------------------------
    // 5. LAYERED PRAIRIE DIORAMA SLAB & DIRT PATH
    // ------------------------------------------------------------
    const slabGroup = new THREE.Group();
    worldGroup.add(slabGroup);

    function buildPrairieSlab() {
      // Top terrain surface mesh with rugged chamfered edges
      const segX = 44, segZ = 36;
      const topGeo = new THREE.PlaneGeometry(SLAB_W, SLAB_D, segX, segZ);
      topGeo.rotateX(-Math.PI / 2);
      const pos = topGeo.attributes.position;
      const colors = [];
      const cSoil = new THREE.Color(0x524129);
      const cPath = new THREE.Color(0x695236);
      const cGrassTint = new THREE.Color(0x6b5832);

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vz = pos.getZ(i);
        const edgeX = Math.abs(vx) / (SLAB_W * 0.5);
        const edgeZ = Math.abs(vz) / (SLAB_D * 0.5);
        const edgeFactor = Math.max(edgeX, edgeZ);

        let y = getGroundHeight(vx, vz);
        if (edgeFactor > 0.92) {
          y -= (edgeFactor - 0.92) * 1.4;
        }
        pos.setY(i, y);

        const nearPath = isNearPath(vx, vz);
        const col = nearPath ? cPath.clone() : cSoil.clone().lerp(cGrassTint, hash2(vx * 3, vz * 3) * 0.5);
        colors.push(col.r, col.g, col.b);
      }
      topGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      topGeo.computeVertexNormals();

      const topMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.95,
        flatShading: true
      });
      const topMesh = new THREE.Mesh(topGeo, topMat);
      topMesh.receiveShadow = true;
      slabGroup.add(topMesh);

      // Three geological dirt strata layers (0x7a6240, 0x6e5638, 0x4f3d27) with chiseled sides
      const strataDefs = [
        { yTop: 0.0, yBot: -0.45, insetTop: 0.04, insetBot: 0.14, mat: mats.strataUpper, jitter: 0.09 },
        { yTop: -0.42, yBot: -0.92, insetTop: 0.12, insetBot: 0.28, mat: mats.strataLower, jitter: 0.12 },
        { yTop: -0.88, yBot: -1.38, insetTop: 0.25, insetBot: 0.46, mat: mats.strataBase, jitter: 0.1 }
      ];

      strataDefs.forEach((layer, idx) => {
        const h = layer.yTop - layer.yBot;
        const boxGeo = new THREE.BoxGeometry(SLAB_W - layer.insetTop * 2, h, SLAB_D - layer.insetTop * 2, 18, 3, 14);
        const bPos = boxGeo.attributes.position;

        for (let i = 0; i < bPos.count; i++) {
          let x = bPos.getX(i);
          let y = bPos.getY(i);
          let z = bPos.getZ(i);

          const normY = (y + h * 0.5) / h; // 0 at bottom, 1 at top
          const taper = 1.0 - (1.0 - normY) * ((layer.insetBot - layer.insetTop) / (SLAB_W * 0.5));
          x *= taper;
          z *= taper;

          // Match top of first stratum to ground height
          if (idx === 0 && normY > 0.85) {
            y += getGroundHeight(x, z) * normY;
          }

          // Rugged rock/earth face modulation
          const n = fbm(x * 0.9 + idx * 7.1, z * 0.9 + y * 1.4, 2);
          const isSide = Math.abs(x) > (SLAB_W * 0.5 - 0.5) || Math.abs(z) > (SLAB_D * 0.5 - 0.5);
          if (isSide) {
            x += n * layer.jitter;
            z += fbm(z * 0.9, x * 0.9 + idx, 2) * layer.jitter;
            y += n * 0.04;
          }

          bPos.setXYZ(i, x, y + (layer.yTop + layer.yBot) * 0.5, z);
        }
        boxGeo.computeVertexNormals();
        const mesh = new THREE.Mesh(boxGeo, layer.mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        slabGroup.add(mesh);
      });

      // Embedded limestone/fieldstone clasts along the cut slab walls
      const rockGeo = new THREE.DodecahedronGeometry(0.14, 0);
      for (let i = 0; i < 28; i++) {
        const side = Math.floor(rng() * 4);
        let rx = 0, rz = 0;
        if (side === 0) { rx = randRange(-SLAB_W * 0.45, SLAB_W * 0.45); rz = SLAB_D * 0.48; }
        else if (side === 1) { rx = randRange(-SLAB_W * 0.45, SLAB_W * 0.45); rz = -SLAB_D * 0.48; }
        else if (side === 2) { rx = SLAB_W * 0.48; rz = randRange(-SLAB_D * 0.45, SLAB_D * 0.45); }
        else { rx = -SLAB_W * 0.48; rz = randRange(-SLAB_D * 0.45, SLAB_D * 0.45); }

        const ry = randRange(-1.15, -0.2);
        const stone = new THREE.Mesh(rockGeo, mats.rockClast);
        stone.position.set(rx, ry, rz);
        stone.scale.set(randRange(0.7, 1.8), randRange(0.4, 0.9), randRange(0.7, 1.5));
        stone.rotation.set(rng() * 3, rng() * 3, rng() * 3);
        slabGroup.add(stone);
      }

      // Dirt path stepping stones / wagon rut pebbles
      for (let z = -2.2; z < 4.1; z += 0.28) {
        const px = -0.35 - z * 0.48 + Math.sin(z * 0.55) * 0.45 + randRange(-0.22, 0.22);
        const py = getGroundHeight(px, z);
        const pebble = new THREE.Mesh(rockGeo, mats.strataUpper);
        pebble.position.set(px, py + 0.01, z);
        pebble.scale.set(randRange(0.4, 0.9), 0.22, randRange(0.4, 0.8));
        pebble.rotation.y = rng() * Math.PI;
        pebble.receiveShadow = true;
        slabGroup.add(pebble);
      }
    }
    buildPrairieSlab();

    // ------------------------------------------------------------
    // 6. DENSE GOLDEN WHEAT FIELD (INSTANCED MULTI-STALK TUFTS)
    // ------------------------------------------------------------
    // Build a custom multi-stalk wheat tuft geometry (5 stalks + heavy grain heads per instance)
    // so 1,850 instances = 9,250 individual golden stalks covering the slab edge to edge.
    function createWheatTuftGeometry() {
      const geometries = [];
      const stalkOffsets = [
        { ox: 0.0, oz: 0.0, leanX: 0.02, leanZ: 0.01, hScale: 1.0, yaw: 0.0 },
        { ox: 0.055, oz: 0.035, leanX: 0.09, leanZ: 0.05, hScale: 0.92, yaw: 0.8 },
        { ox: -0.05, oz: 0.04, leanX: -0.08, leanZ: 0.07, hScale: 0.88, yaw: 2.1 },
        { ox: 0.04, oz: -0.055, leanX: 0.06, leanZ: -0.08, hScale: 0.95, yaw: 3.7 },
        { ox: -0.055, oz: -0.035, leanX: -0.09, leanZ: -0.06, hScale: 0.84, yaw: 5.0 }
      ];

      const positions = [];
      const normals = [];
      const uvs = [];
      const colors = [];

      const cBase = new THREE.Color(0x876c2a);
      const cMid = new THREE.Color(0xb99a45);
      const cTip = new THREE.Color(0xd0b45e);
      const cAwn = new THREE.Color(0xe0c775);

      function pushTri(ax, ay, az, bx, by, bz, cx, cy, cz, colA, colB, colC, hNormA, hNormB, hNormC) {
        positions.push(ax, ay, az, bx, by, bz, cx, cy, cz);
        const abx = bx - ax, aby = by - ay, abz = bz - az;
        const acx = cx - ax, acy = cy - ay, acz = cz - az;
        let nx = aby * acz - abz * acy;
        let ny = abz * acx - abx * acz;
        let nz = abx * acy - aby * acx;
        const len = Math.hypot(nx, ny, nz) || 1;
        nx /= len; ny /= len; nz /= len;
        normals.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
        colors.push(
          colA.r, colA.g, colA.b,
          colB.r, colB.g, colB.b,
          colC.r, colC.g, colC.b
        );
        uvs.push(0.5, hNormA, 0.5, hNormB, 0.5, hNormC);
      }

      stalkOffsets.forEach((st) => {
        const H = 0.62 * st.hScale;
        const w0 = 0.024;
        const w1 = 0.018;
        const wHead = 0.042;
        const cosY = Math.cos(st.yaw);
        const sinY = Math.sin(st.yaw);

        // Two crossed ribbons per stalk + plump grain ear at top
        for (let plane = 0; plane < 2; plane++) {
          const ang = st.yaw + plane * (Math.PI * 0.5);
          const dx = Math.cos(ang);
          const dz = Math.sin(ang);

          // Lower stem segment (0 -> 0.55 H)
          const x0 = st.ox, y0 = 0, z0 = st.oz;
          const x1 = st.ox + st.leanX * 0.45, y1 = H * 0.55, z1 = st.oz + st.leanZ * 0.45;
          // Upper grain ear base (0.55 H -> 0.85 H)
          const x2 = st.ox + st.leanX * 0.85, y2 = H * 0.84, z2 = st.oz + st.leanZ * 0.85;
          // Whisker tip (1.05 H)
          const x3 = st.ox + st.leanX * 1.18, y3 = H * 1.06, z3 = st.oz + st.leanZ * 1.18;

          // Stem quad
          pushTri(
            x0 - dx * w0, y0, z0 - dz * w0,
            x0 + dx * w0, y0, z0 + dz * w0,
            x1 + dx * w1, y1, z1 + dz * w1,
            cBase, cBase, cMid, 0.0, 0.0, 0.55
          );
          pushTri(
            x0 - dx * w0, y0, z0 - dz * w0,
            x1 + dx * w1, y1, z1 + dz * w1,
            x1 - dx * w1, y1, z1 - dz * w1,
            cBase, cMid, cMid, 0.0, 0.55, 0.55
          );

          // Plump wheat head diamond
          pushTri(
            x1 - dx * w1, y1, z1 - dz * w1,
            x1 + dx * w1, y1, z1 + dz * w1,
            x2 + dx * wHead, y2, z2 + dz * wHead,
            cMid, cMid, cTip, 0.55, 0.55, 0.84
          );
          pushTri(
            x1 - dx * w1, y1, z1 - dz * w1,
            x2 + dx * wHead, y2, z2 + dz * wHead,
            x2 - dx * wHead, y2, z2 - dz * wHead,
            cMid, cTip, cTip, 0.55, 0.84, 0.84
          );

          // Tapered golden crown
          pushTri(
            x2 - dx * wHead, y2, z2 - dz * wHead,
            x2 + dx * wHead, y2, z2 + dz * wHead,
            x3, y3, z3,
            cTip, cTip, cAwn, 0.84, 0.84, 1.0
          );
        }
      });

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geo;
    }

    const wheatUniforms = {
      uTime: { value: 0 },
      uFunnelPos: { value: new THREE.Vector3(1.15, 0, 0.45) },
      uTouchdown: { value: 0.0 },
      uSwirlRadius: { value: 1.55 }
    };

    const wheatMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.78,
      metalness: 0.04,
      side: THREE.DoubleSide
    });

    wheatMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = wheatUniforms.uTime;
      shader.uniforms.uFunnelPos = wheatUniforms.uFunnelPos;
      shader.uniforms.uTouchdown = wheatUniforms.uTouchdown;
      shader.uniforms.uSwirlRadius = wheatUniforms.uSwirlRadius;

      shader.vertexShader = `
        uniform float uTime;
        uniform vec3 uFunnelPos;
        uniform float uTouchdown;
        uniform float uSwirlRadius;
        varying float vHeightFrac;
        varying float vWindHighlight;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        vec3 transformed = vec3(position);
        float h = uv.y;
        float bendFactor = h * h;

        // World position of instance root
            vec4 worldRoot = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            float t = uTime;

            // Base rolling meadow wind
            float windNoise = sin(worldRoot.x * 0.12 + t * 2.4) * cos(worldRoot.z * 0.12 + t * 1.8);
            float gust = sin(worldRoot.x * 0.04 - worldRoot.z * 0.03 + t * 4.5) * 0.5 + 0.5;
            vec2 baseWind = vec2(1.0, 0.35) * (windNoise * 0.35 + gust * 0.65);

            // Tornado vortex suction & tangential swirl
            vec2 toVortex = uFunnelPos.xz - worldRoot.xz;
            float dist = length(toVortex);
            vec2 dirToVortex = dist > 0.001 ? toVortex / dist : vec2(0.0);
            vec2 tangent = vec2(-dirToVortex.y, dirToVortex.x);

            float vortexInfluence = smoothstep(42.0, 4.0, dist);
            vec2 swirlForce = (tangent * 2.2 + dirToVortex * 0.85) * vortexInfluence * (1.5 + 0.5 * sin(t * 12.0 - dist * 0.5));

            // Bend profile scales non-linearly with height along the stalk
            float hFactor = clamp(transformed.y / 1.8, 0.0, 1.0);
            float bendStrength = hFactor * hFactor;

            vec2 totalDisp = (baseWind * 0.45 + swirlForce * 1.45) * bendStrength;
            transformed.xz += totalDisp;
            transformed.y -= length(totalDisp) * 0.28 * hFactor;

            vHeightFrac = hFactor;
            vWindHighlight = clamp(gust * 0.4 + vortexInfluence * 0.9, 0.0, 1.0);
          `
        );

        shader.fragmentShader = `
          varying float vHeightFrac;
          varying float vWindHighlight;
        ` + shader.fragmentShader;

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <color_fragment>',
          `
            #include <color_fragment>
            vec3 rootCol = vec3(0.24, 0.22, 0.09);
            vec3 tipCol  = vec3(0.88, 0.72, 0.26);
            vec3 shimmer = vec3(0.98, 0.88, 0.52);
            vec3 stalkCol = mix(rootCol, tipCol, smoothstep(0.0, 0.85, vHeightFrac));
            stalkCol = mix(stalkCol, shimmer, vWindHighlight * vHeightFrac * 0.65);
            diffuseColor.rgb *= stalkCol;
          `
        );
      };

    const STALK_COUNT = 22000;
    const FIELD_RADIUS = 5.2;
    const stalkGeo = createWheatTuftGeometry();
    const wheatMesh = new THREE.InstancedMesh(stalkGeo, wheatMaterial, STALK_COUNT);
    wheatMesh.castShadow = true;
    wheatMesh.receiveShadow = true;

    const dummy = new THREE.Object3D();
    for (let i = 0; i < STALK_COUNT; i++) {
      const rx = (Math.random() - 0.5) * 10.2;
      const rz = (Math.random() - 0.5) * 7.8;
      const y = getGroundHeight(rx, rz);
      dummy.position.set(rx, y, rz);
      dummy.rotation.set(
        (Math.random() - 0.5) * 0.12,
        Math.random() * Math.PI * 2,
        (Math.random() - 0.5) * 0.12
      );
      const s = 0.75 + Math.random() * 0.55;
      dummy.scale.set(s, s * (0.85 + Math.random() * 0.35), s);

    }
    wheatMesh.instanceMatrix.needsUpdate = true;

    }


    // ==========================================
    // TORNADO FUNNEL & CORE VORTEX SHADER
    // ==========================================
    const tornadoUniforms = {
      uTime: { value: 0 },
      uBasePos: { value: new THREE.Vector3(0, 0, -25) },
      uTopPos: { value: new THREE.Vector3(0, 68, -25) },
      uFunnelColor: { value: new THREE.Color(0x7d8894) },
      uCoreGlow: { value: new THREE.Color(0x6e8599) },
      uLightningFlash: { value: 0.0 }
    };

    let tornadoGroup, funnelMesh, outerSheathMesh, groundDustRing;

    function createTornado() {
      tornadoGroup = new THREE.Group();
      scene.add(tornadoGroup);

      const funnelHeight = 68;
      const radialSegs = 64;
      const heightSegs = 96;

      // Primary dense condensation funnel
      const funnelGeo = new THREE.CylinderGeometry(1.0, 1.0, funnelHeight, radialSegs, heightSegs, true);
      funnelGeo.translate(0, funnelHeight * 0.5, 0);

      const funnelVertexShader = `
        uniform float uTime;
        uniform vec3 uBasePos;
        uniform vec3 uTopPos;
        uniform float uSheathScale;

        varying vec2 vUv;
        varying float vHeightFrac;
        varying vec3 vWorldPos;
        varying vec3 vViewDir;
        varying vec3 vNormalW;
        varying float vNoiseVal;

        // Simplex-style 3D hash noise
        float hash(vec3 p) {
          p = fract(p * 0.3183099 + 0.1);
          p *= 17.0;
          return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }

        float noise3D(vec3 x) {
          vec3 i = floor(x);
          vec3 f = fract(x);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
            mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z
          );
        }

        float fbm(vec3 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 4; i++) {
            v += a * noise3D(p);
            p = p * 2.03 + vec3(13.1, 7.7, 19.3);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vUv = uv;
          float h = clamp(position.y / 68.0, 0.0, 1.0);
          vHeightFrac = h;

          // Classic tornado profile: tight ground touch, gradual mid-column, wide wall-cloud flare at top
          float baseRadius = 1.65;
          float midColumn  = pow(h, 1.35) * 9.5;
          float cloudFlare = pow(smoothstep(0.55, 1.0, h), 2.6) * 26.0;
          float groundFoot = exp(-h * 14.0) * 3.8;
          float targetRadius = (baseRadius + midColumn + cloudFlare + groundFoot) * uSheathScale;

          // Sinuous S-curve spine bending between ground touch point and cloud deck
          float t = uTime;
          vec3 spineOffset = vec3(
            sin(h * 4.5 - t * 1.7) * (3.5 * h * (1.0 - h * 0.4)) + cos(t * 0.8 + h * 2.0) * 1.8 * h,
            0.0,
            cos(h * 3.8 - t * 1.4) * (3.2 * h * (1.0 - h * 0.4))
          );

          vec3 centerLine = mix(uBasePos, uTopPos, h) + spineOffset;

          // Helical twist angle spinning rapidly upward
          float angle = atan(position.z, position.x);
          float swirlSpeed = t * (9.5 - h * 4.0) - h * 18.0;
          vec3 sampleCoord = vec3(cos(angle + swirlSpeed), h * 4.2 - t * 1.8, sin(angle + swirlSpeed)) * 1.6;
          float n = fbm(sampleCoord);
          vNoiseVal = n;

          // Radial turbulence & suction ripples
          float radialDisplacement = (n - 0.45) * (1.4 + h * 4.5) * uSheathScale;
          float finalRadius = max(0.3, targetRadius + radialDisplacement);

          vec3 localRing = vec3(
            cos(angle) * finalRadius,
            position.y,
            sin(angle) * finalRadius
          );

          vec3 displacedPos = vec3(centerLine.x + localRing.x, localRing.y + uBasePos.y, centerLine.z + localRing.z);
          vec4 worldPosition = modelMatrix * vec4(displacedPos, 1.0);
          vWorldPos = worldPosition.xyz;

          vec3 radialNormal = normalize(vec3(cos(angle), -0.18 * (1.0 + h), sin(angle)));
          vNormalW = normalize(mat3(modelMatrix) * radialNormal);
          vViewDir = normalize(cameraPosition - worldPosition.xyz);

          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      const funnelFragmentShader = `
        uniform float uTime;
        uniform vec3 uFunnelColor;
        uniform vec3 uCoreGlow;
        uniform float uLightningFlash;
        uniform float uOpacityScale;

        varying vec2 vUv;
        varying float vHeightFrac;
        varying vec3 vWorldPos;
        varying vec3 vViewDir;
        varying vec3 vNormalW;
        varying float vNoiseVal;

        void main() {
          // Fresnel edge softness so cylinder edges dissolve into storm haze
          float fresnel = abs(dot(normalize(vNormalW), normalize(vViewDir)));
          float edgeFade = pow(clamp(fresnel, 0.0, 1.0), 0.75);

          // Vertical fade at the very bottom ground contact and top cloud merge
          float bottomFade = smoothstep(0.0, 0.06, vHeightFrac);
          float topFade = 1.0 - smoothstep(0.84, 1.0, vHeightFrac);

          // Banded helical cloud streaks
          float bands = sin(vHeightFrac * 42.0 - uTime * 8.0 + vNoiseVal * 9.0) * 0.5 + 0.5;
          float density = clamp((vNoiseVal * 0.75 + bands * 0.25) * 1.6, 0.0, 1.0);

          // Dirt/soil tint sucked up near the base, dark storm slate higher up
          vec3 soilTint = vec3(0.48, 0.38, 0.25);
          vec3 upperCloud = uFunnelColor * (0.75 + 0.55 * vNoiseVal);
          vec3 baseCol = mix(soilTint, upperCloud, smoothstep(0.0, 0.35, vHeightFrac));

          // Internal lightning & sky scatter rim
          float rimLight = pow(1.0 - fresnel, 2.2) * 0.45;
          vec3 lightningCol = vec3(0.65, 0.78, 1.0) * uLightningFlash * (0.35 + 0.65 * (1.0 - density));
          vec3 finalCol = baseCol + uCoreGlow * rimLight + lightningCol;

          float alpha = density * edgeFade * bottomFade * topFade * uOpacityScale;
          if (alpha < 0.01) discard;

          gl_FragColor = vec4(finalCol, clamp(alpha, 0.0, 0.94));
        }
      `;

      const innerMat = new THREE.ShaderMaterial({
        vertexShader: funnelVertexShader,
        fragmentShader: funnelFragmentShader,
        uniforms: {
          ...tornadoUniforms,
          uSheathScale: { value: 1.0 },
          uOpacityScale: { value: 0.92 }
        },
        transparent: true,
        depthWrite: false,

        vertexShader: funnelVertexShader,
        fragmentShader: funnelFragmentShader,
        uniforms: {

          uSheathScale: { value: 1.48 },
          uOpacityScale: { value: 0.42 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      funnelMesh = new THREE.Mesh(funnelGeo, innerMat);
      outerSheathMesh = new THREE.Mesh(funnelGeo, outerMat);

      tornadoGroup.add(outerSheathMesh);

      // Swirling ground debris foot cloud
      const footGeo = new THREE.RingGeometry(0.5, 11.5, 48, 4);
      footGeo.rotateX(-Math.PI / 2);

    createTornado();

    if (scene.fog) {

    // --- STORM SKY & LIGHTING RIG ---
    renderer.toneMappingExposure = 1.65;

    const ambientLight = new THREE.AmbientLight(0x526470, 1.9);

    scene.add(hemiLightStorm);

    const fieldWarmLight = new THREE.PointLight(0xffc966, 2.5, 18, 1.2);

    const wallCloudPuffs = [];

    const cloudMat = new THREE.MeshStandardMaterial({

    });

    for (let i = 0; i < 42; i++) {
      const puff = new THREE.Mesh(cloudGeo, cloudMat);
      const angle = (i / 42) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;

    // --- RAIN STREAKS ---
    const rainCount = 950;
    const rainPositions = new Float32Array(rainCount * 6);
    const rainVel = new Float32Array(rainCount);
    for (let i = 0; i < rainCount; i++) {

    // --- FLYING DEBRIS ---
    const debrisGroup = new THREE.Group();
    scene.add(debrisGroup);
    const debrisItems = [];
    const plankGeo = new THREE.BoxGeometry(0.16, 0.02, 0.05);
    const sheetGeo = new THREE.BoxGeometry(0.14, 0.01, 0.14);
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x6e4e32, roughness: 0.9 });
    const tinMat = new THREE.MeshStandardMaterial({ color: 0x7c858c, roughness: 0.5, metalness: 0.6 });

    for (let i = 0; i < 65; i++) {
      const isTin = i % 3 === 0;
      const mesh = new THREE.Mesh(isTin ? sheetGeo : plankGeo, isTin ? tinMat : woodMat);
      mesh.castShadow = true;

    // --- FARMHOUSE, BARN & FENCE PROPS ---

    function createFarmstead() {

      const silo = new THREE.Mesh(

    // --- INTERACTIONS & HUD ---
    const state = {

    const hud = document.createElement('div');
    hud.style.cssText = 'position:fixed;left:12px;bottom:44px;color:#e6f1f8;font:11px/1.4 system-ui,sans-serif;background:rgba(12,18,24,0.55);padding:5px 10px;border-radius:20px;border:1px solid rgba(140,180,210,0.18);backdrop-filter:blur(4px);user-select:none;pointer-events:none;z-index:3;letter-spacing:0.04em;';
    hud.innerHTML = `<span id="hud-ef"><b>EF3</b> &middot; 155 mph</span>` +
      (('ontouchstart' in window) ? '' : '<span style="opacity:0.55;margin-left:8px;">1-5 EF &middot; L lightning &middot; Space pause</span>');
    document.body.appendChild(hud);
    const hudEf = document.getElementById('hud-ef');
    const efSpeeds = { 1: 105, 2: 130, 3: 155, 4: 185, 5: 225 };

    function triggerLightning() {
      lightningLight.intensity = 10 + Math.random() * 8;
      lightningLight.position.set((Math.random() - 0.5) * 10, 8.8, (Math.random() - 0.5) * 8);
    }


    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '5') {
        state.efScale = parseInt(e.key, 10);
        hudEf.innerHTML = `<b>EF${state.efScale}</b> &middot; ${efSpeeds[state.efScale]} mph`;
      } else if (e.code === 'Space') {
        state.paused = !state.paused;
      } else if (e.key.toLowerCase() === 'c') {
        state.followFunnel = !state.followFunnel;
      } else if (e.key.toLowerCase() === 'l') {
        triggerLightning();
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      state.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      state.pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      state.raycaster.setFromCamera(state.pointer, camera);
      // Shelter payoff: tapping the farmhouse/barn hunkers the farm down -
      // the shelter light flares warm and the storm veers to the far side
      // of the prairie instead of steering toward the farm.
      const farmHits = state.raycaster.intersectObject(propsGroup, true);
      if (farmHits.length > 0) {
        shelterGlowLight.intensity = 4.2;
        state.targetPos.set(4.2, 0, -2.2);
        return;
      }
      const targetMesh =
        typeof prairieSlab !== 'undefined' ? prairieSlab :
        typeof terrainMesh !== 'undefined' ? terrainMesh :
        typeof groundMesh !== 'undefined' ? groundMesh :
        typeof slabMesh !== 'undefined' ? slabMesh :
        typeof worldGroup !== 'undefined' ? worldGroup : scene;
      const hits = state.raycaster.intersectObject(targetMesh, true);
      if (hits.length > 0) {
        state.targetPos.copy(hits[0].point);
        state.targetPos.y = 0;
      }
    });


    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (!state.paused) {
        const efMult = 0.55 + state.efScale * 0.22;
        state.time += dt * efMult;

        // Tornado wandering + steering toward targetPos (scaled to 11x8.5 prairie slab)
        state.wanderAngle += (Math.random() - 0.5) * dt * 1.6;
        state.targetPos.x += Math.cos(state.wanderAngle) * dt * 1.1;
        state.targetPos.z += Math.sin(state.wanderAngle) * dt * 0.9;
        state.targetPos.x = THREE.MathUtils.clamp(state.targetPos.x, -4.6, 4.6);
        state.targetPos.z = THREE.MathUtils.clamp(state.targetPos.z, -3.5, 3.5);

        if (tornadoGroup.position.lengthSq() > 100) {
          tornadoGroup.position.set(-2.5, 0, -1.5);
        }
        tornadoGroup.position.lerp(state.targetPos, dt * 1.8);

        const slabScale = 0.14;
        const scaleTarget = slabScale * (0.65 + state.efScale * 0.16);
        tornadoGroup.scale.set(scaleTarget, slabScale, scaleTarget);

        if (typeof wheatUniforms !== 'undefined') {
          if (wheatUniforms.uFunnelPos) {
            wheatUniforms.uFunnelPos.value.set(
              tornadoGroup.position.x,
              tornadoGroup.position.y,
              tornadoGroup.position.z
            );
          }
          if (wheatUniforms.uTouchdown) {
            wheatUniforms.uTouchdown.value = 0.65 + state.efScale * 0.15;
          }
          if (wheatUniforms.uTime) {
            wheatUniforms.uTime.value = state.time;
          }
        }


        // Animate funnel rings & core
        if (typeof funnelRings !== 'undefined') {
          for (let i = 0; i < funnelRings.length; i++) {
            const ring = funnelRings[i];
            const t = i / funnelRings.length;
            ring.rotation.y -= dt * (6.5 - t * 3.2) * efMult;
            ring.position.x = Math.sin(state.time * 2.8 + t * 5.0) * (0.6 + t * 2.2);
            ring.position.z = Math.cos(state.time * 2.3 + t * 4.5) * (0.6 + t * 2.2);
          }
        }
        if (typeof groundDustRing !== 'undefined') {
          groundDustRing.rotation.y -= dt * 5.5 * efMult;
        }

        // Debris vortex motion
        for (const item of debrisItems) {
          const u = item.userData;
          u.angle += dt * u.angSpeed * efMult;
          u.height += dt * u.vertSpeed * efMult;
          if (u.height > 8.2) u.height = 0.12;
 
         const r = (0.22 + (u.height / 8.2) * 1.5) * (0.65 + state.efScale * 0.16) + u.radiusOffset * 0.25;
          item.position.set(
            tornadoGroup.position.x + Math.cos(u.angle) * r,
            u.height,
            tornadoGroup.position.z + Math.sin(u.angle) * r
          );
          item.rotation.x += dt * u.rotSpeed.x;
          item.rotation.y += dt * u.rotSpeed.y;
          item.rotation.z += dt * u.rotSpeed.z;
        }

        // Wall clouds rotation
        for (const puff of wallCloudPuffs) {
          puff.userData.angle += dt * puff.userData.speed * efMult;
          puff.position.x = tornadoGroup.position.x * 0.35 + Math.cos(puff.userData.angle) * puff.userData.radius;
          puff.position.z = tornadoGroup.position.z * 0.35 + Math.sin(puff.userData.angle) * puff.userData.radius;
        }

        // Rain fall & wind slant
        const posAttr = rainGeo.attributes.position;
        const arr = posAttr.array;
        for (let i = 0; i < rainCount; i++) {
          const idx = i * 6;
          const vy = rainVel[i] * dt;
          const vx = -1.8 * efMult * dt;
          arr[idx] += vx;
          arr[idx + 1] -= vy;
          arr[idx + 3] += vx;
          arr[idx + 4] -= vy;
          if (arr[idx + 1] < 0) {
            const nx = (Math.random() - 0.5) * 14;
            const ny = 8.5 + Math.random() * 1.2;
            const nz = (Math.random() - 0.5) * 11;
            arr[idx] = nx;
            arr[idx + 1] = ny;
            arr[idx + 2] = nz;
            arr[idx + 3] = nx - 0.2 * efMult;
            arr[idx + 4] = ny - 0.55;
            arr[idx + 5] = nz - 0.08;
          }
        }
        posAttr.needsUpdate = true;


        // Spontaneous lightning
        if (Math.random() < 0.008 * efMult) triggerLightning();
        lightningLight.intensity = THREE.MathUtils.lerp(lightningLight.intensity, 0, dt * 12);
        if (shelterGlowLight.intensity > 0.55) {
          shelterGlowLight.intensity = Math.max(0.55, shelterGlowLight.intensity - dt * 1.4);
        }
      }

      if (state.followFunnel && typeof controls !== 'undefined') {
        controls.target.lerp(
          new THREE.Vector3(tornadoGroup.position.x, 3.2, tornadoGroup.position.z),
          dt * 3.0
        );
      }
      if (typeof controls !== 'undefined') controls.update();
      renderer.render(scene, camera);
    }

    // --- CAMERA FRAMING & RESIZE HANDLING ---
    function fitCamera() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      scene.updateMatrixWorld(true);
      const box = new THREE.Box3();
      const tempBox = new THREE.Box3();

      // Frame exclusively to the diorama core (slab, wheat, farmstead, tornado)
      scene.traverse((obj) => {
        if (!obj.isMesh || obj === rainLines) return;
        let p = obj;
        while (p) {
          if (p === skyGroup || p === debrisGroup) return;
          p = p.parent;
        }
        obj.geometry.computeBoundingBox();
        tempBox.copy(obj.geometry.boundingBox).applyMatrix4(obj.matrixWorld);
        box.union(tempBox);
      });

      // Clamp box tightly to core slab footprint & funnel height so stray outliers never push camera back
      box.min.x = Math.max(box.min.x, -5.6);
      box.max.x = Math.min(box.max.x, 5.6);
      box.min.z = Math.max(box.min.z, -4.4);
      box.max.z = Math.min(box.max.z, 4.4);
      box.min.y = Math.max(box.min.y, -0.8);
      box.max.y = Math.min(box.max.y, 7.8);

      if (box.isEmpty()) {
        box.setFromCenterAndSize(new THREE.Vector3(0, 3.2, 0), new THREE.Vector3(11.0, 8.2, 8.5));
      }

      const center = box.getCenter(new THREE.Vector3());

      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov * 0.5) * camera.aspect);

      // Fill portrait frame while keeping top HUD & bottom caption clearance
      const isPortrait = camera.aspect < 1.0;
      // Portrait: allow the wide slab to bleed slightly past the frame edges so
      // the world fills a tall phone screen instead of floating small in the middle
      const usableHeightFrac = isPortrait ? 0.85 : 0.80;
      const usableWidthFrac = isPortrait ? 1.14 : 0.88;

      const viewDir = new THREE.Vector3(0.24, 0.24, 0.94).normalize();
      const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), viewDir).normalize();
      const up = new THREE.Vector3().crossVectors(viewDir, right).normalize();

      const corners = [
        new THREE.Vector3(box.min.x, box.min.y, box.min.z),
        new THREE.Vector3(box.min.x, box.min.y, box.max.z),
        new THREE.Vector3(box.min.x, box.max.y, box.min.z),
        new THREE.Vector3(box.min.x, box.max.y, box.max.z),
        new THREE.Vector3(box.max.x, box.min.y, box.min.z),
        new THREE.Vector3(box.max.x, box.min.y, box.max.z),
        new THREE.Vector3(box.max.x, box.max.y, box.min.z),
        new THREE.Vector3(box.max.x, box.max.y, box.max.z)
      ];

      let maxProjX = 0;
      let maxProjY = 0;
      let maxProjZ = 0;
      for (const c of corners) {
        const rel = c.clone().sub(center);
        maxProjX = Math.max(maxProjX, Math.abs(rel.dot(right)));
        maxProjY = Math.max(maxProjY, Math.abs(rel.dot(up)));
        maxProjZ = Math.max(maxProjZ, Math.abs(rel.dot(viewDir)));
      }

      const distV = (maxProjY / usableHeightFrac) / Math.tan(vFov * 0.5);
      const distH = (maxProjX / usableWidthFrac) / Math.tan(hFov * 0.5);
      const dist = Math.max(distV, distH) + maxProjZ * 0.45;

      const target = center.clone();
      target.y += (camera.aspect < 1.0 ? 0.5 : -0.2);

      camera.position.copy(target).addScaledVector(viewDir, dist);
      camera.near = Math.max(0.1, dist * 0.02);
      camera.far = Math.max(85, dist * 4.0);
      camera.updateProjectionMatrix();

      if (typeof controls !== 'undefined') {
        controls.target.copy(target);
        controls.maxDistance = dist * 2.2;
        controls.minDistance = dist * 0.3;
        controls.update();
      } else {
        camera.lookAt(target);
      }
    }

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      fitCamera();
    });

    fitCamera();
    animate();



  </script>
</body>
</html>
