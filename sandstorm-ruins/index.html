<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
// argon p2 (Gemini 4 Argon rework: portrait occupancy + header clearance)
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- deterministic PRNG ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
function rand(a, b) { return a + rng() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

// ---------- deterministic 2D value noise ----------
function hash2(x, z) {
  let n = Math.imul(x, 374761393) + Math.imul(z, 668265263) + 20261101;
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi);
  const c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, z, octaves = 4) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * noise2(x * freq, z * freq);
    freq *= 2.03;
    amp *= 0.5;
  }
  return val;
}

// ---------- scene, camera, renderer ----------
const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const headerEl = document.querySelector('header');
const footerEl = document.querySelector('footer');
const scene = new THREE.Scene();
const bgBase = new THREE.Color(0xe6c499);
const bgStorm = new THREE.Color(0xb37742);
scene.background = bgBase.clone();
scene.fog = new THREE.FogExp2(0xe6c499, 0.022);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 36 : (a >= 0.62 ? 44 : 52);
  camera.updateProjectionMatrix();
}
pickFov();

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minPolarAngle = Math.PI * 0.12;
controls.minDistance = 4.5;
controls.maxDistance = 28;

// ---------- lighting (warm key + cool sky fill + warm rim) ----------
const sun = new THREE.DirectionalLight(0xffe1b0, 3.1);
sun.position.set(8.5, 11.5, 5.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5.8;
sun.shadow.camera.right = 5.8;
sun.shadow.camera.top = 5.8;
sun.shadow.camera.bottom = -5.8;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 28;
sun.shadow.bias = -0.00045;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xd8e8f8, 0x9c6e44, 1.15);
scene.add(hemi);

const rimLight = new THREE.DirectionalLight(0xffb46e, 1.35);
rimLight.position.set(-8, 4.5, -7);
scene.add(rimLight);

const bounceLight = new THREE.PointLight(0xffaa55, 0.7, 9);
bounceLight.position.set(0, 1.2, 0);
scene.add(bounceLight);

// ---------- procedural textures ----------
function makeSoftTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function makeWispTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 32, 4, 128, 32, 120);
  g.addColorStop(0, 'rgba(248, 222, 182, 0.75)');
  g.addColorStop(0.5, 'rgba(228, 188, 138, 0.35)');
  g.addColorStop(1, 'rgba(210, 165, 112, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 64);
  return new THREE.CanvasTexture(c);
}

function makeSandBumpTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(256, 256);
  for (let y = 0; y < 256; y++) {
    for (let x = 0; x < 256; x++) {
      const ripple = Math.sin(x * 0.35 + Math.sin(y * 0.08) * 3.0) * 0.5 + 0.5;
      const grain = hash2(x, y);
      const v = Math.floor((ripple * 0.65 + grain * 0.35) * 255);
      const idx = (y * 256 + x) * 4;
      img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = v;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  return tex;
}

function makeStoneBumpTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(128, 128);
  for (let y = 0; y < 128; y++) {
    for (let x = 0; x < 128; x++) {
      const strata = Math.sin(y * 0.4 + noise2(x * 0.1, y * 0.1) * 4) * 0.35 + 0.5;
      const pit = noise2(x * 0.35, y * 0.35);
      const v = Math.floor(Math.max(0, Math.min(1, strata * 0.6 + pit * 0.4)) * 255);
      const idx = (y * 128 + x) * 4;
      img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = v;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  return tex;
}

const sandBump = makeSandBumpTexture();
const stoneBump = makeStoneBumpTexture();

// ---------- materials with strong value contrast ----------
const sandMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.92,
  metalness: 0.02,
  bumpMap: sandBump,
  bumpScale: 0.018
});

const stoneDarkMat = new THREE.MeshStandardMaterial({
  color: 0x433326,
  roughness: 0.88,
  metalness: 0.05,
  bumpMap: stoneBump,
  bumpScale: 0.025
});

const stoneMidMat = new THREE.MeshStandardMaterial({
  color: 0x5c4635,
  roughness: 0.85,
  metalness: 0.04,
  bumpMap: stoneBump,
  bumpScale: 0.022
});

const stoneWeatheredMat = new THREE.MeshStandardMaterial({
  color: 0x36281d,
  roughness: 0.94,
  metalness: 0.03,
  bumpMap: stoneBump,
  bumpScale: 0.03
});

const terracottaMat = new THREE.MeshStandardMaterial({
  color: 0x9e472a,
  roughness: 0.72,
  metalness: 0.05,
  bumpMap: stoneBump,
  bumpScale: 0.012
});

const faienceMat = new THREE.MeshStandardMaterial({
  color: 0x228b8d,
  roughness: 0.3,
  metalness: 0.15,
  emissive: 0x0b383b,
  emissiveIntensity: 0.55
});

const goldLeafMat = new THREE.MeshStandardMaterial({
  color: 0xd9a74a,
  roughness: 0.32,
  metalness: 0.78,
  emissive: 0x3a2408,
  emissiveIntensity: 0.25
});

// ---------- terrain height function ----------
function getSandHeight(x, z) {
  const ridge1 = Math.exp(-Math.pow((z + 2.15) * 0.75 + Math.sin(x * 0.65) * 0.35, 2)) * 0.72;
  const ridge2 = Math.exp(-Math.pow((x - 2.1) * 0.7 - (z - 0.6) * 0.4, 2)) * 0.42;
  const ridge3 = Math.exp(-Math.pow((x + 2.0) * 0.8 + (z - 1.5) * 0.5, 2)) * 0.36;
  const courtyard = Math.exp(-(x * x * 0.45 + (z - 0.1) * (z - 0.1) * 0.55)) * -0.18;
  const diag = x * 0.82 + z * 0.57;
  const ripples = Math.sin(diag * 7.5 + fbm(x * 1.4, z * 1.4, 2) * 2.2) * 0.018;
  const detail = (fbm(x * 0.8 + 5, z * 0.8 + 5, 3) - 0.5) * 0.16;
  const edgeDist = Math.max(Math.abs(x), Math.abs(z));
  const edgeMask = THREE.MathUtils.smoothstep(edgeDist, 2.5, 3.25);
  const raw = (ridge1 + ridge2 + ridge3 + courtyard + detail + ripples) * (1 - edgeMask * 0.75);
  return Math.max(-0.04, raw);
}

// ---------- diorama slab + continuous sculpted dune surface ----------
const SLAB_H = 1.4;
const slabGroup = new THREE.Group();
scene.add(slabGroup);

{
  const topGeo = new THREE.PlaneGeometry(6.5, 6.5, 96, 96);
  topGeo.rotateX(-Math.PI / 2);
  const pos = topGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cLight = new THREE.Color(0xf3d7a8);
  const cMid = new THREE.Color(0xe2bc85);
  const cShadow = new THREE.Color(0xc69963);
  const cTmp = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = getSandHeight(x, z);
    pos.setY(i, y);

    const hNorm = THREE.MathUtils.clamp((y + 0.05) / 0.78, 0, 1);
    const nVal = noise2(x * 2.2 + 11, z * 2.2 + 7);
    cTmp.copy(cShadow).lerp(cMid, THREE.MathUtils.clamp(hNorm * 1.3, 0, 1));
    cTmp.lerp(cLight, Math.pow(hNorm, 1.6) * 0.85 + nVal * 0.15);
    colors[i * 3] = cTmp.r;
    colors[i * 3 + 1] = cTmp.g;
    colors[i * 3 + 2] = cTmp.b;
  }
  topGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  topGeo.computeVertexNormals();
  const topMesh = new THREE.Mesh(topGeo, sandMat);
  topMesh.receiveShadow = true;
  topMesh.castShadow = true;
  slabGroup.add(topMesh);

  const collarGeo = new THREE.BoxGeometry(6.54, 0.24, 6.54);
  const collarMat = new THREE.MeshStandardMaterial({ color: 0xc89d66, roughness: 0.92, bumpMap: stoneBump, bumpScale: 0.015 });
  const collar = new THREE.Mesh(collarGeo, collarMat);
  collar.position.y = -0.12;
  collar.receiveShadow = true;
  slabGroup.add(collar);

  const midGeo = new THREE.BoxGeometry(6.48, SLAB_H, 6.48, 24, 12, 24);
  const mPos = midGeo.attributes.position;
  const mCol = new Float32Array(mPos.count * 3);
  const cStrataA = new THREE.Color(0x8c6239);
  const cStrataB = new THREE.Color(0x634326);
  const cStrataC = new THREE.Color(0xa6794b);
  for (let i = 0; i < mPos.count; i++) {
    let vx = mPos.getX(i), vy = mPos.getY(i), vz = mPos.getZ(i);
    const edge = Math.max(Math.abs(vx), Math.abs(vz));
    if (edge > 3.2) {
      const strata = Math.sin(vy * 9.0 + noise2(vx * 1.5, vz * 1.5) * 2.5);
      const inset = (strata * 0.035) + (noise2(vx * 3, vy * 4) - 0.5) * 0.04;
      if (Math.abs(vx) > 3.2) vx += Math.sign(vx) * inset;
      if (Math.abs(vz) > 3.2) vz += Math.sign(vz) * inset;
      mPos.setXYZ(i, vx, vy, vz);
    }
    const band = Math.sin(vy * 8.5 + noise2(vx, vz) * 1.5) * 0.5 + 0.5;
    const c = cStrataA.clone().lerp(cStrataB, band).lerp(cStrataC, Math.max(0, (vy + 0.7) / 1.4) * 0.45);
    mCol[i * 3] = c.r; mCol[i * 3 + 1] = c.g; mCol[i * 3 + 2] = c.b;
  }
  midGeo.setAttribute('color', new THREE.BufferAttribute(mCol, 3));
  midGeo.computeVertexNormals();
  const midMesh = new THREE.Mesh(midGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  midMesh.position.y = -SLAB_H / 2 - 0.2;
  midMesh.castShadow = true;
  midMesh.receiveShadow = true;
  slabGroup.add(midMesh);

  const step1 = new THREE.Mesh(
    new THREE.BoxGeometry(6.74, 0.22, 6.74),
    new THREE.MeshStandardMaterial({ color: 0x4a3420, roughness: 0.9 })
  );
  step1.position.y = -SLAB_H - 0.31;
  step1.receiveShadow = true;
  slabGroup.add(step1);

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(7.0, 0.36, 7.0),
    new THREE.MeshStandardMaterial({ color: 0x332315, roughness: 0.92 })
  );
  base.position.y = -SLAB_H - 0.56;
  base.receiveShadow = true;
  slabGroup.add(base);
}

// ---------- helper: fluted column drum & capital ----------
function makeFlutedCylinder(rTop, rBot, height, radialSegs = 32, heightSegs = 12, flutes = 16, chipAmount = 0.015) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, height, radialSegs, heightSegs);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    const r = Math.hypot(vx, vz);
    if (r > 0.001) {
      const angle = Math.atan2(vz, vx);
      const flute = Math.pow(Math.max(0, Math.cos(angle * flutes)), 1.6) * -0.018;
      const chip = (noise2(angle * 3.5 + vy * 2.2, vy * 4.5 + rTop * 10) - 0.5) * chipAmount;
      const scale = (r + flute + chip) / r;
      pos.setX(i, vx * scale);
      pos.setZ(i, vz * scale);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

const capitalProfile = [
  new THREE.Vector2(0.18, 0.0),
  new THREE.Vector2(0.20, 0.04),
  new THREE.Vector2(0.19, 0.08),
  new THREE.Vector2(0.24, 0.18),
  new THREE.Vector2(0.32, 0.28),
  new THREE.Vector2(0.35, 0.34),
  new THREE.Vector2(0.31, 0.38),
  new THREE.Vector2(0.0, 0.38)
];
const capitalLatheGeo = new THREE.LatheGeometry(capitalProfile, 20);

const baseMoldingProfile = [
  new THREE.Vector2(0.0, 0.0),
  new THREE.Vector2(0.30, 0.0),
  new THREE.Vector2(0.31, 0.07),
  new THREE.Vector2(0.27, 0.13),
  new THREE.Vector2(0.25, 0.19),
  new THREE.Vector2(0.21, 0.22)
];
const baseLatheGeo = new THREE.LatheGeometry(baseMoldingProfile, 20);

// ---------- partially buried courtyard flagstones ----------
{
  const tileGeo = new THREE.BoxGeometry(0.58, 0.09, 0.58);
  for (let gx = -2; gx <= 2; gx++) {
    for (let gz = -2; gz <= 2; gz++) {
      if (rng() < 0.32) continue;
      const tx = gx * 0.66 + rand(-0.05, 0.05);
      const tz = gz * 0.66 + 0.15 + rand(-0.05, 0.05);
      const sh = getSandHeight(tx, tz);
      if (sh > 0.22) continue;
      const tile = new THREE.Mesh(tileGeo, (gx + gz) % 2 === 0 ? stoneMidMat : stoneDarkMat);
      tile.position.set(tx, sh - 0.015 + rand(-0.01, 0.02), tz);
      tile.rotation.set(rand(-0.06, 0.06), rand(-0.08, 0.08), rand(-0.06, 0.06));
      tile.scale.set(rand(0.85, 1.05), 1, rand(0.85, 1.05));
      tile.receiveShadow = true;
      tile.castShadow = true;
      slabGroup.add(tile);
    }
  }
}

// ---------- HERO RUINS: Colonnade & Cracked Architraves ----------
function makeHeroColumn(x, z, h, tiltX, tiltZ, broken, hasBands) {
  const g = new THREE.Group();
  const groundY = getSandHeight(x, z);
  g.position.set(x, groundY - 0.04, z);
  g.rotation.x = tiltX;
  g.rotation.z = tiltZ;

  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.16, 0.66), stoneWeatheredMat);
  plinth.position.y = 0.08;
  plinth.castShadow = true;
  plinth.receiveShadow = true;
  g.add(plinth);

  const torus = new THREE.Mesh(baseLatheGeo, stoneDarkMat);
  torus.position.y = 0.16;
  torus.castShadow = true;
  torus.receiveShadow = true;
  g.add(torus);

  const numDrums = Math.max(2, Math.round(h / 0.55));
  const drumH = h / numDrums;
  let curY = 0.36;
  for (let i = 0; i < numDrums; i++) {
    const t0 = i / numDrums;
    const t1 = (i + 1) / numDrums;
    const rBot = THREE.MathUtils.lerp(0.22, 0.175, t0);
    const rTop = THREE.MathUtils.lerp(0.22, 0.175, t1);
    const drumGeo = makeFlutedCylinder(rTop, rBot, drumH - 0.012, 28, 6, 16, 0.012);
    const drumMat = i % 2 === 0 ? stoneDarkMat : stoneMidMat;
    const drum = new THREE.Mesh(drumGeo, drumMat);
    drum.position.set(rand(-0.012, 0.012), curY + drumH / 2, rand(-0.012, 0.012));
    drum.rotation.y = rand(-0.08, 0.08);
    drum.castShadow = true;
    drum.receiveShadow = true;
    g.add(drum);

    if (hasBands && (i === 1 || i === 2)) {
      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(rTop + 0.012, rBot + 0.012, 0.11, 24),
        i === 1 ? terracottaMat : goldLeafMat
      );
      band.position.y = curY + drumH * 0.5;
      band.castShadow = true;
      g.add(band);
    }
    curY += drumH;
  }

  if (!broken) {
    const cap = new THREE.Mesh(capitalLatheGeo, stoneDarkMat);
    cap.position.y = curY - 0.02;
    cap.castShadow = true;
    cap.receiveShadow = true;
    g.add(cap);

    const abacus = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.14, 0.68), stoneWeatheredMat);
    abacus.position.y = curY + 0.42;
    abacus.castShadow = true;
    abacus.receiveShadow = true;
    g.add(abacus);
  } else {
    for (let k = 0; k < 4; k++) {
      const shard = new THREE.Mesh(
        new THREE.DodecahedronGeometry(rand(0.09, 0.14), 0),
        stoneWeatheredMat
      );
      const ang = (k / 4) * Math.PI * 2 + rand(-0.3, 0.3);
      shard.position.set(Math.cos(ang) * 0.09, curY + rand(-0.02, 0.08), Math.sin(ang) * 0.09);
      shard.scale.set(1, rand(0.8, 1.5), 1);
      shard.castShadow = true;
      g.add(shard);
    }
  }

  slabGroup.add(g);
  return { group: g, topY: groundY - 0.04 + curY + (broken ? 0 : 0.49) };
}

const col1 = makeHeroColumn(-1.85, -1.45, 2.55, 0.01, -0.015, false, true);
const col2 = makeHeroColumn(-0.55, -1.65, 2.05, 0.04, 0.055, true, false);
const col3 = makeHeroColumn(0.68, -1.52, 2.55, -0.015, 0.01, false, true);
const col4 = makeHeroColumn(1.75, -1.30, 1.35, -0.05, -0.11, true, false);

// Cracked segmented architrave lintel spanning col1 to col3

{
  const wallGroup = new THREE.Group();

  wallGroup.rotation.y = 0.52;

    const pierH = side === -1 ? 5 : 4;
    for (let row = 0; row < pierH; row++) {

      const bd = 0.38 + rand(-0.03, 0.03);
      const block = new THREE.Mesh(
        new THREE.BoxGeometry(bw, bh, bd),
        (row + (side > 0 ? 1 : 0)) % 2 === 0 ? stoneDarkMat : stoneMidMat
      );
      block.position.set(side * 0.62 + rand(-0.02, 0.02), row * 0.29 + 0.14, rand(-0.015, 0.015));
      block.rotation.y = rand(-0.03, 0.03);
      block.castShadow = true;
      block.receiveShadow = true;
      wallGroup.add(block);
    }
  }

  for (let row = 0; row < 2; row++) {
    const sill = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.26, 0.36), stoneWeatheredMat);
    sill.position.set(0, row * 0.27 + 0.13, 0);
    sill.castShadow = true;
    sill.receiveShadow = true;
    wallGroup.add(sill);
  }

  const archR = 0.44;
  const archCenterY = 1.05;
  const numVoussoirs = 9;
  for (let i = 0; i < numVoussoirs; i++) {
    if (i === 6 || i === 7) continue;
    const ang = (i / (numVoussoirs - 1)) * Math.PI;
    const vx = -Math.cos(ang) * archR;
    const vy = archCenterY + Math.sin(ang) * archR;
    const isKeystone = i === 4;
    const vw = isKeystone ? 0.20 : 0.16;
    const vh = isKeystone ? 0.28 : 0.22;
    const wedge = new THREE.Mesh(
      new THREE.BoxGeometry(vw, vh, 0.42),
      isKeystone ? terracottaMat : stoneDarkMat
    );
    wedge.position.set(vx, vy, 0);
    wedge.rotation.z = ang - Math.PI / 2;
    wedge.castShadow = true;
    wedge.receiveShadow = true;
    wallGroup.add(wedge);
  }

  slabGroup.add(wallGroup);
}

const camelMat = new THREE.MeshStandardMaterial({ color: 0x4a321e, roughness: 0.88 });
const packMatA = new THREE.MeshStandardMaterial({ color: 0x9c3d24, roughness: 0.75 });
const packMatB = new THREE.MeshStandardMaterial({ color: 0x22787a, roughness: 0.65 });

function createCamelMesh(idx) {
  const root = new THREE.Group();

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.22, 6, 12), camelMat);
  torso.rotation.z = Math.PI / 2;
  torso.position.y = 0.36;
  torso.castShadow = true;
  root.add(torso);

  const hump = new THREE.Mesh(new THREE.SphereGeometry(0.115, 10, 8), camelMat);
  hump.scale.set(1.1, 1.25, 0.88);
  hump.position.set(-0.02, 0.48, 0);
  hump.castShadow = true;
  root.add(hump);

  const pack = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.14, 0.28),
    idx % 2 === 0 ? packMatA : packMatB
  );
  pack.position.set(-0.02, 0.45, 0);
  pack.castShadow = true;
  root.add(pack);

  const goldTrim = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.04, 0.30), goldLeafMat);
  goldTrim.position.set(-0.02, 0.41, 0);
  root.add(goldTrim);

  const neckGroup = new THREE.Group();
  neckGroup.position.set(0.15, 0.36, 0);
  const neck = new THREE.Mesh(new THREE.CapsuleGeometry(0.042, 0.18, 5, 8), camelMat);
  neck.position.set(0.05, 0.10, 0);
  neck.rotation.z = -0.42;
  neck.castShadow = true;
  neckGroup.add(neck);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.065, 0.065), camelMat);
  head.position.set(0.12, 0.22, 0);
  head.castShadow = true;
  neckGroup.add(head);
  root.add(neckGroup);

  const legs = [];
  const legOffsets = [
    [0.11, 0.065], [0.11, -0.065],
    [-0.12, 0.065], [-0.12, -0.065]
  ];
  const legGeo = new THREE.CylinderGeometry(0.024, 0.016, 0.32, 6);
  legGeo.translate(0, -0.16, 0);
  for (const [lx, lz] of legOffsets) {
    const leg = new THREE.Mesh(legGeo, camelMat);
    leg.position.set(lx, 0.32, lz);
    leg.castShadow = true;
    root.add(leg);
    legs.push(leg);
  }

  root.visible = false;
  slabGroup.add(root);
  return { root, legs, neckGroup };
}

for (let i = 0; i < 3; i++) {
  caravan.camels.push(createCamelMesh(i));
}

let tapCount = 0;

function setHint(text, owner) {
  hintEl.textContent = text;
  hintEl.classList.remove('faded');
  hintOwner = owner;
}
function resetHintIf(owner) {
  if (hintOwner === owner) setHint(hintIdle, 'idle');
}
setHint(hintIdle, 'idle');

let storm = { active: false, t0: 0 };
let lastTap = -10;

function summonStorm(now) {
  lastTap = now;
  storm.active = true;
  storm.t0 = now;
  setHint(hintStorm, 'user');
  for (let i = 0; i < 34; i++) {
    const mat = new THREE.SpriteMaterial({ map: gustTex, transparent: true, opacity: 0, depthWrite: false });
    const s = new THREE.Sprite(mat);
    const sc = rand(1.3, 2.7);
    s.scale.set(sc * 1.9, sc, 1);
    s.position.set(-7.2 + rand(-1.2, 1.2), rand(0.25, 4.2), rand(-3.6, 3.6));
    scene.add(s);
    gusts.push({
      s,
      t0: now + rand(0, 1.05),
      dur: rand(2.3, 3.6),
      x0: s.position.x,
      y0: s.position.y
    });
  }
  setTimeout(() => resetHintIf('user'), 5200);
}

function summonCaravan(now) {
  caravan.active = true;
  caravan.t0 = now;
  for (const c of caravan.camels) c.root.visible = true;
}

// ---------- Raycaster & Pointer Interaction ----------
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const stormProxy = new THREE.Mesh(
  new THREE.BoxGeometry(7.2, 6.5, 7.2),
  new THREE.MeshBasicMaterial({ visible: false })
);
stormProxy.position.y = 1.4;
scene.add(stormProxy);

let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX;
  downY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) return;
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(stormProxy, false).length) {
    const now = performance.now() / 1000;
    if (now - lastTap > 1.2) {
      tapCount++;
      summonStorm(now);
      if (!caravan.active || (now - caravan.t0 > caravan.dur * 0.85)) {
        summonCaravan(now);
        if (tapCount % 2 === 0) {
          setHint(hintCaravan, 'user');
        }
      }
    }
  }
});

summonCaravan(performance.now() / 1000 + 0.5);

// ---------- Exact Safe-Area Camera Containment (Portrait Occupancy + Header Clearance) ----------
// Bounds include full pedestal base (-2.05) up through highest bird flight path (4.80)
const fitBox = new THREE.Box3(
  new THREE.Vector3(-3.55, -2.05, -3.55),
  new THREE.Vector3(3.55, 4.80, 3.55)
);

let safeHeaderNdcY = 0.72;

function fitCamera() {
  const w = innerWidth;
  const h = innerHeight;
  camera.aspect = w / h;
  pickFov();

  // Measure actual DOM header & footer heights to guarantee zero overlap at any aspect ratio
  const headerRect = headerEl.getBoundingClientRect();
  const footerRect = footerEl.getBoundingClientRect();
  const isPortrait = camera.aspect < 0.85;

  const topClearPx = Math.max(headerRect.bottom, isPortrait ? 104 : 112) + (isPortrait ? 14 : 26);
  const botClearPx = Math.max(h - footerRect.top, 42) + (isPortrait ? 14 : 20);

  // Convert safe vertical bounds into Normalized Device Coordinates [-1, 1]
  const yTopMax = Math.max(0.25, 1 - 2 * (topClearPx / h));
  const yBotMin = Math.min(-0.25, -1 + 2 * (botClearPx / h));
  safeHeaderNdcY = yTopMax;

  // Horizontal margin: tighter on portrait so the diorama + sky fill most of the tall screen height
  const xMax = isPortrait ? 0.94 : 0.88;

  // Steeper elevation on portrait increases vertical projected footprint of the 3D slab + sky volume
  const dir = (isPortrait
    ? new THREE.Vector3(0.15, 0.64, 1.0)
    : new THREE.Vector3(0.18, 0.48, 1.0)
  ).normalize();

  const corners = [];
  for (const x of [fitBox.min.x, fitBox.max.x])
    for (const y of [fitBox.min.y, fitBox.max.y])
      for (const z of [fitBox.min.z, fitBox.max.z])
        corners.push(new THREE.Vector3(x, y, z));

  const boxCenter = fitBox.getCenter(new THREE.Vector3());
  const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 240);
  probe.position.copy(boxCenter).addScaledVector(dir, 10);
  probe.lookAt(boxCenter);
  probe.updateMatrixWorld();

  // Camera basis vectors in world space
  const camRight = new THREE.Vector3().setFromMatrixColumn(probe.matrixWorld, 0);
  const camUp = new THREE.Vector3().setFromMatrixColumn(probe.matrixWorld, 1);

  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const tanH = tanV * camera.aspect;

  const projCorners = corners.map(c => {
    const rel = c.clone().sub(boxCenter);
    return {
      x: rel.dot(camRight),
      y: rel.dot(camUp),
      z: rel.dot(dir) // distance along camera-to-origin axis
    };
  });

  // Iteratively solve exact vertical camera shift (yShift) and distance (dist) so:
  // 1) Topmost point of fitBox (birds/arch/obelisk) stays strictly <= yTopMax (below header hint pill)
  // 2) Bottommost point of fitBox (full slab base) stays strictly >= yBotMin (above footer)
  // 3) Left/Right corners stay within [-xMax, xMax]
  let yShift = 0;
  let dist = 12;

  for (let iter = 0; iter < 12; iter++) {
    let reqDistV = 0;
    let reqDistH = 0;

    for (const p of projCorners) {
      const py = p.y - yShift;
      if (py > 0) {
        reqDistV = Math.max(reqDistV, p.z + py / (tanV * yTopMax));
      } else {
        reqDistV = Math.max(reqDistV, p.z + (-py) / (tanV * (-yBotMin)));
      }
      reqDistH = Math.max(reqDistH, p.z + Math.abs(p.x) / (tanH * xMax));
    }

    dist = Math.max(reqDistV, reqDistH);

    // Compute actual top and bottom NDC y at this distance, then center them in [yBotMin, yTopMax]
    let maxNdcY = -Infinity;
    let minNdcY = Infinity;
    for (const p of projCorners) {
      const depth = Math.max(0.5, dist - p.z);
      const ndcY = (p.y - yShift) / (depth * tanV);
      if (ndcY > maxNdcY) maxNdcY = ndcY;
      if (ndcY < minNdcY) minNdcY = ndcY;
    }

    const targetMidNdcY = (yTopMax + yBotMin) * 0.5;
    const currentMidNdcY = (maxNdcY + minNdcY) * 0.5;
    yShift += (currentMidNdcY - targetMidNdcY) * dist * tanV * 0.85;
  }

  dist *= 1.02; // subtle breathing room

  const finalTarget = boxCenter.clone().addScaledVector(camUp, yShift);
  controls.target.copy(finalTarget);
  camera.position.copy(finalTarget).addScaledVector(dir, dist);
  camera.lookAt(controls.target);
  controls.update();
}

fitCamera();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitCamera());
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});

// ---------- Wall-Clock Driven Animation Loop ----------
let prevNow = performance.now() / 1000;
const ndcV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  const dt = Math.min(Math.max(now - prevNow, 0.001), 0.1);
  prevNow = now;

  // Storm intensity curve driven strictly by wall-clock
  let stormBoost = 0;
  if (storm.active) {
    const elapsed = now - storm.t0;
    if (elapsed > 5.4) {
      storm.active = false;
    } else {
      const rampIn = THREE.MathUtils.smoothstep(elapsed, 0, 0.65);
      const rampOut = 1 - THREE.MathUtils.smoothstep(elapsed, 3.2, 5.4);
      stormBoost = rampIn * rampOut;
    }
  }

  scene.background.copy(bgBase).lerp(bgStorm, stormBoost * 0.88);
  scene.fog.color.copy(scene.background);
  scene.fog.density = 0.022 + stormBoost * 0.045;
  sunSpr.material.opacity = 0.96 * (1 - stormBoost * 0.68);
  sunHaloSpr.material.opacity = 0.72 * (1 - stormBoost * 0.78) + Math.sin(now * 1.7) * 0.04;
  sun.intensity = 3.1 * (1 - stormBoost * 0.45);

  // Ambient sand grains (smoothly faded before reaching the header zone)
  for (const g of grains) {
    g.s.position.x += g.spd * (1 + stormBoost * 4.5) * dt;
    g.s.position.y += Math.sin(now * g.wob + g.ph) * dt * 0.32;
    if (g.s.position.x > 4.4) {
      g.s.position.x = -4.4;
      g.s.position.y = rand(0.15, 4.65);
    }
    ndcV.copy(g.s.position).project(camera);
    const headerFade = 1 - THREE.MathUtils.smoothstep(ndcV.y, safeHeaderNdcY - 0.12, safeHeaderNdcY);
    g.s.material.opacity = g.baseOp * (1 + stormBoost * 0.65) * headerFade;
  }

  // Ground-skimming wind streamers
  for (const st of groundStreamers) {
    st.s.position.x += st.spd * (1 + stormBoost * 3.8) * dt;
    if (st.s.position.x > 3.1) {
      st.s.position.x = -3.1;
      st.s.position.z = rand(-2.9, 2.9);
    }
    const sy = getSandHeight(st.s.position.x, st.s.position.z);
    st.s.position.y = sy + 0.11 + Math.sin(now * 3.2 + st.ph) * 0.03;
    const edgeFade = 1 - THREE.MathUtils.smoothstep(Math.abs(st.s.position.x), 2.2, 3.1);
    st.s.material.opacity = st.baseOp * edgeFade * (1 + stormBoost * 0.9);
  }

  // High altitude dust wisps (kept clear of header text band)
  for (const w of highWisps) {
    w.s.position.x += w.spd * (1 + stormBoost * 2.5) * dt;
    w.s.position.y = w.y0 + Math.sin(now * 0.6 + w.ph) * 0.12;
    if (w.s.position.x > 5.5) w.s.position.x = -5.5;
    ndcV.copy(w.s.position).project(camera);
    const headerFade = 1 - THREE.MathUtils.smoothstep(ndcV.y, safeHeaderNdcY - 0.15, safeHeaderNdcY - 0.02);
    w.s.material.opacity = w.baseOp * (1 + stormBoost * 0.5) * headerFade;
  }

  // Gust wall sprites (wall-clock lifetime + cleanup)
  for (let i = gusts.length - 1; i >= 0; i--) {
    const gu = gusts[i];
    const t = (now - gu.t0) / gu.dur;
    if (t < 0) continue;
    if (t >= 1) {
      scene.remove(gu.s);
      gu.s.material.dispose();
      gusts.splice(i, 1);
      continue;
    }
    gu.s.position.x = gu.x0 + t * 13.5;
    gu.s.position.y = gu.y0 + Math.sin(t * 9) * 0.24;
    ndcV.copy(gu.s.position).project(camera);
    const headerFade = 1 - THREE.MathUtils.smoothstep(ndcV.y, safeHeaderNdcY - 0.12, safeHeaderNdcY);
    gu.s.material.opacity = Math.sin(Math.min(t * 1.15, 1) * Math.PI) * 0.78 * headerFade;
  }

  // Circling 3D desert birds with banking, wingbeats, and strict header clearance
  for (const b of birds) {
    const a = now * b.spd + b.ph;
    const nx = b.ax + Math.cos(a) * b.r;
    const nz = b.az + Math.sin(a) * b.r;
    const ny = b.ay + Math.sin(now * 0.75 + b.ph) * 0.16;
    b.g.position.set(nx, ny, nz);
    b.g.rotation.y = -a;
    b.g.rotation.z = 0.22;
    const flap = Math.sin(now * b.flapSpd + b.ph) * 0.42;
    b.lw.rotation.z = flap;
    b.rw.rotation.z = -flap;

    // Guarantee birds never visually cross the header text even if user orbits camera
    ndcV.copy(b.g.position).project(camera);
    const birdFade = 1 - THREE.MathUtils.smoothstep(ndcV.y, safeHeaderNdcY - 0.08, safeHeaderNdcY - 0.01);
    b.mat.opacity = birdFade;
    b.g.visible = birdFade > 0.02;
  }

  // Camel Caravan marching along the sweeping background dune ridge (wall-clock driven)
  if (caravan.active) {
    const cElapsed = now - caravan.t0;
    if (cElapsed > caravan.dur + 2.5) {
      caravan.active = false;
      for (const c of caravan.camels) c.root.visible = false;
    } else {
      for (let i = 0; i < caravan.camels.length; i++) {
        const c = caravan.camels[i];
        const u = (cElapsed - i * 1.05) / caravan.dur;
        if (u < 0 || u > 1) {
          c.root.visible = false;
          continue;
        }
        c.root.visible = true;
        const cx = THREE.MathUtils.lerp(-2.95, 2.95, u);
        const cz = -2.05 + Math.sin(cx * 0.75) * 0.38;
        const cy = getSandHeight(cx, cz);
        const nextX = cx + 0.1;
        const nextZ = -2.05 + Math.sin(nextX * 0.75) * 0.38;

        const edgeScale = Math.min(
          THREE.MathUtils.smoothstep(u, 0.0, 0.08),
          1 - THREE.MathUtils.smoothstep(u, 0.92, 1.0)
        ) * 0.68;

        c.root.position.set(cx, cy + Math.abs(Math.sin(now * 5.5 + i)) * 0.018, cz);
        c.root.scale.setScalar(Math.max(0.001, edgeScale));
        c.root.rotation.y = -Math.atan2(nextZ - cz, nextX - cx);

        const stride = now * 5.8 + i * 1.7;
        c.legs[0].rotation.z = Math.sin(stride) * 0.42;
        c.legs[1].rotation.z = -Math.sin(stride) * 0.42;
        c.legs[2].rotation.z = -Math.sin(stride) * 0.38;
        c.legs[3].rotation.z = Math.sin(stride) * 0.38;
        c.neckGroup.rotation.z = Math.sin(stride * 2) * 0.06;
      }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
