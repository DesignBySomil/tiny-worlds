<!DOCTYPE html>

<style>

  body {
    background: linear-gradient(180deg, #4a3a6e 0%, #7a5280 26%, #c46a72 52%, #ef9a6d 72%, #ffd9a3 88%, #ffe9c4 100%);

  #overlay { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 5; }
  #title { font-size: 15px; letter-spacing: 0.42em; text-indent: 0.42em; font-variant: small-caps; color: #fff6e8;
    text-shadow: 0 1px 10px rgba(60,20,40,0.65), 0 0 2px rgba(60,20,40,0.8); }
  #rule { width: 54px; height: 1px; margin: 9px auto 8px; background: linear-gradient(90deg, transparent, rgba(255,230,190,0.85), transparent); }
  #hint { font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em; font-variant: small-caps; color: #ffe9c8;
    opacity: 0.95; transition: opacity 1.2s ease; text-shadow: 0 1px 8px rgba(60,20,40,0.8), 0 0 2px rgba(60,20,40,0.9); }
  #hint.faded { opacity: 0.55; }
  #credit { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 9px; letter-spacing: 0.28em; font-variant: small-caps; color: rgba(255,240,215,0.5); pointer-events: none; z-index: 5;
    text-shadow: 0 1px 6px rgba(60,20,40,0.6); }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="overlay">
  <div id="title">Volcano Island</div>
  <div id="rule"></div>
  <div id="hint">Tap the crater to awaken the mountain</div>
</div>
<div id="credit">a tiny world</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// 3D models: Quaternius nature pack, CC0-1.0 (quaternius.com), via the
// trebeljahr/quaternius-showcase mirror (LICENSES.md verifies CC0 per pack).

const container = document.getElementById('scene');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe08a6d, 34, 78);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 8; controls.maxDistance = 44;
controls.minPolarAngle = Math.PI * 0.16; controls.maxPolarAngle = Math.PI * 0.47;

// pass 13: true bounds fit - solve camera distance so every corner of the
// cutaway box + volcano projects inside NDC margins on any aspect
function frameInitialCamera() {
  const aspect = innerWidth / innerHeight;
  let dir, target;
  if (aspect < 0.78)      { camera.fov = 60; target = new THREE.Vector3(0, 1.6, 0); dir = new THREE.Vector3(15, 15, 22.5); }
  else if (aspect < 1.15) { camera.fov = 46; target = new THREE.Vector3(0, 2.0, 0); dir = new THREE.Vector3(10.5, 7.5, 14.5); }
  else                    { camera.fov = 42; target = new THREE.Vector3(0, 1.3, 0); dir = new THREE.Vector3(16.6, 10.1, 18.5); }
  camera.updateProjectionMatrix();
  dir.normalize();
  const corners = [];
  for (const x of [-8.3, 8.3]) for (const y of [-4.4, 7.2]) for (const z of [-8.3, 8.3])
    corners.push(new THREE.Vector3(x, y, z));
  const mX = 0.90, mY = aspect < 0.78 ? 0.78 : 0.85;  // keep header + caption clear
  let d = 8;
  for (; d < 60; d += 0.25) {
    camera.position.copy(target).addScaledVector(dir, d);
    camera.lookAt(target); camera.updateMatrixWorld(true);
    camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
    let ok = true;
    for (const c of corners) {
      const p = c.clone().project(camera);
      if (Math.abs(p.x) > mX || Math.abs(p.y) > mY) { ok = false; break; }
    }
    if (ok) break;
  }
  controls.target.copy(target); controls.update();
}
frameInitialCamera();

// ---------- lighting ----------
const sun = new THREE.DirectionalLight(0xffd2a1, 1.75);
sun.position.set(9, 11, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13; sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0015;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xd89a8c, 0x4a3a5c, 0.9));
const fill = new THREE.DirectionalLight(0xffc9b0, 0.55);
fill.position.set(-7, 6, 9); scene.add(fill);

const craterLight = new THREE.PointLight(0xff7a33, 0.9, 12, 1.6);
const lavaLight = new THREE.PointLight(0xff6a1f, 0, 10, 1.7);
const hutLight = new THREE.PointLight(0xffca7a, 0.85, 5.5, 1.8);

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
function hash3(x, y, z) {
  const n = Math.sin(Math.round(x * 53) * 127.1 + Math.round(y * 53) * 311.7 + Math.round(z * 53) * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function jitterGeo(geo, amt, keepAboveY = null) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (keepAboveY !== null && y > keepAboveY) continue;
    p.setXYZ(i,
      x + (hash3(x, y, z) - 0.5) * 2 * amt,
      y + (hash3(y, z, x) - 0.5) * 1.2 * amt,
      z + (hash3(z, x, y) - 0.5) * 2 * amt);
  }
  geo.computeVertexNormals();
  return geo;
}
function faceColors(geo, palette, darkenByHeight = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const p = g.attributes.position, cols = [];
  for (let f = 0; f < p.count / 3; f++) {
    const y = (p.getY(f * 3) + p.getY(f * 3 + 1) + p.getY(f * 3 + 2)) / 3;
    const c = palette[Math.floor(Math.random() * palette.length)].clone();
    c.offsetHSL(rand(-0.012, 0.012), rand(-0.04, 0.04), rand(-0.03, 0.03) - y * darkenByHeight);
    for (let v = 0; v < 3; v++) cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
}

// ---------- cutaway block ----------
const block = new THREE.Group(); scene.add(block);
function slab(h, yTop, color, rough = 0.95) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(16, h, 16),
    new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 }));
  m.position.y = yTop - h / 2; m.receiveShadow = true; block.add(m); return m;
}
slab(1.7, -2.5, 0x56443c);            // rock stratum
slab(1.0, -1.5, 0x7a5a40);            // soil
slab(0.5, -1.0, 0xd9bf8f);            // sand shelf
const waterSide = slab(1.0, 0.0, 0x2a7a8e, 0.35); // water body sides
waterSide.material.transparent = true; waterSide.material.opacity = 0.94;
const shadowDisc = new THREE.Mesh(new THREE.CircleGeometry(11.5, 40),
  new THREE.MeshBasicMaterial({ color: 0x241a30, transparent: true, opacity: 0.5 }));
shadowDisc.rotation.x = -Math.PI / 2; shadowDisc.position.y = -4.28; scene.add(shadowDisc);

// ---------- water surface ----------
const waterGeo = new THREE.PlaneGeometry(16, 16, 72, 72);
waterGeo.rotateX(-Math.PI / 2);
const waterBase = waterGeo.attributes.position.array.slice();
{
  const wp0 = waterGeo.attributes.position, wcols = [];
  const deep = new THREE.Color(0x1b5f74), mid = new THREE.Color(0x2f8d8d), shallow = new THREE.Color(0x63c2b2);
  for (let i = 0; i < wp0.count; i++) {
    const x = wp0.getX(i), z = wp0.getZ(i);
    const d = Math.hypot(x, z) - shoreR(Math.atan2(z, x));
    const t = THREE.MathUtils.smoothstep(d, 0.0, 4.2);
    const c = t < 0.5 ? shallow.clone().lerp(mid, t * 2) : mid.clone().lerp(deep, (t - 0.5) * 2);
    c.offsetHSL(0, 0, rand(-0.008, 0.008));
    wcols.push(c.r, c.g, c.b);
  }
  waterGeo.setAttribute('color', new THREE.Float32BufferAttribute(wcols, 3));
}
const water = new THREE.Mesh(waterGeo, new THREE.MeshPhongMaterial({
  vertexColors: true, transparent: true, opacity: 0.92, shininess: 90,
  specular: 0xa8795c, emissive: 0x12333d, flatShading: false }));
water.receiveShadow = true; scene.add(water);

const foamGeo = new THREE.BufferGeometry();
{
  const pts = [], idx = [], SEG = 128;
  for (let i = 0; i <= SEG; i++) {
    const a = (i / SEG) * Math.PI * 2, R = shoreR(a);
    pts.push(Math.cos(a) * (R + 0.05), 0, Math.sin(a) * (R + 0.05),
             Math.cos(a) * (R + 0.42), 0, Math.sin(a) * (R + 0.42));
    if (i < SEG) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
  }
  foamGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  foamGeo.setIndex(idx); foamGeo.computeVertexNormals();
}
const foam = new THREE.Mesh(foamGeo,
  new THREE.MeshBasicMaterial({ color: 0xfff6e6, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
foam.position.y = 0.16; scene.add(foam);

// ---------- island ----------
// pass 11: wet-sand waterline band + desktop bottom-corner camera clearance
const ISLAND_Y = 1.2;
function shoreR(a) { return 5.1 + 0.35 * Math.sin(3 * a + 0.7) + 0.22 * Math.sin(5 * a + 2.1); }
const sideGeo = new THREE.CylinderGeometry(1, 0.94, ISLAND_Y, 96, 6, true);
{
  const p = sideGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
    const a = Math.atan2(z, x), r = shoreR(a) * (y > 0 ? 1 : 0.94);
    const m = Math.hypot(x, z) || 1;
    p.setX(i, x / m * r); p.setZ(i, z / m * r);
  }
  // wet-sand waterline band: darker/cooler near the water, dry sand up top
  const cols = [];
  const dry = new THREE.Color(0xe3c89a), wet = new THREE.Color(0xa8896b);
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) + ISLAND_Y / 2) / ISLAND_Y;   // 0 waterline -> 1 top
    const band = THREE.MathUtils.smoothstep(t, 0.0, 0.55);
    const c = wet.clone().lerp(dry, band);
    c.offsetHSL(0, 0, rand(-0.025, 0.025));
    cols.push(c.r, c.g, c.b);
  }
  sideGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  sideGeo.computeVertexNormals();
}
const islandSide = new THREE.Mesh(sideGeo,
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
islandSide.position.y = ISLAND_Y / 2; islandSide.castShadow = true; islandSide.receiveShadow = true;
scene.add(islandSide);

const topGeo = new THREE.CircleGeometry(1, 96);
topGeo.rotateX(-Math.PI / 2);
{
  const p = topGeo.attributes.position, cols = [];
  const sand = new THREE.Color(0xeed9a4), grass = new THREE.Color(0x79b56a), grass2 = new THREE.Color(0x5d9e58);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const a = Math.atan2(z, x), R = shoreR(a);
    const m = Math.hypot(x, z) || 1;
    const nx = x / m * R * m, nz = z / m * R * m;  // scale unit circle to shore
    p.setX(i, nx); p.setZ(i, nz);
    const rr = m; // 0..1 normalized radius
    let c;
    if (rr < 0.6) c = (Math.random() < 0.5 ? grass : grass2).clone();
    else if (rr < 0.85) c = sand.clone().lerp(grass, (0.85 - rr) / 0.25);
    else c = sand.clone();
    c.offsetHSL(rand(-0.01, 0.01), rand(-0.03, 0.03), rand(-0.03, 0.03));
    cols.push(c.r, c.g, c.b);
    if (rr < 0.7 && rr > 0.02) p.setY(i, rand(0, 0.12));
  }
  topGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  topGeo.computeVertexNormals();
}
const islandTop = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
islandTop.position.y = ISLAND_Y; islandTop.receiveShadow = true; scene.add(islandTop);

// ---------- volcano ----------
const VOLC = new THREE.Vector3(-1.6, ISLAND_Y, -1.5);
const volcGeo = new THREE.CylinderGeometry(0.62, 3.45, 5.0, 12, 7, true);
jitterGeo(volcGeo, 0.24, 2.1);
{ // erosion gullies: radial displacement by angle (periodic -> seam-safe)
  const p = volcGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const a = Math.atan2(z, x), h = (y + 2.5) / 5.0;
    const gully = Math.sin(a * 7 + 1.3) * 0.6 + Math.sin(a * 3 - 0.6) * 0.4;
    const s = 1 + 0.055 * gully * (1 - h * 0.6);
    p.setX(i, x * s); p.setZ(i, z * s);
  }
}
const volcColored = faceColors(volcGeo, [
  new THREE.Color(0x7a4a38), new THREE.Color(0x8a5a40),
  new THREE.Color(0x5f4238), new THREE.Color(0x96684a)], 0.02);
const volcano = new THREE.Mesh(volcColored, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.98, flatShading: true }));
volcano.position.copy(VOLC).add(new THREE.Vector3(0, 2.5, 0));
volcano.castShadow = true; volcano.receiveShadow = true;
scene.add(volcano);
const VOLC_TOP = VOLC.y + 5.0;

// crater rim + ember bowl
const rim = new THREE.Group();
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2 + rand(-0.15, 0.15);
  const chunk = new THREE.Mesh(
    faceColors(jitterGeo(new THREE.IcosahedronGeometry(rand(0.15, 0.24), 0), 0.05),
      [new THREE.Color(0x4a3630), new THREE.Color(0x5a4238)]),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
  chunk.position.set(VOLC.x + Math.cos(a) * 0.72, VOLC_TOP + rand(-0.1, 0.03), VOLC.z + Math.sin(a) * 0.72);
  chunk.castShadow = true; rim.add(chunk);
}
scene.add(rim);
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.3, 0.5, 12, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x2a1c16, roughness: 1, side: THREE.DoubleSide }));
bowl.position.set(VOLC.x, VOLC_TOP - 0.28, VOLC.z); scene.add(bowl);
const ember = new THREE.Mesh(new THREE.CircleGeometry(0.72, 20),
  new THREE.MeshBasicMaterial({ color: 0xff6a2a, transparent: true, opacity: 0.85 }));
ember.rotation.x = -Math.PI / 2; ember.position.set(VOLC.x, VOLC_TOP - 0.22, VOLC.z);
scene.add(ember);
craterLight.position.set(VOLC.x, VOLC_TOP + 0.5, VOLC.z); scene.add(craterLight);

// ---------- palms ----------
const palmLeafMats = [];   // for scorch/regrow
const palmGroups = [];
function makePalm(scale, lean, leafHue) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6242, roughness: 1, flatShading: true });
  let y = 0, xoff = 0;
  for (let s = 0; s < 3; s++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.09 - s * 0.018, 0.11 - s * 0.018, 0.62, 6), trunkMat);
    xoff += lean * 0.16;
    seg.position.set(xoff, y + 0.31, 0); seg.rotation.z = -lean * 0.22;
    seg.castShadow = true; g.add(seg); y += 0.58;
  }
  const leafMat = new THREE.MeshStandardMaterial({ color: leafHue, roughness: 0.9, flatShading: true, side: THREE.DoubleSide });
  palmLeafMats.push({ mat: leafMat, base: leafMat.color.clone() });
  const crownX = xoff + lean * 0.1, crownY = y + 0.08;
  for (let f = 0; f < 7; f++) {
    const a = (f / 7) * Math.PI * 2 + rand(-0.15, 0.15);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.85, 4), leafMat);
    inner.position.set(crownX + Math.cos(a) * 0.3, crownY + 0.1, Math.sin(a) * 0.3);
    inner.rotation.set(Math.sin(a) * 1.05, 0, -Math.cos(a) * 1.05);
    inner.castShadow = true; g.add(inner);
    const outer = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.8, 4), leafMat);
    outer.position.set(crownX + Math.cos(a) * 0.72, crownY - 0.18, Math.sin(a) * 0.72);
    outer.rotation.set(Math.sin(a) * 2.05, 0, -Math.cos(a) * 2.05);
    outer.castShadow = true; g.add(outer);
  }
  for (let c = 0; c < 2; c++) {
    const nut = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0x6e4f2e, roughness: 1 }));
    nut.position.set(crownX + rand(-0.12, 0.12), crownY - 0.14, rand(-0.12, 0.12)); g.add(nut);
  }
  g.scale.setScalar(scale);
  return g;
}
const palmAngles = [10, 32, 56, 78, 97, 185, 205, 225, 246, 268, 290, 312, 335, 152];
const leafTones = [0x4e9a51, 0x67b25f, 0x3f8747];
palmAngles.forEach((deg) => {
  const a = deg * Math.PI / 180, r = rand(2.7, 4.35);
  const palm = makePalm(rand(0.85, 1.35), rand(-1, 1), leafTones[Math.floor(Math.random() * 3)]);
  palm.position.set(Math.cos(a) * r, ISLAND_Y, Math.sin(a) * r);
  palm.rotation.y = rand(0, Math.PI * 2);
  palmGroups.push(palm); scene.add(palm);
});

// ---------- rocks, shrubs, driftwood ----------
const rockTones = [new THREE.Color(0x7a6a5c), new THREE.Color(0x8d7d6d), new THREE.Color(0x655648)];
const rockMeshes = [];
for (let i = 0; i < 8; i++) {
  const a = rand(0, Math.PI * 2), r = rand(3.6, 4.9);
  const rock = new THREE.Mesh(faceColors(jitterGeo(new THREE.IcosahedronGeometry(rand(0.14, 0.3), 0), 0.05), rockTones),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
  rock.position.set(Math.cos(a) * r, ISLAND_Y + 0.05, Math.sin(a) * r);
  rock.castShadow = true; rock.userData.size = rand(0.35, 0.6);
  rockMeshes.push(rock); scene.add(rock);
}
const shrubMeshes = [];
for (let i = 0; i < 10; i++) {
  const a = rand(0, Math.PI * 2), r = rand(2.0, 4.2);
  const shrub = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.12, 0.22), 0),
    new THREE.MeshStandardMaterial({ color: Math.random() < 0.5 ? 0x3f8747 : 0x579a4e, roughness: 1, flatShading: true }));
  shrub.scale.y = 0.65;
  shrub.position.set(Math.cos(a) * r, ISLAND_Y + 0.08, Math.sin(a) * r);
  shrub.castShadow = true; shrubMeshes.push(shrub); scene.add(shrub);
}
for (let i = 0; i < 2; i++) {
  const wood = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, rand(0.7, 1.0), 5),
    new THREE.MeshStandardMaterial({ color: 0x9c8468, roughness: 1 }));
  wood.rotation.set(Math.PI / 2, 0, rand(0, Math.PI));
  wood.position.set(rand(2.5, 4.2), ISLAND_Y + 0.05, rand(3.4, 4.6));
  wood.castShadow = true; scene.add(wood);
}

// ---------- fishing hut + pier + boat ----------
const hut = new THREE.Group();
const plankBase = new THREE.Color(0x9a6b4f);
for (let s = 0; s < 4; s++) {
  const ang = (s / 4) * Math.PI * 2 + Math.PI / 4;
  const stilt = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 1.5, 6),
    new THREE.MeshStandardMaterial({ color: 0x6e4f38, roughness: 1 }));
  stilt.position.set(Math.cos(ang) * 0.55, 0.75, Math.sin(ang) * 0.55);
  stilt.castShadow = true; hut.add(stilt);
}
const floor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 1.5),
  new THREE.MeshStandardMaterial({ color: 0x8a6248, roughness: 1 }));
floor.position.y = 1.5; floor.castShadow = true; hut.add(floor);
for (let side = 0; side < 4; side++) {
  for (let pl = 0; pl < 5; pl++) {
    const c = plankBase.clone().offsetHSL(0, rand(-0.03, 0.03), rand(-0.05, 0.05));
    const plank = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.17, 0.06),
      new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
    plank.position.set(0, 1.68 + pl * 0.17, 0);
    plank.rotation.y = side * Math.PI / 2;
    plank.translateZ(0.72);
    plank.castShadow = true; hut.add(plank);
  }
}

// pass 14: lava form/gradient, smooth water bands, cone gullies, resize refit

// ---------- lava path ----------
const lavaPts = [];
{
  // drape over the actual mesh surfaces: raycast onto the cone, then the ground
  const rc = new THREE.Raycaster();
  const thSea = Math.atan2(5.8 - VOLC.z, -2.4 - VOLC.x);
  const th0 = thSea + 1.15;
  lavaPts.push(new THREE.Vector3(VOLC.x, VOLC_TOP - 0.34, VOLC.z));            // inside the bowl
  lavaPts.push(new THREE.Vector3(VOLC.x + Math.cos(th0) * 0.62, VOLC_TOP - 0.05, VOLC.z + Math.sin(th0) * 0.62)); // over the rim
  const N = 40;
  for (let i = 1; i <= N; i++) {
    const f = i / N;
    const y = VOLC_TOP - 0.2 - f * (VOLC_TOP - ISLAND_Y - 0.15);
    const th = th0 + (thSea - th0) * f + Math.sin(f * 9.0) * 0.15;
    const out = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
    rc.set(new THREE.Vector3(VOLC.x + out.x * 7, y, VOLC.z + out.z * 7),
      out.clone().multiplyScalar(-1).setY(-0.06).normalize());
    const hit = rc.intersectObject(volcano, false)[0];
    if (hit) lavaPts.push(hit.point.clone().addScaledVector(out, 0.045));
  }
  for (const [bx, bz] of [[-2.62, 3.35], [-2.58, 3.7], [-2.55, 4.05], [-2.5, 4.45], [-2.47, 4.85]]) {
    rc.set(new THREE.Vector3(bx, 6, bz), new THREE.Vector3(0, -1, 0));
    const hit = rc.intersectObject(islandTop, false)[0];
    lavaPts.push(hit ? hit.point.clone().add(new THREE.Vector3(0, 0.12, 0))
                     : new THREE.Vector3(bx, 0.5, bz));
  }
  lavaPts.push(new THREE.Vector3(-2.4, 0.12, 5.9));
}
const lavaCurve = new THREE.CatmullRomCurve3(lavaPts);
function buildLavaTube(curve, segs) {
  // proven TubeGeometry frames, then per-ring radius + heat gradient colors
  const g = new THREE.TubeGeometry(curve, segs, 1, 8, false);
  const p = g.attributes.position, R = 8;
  const cTop = new THREE.Color(0xfff6c0), cMid = new THREE.Color(0xff8a26), cToe = new THREE.Color(0xd8480f);
  const cols = new Float32Array(p.count * 3);
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, c0 = curve.getPoint(t);
    const r = 0.14 + 0.07 * t + Math.sin(t * 12.0) * 0.022 + (t > 0.9 ? (t - 0.9) * 1.6 : 0);
    const c = t < 0.22 ? cTop.clone().lerp(cMid, t / 0.22) : cMid.clone().lerp(cToe, (t - 0.22) / 0.78);
    for (let j = 0; j <= R; j++) {
      const vi = i * (R + 1) + j;
      p.setXYZ(vi,
        c0.x + (p.getX(vi) - c0.x) * r,
        c0.y + (p.getY(vi) - c0.y) * r,
        c0.z + (p.getZ(vi) - c0.z) * r);
      cols[vi * 3] = c.r; cols[vi * 3 + 1] = c.g; cols[vi * 3 + 2] = c.b;
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}
const lavaMat = new THREE.MeshBasicMaterial({ vertexColors: true });
lavaMat.color.setScalar(0.35);

// ---------- particles ----------
function makePuffTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.45)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c); return tex;
}
const puffTex = makePuffTexture();
function makePoints(n, size, color, blending, soft) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  const m = new THREE.PointsMaterial({ size, color, transparent: true, opacity: 0.9,
    blending, depthWrite: false, sizeAttenuation: true,
    map: soft ? puffTex : null, alphaMap: soft ? puffTex : null });
  const pts = new THREE.Points(g, m); pts.visible = false; scene.add(pts);
  return { pts, vel: new Float32Array(n * 3), life: new Float32Array(n), n };
}
const embers = makePoints(320, 0.14, 0xffa03f, THREE.AdditiveBlending);
const ash = makePoints(240, 0.1, 0x9a9390, THREE.NormalBlending);
const smoke = makePoints(44, 1.15, 0x453e4c, THREE.NormalBlending, true);
smoke.pts.material.opacity = 0.42;
const steam = makePoints(24, 0.55, 0xf2ede4, THREE.NormalBlending, true);
steam.pts.material.opacity = 0.5;
const steamSrc = lavaCurve.getPoint(1);

function resetParticles() {
  for (const P of [embers, ash, smoke, steam]) {
    P.life.fill(-1);
    const p = P.pts.geometry.attributes.position.array;
    for (let i = 0; i < P.n * 3; i++) p[i] = 0;
    P.pts.geometry.attributes.position.needsUpdate = true;
  }
}
function spawn(P, i, origin, vel, life) {
  const p = P.pts.geometry.attributes.position.array;
  p[i * 3] = origin.x; p[i * 3 + 1] = origin.y; p[i * 3 + 2] = origin.z;
  P.vel[i * 3] = vel.x; P.vel[i * 3 + 1] = vel.y; P.vel[i * 3 + 2] = vel.z;
  P.life[i] = life;
}
const craterMouth = new THREE.Vector3(VOLC.x, VOLC_TOP + 0.1, VOLC.z);

// ---------- eruption state machine ----------
const DUR = { erupt: 34, cool: 16, regrow: 22 };
let state = 'idle', stateT = 0;
const HINTS = {
  idle: 'Tap the crater to awaken the mountain',
  erupt: 'The volcano erupts into the dusk sea',
  cool: 'The lava cools into fresh basalt',
  regrow: 'Life creeps back up the volcanic soil'
};
function setState(s) {
  state = s; stateT = 0;
  hintEl.textContent = HINTS[s]; hintEl.classList.remove('faded');
  clearTimeout(setState._t);
  setState._t = setTimeout(() => hintEl.classList.add('faded'), 6000);
  if (s === 'erupt') {
    lava.visible = true; scorch.visible = true;
    flowBlobs.forEach(b => b.visible = true);
    embers.pts.visible = ash.pts.visible = smoke.pts.visible = true;
    resetParticles();
  }
  if (s === 'cool') steam.pts.visible = true;
  if (s === 'regrow') shoots.forEach(s => s.visible = true);
  if (s === 'idle') {
    lava.visible = false; scorch.visible = false;
    flowBlobs.forEach(b => b.visible = false);
    shoots.forEach(s => { s.visible = false; s.scale.setScalar(0.001); });
  }
}
const scorched = []; // {mat, base} palms near the lava path
palmGroups.forEach((g, gi) => {
  const p = g.position;
  for (let t = 0.2; t <= 1; t += 0.1) {
    const q = lavaCurve.getPoint(t);
    if (Math.hypot(p.x - q.x, p.z - q.z) < 1.5) { scorched.push(gi); break; }
  }
});
const scorchSet = new Set(scorched);

// ---------- tap handling ----------
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (state !== 'idle') return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 7 || performance.now() - downT > 450) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([volcano, rim, ember], true);
  if (hits.length) setState('erupt');
});

// ---------- Quaternius CC0 asset swap ----------
const GLB_BASE = 'https://cdn.jsdelivr.net/gh/trebeljahr/quaternius-showcase@main/public/glb/nature_pack/';
const gltfLoader = new GLTFLoader();
function loadGLB(file) {
  return new Promise(res => gltfLoader.load(GLB_BASE + file, g => res(g.scene), undefined, () => res(null)));
}
function prepClone(src, targetMax, x, y, z, rotY) {
  const c = src.clone(true);
  const box = new THREE.Box3().setFromObject(c);
  const size = box.getSize(new THREE.Vector3());
  c.scale.setScalar(targetMax / Math.max(size.x, size.y, size.z, 0.001));
  const box2 = new THREE.Box3().setFromObject(c);
  c.position.set(x, y - box2.min.y, z);
  c.rotation.y = rotY;
  c.traverse(o => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); } });
  return c;
}
(async () => {
  const [palmA, palmB, rockA, rockB, grassG] = await Promise.all([
    loadGLB('PalmTree_1.glb'), loadGLB('PalmTree_3.glb'),
    loadGLB('Rock_2.glb'), loadGLB('Rock_Moss_1.glb'), loadGLB('Grass.glb')]);
  if (palmA) palmGroups.forEach((g, gi) => {
    const src = (gi % 2 && palmB) ? palmB : palmA;
    const c = prepClone(src, 2.2 * g.scale.x, g.position.x, ISLAND_Y, g.position.z, g.rotation.y);
    let leaf = null;
    c.traverse(o => { if (o.isMesh && !leaf) { const col = o.material.color; if (col && col.g > col.r * 1.05 && col.g > col.b * 1.05) leaf = o.material; } });
    scene.add(c); scene.remove(g); palmGroups[gi] = c;
    if (leaf) palmLeafMats[gi] = { mat: leaf, base: leaf.color.clone() };
  });
  if (rockA) rockMeshes.forEach((g, i) => {
    const src = (i % 2 && rockB) ? rockB : rockA;
    const c = prepClone(src, g.userData.size, g.position.x, ISLAND_Y, g.position.z, rand(0, Math.PI * 2));
    scene.add(c); scene.remove(g);
  });
  if (grassG) shrubMeshes.forEach(g => {
    const c = prepClone(grassG, rand(0.3, 0.45), g.position.x, ISLAND_Y, g.position.z, rand(0, Math.PI * 2));
    scene.add(c); scene.remove(g);
  });
})();

// ---------- animation ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // water waves
  const wp = waterGeo.attributes.position.array;
  for (let i = 0; i < wp.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    wp[i + 1] = Math.sin(x * 2.1 + t * 1.2) * 0.05 + Math.cos(z * 2.7 + t * 1.5) * 0.045 + Math.sin((x + z) * 3.4 + t * 2.1) * 0.028;
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterGeo.computeVertexNormals();
  foam.material.opacity = 0.4 + Math.sin(t * 1.8) * 0.16;
  foam.scale.setScalar(1 + Math.sin(t * 1.8) * 0.012);

  boat.position.y = 0.02 + Math.sin(t * 1.3) * 0.04;
  boat.rotation.z = Math.sin(t * 1.1) * 0.05;
  birds.forEach(b => {
    const u = b.userData, a = t * u.speed + u.phase;
    b.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 0.9 + u.phase) * 0.4, Math.sin(a) * u.r);
    b.rotation.y = -a - Math.PI / 2;
    const flap = Math.sin(t * 7 + u.phase) * 0.4;
    u.w1.rotation.z = 0.35 + flap; u.w2.rotation.z = -0.35 - flap;
  });
  ember.material.opacity = state === 'idle' ? 0.6 + Math.sin(t * 2.2) * 0.25 : 0.95;

  // state machine
  stateT += dt;
  if (state === 'erupt') {
    const k = Math.min(stateT / 6, 1);           // lava advances over 6s
    { const b = 0.68 + 0.32 * k + Math.sin(t * 9) * 0.06; lavaMat.color.setRGB(b, b, b); }
    craterLight.intensity = 0.6 + 2.6 * k + Math.sin(t * 11) * 0.5;
    lavaLight.intensity = 2.1 * k;
    scorchMat.opacity = Math.min(scorchMat.opacity + dt * 0.2, 0.35);
    flowBlobs.forEach((b, i) => {
      const ft = (t * 0.22 + i / 5) % 1;
      if (ft < k) { b.position.copy(lavaCurve.getPoint(ft)); b.visible = true; }
      else b.visible = false;
    });
    // spawn particles
    for (let i = 0; i < embers.n; i++) if (embers.life[i] < 0 && Math.random() < 0.5)
      spawn(embers, i, craterMouth, new THREE.Vector3(rand(-1.0, 1.0), rand(2.4, 4.4), rand(-1.0, 1.0)), rand(1.0, 1.8));
    for (let i = 0; i < ash.n; i++) if (ash.life[i] < 0 && Math.random() < 0.35)
      spawn(ash, i, craterMouth, new THREE.Vector3(rand(0.4, 1.4), rand(1.2, 2.6), rand(-0.5, 0.5)), rand(3.5, 6));
    for (let i = 0; i < smoke.n; i++) if (smoke.life[i] < 0 && Math.random() < 0.3)
      spawn(smoke, i, craterMouth, new THREE.Vector3(rand(-0.3, 0.3) + 0.5, rand(0.8, 1.4), rand(-0.3, 0.3)), rand(3, 5));
    if (stateT > DUR.erupt) setState('cool');
  } else if (state === 'cool') {
    const k = Math.min(stateT / DUR.cool, 1);
    lavaMat.color.setHex(0xffffff).lerp(new THREE.Color(0x2b211c), k);
    craterLight.intensity = 3.2 * (1 - k) + 0.4;
    lavaLight.intensity = 2.1 * (1 - k);
    for (let i = 0; i < steam.n; i++) if (steam.life[i] < 0 && Math.random() < 0.4)
      spawn(steam, i, steamSrc, new THREE.Vector3(rand(-0.2, 0.2), rand(0.5, 1.0), rand(-0.2, 0.2)), rand(1.5, 2.8));
    if (stateT > DUR.cool) { steam.pts.visible = false; setState('regrow'); }
  } else if (state === 'regrow') {
    const k = Math.min(stateT / DUR.regrow, 1);
    scorchMat.opacity = 0.35 * (1 - k);
    shoots.forEach((s, i) => {
      const sk = THREE.MathUtils.clamp((stateT - i * 0.9) / 4, 0, 1);
      s.scale.setScalar(Math.max(sk, 0.001));
    });
    palmLeafMats.forEach((o, i) => {
      if (scorchSet.has(i)) o.mat.color.lerp(o.base, dt * 0.35);
    });
    if (stateT > DUR.regrow) setState('idle');
  }
  if (state === 'erupt' || state === 'cool') {
    // scorch palms during eruption
    const target = state === 'erupt' ? 0.55 : 0;
    palmLeafMats.forEach((o, i) => {
      if (scorchSet.has(i) && state === 'erupt') o.mat.color.lerp(new THREE.Color(0x2b2320), dt * 0.5);
    });
  }

  // integrate particles
  for (const P of [embers, ash, smoke, steam]) {
    if (!P.pts.visible) continue;
    const p = P.pts.geometry.attributes.position.array;
    for (let i = 0; i < P.n; i++) {
      if (P.life[i] < 0) { p[i * 3 + 1] = -100; continue; }
      P.life[i] -= dt;
      p[i * 3] += P.vel[i * 3] * dt;
      p[i * 3 + 1] += P.vel[i * 3 + 1] * dt;
      p[i * 3 + 2] += P.vel[i * 3 + 2] * dt;
      if (P === embers) P.vel[i * 3 + 1] -= 7.5 * dt;
      if (P === smoke) { P.vel[i * 3] += 0.15 * dt; }
    }
    P.pts.geometry.attributes.position.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();   // re-solve bounds fit for the new aspect
});
setTimeout(() => hintEl.classList.add('faded'), 6000);
