<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Volcano Island — a tiny world</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #4a3a6e 0%, #7a5280 26%, #c46a72 52%, #ef9a6d 72%, #ffd9a3 88%, #ffe9c4 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: #fff3e2;
  }
  #scene { position: fixed; inset: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(30,12,28,0.38) 100%); }
  #overlay { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 5; }
  #title { font-size: 15px; letter-spacing: 0.42em; text-indent: 0.42em; font-variant: small-caps; color: #fff6e8;
    text-shadow: 0 1px 10px rgba(60,20,40,0.65), 0 0 2px rgba(60,20,40,0.8); }
  #rule { width: 54px; height: 1px; margin: 9px auto 8px; background: linear-gradient(90deg, transparent, rgba(255,230,190,0.85), transparent); }
  #hint { font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em; font-variant: small-caps; color: #ffe9c8;
    opacity: 0.95; transition: opacity 1.2s ease; text-shadow: 0 1px 8px rgba(60,20,40,0.8), 0 0 2px rgba(60,20,40,0.9); }
  #hint.faded { opacity: 0.55; }
  #credit { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 9px; letter-spacing: 0.28em; font-variant: small-caps; color: rgba(255,240,215,0.5); pointer-events: none; z-index: 5;
    text-shadow: 0 1px 6px rgba(60,20,40,0.6); }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="overlay">
  <div id="title">Volcano Island</div>
  <div id="rule"></div>
  <div id="hint">Tap the crater to awaken the mountain</div>
</div>
<div id="credit">a tiny world</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('scene');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe08a6d, 34, 78);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 8; controls.maxDistance = 34;
controls.minPolarAngle = Math.PI * 0.16; controls.maxPolarAngle = Math.PI * 0.47;

function frameInitialCamera() {
  const aspect = innerWidth / innerHeight;
  if (aspect < 0.78) {
    camera.fov = 55; controls.target.set(0, 2.6, 0);
    camera.position.set(11.5, 12.5, 16.5);
  } else if (aspect < 1.15) {
    camera.fov = 46; controls.target.set(0, 2.0, 0);
    camera.position.set(10.5, 9.5, 14.5);
  } else {
    camera.fov = 42; controls.target.set(0, 1.7, 0);
    camera.position.set(11.2, 7.6, 12.4);
  }
  camera.updateProjectionMatrix(); controls.update();
}
frameInitialCamera();

// ---------- lighting ----------
const sun = new THREE.DirectionalLight(0xffd2a1, 1.75);
sun.position.set(9, 11, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13; sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0015;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xd89a8c, 0x4a3a5c, 0.75));

const craterLight = new THREE.PointLight(0xff7a33, 0.5, 12, 1.6);
const lavaLight = new THREE.PointLight(0xff6a1f, 0, 10, 1.7);
const hutLight = new THREE.PointLight(0xffca7a, 0.85, 5.5, 1.8);

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
function jitterGeo(geo, amt, keepAboveY = null) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    if (keepAboveY !== null && y > keepAboveY) continue;
    p.setXYZ(i, p.getX(i) + rand(-amt, amt), y + rand(-amt * 0.6, amt * 0.6), p.getZ(i) + rand(-amt, amt));
  }
  geo.computeVertexNormals();
  return geo;
}
function faceColors(geo, palette, darkenByHeight = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const p = g.attributes.position, cols = [];
  for (let f = 0; f < p.count / 3; f++) {
    const y = (p.getY(f * 3) + p.getY(f * 3 + 1) + p.getY(f * 3 + 2)) / 3;
    const c = palette[Math.floor(Math.random() * palette.length)].clone();
    c.offsetHSL(rand(-0.012, 0.012), rand(-0.04, 0.04), rand(-0.03, 0.03) - y * darkenByHeight);
    for (let v = 0; v < 3; v++) cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
}

// ---------- cutaway block ----------
const block = new THREE.Group(); scene.add(block);
function slab(h, yTop, color, rough = 0.95) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(16, h, 16),
    new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 }));
  m.position.y = yTop - h / 2; m.receiveShadow = true; block.add(m); return m;
}
slab(1.7, -2.5, 0x56443c);            // rock stratum
slab(1.0, -1.5, 0x7a5a40);            // soil
slab(0.5, -1.0, 0xd9bf8f);            // sand shelf
const waterSide = slab(1.0, 0.0, 0x2a7a8e, 0.35); // water body sides
waterSide.material.transparent = true; waterSide.material.opacity = 0.94;
const shadowDisc = new THREE.Mesh(new THREE.CircleGeometry(11.5, 40),
  new THREE.MeshBasicMaterial({ color: 0x241a30, transparent: true, opacity: 0.5 }));
shadowDisc.rotation.x = -Math.PI / 2; shadowDisc.position.y = -4.28; scene.add(shadowDisc);

// ---------- water surface ----------
const waterGeo = new THREE.PlaneGeometry(16, 16, 44, 44);
waterGeo.rotateX(-Math.PI / 2);
const waterBase = waterGeo.attributes.position.array.slice();
const water = new THREE.Mesh(waterGeo, new THREE.MeshPhongMaterial({
  color: 0x3a9aa8, transparent: true, opacity: 0.9, shininess: 160,
  specular: 0xffd8b0, emissive: 0x113540 }));
water.receiveShadow = true; scene.add(water);

const foam = new THREE.Mesh(new THREE.RingGeometry(5.1, 5.6, 64),
  new THREE.MeshBasicMaterial({ color: 0xfff6e6, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
foam.rotation.x = -Math.PI / 2; foam.position.y = 0.17; scene.add(foam);

// ---------- island ----------
const ISLAND_R = 5.2, ISLAND_Y = 1.2;
const islandSide = new THREE.Mesh(
  new THREE.CylinderGeometry(ISLAND_R, ISLAND_R * 0.94, ISLAND_Y, 56, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xe3c89a, roughness: 1 }));
islandSide.position.y = ISLAND_Y / 2; islandSide.castShadow = true; islandSide.receiveShadow = true;
scene.add(islandSide);

const topGeo = new THREE.CircleGeometry(ISLAND_R, 56);
topGeo.rotateX(-Math.PI / 2);
{
  const p = topGeo.attributes.position, cols = [];
  const sand = new THREE.Color(0xeed9a4), grass = new THREE.Color(0x79b56a), grass2 = new THREE.Color(0x5d9e58);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
    let c;
    if (r < 3.2) c = (Math.random() < 0.5 ? grass : grass2).clone();
    else if (r < 4.4) c = sand.clone().lerp(grass, (4.4 - r) / 1.2);
    else c = sand.clone();
    c.offsetHSL(rand(-0.01, 0.01), rand(-0.03, 0.03), rand(-0.03, 0.03));
    cols.push(c.r, c.g, c.b);
    if (r < 3.6 && r > 0.1) p.setY(i, rand(0, 0.12)); // gentle mounds on the grass
  }
  topGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  topGeo.computeVertexNormals();
}
const islandTop = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
islandTop.position.y = ISLAND_Y; islandTop.receiveShadow = true; scene.add(islandTop);

// ---------- volcano ----------
const VOLC = new THREE.Vector3(-1.2, ISLAND_Y, -1.0);
const volcGeo = new THREE.CylinderGeometry(0.62, 3.45, 5.0, 12, 7, true);
jitterGeo(volcGeo, 0.24, 2.1);
const volcColored = faceColors(volcGeo, [
  new THREE.Color(0x7a4a38), new THREE.Color(0x8a5a40),
  new THREE.Color(0x5f4238), new THREE.Color(0x96684a)], 0.02);
const volcano = new THREE.Mesh(volcColored, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.98, flatShading: true }));
volcano.position.copy(VOLC).add(new THREE.Vector3(0, 2.5, 0));
volcano.castShadow = true; volcano.receiveShadow = true;
scene.add(volcano);
const VOLC_TOP = VOLC.y + 5.0;

// crater rim + ember bowl
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.68, 0.15, 8, 14),
  new THREE.MeshStandardMaterial({ color: 0x5f4238, roughness: 1, flatShading: true }));
rim.rotation.x = Math.PI / 2; rim.position.set(VOLC.x, VOLC_TOP - 0.02, VOLC.z);
rim.castShadow = true; scene.add(rim);
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.3, 0.5, 12, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x2a1c16, roughness: 1, side: THREE.DoubleSide }));
bowl.position.set(VOLC.x, VOLC_TOP - 0.28, VOLC.z); scene.add(bowl);
const ember = new THREE.Mesh(new THREE.CircleGeometry(0.72, 20),
  new THREE.MeshBasicMaterial({ color: 0xff6a2a, transparent: true, opacity: 0.85 }));
ember.rotation.x = -Math.PI / 2; ember.position.set(VOLC.x, VOLC_TOP - 0.34, VOLC.z);
scene.add(ember);
craterLight.position.set(VOLC.x, VOLC_TOP + 0.5, VOLC.z); scene.add(craterLight);

// ---------- palms ----------
const palmLeafMats = [];   // for scorch/regrow
const palmGroups = [];
function makePalm(scale, lean, leafHue) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6242, roughness: 1, flatShading: true });
  let y = 0, xoff = 0;
  for (let s = 0; s < 3; s++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.09 - s * 0.018, 0.11 - s * 0.018, 0.62, 6), trunkMat);
    xoff += lean * 0.16;
    seg.position.set(xoff, y + 0.31, 0); seg.rotation.z = -lean * 0.22;
    seg.castShadow = true; g.add(seg); y += 0.58;
  }
  const leafMat = new THREE.MeshStandardMaterial({ color: leafHue, roughness: 0.9, flatShading: true, side: THREE.DoubleSide });
  palmLeafMats.push({ mat: leafMat, base: leafMat.color.clone() });
  const crownX = xoff + lean * 0.1, crownY = y + 0.08;
  for (let f = 0; f < 6; f++) {
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.12, 1.4, 4), leafMat);
    const a = (f / 6) * Math.PI * 2 + rand(-0.2, 0.2);
    leaf.position.set(crownX + Math.cos(a) * 0.5, crownY - 0.16, Math.sin(a) * 0.5);
    leaf.rotation.set(Math.sin(a) * 1.5, 0, -Math.cos(a) * 1.5);
    leaf.castShadow = true; g.add(leaf);
  }
  for (let c = 0; c < 2; c++) {
    const nut = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0x6e4f2e, roughness: 1 }));
    nut.position.set(crownX + rand(-0.12, 0.12), crownY - 0.14, rand(-0.12, 0.12)); g.add(nut);
  }
  g.scale.setScalar(scale);
  return g;
}
const palmAngles = [10, 32, 56, 78, 97, 185, 205, 225, 246, 268, 290, 312, 335, 152];
const leafTones = [0x4e9a51, 0x67b25f, 0x3f8747];
palmAngles.forEach((deg) => {
  const a = deg * Math.PI / 180, r = rand(2.7, 4.35);
  const palm = makePalm(rand(0.85, 1.35), rand(-1, 1), leafTones[Math.floor(Math.random() * 3)]);
  palm.position.set(Math.cos(a) * r, ISLAND_Y, Math.sin(a) * r);
  palm.rotation.y = rand(0, Math.PI * 2);
  palmGroups.push(palm); scene.add(palm);
});

// ---------- rocks, shrubs, driftwood ----------
const rockTones = [new THREE.Color(0x7a6a5c), new THREE.Color(0x8d7d6d), new THREE.Color(0x655648)];
for (let i = 0; i < 8; i++) {
  const a = rand(0, Math.PI * 2), r = rand(3.6, 4.9);
  const rock = new THREE.Mesh(faceColors(jitterGeo(new THREE.IcosahedronGeometry(rand(0.14, 0.3), 0), 0.05), rockTones),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
  rock.position.set(Math.cos(a) * r, ISLAND_Y + 0.05, Math.sin(a) * r);
  rock.castShadow = true; scene.add(rock);
}
for (let i = 0; i < 10; i++) {
  const a = rand(0, Math.PI * 2), r = rand(2.0, 4.2);
  const shrub = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.12, 0.22), 0),
    new THREE.MeshStandardMaterial({ color: Math.random() < 0.5 ? 0x3f8747 : 0x579a4e, roughness: 1, flatShading: true }));
  shrub.scale.y = 0.65;
  shrub.position.set(Math.cos(a) * r, ISLAND_Y + 0.08, Math.sin(a) * r);
  shrub.castShadow = true; scene.add(shrub);
}
for (let i = 0; i < 2; i++) {
  const wood = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, rand(0.7, 1.0), 5),
    new THREE.MeshStandardMaterial({ color: 0x9c8468, roughness: 1 }));
  wood.rotation.set(Math.PI / 2, 0, rand(0, Math.PI));
  wood.position.set(rand(2.5, 4.2), ISLAND_Y + 0.05, rand(3.4, 4.6));
  wood.castShadow = true; scene.add(wood);
}

// ---------- fishing hut + pier + boat ----------
const hut = new THREE.Group();
const plankBase = new THREE.Color(0x9a6b4f);
for (let s = 0; s < 4; s++) {
  const ang = (s / 4) * Math.PI * 2 + Math.PI / 4;
  const stilt = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 1.5, 6),
    new THREE.MeshStandardMaterial({ color: 0x6e4f38, roughness: 1 }));
  stilt.position.set(Math.cos(ang) * 0.55, 0.75, Math.sin(ang) * 0.55);
  stilt.castShadow = true; hut.add(stilt);
}
const floor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 1.5),
  new THREE.MeshStandardMaterial({ color: 0x8a6248, roughness: 1 }));
floor.position.y = 1.5; floor.castShadow = true; hut.add(floor);
for (let side = 0; side < 4; side++) {
  for (let pl = 0; pl < 5; pl++) {
    const c = plankBase.clone().offsetHSL(0, rand(-0.03, 0.03), rand(-0.05, 0.05));
    const plank = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.17, 0.06),
      new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
    plank.position.set(0, 1.68 + pl * 0.17, 0);
    plank.rotation.y = side * Math.PI / 2;
    plank.translateZ(0.72);
    plank.castShadow = true; hut.add(plank);
  }
}
const roofMat = new THREE.MeshStandardMaterial({ color: 0xc9a86a, roughness: 1, flatShading: true });
const roof1 = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.07, 1.15), roofMat);
roof1.position.set(0, 2.75, -0.45); roof1.rotation.x = 0.62; roof1.castShadow = true; hut.add(roof1);
const roof2 = roof1.clone(); roof2.position.z = 0.45; roof2.rotation.x = -0.62; hut.add(roof2);
const windowGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.3),
  new THREE.MeshBasicMaterial({ color: 0xffd27a }));
windowGlow.position.set(0, 1.95, 0.757); hut.add(windowGlow);
const door = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.6),
  new THREE.MeshStandardMaterial({ color: 0x54382a, roughness: 1 }));
door.position.set(-0.45, 1.85, 0.757); hut.add(door);
hut.position.set(3.75, 0, 2.6);
hut.rotation.y = -0.5;
scene.add(hut);
hutLight.position.set(3.75, 2.0, 3.4); scene.add(hutLight);

const pier = new THREE.Group();
for (let i = 0; i < 6; i++) {
  const plank = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.06, 0.3),
    new THREE.MeshStandardMaterial({ color: plankBase.clone().offsetHSL(0, 0, rand(-0.06, 0.04)), roughness: 1 }));
  plank.position.set(0, 1.32, i * 0.34); plank.castShadow = true; pier.add(plank);
  if (i % 2 === 0) {
    for (const sx of [-0.28, 0.28]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.4, 5),
        new THREE.MeshStandardMaterial({ color: 0x6e4f38, roughness: 1 }));
      post.position.set(sx, 0.66, i * 0.34); pier.add(post);
    }
  }
}
pier.position.set(4.35, 0, 3.3); pier.rotation.y = 0.45;
scene.add(pier);

const boat = new THREE.Group();
const hull = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.55),
  new THREE.MeshStandardMaterial({ color: 0xa8503c, roughness: 0.9, side: THREE.DoubleSide }));
hull.scale.set(1.5, 0.7, 0.8); hull.rotation.x = Math.PI; boat.add(hull);
const bench = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.14),
  new THREE.MeshStandardMaterial({ color: 0x8a6248 }));
bench.position.y = -0.12; boat.add(bench);
boat.position.set(5.3, 0.12, 5.6); boat.rotation.y = 0.8;
scene.add(boat);

// ---------- birds ----------
const birds = [];
for (let i = 0; i < 3; i++) {
  const b = new THREE.Group();
  const wmat = new THREE.MeshBasicMaterial({ color: 0x3a2f3e, side: THREE.DoubleSide });
  const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.14), wmat);
  const w2 = w1.clone();
  w1.position.x = -0.24; w2.position.x = 0.24;
  w1.rotation.z = 0.35; w2.rotation.z = -0.35;
  b.add(w1, w2); b.userData = { w1, w2, phase: rand(0, Math.PI * 2), r: rand(7.5, 9.5), h: rand(7.2, 9.0), speed: rand(0.12, 0.2) };
  birds.push(b); scene.add(b);
}

// ---------- lava path ----------
const lavaPts = [
  new THREE.Vector3(VOLC.x - 0.55, VOLC_TOP - 0.1, VOLC.z + 0.3),
  new THREE.Vector3(VOLC.x - 1.5, VOLC.y + 3.3, VOLC.z + 1.4),
  new THREE.Vector3(VOLC.x - 2.1, VOLC.y + 1.6, VOLC.z + 2.9),
  new THREE.Vector3(-2.8, ISLAND_Y + 0.1, 3.4),
  new THREE.Vector3(-2.6, ISLAND_Y + 0.05, 4.6),
  new THREE.Vector3(-2.4, 0.18, 5.6)
];
const lavaCurve = new THREE.CatmullRomCurve3(lavaPts);
const lavaMat = new THREE.MeshStandardMaterial({
  color: 0x3a1005, emissive: 0xff4a00, emissiveIntensity: 0, roughness: 0.6 });
const lava = new THREE.Mesh(new THREE.TubeGeometry(lavaCurve, 40, 0.15, 6), lavaMat);
lava.visible = false; scene.add(lava);
const lavaMid = lavaCurve.getPoint(0.35);
lavaLight.position.copy(lavaMid).add(new THREE.Vector3(0, 0.6, 0)); scene.add(lavaLight);

// glowing flow pulses travelling down the lava
const flowBlobs = [];
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5),
    new THREE.MeshBasicMaterial({ color: 0xffd23f }));
  b.visible = false; flowBlobs.push(b); scene.add(b);
}

// scorch ribbon along the path
const scorchMat = new THREE.MeshBasicMaterial({ color: 0x1f1815, transparent: true, opacity: 0 });
const scorch = new THREE.Mesh(new THREE.TubeGeometry(lavaCurve, 30, 0.55, 6), scorchMat);
scorch.scale.y = 0.12; scorch.visible = false; scene.add(scorch);

// regrow shoots
const shoots = [];
for (let i = 0; i < 14; i++) {
  const t = 0.3 + (i / 14) * 0.7;
  const pt = lavaCurve.getPoint(t);
  const s = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.22, 5),
    new THREE.MeshStandardMaterial({ color: 0x8fce7a, roughness: 1 }));
  s.position.copy(pt).add(new THREE.Vector3(rand(-0.4, 0.4), 0.02, rand(-0.4, 0.4)));
  s.scale.setScalar(0.001); s.visible = false;
  shoots.push(s); scene.add(s);
}

// ---------- particles ----------
function makePoints(n, size, color, blending) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  const m = new THREE.PointsMaterial({ size, color, transparent: true, opacity: 0.9,
    blending, depthWrite: false, sizeAttenuation: true });
  const pts = new THREE.Points(g, m); pts.visible = false; scene.add(pts);
  return { pts, vel: new Float32Array(n * 3), life: new Float32Array(n), n };
}
const embers = makePoints(320, 0.14, 0xffa03f, THREE.AdditiveBlending);
const ash = makePoints(240, 0.1, 0x9a9390, THREE.NormalBlending);
const smoke = makePoints(26, 0.85, 0x3a3340, THREE.NormalBlending);
smoke.pts.material.opacity = 0.3;
const steam = makePoints(18, 0.4, 0xf2ede4, THREE.NormalBlending);
steam.pts.material.opacity = 0.5;
const steamSrc = lavaCurve.getPoint(1);

function resetParticles() {
  for (const P of [embers, ash, smoke, steam]) {
    P.life.fill(-1);
    const p = P.pts.geometry.attributes.position.array;
    for (let i = 0; i < P.n * 3; i++) p[i] = 0;
    P.pts.geometry.attributes.position.needsUpdate = true;
  }
}
function spawn(P, i, origin, vel, life) {
  const p = P.pts.geometry.attributes.position.array;
  p[i * 3] = origin.x; p[i * 3 + 1] = origin.y; p[i * 3 + 2] = origin.z;
  P.vel[i * 3] = vel.x; P.vel[i * 3 + 1] = vel.y; P.vel[i * 3 + 2] = vel.z;
  P.life[i] = life;
}
const craterMouth = new THREE.Vector3(VOLC.x, VOLC_TOP + 0.1, VOLC.z);

// ---------- eruption state machine ----------
const DUR = { erupt: 34, cool: 16, regrow: 22 };
let state = 'idle', stateT = 0;
const HINTS = {
  idle: 'Tap the crater to awaken the mountain',
  erupt: 'The volcano erupts into the dusk sea',
  cool: 'The lava cools into fresh basalt',
  regrow: 'Life creeps back up the volcanic soil'
};
function setState(s) {
  state = s; stateT = 0;
  hintEl.textContent = HINTS[s]; hintEl.classList.remove('faded');
  clearTimeout(setState._t);
  setState._t = setTimeout(() => hintEl.classList.add('faded'), 6000);
  if (s === 'erupt') {
    lava.visible = true; scorch.visible = true;
    flowBlobs.forEach(b => b.visible = true);
    embers.pts.visible = ash.pts.visible = smoke.pts.visible = true;
    resetParticles();
  }
  if (s === 'cool') steam.pts.visible = true;
  if (s === 'regrow') shoots.forEach(s => s.visible = true);
  if (s === 'idle') {
    lava.visible = false; scorch.visible = false;
    flowBlobs.forEach(b => b.visible = false);
    shoots.forEach(s => { s.visible = false; s.scale.setScalar(0.001); });
  }
}
const scorched = []; // {mat, base} palms near the lava path
palmGroups.forEach((g, gi) => {
  const p = g.position;
  for (let t = 0.2; t <= 1; t += 0.1) {
    const q = lavaCurve.getPoint(t);
    if (Math.hypot(p.x - q.x, p.z - q.z) < 1.5) { scorched.push(gi); break; }
  }
});
const scorchSet = new Set(scorched);

// ---------- tap handling ----------
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (state !== 'idle') return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 7 || performance.now() - downT > 450) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([volcano, rim, ember], false);
  if (hits.length) setState('erupt');
});

// ---------- animation ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // water waves
  const wp = waterGeo.attributes.position.array;
  for (let i = 0; i < wp.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    wp[i + 1] = Math.sin(x * 1.25 + t * 1.1) * 0.055 + Math.cos(z * 1.6 + t * 1.45) * 0.05;
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterGeo.computeVertexNormals();
  foam.material.opacity = 0.4 + Math.sin(t * 1.8) * 0.16;
  foam.scale.setScalar(1 + Math.sin(t * 1.8) * 0.012);

  boat.position.y = 0.12 + Math.sin(t * 1.3) * 0.05;
  boat.rotation.z = Math.sin(t * 1.1) * 0.05;
  birds.forEach(b => {
    const u = b.userData, a = t * u.speed + u.phase;
    b.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 0.9 + u.phase) * 0.4, Math.sin(a) * u.r);
    b.rotation.y = -a - Math.PI / 2;
    const flap = Math.sin(t * 7 + u.phase) * 0.4;
    u.w1.rotation.z = 0.35 + flap; u.w2.rotation.z = -0.35 - flap;
  });
  ember.material.opacity = state === 'idle' ? 0.6 + Math.sin(t * 2.2) * 0.25 : 0.95;

  // state machine
  stateT += dt;
  if (state === 'erupt') {
    const k = Math.min(stateT / 6, 1);           // lava advances over 6s
    lavaMat.emissiveIntensity = 2.3 * k + Math.sin(t * 9) * 0.25;
    craterLight.intensity = 0.6 + 2.6 * k + Math.sin(t * 11) * 0.5;
    lavaLight.intensity = 2.1 * k;
    scorchMat.opacity = Math.min(scorchMat.opacity + dt * 0.25, 0.55);
    flowBlobs.forEach((b, i) => {
      const ft = (t * 0.22 + i / 5) % 1;
      if (ft < k) { b.position.copy(lavaCurve.getPoint(ft)); b.visible = true; }
      else b.visible = false;
    });
    // spawn particles
    for (let i = 0; i < embers.n; i++) if (embers.life[i] < 0 && Math.random() < 0.5)
      spawn(embers, i, craterMouth, new THREE.Vector3(rand(-1.6, 1.6), rand(4.5, 8.5), rand(-1.6, 1.6)), rand(1.2, 2.2));
    for (let i = 0; i < ash.n; i++) if (ash.life[i] < 0 && Math.random() < 0.35)
      spawn(ash, i, craterMouth, new THREE.Vector3(rand(0.4, 1.4), rand(1.2, 2.6), rand(-0.5, 0.5)), rand(3.5, 6));
    for (let i = 0; i < smoke.n; i++) if (smoke.life[i] < 0 && Math.random() < 0.3)
      spawn(smoke, i, craterMouth, new THREE.Vector3(rand(-0.3, 0.3) + 0.5, rand(0.8, 1.4), rand(-0.3, 0.3)), rand(3, 5));
    if (stateT > DUR.erupt) setState('cool');
  } else if (state === 'cool') {
    const k = Math.min(stateT / DUR.cool, 1);
    lavaMat.emissiveIntensity = Math.max(2.3 * (1 - k), 0.04);
    lavaMat.color.setHex(0x3a1005).lerp(new THREE.Color(0x241a16), k);
    craterLight.intensity = 3.2 * (1 - k) + 0.4;
    lavaLight.intensity = 2.1 * (1 - k);
    for (let i = 0; i < steam.n; i++) if (steam.life[i] < 0 && Math.random() < 0.4)
      spawn(steam, i, steamSrc, new THREE.Vector3(rand(-0.2, 0.2), rand(0.5, 1.0), rand(-0.2, 0.2)), rand(1.5, 2.8));
    if (stateT > DUR.cool) { steam.pts.visible = false; setState('regrow'); }
  } else if (state === 'regrow') {
    const k = Math.min(stateT / DUR.regrow, 1);
    scorchMat.opacity = 0.55 * (1 - k);
    shoots.forEach((s, i) => {
      const sk = THREE.MathUtils.clamp((stateT - i * 0.9) / 4, 0, 1);
      s.scale.setScalar(Math.max(sk, 0.001));
    });
    palmLeafMats.forEach((o, i) => {
      if (scorchSet.has(i)) o.mat.color.lerp(o.base, dt * 0.35);
    });
    if (stateT > DUR.regrow) setState('idle');
  }
  if (state === 'erupt' || state === 'cool') {
    // scorch palms during eruption
    const target = state === 'erupt' ? 0.55 : 0;
    palmLeafMats.forEach((o, i) => {
      if (scorchSet.has(i) && state === 'erupt') o.mat.color.lerp(new THREE.Color(0x2b2320), dt * 0.5);
    });
  }

  // integrate particles
  for (const P of [embers, ash, smoke, steam]) {
    if (!P.pts.visible) continue;
    const p = P.pts.geometry.attributes.position.array;
    for (let i = 0; i < P.n; i++) {
      if (P.life[i] < 0) { p[i * 3 + 1] = -100; continue; }
      P.life[i] -= dt;
      p[i * 3] += P.vel[i * 3] * dt;
      p[i * 3 + 1] += P.vel[i * 3 + 1] * dt;
      p[i * 3 + 2] += P.vel[i * 3 + 2] * dt;
      if (P === embers) P.vel[i * 3 + 1] -= 6.5 * dt;
      if (P === smoke) { P.vel[i * 3] += 0.15 * dt; }
    }
    P.pts.geometry.attributes.position.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  const aspect = innerWidth / innerHeight;
  camera.fov = aspect < 0.78 ? 55 : aspect < 1.15 ? 46 : 42;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
setTimeout(() => hintEl.classList.add('faded'), 6000);
</script>
</body>
</html>
