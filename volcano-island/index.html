<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Volcano Island - Tiny Worlds</title>
<meta name="description" content="A quiet volcano on a cutaway base. Tap the crater to erupt: lava finds its own path to the sea, ash drifts, then everything cools and green creeps back."/>
<style>
  html,body{margin:0;height:100%;background:#0b141c;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #app{position:fixed;inset:0;touch-action:none}
  .hud{position:fixed;left:0;right:0;pointer-events:none;color:#e8eef2;text-align:center;z-index:2}
  .hud.top{top:max(14px,env(safe-area-inset-top))}
  .hud h1{font-size:15px;font-weight:650;letter-spacing:.02em;margin:0;opacity:.95}
  .hud p{font-size:11.5px;margin:4px 0 0;opacity:.55}
  .hud.bottom{bottom:max(14px,env(safe-area-inset-bottom));font-size:11.5px;opacity:.6;transition:opacity 1s}
  .hud.bottom.gone{opacity:0}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.45) 100%);z-index:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div class="hud top"><h1>Volcano Island</h1><p>a tiny world, one of fifty</p></div>
<div class="hud bottom" id="hint">Tap the crater to wake it</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b141c);
scene.fog = new THREE.Fog(0x0b141c, 26, 60);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 200);
camera.position.set(11.5, 9, 11.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.enablePan = false;
controls.minDistance = 8; controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * .46;
controls.autoRotate = true; controls.autoRotateSpeed = .5;

// lights
scene.add(new THREE.HemisphereLight(0x9db8cc, 0x1a2530, .55));
const sun = new THREE.DirectionalLight(0xffe3b3, 1.15);
sun.position.set(8, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
scene.add(sun);
const lavaGlow = new THREE.PointLight(0xff5a1e, 0, 14, 1.6);
lavaGlow.position.set(0, 3.4, 0);
scene.add(lavaGlow);

const world = new THREE.Group();
scene.add(world);

// sea
const sea = new THREE.Mesh(
  new THREE.CylinderGeometry(30, 30, .5, 48),
  new THREE.MeshStandardMaterial({ color:0x11485f, roughness:.35, metalness:.1 })
);
sea.position.y = -1.05;
sea.receiveShadow = true;
world.add(sea);

// cutaway base: grass top, soil, rock
function layer(w, h, d, y, color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness:.95 }));
  m.position.y = y; m.castShadow = true; m.receiveShadow = true;
  world.add(m); return m;
}
layer(10, .7, 10, -.35, 0x4d7a3a);   // grass
layer(10, .8, 10, -1.1, 0x5b4530);   // soil
layer(10, 1.0, 10, -2.0, 0x3a3f45);  // rock

// beach ring
const beach = new THREE.Mesh(
  new THREE.CylinderGeometry(3.6, 3.9, .28, 24),
  new THREE.MeshStandardMaterial({ color:0xc9b489, roughness:1 })
);
beach.position.y = .14; beach.receiveShadow = true;
world.add(beach);

// volcano cone with crater
const rockMat = new THREE.MeshStandardMaterial({ color:0x6b5a4c, roughness:.95, flatShading:true });
const cone = new THREE.Mesh(new THREE.CylinderGeometry(.5, 2.5, 3.1, 9, 1), rockMat);
cone.position.y = 1.55 + .28; cone.castShadow = true; cone.receiveShadow = true;
world.add(cone);

const craterRim = new THREE.Mesh(
  new THREE.TorusGeometry(.48, .18, 8, 14),
  new THREE.MeshStandardMaterial({ color:0x54463b, roughness:1, flatShading:true })
);
craterRim.rotation.x = Math.PI/2;
craterRim.position.y = 3.38;
craterRim.castShadow = true;
world.add(craterRim);

const craterPoolMat = new THREE.MeshStandardMaterial({ color:0x1a1210, roughness:.6, emissive:0xff3d00, emissiveIntensity:0 });
const craterPool = new THREE.Mesh(new THREE.CircleGeometry(.44, 16), craterPoolMat);
craterPool.rotation.x = -Math.PI/2;
craterPool.position.y = 3.30;
world.add(craterPool);

// greenery that (re)grows
const green = new THREE.Group(); world.add(green);
const greenMat = new THREE.MeshStandardMaterial({ color:0x5f9440, roughness:.9, flatShading:true });
const greenSpots = [];
for (let i = 0; i < 26; i++){
  const a = Math.random() * Math.PI * 2;
  const r = 1.6 + Math.random() * 3.1;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.abs(x) > 4.7 || Math.abs(z) > 4.7) continue;
  const s = .12 + Math.random() * .2;
  const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), greenMat);
  bush.position.set(x, .28 + s * .4, z);
  bush.castShadow = true;
  bush.userData.baseScale = 1;
  green.add(bush); greenSpots.push(bush);
}
// a few palms on the beach
const trunkMat = new THREE.MeshStandardMaterial({ color:0x7a5c3e, roughness:1 });
const leafMat = new THREE.MeshStandardMaterial({ color:0x4e8a3c, roughness:.9, flatShading:true });
for (let i = 0; i < 4; i++){
  const a = i * 1.7 + .6;
  const palm = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.05, .08, .9, 5), trunkMat);
  trunk.position.y = .45; trunk.castShadow = true; palm.add(trunk);
  for (let j = 0; j < 5; j++){
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(.09, .7, 4), leafMat);
    leaf.position.y = .95;
    leaf.rotation.z = Math.PI/2.3;
    leaf.rotation.y = j * (Math.PI*2/5);
    leaf.castShadow = true;
    palm.add(leaf);
  }
  palm.position.set(Math.cos(a)*3.1, .28, Math.sin(a)*3.1);
  green.add(palm); greenSpots.push(palm);
}

// fishing hut at the foot
const hut = new THREE.Group();
const hutBase = new THREE.Mesh(new THREE.BoxGeometry(.8, .55, .7), new THREE.MeshStandardMaterial({ color:0x8a6b4a, roughness:.95 }));
hutBase.position.y = .55; hutBase.castShadow = true; hut.add(hutBase);
const hutRoof = new THREE.Mesh(new THREE.ConeGeometry(.72, .5, 4), new THREE.MeshStandardMaterial({ color:0xa34d3a, roughness:.9, flatShading:true }));
hutRoof.position.y = 1.1; hutRoof.rotation.y = Math.PI/4; hutRoof.castShadow = true; hut.add(hutRoof);
const hutGlow = new THREE.Mesh(new THREE.PlaneGeometry(.18, .22), new THREE.MeshStandardMaterial({ color:0xffca7a, emissive:0xffb84d, emissiveIntensity:1.4 }));
hutGlow.position.set(0, .5, .36); hut.add(hutGlow);
hut.position.set(2.9, 0, 2.4);
hut.rotation.y = -.7;
world.add(hut);

// lava flow path: crater lip down the cone to the sea
const flowPoints = [];
{
  const dir = new THREE.Vector2(.66, .74).normalize(); // toward hut-side sea gap
  for (let i = 0; i <= 30; i++){
    const t = i / 30;
    const r = .35 + t * 3.4;
    const y = 3.32 - t * 3.35 + Math.sin(t * 9) * .06;
    flowPoints.push(new THREE.Vector3(dir.x * r + Math.sin(t*7)*.18, Math.max(y, .1), dir.y * r + Math.cos(t*6)*.18));
  }
}
const flowCurve = new THREE.CatmullRomCurve3(flowPoints);
const lavaRiverMat = new THREE.MeshStandardMaterial({ color:0x2b120a, emissive:0xff4a00, emissiveIntensity:0, roughness:.5 });
const lavaRiver = new THREE.Mesh(new THREE.TubeGeometry(flowCurve, 40, .16, 6, false), lavaRiverMat);
lavaRiver.visible = false;
world.add(lavaRiver);

// eruption particles
const MAXP = 320;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAXP * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color:0xff7a2a, size:.16, transparent:true, opacity:0, depthWrite:false });
const lavaPts = new THREE.Points(pGeo, pMat);
world.add(lavaPts);
const parts = [];

const aGeo = new THREE.BufferGeometry();
const aPos = new Float32Array(140 * 3);
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
const aMat = new THREE.PointsMaterial({ color:0x8d8d94, size:.22, transparent:true, opacity:0, depthWrite:false });
const ashPts = new THREE.Points(aGeo, aMat);
world.add(ashPts);
const ash = [];

// whitecaps
const caps = [];
const capMat = new THREE.MeshStandardMaterial({ color:0xd7e8ee, roughness:.8 });
for (let i = 0; i < 10; i++){
  const c = new THREE.Mesh(new THREE.ConeGeometry(.16, .1, 5), capMat);
  const a = Math.random() * Math.PI * 2, r = 6.5 + Math.random() * 5;
  c.position.set(Math.cos(a)*r, -.72, Math.sin(a)*r);
  c.userData = { a, r, ph: Math.random() * 6 };
  world.add(c); caps.push(c);
}

// state machine: idle -> erupting -> cooling -> regrowing -> idle
let state = 'idle', tState = 0, shake = 0;
const hint = document.getElementById('hint');
function erupt(){
  if (state === 'erupting') return;
  state = 'erupting'; tState = 0;
  greenSpots.forEach(g => g.userData.scorch = true);
  hint.textContent = 'It is awake';
  hint.classList.remove('gone');
  setTimeout(() => hint.classList.add('gone'), 2500);
}
setTimeout(() => hint.classList.add('gone'), 6000);

// tap vs drag
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY, t:performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const dt = performance.now() - downAt.t;
  downAt = null;
  if (moved > 8 || dt > 500) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([cone, craterRim, craterPool], false);
  if (hits.length) erupt();
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  tState += dt;
  controls.update();

  // whitecaps bob
  caps.forEach(c => { c.position.y = -.72 + Math.sin(t * 1.6 + c.userData.ph) * .06; });

  if (state === 'erupting'){
    const k = Math.min(tState / 1.2, 1);
    craterPoolMat.emissiveIntensity = k * 2.6;
    lavaGlow.intensity = k * 5;
    if (tState > 1.0) lavaRiver.visible = true;
    lavaRiverMat.emissiveIntensity = Math.min(Math.max(tState - 1.2, 0) / 2.5, 1) * 3.2;
    lavaRiverMat.color.setHex(tState > 1.2 ? 0xff5a10 : 0x2b120a);
    shake = Math.min(tState / .8, 1) * .09;
    pMat.opacity = Math.min(pMat.opacity + dt * 2, 1);
    aMat.opacity = Math.min(aMat.opacity + dt, .85);
    // spawn lava
    for (let i = 0; i < 6 && parts.length < MAXP; i++){
      parts.push({
        x: (Math.random()-.5)*.5, y: 3.35, z: (Math.random()-.5)*.5,
        vx: (Math.random()-.5)*1.6, vy: 3 + Math.random()*3.4, vz: (Math.random()-.5)*1.6,
        life: 0, seg: -1
      });
    }
    for (let i = 0; i < 3 && ash.length < 140; i++){
      ash.push({ x:(Math.random()-.5)*.6, y:3.5, z:(Math.random()-.5)*.6, vx:.4+Math.random()*.5, vy:1+Math.random(), vz:(Math.random()-.5)*.4, life:0 });
    }
    if (tState > 9){ state = 'cooling'; tState = 0; }
  } else if (state === 'cooling'){
    craterPoolMat.emissiveIntensity = Math.max(craterPoolMat.emissiveIntensity - dt * .8, 0);
    lavaGlow.intensity = Math.max(lavaGlow.intensity - dt * 1.4, 0);
    lavaRiverMat.emissiveIntensity = Math.max(lavaRiverMat.emissiveIntensity - dt * .9, 0);
    lavaRiverMat.color.lerp(new THREE.Color(0x1c1512), dt * .8);
    shake = Math.max(shake - dt * .12, 0);
    pMat.opacity = Math.max(pMat.opacity - dt * .5, 0);
    aMat.opacity = Math.max(aMat.opacity - dt * .25, 0);
    // scorch the green
    green.forEach(g => { if (g.userData.scorch){ g.scale.multiplyScalar(Math.max(1 - dt * 1.4, 0)); if (g.scale.x < .02) g.visible = false; } });
    if (tState > 5){ state = 'regrowing'; tState = 0; green.forEach(g => { g.visible = true; g.userData.scorch = false; }); }
  } else if (state === 'regrowing'){
    const k = Math.min(tState / 4, 1);
    green.forEach((g, i) => {
      const kk = THREE.MathUtils.clamp(k * 1.6 - (i % 7) * .08, 0, 1);
      const s = 1 - Math.pow(1 - kk, 3);
      g.scale.setScalar(Math.max(s, .001));
    });
    if (tState > 5){ state = 'idle'; tState = 0; hint.textContent = 'Tap the crater to wake it again'; hint.classList.remove('gone'); setTimeout(() => hint.classList.add('gone'), 4000); }
  }

  // integrate lava particles
  const pa = pGeo.attributes.position.array;
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life += dt;
    p.vy -= 9.8 * dt * .55;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < .1 || p.life > 4){ parts.splice(i, 1); continue; }
    pa[i*3] = p.x; pa[i*3+1] = p.y; pa[i*3+2] = p.z;
  }
  for (let i = 0; i < MAXP; i++){ if (i >= parts.length){ pa[i*3] = 0; pa[i*3+1] = -50; pa[i*3+2] = 0; } }
  pGeo.attributes.position.needsUpdate = true;

  const aa = aGeo.attributes.position.array;
  for (let i = ash.length - 1; i >= 0; i--){
    const p = ash[i];
    p.life += dt;
    p.x += p.vx * dt + Math.sin(t * 2 + i) * .01; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vy *= (1 - dt * .3);
    if (p.life > 6){ ash.splice(i, 1); continue; }
    aa[i*3] = p.x; aa[i*3+1] = p.y; aa[i*3+2] = p.z;
  }
  for (let i = 0; i < 140; i++){ if (i >= ash.length){ aa[i*3] = 0; aa[i*3+1] = -50; aa[i*3+2] = 0; } }
  aGeo.attributes.position.needsUpdate = true;

  if (shake > 0){
    camera.position.x += (Math.random()-.5) * shake;
    camera.position.y += (Math.random()-.5) * shake;
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
