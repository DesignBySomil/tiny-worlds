<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Volcano island — a tiny world</title>
  <style>
    :root {
      --bg-top: #d8ecf8;
      --bg-mid: #eef6fb;
      --bg-bot: #f7efe6;
      --text-dark: #192836;
      --text-muted: #4b6275;
      --accent-warm: #ff5a1f;
      --pill-bg: rgba(255, 255, 255, 0.76);
      --pill-border: rgba(25, 40, 54, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 58%, var(--bg-bot) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(8px, 2vh, 18px) clamp(10px, 3vw, 24px);
      z-index: 10;
    }

    #header-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
      max-width: 96vw;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    h1 {
      font-size: clamp(1.15rem, 3.6vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      line-height: 1.1;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .subtitle {
      font-size: clamp(0.8rem, 2.5vw, 0.98rem);
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      font-style: italic;
    }

    .hint-pill {
      margin-top: 4px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: clamp(0.68rem, 2.2vw, 0.8rem);
      font-weight: 600;
      color: var(--text-dark);
      box-shadow: 0 2px 8px rgba(18, 35, 52, 0.06);
      line-height: 1.25;
      transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
    }

    .hint-pill.active-erupt {
      border-color: rgba(255, 90, 31, 0.55);
      background: rgba(255, 245, 238, 0.9);
      transform: scale(1.03);
    }

    .hint-pill.active-splash {
      border-color: rgba(34, 155, 215, 0.55);
      background: rgba(238, 250, 255, 0.9);
      transform: scale(1.03);
    }

    #footer-ui {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
    }

    .footer-label {
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.55);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(25, 40, 54, 0.08);
    }

    #fallback-msg {
      display: none;
      position: absolute;
      inset: 20px;
      margin: auto;
      max-width: 360px;
      max-height: 180px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(25, 40, 54, 0.16);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    #fallback-msg h2 {
      font-size: 1rem;
      color: var(--text-dark);
    }

    #fallback-msg p {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div class="hud">
      <header id="header-ui">
        <div class="title-row">
          <h1>Volcano island</h1>
          <span class="subtitle">a tiny world</span>
        </div>
        <div id="hint-badge" class="hint-pill">tap the crater for an eruption - tap the sea for a splash</div>
      </header>
      <footer id="footer-ui">
        <div class="footer-label">A tiny world</div>
      </footer>
    </div>

    <div id="fallback-msg">
      <h2>WebGL Unavailable</h2>
      <p>Your browser or device could not initialize the 3D WebGL context required for this miniature island.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // 1. DETERMINISTIC SEEDED PRNG (mulberry32 with seed 20261102)
    // ============================================================================
    function mulberry32(a) {
      return function() {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const rand = mulberry32(20261102);
    const randRange = (min, max) => min + (max - min) * rand();

    // ============================================================================
    // 2. INITIALIZATION & SAFE WEBGL SETUP
    // ============================================================================
    const appEl = document.getElementById('app');
    const headerEl = document.getElementById('header-ui');
    const footerEl = document.getElementById('footer-ui');
    const hintBadge = document.getElementById('hint-badge');
    const fallbackEl = document.getElementById('fallback-msg');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: true
      });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    if (!renderer || !renderer.getContext()) {
      fallbackEl.style.display = 'flex';
      throw new Error('WebGL context creation failed.');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    appEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera & OrbitControls
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.minPolarAngle = THREE.MathUtils.degToRad(34);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(64);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-55);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(55);
    controls.target.set(0, 1.15, 0);

    // ============================================================================
    // 3. LIGHTING (Tropical Daylight + Dynamic Crater Lava Light)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0xeef8ff, 0x4a5a70, 1.55);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff4e0, 2.3);
    sunLight.position.set(7.5, 13.0, 8.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 2.0;
    sunLight.shadow.camera.far = 28.0;
    const d = 6.2;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0008;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x7cc9ff, 0.75);
    rimLight.position.set(-8.0, 5.0, -7.0);
    scene.add(rimLight);

    // Dynamic lava glow light perched over the crater
    const craterLight = new THREE.PointLight(0xff5500, 3.2, 11.0, 1.5);
    craterLight.position.set(0, 3.6, 0.15);
    scene.add(craterLight);

    const channelGlowLight = new THREE.PointLight(0xff4800, 1.4, 6.5, 1.6);
    channelGlowLight.position.set(0.55, 1.3, 2.35);
    scene.add(channelGlowLight);

    // ============================================================================
    // 4. GEOMETRY HELPERS & SHARED MATERIALS
    // ============================================================================
    const dummy = new THREE.Object3D();
    const tempVec3 = new THREE.Vector3();
    const tempColor = new THREE.Color();

    // Create a beveled box geometry with faceted corners for the diorama slab
    function createBeveledSlabGeometry(width, height, depth, bevel = 0.14, segsW = 16, segsH = 4, segsD = 16) {
      const geo = new THREE.BoxGeometry(width, height, depth, segsW, segsH, segsD);
      const pos = geo.attributes.position;
      const hw = width * 0.5;
      const hh = height * 0.5;
      const hd = depth * 0.5;

      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Soft bevel pull near edges
        const dx = Math.max(0, Math.abs(x) - (hw - bevel));
        const dy = Math.max(0, Math.abs(y) - (hh - bevel * 0.6));
        const dz = Math.max(0, Math.abs(z) - (hd - bevel));

        if (dx > 0 && dz > 0) {
          const factor = 0.42;
          x -= Math.sign(x) * dx * factor;
          z -= Math.sign(z) * dz * factor;
        }
        if (dy > 0 && (dx > 0 || dz > 0)) {
          y -= Math.sign(y) * dy * 0.35;
        }

        // Subtle organic vertex jitter on inner top surface
        if (y > hh * 0.8 && Math.abs(x) < hw - bevel && Math.abs(z) < hd - bevel) {
          y += Math.sin(x * 1.4 + z * 1.3) * 0.022;
        }

        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    // Shared Materials
    const mats = {
      basePedestal: new THREE.MeshStandardMaterial({
        color: 0x1a2634,
        roughness: 0.85,
        metalness: 0.08,
        flatShading: true
      }),
      deepWaterSlab: new THREE.MeshStandardMaterial({
        color: 0x0b4f7c,
        roughness: 0.35,
        metalness: 0.05,
        flatShading: true
      }),
      midWaterSlab: new THREE.MeshStandardMaterial({
        color: 0x1578ad,
        roughness: 0.28,
        metalness: 0.05,
        flatShading: true
      }),
      topWaterSlab: new THREE.MeshStandardMaterial({
        color: 0x28a4d9,
        roughness: 0.2,
        metalness: 0.06,
        transparent: true,
        opacity: 0.86,
        flatShading: true
      }),
      underwaterShelf: new THREE.MeshStandardMaterial({
        color: 0x208596,
        roughness: 0.6,
        metalness: 0.04,
        flatShading: true
      }),
      waveFoam: new THREE.MeshStandardMaterial({
        color: 0xeaf9ff,
        emissive: 0x8be0ff,
        emissiveIntensity: 0.25,
        roughness: 0.3,
        transparent: true,
        opacity: 0.82,
        flatShading: true
      }),
      blackSand: new THREE.MeshStandardMaterial({
        color: 0x3a3b44,
        roughness: 0.92,
        metalness: 0.04,
        flatShading: true
      }),
      wetSand: new THREE.MeshStandardMaterial({
        color: 0x2c3038,
        roughness: 0.5,
        metalness: 0.12,
        flatShading: true
      }),
      volcanoRock: new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.86,
        metalness: 0.07,
        flatShading: true
      }),
      cragRock: new THREE.MeshStandardMaterial({
        color: 0x55565f,
        roughness: 0.88,
        metalness: 0.08,
        flatShading: true
      }),
      craterLava: new THREE.MeshStandardMaterial({
        color: 0xff4500,
        emissive: 0xff5a00,
        emissiveIntensity: 1.8,
        roughness: 0.25,
        flatShading: true
      }),
      lavaCrust: new THREE.MeshStandardMaterial({
        color: 0x231614,
        emissive: 0x882200,
        emissiveIntensity: 0.45,
        roughness: 0.85,
        flatShading: true
      }),
      channelLava: new THREE.MeshStandardMaterial({
        vertexColors: true,
        color: 0xffffff,
        emissive: 0xff4d00,
        emissiveIntensity: 1.5,
        roughness: 0.3,
        flatShading: true
      }),
      smoke: new THREE.MeshStandardMaterial({
        color: 0xd9d4ce,
        emissive: 0x3d2214,
        emissiveIntensity: 0.08,
        roughness: 0.95,
        flatShading: true
      }),
      steam: new THREE.MeshStandardMaterial({
        color: 0xf4fbff,
        emissive: 0xff7733,
        emissiveIntensity: 0.15,
        roughness: 0.85,
        flatShading: true
      }),
      lavaBomb: new THREE.MeshStandardMaterial({
        color: 0xffaa22,
        emissive: 0xff5500,
        emissiveIntensity: 2.2,
        roughness: 0.3,
        flatShading: true
      }),
      cloud: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xdbeeff,
        emissiveIntensity: 0.18,
        roughness: 0.9,
        flatShading: true
      }),
      bird: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xcce6ff,
        emissiveIntensity: 0.2,
        roughness: 0.5,
        side: THREE.DoubleSide,
        flatShading: true
      }),
      splashRing: new THREE.MeshBasicMaterial({
        color: 0x9ef0ff,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      splashDrop: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0x8be4ff,
        emissiveIntensity: 0.5,
        roughness: 0.2,
        flatShading: true
      })
    };

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // ============================================================================
    // 5. OCEAN DIORAMA SLAB, UNDERWATER SHELF & ANIMATED SHORE WAVE BANDS
    // ============================================================================
    const SLAB_WIDTH = 7.6;
    const SLAB_DEPTH = 7.6;

    // 5a. Sculptural base pedestal
    const pedestalGeo = createBeveledSlabGeometry(SLAB_WIDTH + 0.16, 0.34, SLAB_DEPTH + 0.16, 0.16, 8, 2, 8);
    const pedestalMesh = new THREE.Mesh(pedestalGeo, mats.basePedestal);
    pedestalMesh.position.y = -0.92;
    pedestalMesh.receiveShadow = true;
    worldGroup.add(pedestalMesh);

    // 5b. Layered blue water bands (3 distinct strata)
    const deepSlabGeo = createBeveledSlabGeometry(SLAB_WIDTH, 0.38, SLAB_DEPTH, 0.14, 12, 2, 12);
    const deepSlabMesh = new THREE.Mesh(deepSlabGeo, mats.deepWaterSlab);
    deepSlabMesh.position.y = -0.58;
    deepSlabMesh.receiveShadow = true;
    worldGroup.add(deepSlabMesh);

    const midSlabGeo = createBeveledSlabGeometry(SLAB_WIDTH - 0.06, 0.28, SLAB_DEPTH - 0.06, 0.12, 14, 2, 14);
    const midSlabMesh = new THREE.Mesh(midSlabGeo, mats.midWaterSlab);
    midSlabMesh.position.y = -0.26;
    midSlabMesh.receiveShadow = true;
    worldGroup.add(midSlabMesh);

    // 5c. Visible underwater turquoise shelf around the island base (sits between mid & top water)
    const shelfGeo = new THREE.CylinderGeometry(3.15, 3.48, 0.22, 32, 2);
    const shelfPos = shelfGeo.attributes.position;
    for (let i = 0; i < shelfPos.count; i++) {
      const vx = shelfPos.getX(i);
      const vy = shelfPos.getY(i);
      const vz = shelfPos.getZ(i);
      const ang = Math.atan2(vz, vx);
      const radialMod = 1.0 + 0.06 * Math.sin(ang * 5.0 + 0.7) + 0.04 * Math.cos(ang * 3.0);
      shelfPos.setXYZ(i, vx * radialMod, vy, vz * radialMod);
    }
    shelfGeo.computeVertexNormals();
    const shelfMesh = new THREE.Mesh(shelfGeo, mats.underwaterShelf);
    shelfMesh.position.y = -0.11;
    shelfMesh.receiveShadow = true;
    worldGroup.add(shelfMesh);

    // 5d. Translucent top water surface slab with gentle vertex wave animation
    const topSlabGeo = createBeveledSlabGeometry(SLAB_WIDTH - 0.12, 0.18, SLAB_DEPTH - 0.12, 0.1, 22, 2, 22);
    const topSlabBasePos = new Float32Array(topSlabGeo.attributes.position.array);
    const topSlabMesh = new THREE.Mesh(topSlabGeo, mats.topWaterSlab);
    topSlabMesh.position.y = -0.06;
    topSlabMesh.receiveShadow = true;
    worldGroup.add(topSlabMesh);

    // 5e. Animated concentric wave bands ringing the shore
    const waveBands = [];
    for (let b = 0; b < 3; b++) {
      const ringGeo = new THREE.RingGeometry(2.55, 2.66, 48, 1);
      ringGeo.rotateX(-Math.PI / 2);
      const pos = ringGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const ang = Math.atan2(z, x);
        // Match the organic island shoreline contour
        const contour = 1.0 + 0.05 * Math.sin(ang * 3.0 + 0.4) + 0.035 * Math.cos(ang * 5.0 - 0.8);
        pos.setXYZ(i, x * contour, 0, z * contour);
      }
      ringGeo.computeVertexNormals();
      const mat = mats.waveFoam.clone();
      const mesh = new THREE.Mesh(ringGeo, mat);
      mesh.position.y = 0.042 + b * 0.002;
      worldGroup.add(mesh);
      waveBands.push({ mesh, mat, phaseOffset: b / 3 });
    }

    // ============================================================================
    // 6. DARK SAND BEACH RING & VOLCANO CONE WITH STRATA, GULLIES & CRATER
    // ============================================================================
    // Helper function defining the shoreline and mountain profile so the lava channel can hug it accurately
    function getIslandContour(angle) {
      return (
        1.0 +
        0.055 * Math.sin(angle * 3.0 + 0.4) +
        0.04 * Math.cos(angle * 5.0 - 0.8) +
        0.025 * Math.sin(angle * 7.0 + 1.9)
      );
    }

    // 6a. Wet & dry black sand beach rings
    const wetBeachGeo = new THREE.CylinderGeometry(2.38, 2.64, 0.16, 42, 2);
    const wetPos = wetBeachGeo.attributes.position;
    for (let i = 0; i < wetPos.count; i++) {
      const x = wetPos.getX(i);
      const y = wetPos.getY(i);
      const z = wetPos.getZ(i);
      const ang = Math.atan2(z, x);
      const c = getIslandContour(ang);
      wetPos.setXYZ(i, x * c, y + (y > 0 ? Math.sin(ang * 6) * 0.015 : 0), z * c);
    }
    wetBeachGeo.computeVertexNormals();
    const wetBeachMesh = new THREE.Mesh(wetBeachGeo, mats.wetSand);
    wetBeachMesh.position.y = 0.04;
    wetBeachMesh.receiveShadow = true;
    wetBeachMesh.castShadow = true;
    worldGroup.add(wetBeachMesh);

    const dryBeachGeo = new THREE.CylinderGeometry(2.08, 2.42, 0.24, 42, 3);
    const dryPos = dryBeachGeo.attributes.position;
    for (let i = 0; i < dryPos.count; i++) {
      const x = dryPos.getX(i);
      const y = dryPos.getY(i);
      const z = dryPos.getZ(i);
      const ang = Math.atan2(z, x);
      const c = getIslandContour(ang);
      dryPos.setXYZ(i, x * c, y + 0.02 * Math.cos(ang * 4.0 + x), z * c);
    }
    dryBeachGeo.computeVertexNormals();
    const dryBeachMesh = new THREE.Mesh(dryBeachGeo, mats.blackSand);
    dryBeachMesh.position.y = 0.16;
    dryBeachMesh.receiveShadow = true;
    dryBeachMesh.castShadow = true;
    worldGroup.add(dryBeachMesh);

    // 6b. Procedural S-curve path helper for the lava channel
    // Runs down the front-facing slope (+Z direction) with a clear S-bend
    function getChannelAngleAtNormR(t) {
      // t = 0 at crater rim, t = 1 at water pour point
      const baseAngle = Math.PI * 0.52; // Facing front-right slightly (+Z)
      const sCurve = 0.34 * Math.sin(t * Math.PI * 2.0 - 0.25);
      return baseAngle + sCurve;
    }

    // 6c. Centered Volcano Cone with faceted dark basalt strata, shoulder peak, gullies & crater bowl
    function createVolcanoGeometry() {
      const radialSegs = 64;
      const ringSegs = 28;
      const maxR = 2.28;
      const geo = new THREE.PlaneGeometry(maxR * 2, maxR * 2, radialSegs, ringSegs);

      // Convert grid to polar disc mesh for crisp radial gullies and concentric basalt strata
      const positions = [];
      const colors = [];
      const indices = [];

      const colorCharcoal = new THREE.Color(0x4d4a55);
      const colorBasaltDark = new THREE.Color(0x3a3b45);
      const colorBasaltWarm = new THREE.Color(0x6b5a52);
      const colorRimAsh = new THREE.Color(0x473a36);
      const colorCraterHot = new THREE.Color(0x6e2511);

      for (let ir = 0; ir <= ringSegs; ir++) {
        const rNorm = ir / ringSegs; // 0 = center of crater, 1 = cone base
        for (let ia = 0; ia <= radialSegs; ia++) {
          const aNorm = ia / radialSegs;
          const angle = aNorm * Math.PI * 2.0;

          // Base radius with island contour
          const contour = getIslandContour(angle);
          let radius = rNorm * maxR * contour;

          // Asymmetric shoulder peak on the upper-left (-X, -Z/mid)
          const shoulderAng = Math.PI * 1.18;
          let dShoulder = Math.atan2(Math.sin(angle - shoulderAng), Math.cos(angle - shoulderAng));
          const shoulderBell = Math.exp(-(dShoulder * dShoulder) / 0.32) * Math.exp(-Math.pow(rNorm - 0.56, 2) / 0.045);

          // Secondary craggy ridge on the right (+X)
          const ridgeAng = Math.PI * 0.12;
          let dRidge = Math.atan2(Math.sin(angle - ridgeAng), Math.cos(angle - ridgeAng));
          const ridgeBell = Math.exp(-(dRidge * dRidge) / 0.28) * Math.exp(-Math.pow(rNorm - 0.62, 2) / 0.05);

          let y = 0;
          const rimNorm = 0.25; // Crater rim at 25% of radius

          if (rNorm < rimNorm) {
            // Inside crater bowl
            const craterT = rNorm / rimNorm;
            y = 1.95 + 1.05 * Math.pow(craterT, 2.2);
            // Jagged rim lip
            y += 0.12 * craterT * (Math.sin(angle * 7.0) * 0.6 + Math.cos(angle * 11.0) * 0.4);
          } else {
            // Outer volcanic slope from rim (rNorm = 0.25) to base (rNorm = 1.0)
            const slopeT = (rNorm - rimNorm) / (1.0 - rimNorm); // 0 at rim, 1 at base
            const baseCurve = Math.pow(1.0 - slopeT, 1.28);
            y = 0.22 + 2.78 * baseCurve;

            // Rim jagged crest
            const rimInfluence = Math.exp(-slopeT * 5.5);
            y += rimInfluence * (0.14 * Math.sin(angle * 7.0) + 0.09 * Math.cos(angle * 11.0));

            // Add shoulder peak & secondary crag
            y += shoulderBell * 0.72;
            radius += shoulderBell * 0.26;
            y += ridgeBell * 0.38;
            radius += ridgeBell * 0.14;

            // Stepped basalt strata terraces
            const strataSteps = 7.0;
            const stepWave = Math.sin(slopeT * Math.PI * strataSteps * 2.0 + Math.sin(angle * 4.0) * 0.6);
            y += stepWave * 0.045 * (1.0 - slopeT * 0.4);

            // Deep radial gullies & ridges around the cone
            const gullies =
              0.11 * Math.sin(angle * 9.0 + slopeT * 2.2) +
              0.07 * Math.cos(angle * 15.0 - slopeT * 1.6);
            y += gullies * Math.sin(slopeT * Math.PI);

            // Carved S-curve lava channel trench on the front slope
            const chanAngle = getChannelAngleAtNormR(slopeT);
            const angDiff = Math.atan2(Math.sin(angle - chanAngle), Math.cos(angle - chanAngle));
            const arcDist = Math.abs(angDiff) * radius;
            const trenchWidth = 0.26 + slopeT * 0.08;
            if (arcDist < trenchWidth) {
              const trenchDepth = Math.cos((arcDist / trenchWidth) * Math.PI * 0.5);
              y -= trenchDepth * trenchDepth * 0.22;
            }
          }

          // Low-poly tactile facet jitter
          const jitter = (rand() - 0.5) * 0.038 * (rNorm > 0.08 ? 1 : 0);
          const x = Math.cos(angle) * (radius + jitter);
          const z = Math.sin(angle) * (radius + jitter);

          positions.push(x, y, z);

          // Vertex color per stratum & elevation
          tempColor.copy(colorCharcoal);
          if (rNorm < rimNorm) {
            tempColor.lerp(colorCraterHot, 1.0 - rNorm / rimNorm);
          } else {
            const stratumBand = Math.floor(y * 3.6) % 2;
            if (stratumBand === 0) {
              tempColor.lerp(colorBasaltDark, 0.45);
            } else {
              tempColor.lerp(colorBasaltWarm, 0.38);
            }
            if (rNorm < 0.36) {
              tempColor.lerp(colorRimAsh, (0.36 - rNorm) / 0.11 * 0.6);
            }
          }
          // Subtle per-vertex shade variation
          const shade = 0.94 + rand() * 0.12;
          colors.push(tempColor.r * shade, tempColor.g * shade, tempColor.b * shade);
        }
      }

      for (let ir = 0; ir < ringSegs; ir++) {
        for (let ia = 0; ia < radialSegs; ia++) {
          const a = ir * (radialSegs + 1) + ia;
          const b = a + radialSegs + 1;
          const c = a + 1;
          const d = b + 1;
          indices.push(a, b, c);
          indices.push(c, b, d);
        }
      }

      const volcanoGeo = new THREE.BufferGeometry();
      volcanoGeo.setIndex(indices);
      volcanoGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      volcanoGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      volcanoGeo.computeVertexNormals();
      return volcanoGeo;
    }

    const volcanoGeo = createVolcanoGeometry();
    const volcanoMesh = new THREE.Mesh(volcanoGeo, mats.volcanoRock);
    volcanoMesh.castShadow = true;
    volcanoMesh.receiveShadow = true;
    worldGroup.add(volcanoMesh);

    // Helper to query approximate slope elevation along the S-curve channel
    function getChannelSurfacePoint(t) {
      // t in [0, 1] from crater rim to ocean waterline
      const angle = getChannelAngleAtNormR(t);
      const contour = getIslandContour(angle);
      const rimR = 0.25 * 2.28 * contour;
      const waterR = 2.58 * contour;
      const radius = THREE.MathUtils.lerp(rimR, waterR, t);

      let y;
      if (t < 0.78) {
        const slopeT = t / 0.78;
        y = 0.24 + 2.62 * Math.pow(1.0 - slopeT, 1.28);
      } else {
        // Across the black sand beach and pouring over the waterline
        const beachT = (t - 0.78) / 0.22;
        y = THREE.MathUtils.lerp(0.24, 0.03, beachT);
      }

      return new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    }

    // ============================================================================

    // Carved S-curve Lava Channel Mesh

    // ============================================================================
    // 13. ASPECT-AWARE SAFE-AREA CAMERA FRAMING (FITS 616x562, 390x844, 320x700)
    // ============================================================================
    // Explicit bounding box encompassing full ocean slab, cone, birds, and crater smoke headroom
    const framingBounds = new THREE.Box3(
      new THREE.Vector3(-4.05, -1.12, -4.05),
      new THREE.Vector3(4.05, 4.85, 4.05)
    );

    const boundCorners = [
      new THREE.Vector3(framingBounds.min.x, framingBounds.min.y, framingBounds.min.z),
      new THREE.Vector3(framingBounds.max.x, framingBounds.min.y, framingBounds.min.z),
      new THREE.Vector3(framingBounds.min.x, framingBounds.max.y, framingBounds.min.z),
      new THREE.Vector3(framingBounds.max.x, framingBounds.max.y, framingBounds.min.z),
      new THREE.Vector3(framingBounds.min.x, framingBounds.min.y, framingBounds.max.z),
      new THREE.Vector3(framingBounds.max.x, framingBounds.min.y, framingBounds.max.z),
      new THREE.Vector3(framingBounds.min.x, framingBounds.max.y, framingBounds.max.z),
      new THREE.Vector3(framingBounds.max.x, framingBounds.max.y, framingBounds.max.z)
    ];

    function updateCameraFraming() {
      const vw = Math.max(window.innerWidth, 1);
      const vh = Math.max(window.innerHeight, 1);
      renderer.setSize(vw, vh);

      const aspect = vw / vh;
      // Aspect-aware FOV: slightly wider vertical FOV in portrait viewports
      camera.fov = aspect < 1.0 ? THREE.MathUtils.clamp(42 + (1.0 - aspect) * 14, 42, 54) : 36;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Measure actual DOM header and footer safe zones
      const headerRect = headerEl.getBoundingClientRect();
      const footerRect = footerEl.getBoundingClientRect();
      const topSafePx = Math.max(headerRect.bottom, 58) + 12;
      const bottomSafePx = Math.max(vh - footerRect.top, 32) + 12;

      const usableHeightPx = Math.max(vh - topSafePx - bottomSafePx, vh * 0.45);
      const usableWidthPx = vw * (aspect < 1.0 ? 1.30 : 0.90);

      // Vertical screen offset between usable box center and viewport center
      const usableCenterY = topSafePx + usableHeightPx * 0.5;
      const screenCenterY = vh * 0.5;
      const ndcShiftY = ((screenCenterY - usableCenterY) / (vh * 0.5));

      // Elevated three-quarter view direction
      const viewDir = new THREE.Vector3(0.56, 0.56, 0.82).normalize();
      const targetCenter = new THREE.Vector3(0, 1.32, 0);

      // Compute camera basis vectors
      const worldUp = new THREE.Vector3(0, 1, 0);
      const camRight = new THREE.Vector3().crossVectors(worldUp, viewDir).normalize();
      const camUp = new THREE.Vector3().crossVectors(viewDir, camRight).normalize();

      const halfFovRad = THREE.MathUtils.degToRad(camera.fov * 0.5);
      const tanHalfFovY = Math.tan(halfFovRad) * (usableHeightPx / vh);
      const tanHalfFovX = Math.tan(halfFovRad) * aspect * (usableWidthPx / vw);

      let requiredDist = 8.0;
      for (let i = 0; i < boundCorners.length; i++) {
        const rel = tempVec3.subVectors(boundCorners[i], targetCenter);
        const projX = Math.abs(rel.dot(camRight));
        const projY = Math.abs(rel.dot(camUp));
        const projZ = rel.dot(viewDir);

        const distForX = projX / Math.max(tanHalfFovX, 0.1) + projZ;
        const distForY = projY / Math.max(tanHalfFovY, 0.1) + projZ;
        requiredDist = Math.max(requiredDist, distForX, distForY);
      }

      requiredDist *= 1.07; // Small breathing room padding

      // Shift target slightly along camUp so the diorama centers cleanly between header and footer
      const worldOffsetY = -ndcShiftY * requiredDist * Math.tan(halfFovRad) * 0.55;
      controls.target.set(0, targetCenter.y + worldOffsetY, 0);

      camera.position.copy(controls.target).addScaledVector(viewDir, requiredDist);
      controls.minDistance = requiredDist * 0.78;
      controls.maxDistance = requiredDist * 1.25;
      controls.update();
    }

    window.addEventListener('resize', updateCameraFraming);

    // ============================================================================
    // 14. INTERACTION STATE & RAYCASTING (TAP VS DRAG DISTINCTION)
    // ============================================================================
    const ERUPT_DURATION = 7000; // ~7 seconds full eruption hero sequence
    const SPLASH_DURATION = 4200; // ~4.2 seconds splash ripples + startled bird scatter

    let eruptionStartTime = -99999;
    let splashStartTime = -99999;
    const splashOrigin = new THREE.Vector3(1.8, 0.05, 2.1);

    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0, time: 0 };

    function triggerEruption(now) {
      eruptionStartTime = now;
      hintBadge.classList.remove('active-splash');
      hintBadge.classList.add('active-erupt');
    }

    function triggerWaterSplash(now, hitPoint) {
      splashStartTime = now;
      // Clamp splash point inside the open water band so rings stay on the slab
      const clampedX = THREE.MathUtils.clamp(hitPoint.x, -3.15, 3.15);
      const clampedZ = THREE.MathUtils.clamp(hitPoint.z, -3.15, 3.15);
      const distFromCenter = Math.hypot(clampedX, clampedZ);
      if (distFromCenter < 2.35) {
        const ang = Math.atan2(clampedZ, clampedX);
        splashOrigin.set(Math.cos(ang) * 2.55, 0.055, Math.sin(ang) * 2.55);
      } else {
        splashOrigin.set(clampedX, 0.055, clampedZ);
      }
      hintBadge.classList.remove('active-erupt');
      hintBadge.classList.add('active-splash');
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownPos.time = performance.now();
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const dt = performance.now() - pointerDownPos.time;

      // Distinguish deliberate tap from orbit drag
      if (dist > 9 || dt > 600) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(interactables, false);

      if (hits.length > 0) {
        const now = performance.now();
        // Prioritize crater if the ray intersects the generous crater proxy
        const craterHit = hits.find((h) => h.object.name === 'CRATER_TARGET');
        if (craterHit) {
          triggerEruption(now);
          return;
        }

        const firstHit = hits[0];
        if (firstHit.object.name === 'SLOPE_BLOCKER') {
          // Tapping high on the cone triggers the crater eruption; tapping near the beach triggers a shore splash
          if (firstHit.point.y > 1.05) {
            triggerEruption(now);
          } else {
            triggerWaterSplash(now, firstHit.point);
          }
          return;
        }

        if (firstHit.object.name === 'WATER_TARGET') {
          triggerWaterSplash(now, firstHit.point);
        }
      }
    });

    // ============================================================================
    // 15. MAIN ANIMATION LOOP (100% DRIVEN BY performance.now)
    // ============================================================================
    function animate(now) {
      requestAnimationFrame(animate);

      const tSec = now * 0.001;

      // --------------------------------------------------------------------------
      // A. Compute Eruption Envelope (0 = simmering baseline, >0 = erupting)
      // --------------------------------------------------------------------------
      const eruptElapsed = now - eruptionStartTime;
      const isErupting = eruptElapsed >= 0 && eruptElapsed <= ERUPT_DURATION;
      const eruptProgress = isErupting ? eruptElapsed / ERUPT_DURATION : 0;

      // Envelope: rapid build (0..0.12), intense peak fountain (0.12..0.62), smooth settle (0.62..1.0)
      let eruptEnvelope = 0;
      if (isErupting) {
        if (eruptProgress < 0.12) {
          eruptEnvelope = THREE.MathUtils.smoothstep(eruptProgress, 0.0, 0.12);
        } else if (eruptProgress < 0.62) {
          eruptEnvelope = 1.0;
        } else {
          eruptEnvelope = 1.0 - THREE.MathUtils.smoothstep(eruptProgress, 0.62, 1.0);
        }
      } else if (hintBadge.classList.contains('active-erupt')) {
        hintBadge.classList.remove('active-erupt');
      }

      // Subtle camera-space mountain rumble at the peak of the burst
      if (eruptEnvelope > 0.25) {
        const shakeAmt = (eruptEnvelope - 0.25) * 0.065;
        worldGroup.position.set(
          Math.sin(now * 0.055) * shakeAmt,
          Math.cos(now * 0.072) * shakeAmt * 0.7,
          Math.sin(now * 0.063 + 1.2) * shakeAmt
        );
      } else {
        worldGroup.position.set(0, 0, 0);
      }

      // --------------------------------------------------------------------------
      // B. Crater Lava, Dynamic Slopes Lighting & Channel Lava Pulse
      // --------------------------------------------------------------------------
      const idlePulse = 0.5 + 0.5 * Math.sin(tSec * 2.6);
      lavaPoolMesh.position.y = 0.02 * Math.sin(tSec * 3.1) + eruptEnvelope * 0.22;
      const poolScale = 1.0 + eruptEnvelope * 0.16;
      lavaPoolMesh.scale.set(poolScale, 1.0 + eruptEnvelope * 0.8, poolScale);
      mats.craterLava.emissiveIntensity = 1.6 + idlePulse * 0.5 + eruptEnvelope * 3.4;

      // Floating crust plates bob and spread during eruption
      for (let i = 0; i < crustPlates.length; i++) {
        const cp = crustPlates[i];
        const spread = 1.0 + eruptEnvelope * 0.28;
        cp.mesh.position.x = cp.baseX * spread + Math.sin(tSec * 1.8 + cp.phase) * 0.02;
        cp.mesh.position.z = cp.baseZ * spread + Math.cos(tSec * 1.6 + cp.phase) * 0.02;
        cp.mesh.position.y = 0.09 + lavaPoolMesh.position.y + Math.sin(tSec * 3.2 + cp.phase) * 0.015;
      }

      // Warm orange light washes the volcanic slopes during eruption
      craterLight.intensity = 2.8 + idlePulse * 0.9 + eruptEnvelope * 11.5;
      craterLight.distance = 10.5 + eruptEnvelope * 8.0;

      // Channel lava shimmer & travelling eruption surge pulse down to the sea
      const surgeCenter = isErupting ? THREE.MathUtils.clamp((eruptProgress - 0.08) * 1.45, 0, 1.2) : -1;
      const cAttr = channelGeo.attributes.color;
      for (let i = 0; i < cAttr.count; i++) {
        const u = chanUV.getX(i);
        const idleFlow = 0.5 + 0.5 * Math.sin(u * 14.0 - tSec * 3.8);
        let surgeBoost = 0;
        if (surgeCenter >= 0) {
          const distToSurge = Math.abs(u - surgeCenter);
          surgeBoost = Math.exp(-(distToSurge * distToSurge) / 0.06) * eruptEnvelope * 1.35;
        }
        const heat = THREE.MathUtils.clamp(0.45 + idleFlow * 0.35 + surgeBoost, 0.2, 1.8);
        cAttr.setXYZ(i, 1.0, THREE.MathUtils.clamp(0.28 + heat * 0.48, 0, 1), THREE.MathUtils.clamp(heat * 0.25, 0, 1));
      }
      cAttr.needsUpdate = true;
      mats.channelLava.emissiveIntensity = 1.35 + idlePulse * 0.3 + eruptEnvelope * 2.4;
      channelGlowLight.intensity = 1.2 + idlePulse * 0.35 + eruptEnvelope * 4.2;

      // --------------------------------------------------------------------------
      // C. Instanced Lava Bombs & Sparks Fountain (Hero Eruption Effect)
      // --------------------------------------------------------------------------
      if (isErupting && eruptProgress < 0.88) {
        bombInstanced.visible = true;
        const fountainWindow = THREE.MathUtils.clamp(eruptProgress / 0.82, 0, 1);
        for (let i = 0; i < BOMB_COUNT; i++) {
          const b = bombData[i];
          const localT = (fountainWindow * 2.2 * b.cycleSpeed + b.phaseOffset) % 1.0;

          // Parabolic ballistic trajectory from crater rim (y = 2.45), capped at y <= 4.35 to stay below header
          const timeFlight = localT * 1.15;
          const x = b.x0 + b.vx * timeFlight;
          const z = b.z0 + b.vz * timeFlight;
          let y = 2.45 + b.vy * timeFlight - 0.5 * 9.2 * timeFlight * timeFlight;
          y = Math.min(y, 4.35);

          const fadeEnv = Math.sin(localT * Math.PI) * eruptEnvelope;
          const s = Math.max(0.001, b.scale * fadeEnv * (b.isSpark ? 0.55 : 1.05));

          dummy.position.set(x, Math.max(0.15, y), z);
          dummy.rotation.set(tSec * b.rotSpeed, tSec * b.rotSpeed * 1.3, i);
          dummy.scale.setScalar(s);
          dummy.updateMatrix();
          bombInstanced.setMatrixAt(i, dummy.matrix);

          // Hot yellow-white core cooling to deep orange
          tempColor.setHSL(0.04 + (1.0 - localT) * 0.08, 1.0, 0.5 + (1.0 - localT) * 0.35);
          bombInstanced.setColorAt(i, tempColor);
        }
        bombInstanced.instanceMatrix.needsUpdate = true;
        if (bombInstanced.instanceColor) bombInstanced.instanceColor.needsUpdate = true;
      } else {
        bombInstanced.visible = false;
      }

      // --------------------------------------------------------------------------
      // D. Instanced Crater Smoke Wisps (Idle) & Billowing Ash Plume (Eruption)
      // --------------------------------------------------------------------------
      for (let i = 0; i < SMOKE_COUNT; i++) {
        const s = smokeData[i];
        if (s.eruptOnly && eruptEnvelope < 0.02) {
          dummy.position.set(0, -10, 0);
          dummy.scale.setScalar(0.001);
          dummy.updateMatrix();
          smokeInstanced.setMatrixAt(i, dummy.matrix);
          continue;
        }

        const speedMult = 1.0 + eruptEnvelope * 1.85;
        const life = (tSec * s.speed * speedMult + s.phase) % 1.0;

        // Rise from crater (2.55) up to safe ceiling (4.35) so smoke never crosses header
        const maxRise = 1.45 + eruptEnvelope * 0.38;
        const y = 2.55 + life * maxRise;
        const x =
          Math.sin(tSec * s.wobbleFreq + i) * s.wobbleAmp +
          life * s.driftX * (1.0 + eruptEnvelope * 0.85);
        const z =
          Math.cos(tSec * s.wobbleFreq + i) * s.wobbleAmp +
          life * s.driftZ * (1.0 + eruptEnvelope * 0.85);

        const sizeCurve = Math.sin(life * Math.PI);
        const puffScale =
          s.baseScale *
          sizeCurve *
          (s.eruptOnly ? eruptEnvelope * 1.45 : 0.55 + eruptEnvelope * 0.95);

        dummy.position.set(x, y, z);
        dummy.rotation.set(tSec * 0.4 + i, tSec * 0.5 + i, 0);
        dummy.scale.setScalar(Math.max(0.001, puffScale));
        dummy.updateMatrix();
        smokeInstanced.setMatrixAt(i, dummy.matrix);

        // Darken into warm lit ash during eruption, soft pale smoke in idle
        const ashDarkness = THREE.MathUtils.lerp(0.84, 0.32, eruptEnvelope * (1.0 - life * 0.5));
        const underGlow = eruptEnvelope * Math.pow(1.0 - life, 1.8) * 0.65;
        tempColor.setRGB(
          ashDarkness + underGlow,
          ashDarkness * 0.96 + underGlow * 0.35,
          ashDarkness * 0.94
        );
        smokeInstanced.setColorAt(i, tempColor);
      }
      smokeInstanced.instanceMatrix.needsUpdate = true;
      if (smokeInstanced.instanceColor) smokeInstanced.instanceColor.needsUpdate = true;

      // --------------------------------------------------------------------------
      // E. Sea Pour Point Steam Puff (Brighter & Bigger When Lava Surges to Sea)
      // --------------------------------------------------------------------------
      let pourBurst = 0;
      if (isErupting && eruptProgress > 0.22) {
        pourBurst = Math.sin(THREE.MathUtils.clamp((eruptProgress - 0.22) / 0.68, 0, 1) * Math.PI);
      }
      for (let i = 0; i < STEAM_COUNT; i++) {
        const st = steamData[i];
        const life = (tSec * st.speed * (1.0 + pourBurst * 1.4) + st.phase) % 1.0;
        const y = 0.08 + life * (0.65 + pourBurst * 0.75);
        const x = pourPoint.x + st.offsetX * (0.5 + life) + Math.sin(tSec * 2.5 + i) * 0.05;
        const z = pourPoint.z + st.offsetZ * (0.5 + life) + life * 0.25;
        const sc = st.scale * Math.sin(life * Math.PI) * (0.55 + pourBurst * 1.15);

        dummy.position.set(x, y, z);
        dummy.rotation.set(tSec + i, tSec * 0.8, 0);
        dummy.scale.setScalar(Math.max(0.001, sc));
        dummy.updateMatrix();
        steamInstanced.setMatrixAt(i, dummy.matrix);
      }
      steamInstanced.instanceMatrix.needsUpdate = true;
      mats.steam.emissiveIntensity = 0.12 + pourBurst * 0.65;

      // --------------------------------------------------------------------------
      // F. Ocean Slab Gentle Waves & Shore Wave Bands
      // --------------------------------------------------------------------------
      const topPos = topSlabGeo.attributes.position;
      for (let i = 0; i < topPos.count; i++) {
        const by = topSlabBasePos[i * 3 + 1];
        if (by > 0.02) {
          const bx = topSlabBasePos[i * 3 + 0];
          const bz = topSlabBasePos[i * 3 + 2];
          const wave =
            Math.sin(bx * 1.6 + tSec * 1.9) * 0.018 +
            Math.cos(bz * 1.5 - tSec * 1.6) * 0.018;
          topPos.setY(i, by + wave);
        }
      }
      topPos.needsUpdate = true;

      for (let b = 0; b < waveBands.length; b++) {
        const wb = waveBands[b];
        const cycle = (tSec * 0.34 + wb.phaseOffset) % 1.0;
        // Waves gently contract toward the black sand beach and fade
        const scale = THREE.MathUtils.lerp(1.16, 0.97, cycle);
        wb.mesh.scale.set(scale, 1, scale);
        wb.mat.opacity = Math.sin(cycle * Math.PI) * 0.78;
      }

      // --------------------------------------------------------------------------
      // G. Water Tap Splash Ripples, Foamy Burst & Startled Seabirds
      // --------------------------------------------------------------------------
      const splashElapsed = now - splashStartTime;
      const isSplashing = splashElapsed >= 0 && splashElapsed <= SPLASH_DURATION;
      const splashProgress = isSplashing ? splashElapsed / SPLASH_DURATION : 0;

      if (isSplashing) {
        // Expanding glowing ripple rings
        for (let r = 0; r < splashRings.length; r++) {
          const sr = splashRings[r];
          const localT = (splashProgress * 1.65 - sr.delay);
          if (localT > 0 && localT < 1.0) {
            sr.mesh.visible = true;
            sr.mesh.position.copy(splashOrigin);
            const ringScale = 0.4 + localT * 4.2;
            sr.mesh.scale.set(ringScale, 1, ringScale);
            sr.mat.opacity = (1.0 - localT) * 0.92;
          } else {
            sr.mesh.visible = false;
          }
        }

        // Quick foamy droplet splash burst over the first 1.25 seconds
        const dropWindow = splashElapsed * 0.001;
        if (dropWindow < 1.25) {
          dropInstanced.visible = true;
          const normD = dropWindow / 1.25;
          for (let i = 0; i < DROP_COUNT; i++) {
            const d = dropData[i];
            const x = splashOrigin.x + d.vx * dropWindow;
            const z = splashOrigin.z + d.vz * dropWindow;
            const y = splashOrigin.y + d.vy * dropWindow - 0.5 * 5.6 * dropWindow * dropWindow;
            const s = y > 0.02 ? d.scale * (1.0 - normD) : 0.001;
            dummy.position.set(x, Math.max(0.02, y), z);
            dummy.scale.setScalar(Math.max(0.001, s));
            dummy.updateMatrix();
            dropInstanced.setMatrixAt(i, dummy.matrix);
          }
          dropInstanced.instanceMatrix.needsUpdate = true;
        } else {
          dropInstanced.visible = false;
        }
      } else {
        for (let r = 0; r < splashRings.length; r++) {
          splashRings[r].mesh.visible = false;
        }
        dropInstanced.visible = false;
        if (hintBadge.classList.contains('active-splash')) {
          hintBadge.classList.remove('active-splash');
        }
      }

      // Seabirds: lazy slow orbits in idle; startle (flap faster, climb & scatter wider) on water splash
      const startleEnv = isSplashing ? Math.sin(Math.pow(splashProgress, 0.55) * Math.PI) : 0;
      let prevTime = animate.prevTime || now;
      const dtSec = Math.min((now - prevTime) * 0.001, 0.1);
      animate.prevTime = now;

      for (let b = 0; b < birds.length; b++) {
        const bird = birds[b];
        const speedBoost = 1.0 + startleEnv * 2.6;
        bird.angle += dtSec * bird.baseSpeed * speedBoost;

        const rad = bird.baseRadius + startleEnv * (0.85 + b * 0.22);
        const climb = startleEnv * (0.42 + b * 0.08);
        const bx = Math.cos(bird.angle) * rad;
        const bz = Math.sin(bird.angle) * rad;
        const by = Math.min(4.42, bird.baseHeight + climb + Math.sin(tSec * 1.7 + b) * 0.08);

        bird.group.position.set(bx, by, bz);
        // Face tangent along orbit
        bird.group.rotation.y = -bird.angle;
        bird.group.rotation.z = startleEnv * 0.25 * bird.scatterDir;

        const flapSpeed = 6.5 + startleEnv * 14.0;
        bird.flapPhase += dtSec * flapSpeed;
        const wingAng = Math.sin(bird.flapPhase) * (0.48 + startleEnv * 0.28);
        bird.leftWing.rotation.z = wingAng;
        bird.rightWing.rotation.z = -wingAng;
      }

      // --------------------------------------------------------------------------
      // H. Soft Drifting Clouds
      // --------------------------------------------------------------------------
      for (let c = 0; c < clouds.length; c++) {
        const cl = clouds[c];
        const ang = cl.baseAngle + tSec * cl.speed;
        cl.group.position.set(
          Math.cos(ang) * cl.radius,
          cl.height + Math.sin(tSec * 0.8 + c) * 0.05,
          Math.sin(ang) * cl.radius
        );
        cl.group.rotation.y = -ang + Math.PI * 0.5;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Perform initial framing once layout metrics are ready and start animation loop
    updateCameraFraming();
    requestAnimationFrame((t) => {
      updateCameraFraming();
      animate(t);
    });
  </script>
</body>
</html>
