<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cherry blossom garden — a tiny world</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #dbe9f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    touch-action: none;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
  canvas.pointer-hover {
    cursor: pointer;
  }
  .ui-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 12px 16px;
    transition: color 0.8s ease;
  }
  header {
    text-align: center;
    max-width: 94%;
    background: rgba(255, 250, 252, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 18px 9px 18px;
    border-radius: 22px;
    box-shadow: 0 4px 18px rgba(40, 24, 38, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 224, 236, 0.65);
    transition: background 1.2s ease, border-color 1.2s ease, box-shadow 1.2s ease;
  }
  body.dusk-ui header {
    background: rgba(28, 22, 42, 0.74);
    border-color: rgba(255, 190, 140, 0.28);
    box-shadow: 0 4px 20px rgba(8, 5, 18, 0.38), inset 0 1px 0 rgba(255, 220, 190, 0.14);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.08rem, 3.4vw, 1.38rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #3a2332;
    line-height: 1.15;
    transition: color 1.2s ease;
  }
  body.dusk-ui h1 {
    color: #fce6ec;
  }
  .subtitle {
    font-size: clamp(0.7rem, 2.1vw, 0.8rem);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #8c5872;
    margin-top: 1px;
    font-weight: 600;
    transition: color 1.2s ease;
  }
  body.dusk-ui .subtitle {
    color: #e6a8b8;
  }
  .hint {
    font-size: clamp(0.7rem, 2.2vw, 0.78rem);
    color: #5e4352;
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: color 1.2s ease;
  }
  body.dusk-ui .hint {
    color: #f3c89b;
  }
  footer {
    text-align: center;
    background: rgba(255, 250, 252, 0.68);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: clamp(0.68rem, 2vw, 0.76rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: #6e4a5e;
    border: 1px solid rgba(255, 224, 236, 0.6);
    box-shadow: 0 2px 10px rgba(40, 24, 38, 0.06);
    transition: background 1.2s ease, color 1.2s ease, border-color 1.2s ease;
  }
  body.dusk-ui footer {
    background: rgba(28, 22, 42, 0.7);
    color: #dcb8c8;
    border-color: rgba(255, 190, 140, 0.22);
  }
  #fallback-error {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #f6eef2;
    color: #3a2332;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  #fallback-error .card {
    max-width: 380px;
    background: #fff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  #fallback-error h2 {
    font-family: Georgia, serif;
    margin-bottom: 8px;
    font-size: 1.2rem;
  }
  #fallback-error p {
    font-size: 0.9rem;
    line-height: 1.45;
    color: #634b59;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-layer">
    <header id="ui-header">
      <h1>Cherry blossom garden</h1>
      <div class="subtitle">a tiny world</div>
      <div class="hint">tap a tree for petals - tap the lantern for dusk</div>
    </header>
    <footer id="ui-footer">A tiny world</footer>
  </div>

  <div id="fallback-error">
    <div class="card">
      <h2>WebGL Required</h2>
      <p>Unable to initialize the 3D miniature garden. Please ensure hardware acceleration and WebGL are enabled in your browser.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261102)
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261102);
    const randRange = (min, max) => min + rand() * (max - min);

    const container = document.getElementById('canvas-container');
    const headerEl = document.getElementById('ui-header');
    const footerEl = document.getElementById('ui-footer');
    const fallbackEl = document.getElementById('fallback-error');

    let renderer, scene, camera, controls;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: false
      });
    } catch (e) {
      fallbackEl.style.display = 'flex';
      throw e;
    }

    if (!renderer.capabilities.isWebGL2 && !renderer.context) {
      fallbackEl.style.display = 'flex';
      throw new Error('WebGL context unavailable');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();

    // Procedural Sky Gradient Backdrop Sphere
    const skyGeo = new THREE.SphereGeometry(65, 32, 24);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTopDay: { value: new THREE.Color('#8ec5ee') },
        uMidDay: { value: new THREE.Color('#cde6f7') },
        uBotDay: { value: new THREE.Color('#f7e8e4') },
        uTopDusk: { value: new THREE.Color('#131630') },
        uMidDusk: { value: new THREE.Color('#3b2854') },
        uBotDusk: { value: new THREE.Color('#8a495c') },
        uDusk: { value: 0.0 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPosition;
        uniform vec3 uTopDay;
        uniform vec3 uMidDay;
        uniform vec3 uBotDay;
        uniform vec3 uTopDusk;
        uniform vec3 uMidDusk;
        uniform vec3 uBotDusk;
        uniform float uDusk;
        void main() {
          vec3 dir = normalize(vWorldPosition);
          float h = clamp(dir.y * 0.85 + 0.25, 0.0, 1.0);
          vec3 dayCol = mix(uBotDay, uMidDay, smoothstep(0.0, 0.42, h));
          dayCol = mix(dayCol, uTopDay, smoothstep(0.42, 1.0, h));
          vec3 duskCol = mix(uBotDusk, uMidDusk, smoothstep(0.0, 0.40, h));
          duskCol = mix(duskCol, uTopDusk, smoothstep(0.40, 1.0, h));
          gl_FragColor = vec4(mix(dayCol, duskCol, uDusk), 1.0);
        }
      `
    });
    const skyMesh = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyMesh);

    camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 140);
    camera.position.set(11.5, 8.8, 12.8);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(24);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(68);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-55);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(75);
    controls.target.set(0, 1.85, 0);

    // Lighting
    const hemiLight = new THREE.HemisphereLight('#e9f5ff', '#729456', 0.95);
    hemiLight.position.set(0, 18, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight('#fff8ef', 2.05);
    dirLight.position.set(9.5, 15.5, 8.5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 32;
    const sc = 6.2;
    dirLight.shadow.camera.left = -sc;
    dirLight.shadow.camera.right = sc;
    dirLight.shadow.camera.top = sc;
    dirLight.shadow.camera.bottom = -sc;
    dirLight.shadow.bias = -0.0006;
    dirLight.shadow.normalBias = 0.025;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight('#ffd7e4', 0.55);
    rimLight.position.set(-9, 6, -8);
    scene.add(rimLight);

    // Warm PointLight inside the stone lantern + soft ground bounce
    const lanternLight = new THREE.PointLight('#ff9b38', 0.25, 9.5, 1.55);
    const lanternBounceLight = new THREE.PointLight('#ff8424', 0.0, 5.5, 1.8);
    scene.add(lanternLight);
    scene.add(lanternBounceLight);

    // Root garden group
    const gardenGroup = new THREE.Group();
    scene.add(gardenGroup);

    // Helper: create rounded bevel slab or stone via ExtrudeGeometry
    function createRoundedSlab(radius, height, bevelSize, curveSegments = 40) {
      const shape = new THREE.Shape();
      for (let i = 0; i <= curveSegments; i++) {
        const theta = (i / curveSegments) * Math.PI * 2;
        // Subtle organic squircle modulation
        const mod = 1.0 + 0.028 * Math.cos(theta * 4) + 0.015 * Math.sin(theta * 3 + 0.7);
        const r = radius * mod;
        const x = Math.cos(theta) * r;
        const y = Math.sin(theta) * r;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: height,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: bevelSize,
        bevelThickness: bevelSize
      });
      geo.rotateX(Math.PI / 2);
      geo.computeVertexNormals();
      return geo;
    }

    // Mound elevation formula on top of the grass slab
    function getGroundY(x, z) {
      const dist2 = x * x + z * z;
      const mound = Math.max(0, 0.22 * Math.exp(-dist2 / 14.5));
      const ripple = 0.035 * Math.sin(x * 0.75 + 0.4) * Math.cos(z * 0.75 - 0.2);
      return mound + ripple;
    }

    // 1. DIORAMA SLAB WITH VISIBLE SOIL STRATA SIDES & GRASS TOP
    const slabGroup = new THREE.Group();
    gardenGroup.add(slabGroup);

    // Bottom dark stone plinth
    const basePlinthMat = new THREE.MeshStandardMaterial({
      color: '#463932',
      roughness: 0.92,
      metalness: 0.04
    });
    const basePlinthGeo = createRoundedSlab(4.42, 0.24, 0.07, 48);
    const basePlinth = new THREE.Mesh(basePlinthGeo, basePlinthMat);
    basePlinth.position.y = -0.96;
    basePlinth.receiveShadow = true;
    slabGroup.add(basePlinth);

    // Deep clay soil stratum
    const deepSoilMat = new THREE.MeshStandardMaterial({
      color: '#6b4938',
      roughness: 0.9,
      metalness: 0.02
    });
    const deepSoilGeo = createRoundedSlab(4.48, 0.34, 0.08, 48);
    const deepSoil = new THREE.Mesh(deepSoilGeo, deepSoilMat);
    deepSoil.position.y = -0.58;
    deepSoil.receiveShadow = true;
    slabGroup.add(deepSoil);

    // Mid warm subsoil stratum
    const midSoilMat = new THREE.MeshStandardMaterial({
      color: '#886048',
      roughness: 0.88,
      metalness: 0.02
    });
    const midSoilGeo = createRoundedSlab(4.53, 0.30, 0.08, 48);
    const midSoil = new THREE.Mesh(midSoilGeo, midSoilMat);
    midSoil.position.y = -0.24;
    midSoil.receiveShadow = true;
    slabGroup.add(midSoil);

    // Embedded pebbles in soil strata sides
    const pebbleGeo = new THREE.DodecahedronGeometry(0.08, 1);
    const pebbleMat = new THREE.MeshStandardMaterial({
      color: '#9b948c',
      roughness: 0.85
    });
    for (let i = 0; i < 34; i++) {
      const ang = (i / 34) * Math.PI * 2 + randRange(-0.06, 0.06);
      const mod = 1.0 + 0.028 * Math.cos(ang * 4) + 0.015 * Math.sin(ang * 3 + 0.7);
      const r = 4.53 * mod;
      const py = randRange(-0.85, -0.22);
      const pMesh = new THREE.Mesh(pebbleGeo, pebbleMat);
      pMesh.position.set(Math.cos(ang) * r, py, Math.sin(ang) * r);
      pMesh.scale.set(randRange(0.7, 1.5), randRange(0.5, 1.0), randRange(0.7, 1.4));
      pMesh.rotation.set(randRange(0, 3), randRange(0, 3), randRange(0, 3));
      slabGroup.add(pMesh);
    }

    // Lush fresh green grass cap with vertex-displaced gentle mound
    const grassMat = new THREE.MeshStandardMaterial({
      color: '#5fa443',
      roughness: 0.84,
      metalness: 0.02
    });
    const grassGeo = createRoundedSlab(4.60, 0.22, 0.11, 56);
    const posAttr = grassGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const vx = posAttr.getX(i);
      const vy = posAttr.getY(i);
      const vz = posAttr.getZ(i);
      if (vy > -0.05) {
        const lift = getGroundY(vx, vz);
        posAttr.setY(i, vy + lift);
      }
    }
    grassGeo.computeVertexNormals();
    const grassSlab = new THREE.Mesh(grassGeo, grassMat);
    grassSlab.position.y = 0.05;
    grassSlab.receiveShadow = true;
    grassSlab.castShadow = true;
    slabGroup.add(grassSlab);

    // 2. WINDING STEPPING-STONE PATH
    const stonePathPoints = [
      { x: -1.85, z: 3.55, s: 0.44, rot: 0.2 },
      { x: -1.25, z: 2.85, s: 0.38, rot: 0.8 },
      { x: -0.62, z: 2.22, s: 0.42, rot: -0.4 },
      { x: -0.10, z: 1.50, s: 0.40, rot: 0.5 },
      { x: 0.25,  z: 0.72, s: 0.45, rot: 1.1 },
      { x: 0.15,  z: -0.12, s: 0.39, rot: -0.7 },
      { x: -0.25, z: -0.92, s: 0.43, rot: 0.3 },
      { x: -0.58, z: -1.72, s: 0.37, rot: 1.4 },
      { x: -0.70, z: -2.52, s: 0.41, rot: -0.2 },
      { x: -0.48, z: -3.28, s: 0.36, rot: 0.9 }
    ];

    const stepStoneBaseGeo = new THREE.CylinderGeometry(1, 1.08, 0.12, 9);
    // Flatten & bevel top vertices of stepping stone geometry
    const stPos = stepStoneBaseGeo.attributes.position;
    for (let i = 0; i < stPos.count; i++) {
      const x = stPos.getX(i);
      const y = stPos.getY(i);
      const z = stPos.getZ(i);
      const ang = Math.atan2(z, x);
      const rMod = 1 + 0.12 * Math.sin(ang * 3) + 0.08 * Math.cos(ang * 2);
      stPos.setX(i, x * rMod);
      stPos.setZ(i, z * rMod);
      if (y > 0) {
        const rad = Math.hypot(x, z);
        stPos.setY(i, y - rad * 0.025);
      }
    }
    stepStoneBaseGeo.computeVertexNormals();

    const stepStoneMat1 = new THREE.MeshStandardMaterial({ color: '#9ca19d', roughness: 0.86 });
    const stepStoneMat2 = new THREE.MeshStandardMaterial({ color: '#8a8f8c', roughness: 0.88 });

    stonePathPoints.forEach((pt, idx) => {
      const mesh = new THREE.Mesh(stepStoneBaseGeo, idx % 2 === 0 ? stepStoneMat1 : stepStoneMat2);
      const gy = getGroundY(pt.x, pt.z);
      mesh.position.set(pt.x, gy + 0.035, pt.z);
      mesh.scale.set(pt.s * 1.15, 1.0, pt.s * 0.92);
      mesh.rotation.y = pt.rot;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      gardenGroup.add(mesh);

      // Tiny companion side stone on alternating steps
      if (idx % 2 === 1) {
        const sideMesh = new THREE.Mesh(stepStoneBaseGeo, stepStoneMat2);
        const sx = pt.x + (idx % 4 === 1 ? 0.36 : -0.36);
        const sz = pt.z + 0.14;
        sideMesh.position.set(sx, getGroundY(sx, sz) + 0.025, sz);
        sideMesh.scale.set(0.18, 0.85, 0.15);
        sideMesh.rotation.y = pt.rot + 1.2;
        sideMesh.receiveShadow = true;
        gardenGroup.add(sideMesh);
      }
    });

    // 3. WEATHERED STONE LANTERN (Toro) beside the path + Warm Glowing Window + Proxy
    const lanternPos = { x: 1.12, z: 0.88 };
    const lanternBaseY = getGroundY(lanternPos.x, lanternPos.z) + 0.04;
    const lanternGroup = new THREE.Group();
    lanternGroup.position.set(lanternPos.x, lanternBaseY, lanternPos.z);
    lanternGroup.rotation.y = -0.35;
    gardenGroup.add(lanternGroup);

    const lanternStoneMat = new THREE.MeshStandardMaterial({
      color: '#8d918b',
      roughness: 0.88,
      metalness: 0.04
    });
    const lanternMossStoneMat = new THREE.MeshStandardMaterial({
      color: '#768272',
      roughness: 0.90,
      metalness: 0.02
    });
    const lanternWindowMat = new THREE.MeshStandardMaterial({
      color: '#fff2cf',
      emissive: '#ff962e',
      emissiveIntensity: 0.45,
      roughness: 0.3
    });

    // Kiso (hexagonal base pad)
    const kisoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.40, 0.14, 6), lanternMossStoneMat);
    kisoMesh.position.y = 0.07;
    kisoMesh.castShadow = true;
    kisoMesh.receiveShadow = true;
    lanternGroup.add(kisoMesh);

    // Lower collar
    const collar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.31, 0.10, 6), lanternStoneMat);
    collar1.position.y = 0.19;
    collar1.castShadow = true;
    lanternGroup.add(collar1);

    // Sao (central post)
    const saoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.56, 8), lanternStoneMat);
    saoMesh.position.y = 0.52;
    saoMesh.castShadow = true;
    saoMesh.receiveShadow = true;
    lanternGroup.add(saoMesh);

    // Chudai (middle platform supporting fire box)
    const chudaiMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.20, 0.13, 6), lanternMossStoneMat);
    chudaiMesh.position.y = 0.86;
    chudaiMesh.castShadow = true;
    lanternGroup.add(chudaiMesh);

    // Hibukuro (fire box with warm glowing inner core & corner pillars)
    const fireCore = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.30, 6), lanternWindowMat);
    fireCore.position.y = 1.07;
    lanternGroup.add(fireCore);

    // 6 carved stone corner mullions around the glowing firebox
    const mullionGeo = new THREE.BoxGeometry(0.055, 0.32, 0.055);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const mul = new THREE.Mesh(mullionGeo, lanternStoneMat);
      mul.position.set(Math.cos(a) * 0.205, 1.07, Math.sin(a) * 0.205);
      mul.rotation.y = -a;
      mul.castShadow = true;
      lanternGroup.add(mul);
    }

    // Upper frame ring of firebox
    const fireTopRing = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.05, 6), lanternStoneMat);
    fireTopRing.position.y = 1.24;
    lanternGroup.add(fireTopRing);

    // Kasa (curved hexagonal pagoda roof cap)
    const kasaLower = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.52, 0.18, 6), lanternMossStoneMat);
    kasaLower.position.y = 1.34;
    kasaLower.castShadow = true;
    kasaLower.receiveShadow = true;
    lanternGroup.add(kasaLower);

    const kasaUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.32, 0.14, 6), lanternStoneMat);
    kasaUpper.position.y = 1.49;
    kasaUpper.castShadow = true;
    lanternGroup.add(kasaUpper);

    // Hoju (lotus bud finial)
    const hojuBase = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.08, 0.05, 8), lanternMossStoneMat);
    hojuBase.position.y = 1.58;
    lanternGroup.add(hojuBase);

    const hojuTip = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 10), lanternStoneMat);
    hojuTip.scale.set(1, 1.35, 1);
    hojuTip.position.y = 1.66;
    hojuTip.castShadow = true;
    lanternGroup.add(hojuTip);

    // Position the lantern point lights at firebox height
    lanternLight.position.set(lanternPos.x, lanternBaseY + 1.07, lanternPos.z);
    lanternBounceLight.position.set(lanternPos.x - 0.15, lanternBaseY + 0.35, lanternPos.z + 0.15);

    // Warm ground glow decal disc under lantern (subtle additive glow at dusk)
    const glowPoolGeo = new THREE.CircleGeometry(1.85, 32);
    glowPoolGeo.rotateX(-Math.PI / 2);
    const glowPoolMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uIntensity: { value: 0.0 },
        uColor: { value: new THREE.Color('#ff922b') }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv * 2.0 - 1.0;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

    // 7. CHERRY TREES (5 trees: varied sizes & lean angles, segmented dark trunks, multi-blob pink canopies)
    const barkMat = new THREE.MeshStandardMaterial({

    // 5 Sakura pink materials from pale blush to deep rich sakura
    const sakuraPalette = [

    const sakuraMaterials = sakuraPalette.map((hex) => {

        color: hex,

    // Organic sculpted blossom cluster geometry
    const blobGeo = new THREE.IcosahedronGeometry(1, 2);

    for (let i = 0; i < bPos.count; i++) {
      const vx = bPos.getX(i);

      const vz = bPos.getZ(i);
      const bump = 1.0 + 0.08 * Math.sin(vx * 5.0) * Math.cos(vy * 5.0) * Math.sin(vz * 5.0);
      bPos.setXYZ(i, vx * bump, vy * bump * 0.82, vz * bump);
    }
    blobGeo.computeVertexNormals();

    const treeConfigs = [
      {

      },
      {

    const trees = [];
    const interactiveProxies = [];

    function buildSegmentedBranch(parent, startPos, dirVec, length, rBottom, rTop, segments) {
      let currPos = startPos.clone();
      let currDir = dirVec.clone().normalize();
      const segLen = length / segments;

      for (let s = 0; s < segments; s++) {
        const t0 = s / segments;
        const t1 = (s + 1) / segments;
        const rb = THREE.MathUtils.lerp(rBottom, rTop, t0);
        const rt = THREE.MathUtils.lerp(rBottom, rTop, t1);

        const cylGeo = new THREE.CylinderGeometry(rt, rb, segLen * 1.08, 8);
        cylGeo.translate(0, segLen * 0.5, 0);
        const segMesh = new THREE.Mesh(cylGeo, barkMat);
        segMesh.position.copy(currPos);

        const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), currDir);
        segMesh.quaternion.copy(quat);
        segMesh.castShadow = true;
        segMesh.receiveShadow = true;
        parent.add(segMesh);

        // Advance & bend organically
        currPos.addScaledVector(currDir, segLen);
        currDir.x += randRange(-0.14, 0.14);
        currDir.z += randRange(-0.14, 0.14);
        currDir.y = Math.max(0.25, currDir.y + randRange(-0.06, 0.08));
        currDir.normalize();
      }
      return currPos;
    }

    treeConfigs.forEach((cfg) => {

      // Main bending trunk

          bTip.clone().multiplyScalar(0.55),

          bLen * 0.65,
          cfg.trunkRadius * 0.28,
          cfg.trunkRadius * 0.12,
          2
        );
        blobPositionsLocal.push(tTip);
      });

      canopyGroup.updateWorldMatrix(true, false);

    // 8. PETAL GEOMETRY (Shared curved sakura petal with notched tip)
    function createSakuraPetalGeometry() {

      shape.lineTo(0.0, 0.038); // Characteristic sakura notch

      shape.bezierCurveTo(-0.055, 0.025, -0.048, -0.035, 0, -0.055);

      const geo = new THREE.ShapeGeometry(shape, 4);
      geo.rotateX(-Math.PI / 2);
      return geo;

        if (clampR > 4.1) {
          px *= 4.1 / clampR;
          pz *= 4.1 / clampR;
        }
      } else {
        const r = Math.sqrt(rand()) * 4.1;

      const py = getGroundY(px, pz) + 0.048;

      dummy.rotation.set(randRange(-0.18, 0.18), randRange(0, Math.PI * 2), randRange(-0.18, 0.18));

    // 10. CONTINUOUS SPARSE IDLE FALLING PETALS (95 instanced petals)
    const idlePetalCount = 95;
    const idlePetalsMesh = new THREE.InstancedMesh(sharedPetalGeo, sharedPetalMat, idlePetalCount);

    if (idlePetalsMesh.instanceColor) idlePetalsMesh.instanceColor.needsUpdate = true;

    // 11. INTERACTION 1: HERO PETAL SHOWER PER TREE (5 trees x 260 petals = 1300 instanced petals)
    const burstPerTree = 260;
    const totalBurstPetals = trees.length * burstPerTree;
    const burstPetalsMesh = new THREE.InstancedMesh(sharedPetalGeo, sharedPetalMat, totalBurstPetals);
    burstPetalsMesh.frustumCulled = false;
    gardenGroup.add(burstPetalsMesh);

    const burstPetalData = [];
    for (let tIdx = 0; tIdx < trees.length; tIdx++) {
      const tree = trees[tIdx];
      for (let i = 0; i < burstPerTree; i++) {
        const theta = rand() * Math.PI * 2;
        const phi = Math.acos(2 * rand() - 1);
        const rSpawn = Math.cbrt(rand()) * tree.radius * 0.78;

        const ox = tree.worldCenter.x + rSpawn * Math.sin(phi) * Math.cos(theta);
        const oy = tree.worldCenter.y + rSpawn * Math.cos(phi) * 0.65;
        const oz = tree.worldCenter.z + rSpawn * Math.sin(phi) * Math.sin(theta);

        // Outward radial burst velocity + swirl parameters
        const outSpeed = randRange(0.45, 1.55);
        const vx = Math.cos(theta) * outSpeed + randRange(0.15, 0.45); // gentle breeze bias
        const vz = Math.sin(theta) * outSpeed + randRange(-0.2, 0.25);
        const vyUp = randRange(0.25, 1.05);
        const fallRate = randRange(0.82, 1.38);

        burstPetalData.push({
          treeIdx: tIdx,
          ox,
          oy,
          oz,
          vx,
          vyUp,
          vz,
          fallRate,
          swirlAmp: randRange(0.18, 0.48),
          swirlFreq: randRange(2.4, 5.2),
          swirlPhase: randRange(0, Math.PI * 2),
          rx: randRange(2.2, 6.2),
          ry: randRange(2.0, 5.8),
          rz: randRange(1.8, 5.4),
          scale: randRange(1.1, 1.75)
        });

        const globalIdx = tIdx * burstPerTree + i;
        pColor.set(sakuraPalette[i % sakuraPalette.length]);
        burstPetalsMesh.setColorAt(globalIdx, pColor);

        dummy.position.set(0, -50, 0);
        dummy.scale.set(0, 0, 0);
        dummy.updateMatrix();
        burstPetalsMesh.setMatrixAt(globalIdx, dummy.matrix);
      }
    }
    burstPetalsMesh.instanceMatrix.needsUpdate = true;
    if (burstPetalsMesh.instanceColor) burstPetalsMesh.instanceColor.needsUpdate = true;

    // 12. SOFT DISTANT CLOUDS (Barely drifting inside safe framing band)
    const cloudMat = new THREE.MeshStandardMaterial({
      color: '#ffffff',
      roughness: 0.95,
      transparent: true,
      opacity: 0.78
    });
    const clouds = [];
    const cloudSpecs = [
      { x: -3.2, y: 3.85, z: -3.6, s: 0.55, speed: 0.08 },
      { x: 2.8,  y: 4.05, z: -3.8, s: 0.48, speed: 0.065 }
    ];
    cloudSpecs.forEach((cs, idx) => {
      const cGroup = new THREE.Group();
      cGroup.position.set(cs.x, cs.y, cs.z);
      const puffPositions = [
        [0, 0, 0, 1.0],
        [-0.55, -0.06, 0.08, 0.75],
        [0.55, -0.08, -0.05, 0.78],
        [0.2, 0.16, 0.12, 0.7]
      ];
      puffPositions.forEach((pp) => {
        const pMesh = new THREE.Mesh(blobGeo, cloudMat);
        pMesh.position.set(pp[0] * cs.s, pp[1] * cs.s, pp[2] * cs.s);
        pMesh.scale.set(pp[3] * cs.s * 1.15, pp[3] * cs.s * 0.55, pp[3] * cs.s * 0.75);
        cGroup.add(pMesh);
      });
      gardenGroup.add(cGroup);
      clouds.push({ group: cGroup, baseX: cs.x, speed: cs.speed, phase: idx * 2.1 });
    });

    // 13. INTERACTION 2: FIREFLIES AROUND THE PATH & LANTERN AT DUSK (56 instanced glowing motes)
    const fireflyCount = 56;
    const fireflyGeo = new THREE.SphereGeometry(0.036, 8, 8);
    const fireflyMat = new THREE.MeshBasicMaterial({
      color: '#ffe66d',
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const firefliesMesh = new THREE.InstancedMesh(fireflyGeo, fireflyMat, fireflyCount);
    gardenGroup.add(firefliesMesh);

    const fireflyData = [];
    for (let i = 0; i < fireflyCount; i++) {
      // Cluster near the stepping-stone path, bamboo basin, and lantern
      const pathRef = stonePathPoints[i % stonePathPoints.length];
      const baseX = pathRef.x + randRange(-1.45, 1.65);
      const baseZ = pathRef.z + randRange(-1.15, 1.15);
      const minY = getGroundY(baseX, baseZ) + 0.18;
      fireflyData.push({
        baseX,
        baseZ,
        minY,
        riseHeight: randRange(0.95, 1.85),
        speed: randRange(0.22, 0.45),
        phase: randRange(0, 10.0),
        wobbleR: randRange(0.18, 0.42),
        wobbleFreq: randRange(1.2, 2.6),
        pulseFreq: randRange(2.5, 5.2)
      });
    }

    // 14. DUSK MODE STATE & TRANSITION PARAMETERS
    let duskTarget = 0; // 0 = Day, 1 = Dusk
    let duskStartVal = 0;
    let duskCurrent = 0;
    let duskTransitionStart = -99999;
    const DUSK_TRANSITION_MS = 3000;

    // Color targets for smooth interpolation
    const colHemiSkyDay = new THREE.Color('#e9f5ff');
    const colHemiSkyDusk = new THREE.Color('#42396b');
    const colHemiGroundDay = new THREE.Color('#729456');
    const colHemiGroundDusk = new THREE.Color('#242038');

    const colDirDay = new THREE.Color('#fff8ef');
    const colDirDusk = new THREE.Color('#8e76b8');

    const colRimDay = new THREE.Color('#ffd7e4');
    const colRimDusk = new THREE.Color('#ff9a52');

    const colPetalEmissiveDay = new THREE.Color('#ff8da8');
    const colPetalEmissiveDusk = new THREE.Color('#ff9642');

    const colCloudDay = new THREE.Color('#ffffff');
    const colCloudDusk = new THREE.Color('#634f7d');

    const tempColor = new THREE.Color();

    function toggleDuskMode(nowMs) {
      duskStartVal = duskCurrent;
      duskTarget = duskTarget === 0 ? 1 : 0;
      duskTransitionStart = nowMs;
      if (duskTarget === 1) {
        document.body.classList.add('dusk-ui');
      } else {
        document.body.classList.remove('dusk-ui');
      }
    }

    function triggerTreePetalBurst(treeIndex, nowMs) {
      const tree = trees[treeIndex];
      if (!tree) return;
      tree.burstStartTime = nowMs;
    }

    // 15. ASPECT-AWARE FRAMING & BOUNDING BOX CAMERA DISTANCE COMPUTATION
    // Ensures full slab, every tree crown, lantern & path fit inside safe area between header & footer
    const framingPoints = [
      // Slab perimeter bounds
      new THREE.Vector3(-4.85, -1.02, -4.85),
      new THREE.Vector3( 4.85, -1.02, -4.85),
      new THREE.Vector3(-4.85, -1.02,  4.85),
      new THREE.Vector3( 4.85, -1.02,  4.85),
      new THREE.Vector3(-4.85,  0.45,  0.0),
      new THREE.Vector3( 4.85,  0.45,  0.0),
      new THREE.Vector3( 0.0,   0.45, -4.85),
      new THREE.Vector3( 0.0,   0.45,  4.85),
      // Lantern top finial
      new THREE.Vector3(lanternPos.x, lanternBaseY + 1.85, lanternPos.z)
    ];

    // Add all 5 tree crown bounding extremes
    trees.forEach((t) => {
      const r = t.radius * 1.18;
      const c = t.worldCenter;
      framingPoints.push(new THREE.Vector3(c.x - r, c.y + r * 0.92, c.z - r));
      framingPoints.push(new THREE.Vector3(c.x + r, c.y + r * 0.92, c.z + r));
      framingPoints.push(new THREE.Vector3(c.x - r, c.y + r * 0.92, c.z + r));
      framingPoints.push(new THREE.Vector3(c.x + r, c.y + r * 0.92, c.z - r));
    });

    function updateCameraFraming() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const aspect = vw / Math.max(1, vh);

      // Aspect-aware FOV: slightly wider vertical FOV on narrow portrait screens
      const fovDeg = aspect < 0.75 ? 40 : (aspect < 1.0 ? 37 : 33);
      camera.fov = fovDeg;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Measure header and footer DOM rectangles to reserve exact safe areas
      const headerRect = headerEl.getBoundingClientRect();
      const footerRect = footerEl.getBoundingClientRect();

      const topSafePx = Math.max(headerRect.bottom + 14, vh * 0.14);
      const bottomSafePx = Math.max(vh - footerRect.top + 14, vh * 0.09);

      // Available normalized device coordinates [-1, 1] for vertical and horizontal safe bands
      const ndcTopMax = 1.0 - (topSafePx / vh) * 2.0;
      const ndcBotMin = -1.0 + (bottomSafePx / vh) * 2.0;
      const safeHalfNdcY = Math.max(0.28, Math.min(ndcTopMax, -ndcBotMin) * 0.93);
      const safeHalfNdcX = 0.91;

      // Center target slightly biased so asymmetrical UI header/footer balance nicely
      const centerTarget = new THREE.Vector3(0.0, 1.55, -0.15);
      controls.target.copy(centerTarget);

      // Current view direction unit vector (preserve user orbit angle if rotated, default 3/4 elevated view)
      const viewDir = camera.position.clone().sub(controls.target).normalize();
      if (viewDir.lengthSq() < 0.001) {
        viewDir.set(0.56, 0.42, 0.71).normalize();
      }

      // Orthonormal camera basis vectors
      const worldUp = new THREE.Vector3(0, 1, 0);
      const camRight = new THREE.Vector3().crossVectors(worldUp, viewDir).normalize();
      const camUp = new THREE.Vector3().crossVectors(viewDir, camRight).normalize();

      const tanHalfFovY = Math.tan(THREE.MathUtils.degToRad(fovDeg * 0.5));
      const tanHalfFovX = tanHalfFovY * aspect;

      let requiredDistance = 8.0;
      framingPoints.forEach((pt) => {
        const rel = pt.clone().sub(centerTarget);
        const projX = Math.abs(rel.dot(camRight));
        const projY = Math.abs(rel.dot(camUp));
        const projZ = rel.dot(viewDir); // distance along camera ray toward camera

        const distForX = projX / (tanHalfFovX * safeHalfNdcX) + projZ;
        const distForY = projY / (tanHalfFovY * safeHalfNdcY) + projZ;
        requiredDistance = Math.max(requiredDistance, distForX, distForY);
      });

      const finalDist = requiredDistance * 1.04;
      camera.position.copy(centerTarget).addScaledVector(viewDir, finalDist);
      controls.minDistance = finalDist * 0.82;
      controls.maxDistance = finalDist * 1.25;
      controls.update();
    }

    // Initial framing & responsive resize listener
    updateCameraFraming();
    window.addEventListener('resize', () => {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraFraming();
    });

    // 16. RAYCASTER POINTER / TOUCH INTERACTION (Distinguish tap from orbit drag)
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;
    let isPointerDown = false;

    function updatePointerNdc(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (isPointerDown) return;
      updatePointerNdc(e.clientX, e.clientY);
      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(interactiveProxies, false);
      if (hits.length > 0) {
        renderer.domElement.classList.add('pointer-hover');
      } else {
        renderer.domElement.classList.remove('pointer-hover');
      }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;

      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const elapsed = performance.now() - pointerDownTime;

      // Distinguish crisp tap from drag
      if (dist < 9 && elapsed < 500) {
        updatePointerNdc(e.clientX, e.clientY);
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(interactiveProxies, false);
        if (hits.length > 0) {
          // The lantern sits beneath generous tree canopies; let it win when directly tapped
          const chosenHit = hits.find(h => h.object.userData.type === 'lantern') || hits[0];
          const hitData = chosenHit.object.userData;
          const nowMs = performance.now();
          if (hitData.type === 'tree') {
            triggerTreePetalBurst(hitData.treeIndex, nowMs);
          } else if (hitData.type === 'lantern') {
            toggleDuskMode(nowMs);
          }
        }
      }
    });

    // 17. ANIMATION LOOP (All motion driven strictly by performance.now)
    const BURST_DURATION_SEC = 6.2;

    function animate(nowMs) {
      requestAnimationFrame(animate);

      const tSec = nowMs * 0.001;

      // A. Update Dusk Transition & Lighting
      if (duskTransitionStart > 0) {
        const p = Math.min(1.0, (nowMs - duskTransitionStart) / DUSK_TRANSITION_MS);
        // Smooth cubic ease-in-out
        const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        duskCurrent = THREE.MathUtils.lerp(duskStartVal, duskTarget, ease);
      }

      skyMat.uniforms.uDusk.value = duskCurrent;

      hemiLight.color.copy(colHemiSkyDay).lerp(colHemiSkyDusk, duskCurrent);
      hemiLight.groundColor.copy(colHemiGroundDay).lerp(colHemiGroundDusk, duskCurrent);
      hemiLight.intensity = THREE.MathUtils.lerp(0.95, 0.42, duskCurrent);

      dirLight.color.copy(colDirDay).lerp(colDirDusk, duskCurrent);
      dirLight.intensity = THREE.MathUtils.lerp(2.05, 0.48, duskCurrent);

      rimLight.color.copy(colRimDay).lerp(colRimDusk, duskCurrent);
      rimLight.intensity = THREE.MathUtils.lerp(0.55, 0.45, duskCurrent);

      // Subtle warm lantern flicker in dusk mode
      const flicker = 1.0 + 0.09 * Math.sin(tSec * 11.3) * Math.cos(tSec * 7.1) + 0.04 * Math.sin(tSec * 19.7);
      const lanternWarmth = THREE.MathUtils.lerp(0.08, 1.0, duskCurrent) * flicker;

      lanternWindowMat.emissiveIntensity = THREE.MathUtils.lerp(0.38, 3.6, duskCurrent) * flicker;
      lanternLight.intensity = THREE.MathUtils.lerp(0.15, 5.2, duskCurrent) * flicker;
      lanternBounceLight.intensity = THREE.MathUtils.lerp(0.0, 2.4, duskCurrent) * flicker;
      glowPoolMat.uniforms.uIntensity.value = duskCurrent * flicker;

      // Petal edges catch warm amber glow at dusk
      sharedPetalMat.emissive.copy(colPetalEmissiveDay).lerp(colPetalEmissiveDusk, duskCurrent);
      sharedPetalMat.emissiveIntensity = THREE.MathUtils.lerp(0.14, 0.34, duskCurrent);

      sakuraMaterials.forEach((mat) => {
        mat.emissive.copy(colPetalEmissiveDay).lerp(colPetalEmissiveDusk, duskCurrent);
        mat.emissiveIntensity = THREE.MathUtils.lerp(0.06, 0.16, duskCurrent);
      });

      // Cloud tinting & gentle drift
      cloudMat.color.copy(colCloudDay).lerp(colCloudDusk, duskCurrent);
      cloudMat.opacity = THREE.MathUtils.lerp(0.76, 0.35, duskCurrent);
      clouds.forEach((c) => {
        c.group.position.x = c.baseX + Math.sin(tSec * c.speed + c.phase) * 0.45;
      });

      // B. Update Trees: Gentle idle breeze sway + independent tap tremble
      trees.forEach((tree) => {
        const breezeX = Math.sin(tSec * 1.15 + tree.swayPhase) * 0.022;
        const breezeZ = Math.cos(tSec * 0.95 + tree.swayPhase * 0.8) * 0.024;

        let trembleX = 0;
        let trembleZ = 0;
        let pulseScale = 1.0;

        const burstElapsedSec = (nowMs - tree.burstStartTime) * 0.001;
        if (burstElapsedSec >= 0 && burstElapsedSec < 1.8) {
          const decay = Math.exp(-burstElapsedSec * 2.8);
          trembleX = Math.sin(burstElapsedSec * 36.0) * 0.075 * decay;
          trembleZ = Math.cos(burstElapsedSec * 31.0) * 0.075 * decay;
          pulseScale = 1.0 + Math.sin(burstElapsedSec * 18.0) * 0.045 * decay;
        }

        tree.canopy.rotation.x = breezeX + trembleX;
        tree.canopy.rotation.z = breezeZ + trembleZ;
        tree.canopy.scale.setScalar(pulseScale);
      });

      // C. Update Continuous Sparse Idle Falling Petals (Safe vertical bounds below header)
      for (let i = 0; i < idlePetalCount; i++) {
        const p = idlePetalSeeds[i];
        const cycleTime = (tSec + p.phaseOffset) % p.cycleDuration;
        const norm = cycleTime / p.cycleDuration; // 0..1

        let px, py, pz, scale;
        if (norm < 0.82) {
          const fallFrac = norm / 0.82;
          py = THREE.MathUtils.lerp(p.startY, p.groundY, fallFrac);
          px = p.startX + Math.sin(tSec * p.swirlFreq + p.phaseOffset) * p.swirlRadius + fallFrac * p.driftX;
          pz = p.startZ + Math.cos(tSec * p.swirlFreq * 0.85 + p.phaseOffset) * p.swirlRadius + fallFrac * p.driftZ;

          // Keep strictly within garden radius so petals never cross UI header/footer
          const rHoriz = Math.hypot(px, pz);
          if (rHoriz > 4.25) {
            px *= 4.25 / rHoriz;
            pz *= 4.25 / rHoriz;
          }
          const pyMin = getGroundY(px, pz) + 0.048;
          if (py < pyMin) py = pyMin;

          scale = p.baseScale * Math.min(1.0, fallFrac * 7.0);
          dummy.rotation.set(
            tSec * p.rotSpeedX + p.phaseOffset,
            tSec * p.rotSpeedY,
            tSec * p.rotSpeedZ
          );
        } else {
          // Rest briefly on the grass, then shrink cleanly before recycling
          const restFrac = (norm - 0.82) / 0.18;
          px = p.startX + Math.sin((p.cycleDuration * 0.82 - p.phaseOffset) * p.swirlFreq) * p.swirlRadius + p.driftX;
          pz = p.startZ + Math.cos((p.cycleDuration * 0.82 - p.phaseOffset) * p.swirlFreq * 0.85) * p.swirlRadius + p.driftZ;
          const rHoriz = Math.hypot(px, pz);
          if (rHoriz > 4.25) {
            px *= 4.25 / rHoriz;
            pz *= 4.25 / rHoriz;
          }
          py = getGroundY(px, pz) + 0.048;
          scale = p.baseScale * (1.0 - THREE.MathUtils.smoothstep(restFrac, 0.3, 1.0));
          dummy.rotation.set(0.08, p.phaseOffset, -0.06);
        }

        dummy.position.set(px, py, pz);
        dummy.scale.setScalar(scale);
        dummy.updateMatrix();
        idlePetalsMesh.setMatrixAt(i, dummy.matrix);
      }
      idlePetalsMesh.instanceMatrix.needsUpdate = true;

      // D. Update Hero Tree Petal Showers (Per-tree independent ~6.2s cycle)
      let anyBurstActive = false;
      for (let tIdx = 0; tIdx < trees.length; tIdx++) {
        const tree = trees[tIdx];
        const elapsed = (nowMs - tree.burstStartTime) * 0.001;

        if (elapsed >= 0 && elapsed <= BURST_DURATION_SEC) {
          anyBurstActive = true;
          for (let i = 0; i < burstPerTree; i++) {
            const globalIdx = tIdx * burstPerTree + i;
            const b = burstPetalData[globalIdx];

            // Outward impulse with drag + swirling wind drift
            const drag = (1.0 - Math.exp(-elapsed * 1.45)) / 1.45;
            const swirlX = Math.sin(elapsed * b.swirlFreq + b.swirlPhase) * b.swirlAmp * Math.min(1.0, elapsed * 1.2);
            const swirlZ = Math.cos(elapsed * b.swirlFreq * 0.9 + b.swirlPhase) * b.swirlAmp * Math.min(1.0, elapsed * 1.2);

            let px = b.ox + b.vx * drag + swirlX + elapsed * 0.16;
            let pz = b.oz + b.vz * drag + swirlZ;

            // Clamp within diorama slab perimeter so petals carpet the garden slab and never cross UI
            const distFromCenter = Math.hypot(px, pz);
            if (distFromCenter > 4.22) {
              px *= 4.22 / distFromCenter;
              pz *= 4.22 / distFromCenter;
            }

            const groundFloor = getGroundY(px, pz) + 0.052;
            const rawY = b.oy + b.vyUp * drag * 0.55 - b.fallRate * elapsed;

            // Clamp max height so burst stays well below top header UI
            const clampedTopY = Math.min(rawY, tree.worldCenter.y + 0.95);
            const landed = clampedTopY <= groundFloor;
            const py = landed ? groundFloor : clampedTopY;

            // Scale envelope: fast pop-in on tap, full size while swirling & carpeting ground, smooth fade out over final 1.4s
            const fadeIn = Math.min(1.0, elapsed * 9.0);
            const fadeOut = 1.0 - THREE.MathUtils.smoothstep(elapsed, BURST_DURATION_SEC - 1.45, BURST_DURATION_SEC);
            const sc = b.scale * fadeIn * fadeOut;

            dummy.position.set(px, py, pz);
            if (landed) {
              dummy.rotation.set(0.08 * Math.sin(b.swirlPhase), b.swirlPhase, 0.08 * Math.cos(b.swirlPhase));
              dummy.scale.set(sc * 1.08, sc * 0.6, sc * 1.08);
            } else {
              dummy.rotation.set(
                elapsed * b.rx + b.swirlPhase,
                elapsed * b.ry,
                elapsed * b.rz
              );
              dummy.scale.setScalar(sc);
            }
            dummy.updateMatrix();
            burstPetalsMesh.setMatrixAt(globalIdx, dummy.matrix);
          }
        } else if (elapsed > BURST_DURATION_SEC && elapsed < BURST_DURATION_SEC + 0.25) {
          // Ensure clean hide once finished
          anyBurstActive = true;
          for (let i = 0; i < burstPerTree; i++) {
            const globalIdx = tIdx * burstPerTree + i;
            dummy.position.set(0, -50, 0);
            dummy.scale.set(0, 0, 0);
            dummy.updateMatrix();
            burstPetalsMesh.setMatrixAt(globalIdx, dummy.matrix);
          }
        }
      }
      if (anyBurstActive) {
        burstPetalsMesh.instanceMatrix.needsUpdate = true;
      }

      // E. Update Fireflies at Dusk
      fireflyMat.opacity = THREE.MathUtils.smoothstep(duskCurrent, 0.15, 0.95) * 0.92;
      if (duskCurrent > 0.05) {
        for (let i = 0; i < fireflyCount; i++) {
          const f = fireflyData[i];
          const cyc = (tSec * f.speed + f.phase) % 1.0;
          const fy = f.minY + cyc * f.riseHeight;
          const fx = f.baseX + Math.sin(tSec * f.wobbleFreq + f.phase) * f.wobbleR;
          const fz = f.baseZ + Math.cos(tSec * f.wobbleFreq * 0.85 + f.phase) * f.wobbleR;

          // Fade in at bottom of rise, fade out near top, plus bioluminescent pulse
          const env = Math.sin(cyc * Math.PI);
          const pulse = 0.55 + 0.45 * Math.sin(tSec * f.pulseFreq + f.phase * 3.0);
          const sc = env * pulse * duskCurrent * 1.25;

          dummy.position.set(fx, fy, fz);
          dummy.scale.setScalar(sc);
          dummy.updateMatrix();
          firefliesMesh.setMatrixAt(i, dummy.matrix);
        }
        firefliesMesh.instanceMatrix.needsUpdate = true;
      }

      // F. Subtle water stream shimmer in bamboo basin
      waterStream.scale.x = 0.9 + 0.15 * Math.sin(tSec * 9.0);
      waterStream.scale.z = 0.9 + 0.15 * Math.cos(tSec * 9.0);

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
