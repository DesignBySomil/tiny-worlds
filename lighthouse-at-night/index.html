<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lighthouse at night</title>
  <style>
    :root {
      --bg-top: #040811;
      --bg-bottom: #091322;
      --text-primary: #eef4fa;
      --text-secondary: #8ea9c4;
      --accent-warm: #ffb84d;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas.dragging-beam {
      cursor: ew-resize;
    }
    canvas.hover-interactive {
      cursor: pointer;
    }
    canvas:active {
      cursor: grabbing;
    }
    header {
      position: relative;
      z-index: 2;
      padding: 14px 16px 10px;
      text-align: center;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(4, 8, 17, 0.92) 0%, rgba(4, 8, 17, 0.65) 75%, rgba(4, 8, 17, 0) 100%);
    }
    h1 {
      font-size: clamp(1.1rem, 3.5vw, 1.45rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      line-height: 1.2;
    }
    .subtitle {
      font-size: clamp(0.74rem, 2.2vw, 0.86rem);
      font-weight: 400;
      color: var(--accent-warm);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
      opacity: 0.9;
    }
    .hint {
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      color: var(--text-secondary);
      margin-top: 5px;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .status-pill {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.66rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(255, 184, 77, 0.14);
      border: 1px solid rgba(255, 184, 77, 0.35);
      color: #ffd38a;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    footer {
      position: relative;
      z-index: 2;
      padding: 10px 16px 12px;
      text-align: center;
      pointer-events: none;
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(142, 169, 196, 0.65);
      background: linear-gradient(0deg, rgba(4, 8, 17, 0.9) 0%, rgba(4, 8, 17, 0.55) 70%, rgba(4, 8, 17, 0) 100%);
    }
    #fallback {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #050a14;
      color: #eef4fa;
      font-size: 0.95rem;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="ui-header">
      <h1>Lighthouse at night</h1>
      <div class="subtitle">a tiny world</div>
      <div class="hint">drag to sweep the beam - tap the lamp for fog</div>
      <div id="status-badge" class="status-pill">Clear Night • Auto Sweep</div>
    </header>
    <div id="canvas-container"></div>
    <footer id="ui-footer">A tiny world</footer>
    <div id="fallback">WebGL could not be initialized on this device or browser. Please enable hardware acceleration to view the 3D miniature.</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261102)
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261102);
    const randRange = (min, max) => min + rand() * (max - min);

    const container = document.getElementById('canvas-container');
    const headerEl = document.getElementById('ui-header');
    const footerEl = document.getElementById('ui-footer');
    const statusBadge = document.getElementById('status-badge');
    const fallbackEl = document.getElementById('fallback');

    let renderer, scene, camera, controls;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.38;
      container.appendChild(renderer.domElement);
    } catch (e) {
      fallbackEl.style.display = 'flex';
      throw e;
    }

    scene = new THREE.Scene();
    const FOG_COLOR_CLEAR = new THREE.Color(0x060d1a);
    const FOG_COLOR_DENSE = new THREE.Color(0x3b5578);
    scene.fog = new THREE.FogExp2(FOG_COLOR_CLEAR.getHex(), 0.015);

    camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 120);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(36);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(68);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-42);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(42);

    // Procedural Canvas Textures
    function createRadialGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
      g.addColorStop(0.0, 'rgba(255, 246, 210, 1.0)');
      g.addColorStop(0.22, 'rgba(255, 195, 85, 0.85)');
      g.addColorStop(0.55, 'rgba(255, 145, 35, 0.28)');
      g.addColorStop(1.0, 'rgba(255, 120, 20, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function createBeamGradientTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      // Cylinder top (y=0 in canvas is top UV v=1)
      g.addColorStop(0.0, 'rgba(255, 230, 165, 0.95)');
      g.addColorStop(0.18, 'rgba(255, 190, 85, 0.55)');
      g.addColorStop(0.55, 'rgba(255, 165, 55, 0.20)');
      g.addColorStop(0.88, 'rgba(255, 145, 40, 0.05)');
      g.addColorStop(1.0, 'rgba(255, 135, 30, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const glowTex = createRadialGlowTexture();
    const beamGradTex = createBeamGradientTexture();

    // Shared Materials
    const mats = {
      strataBottom: new THREE.MeshStandardMaterial({ color: 0x0b121c, roughness: 0.92, metalness: 0.05, flatShading: true }),
      strataMid: new THREE.MeshStandardMaterial({ color: 0x121d2b, roughness: 0.88, metalness: 0.06, flatShading: true }),
      strataTop: new THREE.MeshStandardMaterial({ color: 0x17293c, roughness: 0.82, metalness: 0.08, flatShading: true }),
      seaSurface: new THREE.MeshStandardMaterial({
        color: 0x0a2e46,
        emissive: 0x03111c,
        roughness: 0.26,
        metalness: 0.35,
        flatShading: true
      }),
      seaSwell: new THREE.MeshStandardMaterial({
        color: 0x114563,
        emissive: 0x041826,
        roughness: 0.22,
        metalness: 0.28,
        flatShading: true
      }),
      rockDark: new THREE.MeshStandardMaterial({
        color: 0x182330,
        roughness: 0.85,
        metalness: 0.08,
        flatShading: true
      }),
      rockMid: new THREE.MeshStandardMaterial({
        color: 0x223042,
        roughness: 0.8,
        metalness: 0.1,
        flatShading: true
      }),
      foam: new THREE.MeshStandardMaterial({
        color: 0xd8f0f8,
        emissive: 0x2e5870,
        roughness: 0.4,
        metalness: 0.0,
        transparent: true,
        opacity: 0.82
      }),
      towerWhite: new THREE.MeshStandardMaterial({
        color: 0xeae6df,
        roughness: 0.55,
        metalness: 0.05
      }),
      towerRed: new THREE.MeshStandardMaterial({
        color: 0x9e2424,
        roughness: 0.5,
        metalness: 0.08
      }),
      darkIron: new THREE.MeshStandardMaterial({
        color: 0x18202c,
        roughness: 0.4,
        metalness: 0.65
      }),
      copperDome: new THREE.MeshStandardMaterial({
        color: 0x223a44,
        roughness: 0.42,
        metalness: 0.5
      }),
      hutWall: new THREE.MeshStandardMaterial({
        color: 0xd6d2c9,
        roughness: 0.68,
        metalness: 0.04
      }),
      hutRoof: new THREE.MeshStandardMaterial({
        color: 0x7c2828,
        roughness: 0.6,
        metalness: 0.08
      }),
      warmWindow: new THREE.MeshBasicMaterial({
        color: 0xffbe55
      }),
      lampCore: new THREE.MeshBasicMaterial({
        color: 0xfff0c2
      }),
      lanternGlass: new THREE.MeshStandardMaterial({
        color: 0xffdf9e,
        emissive: 0xffa834,
        emissiveIntensity: 0.45,
        roughness: 0.15,
        metalness: 0.1,
        transparent: true,
        opacity: 0.42
      }),
      boatHull: new THREE.MeshStandardMaterial({
        color: 0x0d1622,
        roughness: 0.7,
        metalness: 0.15
      }),
      boatCabin: new THREE.MeshStandardMaterial({
        color: 0x1b2838,
        roughness: 0.65,
        metalness: 0.1
      }),
      invisibleProxy: new THREE.MeshBasicMaterial({
        visible: false
      })
    };

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0x3a5c8a, 0x0a1220, 1.05);
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(0x7ba3d6, 1.25);
    moonLight.position.set(-8, 12, -6);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 1024;
    moonLight.shadow.mapSize.height = 1024;
    moonLight.shadow.camera.near = 2;
    moonLight.shadow.camera.far = 28;
    const d = 7.5;
    moonLight.shadow.camera.left = -d;
    moonLight.shadow.camera.right = d;
    moonLight.shadow.camera.top = d;
    moonLight.shadow.camera.bottom = -d;
    moonLight.shadow.bias = -0.0008;
    scene.add(moonLight);

    // Diorama Slab Dimensions
    const SLAB_W = 10.6;
    const SLAB_D = 8.8;

    // Helper for organic beveled rock/strata slab layers
    function createBeveledSlabLayer(w, h, d, yPos, mat, jitter = 0.12) {
      const geo = new THREE.BoxGeometry(w, h, d, 10, 2, 10);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);
        const edgeX = Math.abs(vx) / (w * 0.5);
        const edgeZ = Math.abs(vz) / (d * 0.5);
        // Chamfer corners slightly
        if (edgeX > 0.85 && edgeZ > 0.85) {
          vx *= 0.94;
          vz *= 0.94;
        }
        // Taper bottom slightly
        if (vy < 0) {
          vx *= 0.96;
          vz *= 0.96;
        }
        // Deterministic rock strata jitter on sides
        if (edgeX > 0.9 || edgeZ > 0.9) {
          const n = Math.sin(vx * 1.7 + vz * 2.3 + yPos * 4.0) * jitter;
          vx += n * (vx > 0 ? 1 : -1) * 0.4;
          vz += n * (vz > 0 ? 1 : -1) * 0.4;
        }
        pos.setXYZ(i, vx, vy, vz);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = yPos;
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      return mesh;
    }

    const slabGroup = new THREE.Group();
    worldGroup.add(slabGroup);
    slabGroup.add(createBeveledSlabLayer(SLAB_W * 0.94, 0.55, SLAB_D * 0.94, -1.35, mats.strataBottom, 0.16));
    slabGroup.add(createBeveledSlabLayer(SLAB_W * 0.98, 0.55, SLAB_D * 0.98, -0.82, mats.strataMid, 0.14));
    slabGroup.add(createBeveledSlabLayer(SLAB_W, 0.52, SLAB_D, -0.32, mats.strataTop, 0.1));

    // Top Sea Surface Mesh (deformable vertex grid)
    const seaGeo = new THREE.BoxGeometry(SLAB_W * 0.99, 0.24, SLAB_D * 0.99, 36, 1, 30);
    const seaPosAttr = seaGeo.attributes.position;
    const seaBaseCoords = [];
    for (let i = 0; i < seaPosAttr.count; i++) {
      let vx = seaPosAttr.getX(i);
      let vy = seaPosAttr.getY(i);
      let vz = seaPosAttr.getZ(i);
      const ex = Math.abs(vx) / (SLAB_W * 0.495);
      const ez = Math.abs(vz) / (SLAB_D * 0.495);
      if (ex > 0.86 && ez > 0.86) {
        vx *= 0.94;
        vz *= 0.94;
        seaPosAttr.setXYZ(i, vx, vy, vz);
      }
      seaBaseCoords.push({ x: vx, y: vy, z: vz, isTop: vy > 0 });
    }
    seaGeo.computeVertexNormals();
    const seaMesh = new THREE.Mesh(seaGeo, mats.seaSurface);
    seaMesh.position.y = -0.05;
    seaMesh.receiveShadow = true;
    worldGroup.add(seaMesh);

    // Instanced Animated Low Swell Ridges on Sea
    const SWELL_COUNT = 34;
    const swellGeo = new THREE.BoxGeometry(1.15, 0.08, 0.24, 4, 1, 2);
    // Bevel swell ridge ends
    const swPos = swellGeo.attributes.position;
    for (let i = 0; i < swPos.count; i++) {
      const sx = swPos.getX(i);
      const sy = swPos.getY(i);
      if (sy > 0) {
        const factor = 1.0 - Math.pow(Math.abs(sx) / 0.6, 2) * 0.65;
        swPos.setY(i, sy * Math.max(0.2, factor));
      }
    }
    swellGeo.computeVertexNormals();
    const swellInst = new THREE.InstancedMesh(swellGeo, mats.seaSwell, SWELL_COUNT);
    swellInst.receiveShadow = true;
    worldGroup.add(swellInst);

    const swellData = [];
    for (let i = 0; i < SWELL_COUNT; i++) {
      let sx = randRange(-SLAB_W * 0.43, SLAB_W * 0.43);
      let sz = randRange(-SLAB_D * 0.42, SLAB_D * 0.42);
      // Keep swells outside islet center (-1.2, -0.5)
      const distToIslet = Math.hypot(sx + 1.2, sz + 0.5);
      if (distToIslet < 2.2) {
        const ang = Math.atan2(sz + 0.5, sx + 1.2);
        sx = -1.2 + Math.cos(ang) * 2.5;
        sz = -0.5 + Math.sin(ang) * 2.5;
      }
      swellData.push({
        x: sx,
        z: sz,
        scaleX: randRange(0.65, 1.35),
        scaleZ: randRange(0.8, 1.3),
        phase: randRange(0, Math.PI * 2),
        speed: randRange(1.4, 2.2),
        yaw: randRange(-0.25, 0.25)
      });
    }

    // Rocky Islet Cluster
    const ISLET_X = -1.25;
    const ISLET_Z = -0.55;
    const isletGroup = new THREE.Group();
    isletGroup.position.set(ISLET_X, 0.05, ISLET_Z);
    worldGroup.add(isletGroup);

    const rockGeoBase = new THREE.DodecahedronGeometry(1.0, 1);
    // Flatten & angularize rock prototype slightly
    const rkPos = rockGeoBase.attributes.position;
    for (let i = 0; i < rkPos.count; i++) {
      const rx = rkPos.getX(i);
      const ry = rkPos.getY(i);
      const rz = rkPos.getZ(i);
      const n = 1 + 0.14 * Math.sin(rx * 3.1 + ry * 2.7 + rz * 3.9);
      rkPos.setXYZ(i, rx * n, ry * (ry > 0 ? 0.78 : 0.5) * n, rz * n);
    }
    rockGeoBase.computeVertexNormals();

    const rockSpecs = [
      // Central plinth for tower & hut
      { x: 0.0, y: 0.35, z: 0.0, sx: 1.55, sy: 0.95, sz: 1.45, ry: 0.4, mat: mats.rockDark },
      { x: 1.05, y: 0.28, z: 0.25, sx: 1.15, sy: 0.82, sz: 1.05, ry: 1.2, mat: mats.rockMid },
      { x: -1.1, y: 0.22, z: 0.35, sx: 1.0, sy: 0.75, sz: 0.95, ry: 2.1, mat: mats.rockDark },
      { x: -0.55, y: 0.25, z: -0.95, sx: 1.1, sy: 0.7, sz: 0.9, ry: 0.8, mat: mats.rockMid },
      { x: 0.55, y: 0.18, z: -0.95, sx: 0.95, sy: 0.65, sz: 0.85, ry: 1.9, mat: mats.rockDark },
      { x: -0.25, y: 0.18, z: 1.05, sx: 1.05, sy: 0.62, sz: 0.85, ry: 2.8, mat: mats.rockMid },
      { x: 1.55, y: 0.12, z: -0.35, sx: 0.72, sy: 0.5, sz: 0.68, ry: 0.5, mat: mats.rockDark },
      { x: -1.65, y: 0.10, z: -0.3, sx: 0.68, sy: 0.48, sz: 0.65, ry: 1.5, mat: mats.rockMid },
      { x: 0.85, y: 0.10, z: 1.05, sx: 0.65, sy: 0.45, sz: 0.62, ry: 2.4, mat: mats.rockDark }
    ];

    rockSpecs.forEach(s => {
      const m = new THREE.Mesh(rockGeoBase, s.mat);
      m.position.set(s.x, s.y, s.z);
      m.scale.set(s.sx, s.sy, s.sz);
      m.rotation.y = s.ry;
      m.castShadow = true;
      m.receiveShadow = true;
      isletGroup.add(m);
    });

    // Animated White Foam Ring lapping the islet rocks
    const FOAM_COUNT = 44;
    const foamGeo = new THREE.BoxGeometry(0.42, 0.05, 0.18);
    const foamInst = new THREE.InstancedMesh(foamGeo, mats.foam, FOAM_COUNT);
    worldGroup.add(foamInst);

    const foamRingData = [];
    for (let i = 0; i < FOAM_COUNT; i++) {
      const angle = (i / FOAM_COUNT) * Math.PI * 2;
      // Contour hugs the islet rock silhouette
      const baseR = 1.92 + 0.32 * Math.cos(angle * 2.0 - 0.3) + 0.16 * Math.sin(angle * 3.0 + 0.7);
      foamRingData.push({
        angle,
        baseR,
        phase: angle * 2.0 + randRange(0, 1.2),
        scaleLen: randRange(0.75, 1.35)
      });
    }

    // HERO LIGHTHOUSE (~2/3 of slab width tall: ~6.4 units total height)
    const lighthouseGroup = new THREE.Group();
    lighthouseGroup.position.set(ISLET_X - 0.15, 0.85, ISLET_Z - 0.05);
    worldGroup.add(lighthouseGroup);

    // Stone Plinth Foundation
    const plinthGeo = new THREE.CylinderGeometry(0.96, 1.08, 0.45, 16);
    const plinthMesh = new THREE.Mesh(plinthGeo, mats.rockMid);
    plinthMesh.position.y = 0.22;
    plinthMesh.castShadow = true;
    plinthMesh.receiveShadow = true;
    lighthouseGroup.add(plinthMesh);

    const plinthLipGeo = new THREE.TorusGeometry(0.95, 0.06, 8, 24);
    plinthLipGeo.rotateX(Math.PI / 2);
    const plinthLip = new THREE.Mesh(plinthLipGeo, mats.rockDark);
    plinthLip.position.y = 0.45;
    lighthouseGroup.add(plinthLip);

    // Striped Tower Bands (5 alternating bands: Red, White, Red, White, Red)
    const bandSpecs = [
      { rBot: 0.90, rTop: 0.82, h: 0.88, y: 0.45 + 0.44, mat: mats.towerRed },
      { rBot: 0.82, rTop: 0.74, h: 0.88, y: 0.45 + 0.88 + 0.44, mat: mats.towerWhite },
      { rBot: 0.74, rTop: 0.66, h: 0.86, y: 0.45 + 1.76 + 0.43, mat: mats.towerRed },
      { rBot: 0.66, rTop: 0.58, h: 0.84, y: 0.45 + 2.62 + 0.42, mat: mats.towerWhite },
      { rBot: 0.58, rTop: 0.52, h: 0.78, y: 0.45 + 3.46 + 0.39, mat: mats.towerRed }
    ];

    bandSpecs.forEach(b => {
      const g = new THREE.CylinderGeometry(b.rTop, b.rBot, b.h, 24);
      const m = new THREE.Mesh(g, b.mat);
      m.position.y = b.y;
      m.castShadow = true;
      m.receiveShadow = true;
      lighthouseGroup.add(m);

      // Subtle tactile seam ring between bands
      const seamG = new THREE.TorusGeometry(b.rTop, 0.018, 6, 24);
      seamG.rotateX(Math.PI / 2);
      const seamM = new THREE.Mesh(seamG, b.mat);
      seamM.position.y = b.y + b.h * 0.5;
      lighthouseGroup.add(seamM);
    });

    // Small Tower Slit Windows
    const slitGeo = new THREE.BoxGeometry(0.12, 0.24, 0.08);
    const slitFrameGeo = new THREE.BoxGeometry(0.16, 0.28, 0.06);
    [
      { y: 1.75, ang: 0.6, r: 0.77 },
      { y: 3.45, ang: -0.5, r: 0.62 }
    ].forEach(w => {
      const frame = new THREE.Mesh(slitFrameGeo, mats.darkIron);

    function fitCameraToViewport() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      renderer.setSize(vw, vh);

      const aspect = vw / vh;
      // Aspect-aware FOV (wider vertical FOV on narrow portrait viewports like 320x700 and 390x844)
      camera.fov = aspect < 0.75 ? 44 : aspect < 1.0 ? 39 : 34;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Measure header and footer safe areas
      const headerH = headerEl.getBoundingClientRect().height || 86;
      const footerH = footerEl.getBoundingClientRect().height || 38;
      const safeTopRatio = (headerH + 14) / vh;
      const safeBottomRatio = (footerH + 14) / vh;
      const usableVerticalFraction = Math.max(0.45, 1.0 - safeTopRatio - safeBottomRatio);
      const usableHorizontalFraction = 0.90;

      // Vertical shift so miniature sits centered in the safe band between header and footer
      const verticalBias = (safeTopRatio - safeBottomRatio) * 0.5;
      const targetCenter = SCENE_TARGET.clone();
      targetCenter.y += verticalBias * 3.1;

      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const tanHalfVFov = Math.tan(vFovRad * 0.5) * usableVerticalFraction;
      const tanHalfHFov = Math.tan(vFovRad * 0.5) * aspect * usableHorizontalFraction;

      // Build camera basis vectors looking from VIEW_DIR toward targetCenter
      const forward = VIEW_DIR.clone().negate();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, forward).normalize();

      let requiredDist = 11.0;
      for (const pt of importantPoints) {
        const rel = pt.clone().sub(targetCenter);
        const projX = Math.abs(rel.dot(right));
        const projY = Math.abs(rel.dot(up));
        const projZ = rel.dot( VIEW_DIR ); // Offset toward camera

        const distForX = projX / tanHalfHFov + projZ;
        const distForY = projY / tanHalfVFov + projZ;
        requiredDist = Math.max(requiredDist, distForX, distForY);
      }

      requiredDist *= 1.06; // Small breathing margin

      controls.target.copy(targetCenter);
      camera.position.copy(targetCenter).addScaledVector(VIEW_DIR, requiredDist);
      controls.minDistance = requiredDist * 0.86;
      controls.maxDistance = requiredDist * 1.18;
      controls.update();
    }

    window.addEventListener('resize', fitCameraToViewport);
    fitCameraToViewport();

    // Reusable dummy object for instanced matrix updates
    const dummy = new THREE.Object3D();
    const shipWorldPos = new THREE.Vector3();

    // Animation Loop driven strictly by performance.now()
    function animate(now) {
      requestAnimationFrame(animate);
      const t = now * 0.001;

      // 1. Fog Transition (smooth 3-second ease)
      if (Math.abs(fogLevel - fogTarget) > 0.0005) {
        const elapsed = now - fogAnimStartTime;
        const u = Math.min(1.0, Math.max(0.0, elapsed / FOG_DURATION_MS));
        const eased = u * u * (3.0 - 2.0 * u);
        fogLevel = THREE.MathUtils.lerp(fogAnimStartLevel, fogTarget, eased);
      } else {
        fogLevel = fogTarget;
      }

      // Apply fog density and color
      scene.fog.density = THREE.MathUtils.lerp(0.012, 0.030, fogLevel);
      scene.fog.color.lerpColors(FOG_COLOR_CLEAR, FOG_COLOR_DENSE, fogLevel);
      hemiLight.intensity = 1.05 + fogLevel * 0.45;

      // 2. Beam Sweep (Idle auto-sweep when untouched for > 2.2s, or smooth manual drag)
      const timeSinceDrag = now - lastInteractionTime;
      if (!isDraggingBeam && timeSinceDrag > 2200) {
        const autoWave = Math.sin(t * 0.52);
        targetBeamYaw = CENTER_BEAM_YAW + autoWave * ((MAX_BEAM_YAW - MIN_BEAM_YAW) * 0.48);
      }
      currentBeamYaw += (targetBeamYaw - currentBeamYaw) * 0.1;
      beamPivot.rotation.y = currentBeamYaw;

      // 3. Lamp Breathing & Volumetric Beam Appearance
      const lampPulse = 0.94 + 0.06 * Math.sin(t * 3.1) + 0.02 * Math.sin(t * 7.3);
      lampPointLight.intensity = (3.3 + fogLevel * 1.6) * lampPulse;
      const spriteScale = (2.25 + fogLevel * 0.95) * lampPulse;
      lensGlowSprite.scale.set(spriteScale, spriteScale, 1);

      // In fog, the beam reads as a soft wide volumetric shaft
      beamConeMat.opacity = THREE.MathUtils.lerp(0.46, 0.68, fogLevel) * lampPulse;
      fogShaftMat.opacity = THREE.MathUtils.lerp(0.07, 0.42, fogLevel) * lampPulse;

      // Update Moving Light-Pool Ellipse on the Sea
      const poolDist = 4.65;
      const poolX = LAMP_WORLD_POS.x + Math.sin(currentBeamYaw) * poolDist;
      const poolZ = LAMP_WORLD_POS.z + Math.cos(currentBeamYaw) * poolDist;
      lightPoolMesh.position.set(poolX, 0.09, poolZ);
      lightPoolMesh.rotation.y = currentBeamYaw;
      lightPoolMat.opacity = THREE.MathUtils.lerp(0.62, 0.34, fogLevel) * lampPulse;

      poolPointLight.position.set(poolX, 0.45, poolZ);
      poolPointLight.intensity = THREE.MathUtils.lerp(2.4, 1.3, fogLevel) * lampPulse;

      // 4. Sea Surface Vertex Swell Animation
      for (let i = 0; i < seaPosAttr.count; i++) {
        const b = seaBaseCoords[i];
        if (b.isTop) {
          const wave =
            Math.sin(b.x * 0.85 + t * 1.65) * 0.045 +
            Math.cos(b.z * 1.05 - t * 1.35) * 0.04;
          seaPosAttr.setY(i, b.y + wave);
        }
      }
      seaPosAttr.needsUpdate = true;

      // 5. Instanced Swell Ridges
      for (let i = 0; i < SWELL_COUNT; i++) {
        const sw = swellData[i];
        const cyc = (t * sw.speed + sw.phase) % (Math.PI * 2);
        const swellLift = Math.max(0, Math.sin(cyc));
        const wy = 0.06 + swellLift * 0.055;
        dummy.position.set(sw.x, wy, sw.z + Math.cos(cyc) * 0.12);
        dummy.rotation.set(0, sw.yaw, 0);
        dummy.scale.set(
          sw.scaleX * (0.7 + 0.35 * swellLift),
          0.5 + 0.7 * swellLift,
          sw.scaleZ
        );
        dummy.updateMatrix();
        swellInst.setMatrixAt(i, dummy.matrix);
      }
      swellInst.instanceMatrix.needsUpdate = true;

      // 6. Pulsing White Foam Ring around Islet Rocks
      for (let i = 0; i < FOAM_COUNT; i++) {
        const fm = foamRingData[i];
        const pulse = Math.sin(t * 2.1 + fm.phase);
        const r = fm.baseR + pulse * 0.09;
        const fx = ISLET_X + Math.cos(fm.angle) * r;
        const fz = ISLET_Z + Math.sin(fm.angle) * r;
        const fy = 0.08 + Math.max(0, pulse) * 0.03;

        dummy.position.set(fx, fy, fz);
        dummy.rotation.set(0, -fm.angle + Math.PI * 0.5, 0);
        const sScale = 0.78 + 0.28 * (0.5 + 0.5 * pulse);
        dummy.scale.set(fm.scaleLen * sScale, 1.0, sScale);
        dummy.updateMatrix();
        foamInst.setMatrixAt(i, dummy.matrix);
      }
      foamInst.instanceMatrix.needsUpdate = true;
      mats.foam.opacity = 0.76 + 0.12 * Math.sin(t * 2.1);

      // 7. Silhouette Ships Drift + Beam-Dwell Course Turn + Fog Window Dimming
      let nearestShip = null;
      let smallestAngleDiff = Infinity;

      ships.forEach((sh) => {
        // Gentle lane oscillation
        const driftOffset = Math.sin(t * sh.speed + sh.phase) * sh.driftAmp;
        const sx = sh.baseX + Math.cos(sh.currentYaw) * driftOffset;
        const sz = sh.baseZ - Math.sin(sh.currentYaw) * driftOffset * 0.65;
        const bobY = 0.07 + Math.sin(t * 2.2 + sh.phase) * 0.025;

        sh.group.position.set(sx, bobY, sz);
        sh.group.rotation.z = Math.sin(t * 1.9 + sh.phase) * 0.06;

        // Angle from lighthouse lamp to this ship
        const angToShip = Math.atan2(sx - LAMP_WORLD_POS.x, sz - LAMP_WORLD_POS.z);
        const diff = Math.abs(angToShip - currentBeamYaw);
        if (diff < smallestAngleDiff) {
          smallestAngleDiff = diff;
          nearestShip = sh;
        }
      });

      // Ship nearest the beam's line turns slowly to parallel the shore over ~5 seconds while beam dwells
      ships.forEach((sh) => {
        const isDweltOn = (sh === nearestShip && smallestAngleDiff < 0.24);
        if (isDweltOn) {
          // Parallel to shore heading (along X axis = 0.0 rad)
          const shoreParallelYaw = 0.0;
          // ~5 seconds at 60fps -> ~0.0035 interpolation step per frame
          let delta = shoreParallelYaw - sh.currentYaw;
          while (delta > Math.PI) delta -= Math.PI * 2;
          while (delta < -Math.PI) delta += Math.PI * 2;
          sh.currentYaw += delta * 0.012;
        }
        sh.group.rotation.y = sh.currentYaw;

        // In fog, the ships' window dots dim noticeably
        const beamBoost = (sh === nearestShip && smallestAngleDiff < 0.24) ? 1.25 : 1.0;
        const fogDim = THREE.MathUtils.lerp(0.92, 0.22, fogLevel);
        sh.winSpriteMat.opacity = Math.min(1.0, fogDim * beamBoost);
        sh.winMat.color.setHSL(0.105, 0.95, THREE.MathUtils.lerp(0.68, 0.28, fogLevel));
      });

      // 8. Atmospheric Fog Wisps
      fogWisps.forEach((w) => {
        w.mat.opacity = fogLevel * 0.16 * (0.7 + 0.3 * Math.sin(t * w.speed + w.phase));
        w.mesh.position.x = w.baseX + Math.sin(t * 0.28 + w.phase) * 0.65;
        w.mesh.position.y = w.baseY + Math.cos(t * 0.22 + w.phase) * 0.15;
        w.mesh.lookAt(camera.position);
      });

      // 9. Twinkling Stars (dim in fog)
      const starFogVisibility = Math.max(0.08, 1.0 - fogLevel * 0.88);
      for (let i = 0; i < STAR_COUNT; i++) {
        const st = starData[i];
        const twinkle = (0.55 + 0.45 * Math.sin(t * st.speed + st.phase)) * starFogVisibility;
        dummy.position.set(st.x, st.y, st.z);
        dummy.rotation.set(0, t * 0.3, 0);
        const s = st.baseScale * twinkle;
        dummy.scale.set(s, s, s);
        dummy.updateMatrix();
        starInst.setMatrixAt(i, dummy.matrix);
      }
      starInst.instanceMatrix.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
