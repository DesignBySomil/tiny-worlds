<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Deterministic PRNG
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260419);
const randRange = (min, max) => min + rand() * (max - min);

const container = document.getElementById('app');
const hintEl = document.getElementById('hint');

// ---------- Scene & Abyssal Atmosphere ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1a2c, 0.026);

// Custom vertical gradient backdrop (cold teal glow above fading to abyssal black-indigo)
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 512;
const bgCtx = bgCanvas.getContext('2d');
const bgGrad = bgCtx.createLinearGradient(0, 0, 0, 512);
bgGrad.addColorStop(0.0, '#072232');
bgGrad.addColorStop(0.22, '#051524');
bgGrad.addColorStop(0.55, '#030a16');
bgGrad.addColorStop(0.82, '#02050c');
bgGrad.addColorStop(1.0, '#010206');
bgCtx.fillStyle = bgGrad;
bgCtx.fillRect(0, 0, 2, 512);
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;

// ---------- Camera & Renderer ----------
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 220);
function pickFov() {
  const a = window.innerWidth / window.innerHeight;
  camera.fov = a >= 0.9 ? 36 : (a >= 0.62 ? 42 : 48);
  camera.updateProjectionMatrix();
}
pickFov();

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 120; // >= 80 so OrbitControls never clamps portrait fit
controls.minPolarAngle = Math.PI * 0.12;
controls.maxPolarAngle = Math.PI * 0.53;

// ---------- Procedural Soft Glow Sprite Texture ----------
function createGlowTexture(innerHex, midHex) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 62);
  g.addColorStop(0.0, innerHex);
  g.addColorStop(0.28, midHex);
  g.addColorStop(0.65, 'rgba(20, 120, 140, 0.12)');
  g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const cyanGlowTex = createGlowTexture('rgba(230, 255, 245, 1)', 'rgba(80, 255, 210, 0.58)');
const warmGlowTex = createGlowTexture('rgba(255, 235, 210, 0.95)', 'rgba(255, 105, 65, 0.45)');
const snowDotTex = createGlowTexture('rgba(220, 245, 255, 0.9)', 'rgba(130, 195, 230, 0.35)');

// ---------- Lighting ----------
// Faint cold teal light from high above
const abyssalTopLight = new THREE.DirectionalLight(0x3a94b8, 1.55);
abyssalTopLight.position.set(1.8, 14, 2.5);
abyssalTopLight.castShadow = true;
abyssalTopLight.shadow.mapSize.set(1024, 1024);
abyssalTopLight.shadow.camera.left = -6.5;
abyssalTopLight.shadow.camera.right = 6.5;
abyssalTopLight.shadow.camera.top = 6.5;
abyssalTopLight.shadow.camera.bottom = -6.5;
abyssalTopLight.shadow.camera.near = 2;
abyssalTopLight.shadow.camera.far = 28;
abyssalTopLight.shadow.bias = -0.0008;
scene.add(abyssalTopLight);

// Deep indigo ambient + cold teal-to-midnight hemisphere
scene.add(new THREE.AmbientLight(0x24435e, 1.15));
const hemiLight = new THREE.HemisphereLight(0x2e6e8f, 0x0a1420, 1.0);

// Subtle rim light from behind-left to carve dark basalt silhouettes

rimLight.position.set(-7, 5, -6);

// Warm bioluminescent accent lights near tube worms & anemones

bioLightLeft.position.set(-2.0, -0.7, -0.9);

const bioLightRight = new THREE.PointLight(0xff7b47, 1.15, 4.2, 1.6);
bioLightRight.position.set(2.1, -0.85, 0.85);

// ---------- Materials ----------
const M = {
  plinth: new THREE.MeshStandardMaterial({
    color: 0x18293e, roughness: 0.95, metalness: 0.08, flatShading: true
  }),
  basaltDark: new THREE.MeshStandardMaterial({
    color: 0x20395a, roughness: 0.9, metalness: 0.12, flatShading: true
  }),
  basaltMid: new THREE.MeshStandardMaterial({
    color: 0x2c4a6e, roughness: 0.86, metalness: 0.14, flatShading: true
  }),
  basaltEdge: new THREE.MeshStandardMaterial({
    color: 0x3a628c, roughness: 0.82, metalness: 0.15, flatShading: true
  }),
  sediment: new THREE.MeshStandardMaterial({
    color: 0x253c56, roughness: 0.96, metalness: 0.05, flatShading: true
  }),
  fissureGlow: new THREE.MeshStandardMaterial({
    color: 0x2a0d08, emissive: 0xff4d1a, emissiveIntensity: 1.8, roughness: 0.7
  }),
  wormTube: new THREE.MeshStandardMaterial({
    color: 0x41546e, roughness: 0.85, metalness: 0.08, flatShading: true
  }),
  wormPlume: new THREE.MeshStandardMaterial({
    color: 0xff3b2f, emissive: 0xff451f, emissiveIntensity: 2.1, roughness: 0.4, flatShading: true
  }),
  anemoneStalk: new THREE.MeshStandardMaterial({
    color: 0x4a3260, roughness: 0.8, flatShading: true
  }),
  anemoneTipWarm: new THREE.MeshStandardMaterial({
    color: 0xff9d5c, emissive: 0xff6e30, emissiveIntensity: 2.3, roughness: 0.35
  }),
  anemoneTipGold: new THREE.MeshStandardMaterial({
    color: 0xffcf70, emissive: 0xffa033, emissiveIntensity: 2.1, roughness: 0.35
  }),
  fishBody: new THREE.MeshStandardMaterial({
    color: 0x1e3a58, roughness: 0.58, metalness: 0.22, flatShading: true
  }),
  fishBelly: new THREE.MeshStandardMaterial({
    color: 0x2a4a6a, roughness: 0.65, metalness: 0.15, flatShading: true
  }),
  fishFin: new THREE.MeshStandardMaterial({
    color: 0x183854, emissive: 0x0b2c3d, emissiveIntensity: 0.45,
    roughness: 0.5, transparent: true, opacity: 0.82, side: THREE.DoubleSide, flatShading: true
  }),
  fishJaw: new THREE.MeshStandardMaterial({
    color: 0x22405e, roughness: 0.62, metalness: 0.2, flatShading: true
  }),
  teeth: new THREE.MeshStandardMaterial({
    color: 0xd5f2f8, emissive: 0x296878, emissiveIntensity: 0.28,
    roughness: 0.3, transparent: true, opacity: 0.92
  }),
  eyeSclera: new THREE.MeshStandardMaterial({
    color: 0x9cf5e8, emissive: 0x35b8a6, emissiveIntensity: 0.9, roughness: 0.2
  }),
  eyePupil: new THREE.MeshStandardMaterial({
    color: 0x03070e, roughness: 0.2
  }),
  stalk: new THREE.MeshStandardMaterial({
    color: 0x16384c, emissive: 0x0f4c5c, emissiveIntensity: 0.5, roughness: 0.5
  }),
  lureCore: new THREE.MeshStandardMaterial({
    color: 0xd8fff2, emissive: 0x52ffd1, emissiveIntensity: 4.0, roughness: 0.1
  }),
  lureShell: new THREE.MeshBasicMaterial({
    color: 0x64ffda, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false
  }),
  bioSpot: new THREE.MeshBasicMaterial({
    color: 0x58ffd0, transparent: true, opacity: 0.85
  }),
  bubble: new THREE.MeshBasicMaterial({
    color: 0x9effec, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false
  })
};

// ---------- Helper: Sculpted Jagged Basalt Geometry ----------
function displaceRock(geo, ampX, ampY, ampZ, freq = 1.7) {
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const seed = rand() * 100;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n1 = Math.sin(v.x * freq + seed) * Math.cos(v.z * freq * 1.1 + seed);
    const n2 = Math.cos(v.y * freq * 1.3 - seed) * Math.sin(v.x * freq * 0.9);
    // Flatten underside if below -0.35
    const yFactor = v.y < -0.3 ? 0.35 : 1.0;
    v.x += n1 * ampX;
    v.y += n2 * ampY * yFactor;
    v.z += (n1 - n2) * 0.5 * ampZ;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

const dioramaGroup = new THREE.Group();
scene.add(dioramaGroup);

// ---------- Trench Floor: Jagged Basalt Slabs & Abyssal Plinth ----------
// Deep stepped basalt plinth
const plinthGeo = displaceRock(new THREE.CylinderGeometry(4.35, 3.65, 1.05, 14, 2), 0.16, 0.08, 0.16, 1.4);
const plinth = new THREE.Mesh(plinthGeo, M.plinth);
plinth.position.y = -2.02;
plinth.receiveShadow = true;
dioramaGroup.add(plinth);

// Upper trench floor slab
const floorSlabGeo = displaceRock(new THREE.CylinderGeometry(4.2, 4.32, 0.48, 16, 2), 0.18, 0.1, 0.18, 1.6);
const floorSlab = new THREE.Mesh(floorSlabGeo, M.sediment);
floorSlab.position.y = -1.38;
floorSlab.receiveShadow = true;
dioramaGroup.add(floorSlab);

// Layered angular basalt plates forming a V-like trench gorge across the floor
const slabConfigs = [
  { x: -2.1, y: -1.16, z: 1.2, sx: 1.7, sy: 0.28, sz: 1.3, ry: 0.35, rz: -0.14, mat: M.basaltDark },
  { x: -2.5, y: -1.02, z: -0.6, sx: 1.8, sy: 0.36, sz: 1.5, ry: -0.25, rz: -0.18, mat: M.basaltMid },
  { x: 2.2, y: -1.14, z: 1.1, sx: 1.75, sy: 0.3, sz: 1.35, ry: -0.4, rz: 0.15, mat: M.basaltDark },
  { x: 2.4, y: -1.0, z: -0.8, sx: 1.85, sy: 0.38, sz: 1.45, ry: 0.3, rz: 0.18, mat: M.basaltMid },
  { x: -0.4, y: -1.24, z: -1.9, sx: 2.1, sy: 0.32, sz: 1.3, ry: 0.12, rz: 0.05, mat: M.basaltDark },
  { x: 0.3, y: -1.28, z: 1.85, sx: 1.8, sy: 0.22, sz: 1.0, ry: -0.18, rz: -0.04, mat: M.basaltEdge },
  { x: -1.1, y: -1.22, z: 0.2, sx: 1.35, sy: 0.2, sz: 1.1, ry: 0.5, rz: -0.08, mat: M.basaltEdge },
  { x: 1.15, y: -1.22, z: -0.15, sx: 1.4, sy: 0.22, sz: 1.15, ry: -0.45, rz: 0.08, mat: M.basaltEdge }
];

for (const cfg of slabConfigs) {
  const g = displaceRock(new THREE.DodecahedronGeometry(0.85, 1), 0.12, 0.08, 0.12, 2.3);
  const m = new THREE.Mesh(g, cfg.mat);
  m.position.set(cfg.x, cfg.y, cfg.z);
  m.scale.set(cfg.sx, cfg.sy, cfg.sz);
  m.rotation.set(randRange(-0.08, 0.08), cfg.ry, cfg.rz);
  m.castShadow = true;
  m.receiveShadow = true;
  dioramaGroup.add(m);
}

// Scattered jagged basalt talus boulders
for (let i = 0; i < 18; i++) {
  const ang = rand() * Math.PI * 2;
  const rad = 1.1 + rand() * 2.55;
  const bx = Math.cos(ang) * rad;
  const bz = Math.sin(ang) * rad * 0.84;
  const bGeo = displaceRock(new THREE.IcosahedronGeometry(0.18 + rand() * 0.22, 0), 0.05, 0.05, 0.05, 3.0);
  const bMesh = new THREE.Mesh(bGeo, i % 3 === 0 ? M.basaltEdge : (i % 2 === 0 ? M.basaltMid : M.basaltDark));
  bMesh.position.set(bx, -1.18 + rand() * 0.12, bz);
  bMesh.scale.set(1.2 + rand() * 0.6, 0.55 + rand() * 0.45, 0.9 + rand() * 0.5);
  bMesh.rotation.set(rand() * 0.5, rand() * Math.PI, rand() * 0.5);
  bMesh.castShadow = true;
  bMesh.receiveShadow = true;
  dioramaGroup.add(bMesh);
}

// Subtle warm abyssal fissure cracks in the central trench trough
const fissureCoords = [
  { x: -1.55, z: -0.75, rot: 0.4, len: 0.75 },
  { x: 1.75, z: 0.65, rot: -0.55, len: 0.65 },
  { x: -0.25, z: -1.15, rot: 1.1, len: 0.55 }
];
for (const fc of fissureCoords) {
  const fMesh = new THREE.Mesh(new THREE.BoxGeometry(fc.len, 0.04, 0.07), M.fissureGlow);
  fMesh.position.set(fc.x, -1.17, fc.z);
  fMesh.rotation.y = fc.rot;
  dioramaGroup.add(fMesh);
}

// ---------- 3 Jagged Abyssal Rock Spires ----------
function buildRockSpire(x, z, height, baseRadius, leanX, leanZ) {
  const spire = new THREE.Group();
  const tiers = 5;
  let curY = -1.25;
  for (let i = 0; i < tiers; i++) {
    const t = i / (tiers - 1);
    const segH = (height / tiers) * (1.12 - t * 0.22);
    const rBottom = baseRadius * Math.pow(1 - t * 0.72, 1.15);
    const rTop = baseRadius * Math.pow(1 - (t + 1 / tiers) * 0.78, 1.2);
    const segGeo = displaceRock(
      new THREE.CylinderGeometry(Math.max(0.08, rTop), rBottom, segH, 7, 2),
      0.11 * (1 - t * 0.5), 0.06, 0.11 * (1 - t * 0.5), 2.4
    );
    const mat = i === tiers - 1 ? M.basaltEdge : (i % 2 === 0 ? M.basaltDark : M.basaltMid);
    const seg = new THREE.Mesh(segGeo, mat);
    seg.position.set(
      leanX * t * t + randRange(-0.05, 0.05),
      curY + segH * 0.5,
      leanZ * t * t + randRange(-0.05, 0.05)
    );
    seg.rotation.y = rand() * Math.PI;
    seg.castShadow = true;
    seg.receiveShadow = true;
    spire.add(seg);
    curY += segH * 0.88;
  }
  // Flanking crag shards at spire base
  for (let k = 0; k < 3; k++) {
    const a = (k / 3) * Math.PI * 2 + rand() * 0.6;
    const shardH = height * (0.28 + rand() * 0.18);
    const shardGeo = displaceRock(new THREE.ConeGeometry(baseRadius * 0.48, shardH, 6, 2), 0.08, 0.05, 0.08, 2.5);
    const shard = new THREE.Mesh(shardGeo, k % 2 ? M.basaltMid : M.basaltDark);
    shard.position.set(Math.cos(a) * baseRadius * 0.62, -1.2 + shardH * 0.42, Math.sin(a) * baseRadius * 0.62);
    shard.rotation.set((rand() - 0.5) * 0.25, rand() * Math.PI, (rand() - 0.5) * 0.25);
    shard.castShadow = true;
    shard.receiveShadow = true;
    spire.add(shard);
  }
  spire.position.set(x, 0, z);
  dioramaGroup.add(spire);
  return spire;
}

// 3 dramatic spires framing the trench
buildRockSpire(-2.65, -1.35, 3.85, 0.92, 0.28, 0.15);
buildRockSpire(2.55, -1.55, 3.45, 0.84, -0.25, 0.18);
buildRockSpire(0.35, -2.45, 2.75, 0.72, -0.12, 0.22);

// ---------- Bioluminescent Tube Worms & Small Anemones ----------
const swayingFlora = [];

function createTubeWormCluster(cx, cy, cz, count) {
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const worm = new THREE.Group();
    const a = (i / count) * Math.PI * 2 + rand() * 0.5;
    const dist = rand() * 0.26;
    const h = 0.34 + rand() * 0.42;
    const r = 0.026 + rand() * 0.014;

    // Chitinous pale-dark tube
    const tubeGeo = new THREE.CylinderGeometry(r * 1.12, r * 0.85, h, 7, 3);
    const pos = tubeGeo.attributes.position;
    const bendX = (rand() - 0.5) * 0.09;
    const bendZ = (rand() - 0.5) * 0.09;
    for (let j = 0; j < pos.count; j++) {
      const py = pos.getY(j) + h * 0.5;
      const ratio = py / h;
      pos.setX(j, pos.getX(j) + bendX * ratio * ratio);
      pos.setZ(j, pos.getZ(j) + bendZ * ratio * ratio);
    }
    tubeGeo.computeVertexNormals();
    const tube = new THREE.Mesh(tubeGeo, M.wormTube);
    tube.position.y = h * 0.5;
    tube.castShadow = true;
    worm.add(tube);

    // Glowing crimson-orange gill plume at tip
    const plumeGroup = new THREE.Group();
    plumeGroup.position.set(bendX, h + 0.02, bendZ);
    const plumeCore = new THREE.Mesh(new THREE.ConeGeometry(r * 1.75, 0.13, 7), M.wormPlume);
    plumeCore.rotation.x = Math.PI;
    plumeCore.position.y = 0.03;
    plumeGroup.add(plumeCore);

    const plumeTip = new THREE.Mesh(new THREE.SphereGeometry(r * 1.45, 7, 6), M.wormPlume);
    plumeTip.scale.y = 1.4;
    plumeTip.position.y = 0.06;
    plumeGroup.add(plumeTip);

    worm.add(plumeGroup);
    worm.position.set(Math.cos(a) * dist, 0, Math.sin(a) * dist);
    worm.rotation.set((rand() - 0.5) * 0.28, rand() * Math.PI * 2, (rand() - 0.5) * 0.28);
    group.add(worm);

    swayingFlora.push({
      obj: worm,
      baseRotX: worm.rotation.x,
      baseRotZ: worm.rotation.z,
      phase: rand() * Math.PI * 2,
      speed: 1.1 + rand() * 0.7,
      amp: 0.06 + rand() * 0.04
    });
  }

  // Soft warm glow sprite over cluster
  const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: warmGlowTex, color: 0xff6438, transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glowSprite.position.set(0, 0.45, 0);
  glowSprite.scale.setScalar(1.15);
  group.add(glowSprite);

  group.position.set(cx, cy, cz);
  dioramaGroup.add(group);
}

createTubeWormCluster(-1.85, -1.12, -0.82, 9);
createTubeWormCluster(1.95, -1.10, -0.95, 7);
createTubeWormCluster(-0.55, -1.18, -1.55, 6);

function createAnemone(x, y, z, scale, tipMat) {
  const group = new THREE.Group();
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.14, 8), M.anemoneStalk);
  stalk.position.y = 0.07;
  group.add(stalk);

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), tipMat);
  core.position.y = 0.14;
  group.add(core);

  const tentacleCount = 12;
  for (let i = 0; i < tentacleCount; i++) {
    const ring = i < 7 ? 0 : 1;
    const angle = (i / (ring === 0 ? 7 : 5)) * Math.PI * 2 + ring * 0.4;
    const radius = ring === 0 ? 0.075 : 0.042;
    const tHolder = new THREE.Group();
    tHolder.position.set(Math.cos(angle) * radius, 0.13, Math.sin(angle) * radius);
    tHolder.rotation.y = -angle;
    const tilt = (ring === 0 ? 0.58 : 0.32) + rand() * 0.12;
    tHolder.rotation.z = -tilt;

    const len = 0.14 + rand() * 0.06;
    const tent = new THREE.Mesh(new THREE.ConeGeometry(0.018, len, 5), M.anemoneStalk);
    tent.position.y = len * 0.5;
    tHolder.add(tent);

    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 6), tipMat);
    bulb.position.y = len;
    tHolder.add(bulb);

    group.add(tHolder);
    swayingFlora.push({
      obj: tHolder,
      baseRotX: 0,
      baseRotZ: tHolder.rotation.z,
      phase: rand() * Math.PI * 2,
      speed: 1.5 + rand() * 0.8,
      amp: 0.09
    });
  }

  group.position.set(x, y, z);
  group.scale.setScalar(scale);
  dioramaGroup.add(group);
}

function createRayConeTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, 'rgba(110, 215, 235, 0.0)');
  g.addColorStop(0.18, 'rgba(95, 205, 228, 0.14)');
  g.addColorStop(0.55, 'rgba(55, 155, 185, 0.065)');
  g.addColorStop(0.88, 'rgba(20, 85, 115, 0.015)');
  g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------- Responsive Camera Framing (320x700 Portrait Safe Fit) ----------
// Bounding box encompasses the entire trench diorama, spires, light cones, and hero range
const fitBox = new THREE.Box3(
  new THREE.Vector3(-3.75, -2.25, -3.05),
  new THREE.Vector3(3.75, 3.05, 2.75)
);
const fitDir = new THREE.Vector3(0.28, 0.34, 1.0).normalize();

function fitCamera() {
  camera.aspect = window.innerWidth / window.innerHeight;
  pickFov();

  const center = fitBox.getCenter(new THREE.Vector3());
  const corners = [];
  for (const x of [fitBox.min.x, fitBox.max.x]) {
    for (const y of [fitBox.min.y, fitBox.max.y]) {
      for (const z of [fitBox.min.z, fitBox.max.z]) {
        corners.push(new THREE.Vector3(x, y, z));
      }
    }
  }

  const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 220);
  probe.position.copy(center).addScaledVector(fitDir, 0.001);
  probe.lookAt(center);
  probe.updateMatrixWorld();
  const inv = probe.matrixWorldInverse;

  const halfFovRad = THREE.MathUtils.degToRad(probe.fov * 0.5);
  const tanHalfY = Math.tan(halfFovRad);
  const tanHalfX = tanHalfY * probe.aspect;

  // Reserve ~9% margin on left/right and extra top headroom so header pill stays clear
  const safeFracX = 0.94;
  const safeFracY = window.innerWidth < 500 ? 0.80 : 0.85;

  let requiredDist = 0;
  for (const c of corners) {
    const v = c.clone().applyMatrix4(inv);
    const needY = Math.abs(v.y) / (tanHalfY * safeFracY);
    const needX = Math.abs(v.x) / (tanHalfX * safeFracX);
    requiredDist = Math.max(requiredDist, Math.max(needX, needY) + Math.abs(v.z));
  }

  const dist = requiredDist * 1.04;
  // Slight upward shift of target in portrait so diorama sits comfortably below header pill
  const targetOffsetY = window.innerWidth < 500 ? 0.32 : 0.18;
  controls.target.set(center.x, center.y + targetOffsetY, center.z);
  camera.position.copy(controls.target).addScaledVector(fitDir, dist);
  camera.lookAt(controls.target);
  controls.update();
}

function setHintState(isDarting) {
  if (hintTimer) clearTimeout(hintTimer);
  if (isDarting) {
    hintEl.textContent = HINT_DART;
    hintEl.classList.add('active');
    hintEl.classList.remove('faded');
  } else {

    hintTimer = setTimeout(() => hintEl.classList.add('faded'), 5500);

}

// Dart animation state
let dartActive = false;
let dartStartTime = 0;
const DART_DURATION = 1.95; // Fast initial burst + graceful settle
const dartFromPos = new THREE.Vector3();
const dartToPos = new THREE.Vector3();
const dartControlPos = new THREE.Vector3();
let dartFromRotY = 0;
let dartToRotY = 0;

function shortestAngleDiff(a, b) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function startAnglerDart(nowSec) {
  dartFromPos.copy(angler.position);
  dartFromRotY = angler.rotation.y;

  // Pick next waypoint different from current
  const nextIdx = (currentWpIdx + 1 + Math.floor(rand() * (WAYPOINTS.length - 1))) % WAYPOINTS.length;
  currentWpIdx = nextIdx;
  const wp = WAYPOINTS[currentWpIdx];
  dartToPos.copy(wp.pos);

  // Curved arc midpoint with slight upward kick
  dartControlPos.copy(dartFromPos).lerp(dartToPos, 0.45);
  dartControlPos.y += 0.48;
  dartControlPos.z += (rand() - 0.5) * 0.55;

  const moveVec = new THREE.Vector3().subVectors(dartToPos, dartFromPos).normalize();
  dartToRotY = wp.rotY;

  dartActive = true;
  dartStartTime = nowSec;
  setHintState(true);
  triggerBubblePuff(angler.position, moveVec);
}

// Strict 7px / 450ms tap discrimination so orbit drags never trigger interaction
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
let downPos = { x: 0, y: 0, time: 0, id: -1 };

renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY, time: performance.now(), id: e.pointerId };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.pointerId !== downPos.id) return;
  const dx = e.clientX - downPos.x;
  const dy = e.clientY - downPos.y;
  const distPx = Math.hypot(dx, dy);
  const elapsedMs = performance.now() - downPos.time;

  if (distPx <= 7 && elapsedMs <= 450) {
    pointerNdc.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerNdc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    const hits = raycaster.intersectObjects([anglerProxy, angler], true);
    if (hits.length > 0 && !dartActive) {
      startAnglerDart(performance.now() * 0.001);
    }
  }
});

// ---------- Animation Loop ----------
const clock = new THREE.Clock();
const tempVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const now = performance.now() * 0.001;

  // 1. Anglerfish motion: fast dart with trail OR subtle hovering sway
  let lureBoost = 0;
  let finSpeedMult = 1.0;

  if (dartActive) {
    const u = Math.min(1, (now - dartStartTime) / DART_DURATION);
    // Quintic fast-out ease so it bursts away quickly and settles smoothly
    const ease = 1 - Math.pow(1 - u, 4.2);

    // Quadratic Bezier interpolation
    const oneMinus = 1 - ease;
    angler.position.set(
      oneMinus * oneMinus * dartFromPos.x + 2 * oneMinus * ease * dartControlPos.x + ease * ease * dartToPos.x,
      oneMinus * oneMinus * dartFromPos.y + 2 * oneMinus * ease * dartControlPos.y + ease * ease * dartToPos.y,
      oneMinus * oneMinus * dartFromPos.z + 2 * oneMinus * ease * dartControlPos.z + ease * ease * dartToPos.z
    );

    // Face direction of dart early, then settle to waypoint yaw
    const travelHeading = Math.atan2(-(dartToPos.z - dartFromPos.z), dartToPos.x - dartFromPos.x);
    const blendYaw = u < 0.45
      ? dartFromRotY + shortestAngleDiff(dartFromRotY, travelHeading) * Math.min(1, u * 4.5)
      : travelHeading + shortestAngleDiff(travelHeading, dartToRotY) * ((u - 0.45) / 0.55);

    angler.rotation.y = blendYaw;
    const burstEnv = Math.sin(Math.PI * Math.pow(u, 0.55));
    angler.rotation.z = Math.sin(u * Math.PI * 3) * 0.22 * (1 - u);
    angler.rotation.x = Math.sin(u * Math.PI * 2) * 0.12 * (1 - u);

    lureBoost = burstEnv * 3.8;
    finSpeedMult = 1.0 + burstEnv * 4.5;

    if (u >= 1) {
      dartActive = false;
      anglerBasePos.copy(dartToPos);
      anglerBaseRotY = dartToRotY;
      angler.rotation.set(0, anglerBaseRotY, 0);
      setHintState(false);
    }
  } else {
    // Subtle hovering sway above trench floor
    angler.position.x = anglerBasePos.x + Math.sin(now * 0.65) * 0.075;
    angler.position.y = anglerBasePos.y + Math.sin(now * 1.25) * 0.065;
    angler.position.z = anglerBasePos.z + Math.cos(now * 0.52) * 0.055;
    angler.rotation.y = anglerBaseRotY + Math.sin(now * 0.48) * 0.09;
    angler.rotation.z = Math.sin(now * 1.1) * 0.035;
    angler.rotation.x = Math.cos(now * 0.9) * 0.025;
  }
  anglerProxy.position.copy(angler.position);

  // Fin ripple, jaw breathing, and lure stalk bobbing
  const finPhase = now * (3.6 * finSpeedMult);
  leftPectoral.rotation.y = Math.sin(finPhase) * 0.34;
  leftPectoral.rotation.z = Math.cos(finPhase) * 0.14;
  rightPectoral.rotation.y = -Math.sin(finPhase + 0.4) * 0.34;
  rightPectoral.rotation.z = -Math.cos(finPhase + 0.4) * 0.14;

  tailGroup.rotation.y = Math.sin(finPhase * 1.15) * (0.16 + (finSpeedMult - 1) * 0.07);
  tailFan.rotation.y = Math.sin(finPhase * 1.15 - 0.7) * 0.22;
  jawGroup.rotation.z = -0.22 + Math.sin(now * 1.7) * 0.045;

  // Cyan-green lure bobbing on stalk
  stalkPivot.rotation.z = Math.sin(now * 2.1) * 0.09 - (finSpeedMult - 1) * 0.06;
  stalkPivot.rotation.x = Math.cos(now * 1.6) * 0.07;

  const pulse = 0.5 + 0.5 * Math.sin(now * 3.1);
  M.lureCore.emissiveIntensity = 3.4 + pulse * 1.2 + lureBoost;
  lureLight.intensity = 2.8 + pulse * 0.9 + lureBoost * 0.85;
  const spriteScale = 0.88 + pulse * 0.18 + lureBoost * 0.12;
  lureSprite.scale.setScalar(spriteScale);

  // 2. Update Lure Light Streak Trail
  angler.updateMatrixWorld();
  escaGroup.getWorldPosition(lureWorldPos);

  for (let i = TRAIL_PTS - 1; i > 0; i--) {
    trailHistory[i].lerp(trailHistory[i - 1], 0.58);
  }
  trailHistory[0].copy(lureWorldPos);

  const tp = trailGeo.attributes.position;
  for (let i = 0; i < TRAIL_PTS; i++) {
    const pt = trailHistory[i];
    tp.setXYZ(i, pt.x, pt.y, pt.z);
  }
  tp.needsUpdate = true;

  const targetTrailOpacity = dartActive ? 0.88 : 0.16;
  trailMat.opacity += (targetTrailOpacity - trailMat.opacity) * 0.14;

  for (let i = 0; i < trailBeads.length; i++) {
    const histIdx = Math.min(TRAIL_PTS - 1, (i + 1) * 2 - 1);
    trailBeads[i].mesh.position.copy(trailHistory[histIdx]);
    const fade = (1 - i / trailBeads.length) * (dartActive ? 0.65 : 0.0);
    trailBeads[i].mat.opacity += (fade - trailBeads[i].mat.opacity) * 0.18;
  }

  // 3. Update Dart Bubble Puff Particles
  for (let i = 0; i < PUFF_COUNT; i++) {
    const p = puffBubbles[i];
    if (!p.mesh.visible) continue;
    p.age += dt;
    if (p.age >= p.life) {
      p.mesh.visible = false;
      p.mat.opacity = 0;
      continue;
    }
    const lifeRatio = p.age / p.life;
    p.vel.multiplyScalar(0.95);
    p.vel.y += dt * 0.55; // buoyancy
    p.pos.addScaledVector(p.vel, dt);
    p.mesh.position.copy(p.pos);
    p.mesh.position.x += Math.sin(now * 6 + i) * 0.004;
    p.mat.opacity = 0.72 * (1 - lifeRatio * lifeRatio);
  }

  // 4. Sparse Falling Marine Snow
  const sp = snowGeo.attributes.position;
  for (let i = 0; i < SNOW_COUNT; i++) {
    const s = snowSeeds[i];
    const span = 4.6;
    const curY = 3.4 - ((now * s.speed + s.y + 10) % span);
    const curX = s.x + Math.sin(now * 0.45 + s.phase) * s.driftAmp;
    const curZ = s.z + Math.cos(now * 0.38 + s.phase) * s.driftAmp;
    sp.setXYZ(i, curX, curY, curZ);
  }
  sp.needsUpdate = true;

  // 5. Swaying Bioluminescent Tube Worms & Anemones
  for (let i = 0; i < swayingFlora.length; i++) {
    const fl = swayingFlora[i];
    fl.obj.rotation.x = fl.baseRotX + Math.sin(now * fl.speed + fl.phase) * fl.amp;
    fl.obj.rotation.z = fl.baseRotZ + Math.cos(now * fl.speed * 0.85 + fl.phase) * fl.amp;
  }

  // 6. Subtle Shimmer on Distant Surface Light Cones
  for (const lc of lightCones) {
    lc.mat.opacity = 0.62 + Math.sin(now * 0.75 + lc.ph) * 0.16;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
