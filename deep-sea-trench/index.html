<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Sea Trench - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1826; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 18px; z-index:5;
    background: linear-gradient(rgba(4,10,18,.66), rgba(4,10,18,.32) 55%, rgba(4,10,18,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#e8f2fa; text-transform:uppercase; text-shadow:0 1px 8px rgba(2,8,14,.9); }
  header .rule { width:44px; height:1px; background:rgba(232,242,250,.5); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#eef6fc; transition:opacity 1.2s ease; padding:5px 12px; border-radius:3px;
    background:rgba(6,14,24,.5);
    text-shadow:0 1px 3px rgba(2,8,14,.98), 0 0 8px rgba(2,8,14,.95), 0 0 18px rgba(2,8,14,.85); }
  #hint.faded { opacity:.45; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(232,242,250,.55); }
  canvas { display:block; touch-action:none; }
  @media (max-width: 380px) {
    header h1 { font-size:12px; letter-spacing:.3em; }
    #hint { font-size:10px; letter-spacing:.2em; }
  }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Deep Sea Trench</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// pass 2
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20261101);

const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14304e);
scene.fog = new THREE.Fog(0x14304e, 16, 52);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);
  camera.updateProjectionMatrix();
}
pickFov();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.maxPolarAngle = Math.PI * 0.55;

// lights: raised ~20% over first instinct for the dark scene
const moon = new THREE.DirectionalLight(0xa8ccf0, 1.9);
moon.position.set(4, 12, 5); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.left = -10; moon.shadow.camera.right = 10;
moon.shadow.camera.top = 10; moon.shadow.camera.bottom = -10;
moon.shadow.camera.far = 60;
scene.add(moon);
scene.add(new THREE.AmbientLight(0x3a5c82, 1.7));
const hemi = new THREE.HemisphereLight(0x5c8cbc, 0x14202e, 0.95);
scene.add(hemi);

// ---------- materials ----------
const M = {
  sand: new THREE.MeshStandardMaterial({ color: 0xd0bd98, roughness: .95 }),
  slab: new THREE.MeshStandardMaterial({ color: 0x36506e, roughness: .95 }),
  rock: new THREE.MeshStandardMaterial({ color: 0x54708e, roughness: .95 }),
  rockDark: new THREE.MeshStandardMaterial({ color: 0x42597a, roughness: .95 }),
  vent: new THREE.MeshStandardMaterial({ color: 0x2e2a28, roughness: 1 }),
  ventGlow: new THREE.MeshStandardMaterial({ color: 0x33221a, emissive: 0xff8a40, emissiveIntensity: 2.4 }),
  fish: new THREE.MeshStandardMaterial({ color: 0x1c2836, roughness: .7 }),
  fishBelly: new THREE.MeshStandardMaterial({ color: 0x4a5f74, roughness: .7 }),
  lure: new THREE.MeshStandardMaterial({ color: 0x223311, emissive: 0xc8ff70, emissiveIntensity: 3.0 }),
  teeth: new THREE.MeshStandardMaterial({ color: 0xd8e2ea, roughness: .5 }),
  jelly: new THREE.MeshBasicMaterial({ color: 0x9fc8ff, transparent: true, opacity: .52, side: THREE.DoubleSide }),
  jellyCore: new THREE.MeshBasicMaterial({ color: 0xd8eaff, transparent: true, opacity: .5 }),
  bubble: new THREE.MeshBasicMaterial({ color: 0xcfe8ff, transparent: true, opacity: .5 }),
  snow: new THREE.MeshBasicMaterial({ color: 0xdceaf8, transparent: true, opacity: .55 }),
  smallFish: new THREE.MeshStandardMaterial({ color: 0xc4dcf0, emissive: 0x3a5a78, emissiveIntensity: 0.5, roughness: .6 }),
  plume: new THREE.MeshBasicMaterial({ color: 0x8a949e, transparent: true, opacity: .4 }),
  coral: new THREE.MeshStandardMaterial({ color: 0xe0708a, roughness: .8 }),
  coral2: new THREE.MeshStandardMaterial({ color: 0x7ac0b8, roughness: .8 }),
  star: new THREE.MeshStandardMaterial({ color: 0xd8905a, roughness: .85 }),
  shaft: new THREE.MeshBasicMaterial({ color: 0xa8d0f4, transparent: true, opacity: .14, side: THREE.DoubleSide, depthWrite: false }),
};

// ---------- diorama base ----------
const base = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.7, 7.2), M.slab);
base.position.y = -2.0; base.receiveShadow = true;
scene.add(base);
const floor = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.35, 7.0), M.sand);
floor.position.y = -1.45; floor.receiveShadow = true;
scene.add(floor);
// sandy mounds
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.4 + rand() * 0.5, 8, 6), M.sand);
  m.scale.y = 0.3;
  m.position.set((rand() - 0.5) * 8, -1.3, (rand() - 0.5) * 6);
  m.receiveShadow = true;
  scene.add(m);
}

// ---------- trench walls ----------
function makeWall(x, z, rotY, w, h) {
  const g = new THREE.Group();
  for (let i = 0; i < 6; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w * (0.5 + rand() * 0.6), h * (0.3 + rand() * 0.35), 1.2 + rand()), i % 2 ? M.rock : M.rockDark);
    b.position.set((rand() - 0.5) * w * 0.5, -1.3 + i * h * 0.24 + h * 0.15, (rand() - 0.5) * 0.8);
    b.rotation.y = (rand() - 0.5) * 0.4;
    b.castShadow = true; b.receiveShadow = true;
    g.add(b);
  }
  g.position.set(x, 0, z); g.rotation.y = rotY;
  scene.add(g);
  return g;
}
makeWall(-5.0, -1.4, 0.5, 3.0, 3.9);
makeWall(5.1, -1.2, -0.55, 3.0, 4.2);
makeWall(0, -4.9, 0, 8.0, 3.6);

// ---------- hydrothermal vents ----------
const ventTops = [];
function makeVent(x, z, h, s) {
  const g = new THREE.Group();
  let y = -1.28;
  let r = 0.42 * s;
  while (y < -1.28 + h) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.82, r, 0.34, 8), M.vent);
    seg.position.set((rand() - 0.5) * 0.08, y + 0.17, (rand() - 0.5) * 0.08);
    seg.castShadow = true;
    g.add(seg);
    y += 0.32; r *= 0.94;
  }
  const mouth = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.95, r * 0.8, 0.16, 8), M.ventGlow);
  mouth.position.y = -1.28 + h + 0.06;
  g.add(mouth);
  g.position.set(x, 0, z);
  scene.add(g);
  ventTops.push(new THREE.Vector3(x, -1.28 + h + 0.14, z));
  return g;
}
makeVent(-1.6, -1.6, 1.9, 1.1);
makeVent(-0.6, -2.1, 1.3, 0.9);
makeVent(1.8, -1.7, 2.3, 1.2);
makeVent(2.7, -0.9, 1.1, 0.8);
// warm glow cracks at vent bases
for (const [x, z] of [[-1.2, -1.2], [1.4, -1.2], [2.2, -1.5]]) {
  const crack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.12), M.ventGlow);
  crack.position.set(x, -1.26, z);
  crack.rotation.y = rand() * Math.PI;
  scene.add(crack);
}

// ---------- vent plume particles ----------
const PLUME_N = 60;
const plumeGeo = new THREE.BufferGeometry();
const plumePos = new Float32Array(PLUME_N * 3);
const plumeSeed = [];
for (let i = 0; i < PLUME_N; i++) {
  const vt = ventTops[i % ventTops.length];
  plumeSeed.push({ x: vt.x, y: vt.y, z: vt.z, ph: rand(), sp: 0.14 + rand() * 0.12, drift: (rand() - 0.5) * 0.5 });
}
plumeGeo.setAttribute('position', new THREE.BufferAttribute(plumePos, 3));
const plume = new THREE.Points(plumeGeo, new THREE.PointsMaterial({ color: 0x9aa4ae, size: 0.14, transparent: true, opacity: 0.5, depthWrite: false }));
scene.add(plume);

// ---------- marine snow ----------
const SNOW_N = 220;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW_N * 3);
const snowSeed = [];
for (let i = 0; i < SNOW_N; i++) {
  snowSeed.push({ x: (rand() - 0.5) * 11, y: rand() * 8, z: (rand() - 0.5) * 8, sp: 0.12 + rand() * 0.18, ph: rand() * 9 });
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xdceaf8, size: 0.06, transparent: true, opacity: 0.75, depthWrite: false }));
scene.add(snow);

// ---------- bubbles ----------
const BUB_N = 26;
const bubbles = [];
for (let i = 0; i < BUB_N; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.035 + rand() * 0.035, 6, 6), M.bubble);
  const vt = ventTops[i % ventTops.length];
  scene.add(b);
  bubbles.push({ m: b, x: vt.x, y: vt.y, z: vt.z, ph: rand(), sp: 0.35 + rand() * 0.3 });
}

// ---------- light shafts ----------
for (let i = 0; i < 3; i++) {
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1.1 + rand() * 0.7, 6.5), M.shaft);
  sh.position.set(-2.2 + i * 2.2, 1.8, -3.0 + rand() * 0.5);
  sh.rotation.z = 0.18 + rand() * 0.1;
  sh.rotation.y = (rand() - 0.5) * 0.4;
  scene.add(sh);
}

// ---------- anglerfish ----------
const angler = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 10), M.fish);
  body.scale.set(1.25, 0.95, 0.9); body.castShadow = true;
  angler.add(body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), M.fishBelly);
  belly.scale.set(1.1, 0.7, 0.75); belly.position.set(0.05, -0.16, 0);
  angler.add(belly);
  // jaw + teeth
  const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 8, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.42), M.fish);
  jaw.position.set(0.42, -0.1, 0); jaw.rotation.z = -0.5;
  angler.add(jaw);
  for (let i = 0; i < 5; i++) {
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.11, 4), M.teeth);
    t.position.set(0.5 + i * 0.045, -0.02 - i * 0.012, (i % 2 ? 0.1 : -0.1));
    t.rotation.z = Math.PI * 0.9;
    angler.add(t);
  }
  // eye
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), M.teeth);
  eye.position.set(0.28, 0.18, 0.32); angler.add(eye);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), M.fish);
  pupil.position.set(0.31, 0.18, 0.37); angler.add(pupil);
  const eye2 = eye.clone(); eye2.position.z = -0.32; angler.add(eye2);
  const pupil2 = pupil.clone(); pupil2.position.z = -0.37; angler.add(pupil2);
  // tail + fins
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 6), M.fish);
  tail.position.set(-0.72, 0, 0); tail.rotation.z = -Math.PI / 2;
  angler.add(tail);
  const finT = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.34, 5), M.fish);
  finT.position.set(-0.1, 0.42, 0);
  angler.add(finT);
  // lure stalk
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.5, 5), M.fish);
  stalk.position.set(0.32, 0.5, 0); stalk.rotation.z = -0.7;
  angler.add(stalk);
  var lureMesh = new THREE.Mesh(new THREE.SphereGeometry(0.095, 8, 8), M.lure);
  lureMesh.position.set(0.55, 0.72, 0);
  angler.add(lureMesh);
  var lureLight = new THREE.PointLight(0xc8ff70, 2.2, 6);
  lureLight.position.copy(lureMesh.position);
  angler.add(lureLight);
}
const ANGLER_HOME = new THREE.Vector3(-0.3, 0.1, 1.8);
angler.scale.setScalar(1.3);
angler.position.copy(ANGLER_HOME);
angler.rotation.y = -0.5;
scene.add(angler);
const anglerProxy = new THREE.Mesh(new THREE.SphereGeometry(1.25, 8, 8),
  new THREE.MeshBasicMaterial({ visible: false }));
anglerProxy.position.copy(ANGLER_HOME);
scene.add(anglerProxy);

// ---------- jellyfish ----------
const jellies = [];
function makeJelly(x, y, z, s, tint) {
  const g = new THREE.Group();
  const bell = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.55), M.jelly.clone());
  bell.material.color.set(tint);
  g.add(bell);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), M.jellyCore);
  core.position.y = 0.02;
  g.add(core);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.006, 0.55, 4), M.jelly.clone());
    t.material.color.set(tint); t.material.opacity = 0.3;
    t.position.set(Math.cos(a) * 0.18, -0.3, Math.sin(a) * 0.18);
    g.add(t);
  }
  g.position.set(x, y, z);
  g.scale.setScalar(s);
  scene.add(g);
  jellies.push({ g, bell, baseY: y, ph: rand() * 9, drift: 0.1 + rand() * 0.12 });
}
makeJelly(-2.8, 2.6, -1.0, 1.15, 0x9fc8ff);
makeJelly(2.6, 3.4, -1.8, 0.95, 0xd8a8e8);
makeJelly(0.8, 2.0, -2.8, 0.8, 0x9fd8d0);

// ---------- small fish school ----------
const school = [];
for (let i = 0; i < 9; i++) {
  const f = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 5), M.smallFish);
  f.rotation.z = Math.PI / 2;
  scene.add(f);
  school.push({ m: f, r: 1.7 + rand() * 0.5, h: 0.9 + rand() * 0.7, ph: (i / 9) * Math.PI * 2, sp: 0.5 + rand() * 0.15 });
}

// ---------- corals + starfish ----------
function makeCoral(x, z, mat, s) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.4 + rand() * 0.3, 5), mat);
    br.position.set((rand() - 0.5) * 0.2, 0.2, (rand() - 0.5) * 0.2);
    br.rotation.z = (rand() - 0.5) * 0.9;
    br.castShadow = true;
    g.add(br);
  }
  g.position.set(x, -1.28, z); g.scale.setScalar(s);
  scene.add(g);
}
makeCoral(-3.4, 1.6, M.coral, 1.2);
makeCoral(3.6, 1.4, M.coral2, 1.0);
makeCoral(-2.6, -2.6, M.coral2, 0.9);
makeCoral(3.0, -2.8, M.coral, 1.1);
function makeStar(x, z, s) {
  const g = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const arm = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 4), M.star);
    arm.rotation.z = Math.PI / 2;
    const holder = new THREE.Group();
    holder.rotation.y = (i / 5) * Math.PI * 2;
    arm.position.x = 0.14;
    holder.add(arm);
    g.add(holder);
  }
  g.position.set(x, -1.24, z); g.scale.setScalar(s);
  scene.add(g);
}
makeStar(-1.9, 1.8, 1.0);
makeStar(2.1, 1.9, 0.85);
// scattered shells/pebbles
for (let i = 0; i < 10; i++) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.05 + rand() * 0.05, 6, 5), i % 3 ? M.rock : M.teeth);
  p.scale.y = 0.5;
  p.position.set((rand() - 0.5) * 7.5, -1.26, (rand() - 0.5) * 5.5);
  scene.add(p);
}

// ---------- fitCamera ----------
const fitBox = new THREE.Box3(
  new THREE.Vector3(-5.4, -2.35, -4.4),
  new THREE.Vector3(5.6, 3.8, 3.4));
const fitDir = new THREE.Vector3(0.34, 0.4, 1).normalize();
function fitCamera() {
  const center = fitBox.getCenter(new THREE.Vector3());
  const corners = [];
  for (const x of [fitBox.min.x, fitBox.max.x])
    for (const y of [fitBox.min.y, fitBox.max.y])
      for (const z of [fitBox.min.z, fitBox.max.z])
        corners.push(new THREE.Vector3(x, y, z));
  const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 240);
  probe.position.copy(center).addScaledVector(fitDir, 0.001); probe.lookAt(center); probe.updateMatrixWorld();
  const inv = probe.matrixWorldInverse;
  let need = 0;
  for (const c of corners) {
    const v = c.clone().applyMatrix4(inv);
    const d = Math.max(
      Math.abs(v.y) / Math.tan(THREE.MathUtils.degToRad(probe.fov / 2)),
      Math.abs(v.x) / (Math.tan(THREE.MathUtils.degToRad(probe.fov / 2)) * probe.aspect));
    need = Math.max(need, d + Math.abs(v.z));
  }
  const dist = need * 1.1 + 0.2;
  camera.position.copy(center).addScaledVector(fitDir, dist);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.target.y += -0.35; camera.position.y += -0.35;
  camera.lookAt(controls.target);
  controls.update();
}
fitCamera();

// ---------- hints / interaction ----------
const hintIdle = 'Tap the anglerfish';
const hintDart = 'It darts';
let hintOwner = null;
function setHint(text, owner) {
  if (owner) hintOwner = owner;
  hintEl.textContent = text;
  hintEl.classList.remove('faded');
}
function resetHintIf(owner) {
  if (hintOwner === owner) { hintOwner = null; setHint(hintIdle, null); }
}
setHint(hintIdle, null);
setTimeout(() => hintEl.classList.add('faded'), 6000);

let dartT = -1;
const DART = 4.2;

const ray = new THREE.Raycaster();
function onTap(e) {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(new THREE.Vector2(x, y), camera);
  if (dartT < 0 && ray.intersectObject(anglerProxy, false).length) {
    dartT = performance.now() / 1000;
    setHint(hintDart, 'user');
  }
}
renderer.domElement.addEventListener('pointerdown', onTap);

// ---------- resize ----------
addEventListener('resize', () => {
  pickFov();
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
function smooth(t) { return t * t * (3 - 2 * t); }
const dartDir = new THREE.Vector3(2.3, 0.7, -1.4);
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.3);
  const now = performance.now() / 1000;

  // anglerfish: idle hover or dart (wall-clock closed loop back home)
  let lureBoost = 0;
  if (dartT >= 0) {
    const p = (now - dartT) / DART;
    if (p >= 1) {
      angler.position.copy(ANGLER_HOME);
      angler.rotation.set(0, -0.5, 0);
      dartT = -1;
      resetHintIf('user');
    } else {
      const q = smooth(p);
      const w = Math.sin(Math.PI * q);
      angler.position.copy(ANGLER_HOME).addScaledVector(dartDir, w);
      angler.rotation.y = -0.5 + w * 0.9;
      angler.rotation.z = Math.sin(q * Math.PI * 2) * 0.25;
      lureBoost = w * 2.2;
    }
    anglerProxy.position.copy(angler.position);
  } else {
    angler.position.y = ANGLER_HOME.y + Math.sin(now * 1.2) * 0.08;
    angler.position.x = ANGLER_HOME.x + Math.sin(now * 0.5) * 0.1;
    angler.rotation.y = -0.5 + Math.sin(now * 0.4) * 0.12;
    anglerProxy.position.copy(angler.position);
  }
  M.lure.emissiveIntensity = 2.2 + Math.sin(now * 2.4) * 0.6 + lureBoost;
  lureLight.intensity = 1.6 + Math.sin(now * 2.4) * 0.4 + lureBoost;

  // vent plumes (wall-clock loops)
  const pa = plumeGeo.attributes.position;
  for (let i = 0; i < PLUME_N; i++) {
    const s = plumeSeed[i];
    const t = ((now * s.sp + s.ph) % 1);
    pa.setXYZ(i, s.x + s.drift * t + Math.sin(now + i) * 0.05, s.y + t * 2.6, s.z + Math.cos(now * 0.8 + i) * 0.05);
  }
  pa.needsUpdate = true;

  // marine snow
  const sa = snowGeo.attributes.position;
  for (let i = 0; i < SNOW_N; i++) {
    const s = snowSeed[i];
    const y = 5.5 - ((now * s.sp + s.ph) % 7.6);
    sa.setXYZ(i, s.x + Math.sin(now * 0.3 + i) * 0.3, y, s.z);
  }
  sa.needsUpdate = true;

  // bubbles
  for (const b of bubbles) {
    const t = ((now * b.sp * 0.3 + b.ph) % 1);
    b.m.position.set(b.x + Math.sin(now * 2 + b.ph * 9) * 0.08, b.y + t * 3.4, b.z);
    b.m.material.opacity = 0.5 * (1 - t * 0.7);
  }

  // jellyfish pulse + drift
  for (const j of jellies) {
    const pulse = 1 + Math.sin(now * 1.6 + j.ph) * 0.14;
    j.bell.scale.set(pulse, 1 / pulse, pulse);
    j.g.position.y = j.baseY + Math.sin(now * 0.35 + j.ph) * 0.55;
    j.g.position.x += Math.sin(now * 0.22 + j.ph) * 0.0015;
  }

  // fish school circling the vents
  for (const f of school) {
    const a = now * f.sp + f.ph;
    f.m.position.set(Math.cos(a) * f.r - 0.3, f.h + Math.sin(now * 1.1 + f.ph) * 0.15, Math.sin(a) * f.r * 0.6 - 1.4);
    f.m.rotation.y = -a + Math.PI / 2;
    f.m.rotation.z = Math.PI / 2;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
