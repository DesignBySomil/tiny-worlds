<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Carnivorous bog — a tiny world</title>
  <style>
    :root {
      --bg-top: #123942;
      --bg-mid: #1c505b;
      --bg-bot: #0b242a;
      --text-main: #f2fcf9;
      --text-sub: #a8dbd4;
      --text-hint: #d1f4ee;
      --accent: #ff6b8b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, var(--bg-mid) 0%, var(--bg-top) 58%, var(--bg-bot) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    .hud-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 16px 10px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(9, 28, 34, 0.82) 0%, rgba(9, 28, 34, 0.45) 70%, rgba(9, 28, 34, 0) 100%);
    }
    .title {
      font-size: clamp(1.15rem, 3.5vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-main);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
      line-height: 1.15;
    }
    .subtitle {
      font-size: clamp(0.72rem, 2.2vw, 0.85rem);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-sub);
      margin-top: 2px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
    }
    .hint-pill {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(16, 48, 56, 0.82);
      border: 1px solid rgba(168, 219, 212, 0.35);
      color: var(--text-hint);
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      letter-spacing: 0.02em;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .hud-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px 12px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(to top, rgba(9, 28, 34, 0.82) 0%, rgba(9, 28, 34, 0.4) 65%, rgba(9, 28, 34, 0) 100%);
    }
    .footer-text {
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(168, 219, 212, 0.85);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
    #fallback {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #123942;
      color: #f2fcf9;
      z-index: 100;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="hud-header" id="hudHeader">
      <h1 class="title">Carnivorous bog</h1>
      <div class="subtitle">a tiny world</div>
      <div class="hint-pill">tap a flytrap to snap - tap a sundew to curl</div>
    </header>

    <footer class="hud-footer" id="hudFooter">
      <div class="footer-text">A tiny world</div>
    </footer>

    <div id="fallback">
      <div>
        <strong>WebGL could not be initialized.</strong><br />
        Please enable hardware acceleration or try a modern WebGL-compatible browser to explore the Carnivorous Bog miniature.
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261103)
    function mulberry32(a) {
      return function() {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261103);
    const randRange = (min, max) => min + (max - min) * rand();

    const appEl = document.getElementById('app');
    const headerEl = document.getElementById('hudHeader');
    const footerEl = document.getElementById('hudFooter');
    const fallbackEl = document.getElementById('fallback');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: false
      });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    if (!renderer || !renderer.getContext()) {
      fallbackEl.style.display = 'flex';
      throw new Error('WebGL context creation failed');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    appEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x143c45);
    scene.fog = new THREE.FogExp2(0x18454f, 0.022);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(26);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(72);
    controls.minAzimuthAngle = -THREE.MathUtils.degToRad(65);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(65);

    const worldRoot = new THREE.Group();
    scene.add(worldRoot);

    // LUMINOUS STORYBOOK DUSK LIGHTING WITH CRISP LOCAL CONTRAST:
    // Balanced hemisphere + directional modeling key light + cool rim fill so leaves, ribs, and trap mouths read sharply without washout
    const ambientLight = new THREE.AmbientLight(0x3a646b, 0.55);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0x9ef5ea, 0x38261a, 1.45);
    hemiLight.position.set(0, 12, 0);
    scene.add(hemiLight);

    // Warm golden-amber dusk key light with crisp shadows
    const dirLight = new THREE.DirectionalLight(0xffe4bc, 2.45);
    dirLight.position.set(4.8, 8.8, 5.4);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 20;
    const dCam = 3.8;
    dirLight.shadow.camera.left = -dCam;
    dirLight.shadow.camera.right = dCam;
    dirLight.shadow.camera.top = dCam;
    dirLight.shadow.camera.bottom = -dCam;
    dirLight.shadow.bias = -0.0008;
    scene.add(dirLight);

    // Cool luminous teal-cyan fill light from opposite side for 3D modeling
    const fillLight = new THREE.DirectionalLight(0x5ce6da, 1.15);
    fillLight.position.set(-5.2, 5.0, -3.8);
    scene.add(fillLight);

    // Restrained front-side bounce so trap interiors are clear without flattening shading
    const frontFillLight = new THREE.DirectionalLight(0xc8f7ee, 0.48);
    frontFillLight.position.set(-1.5, 2.2, 5.5);
    scene.add(frontFillLight);

    // Restrained warm ambient point light near background tree
    const bogGlowLight = new THREE.PointLight(0xffb43b, 0.85, 7.5, 1.8);
    bogGlowLight.position.set(-0.45, 1.65, -0.35);
    scene.add(bogGlowLight);

    // Subtle hero flytrap accent light
    const pinkTrapLight = new THREE.PointLight(0xff4d7d, 0.65, 3.8, 2.0);
    pinkTrapLight.position.set(0.28, 1.15, 0.45);
    scene.add(pinkTrapLight);

    // Procedural Textures for Surface Detail (Leaf Veins, Trap Mouth Gradient, Pitcher Ribs, Soft Glow)
    function createSoftRadialTexture() {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.28, 'rgba(255, 240, 200, 0.45)');
      grad.addColorStop(0.65, 'rgba(180, 245, 230, 0.12)');
      grad.addColorStop(1, 'rgba(180, 245, 230, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function createTrapInnerTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      // Rich crimson-magenta center grading to bright chartreuse-pink rim
      const grad = ctx.createLinearGradient(0, 0, 0, 128);
      grad.addColorStop(0.0, '#7a0927');
      grad.addColorStop(0.35, '#c91448');
      grad.addColorStop(0.75, '#f22e65');
      grad.addColorStop(0.92, '#ff6b8b');
      grad.addColorStop(1.0, '#a3e655');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      // Fine radiating digestive gland speckles & subtle lateral vein lines
      ctx.strokeStyle = 'rgba(90, 5, 28, 0.35)';
      ctx.lineWidth = 2;
      for (let i = 1; i < 8; i++) {
        const y = i * 16;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(64, y - 6, 128, y);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function createLeafVeinTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#6ec945';
      ctx.fillRect(0, 0, 128, 128);

      // Central midrib and lateral leaf veins for crisp botanical texture
      ctx.strokeStyle = '#3f8522';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(64, 0);
      ctx.lineTo(64, 128);
      ctx.stroke();

      ctx.strokeStyle = '#4e9c2d';
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const y = i * 16 + 8;
        ctx.beginPath();
        ctx.moveTo(64, y);
        ctx.lineTo(12, y - 10);
        ctx.moveTo(64, y);
        ctx.lineTo(116, y - 10);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    function createPitcherVeinTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, '#a8234e');
      grad.addColorStop(0.45, '#851b3e');
      grad.addColorStop(0.82, '#5c2c24');
      grad.addColorStop(1.0, '#466926');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // Vertical burgundy ribs and reticulated venation
      for (let x = 0; x < 256; x += 16) {
        ctx.strokeStyle = x % 32 === 0 ? 'rgba(55, 6, 22, 0.65)' : 'rgba(225, 75, 115, 0.35)';
        ctx.lineWidth = x % 32 === 0 ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 256);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(70, 8, 28, 0.32)';
      ctx.lineWidth = 1.2;
      for (let y = 16; y < 220; y += 18) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(256, y + 6);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    const softGlowTex = createSoftRadialTexture();
    const trapInnerTex = createTrapInnerTexture();
    const leafVeinTex = createLeafVeinTexture();
    const pitcherVeinTex = createPitcherVeinTexture();

    // Shared Materials (Richly saturated, high local contrast, very low emissive so shading & surface details pop)
    const mats = {
      slabRim: new THREE.MeshStandardMaterial({
        color: 0x38241a,
        roughness: 0.86,
        metalness: 0.05
      }),
      peatDark: new THREE.MeshStandardMaterial({
        color: 0x472f21,
        roughness: 0.84,
        metalness: 0.05
      }),
      peatWet: new THREE.MeshStandardMaterial({
        color: 0x2b1c14,
        roughness: 0.35,
        metalness: 0.12
      }),
      waterPool: new THREE.MeshPhysicalMaterial({
        color: 0x1a6e7a,
        emissive: 0x07262b,
        roughness: 0.07,
        metalness: 0.12,
        transmission: 0.38,
        transparent: true,
        opacity: 0.92,
        reflectivity: 0.92,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05
      }),
      waterRipple: new THREE.MeshBasicMaterial({
        color: 0x8ef5ea,
        transparent: true,
        opacity: 0.28,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      mossBase: new THREE.MeshStandardMaterial({
        color: 0x3d7a3e,
        emissive: 0x041205,
        roughness: 0.78,
        metalness: 0.02
      }),
      mossInstance: new THREE.MeshStandardMaterial({
        color: 0x5ca64b,
        emissive: 0x051404,
        roughness: 0.74,
        metalness: 0.02
      }),
      deadWood: new THREE.MeshStandardMaterial({
        color: 0x695042,
        emissive: 0x0d0806,
        roughness: 0.84,
        metalness: 0.04
      }),
      stemGreen: new THREE.MeshStandardMaterial({
        color: 0x5eb83d,
        map: leafVeinTex,
        emissive: 0x081704,
        roughness: 0.42,
        metalness: 0.04
      }),
      lobeOuter: new THREE.MeshStandardMaterial({
        color: 0x74d147,
        map: leafVeinTex,
        emissive: 0x0a1c05,
        roughness: 0.38,
        metalness: 0.04
      }),
      lobeInner: new THREE.MeshStandardMaterial({
        color: 0xff2e66,
        map: trapInnerTex,
        emissive: 0x29030e,
        roughness: 0.30,
        metalness: 0.04
      }),
      lobeTriggerHair: new THREE.MeshStandardMaterial({
        color: 0xffd2de,
        roughness: 0.3,
        metalness: 0.05
      }),
      lobeTooth: new THREE.MeshStandardMaterial({
        color: 0xc2f760,
        emissive: 0x142604,
        roughness: 0.32,
        metalness: 0.05
      }),
      pitcherBody: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: pitcherVeinTex,
        emissive: 0x1c040d,
        roughness: 0.36,
        metalness: 0.08
      }),
      pitcherRib: new THREE.MeshStandardMaterial({
        color: 0x590d25,
        emissive: 0x140208,
        roughness: 0.32,
        metalness: 0.10
      }),
      pitcherLip: new THREE.MeshStandardMaterial({
        color: 0xd1265a,
        emissive: 0x260410,
        roughness: 0.22,
        metalness: 0.14
      }),
      pitcherHood: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: pitcherVeinTex,
        emissive: 0x1a040c,
        roughness: 0.38,
        metalness: 0.06,
        side: THREE.DoubleSide
      }),
      sundewStem: new THREE.MeshStandardMaterial({
        color: 0x9e2b49,
        emissive: 0x1c030a,
        roughness: 0.45,
        metalness: 0.05
      }),
      sundewTentacle: new THREE.MeshStandardMaterial({
        color: 0xeb2855,
        emissive: 0x29030c,
        roughness: 0.30
      }),
      dewDrop: new THREE.MeshPhysicalMaterial({
        color: 0xe8fffd,
        emissive: 0x1b524d,
        roughness: 0.01,
        metalness: 0.0,
        transmission: 0.90,
        ior: 1.38,
        transparent: true,
        opacity: 0.96,
        clearcoat: 1.0,
        clearcoatRoughness: 0.01
      }),
      bubbleMat: new THREE.MeshPhysicalMaterial({
        color: 0xc7fff8,
        emissive: 0x184742,
        roughness: 0.04,
        metalness: 0.1,
        transmission: 0.78,
        transparent: true,
        opacity: 0.86
      }),
      fireflyMat: new THREE.MeshBasicMaterial({
        color: 0xffe484
      }),
      fireflyHaloMat: new THREE.MeshBasicMaterial({
        map: softGlowTex,
        color: 0xffb838,
        transparent: true,
        opacity: 0.28,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      }),
      mistMat: new THREE.MeshBasicMaterial({
        map: softGlowTex,
        color: 0xa8f0e2,
        transparent: true,
        opacity: 0.13,
        depthWrite: false,
        side: THREE.DoubleSide
      }),
      flyBody: new THREE.MeshStandardMaterial({
        color: 0x263c45,
        emissive: 0x071014,
        roughness: 0.22,
        metalness: 0.65
      }),
      flyEye: new THREE.MeshStandardMaterial({
        color: 0xff3d2e,
        emissive: 0x330804,
        roughness: 0.18,
        metalness: 0.2
      }),
      flyWing: new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        emissive: 0x2b5561,
        roughness: 0.06,
        transmission: 0.78,
        transparent: true,
        opacity: 0.84,
        side: THREE.DoubleSide
      }),
      proxyMat: new THREE.MeshBasicMaterial({
        visible: false
      })
    };

    // 1. COMPACT, ROUNDED SCULPTURAL DIORAMA SLAB & BOG POOLS
    const SLAB_TOP_R = 2.30;
    const SLAB_BOT_R = 2.08;
    const SLAB_HEIGHT = 0.78;

    const slabGroup = new THREE.Group();
    worldRoot.add(slabGroup);

    const baseOuterGeo = new THREE.CylinderGeometry(SLAB_TOP_R, SLAB_BOT_R, SLAB_HEIGHT, 24);
    const posAttr = baseOuterGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const vx = posAttr.getX(i);
      const vy = posAttr.getY(i);
      const vz = posAttr.getZ(i);
      const r = Math.hypot(vx, vz);
      if (r > 0.4) {
        const ang = Math.atan2(vz, vx);
        const wave = 1 + 0.038 * Math.sin(ang * 3 + 0.7) + 0.025 * Math.cos(ang * 5 - 0.4);
        const bevel = vy > 0 ? 0.96 : 1.0;
        posAttr.setX(i, vx * wave * bevel);
        posAttr.setZ(i, vz * wave * bevel);
      }
    }
    baseOuterGeo.computeVertexNormals();
    const baseMesh = new THREE.Mesh(baseOuterGeo, mats.slabRim);
    baseMesh.position.y = -0.40;
    baseMesh.receiveShadow = true;
    baseMesh.castShadow = true;
    slabGroup.add(baseMesh);

    // Tactile peat lip rim
    const peatRimGeo = new THREE.TorusGeometry(2.08, 0.21, 12, 36);
    peatRimGeo.rotateX(Math.PI / 2);
    const rPos = peatRimGeo.attributes.position;
    for (let i = 0; i < rPos.count; i++) {
      const vx = rPos.getX(i);
      const vy = rPos.getY(i);
      const vz = rPos.getZ(i);
      const ang = Math.atan2(vz, vx);
      const radialMod = 1 + 0.038 * Math.sin(ang * 3 + 0.7) + 0.025 * Math.cos(ang * 5 - 0.4);
      rPos.setX(i, vx * radialMod);
      rPos.setZ(i, vz * radialMod);
      rPos.setY(i, vy * 0.68 + 0.04 * Math.sin(ang * 7));
    }
    peatRimGeo.computeVertexNormals();
    const peatRimMesh = new THREE.Mesh(peatRimGeo, mats.peatDark);
    peatRimMesh.position.y = -0.02;
    peatRimMesh.receiveShadow = true;
    slabGroup.add(peatRimMesh);

    // Luminous teal bog pool surface
    const waterGeo = new THREE.CircleGeometry(2.06, 36);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMesh = new THREE.Mesh(waterGeo, mats.waterPool);
    waterMesh.position.y = 0.01;
    waterMesh.receiveShadow = true;
    slabGroup.add(waterMesh);

    // Wet peat basin under water
    const basinGeo = new THREE.CircleGeometry(2.06, 32);
    basinGeo.rotateX(-Math.PI / 2);
    const basinMesh = new THREE.Mesh(basinGeo, mats.peatWet);
    basinMesh.position.y = -0.05;
    slabGroup.add(basinMesh);

    // Shimmering pool ripple rings
    const poolRipples = [];
    const rippleRingGeo = new THREE.RingGeometry(0.14, 0.18, 28);
    rippleRingGeo.rotateX(-Math.PI / 2);
    const poolCenters = [
      new THREE.Vector3(-0.88, 0.016, 0.78),
      new THREE.Vector3(0.95, 0.016, 0.65),
      new THREE.Vector3(-0.12, 0.016, 1.18),
      new THREE.Vector3(0.80, 0.016, -0.88)
    ];
    for (let i = 0; i < poolCenters.length; i++) {
      const m = mats.waterRipple.clone();
      const ring = new THREE.Mesh(rippleRingGeo, m);
      ring.position.copy(poolCenters[i]);
      slabGroup.add(ring);
      poolRipples.push({ mesh: ring, mat: m, phase: i * 1.57, center: poolCenters[i] });
    }

    // 2. MOSSY HUMMOCKS & INSTANCED MOSS TUFTS (Compact, taller cushions)
    const hummocksData = [
      { x: 0.25, z: 0.18, rx: 0.84, ry: 0.48, rz: 0.76 },   // Central hero flytrap hummock
      { x: -0.82, z: -0.35, rx: 0.86, ry: 0.54, rz: 0.75 }, // Dead tree & left pitcher hummock
      { x: 0.58, z: -0.78, rx: 0.72, ry: 0.46, rz: 0.64 },  // Back-right tall pitcher hummock
      { x: -0.45, z: 0.78, rx: 0.62, ry: 0.35, rz: 0.56 },  // Front-left sundew hummock
      { x: 1.08, z: 0.06, rx: 0.56, ry: 0.34, rz: 0.52 },   // Mid-right sundew hummock
      { x: -1.28, z: 0.38, rx: 0.48, ry: 0.28, rz: 0.44 }   // Edge moss cushion
    ];

    const hummockGeo = new THREE.SphereGeometry(1, 20, 14);
    hummocksData.forEach((h) => {
      const peatMound = new THREE.Mesh(hummockGeo, mats.peatDark);
      peatMound.scale.set(h.rx * 1.04, h.ry * 0.82, h.rz * 1.04);
      peatMound.position.set(h.x, -0.04, h.z);
      peatMound.receiveShadow = true;
      peatMound.castShadow = true;
      slabGroup.add(peatMound);

      const mossCap = new THREE.Mesh(hummockGeo, mats.mossBase);
      mossCap.scale.set(h.rx, h.ry, h.rz);
      mossCap.position.set(h.x, 0.0, h.z);
      mossCap.receiveShadow = true;
      mossCap.castShadow = true;
      slabGroup.add(mossCap);
    });

    function getHummockY(x, z) {
      let maxY = 0.0;
      for (const h of hummocksData) {
        const dx = (x - h.x) / h.rx;
        const dz = (z - h.z) / h.rz;
        const d2 = dx * dx + dz * dz;
        if (d2 < 1.0) {
          const y = Math.sqrt(1.0 - d2) * h.ry;
          if (y > maxY) maxY = y;
        }
      }
      return maxY;
    }

    // Instanced Moss Tuft Cushions across hummocks & tree roots (360 instances)
    const MOSS_COUNT = 360;
    const mossTuftGeo = new THREE.DodecahedronGeometry(0.078, 1);
    const mossInst = new THREE.InstancedMesh(mossTuftGeo, mats.mossInstance, MOSS_COUNT);
    mossInst.castShadow = true;
    mossInst.receiveShadow = true;
    worldRoot.add(mossInst);

    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    for (let i = 0; i < MOSS_COUNT; i++) {
      const h = hummocksData[i % hummocksData.length];
      const angle = rand() * Math.PI * 2;
      const dist = Math.pow(rand(), 0.65) * 0.92;
      const mx = h.x + Math.cos(angle) * dist * h.rx;
      const mz = h.z + Math.sin(angle) * dist * h.rz;
      const my = getHummockY(mx, mz) - 0.012;

      dummy.position.set(mx, my, mz);
      dummy.rotation.set(rand() * 0.5, rand() * Math.PI * 2, rand() * 0.5);
      const s = randRange(0.65, 1.40);
      dummy.scale.set(s * 1.18, s * 0.76, s * 1.18);
      dummy.updateMatrix();
      mossInst.setMatrixAt(i, dummy.matrix);

      // Crisp moss hue variation that stays darker than the vibrant flytrap stems
      tempColor.setHSL(randRange(0.26, 0.36), randRange(0.50, 0.72), randRange(0.26, 0.42));
      mossInst.setColorAt(i, tempColor);
    }
    mossInst.instanceMatrix.needsUpdate = true;
    if (mossInst.instanceColor) mossInst.instanceColor.needsUpdate = true;

    // 3. TALLER DEAD MOSS-DRAPED BOG TREE
    const treeGroup = new THREE.Group();
    treeGroup.position.set(-0.92, getHummockY(-0.92, -0.42) - 0.05, -0.42);
    worldRoot.add(treeGroup);

    function createBranchMesh(points, rStart, rEnd, radialSegs = 8) {
      const curve = new THREE.CatmullRomCurve3(points);
      const tubularSegs = 20;
      const geo = new THREE.TubeGeometry(curve, tubularSegs, 1, radialSegs, false);
      const pos = geo.attributes.position;

      for (let i = 0; i <= tubularSegs; i++) {
        const t = i / tubularSegs;
        const center = curve.getPointAt(t);
        const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.85));
        for (let j = 0; j <= radialSegs; j++) {
          const idx = i * (radialSegs + 1) + j;
          const vx = pos.getX(idx) - center.x;
          const vy = pos.getY(idx) - center.y;
          const vz = pos.getZ(idx) - center.z;
          const gnarl = 1 + 0.12 * Math.sin(t * 14 + j * 1.5);
          pos.setXYZ(
            idx,
            center.x + vx * radius * gnarl,
            center.y + vy * radius * gnarl,
            center.z + vz * radius * gnarl
          );
        }
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mats.deadWood);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return { mesh, curve };
    }

    const trunkPts = [
      new THREE.Vector3(0, -0.1, 0),
      new THREE.Vector3(-0.06, 0.72, 0.04),
      new THREE.Vector3(0.08, 1.55, -0.05),
      new THREE.Vector3(0.34, 2.28, 0.06),
      new THREE.Vector3(0.68, 2.75, 0.16)
    ];
    treeGroup.add(createBranchMesh(trunkPts, 0.25, 0.048, 9).mesh);

    const bough1Pts = [
      new THREE.Vector3(0.05, 1.48, -0.04),
      new THREE.Vector3(-0.28, 1.92, -0.18),
      new THREE.Vector3(-0.52, 2.28, -0.10)
    ];
    treeGroup.add(createBranchMesh(bough1Pts, 0.12, 0.028, 7).mesh);

    const bough2Pts = [
      new THREE.Vector3(-0.02, 1.05, 0.04),
      new THREE.Vector3(0.24, 1.28, 0.36),
      new THREE.Vector3(0.46, 1.22, 0.58)
    ];
    treeGroup.add(createBranchMesh(bough2Pts, 0.10, 0.024, 7).mesh);

    for (let r = 0; r < 4; r++) {
      const ang = (r / 4) * Math.PI * 2 + 0.4;
      const rootPts = [
        new THREE.Vector3(Math.cos(ang) * 0.12, 0.14, Math.sin(ang) * 0.12),
        new THREE.Vector3(Math.cos(ang) * 0.32, -0.02, Math.sin(ang) * 0.32),
        new THREE.Vector3(Math.cos(ang) * 0.50, -0.18, Math.sin(ang) * 0.50)
      ];
      treeGroup.add(createBranchMesh(rootPts, 0.09, 0.022, 6).mesh);
    }

    const mossDrapeGeo = new THREE.ConeGeometry(0.072, 0.52, 6);
    mossDrapeGeo.translate(0, -0.26, 0);
    const mossDrapes = [];
    const drapePositions = [
      new THREE.Vector3(0.38, 2.30, 0.08),
      new THREE.Vector3(0.60, 2.65, 0.14),
      new THREE.Vector3(-0.32, 1.95, -0.15),
      new THREE.Vector3(-0.48, 2.22, -0.10),
      new THREE.Vector3(0.32, 1.25, 0.44),
      new THREE.Vector3(0.16, 1.78, -0.04)
    ];
    drapePositions.forEach((dp, idx) => {
      const drape = new THREE.Mesh(mossDrapeGeo, mats.mossInstance);
      drape.position.copy(dp);
      drape.scale.set(randRange(0.85, 1.35), randRange(0.95, 1.55), randRange(0.85, 1.35));
      drape.castShadow = true;
      treeGroup.add(drape);
      mossDrapes.push({ mesh: drape, phase: idx * 1.1 });
    });

    // Interactive registries
    const interactables = [];
    const flytraps = [];
    const sundews = [];
    const pitchers = [];

    // 4. VENUS FLYTRAPS (Cluster of 5 on visibly arching stems with veined lobes, clear crimson mouths, trigger hairs & teeth)
    function createLobeGeometry() {
      const shape = new THREE.Shape();
      shape.moveTo(-0.18, 0);
      shape.bezierCurveTo(-0.20, 0.15, -0.10, 0.24, 0, 0.24);
      shape.bezierCurveTo(0.10, 0.24, 0.20, 0.15, 0.18, 0);
      shape.lineTo(-0.18, 0);
      const extrudeSettings = {
        depth: 0.022,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.012,
        bevelThickness: 0.012
      };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.translate(0, 0, -0.011);
      return geo;
    }
    const sharedLobeGeo = createLobeGeometry();

    // Concave shaped inner mouth pad with clear crimson-pink gradient & trigger hairs
    function createInnerMouthGeo() {
      const geo = new THREE.PlaneGeometry(0.30, 0.19, 8, 6);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const nx = vx / 0.15;
        // Trim top corners to follow lobe arch
        const archScale = Math.sqrt(Math.max(0.15, 1 - nx * nx * 0.65));
        const ny = (vy + 0.095) / 0.19;
        pos.setY(i, ny * 0.195 * archScale + 0.01);
      }
      geo.computeVertexNormals();
      return geo;
    }
    const sharedInnerPadGeo = createInnerMouthGeo();
    const sharedToothGeo = new THREE.ConeGeometry(0.014, 0.105, 5);
    sharedToothGeo.translate(0, 0.052, 0);
    const sharedTriggerHairGeo = new THREE.ConeGeometry(0.004, 0.032, 4);
    sharedTriggerHairGeo.translate(0, 0.016, 0);

    function createFlytrap(config) {
      const group = new THREE.Group();
      group.position.copy(config.basePos);
      worldRoot.add(group);

      // Visibly arching stem with high mid-arch apex
      const stemCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(config.dir.x * 0.18, config.height * 0.55, config.dir.z * 0.18),
        new THREE.Vector3(config.dir.x * 0.45, config.height * 1.08, config.dir.z * 0.45),
        new THREE.Vector3(config.dir.x * 0.65, config.height, config.dir.z * 0.65)
      ]);
      const stemGeo = new THREE.TubeGeometry(stemCurve, 18, 0.028 * config.scale, 8, false);
      const stemMesh = new THREE.Mesh(stemGeo, mats.stemGreen);
      stemMesh.castShadow = true;
      group.add(stemMesh);

      // Leaf petiole wing along stem for extra botanical detail
      const petioleGeo = new THREE.BoxGeometry(0.08 * config.scale, 0.012, 0.24 * config.scale);
      const petioleMesh = new THREE.Mesh(petioleGeo, mats.lobeOuter);
      petioleMesh.position.copy(stemCurve.getPointAt(0.45));
      petioleMesh.lookAt(stemCurve.getPointAt(0.75));
      group.add(petioleMesh);

      // Trap head pivot at tip of arching stem
      const headPivot = new THREE.Group();
      headPivot.position.set(config.dir.x * 0.65, config.height, config.dir.z * 0.65);
      headPivot.rotation.y = config.yaw;
      headPivot.rotation.x = config.pitch;
      headPivot.rotation.z = config.roll;
      headPivot.scale.setScalar(config.scale);
      group.add(headPivot);

      // Defined spine midrib
      const ribGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.35, 8);
      ribGeo.rotateZ(Math.PI / 2);
      const ribMesh = new THREE.Mesh(ribGeo, mats.stemGreen);
      headPivot.add(ribMesh);

      function buildHalfLobe(sideSign) {
        const pivot = new THREE.Group();
        const outer = new THREE.Mesh(sharedLobeGeo, mats.lobeOuter);
        outer.castShadow = true;
        outer.receiveShadow = true;
        pivot.add(outer);

        // Saturated crimson-pink inner mouth pad
        const inner = new THREE.Mesh(sharedInnerPadGeo, mats.lobeInner);
        inner.position.z = sideSign * 0.020;
        if (sideSign < 0) inner.rotation.y = Math.PI;
        pivot.add(inner);

        // 3 delicate sensory trigger hairs inside each lobe
        const hairCoords = [
          [-0.045, 0.085],
          [ 0.000, 0.115],
          [ 0.045, 0.085]
        ];
        hairCoords.forEach(([hx, hy]) => {
          const hair = new THREE.Mesh(sharedTriggerHairGeo, mats.lobeTriggerHair);
          hair.position.set(hx, hy, sideSign * 0.021);
          hair.rotation.x = sideSign * (Math.PI * 0.45);
          pivot.add(hair);
        });

        // Interlocking marginal spines/teeth along curved rim
        const numTeeth = 7;
        for (let i = 0; i < numTeeth; i++) {
          const t = (i / (numTeeth - 1)) * 2 - 1;
          const tx = t * 0.145 + sideSign * 0.008;
          const ty = Math.sqrt(Math.max(0, 1 - t * t * 0.82)) * 0.225;
          const tooth = new THREE.Mesh(sharedToothGeo, mats.lobeTooth);
          tooth.position.set(tx, ty, sideSign * 0.008);
          tooth.rotation.z = -t * 0.42;
          tooth.rotation.x = sideSign * 0.42;
          pivot.add(tooth);
        }
        return pivot;
      }

      const leftLobe = buildHalfLobe(1);
      const rightLobe = buildHalfLobe(-1);
      const openAngle = 0.74;
      leftLobe.rotation.x = openAngle;
      rightLobe.rotation.x = -openAngle;
      headPivot.add(leftLobe);
      headPivot.add(rightLobe);

      // Generous invisible hit proxy for 320px viewports
      const proxyGeo = new THREE.SphereGeometry(0.38, 10, 10);
      const proxyMesh = new THREE.Mesh(proxyGeo, mats.proxyMat);
      proxyMesh.position.set(0, 0.1, 0);
      headPivot.add(proxyMesh);

      const trapObj = {
        type: 'flytrap',
        group,
        headPivot,
        leftLobe,
        rightLobe,
        openAngle,
        closedAngle: 0.06,
        basePitch: config.pitch,
        baseRoll: config.roll,
        phase: config.phase,
        isHero: !!config.isHero,
        state: 'idle',
        stateStartTime: 0,
        fromAngle: openAngle,
        caughtFly: false,
        getWorldMouthPos(targetVec) {
          targetVec.set(0, 0.13, 0);
          return headPivot.localToWorld(targetVec);
        }
      };

      proxyMesh.userData.target = trapObj;
      interactables.push(proxyMesh);
      flytraps.push(trapObj);
      return trapObj;
    }

    const clusterBase = new THREE.Vector3(0.25, getHummockY(0.25, 0.18) - 0.02, 0.18);
    const trapConfigs = [
      // Hero largest flytrap on high arching stem
      {
        basePos: clusterBase.clone().add(new THREE.Vector3(0.0, 0, 0.04)),
        dir: new THREE.Vector3(0.10, 0, 0.34),
        height: 1.05,
        scale: 1.45,
        yaw: 0.22,
        pitch: 0.24,
        roll: -0.06,
        phase: 0.0,
        isHero: true
      },
      {
        basePos: clusterBase.clone().add(new THREE.Vector3(-0.14, 0, 0.10)),
        dir: new THREE.Vector3(-0.48, 0, 0.35),
        height: 0.78,
        scale: 1.15,
        yaw: -0.45,
        pitch: 0.28,
        roll: 0.12,
        phase: 1.3
      },
      {
        basePos: clusterBase.clone().add(new THREE.Vector3(0.18, 0, 0.06)),
        dir: new THREE.Vector3(0.52, 0, 0.26),
        height: 0.86,
        scale: 1.18,
        yaw: 0.58,
        pitch: 0.25,
        roll: -0.14,
        phase: 2.5
      },
      {
        basePos: clusterBase.clone().add(new THREE.Vector3(-0.10, 0, -0.12)),
        dir: new THREE.Vector3(-0.32, 0, -0.38),
        height: 0.92,
        scale: 1.08,
        yaw: -2.1,
        pitch: 0.18,
        roll: 0.08,
        phase: 3.8
      },
      {
        basePos: clusterBase.clone().add(new THREE.Vector3(0.15, 0, -0.10)),
        dir: new THREE.Vector3(0.38, 0, -0.32),
        height: 0.64,
        scale: 1.02,
        yaw: 1.85,
        pitch: 0.32,
        roll: -0.1,
        phase: 5.1
      }
    ];

    trapConfigs.forEach(createFlytrap);

    // Veined basal rosette leaves under the flytrap cluster
    const leafGeo = new THREE.BoxGeometry(0.15, 0.022, 0.38);
    leafGeo.translate(0, 0, 0.19);
    for (let i = 0; i < 9; i++) {
      const leaf = new THREE.Mesh(leafGeo, mats.stemGreen);
      leaf.position.copy(clusterBase);
      leaf.rotation.y = (i / 9) * Math.PI * 2 + 0.2;
      leaf.rotation.x = 0.18 + (i % 2) * 0.08;
      leaf.castShadow = true;
      leaf.receiveShadow = true;
      worldRoot.add(leaf);
    }

    // 5. TALLER PITCHER PLANTS WITH DEFINED LONGITUDINAL RIBS & HOODED TUBES
    function createRibbedPitcherGeometry() {
      const radialSegs = 32;
      const heightSegs = 20;
      const geo = new THREE.CylinderGeometry(0.15, 0.034, 1.25, radialSegs, heightSegs, true);
      geo.translate(0, 0.625, 0);
      const pos = geo.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const t = vy / 1.25;
        const ang = Math.atan2(vz, vx);

        // Trumpet profile + 8 distinct sculpted vertical ribs + front ala wing ridge
        const baseR = 0.034 + 0.118 * Math.pow(t, 1.32) + 0.018 * Math.sin(t * Math.PI * 2);
        const ribWave = 1.0 + 0.085 * Math.sin(t * Math.PI) * Math.cos(ang * 8);
        const frontWing = Math.max(0, Math.cos(ang)) > 0.92 ? 0.028 * Math.sin(t * Math.PI) : 0;
        const finalR = baseR * ribWave + frontWing;

        pos.setX(i, Math.cos(ang) * finalR);
        pos.setZ(i, Math.sin(ang) * finalR);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const sharedPitcherTubeGeo = createRibbedPitcherGeometry();
    const sharedPitcherLipGeo = new THREE.TorusGeometry(0.154, 0.027, 12, 24);
    sharedPitcherLipGeo.rotateX(Math.PI / 2);
    const sharedPitcherHoodGeo = new THREE.SphereGeometry(0.175, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.48);

    function createPitcher(config) {
      const pivot = new THREE.Group();
      pivot.position.copy(config.pos);
      pivot.rotation.y = config.yaw;
      pivot.rotation.x = config.tiltX;
      pivot.rotation.z = config.tiltZ;
      pivot.scale.setScalar(config.scale);
      worldRoot.add(pivot);

      const tube = new THREE.Mesh(sharedPitcherTubeGeo, mats.pitcherBody);
      tube.castShadow = true;
      tube.receiveShadow = true;
      pivot.add(tube);

      // Ridged peristome collar lip with subtle notches
      const lip = new THREE.Mesh(sharedPitcherLipGeo, mats.pitcherLip);
      lip.position.y = 1.25;
      lip.castShadow = true;
      pivot.add(lip);

      const hood = new THREE.Mesh(sharedPitcherHoodGeo, mats.pitcherHood);
      hood.position.set(0, 1.34, -0.06);
      hood.rotation.x = 0.52;
      hood.scale.set(1.05, 0.88, 1.15);
      hood.castShadow = true;
      pivot.add(hood);

      // Escaping mist / bubble plume particles for tap reaction
      const plumeParticles = [];
      for (let i = 0; i < 7; i++) {
        const isMist = i < 3;
        const pMesh = new THREE.Mesh(
          isMist ? new THREE.PlaneGeometry(0.28, 0.28) : new THREE.SphereGeometry(0.038, 8, 8),
          isMist ? mats.mistMat.clone() : mats.bubbleMat.clone()
        );
        pMesh.visible = false;
        pivot.add(pMesh);
        plumeParticles.push({
          mesh: pMesh,
          isMist,
          offset: new THREE.Vector3(
            randRange(-0.06, 0.06),
            randRange(0.0, 0.12),
            randRange(-0.06, 0.06)
          ),
          speed: randRange(0.35, 0.65),
          swayPhase: rand() * Math.PI * 2
        });
      }

      // Generous invisible hit proxy
      const proxyGeo = new THREE.CylinderGeometry(0.34, 0.24, 1.50, 10);
      proxyGeo.translate(0, 0.75, 0);
      const proxyMesh = new THREE.Mesh(proxyGeo, mats.proxyMat);
      pivot.add(proxyMesh);

      const pitcherObj = {
        type: 'pitcher',
        pivot,
        baseTiltX: config.tiltX,
        baseTiltZ: config.tiltZ,
        phase: config.phase,
        triggerTime: -99999,
        plumeParticles
      };

      proxyMesh.userData.target = pitcherObj;
      interactables.push(proxyMesh);
      pitchers.push(pitcherObj);
    }

    const pitcherConfigs = [
      { pos: new THREE.Vector3(0.52, getHummockY(0.52, -0.74) - 0.04, -0.74), scale: 1.42, yaw: -0.4, tiltX: 0.06, tiltZ: -0.05, phase: 0.2 },
      { pos: new THREE.Vector3(0.76, getHummockY(0.76, -0.66) - 0.04, -0.66), scale: 1.16, yaw: 0.3, tiltX: 0.10, tiltZ: 0.07, phase: 1.5 },
      { pos: new THREE.Vector3(0.35, getHummockY(0.35, -0.92) - 0.04, -0.92), scale: 1.02, yaw: -0.9, tiltX: -0.05, tiltZ: -0.09, phase: 2.8 },
      { pos: new THREE.Vector3(-0.52, getHummockY(-0.52, -0.54) - 0.04, -0.54), scale: 1.32, yaw: 0.65, tiltX: 0.08, tiltZ: 0.04, phase: 3.9 },
      { pos: new THREE.Vector3(-0.74, getHummockY(-0.74, -0.72) - 0.04, -0.72), scale: 1.08, yaw: 1.1, tiltX: 0.04, tiltZ: -0.06, phase: 5.0 }
    ];
    pitcherConfigs.forEach(createPitcher);

    // 6. GLISTENING SUNDEWS WITH DISTINCT DEW-TIPPED TENTACLES + INSTANCED DEW DROPS
    const sundewConfigs = [
      { pos: new THREE.Vector3(-0.44, getHummockY(-0.44, 0.76), 0.76), scale: 1.22, phase: 0.4 },
      { pos: new THREE.Vector3(-0.68, getHummockY(-0.68, 0.58), 0.58), scale: 0.98, phase: 1.9 },
      { pos: new THREE.Vector3(1.04, getHummockY(1.04, 0.10), 0.10), scale: 1.18, phase: 3.2 },
      { pos: new THREE.Vector3(0.86, getHummockY(0.86, 0.36), 0.36), scale: 0.95, phase: 4.6 }
    ];

    const TENTACLES_PER_SUNDEW = 28;
    const TOTAL_SUNDEW_DEW = sundewConfigs.length * TENTACLES_PER_SUNDEW;
    const AMBIENT_MOSS_DEW = 140;
    const TOTAL_DEW_INSTANCES = TOTAL_SUNDEW_DEW + AMBIENT_MOSS_DEW;

    const dewGeo = new THREE.SphereGeometry(0.028, 10, 10);
    const dewInst = new THREE.InstancedMesh(dewGeo, mats.dewDrop, TOTAL_DEW_INSTANCES);
    worldRoot.add(dewInst);

    const sharedTentacleGeo = new THREE.CylinderGeometry(0.006, 0.013, 0.165, 6);
    sharedTentacleGeo.translate(0, 0.0825, 0);
    const sharedGlandTipGeo = new THREE.SphereGeometry(0.011, 6, 6);
    sharedGlandTipGeo.translate(0, 0.165, 0);
    const sharedSundewPadGeo = new THREE.CylinderGeometry(0.165, 0.085, 0.048, 16);

    let dewIndexCursor = 0;

    function createSundew(config) {
      const group = new THREE.Group();
      group.position.copy(config.pos);
      group.scale.setScalar(config.scale);
      worldRoot.add(group);

      // Green basal rosette under sundew pad for crisp contrast
      const baseLeafGeo = new THREE.CylinderGeometry(0.21, 0.18, 0.018, 12);
      const baseLeaf = new THREE.Mesh(baseLeafGeo, mats.stemGreen);
      baseLeaf.position.y = 0.009;
      baseLeaf.receiveShadow = true;
      group.add(baseLeaf);

      const pad = new THREE.Mesh(sharedSundewPadGeo, mats.sundewStem);
      pad.position.y = 0.025;
      pad.castShadow = true;
      pad.receiveShadow = true;
      group.add(pad);

      const tentacles = [];
      for (let i = 0; i < TENTACLES_PER_SUNDEW; i++) {
        const ring = i < 10 ? 0 : 1;
        const idxInRing = ring === 0 ? i : i - 10;
        const countInRing = ring === 0 ? 10 : 18;
        const angle = (idxInRing / countInRing) * Math.PI * 2 + ring * 0.25;
        const radius = ring === 0 ? 0.075 : 0.138;
        const baseSplay = ring === 0 ? 0.54 : 0.96;

        const tPivot = new THREE.Group();
        tPivot.position.set(Math.cos(angle) * radius, 0.040, Math.sin(angle) * radius);
        tPivot.rotation.y = -angle + Math.PI / 2;
        tPivot.rotation.x = baseSplay;
        group.add(tPivot);

        const stalk = new THREE.Mesh(sharedTentacleGeo, mats.sundewTentacle);
        tPivot.add(stalk);

        // Deep ruby mucilage gland core inside each dew drop so the drop reads with crisp jewel-like contrast
        const glandCore = new THREE.Mesh(sharedGlandTipGeo, mats.lobeInner);
        tPivot.add(glandCore);

        const tipAnchor = new THREE.Object3D();
        tipAnchor.position.set(0, 0.168, 0);
        tPivot.add(tipAnchor);

        tentacles.push({
          pivot: tPivot,
          tipAnchor,
          baseSplay,
          curledSplay: -0.38,
          dewIdx: dewIndexCursor++,
          phaseOffset: i * 0.35
        });
      }

      // Generous invisible hit proxy for 320px
      const proxyGeo = new THREE.SphereGeometry(0.38, 10, 10);
      const proxyMesh = new THREE.Mesh(proxyGeo, mats.proxyMat);
      proxyMesh.position.y = 0.1;
      group.add(proxyMesh);

      const sundewObj = {
        type: 'sundew',
        group,
        tentacles,
        scale: config.scale,
        phase: config.phase,
        triggerTime: -99999
      };

      proxyMesh.userData.target = sundewObj;
      interactables.push(proxyMesh);
      sundews.push(sundewObj);
    }

    sundewConfigs.forEach(createSundew);

    // Populate ambient glistening dew drops across mossy hummocks
    for (let i = 0; i < AMBIENT_MOSS_DEW; i++) {
      const idx = dewIndexCursor++;
      const h = hummocksData[i % hummocksData.length];
      const ang = rand() * Math.PI * 2;
      const dist = Math.sqrt(rand()) * 0.88;
      const dx = h.x + Math.cos(ang) * dist * h.rx;
      const dz = h.z + Math.sin(ang) * dist * h.rz;
      const dy = getHummockY(dx, dz) + 0.016;
      dummy.position.set(dx, dy, dz);
      dummy.rotation.set(0, 0, 0);
      const s = randRange(0.42, 0.72);
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      dewInst.setMatrixAt(idx, dummy.matrix);
    }
    dewInst.instanceMatrix.needsUpdate = true;

    // 7. ORBITING SMALL FLY WITH TRANSLUCENT WINGS
    const flyGroup = new THREE.Group();
    worldRoot.add(flyGroup);

    const thoraxGeo = new THREE.SphereGeometry(0.040, 10, 8);
    thoraxGeo.scale(1.0, 0.9, 1.35);
    const thoraxMesh = new THREE.Mesh(thoraxGeo, mats.flyBody);
    flyGroup.add(thoraxMesh);

    const abdomenGeo = new THREE.SphereGeometry(0.035, 10, 8);
    abdomenGeo.scale(0.95, 0.85, 1.4);
    const abdomenMesh = new THREE.Mesh(abdomenGeo, mats.flyBody);
    abdomenMesh.position.set(0, -0.005, -0.058);
    flyGroup.add(abdomenMesh);

    const eyeGeo = new THREE.SphereGeometry(0.018, 8, 8);
    const eyeL = new THREE.Mesh(eyeGeo, mats.flyEye);
    eyeL.position.set(0.020, 0.008, 0.040);
    const eyeR = new THREE.Mesh(eyeGeo, mats.flyEye);
    eyeR.position.set(-0.020, 0.008, 0.040);
    flyGroup.add(eyeL, eyeR);

    const wingGeo = new THREE.CircleGeometry(0.062, 12);
    wingGeo.scale(0.65, 1.35, 1.0);
    wingGeo.translate(0, 0.055, 0);
    const wingLeftPivot = new THREE.Group();
    wingLeftPivot.position.set(0.016, 0.024, 0.0);
    const wingLeftMesh = new THREE.Mesh(wingGeo, mats.flyWing);
    wingLeftMesh.rotation.x = Math.PI / 2;
    wingLeftPivot.add(wingLeftMesh);

    const wingRightPivot = new THREE.Group();
    wingRightPivot.position.set(-0.016, 0.024, 0.0);
    const wingRightMesh = new THREE.Mesh(wingGeo, mats.flyWing);
    wingRightMesh.rotation.x = Math.PI / 2;
    wingRightPivot.add(wingRightMesh);

    flyGroup.add(wingLeftPivot, wingRightPivot);

    const flyOrbitCenter = new THREE.Vector3(0.32, 1.78, 0.34);
    const flyState = {
      status: 'orbiting',
      targetTrap: null,
      stateStartTime: 0,
      captureStartPos: new THREE.Vector3(),
      currentPos: new THREE.Vector3(),
      scale: 1.0
    };

    function getFlyOrbitPos(timeSec, outVec) {
      const a = timeSec * 1.65;
      outVec.set(
        flyOrbitCenter.x + Math.cos(a) * 0.44 + Math.sin(a * 2.1) * 0.09,
        flyOrbitCenter.y + Math.sin(a * 2.7) * 0.14,
        flyOrbitCenter.z + Math.sin(a) * 0.38 + Math.cos(a * 1.7) * 0.08
      );
      return outVec;
    }

    // 8. INSTANCED PINPOINT FIREFLIES (Kept at scene periphery & background; never clustering over hero flytrap/sundews)
    const FIREFLY_COUNT = 110;
    const fireflyGeo = new THREE.SphereGeometry(0.013, 6, 6);
    const fireflyInst = new THREE.InstancedMesh(fireflyGeo, mats.fireflyMat, FIREFLY_COUNT);
    worldRoot.add(fireflyInst);

    const fireflyHaloGeo = new THREE.PlaneGeometry(0.055, 0.055);
    const fireflyHaloInst = new THREE.InstancedMesh(fireflyHaloGeo, mats.fireflyHaloMat, FIREFLY_COUNT);
    worldRoot.add(fireflyHaloInst);

    const firefliesData = [];
    for (let i = 0; i < FIREFLY_COUNT; i++) {
      const angle = rand() * Math.PI * 2;
      const rawRadius = randRange(0.20, 1.68);
      const rawY = randRange(0.28, 2.45);
      const driftRadius = randRange(0.05, 0.12);
      const speed = randRange(0.45, 1.15);
      const phase = rand() * Math.PI * 2;
      const pulseSpeed = randRange(1.8, 4.2);

      // Push fireflies out to the perimeter ring (1.18 to 1.75) or high background canopy so they never obscure the central plants
      const perimRadius = 1.18 + (rawRadius / 1.68) * 0.56;
      let fx = Math.cos(angle) * perimRadius;
      let fz = Math.sin(angle) * perimRadius;
      let fy = rawY;

      // Keep front-center view corridor over the flytraps and front sundews completely clear
      if (fz > 0.15 && Math.abs(fx) < 0.95 && fy < 1.95) {
        fz = -Math.abs(fz) - 0.35;
      }

      firefliesData.push({
        baseX: fx,
        baseY: fy,
        baseZ: fz,
        speed,
        driftRadius,
        phase,
        pulseSpeed
      });
    }

    // 9. INSTANCED RISING BOG BUBBLES (120 bubbles rising & popping in the pools)
    const BUBBLE_COUNT = 120;
    const bubbleGeo = new THREE.SphereGeometry(0.030, 8, 8);
    const bubbleInst = new THREE.InstancedMesh(bubbleGeo, mats.bubbleMat, BUBBLE_COUNT);
    worldRoot.add(bubbleInst);

    const bubblesData = [];
    for (let i = 0; i < BUBBLE_COUNT; i++) {
      const poolCenter = poolCenters[i % poolCenters.length];
      const ang = rand() * Math.PI * 2;
      const rad = randRange(0.04, 0.42);
      bubblesData.push({
        x: poolCenter.x + Math.cos(ang) * rad,
        z: poolCenter.z + Math.sin(ang) * rad,
        speed: randRange(0.22, 0.55),
        phase: rand() * 10.0,
        maxHeight: randRange(0.16, 0.38),
        baseScale: randRange(0.50, 1.25)
      });
    }

    // 10. DRIFTING GROUND MIST BANDS (Subtle low-glare atmospheric veil that never washes out the hero plants)
    const mistBands = [];
    const mistPlaneGeo = new THREE.PlaneGeometry(1.12, 1.12);
    mistPlaneGeo.rotateX(-Math.PI / 2);
    for (let i = 0; i < 18; i++) {
      const ang = (i / 18) * Math.PI * 2 + randRange(-0.2, 0.2);
      const rad = randRange(0.35, 1.25);
      const mMat = mats.mistMat.clone();
      const mesh = new THREE.Mesh(mistPlaneGeo, mMat);
      const baseX = Math.cos(ang) * rad;
      const baseZ = Math.sin(ang) * rad;
      const baseY = randRange(0.04, 0.72);
      mesh.position.set(baseX, baseY, baseZ);
      const s = randRange(0.62, 1.05);
      mesh.scale.set(s, 1, s);
      worldRoot.add(mesh);
      mistBands.push({
        mesh,
        mat: mMat,
        baseX,
        baseY,
        baseZ,
        phase: rand() * Math.PI * 2,
        speed: randRange(0.25, 0.55),
        baseOpacity: randRange(0.07, 0.14)
      });
    }

    // 11. ASPECT-AWARE FRAMING FROM EXACT PROJECTED BOUNDING BOX OF ALL IMPORTANT GEOMETRY
    const framingPoints = [];
    const RING_SAMPLES = 24;
    for (let i = 0; i < RING_SAMPLES; i++) {
      const ang = (i / RING_SAMPLES) * Math.PI * 2;
      const wave = 1 + 0.038 * Math.sin(ang * 3 + 0.7) + 0.025 * Math.cos(ang * 5 - 0.4);
      const rTop = 2.31 * wave;
      framingPoints.push(new THREE.Vector3(Math.cos(ang) * rTop, 0.14, Math.sin(ang) * rTop));
      const rBot = 2.09 * wave;
      framingPoints.push(new THREE.Vector3(Math.cos(ang) * rBot, -0.79, Math.sin(ang) * rBot));
    }

    // Dead bog tree full height and boughs
    framingPoints.push(
      new THREE.Vector3(-0.92 + 0.68, 3.15, -0.42 + 0.16),
      new THREE.Vector3(-0.92 - 0.52, 2.66, -0.42 - 0.10),
      new THREE.Vector3(-0.92 + 0.34, 2.70, -0.42 + 0.06)
    );

    // Tallest pitchers & hoods
    framingPoints.push(
      new THREE.Vector3(0.52, 2.38, -0.74),
      new THREE.Vector3(0.76, 2.02, -0.66),
      new THREE.Vector3(-0.52, 2.25, -0.54)
    );

    // Full fly orbit volume around the hero flytrap
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      framingPoints.push(new THREE.Vector3(
        flyOrbitCenter.x + Math.cos(a) * 0.54,
        flyOrbitCenter.y + 0.16,
        flyOrbitCenter.z + Math.sin(a) * 0.46
      ));
    }

    // Rising mist band envelope
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      framingPoints.push(new THREE.Vector3(
        Math.cos(a) * 1.85,
        0.95,
        Math.sin(a) * 1.85
      ));
    }

    const sceneTarget = new THREE.Vector3(0.0, 0.92, 0.02);
    const landscapeViewDir = new THREE.Vector3(0.42, 0.50, 0.76).normalize();
    const portraitViewDir = new THREE.Vector3(0.36, 0.48, 0.80).normalize();

    function updateCameraFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);

      const aspect = w / Math.max(1, h);
      const isPortrait = aspect < 0.95;

      // Measure header and footer safe areas in pixels and convert to NDC [-1, 1]
      const headerH = headerEl.getBoundingClientRect().height || 86;
      const footerH = footerEl.getBoundingClientRect().height || 40;
      const topPadPx = headerH + (isPortrait ? 12 : 14);
      const botPadPx = footerH + (isPortrait ? 12 : 14);

      const safeTopNdc = 1.0 - (topPadPx / h) * 2.0;
      const safeBotNdc = -1.0 + (botPadPx / h) * 2.0;
      const safeCenterY = 0.5 * (safeTopNdc + safeBotNdc);

      const activeViewDir = isPortrait ? portraitViewDir : landscapeViewDir;
      camera.fov = isPortrait ? (aspect < 0.52 ? 46 : 42) : 36;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Target ~5% side margins (NDC half-span 0.90) and fit comfortably inside header/footer safe areas
      const targetHalfSpanX = isPortrait ? 0.90 : 0.88;
      const maxHalfSpanY = (safeTopNdc - safeBotNdc) * 0.47;

      let bestDist = 8.0;
      const lookAtTarget = sceneTarget.clone();
      const tempVec = new THREE.Vector3();

      for (let outer = 0; outer < 6; outer++) {
        let low = 3.2;
        let high = 22.0;

        for (let iter = 0; iter < 20; iter++) {
          const mid = (low + high) * 0.5;
          camera.position.copy(lookAtTarget).addScaledVector(activeViewDir, mid);
          camera.lookAt(lookAtTarget);
          camera.updateMatrixWorld(true);

          let minX = Infinity, maxX = -Infinity;
          let minY = Infinity, maxY = -Infinity;
          for (let i = 0; i < framingPoints.length; i++) {
            tempVec.copy(framingPoints[i]).project(camera);
            if (tempVec.x < minX) minX = tempVec.x;
            if (tempVec.x > maxX) maxX = tempVec.x;
            if (tempVec.y < minY) minY = tempVec.y;
            if (tempVec.y > maxY) maxY = tempVec.y;
          }

          const halfSpanX = (maxX - minX) * 0.5;
          const halfSpanY = (maxY - minY) * 0.5;

          if (halfSpanX <= targetHalfSpanX && halfSpanY <= maxHalfSpanY) {
            high = mid;
          } else {
            low = mid;
          }
        }

        bestDist = high;
        camera.position.copy(lookAtTarget).addScaledVector(activeViewDir, bestDist);
        camera.lookAt(lookAtTarget);
        camera.updateMatrixWorld(true);

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        for (let i = 0; i < framingPoints.length; i++) {
          tempVec.copy(framingPoints[i]).project(camera);
          if (tempVec.x < minX) minX = tempVec.x;
          if (tempVec.x > maxX) maxX = tempVec.x;
          if (tempVec.y < minY) minY = tempVec.y;
          if (tempVec.y > maxY) maxY = tempVec.y;
        }

        const centerX = 0.5 * (minX + maxX);
        const centerY = 0.5 * (minY + maxY);

        const halfFovRad = THREE.MathUtils.degToRad(camera.fov * 0.5);
        const halfHeightWorld = bestDist * Math.tan(halfFovRad);
        const halfWidthWorld = halfHeightWorld * aspect;

        const camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
        const camUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();

        lookAtTarget.addScaledVector(camRight, centerX * halfWidthWorld * 0.85);
        lookAtTarget.addScaledVector(camUp, (centerY - safeCenterY) * halfHeightWorld * 0.85);
      }

      camera.position.copy(lookAtTarget).addScaledVector(activeViewDir, bestDist);
      controls.target.copy(lookAtTarget);
      controls.minDistance = bestDist * 0.88;
      controls.maxDistance = bestDist * 1.16;
      controls.update();
    }

    window.addEventListener('resize', updateCameraFraming);
    updateCameraFraming();

    // 12. INTERACTION LOGIC (Raycaster mouse/touch with pointer distance tap vs drag check)
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };
    let isPointerDown = false;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (moveDist > 9) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(interactables, false);
      if (hits.length > 0) {
        const target = hits[0].object.userData.target;
        if (target) triggerTarget(target, performance.now());
      }
    });

    function triggerTarget(target, nowMs) {
      if (target.type === 'flytrap') {
        target.fromAngle = target.leftLobe.rotation.x;
        target.state = 'snapping';
        target.stateStartTime = nowMs;

        if (flyState.status === 'orbiting' || flyState.status === 'fadingIn') {
          flyState.status = 'drawn';
          flyState.targetTrap = target;
          flyState.stateStartTime = nowMs;
          flyState.captureStartPos.copy(flyGroup.position);
          target.caughtFly = true;
        } else {
          target.caughtFly = false;
        }
      } else if (target.type === 'sundew') {
        target.triggerTime = nowMs;
      } else if (target.type === 'pitcher') {
        target.triggerTime = nowMs;
      }
    }

    // 13. MAIN ANIMATION LOOP (All motion driven strictly by performance.now)
    const tmpVecA = new THREE.Vector3();
    const tmpVecB = new THREE.Vector3();

    function animate(nowMs) {
      requestAnimationFrame(animate);
      const tSec = nowMs * 0.001;

      controls.update();

      // A. Update Venus Flytraps (Idle sway + Hero Snap / Hold / Reopen cycle)
      for (let i = 0; i < flytraps.length; i++) {
        const ft = flytraps[i];
        const idlePitch = ft.basePitch + Math.sin(tSec * 1.4 + ft.phase) * 0.035;
        const idleRoll = ft.baseRoll + Math.cos(tSec * 1.1 + ft.phase) * 0.03;

        if (ft.state === 'idle') {
          const breathe = Math.sin(tSec * 1.8 + ft.phase) * 0.04;
          ft.leftLobe.rotation.x = ft.openAngle + breathe;
          ft.rightLobe.rotation.x = -(ft.openAngle + breathe);
          ft.headPivot.rotation.x = idlePitch;
          ft.headPivot.rotation.z = idleRoll;
        } else if (ft.state === 'snapping') {
          const elapsed = nowMs - ft.stateStartTime;
          const snapDur = 115;
          const u = Math.min(1, elapsed / snapDur);
          const ease = 1 - Math.pow(1 - u, 3);
          const ang = THREE.MathUtils.lerp(ft.fromAngle, ft.closedAngle, ease);
          ft.leftLobe.rotation.x = ang;
          ft.rightLobe.rotation.x = -ang;
          const jolt = Math.sin(u * Math.PI) * 0.14;
          ft.headPivot.rotation.x = idlePitch - jolt;

          if (u >= 1) {
            ft.state = 'holding';
            ft.stateStartTime = nowMs;
          }
        } else if (ft.state === 'holding') {
          const elapsed = nowMs - ft.stateStartTime;
          const holdDur = 2100;
          let twitch = 0;
          if (elapsed < 1100) {
            const decay = 1 - elapsed / 1100;
            twitch = Math.sin(nowMs * 0.055) * 0.055 * decay;
          }
          ft.leftLobe.rotation.x = ft.closedAngle + Math.abs(twitch) * 0.25;
          ft.rightLobe.rotation.x = -(ft.closedAngle + Math.abs(twitch) * 0.25);
          ft.headPivot.rotation.x = idlePitch + twitch;
          ft.headPivot.rotation.z = idleRoll + twitch * 0.7;

          if (elapsed >= holdDur) {
            ft.state = 'opening';
            ft.stateStartTime = nowMs;
          }
        } else if (ft.state === 'opening') {
          const elapsed = nowMs - ft.stateStartTime;
          const openDur = 2400;
          const u = Math.min(1, elapsed / openDur);
          const smooth = u * u * (3 - 2 * u);
          const ang = THREE.MathUtils.lerp(ft.closedAngle, ft.openAngle, smooth);
          ft.leftLobe.rotation.x = ang;
          ft.rightLobe.rotation.x = -ang;
          ft.headPivot.rotation.x = idlePitch;
          ft.headPivot.rotation.z = idleRoll;

          if (u >= 1) {
            ft.state = 'idle';
            ft.caughtFly = false;
          }
        }
      }

      // B. Update Orbiting Fly & Capture / Struggle / Respawn Cycle
      if (flyState.status === 'orbiting') {
        getFlyOrbitPos(tSec, tmpVecA);
        getFlyOrbitPos(tSec + 0.03, tmpVecB);
        flyGroup.position.copy(tmpVecA);
        flyGroup.lookAt(tmpVecB);
        flyGroup.scale.setScalar(1.0);

        const flap = Math.sin(nowMs * 0.075) * 0.65;
        wingLeftPivot.rotation.z = 0.35 + flap;
        wingRightPivot.rotation.z = -0.35 - flap;
      } else if (flyState.status === 'drawn') {
        const elapsed = nowMs - flyState.stateStartTime;
        const drawDur = 115;
        const u = Math.min(1, elapsed / drawDur);
        flyState.targetTrap.getWorldMouthPos(tmpVecB);
        flyGroup.position.lerpVectors(flyState.captureStartPos, tmpVecB, u);
        flyGroup.lookAt(tmpVecB);
        flyGroup.scale.setScalar(1.0 - u * 0.15);

        const flap = Math.sin(nowMs * 0.12) * 0.85;
        wingLeftPivot.rotation.z = 0.35 + flap;
        wingRightPivot.rotation.z = -0.35 - flap;

        if (u >= 1) {
          flyState.status = 'caught';
          flyState.stateStartTime = nowMs;
        }
      } else if (flyState.status === 'caught') {
        const elapsed = nowMs - flyState.stateStartTime;
        flyState.targetTrap.getWorldMouthPos(tmpVecB);
        flyGroup.position.copy(tmpVecB);
        if (elapsed < 1100) {
          const flap = Math.sin(nowMs * 0.14) * 0.75;
          wingLeftPivot.rotation.z = 0.25 + flap;
          wingRightPivot.rotation.z = -0.25 - flap;
          flyGroup.rotation.z = Math.sin(nowMs * 0.08) * 0.25;
        } else {
          flyState.status = 'still';
          flyState.stateStartTime = nowMs;
        }
      } else if (flyState.status === 'still') {
        const elapsed = nowMs - flyState.stateStartTime;
        flyState.targetTrap.getWorldMouthPos(tmpVecB);
        flyGroup.position.copy(tmpVecB);
        wingLeftPivot.rotation.z = 0.15;
        wingRightPivot.rotation.z = -0.15;
        const shrink = Math.max(0.001, 1.0 - Math.max(0, (elapsed - 800) / 700));
        flyGroup.scale.setScalar(shrink * 0.85);

        if (elapsed >= 1600) {
          flyState.status = 'fadingIn';
          flyState.stateStartTime = nowMs;
          flyState.targetTrap = null;
        }
      } else if (flyState.status === 'fadingIn') {
        const elapsed = nowMs - flyState.stateStartTime;
        const fadeDur = 1200;
        const u = Math.min(1, elapsed / fadeDur);
        getFlyOrbitPos(tSec, tmpVecA);
        getFlyOrbitPos(tSec + 0.03, tmpVecB);
        flyGroup.position.copy(tmpVecA);
        flyGroup.lookAt(tmpVecB);
        flyGroup.scale.setScalar(Math.max(0.01, u));

        const flap = Math.sin(nowMs * 0.075) * 0.65;
        wingLeftPivot.rotation.z = 0.35 + flap;
        wingRightPivot.rotation.z = -0.35 - flap;

        if (u >= 1) {
          flyState.status = 'orbiting';
        }
      }

      // C. Update Sundews (Idle sway + Tap Tentacle Curl + Instanced Dew Glint)
      worldRoot.updateMatrixWorld();
      for (let s = 0; s < sundews.length; s++) {
        const sd = sundews[s];
        const elapsed = nowMs - sd.triggerTime;
        let curlFactor = 0;
        if (elapsed >= 0 && elapsed < 3600) {
          if (elapsed < 1000) {
            const u = elapsed / 1000;
            curlFactor = u * u * (3 - 2 * u);
          } else if (elapsed < 2000) {
            curlFactor = 1.0;
          } else {
            const u = (elapsed - 2000) / 1600;
            curlFactor = 1.0 - u * u * (3 - 2 * u);
          }
        }

        for (let t = 0; t < sd.tentacles.length; t++) {
          const tent = sd.tentacles[t];
          const sway = Math.sin(tSec * 1.9 + sd.phase + tent.phaseOffset) * 0.045;
          tent.pivot.rotation.x = THREE.MathUtils.lerp(tent.baseSplay + sway, tent.curledSplay, curlFactor);
          tent.pivot.updateMatrixWorld();

          tent.tipAnchor.getWorldPosition(tmpVecA);
          const glintPulse = 1.0 + 0.38 * curlFactor * Math.sin(nowMs * 0.02 + tent.phaseOffset);
          dummy.position.copy(tmpVecA);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(sd.scale * glintPulse);
          dummy.updateMatrix();
          dewInst.setMatrixAt(tent.dewIdx, dummy.matrix);
        }
      }
      dewInst.instanceMatrix.needsUpdate = true;

      // D. Update Pitcher Plants (Idle sway + Wobble & Mist/Bubble Plume on Tap)
      for (let p = 0; p < pitchers.length; p++) {
        const pt = pitchers[p];
        const elapsed = nowMs - pt.triggerTime;
        let wobbleX = 0;
        let wobbleZ = 0;
        if (elapsed >= 0 && elapsed < 2200) {
          const decay = Math.pow(1 - elapsed / 2200, 2);
          wobbleX = Math.sin(elapsed * 0.026) * 0.16 * decay;
          wobbleZ = Math.cos(elapsed * 0.022) * 0.14 * decay;
        }
        pt.pivot.rotation.x = pt.baseTiltX + Math.sin(tSec * 1.1 + pt.phase) * 0.02 + wobbleX;
        pt.pivot.rotation.z = pt.baseTiltZ + Math.cos(tSec * 0.9 + pt.phase) * 0.02 + wobbleZ;

        for (let k = 0; k < pt.plumeParticles.length; k++) {
          const pp = pt.plumeParticles[k];
          if (elapsed >= 0 && elapsed < 2200) {
            const prog = elapsed / 2200;
            pp.mesh.visible = true;
            const py = 1.28 + prog * (0.62 + pp.speed * 0.35);
            const px = pp.offset.x + Math.sin(prog * 7 + pp.swayPhase) * 0.06;
            const pz = pp.offset.z + Math.cos(prog * 6 + pp.swayPhase) * 0.06;
            pp.mesh.position.set(px, py, pz);
            if (pp.isMist) {
              pp.mesh.lookAt(camera.position);
              const s = 0.42 + prog * 1.15;
              pp.mesh.scale.setScalar(s);
              pp.mesh.material.opacity = Math.sin(prog * Math.PI) * 0.36;
            } else {
              const pop = prog < 0.85 ? Math.sin((prog / 0.85) * Math.PI * 0.5) : (1 - (prog - 0.85) / 0.15);
              pp.mesh.scale.setScalar(Math.max(0.01, pop * 1.25));
            }
          } else {
            pp.mesh.visible = false;
          }
        }
      }

      // E. Update Pinpoint Fireflies & Tiny Warm Halos at Periphery/Background
      for (let i = 0; i < FIREFLY_COUNT; i++) {
        const ff = firefliesData[i];
        const a = tSec * ff.speed + ff.phase;
        const fx = ff.baseX + Math.cos(a) * ff.driftRadius;
        const fy = ff.baseY + Math.sin(a * 1.4) * 0.08;
        const fz = ff.baseZ + Math.sin(a * 0.9) * ff.driftRadius;
        const pulse = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(tSec * ff.pulseSpeed + ff.phase), 2.0);

        dummy.position.set(fx, fy, fz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(pulse * 0.85);
        dummy.updateMatrix();
        fireflyInst.setMatrixAt(i, dummy.matrix);

        dummy.quaternion.copy(camera.quaternion);
        dummy.scale.setScalar(pulse * 0.95);
        dummy.updateMatrix();
        fireflyHaloInst.setMatrixAt(i, dummy.matrix);
      }
      fireflyInst.instanceMatrix.needsUpdate = true;
      fireflyHaloInst.instanceMatrix.needsUpdate = true;

      bogGlowLight.intensity = 0.75 + 0.20 * Math.sin(tSec * 2.3);

      // F. Update Instanced Rising & Popping Pool Bubbles
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const b = bubblesData[i];
        const cycle = (tSec * b.speed + b.phase) % 1.0;
        const by = 0.01 + cycle * b.maxHeight;
        let bScale = b.baseScale;
        if (cycle < 0.15) {
          bScale *= cycle / 0.15;
        } else if (cycle > 0.88) {
          bScale *= 1.35 * (1.0 - (cycle - 0.88) / 0.12);
        }
        dummy.position.set(
          b.x + Math.sin(tSec * 3.0 + b.phase) * 0.012,
          by,
          b.z + Math.cos(tSec * 2.7 + b.phase) * 0.012
        );
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(Math.max(0.001, bScale));
        dummy.updateMatrix();
        bubbleInst.setMatrixAt(i, dummy.matrix);
      }
      bubbleInst.instanceMatrix.needsUpdate = true;

      // G. Update Shimmering Pool Ripples
      for (let i = 0; i < poolRipples.length; i++) {
        const rp = poolRipples[i];
        const rCycle = (tSec * 0.42 + rp.phase) % 1.0;
        const scale = 0.5 + rCycle * 2.0;
        rp.mesh.scale.set(scale, 1, scale);
        rp.mat.opacity = Math.sin(rCycle * Math.PI) * 0.28;
      }

      // H. Update Drifting Ground Mist & Hanging Tree Moss Sway
      for (let i = 0; i < mistBands.length; i++) {
        const mb = mistBands[i];
        const mAngle = tSec * mb.speed + mb.phase;
        mb.mesh.position.x = mb.baseX + Math.sin(mAngle) * 0.14;
        mb.mesh.position.z = mb.baseZ + Math.cos(mAngle * 0.8) * 0.14;
        mb.mesh.position.y = mb.baseY + Math.sin(mAngle * 0.6) * 0.05;
        mb.mesh.rotation.y = mAngle * 0.25;
        mb.mat.opacity = mb.baseOpacity * (0.78 + 0.22 * Math.sin(mAngle * 1.3));
      }

      for (let i = 0; i < mossDrapes.length; i++) {
        const md = mossDrapes[i];
        md.mesh.rotation.z = Math.sin(tSec * 1.1 + md.phase) * 0.06;
        md.mesh.rotation.x = Math.cos(tSec * 0.9 + md.phase) * 0.05;
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
