// ---------- Deterministic PRNG: mulberry32(20261101) ----------
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rand = (a = 0, b = 1) => a + rng() * (b - a);

// ---------- Procedural Canvas Textures (Caustics, Bubbles, Plankton, Sunbeams) ----------
function makeCausticTex() {
  const sz = 256;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = sz;
  const ctx = cvs.getContext('2d');
  const rLocal = mulberry32(20261101 ^ 0x55aa);
  const cells = [];
  for (let i = 0; i < 38; i++) {
    cells.push({ x: rLocal() * sz, y: rLocal() * sz });
  }
  const img = ctx.createImageData(sz, sz);
  const data = img.data;
  for (let y = 0; y < sz; y++) {
    for (let x = 0; x < sz; x++) {
      let d1 = 1e9, d2 = 1e9;
      for (let i = 0; i < cells.length; i++) {
        let dx = Math.abs(x - cells[i].x);
        let dy = Math.abs(y - cells[i].y);
        if (dx > sz * 0.5) dx = sz - dx;
        if (dy > sz * 0.5) dy = sz - dy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < d1) { d2 = d1; d1 = d; }
        else if (d < d2) { d2 = d; }
      }
      const ridge = Math.max(0, 1 - (d2 - d1) / 10.5);
      const v = Math.min(255, Math.floor(Math.pow(ridge, 2.2) * 255));
      const idx = (y * sz + x) * 4;
      data[idx] = Math.floor(v * 0.72);
      data[idx + 1] = Math.floor(v * 0.97);
      data[idx + 2] = v;
      data[idx + 3] = v;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cvs);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2.8, 2.8);
  return tex;
}
const causticTex = makeCausticTex();

function makeBubbleTex() {
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 64;
  const ctx = cvs.getContext('2d');
  const g = ctx.createRadialGradient(22, 20, 2, 32, 32, 28);
  g.addColorStop(0, 'rgba(255,255,255,0.98)');
  g.addColorStop(0.32, 'rgba(215,252,255,0.62)');
  g.addColorStop(0.76, 'rgba(150,238,255,0.88)');
  g.addColorStop(0.95, 'rgba(195,248,255,0.2)');
  g.addColorStop(1, 'rgba(195,248,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(32, 32, 28, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(cvs);
}
const bubbleTex = makeBubbleTex();

function makePlanktonTex() {
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 32;
  const ctx = cvs.getContext('2d');
  const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
  g.addColorStop(0, 'rgba(245,255,252,1)');
  g.addColorStop(0.5, 'rgba(190,248,245,0.55)');
  g.addColorStop(1, 'rgba(190,248,245,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(cvs);
}

// ---------- Compact Narrow Base & Sculpted Cutaway Reef Island ----------
// Base radius ~4.75 & tower height ~8.35 ensures portrait height >= 54% while full base stays visible
const BASE_R = 4.78;

function islandRadiusFactor(ang, seedOff = 0) {
  return 1.0
    + 0.06 * Math.cos(ang * 3 + 0.6)
    + 0.045 * Math.sin(ang * 5 - 1.2)
    + 0.025 * Math.cos(ang * 8 + seedOff);
}

function buildStrataTier(rTop, rBot, h, yCenter, hexCol, seedOff) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, h, 64, 6, false);
  const pos = geo.attributes.position;
  const baseC = new THREE.Color(hexCol);
  const cols = [];
  for (let i = 0; i < pos.count; i++) {
    let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    const d = Math.hypot(vx, vz);
    const ang = Math.atan2(vz, vx);
    if (d > 0.15) {
      const lobe = islandRadiusFactor(ang, seedOff);
      const flute = Math.sin(vy * 5.8 + ang * 3.0) * 0.065;
      const scale = lobe + flute / Math.max(1, d);
      vx *= scale;
      vz *= scale;
    }
    pos.setXYZ(i, vx, vy, vz);
    const c = baseC.clone();
    c.offsetHSL(0, 0, (vy / h) * 0.055 + Math.sin(ang * 6 + vy * 4) * 0.025);
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.91, metalness: 0.03, flatShading: true
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.y = yCenter;
  m.receiveShadow = true;
  m.castShadow = true;
  slabGroup.add(m);
  return m;
}

// ---------- Rippled Sand Bed & Animated Caustics ----------
function sandElevation(x, z) {
  const r = Math.hypot(x, z);
  const dome = Math.max(0, 1 - Math.pow(r / BASE_R, 2)) * 0.36;
  const ripple = Math.sin(x * 3.3 + Math.sin(z * 1.9) * 1.15) * 0.042
               + Math.cos(z * 2.8 - x * 0.85) * 0.026;
  return 0.08 + dome + ripple * Math.min(1, Math.max(0, (BASE_R - r) * 0.6));
}

{

  const pos = sandGeo.attributes.position;

  const cLight = new THREE.Color(PAL.sandBright);
  const cWarm = new THREE.Color(PAL.sandWarm);
  const cShadow = new THREE.Color(PAL.sandShadow);

  for (let i = 0; i < pos.count; i++) {
    let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    const ang = Math.atan2(vz, vx);
    const lobe = islandRadiusFactor(ang, 3.7);
    vx *= lobe;
    vz *= lobe;
    if (vy > 0) {
      vy = sandElevation(vx, vz);
    } else {
      vy = -0.06;
    }
    pos.setXYZ(i, vx, vy, vz);

    const crest = 0.5 + 0.5 * Math.sin(vx * 3.3 + Math.sin(vz * 1.9) * 1.15);
    const c = cShadow.clone().lerp(cWarm, 0.5).lerp(cLight, crest * 0.75);
    c.offsetHSL(rand(-0.004, 0.004), rand(-0.008, 0.008), rand(-0.012, 0.012));
    cols.push(c.r, c.g, c.b);

    sandGeo,
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 })
  );
  sandMesh.receiveShadow = true;
  slabGroup.add(sandMesh);
}

function addReefRock(x, y, z, rx, ry, rz, baseHex, detail = 3) {
  const geo = new THREE.IcosahedronGeometry(1, detail);
  const pos = geo.attributes.position;
  const cBase = new THREE.Color(baseHex);
  const cCoralline = new THREE.Color(PAL.coralline);
  const cHighlight = new THREE.Color(PAL.sandWarm);
  const cols = [];
  const s = rand(0, 80);

  for (let i = 0; i < pos.count; i++) {
    let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    const n1 = Math.sin(vx * 3.8 + s) * Math.cos(vy * 3.3 - s) * Math.sin(vz * 3.9 + s * 0.6);
    const n2 = Math.sin(vx * 7.8 + vy * 6.4) * 0.075;
    const terrace = 1 + 0.15 * Math.sin(vy * 5.8 + s);
    const disp = (1 + n1 * 0.21 + n2) * terrace;

    vx *= rx * disp;
    vy *= ry * (1 + n1 * 0.15);
    vz *= rz * disp;
    pos.setXYZ(i, vx, vy, vz);

    const topBlend = Math.max(0, Math.min(1, (vy / ry + 0.55) * 0.78));
    const c = cBase.clone().lerp(cCoralline, topBlend * 0.68);
    if (vy > ry * 0.42) c.lerp(cHighlight, 0.24);
    c.offsetHSL(0, 0, n2 * 0.45);
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.87, metalness: 0.04, flatShading: true
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  rockGroup.add(m);
  return m;
}

// ---------- Interactive Tap Target Registry (Fat Invisible Hit Spheres) ----------
const tapTargets = [];
function regTap(obj, x, y, z, r, data) {
  const hitRadius = Math.max(1.35, r);
  const proxy = new THREE.Mesh(
    new THREE.SphereGeometry(hitRadius, 10, 8),

// ---------- Richly Detailed Coral Builders ----------

// 1. Lush Branching Staghorn / Acropora Coral with Luminous Polyps & Tips
function staghorn(x, y, z, colorHex, tipHex, scale = 1, lean = new THREE.Vector3(0, 1, 0)) {
  const g = new THREE.Group();
  const cBase = new THREE.Color(colorHex);
  const cTip = new THREE.Color(tipHex);
  const branchMat = new THREE.MeshStandardMaterial({
    color: cBase, roughness: 0.58, metalness: 0.04,
    emissive: cBase, emissiveIntensity: 0.06
  });
  const tipMat = new THREE.MeshStandardMaterial({
    color: cTip, roughness: 0.42,
    emissive: cTip, emissiveIntensity: 0.16
  });

  function growBranch(px, py, pz, dir, len, rad, depth) {
    const segGeo = new THREE.CylinderGeometry(rad * 0.68, rad, len, 7, 2);
    const pos = segGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vy = pos.getY(i);
      const corallite = 1 + 0.08 * Math.sin(vy * 15 + depth);
      pos.setX(i, pos.getX(i) * corallite);
      pos.setZ(i, pos.getZ(i) * corallite);
    }
    segGeo.computeVertexNormals();

    const m = new THREE.Mesh(segGeo, depth === 0 ? tipMat : branchMat);
    const end = new THREE.Vector3(px, py, pz).addScaledVector(dir, len);
    m.position.set(px + dir.x * len * 0.5, py + dir.y * len * 0.5, pz + dir.z * len * 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);

    if (depth <= 0) {
      const tip = new THREE.Mesh(new THREE.SphereGeometry(rad * 0.8, 7, 6), tipMat);
      tip.scale.set(1, 1.35, 1);
      tip.position.copy(end);
      tip.quaternion.copy(m.quaternion);
      g.add(tip);
      return;
    }

    const subCount = depth === 3 ? 3 : (2 + (rng() > 0.42 ? 1 : 0));
    for (let i = 0; i < subCount; i++) {
      const spread = 0.56;
      const nd = dir.clone().add(new THREE.Vector3(
        rand(-spread, spread),
        rand(0.3, 0.78),
        rand(-spread, spread)
      )).normalize();
      growBranch(end.x, end.y, end.z, nd, len * rand(0.68, 0.84), rad * 0.72, depth - 1);
    }
  }

  const stems = 2 + Math.floor(rand(0, 1.8));
  for (let s = 0; s < stems; s++) {
    const ox = rand(-0.16, 0.16) * scale;
    const oz = rand(-0.16, 0.16) * scale;
    const d0 = lean.clone().add(new THREE.Vector3(rand(-0.2, 0.2), 0, rand(-0.2, 0.2))).normalize();
    growBranch(x + ox, y, z + oz, d0, 0.82 * scale, 0.17 * scale, 3);
  }

  worldGroup.add(g);
  regTap(g, x, y + 1.05 * scale, z, 1.55 * scale, { name: 'staghorn', x, y: y + 1.05 * scale, z });
  return g;
}

// 2. Stacked Tiered Plate Corals (Acropora / Montipora Tables)
function plateCoral(x, y, z, innerHex, rimHex, scale = 1, yaw = 0) {
  const g = new THREE.Group();
  const cIn = new THREE.Color(innerHex);
  const cRim = new THREE.Color(rimHex);
  const tiers = 3 + Math.floor(rand(0, 2));

  for (let t = 0; t < tiers; t++) {
    const r = (0.62 + t * 0.26) * scale;
    const geo = new THREE.CylinderGeometry(r, r * 0.30, 0.11 * scale, 28, 4);
    const pos = geo.attributes.position;
    const cols = [];
    const ph = rand(0, 6.28);

    for (let i = 0; i < pos.count; i++) {
      let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
      const d = Math.hypot(vx, vz) / r;
      const a = Math.atan2(vz, vx);
      const ruffle = Math.sin(a * 7 + ph) * 0.055 * d + Math.cos(a * 13) * 0.025 * d;
      const cup = Math.pow(d, 1.7) * 0.14 * scale;
      vy += ruffle + cup;
      const radMod = 1 + 0.09 * Math.sin(a * 5 + ph) * d;
      vx *= radMod;
      vz *= radMod;
      pos.setXYZ(i, vx, vy, vz);

      const c = cIn.clone().lerp(cRim, Math.pow(Math.min(1, d), 2.0));
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.64, metalness: 0.04
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(
      Math.cos(yaw + t * 0.45) * 0.16 * t * scale,
      t * 0.23 * scale,
      Math.sin(yaw + t * 0.45) * 0.16 * t * scale
    );
    m.rotation.z = rand(-0.1, 0.1);
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(x, y, z);
  worldGroup.add(g);
  regTap(g, x, y + 0.35 * scale, z, 1.45 * scale, { name: 'plate coral', x, y: y + 0.35 * scale, z });
  return g;
}

// 3. Sculpted Brain Coral with Meandering Gyri Grooves
function brainCoral(x, y, z, ridgeHex, grooveHex, r) {
  const geo = new THREE.IcosahedronGeometry(r, 4);
  const pos = geo.attributes.position;
  const cRidge = new THREE.Color(ridgeHex);
  const cGroove = new THREE.Color(grooveHex);
  const cols = [];
  const p1 = rand(0, 10), p2 = rand(0, 10);

  for (let i = 0; i < pos.count; i++) {
    let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    if (vy < -r * 0.35) vy = -r * 0.35 + (vy + r * 0.35) * 0.25;
    const wx = vx * 7.6 + Math.sin(vz * 5.2 + p1) * 1.6;
    const wz = vz * 7.6 + Math.cos(vx * 5.2 + p2) * 1.6;
    const gyri = Math.sin(wx + Math.sin(wz) * 1.4) * Math.cos(vy * 6.0);
    const k = 0.5 + 0.5 * gyri;
    const disp = 1 + (k - 0.5) * 0.135;

    vx *= disp;
    vy *= disp * 0.78;
    vz *= disp;
    pos.setXYZ(i, vx, vy, vz);

    const c = cGroove.clone().lerp(cRidge, Math.pow(k, 0.78));
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.74, metalness: 0.04
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y + r * 0.28, z);
  m.castShadow = true;
  m.receiveShadow = true;
  worldGroup.add(m);
  regTap(m, x, y + r * 0.5, z, Math.max(1.35, r * 1.55), { name: 'brain coral', x, y: y + r * 0.5, z });
  return m;
}

// 4. Gorgonian Sea Fan with Vein Branches & Swaying Blade
const fans = [];
function seaFan(x, y, z, colorHex, r, rotY, tiltZ = 0) {
  const g = new THREE.Group();
  const cBase = new THREE.Color(colorHex);
  const cEdge = cBase.clone().offsetHSL(0.03, 0.12, 0.16);
  const veinMat = new THREE.MeshStandardMaterial({
    color: cBase.clone().multiplyScalar(0.76), roughness: 0.72
  });
  const fanMat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.68, side: THREE.DoubleSide
  });

  const veins = 9;
  for (let b = 0; b < veins; b++) {
    const f = b / (veins - 1);
    const ang = (f - 0.5) * Math.PI * 0.88;
    const len = r * (0.78 + 0.22 * Math.cos((f - 0.5) * 2.2));
    const pts = [];
    for (let s = 0; s <= 6; s++) {
      const t = s / 6;
      const rad = t * len;
      const bend = Math.sin(t * Math.PI) * 0.08 * r * (f - 0.5);
      const zWave = Math.sin(t * 4 + b) * 0.06 * r;
      pts.push(new THREE.Vector3(Math.sin(ang) * rad + bend, Math.cos(ang) * rad, zWave));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.028 * r * (1 - 0.35 * Math.abs(f - 0.5)), 5, false);
    const vm = new THREE.Mesh(tubeGeo, veinMat);
    vm.castShadow = true;
    g.add(vm);
  }

  const discGeo = new THREE.CircleGeometry(r * 0.96, 24, -Math.PI * 0.06, Math.PI * 1.12);
  const pos = discGeo.attributes.position;
  const cols = [];
  for (let i = 0; i < pos.count; i++) {
    let vx = pos.getX(i), vy = pos.getY(i);
    const d = Math.hypot(vx, vy) / r;
    const a = Math.atan2(vy, vx);
    const scallop = 1 - 0.12 * Math.pow(Math.sin(a * 9), 2) * d;
    vx *= scallop;
    vy *= scallop;
    const vz = Math.sin(vx * 5.4) * 0.065 + Math.cos(vy * 6.0) * 0.05;
    pos.setXYZ(i, vx, vy, vz);
    const c = cBase.clone().lerp(cEdge, Math.min(1, d * 1.1));
    cols.push(c.r, c.g, c.b);
  }
  discGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  discGeo.computeVertexNormals();

  const blade = new THREE.Mesh(discGeo, fanMat);
  blade.castShadow = true;
  g.add(blade);

  g.position.set(x, y, z);
  g.rotation.y = rotY;
  g.rotation.z = tiltZ;
  worldGroup.add(g);
  fans.push({ mesh: g, ph: rand(0, 6.28), baseY: rotY });
  regTap(g, x, y + r * 0.55, z, Math.max(1.35, r * 1.15), { name: 'sea fan', x, y: y + r * 0.55, z });
  return g;
}

// 5. Ribbed Tube Sponge Clusters
function sponges(x, y, z, count, colA = PAL.spongeYellow, colB = PAL.spongeOrange) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const h = rand(0.75, 1.62), r = rand(0.14, 0.24);
    const geo = new THREE.CylinderGeometry(r * 0.92, r * 1.08, h, 14, 10, true);
    const pos = geo.attributes.position;
    for (let k = 0; k < pos.count; k++) {
      let vx = pos.getX(k), vy = pos.getY(k), vz = pos.getZ(k);
      const a = Math.atan2(vz, vx);
      const rib = 1 + 0.11 * Math.sin(vy * 14) + 0.06 * Math.cos(a * 7);
      pos.setXYZ(k, vx * rib, vy, vz * rib);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: i % 2 === 0 ? colA : colB, roughness: 0.74, side: THREE.DoubleSide
    });
    const m = new THREE.Mesh(geo, mat);
    const a = (i / count) * Math.PI * 2 + rand(-0.3, 0.3);
    const rr = i === 0 ? 0 : rand(0.18, 0.45);
    m.position.set(x + Math.cos(a) * rr, y + h * 0.46, z + Math.sin(a) * rr);
    m.rotation.set(rand(-0.16, 0.16), rand(0, 3.14), rand(-0.16, 0.16));
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  }
  worldGroup.add(g);
  regTap(g, x, y + 0.85, z, 1.38, { name: 'sponges', x, y: y + 0.85, z });
  return g;
}

// 6. Sea Anemone with Glowing Bulb Tentacles
const tentacles = [];
function anemone(x, y, z, tentacleHex = PAL.anemoneGreen, scale = 1) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42 * scale, 0.52 * scale, 0.36 * scale, 14),
    new THREE.MeshStandardMaterial({ color: PAL.anemoneSkirt, roughness: 0.8 })
  );
  base.position.set(x, y + 0.16 * scale, z);
  base.castShadow = true;
  g.add(base);

  const tMat = new THREE.MeshStandardMaterial({
    color: tentacleHex, roughness: 0.48, emissive: tentacleHex, emissiveIntensity: 0.12
  });
  const tipMat = new THREE.MeshStandardMaterial({
    color: PAL.anemoneBulb, roughness: 0.32, emissive: PAL.anemoneBulb, emissiveIntensity: 0.3
  });

  const count = 26;
  for (let i = 0; i < count; i++) {
    const ring = i < 10 ? 0 : (i < 20 ? 1 : 2);
    const a = (i / count) * Math.PI * 2 + ring * 0.5;
    const rr = (0.08 + ring * 0.12) * scale;
    const h = rand(0.55, 0.82) * scale;

    const pivot = new THREE.Group();
    pivot.position.set(x + Math.cos(a) * rr, y + 0.30 * scale, z + Math.sin(a) * rr);

    const tGeo = new THREE.ConeGeometry(0.055 * scale, h, 7);
    tGeo.translate(0, h * 0.5, 0);
    const tMesh = new THREE.Mesh(tGeo, tMat);
    tMesh.castShadow = true;
    pivot.add(tMesh);

    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.048 * scale, 8, 6), tipMat);
    tip.position.set(0, h * 0.92, 0);
    pivot.add(tip);

    const outTilt = 0.15 + ring * 0.16;
    const bx = Math.sin(a) * outTilt;
    const bz = -Math.cos(a) * outTilt;
    pivot.rotation.set(bx, 0, bz);
    g.add(pivot);
    tentacles.push({ mesh: pivot, ph: rand(0, 6.28), bx, bz });
  }
  worldGroup.add(g);
  regTap(g, x, y + 0.65 * scale, z, 1.38 * scale, { name: 'anemone', x, y: y + 0.65 * scale, z });
  return g;
}

// 7. Giant Reef Clams (Tridacna)
const clams = [];
function giantClam(x, y, z, mantleHex, scale = 1, rotY = 0) {
  const g = new THREE.Group();
  const shellMat = new THREE.MeshStandardMaterial({ color: PAL.clamShell, roughness: 0.84 });
  const mantleMat = new THREE.MeshStandardMaterial({
    color: mantleHex, roughness: 0.38, emissive: mantleHex, emissiveIntensity: 0.18
  });

  function makeValve(side) {
    const vg = new THREE.Group();
    const sGeo = new THREE.SphereGeometry(0.44 * scale, 14, 10, 0, Math.PI, 0, Math.PI * 0.58);
    const pos = sGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
      const a = Math.atan2(vy, vx);
      const flute = 1 + 0.12 * Math.sin(a * 9);
      pos.setXYZ(i, vx * 1.25, vy * flute, vz * 0.65 * flute);
    }
    sGeo.computeVertexNormals();
    const sm = new THREE.Mesh(sGeo, shellMat);
    sm.rotation.x = -Math.PI * 0.35;
    sm.castShadow = true;
    vg.add(sm);
    vg.rotation.y = side > 0 ? 0 : Math.PI;
    return vg;
  }

  const left = makeValve(1);
  const right = makeValve(-1);
  g.add(left, right);

  const mantle = new THREE.Mesh(new THREE.SphereGeometry(0.32 * scale, 12, 8), mantleMat);
  mantle.scale.set(1.4, 0.55, 0.62);
  mantle.position.y = 0.15 * scale;
  g.add(mantle);

  g.position.set(x, y, z);
  g.rotation.y = rotY;
  worldGroup.add(g);
  clams.push({ left, right, ph: rand(0, 6.28) });
  regTap(g, x, y + 0.35 * scale, z, 1.25 * scale, { name: 'giant clam', x, y: y + 0.35 * scale, z });
  return g;
}

    rays.push({ mesh: m, ph: rand(0, 6.28), op: rand(0.055, 0.105) });
  }
}

// ---------- Suspended Plankton / Marine Snow ----------
const SNOW = 110;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW * 3);
const snowDat = [];
for (let i = 0; i < SNOW; i++) {
  const r = rand(0.3, BASE_R * 0.92);
  const a = rand(0, Math.PI * 2);
  const x = Math.cos(a) * r;
  const y = rand(0.3, 8.1);
  const z = Math.sin(a) * r;
  snowPos[i * 3] = x;
  snowPos[i * 3 + 1] = y;
  snowPos[i * 3 + 2] = z;
  snowDat.push({ x, y, z, speed: rand(0.16, 0.34), ph: rand(0, 6.28) });
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({
  map: planktonTex,
  color: 0xe2ffff,
  size: 0.14,
  transparent: true,
  opacity: 0.72,
  depthWrite: false,
  blending: THREE.AdditiveBlending
}));
worldGroup.add(snow);

// ---------- Rising Reef Bubbles (Capped Below Header Ceiling) ----------
const BUBBLES = 34;
const bubGeo = new THREE.BufferGeometry();
const bubPos = new Float32Array(BUBBLES * 3);
const bubDat = [];
const VENTS = [
  [-1.22, 2.55, -0.32],
  [0.68, 1.28, 1.20],
  [-0.98, 0.50, -2.45],
  [1.18, 0.45, 2.52],
  [0.12, 5.95, -0.08]
];
for (let i = 0; i < BUBBLES; i++) {
  const v = VENTS[i % VENTS.length];
  bubDat.push({
    x: v[0] + rand(-0.2, 0.2),
    baseY: v[1],
    z: v[2] + rand(-0.2, 0.2),
    span: 8.25 - v[1],
    speed: rand(0.75, 1.35),
    offset: rand(0, 10),
    ph: rand(0, 6.28)
  });
}
bubGeo.setAttribute('position', new THREE.BufferAttribute(bubPos, 3));
const bubbles = new THREE.Points(bubGeo, new THREE.PointsMaterial({
  map: bubbleTex,
  color: 0xffffff,
  size: 0.22,
  transparent: true,
  opacity: 0.88,
  depthWrite: false
}));
worldGroup.add(bubbles);

// ---------- High-Contrast Reef Fish Silhouettes (Readable Even at 320px) ----------
function makeReefFish(species, s = 1) {
  const g = new THREE.Group();
  let bodyCol = PAL.tangBlue, finCol = PAL.tangYellow, bandCol = 0xffffff;
  let sx = 1.48, sy = 0.98, sz = 0.44;

  if (species === 'yellowTang') {
    bodyCol = PAL.tangYellow; finCol = 0xfff08a; bandCol = 0xffffff;
    sx = 1.28; sy = 1.18; sz = 0.38;
  } else if (species === 'anthias') {
    bodyCol = PAL.anthiasCoral; finCol = PAL.anthiasMagenta; bandCol = 0xffe268;
    sx = 1.56; sy = 0.82; sz = 0.44;
  } else if (species === 'chromis') {
    bodyCol = PAL.chromisCyan; finCol = 0xb8fff9; bandCol = 0xffffff;
    sx = 1.40; sy = 0.86; sz = 0.42;
  } else if (species === 'clown') {
    bodyCol = PAL.clownOrange; finCol = 0xffffff; bandCol = 0xffffff;
    sx = 1.38; sy = 0.90; sz = 0.52;
  }

  // Slight emissive boost so fish stand out crisply against deep water & shadows at 320px
  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyCol, roughness: 0.34, metalness: 0.06,
    emissive: bodyCol, emissiveIntensity: 0.15
  });
  const finMat = new THREE.MeshStandardMaterial({
    color: finCol, roughness: 0.40, side: THREE.DoubleSide,
    emissive: finCol, emissiveIntensity: 0.18
  });
  const stripeMat = new THREE.MeshStandardMaterial({
    color: bandCol, roughness: 0.35, emissive: bandCol, emissiveIntensity: 0.15
  });

  const bodyGeo = new THREE.SphereGeometry(0.22 * s, 12, 10);
  const bPos = bodyGeo.attributes.position;
  for (let i = 0; i < bPos.count; i++) {
    let vx = bPos.getX(i), vy = bPos.getY(i), vz = bPos.getZ(i);
    const taper = vx < 0 ? (1 + vx / (0.29 * s) * 0.45) : (1 - vx / (0.29 * s) * 0.15);
    bPos.setXYZ(i, vx * sx, vy * sy * Math.max(0.25, taper), vz * sz * Math.max(0.2, taper));
  }
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  g.add(body);

  // Contrasting markings for high visibility
  if (species === 'clown') {
    for (const bx of [0.06 * s, -0.09 * s]) {
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.17 * s, 0.17 * s, 0.06 * s, 10), stripeMat);
      band.rotation.z = Math.PI / 2;
      band.scale.set(1.06, 1, 0.56);
      band.position.x = bx;
      g.add(band);
    }
  } else if (species === 'blueTang') {
    const constflash = new THREE.Mesh(new THREE.SphereGeometry(0.11 * s, 8, 6), finMat);
    constflash.scale.set(1.3, 0.65, 0.92);
    constflash.position.set(-0.08 * s, 0, 0);
    g.add(constflash);
  }

  // Swept dorsal & ventral fins
  const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.115 * s, 0.29 * s, 4), finMat);
  dorsal.position.set(-0.04 * s, 0.20 * s * sy, 0);
  dorsal.rotation.z = 0.55;
  dorsal.scale.z = 0.26;
  g.add(dorsal);

  const ventral = new THREE.Mesh(new THREE.ConeGeometry(0.085 * s, 0.21 * s, 4), finMat);
  ventral.position.set(-0.06 * s, -0.17 * s * sy, 0);
  ventral.rotation.z = 2.55;
  ventral.scale.z = 0.26;
  g.add(ventral);

  // Forked Caudal Tail on Pivot
  const tailPivot = new THREE.Group();
  tailPivot.position.x = -0.26 * s * sx;
  const upperLobe = new THREE.Mesh(new THREE.ConeGeometry(0.095 * s, 0.25 * s, 4), finMat);
  upperLobe.position.set(-0.085 * s, 0.065 * s, 0);
  upperLobe.rotation.z = Math.PI * 0.36;
  upperLobe.scale.z = 0.26;
  const lowerLobe = new THREE.Mesh(new THREE.ConeGeometry(0.09 * s, 0.23 * s, 4), finMat);
  lowerLobe.position.set(-0.085 * s, -0.065 * s, 0);
  lowerLobe.rotation.z = Math.PI * 0.64;
  lowerLobe.scale.z = 0.26;
  tailPivot.add(upperLobe, lowerLobe);
  g.add(tailPivot);

  // Crisp Eyes
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x09111a });
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.03 * s, 6, 6), eyeMat);
    eye.position.set(0.165 * s * sx, 0.04 * s, side * 0.078 * s);
    const ring = new THREE.Mesh(new THREE.SphereGeometry(0.039 * s, 6, 6), ringMat);
    ring.scale.z = 0.5;
    ring.position.set(0.16 * s * sx, 0.04 * s, side * 0.071 * s);
    g.add(ring, eye);
  }

  g.userData.tail = tailPivot;
  return g;
}

// Coordinated 18-Fish Reef School
const school = [];
const SCHOOL_SPECIES = ['yellowTang', 'blueTang', 'anthias', 'chromis'];
const SCHOOL_N = 18;
for (let i = 0; i < SCHOOL_N; i++) {
  const sp = SCHOOL_SPECIES[i % SCHOOL_SPECIES.length];
  const f = makeReefFish(sp, rand(1.02, 1.38));
  worldGroup.add(f);
  const homeY = rand(1.6, 6.2);
  const maxHomeR = homeY > 4.2 ? 1.55 : 2.35;
  school.push({
    mesh: f,
    home: new THREE.Vector3(rand(-maxHomeR, maxHomeR), homeY, rand(-maxHomeR, maxHomeR)),
    center: new THREE.Vector3(),
    r: rand(1.50, 2.55),
    callR: rand(0.75, 1.35),
    callYOff: rand(-0.42, 0.52),
    speed: rand(0.44, 0.72) * (i % 2 ? 1 : -1),
    ph: rand(0, 6.28),
    bobPh: rand(0, 6.28)
  });
  school[i].center.copy(school[i].home);
}

// Pair of Clownfish Tending the Hero Anemone
const clowns = [];
for (let i = 0; i < 2; i++) {
  const f = makeReefFish('clown', 0.76 + i * 0.12);
  worldGroup.add(f);
  clowns.push({ mesh: f, ph: i * 3.14, speed: 1.05 + i * 0.25 });
}

// ---------- Subtle Coral Call Ripple Ring ----------
const pulseRingGeo = new THREE.RingGeometry(0.24, 0.36, 32);
pulseRingGeo.rotateX(-Math.PI / 2);
const pulseRingMat = new THREE.MeshBasicMaterial({
  color: 0xa8fff9, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
});
const pulseRing = new THREE.Mesh(pulseRingGeo, pulseRingMat);
worldGroup.add(pulseRing);
let pulseStartTime = -99999;

// ---------- Hints & Wall-Clock State (performance.now()) ----------
const HINTS = {
  idle: 'Tap a coral to call the school',
  call: 'The school comes to look',
  auto: 'The reef goes about its day'
};
let hintFadeStart = performance.now();
function setHint(s, now = performance.now()) {
  hintEl.textContent = HINTS[s];
  hintEl.classList.remove('faded');
  hintFadeStart = now;
}
setHint('idle', performance.now());

let callTarget = null;
let callStartTime = -1; // wall-clock timestamp in ms
const CALL_DURATION_MS = 7000; // exact 7 seconds
let nextAutoTime = performance.now() + 14000;

// ---------- Responsive Camera Framing (All Viewports & Portrait 320x700 / 390x844 / 616x562) ----------
const SCENE_Y_MIN = -SLAB_H - 0.12; // -2.47
const SCENE_Y_MAX = 8.38;           // top of bubbles & crown staghorn
const FIT_CENTER = new THREE.Vector3(0, (SCENE_Y_MIN + SCENE_Y_MAX) * 0.5, 0);

const FIT_PTS = [];
// Base slab perimeter
for (let a = 0; a < 8; a++) {
  const ang = (a / 8) * Math.PI * 2;
  const r = BASE_R * 1.04;
  FIT_PTS.push(new THREE.Vector3(Math.cos(ang) * r, SCENE_Y_MIN, Math.sin(ang) * r));
  FIT_PTS.push(new THREE.Vector3(Math.cos(ang) * r, 0.6, Math.sin(ang) * r));
}
// Mid-reef fish & sea fan envelope
for (let a = 0; a < 8; a++) {
  const ang = (a / 8) * Math.PI * 2;
  const r = 4.25;
  FIT_PTS.push(new THREE.Vector3(Math.cos(ang) * r, 3.8, Math.sin(ang) * r));
}
// Upper pinnacle crown & bubble apex
for (let a = 0; a < 8; a++) {
  const ang = (a / 8) * Math.PI * 2;
  const r = 2.85;
  FIT_PTS.push(new THREE.Vector3(Math.cos(ang) * r, SCENE_Y_MAX, Math.sin(ang) * r));
}

function pickFov() {
  const a = window.innerWidth / window.innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 44 : 50);
  camera.aspect = a;
  camera.updateProjectionMatrix();
}

function fitDir() {
  const a = window.innerWidth / window.innerHeight;
  if (a < 0.62) return new THREE.Vector3(0.16, 0.22, 1).normalize();
  if (a < 0.9) return new THREE.Vector3(0.36, 0.26, 1).normalize();
  return new THREE.Vector3(0.54, 0.28, 1).normalize();
}

function getSafeFrustumFactors() {
  const h = Math.max(1, window.innerHeight);
  const headerBottom = headerEl ? headerEl.getBoundingClientRect().bottom : 84;
  const footerTop = footerEl ? footerEl.getBoundingClientRect().top : (h - 36);

  const topPadPx = Math.max(headerBottom + 12, h * 0.115);
  const botPadPx = Math.max((h - footerTop) + 12, h * 0.065);

  const usableTopFrac = Math.max(0.32, 1 - (topPadPx / (h * 0.5)));
  const usableBotFrac = Math.max(0.38, 1 - (botPadPx / (h * 0.5)));
  const usableSideFrac = 0.93;
  return { usableTopFrac, usableBotFrac, usableSideFrac };
}

const _rel = new THREE.Vector3();
function requiredDistance(right, up, fwd, target) {
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const halfTanV = Math.tan(fovV / 2);
  const halfTanH = halfTanV * camera.aspect;
  const { usableTopFrac, usableBotFrac, usableSideFrac } = getSafeFrustumFactors();

  const tanTop = halfTanV * usableTopFrac;
  const tanBot = halfTanV * usableBotFrac;
  const tanSide = halfTanH * usableSideFrac;

  let d = 5.5;
  for (let i = 0; i < FIT_PTS.length; i++) {
    _rel.copy(FIT_PTS[i]).sub(target);
    const cf = _rel.dot(fwd);
    const rx = Math.abs(_rel.dot(right));
    const ry = _rel.dot(up);

    const dHoriz = rx / tanSide - cf;
    const dVert = (ry >= 0 ? (ry / tanTop) : (-ry / tanBot)) - cf;
    if (dHoriz > d) d = dHoriz;
    if (dVert > d) d = dVert;
  }
  return d;
}

function frameInitialCamera() {
  pickFov();
  const fd = fitDir();
  const fwd = fd.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();

  const { usableTopFrac, usableBotFrac } = getSafeFrustumFactors();
  const biasY = (usableBotFrac - usableTopFrac) * 0.82;
  const target = FIT_CENTER.clone();
  target.y += biasY;

  const dist = requiredDistance(right, up, fwd, target) * 1.025;
  camera.position.copy(target).addScaledVector(fd, dist);
  controls.target.copy(target);
  camera.updateProjectionMatrix();
  controls.update();
}
frameInitialCamera();

// ---------- Tap Handling (Fat Hit Targets, Drag-vs-Tap Discrimination) ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX;
  downY = e.clientY;
  downT = performance.now();
});

renderer.domElement.addEventListener('pointerup', e => {
  const now = performance.now();
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8 || now - downT > 480) return;

  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(tapTargets, false);
  if (!hits.length) return;

  const c = hits[0].object.userData.coral;
  const callY = Math.min(7.1, Math.max(1.2, (c.y !== undefined ? c.y : 1.6) + 0.35));
  callTarget = new THREE.Vector3(c.x, callY, c.z);
  callStartTime = now;
  pulseRing.position.set(c.x, Math.max(0.25, callY - 0.35), c.z);
  pulseStartTime = now;
  setHint('call', now);
});

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  frameInitialCamera();
});

// ---------- Wall-Clock Animation Loop (performance.now()) ----------
let prevNow = performance.now();

function animate(now = performance.now()) {
  requestAnimationFrame(animate);

  const elapsedMs = Math.min(50, Math.max(1, now - prevNow));
  prevNow = now;
  const dt = elapsedMs * 0.001;
  const t = now * 0.001;

  // Hint fade driven by wall-clock
  if (!hintEl.classList.contains('faded') && now - hintFadeStart > 6000) {
    hintEl.classList.add('faded');
  }

  // School call lifecycle (exact 7000ms wall-clock) + automatic reef ballet
  if (callStartTime >= 0) {
    if (now - callStartTime > CALL_DURATION_MS) {
      callStartTime = -1;
      callTarget = null;
      nextAutoTime = now + rand(16000, 24000);
      setHint('idle', now);
    }
  } else if (now >= nextAutoTime) {
    nextAutoTime = now + rand(16000, 24000);
    const chosen = tapTargets[Math.floor(rand(0, tapTargets.length))].userData.coral;
    const callY = Math.min(7.1, Math.max(1.2, (chosen.y !== undefined ? chosen.y : 1.6) + 0.35));
    callTarget = new THREE.Vector3(chosen.x, callY, chosen.z);
    callStartTime = now;
    setHint('auto', now);
  }

  // Tap pulse ring animation
  const pulseAge = (now - pulseStartTime) * 0.001;
  if (pulseAge >= 0 && pulseAge < 1.35) {
    const k = pulseAge / 1.35;
    const s = 1 + k * 4.2;
    pulseRing.scale.set(s, 1, s);
    pulseRingMat.opacity = (1 - k) * 0.68;
  } else {
    pulseRingMat.opacity = 0;
  }

  // Coordinated fish school swim & tight coral swirl
  const lerpAlpha = 1 - Math.exp(-(callTarget ? 2.5 : 0.78) * dt);
  for (let i = 0; i < school.length; i++) {
    const f = school[i];
    const want = callTarget
      ? new THREE.Vector3(callTarget.x, Math.min(7.5, Math.max(1.1, callTarget.y + f.callYOff)), callTarget.z)
      : f.home;
    f.center.lerp(want, lerpAlpha);

    const r = callTarget ? f.callR : f.r;
    const swirlBoost = callTarget ? 1.85 : 1.0;
    const a = t * f.speed * swirlBoost + f.ph;

    const x = f.center.x + Math.cos(a) * r;
    const z = f.center.z + Math.sin(a) * r;
    const y = Math.min(8.05, Math.max(0.85, f.center.y + Math.sin(t * 1.6 + f.bobPh) * 0.22));

    const dx = -Math.sin(a) * f.speed;
    const dz = Math.cos(a) * f.speed;

    f.mesh.position.set(x, y, z);
    f.mesh.rotation.y = Math.atan2(dx, dz) - Math.PI / 2 + (f.speed < 0 ? Math.PI : 0);
    f.mesh.rotation.z = Math.sin(t * 1.6 + f.bobPh) * 0.08;
    f.mesh.userData.tail.rotation.y = Math.sin(t * (callTarget ? 11.5 : 8.0) + f.ph) * 0.48;
  }

  // Clownfish pair darting around the Hero Anemone
  for (let i = 0; i < clowns.length; i++) {
    const c = clowns[i];
    const a = t * c.speed + c.ph;
    const rad = 0.66 + 0.12 * Math.sin(t * 1.3 + c.ph);
    c.mesh.position.set(
      HERO_ANEMONE_POS.x + Math.cos(a) * rad,
      HERO_ANEMONE_POS.y + 0.55 + Math.sin(t * 2.2 + c.ph) * 0.14,
      HERO_ANEMONE_POS.z + Math.sin(a) * rad
    );
    c.mesh.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) - Math.PI / 2;
    c.mesh.userData.tail.rotation.y = Math.sin(t * 9.5 + c.ph) * 0.52;
  }

  // Sea grasses, gorgonian fans, anemone tentacles & giant clams
  for (let i = 0; i < weeds.length; i++) {
    const w = weeds[i];
    w.grp.rotation.z = Math.sin(t * 1.25 + w.ph) * 0.11;
    w.grp.rotation.x = Math.cos(t * 0.95 + w.ph) * 0.06;
  }
  for (let i = 0; i < fans.length; i++) {
    const fn = fans[i];
    fn.mesh.rotation.y = fn.baseY + Math.sin(t * 0.95 + fn.ph) * 0.13;
  }
  for (let i = 0; i < tentacles.length; i++) {
    const tn = tentacles[i];
    tn.mesh.rotation.x = tn.bx + Math.sin(t * 1.85 + tn.ph) * 0.16;
    tn.mesh.rotation.z = tn.bz + Math.cos(t * 1.55 + tn.ph) * 0.16;
  }
  for (let i = 0; i < clams.length; i++) {
    const cl = clams[i];
    const gape = 0.08 * Math.sin(t * 0.8 + cl.ph);
    cl.left.rotation.x = gape;
    cl.right.rotation.x = gape;
  }

  // Animated Caustics & God-Ray Shafts
  causticTex.offset.x = (t * 0.035) % 1;
  causticTex.offset.y = (t * 0.024) % 1;
  causticMat.opacity = 0.23 + 0.05 * Math.sin(t * 1.7);

  for (let i = 0; i < rays.length; i++) {
    const r = rays[i];
    r.mesh.material.opacity = r.op * (0.72 + 0.28 * Math.sin(t * 0.75 + r.ph));
    r.mesh.rotation.y = r.ph + t * 0.025;
  }

  // Marine snow (wall-clock position)
  for (let i = 0; i < SNOW; i++) {
    const sd = snowDat[i];
    const curY = 0.25 + ((sd.y - t * sd.speed) % 7.8 + 7.8) % 7.8;
    snowPos[i * 3] = sd.x + Math.sin(t * 0.55 + sd.ph) * 0.18;
    snowPos[i * 3 + 1] = curY;
    snowPos[i * 3 + 2] = sd.z + Math.cos(t * 0.48 + sd.ph) * 0.18;
  }
  snowGeo.attributes.position.needsUpdate = true;

  // Bubbles rise with helical wobble (strictly capped below header ceiling y <= 8.25)
  for (let i = 0; i < BUBBLES; i++) {
    const b = bubDat[i];
    const progress = (t * b.speed + b.offset) % b.span;
    const curY = b.baseY + progress;
    bubPos[i * 3] = b.x + Math.sin(t * 2.6 + b.ph) * 0.12;
    bubPos[i * 3 + 1] = curY;
    bubPos[i * 3 + 2] = b.z + Math.cos(t * 2.3 + b.ph) * 0.12;
  }
  bubGeo.attributes.position.needsUpdate = true;

  // Dynamic containment floor so user orbit never clips into the reef
  {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    const rgt = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    const up2 = new THREE.Vector3().crossVectors(rgt, fwd).normalize();
    controls.minDistance = Math.min(requiredDistance(rgt, up2, fwd, controls.target) * 0.98, 26);
  }

  controls.update();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
