<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Thunderstorm Cell - Tiny Worlds</title>
<meta name="description" content="One dark cloud over an empty plain. Steer the storm by dragging it, tap the cloud to drop lightning, and rain slowly fills the pond below."/>
<style>
  html,body{margin:0;height:100%;background:#10151d;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #app{position:fixed;inset:0;touch-action:none}
  .hud{position:fixed;left:0;right:0;pointer-events:none;color:#e4e9f0;text-align:center;z-index:2}
  .hud.top{top:max(14px,env(safe-area-inset-top))}
  .hud h1{font-size:15px;font-weight:650;letter-spacing:.02em;margin:0;opacity:.95}
  .hud p{font-size:11.5px;margin:4px 0 0;opacity:.55}
  .hud.bottom{bottom:max(14px,env(safe-area-inset-bottom));font-size:11.5px;opacity:.6;transition:opacity 1s}
  .hud.bottom.gone{opacity:0}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.5) 100%);z-index:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div class="hud top"><h1>Thunderstorm Cell</h1><p>a tiny world, one of fifty</p></div>
<div class="hud bottom" id="hint">Drag the cloud to steer it. Tap it for lightning.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10151d);
scene.fog = new THREE.Fog(0x10151d, 24, 55);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, .1, 120);
camera.position.set(10.5, 8, 10.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 7; controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * .47;

scene.add(new THREE.HemisphereLight(0x7d8ba0, 0x131a14, .8));
const key = new THREE.DirectionalLight(0xb9c6d8, .8);
key.position.set(6, 11, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
scene.add(key);
const flash = new THREE.PointLight(0xcfe2ff, 0, 26, 1.4);
flash.position.set(0, 4, 0);
scene.add(flash);

// cutaway base: grass, soil, clay
const top = new THREE.Mesh(new THREE.BoxGeometry(10, .7, 10), new THREE.MeshStandardMaterial({ color:0x51683b, roughness:1 }));
top.position.y = -.35; top.receiveShadow = true; scene.add(top);
const soil = new THREE.Mesh(new THREE.BoxGeometry(10, 1.6, 10), new THREE.MeshStandardMaterial({ color:0x4a3826, roughness:1 }));
soil.position.y = -1.5; scene.add(soil);

// pond: a dip in the plain that rain fills
const pondMat = new THREE.MeshStandardMaterial({ color:0x2c5a74, roughness:.25, metalness:.2 });
const pond = new THREE.Mesh(new THREE.CircleGeometry(1, 24), pondMat);
pond.rotation.x = -Math.PI/2;
pond.position.set(2.2, .02, 1.6);
pond.scale.setScalar(.45);
scene.add(pond);
let pondFill = .45;

// a few tufts of grass and one lonely tree
const tuftMat = new THREE.MeshStandardMaterial({ color:0x65824a, roughness:1, flatShading:true });
for (let i = 0; i < 18; i++){
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(.09, .3, 4), tuftMat);
  const a = Math.random()*Math.PI*2, r = 1 + Math.random()*3.6;
  tuft.position.set(Math.cos(a)*r, .15, Math.sin(a)*r);
  scene.add(tuft);
}
const tree = new THREE.Group();
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.09, .13, 1.1, 6), new THREE.MeshStandardMaterial({ color:0x4c3a28, roughness:1 }));
trunk.position.y = .55; trunk.castShadow = true; tree.add(trunk);
const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(.62, 0), new THREE.MeshStandardMaterial({ color:0x3f6134, roughness:1, flatShading:true }));
crown.position.y = 1.45; crown.castShadow = true; tree.add(crown);
tree.position.set(-2.8, 0, -1.8);
scene.add(tree);

// the storm cloud
const cloud = new THREE.Group();
const puffMat = new THREE.MeshStandardMaterial({ color:0x39424f, roughness:1, flatShading:true });
const puffDark = new THREE.MeshStandardMaterial({ color:0x262d38, roughness:1, flatShading:true });
[[0,0,0,1.15],[1.1,.12,.2,.85],[-1.05,.1,-.15,.9],[.4,.4,-.5,.75],[-.45,.42,.4,.7],[.1,-.18,.6,.8]].forEach(([x,y,z,s], i) => {
  const p = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 1), i % 2 ? puffDark : puffMat);
  p.position.set(x, y, z);
  p.castShadow = true;
  cloud.add(p);
});
cloud.position.set(-1, 4.6, .5);
scene.add(cloud);

// lightning bolt (jagged line), hidden until strike
const boltMat = new THREE.LineBasicMaterial({ color:0xeaf4ff, transparent:true, opacity:0 });
const boltGeo = new THREE.BufferGeometry();
const bolt = new THREE.Line(boltGeo, boltMat);
scene.add(bolt);
let boltT = 1e9;

// rain
const RMAX = 420;
const rGeo = new THREE.BufferGeometry();
const rPos = new Float32Array(RMAX * 3);
rPos.fill(-80);
rGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
const rain = new THREE.Points(rGeo, new THREE.PointsMaterial({ color:0x9fb8d8, size:.07, transparent:true, opacity:.75, depthWrite:false }));
scene.add(rain);
const drops = [];
let raining = 0; // seconds of rain left

const hint = document.getElementById('hint');
setTimeout(() => hint.classList.add('gone'), 8000);

function strike(){
  // build a jagged bolt from cloud to ground
  const pts = [];
  let x = cloud.position.x + (Math.random()-.5)*.8, z = cloud.position.z + (Math.random()-.5)*.8;
  const yTop = cloud.position.y - .5;
  const steps = 8;
  for (let i = 0; i <= steps; i++){
    const y = yTop * (1 - i/steps);
    pts.push(new THREE.Vector3(x + (Math.random()-.5)*.5 * (i/steps+.2), y, z + (Math.random()-.5)*.5 * (i/steps+.2)));
  }
  boltGeo.setFromPoints(pts);
  boltT = 0;
  flash.position.set(x, 2.2, z);
  raining = Math.min(raining + 5, 9);
}

// drag the cloud / tap it
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -4.6);
let downAt = null, draggingCloud = false;
renderer.domElement.addEventListener('pointerdown', e => {
  downAt = { x:e.clientX, y:e.clientY, t:performance.now() };
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(cloud.children, false);
  if (hits.length){
    draggingCloud = true;
    controls.enabled = false;
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!draggingCloud) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const pt = new THREE.Vector3();
  if (ray.ray.intersectPlane(dragPlane, pt)){
    cloud.position.x = THREE.MathUtils.clamp(pt.x, -4.4, 4.4);
    cloud.position.z = THREE.MathUtils.clamp(pt.z, -4.4, 4.4);
  }
});
addEventListener('pointerup', e => {
  const wasDrag = draggingCloud;
  draggingCloud = false;
  controls.enabled = true;
  if (!downAt) return;
  const moved = Math.hypot((e.clientX ?? 0) - downAt.x, (e.clientY ?? 0) - downAt.y);
  const dt = performance.now() - downAt.t;
  downAt = null;
  if (wasDrag && moved <= 8 && dt < 500) strike();
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  controls.update();

  // cloud idles with a slow drift and bob
  cloud.position.y = 4.6 + Math.sin(t * .8) * .15;
  if (!draggingCloud) cloud.position.x += Math.sin(t * .21) * dt * .35;
  cloud.rotation.y = Math.sin(t * .3) * .06;

  // lightning flash decay
  boltT += dt;
  const k = boltT < .55 ? Math.max(0, 1 - boltT / .55) : 0;
  boltMat.opacity = k * (0.6 + Math.random() * .4);
  flash.intensity = k * 90;

  // rain
  if (raining > 0){
    raining -= dt;
    for (let i = 0; i < 10 && drops.length < RMAX; i++){
      drops.push({
        x: cloud.position.x + (Math.random()-.5) * 2.4,
        y: cloud.position.y - .6,
        z: cloud.position.z + (Math.random()-.5) * 2.4,
        v: 7 + Math.random() * 3
      });
    }
    pondFill = Math.min(pondFill + dt * .03, 1.15);
  }
  const ra = rGeo.attributes.position.array;
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.y -= d.v * dt;
    if (d.y <= .05){ drops.splice(i, 1); continue; }
    ra[i*3] = d.x; ra[i*3+1] = d.y; ra[i*3+2] = d.z;
  }
  for (let i = drops.length; i < RMAX; i++){ ra[i*3+1] = -80; }
  rGeo.attributes.position.needsUpdate = true;

  // pond rises
  pond.scale.setScalar(pondFill);
  pondMat.color.setHSL(.55, .45, .28 + pondFill * .1);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
