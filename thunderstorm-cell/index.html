<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thunderstorm cell — a tiny world</title>
  <style>
    :root {
      --bg-top: #374a62;
      --bg-mid: #5c7691;
      --bg-bot: #adc0ce;
      --text-main: #f7fafc;
      --text-sub: #d7e3ec;
      --accent: #ffe082;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 54%, var(--bg-bot) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    canvas.pointer-hover {
      cursor: pointer;
    }
    .hud-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 8px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(180deg, rgba(22, 32, 44, 0.58) 0%, rgba(22, 32, 44, 0.24) 72%, rgba(22, 32, 44, 0) 100%);
    }
    .title {
      font-size: clamp(1.1rem, 3.6vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(10, 18, 28, 0.55);
    }
    .subtitle {
      font-size: clamp(0.75rem, 2.3vw, 0.88rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 2px;
      text-shadow: 0 1px 6px rgba(10, 18, 28, 0.6);
    }
    .hint {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 10px;
      font-size: clamp(0.68rem, 2.1vw, 0.78rem);
      font-weight: 500;
      color: #eef5fa;
      background: rgba(20, 32, 46, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }
    .hud-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 16px 10px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(245, 250, 255, 0.85);
      text-shadow: 0 1px 4px rgba(15, 25, 36, 0.65);
      background: linear-gradient(0deg, rgba(22, 32, 44, 0.42) 0%, rgba(22, 32, 44, 0) 100%);
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 20px;
      z-index: 100;
      background: rgba(22, 30, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="hud-header" id="hud-header">
    <h1 class="title">Thunderstorm cell</h1>
    <div class="subtitle">a tiny world</div>
    <div class="hint">tap the cloud for lightning - tap the pond to splash</div>
  </header>

  <div id="canvas-container"></div>

  <footer class="hud-footer" id="hud-footer">A tiny world</footer>

  <div id="fallback">
    <h2>WebGL Required</h2>
    <p>Unable to initialize the 3D miniature view on this device or browser.</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261103)
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261103);
    const randRange = (min, max) => min + (max - min) * rand();

    const container = document.getElementById('canvas-container');
    const fallbackEl = document.getElementById('fallback');
    const headerEl = document.getElementById('hud-header');
    const footerEl = document.getElementById('hud-footer');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: true });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x7d95ad, 0.0085);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(38);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(74);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-55);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(55);

    const worldRoot = new THREE.Group();
    scene.add(worldRoot);

    // --- LIGHTING (Dramatic sun break + bright readable cloud + fill) ---
    const hemiLight = new THREE.HemisphereLight(0xeef6ff, 0x627c54, 1.38);
    scene.add(hemiLight);

    const sunBreakLight = new THREE.DirectionalLight(0xfff1d0, 2.8);
    sunBreakLight.position.set(11.5, 18.0, 9.5);
    sunBreakLight.castShadow = true;
    sunBreakLight.shadow.mapSize.set(1024, 1024);
    sunBreakLight.shadow.camera.near = 2;
    sunBreakLight.shadow.camera.far = 42;
    const sc = 8.5;
    sunBreakLight.shadow.camera.left = -sc;
    sunBreakLight.shadow.camera.right = sc;
    sunBreakLight.shadow.camera.top = sc + 3.5;
    sunBreakLight.shadow.camera.bottom = -sc;
    sunBreakLight.shadow.bias = -0.0008;
    sunBreakLight.shadow.normalBias = 0.025;
    scene.add(sunBreakLight);

    // Silver-lining rim light from opposite upper side so cloud is sculpted & luminous
    const rimLight = new THREE.DirectionalLight(0xcce6ff, 1.45);
    rimLight.position.set(-10.0, 14.0, -8.5);
    scene.add(rimLight);

    // Soft uplift bounce light so under-cloud base is sculpted slate-blue, never a black blob
    const bounceLight = new THREE.DirectionalLight(0x9cb8d4, 0.95);
    bounceLight.position.set(0, -8, 4);
    scene.add(bounceLight);

    // Internal cloud point light (idle rumble + strike burst)
    const cloudInternalLight = new THREE.PointLight(0x9bd2ff, 0.5, 18, 1.3);
    cloudInternalLight.position.set(-0.6, 6.2, -0.5);
    worldRoot.add(cloudInternalLight);

    // Scene-wide lightning flash light
    const strikeFlashLight = new THREE.PointLight(0xd8ecff, 0.0, 32, 1.1);
    strikeFlashLight.position.set(-0.5, 3.4, 0.2);
    worldRoot.add(strikeFlashLight);

    // --- FOREGROUND POND & TERRAIN HEIGHT FUNCTION ---
    // Note: CylinderGeometry top cap is just a single ring of triangles from center (0,0) to perimeter,
    // so we use a dedicated subdivided PlaneGeometry for the prairie surface so the pond basin actually carves
    // below the water surface instead of bridging over the pond in green!
    const SLAB_RADIUS = 4.15;
    const POND_X = 1.05;
    const POND_Z = 1.38;
    const POND_RX = 1.75;
    const POND_RZ = 1.42;
    const WATER_Y = 0.22;

    function getPondFactor(x, z) {
      const dx = (x - POND_X) / POND_RX;
      const dz = (z - POND_Z) / POND_RZ;
      return dx * dx + dz * dz;
    }

    function getTerrainHeight(x, z) {
      // Rolling prairie waves
      let h = 0.24
        + 0.12 * Math.sin(x * 0.55 + 0.4) * Math.cos(z * 0.5 - 0.3)
        + 0.07 * Math.cos((x - z) * 0.75);

      // Distant low hills rising toward back-left and back-right slab edges
      const distEdge = Math.sqrt(x * x + z * z);
      const backHill = Math.max(0, -z + 0.4) * 0.18 + Math.max(0, -x - 0.8) * 0.11;
      const hillBump = Math.exp(-((x + 1.85) * (x + 1.85) + (z + 2.05) * (z + 2.05)) * 0.28) * 0.65
        + Math.exp(-((x - 2.05) * (x - 2.05) + (z + 1.95) * (z + 1.95)) * 0.32) * 0.52;

      h += backHill * 0.36 + hillBump;

      // Deeply carved pond basin so the green terrain NEVER pokes through the pond interior
      const pf = getPondFactor(x, z);
      if (pf < 2.15) {
        if (pf < 1.06) {
          const dip = Math.max(0, 1 - pf / 1.06);
          const smoothDip = dip * dip * (3 - 2 * dip);
          h = THREE.MathUtils.lerp(WATER_Y - 0.06, -0.45, smoothDip);
        } else {
          const t = Math.min(1, (pf - 1.06) / 1.09);
          const smoothT = t * t * (3 - 2 * t);
          const berm = Math.sin(t * Math.PI) * 0.08;
          h = THREE.MathUtils.lerp(WATER_Y - 0.02, h, smoothT) + berm;
        }
      }

      // Soft bevel near slab perimeter
      if (distEdge > SLAB_RADIUS - 0.45) {
        const t = Math.min(1, (distEdge - (SLAB_RADIUS - 0.45)) / 0.45);
        h = THREE.MathUtils.lerp(h, 0.04, t * t);
      }
      return h;
    }

    // --- DIORAMA SLAB & TERRAIN ---
    const slabGroup = new THREE.Group();
    worldRoot.add(slabGroup);

    // Base soil/stone plinth with rich bevel look
    const plinthGeo = new THREE.CylinderGeometry(SLAB_RADIUS, SLAB_RADIUS * 0.95, 0.95, 64, 1);
    const plinthMat = new THREE.MeshStandardMaterial({
      color: 0x52453b,
      roughness: 0.85,
      metalness: 0.05
    });
    const plinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
    plinthMesh.position.y = -0.475;
    plinthMesh.receiveShadow = true;
    plinthMesh.castShadow = true;
    slabGroup.add(plinthMesh);

    // Darker bottom rim ring for miniature pedestal finish
    const rimGeo = new THREE.CylinderGeometry(SLAB_RADIUS * 0.96, SLAB_RADIUS * 0.92, 0.24, 64);
    const rimMat = new THREE.MeshStandardMaterial({
      color: 0x362d26,
      roughness: 0.75,
      metalness: 0.1
    });
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    rimMesh.position.y = -0.94;
    slabGroup.add(rimMesh);

    // Densely subdivided top prairie surface (radial mapped grid so interior vertices carve the pond basin accurately!)
    const topGeo = new THREE.PlaneGeometry(2, 2, 88, 88);
    topGeo.rotateX(-Math.PI / 2);
    const posAttr = topGeo.attributes.position;
    const colorArr = new Float32Array(posAttr.count * 3);

    const colHill = new THREE.Color(0x639a46);
    const colMeadow = new THREE.Color(0x7cb855);
    const colSunGrass = new THREE.Color(0x98cf63);
    const colDarkBank = new THREE.Color(0x36291f);
    const colDeepBasin = new THREE.Color(0x03263d);
    const tempCol = new THREE.Color();

    for (let i = 0; i < posAttr.count; i++) {
      // Elliptical grid mapping from square [-1, 1]^2 to circular disc of radius SLAB_RADIUS
      const u = posAttr.getX(i);
      const v = posAttr.getZ(i);
      const vx = u * Math.sqrt(Math.max(0, 1 - 0.5 * v * v)) * SLAB_RADIUS;
      const vz = v * Math.sqrt(Math.max(0, 1 - 0.5 * u * u)) * SLAB_RADIUS;
      const th = getTerrainHeight(vx, vz);

      posAttr.setXYZ(i, vx, th, vz);

      const pf = getPondFactor(vx, vz);
      if (pf < 1.02) {
        tempCol.copy(colDeepBasin);
      } else if (pf < 1.24) {
        const t = (pf - 1.02) / 0.22;
        tempCol.copy(colDeepBasin).lerp(colDarkBank, Math.min(1, t * 1.4));
      } else if (pf < 1.48) {
        const t = (pf - 1.24) / 0.24;
        tempCol.copy(colDarkBank).lerp(colMeadow, t);
      } else {
        const sunMix = THREE.MathUtils.clamp((vx + vz + 3.5) / 7.0, 0, 1);
        tempCol.copy(colHill).lerp(colMeadow, 0.65).lerp(colSunGrass, sunMix * 0.55);
      }
      colorArr[i * 3] = tempCol.r;
      colorArr[i * 3 + 1] = tempCol.g;
      colorArr[i * 3 + 2] = tempCol.b;
    }
    topGeo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
    topGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.82,
      metalness: 0.02
    });
    const terrainMesh = new THREE.Mesh(topGeo, terrainMat);
    terrainMesh.receiveShadow = true;
    terrainMesh.castShadow = true;
    slabGroup.add(terrainMesh);

    // --- RAIN-FED FOREGROUND POND (Unmistakable Deep Blue-Teal Water + Dark Bank Rim + Animated Shimmer & Glints) ---
    const pondGroup = new THREE.Group();
    worldRoot.add(pondGroup);

    // Defined darker wet-earth/stone outer bank rim ring around the pond
    const outerBankRimGeo = new THREE.RingGeometry(0.95, 1.13, 64);
    outerBankRimGeo.rotateX(-Math.PI / 2);
    outerBankRimGeo.scale(POND_RX, 1, POND_RZ);
    const outerBankRimMat = new THREE.MeshStandardMaterial({
      color: 0x382b22,
      roughness: 0.84,
      metalness: 0.04
    });
    const outerBankRimMesh = new THREE.Mesh(outerBankRimGeo, outerBankRimMat);
    outerBankRimMesh.position.set(POND_X, WATER_Y + 0.006, POND_Z);
    outerBankRimMesh.receiveShadow = true;
    pondGroup.add(outerBankRimMesh);

    // Crisp dark wet-slate inner shoreline lip right at the water's edge
    const innerShoreLipGeo = new THREE.RingGeometry(0.91, 0.97, 64);
    innerShoreLipGeo.rotateX(-Math.PI / 2);
    innerShoreLipGeo.scale(POND_RX, 1, POND_RZ);
    const innerShoreLipMat = new THREE.MeshBasicMaterial({
      color: 0x0b2538
    });
    const innerShoreLipMesh = new THREE.Mesh(innerShoreLipGeo, innerShoreLipMat);
    innerShoreLipMesh.position.set(POND_X, WATER_Y + 0.008, POND_Z);
    pondGroup.add(innerShoreLipMesh);

    // Custom procedural GLSL water shader across the entire pond interior:
    // Rich, saturated deep blue-teal water (zero green, zero pale washout), subtle animated wave shimmer
    // over the whole area, and mirror-like specular glints across the full surface.
    const pondGeo = new THREE.CircleGeometry(0.945, 64);
    pondGeo.rotateX(-Math.PI / 2);
    pondGeo.scale(POND_RX, 1, POND_RZ);

    const pondUniforms = {
      uTime: { value: 0 },
      uFlash: { value: 0 }
    };

    const pondWaterMat = new THREE.ShaderMaterial({
      uniforms: pondUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vLocalPos;
        void main() {
          vUv = uv;
          vLocalPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uFlash;
        varying vec2 vUv;
        varying vec3 vLocalPos;

        void main() {
          vec2 p = (vUv - 0.5) * 2.0;
          float r = length(p);

          // Rich saturated blue-teal water palette (clearly darker & bluer than every grass tone)
          vec3 deepNavyBlue  = vec3(0.02, 0.22, 0.42);
          vec3 richTealBlue  = vec3(0.04, 0.42, 0.68);
          vec3 brightSkyCyan = vec3(0.22, 0.68, 0.92);
          vec3 mirrorGlint   = vec3(0.90, 0.98, 1.00);

          // Radial depth gradient: deep navy-blue at shore edge, rich blue-teal through the interior
          float centerFactor = smoothstep(1.0, 0.12, r);
          vec3 col = mix(deepNavyBlue, richTealBlue, centerFactor);

          // Full-surface animated ripple wave interference pattern
          float w1 = sin(p.x * 16.0 + p.y * 10.0 + uTime * 2.4);
          float w2 = cos(p.x * 11.0 - p.y * 18.0 - uTime * 1.9);
          float w3 = sin((p.x + p.y) * 22.0 + uTime * 3.1);
          float ripple = (w1 + w2 + w3 * 0.6) / 2.6;

          // Subtle animated cyan-blue ripple shimmer over the entire pond surface
          float shimmerBand = smoothstep(0.15, 0.85, ripple * 0.5 + 0.5);
          col = mix(col, brightSkyCyan, shimmerBand * 0.34 * (0.4 + 0.6 * centerFactor));

          // Broad sky reflection sheen on upper-left quadrant
          vec2 skyCenter = vec2(-0.18 + 0.04 * sin(uTime * 1.2), -0.14 + 0.04 * cos(uTime * 1.0));
          float skyDist = length((p - skyCenter) * vec2(0.85, 1.15));
          float skySheen = smoothstep(0.68, 0.05, skyDist);
          col = mix(col, brightSkyCyan, skySheen * 0.42);

          // Crisp mirror-like specular glints distributed across the full water surface
          float glintWave = sin(p.y * 28.0 + sin(p.x * 9.0 + uTime * 1.7) * 2.5 - uTime * 2.8);
          float glintMask = smoothstep(0.82, 0.97, glintWave) * smoothstep(0.92, 0.25, r);
          col = mix(col, mirrorGlint, glintMask * 0.72);

          // Secondary sun-break specular highlight patch
          vec2 sunSpot = vec2(0.24 + 0.05 * cos(uTime * 1.5), -0.18 + 0.04 * sin(uTime * 1.3));
          float sunHighlight = smoothstep(0.32, 0.02, length((p - sunSpot) * vec2(0.9, 1.4)));
          col = mix(col, mirrorGlint, sunHighlight * 0.65);

          // Dark shoreline vignette at outer edge for crisp separation
          float edgeDark = smoothstep(0.82, 1.0, r);
          col = mix(col, vec3(0.01, 0.14, 0.26), edgeDark * 0.75);

          // Lightning flash boost
          col += vec3(0.35, 0.55, 0.75) * uFlash;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    const pondMesh = new THREE.Mesh(pondGeo, pondWaterMat);
    pondMesh.position.set(POND_X, WATER_Y + 0.01, POND_Z);
    pondGroup.add(pondMesh);

    // Additional crisp floating specular glint bars on top of the water surface
    const GLINT_BAR_COUNT = 6;
    const glintBars = [];
    const glintBarGeo = new THREE.PlaneGeometry(0.44, 0.068);
    glintBarGeo.rotateX(-Math.PI / 2);
    const glintBarSpecs = [
      { ox: -0.42, oz: -0.24, sx: 1.15, sz: 0.85, phase: 0.0 },
      { ox: 0.32, oz: -0.15, sx: 0.95, sz: 0.75, phase: 1.1 },
      { ox: -0.10, oz: 0.26, sx: 1.25, sz: 0.90, phase: 2.3 },
      { ox: 0.42, oz: 0.28, sx: 0.85, sz: 0.70, phase: 3.5 },
      { ox: -0.52, oz: 0.14, sx: 0.90, sz: 0.75, phase: 4.7 },
      { ox: 0.05, oz: -0.38, sx: 1.05, sz: 0.80, phase: 5.8 }
    ];
    glintBarSpecs.forEach((sp) => {
      const gbMat = new THREE.MeshBasicMaterial({
        color: 0xe8fbff,
        transparent: true,
        opacity: 0.72,
        depthWrite: false
      });
      const gbMesh = new THREE.Mesh(glintBarGeo, gbMat);
      gbMesh.position.set(POND_X + sp.ox, WATER_Y + 0.015, POND_Z + sp.oz);
      gbMesh.rotation.y = -0.22;
      pondGroup.add(gbMesh);
      glintBars.push({ mesh: gbMesh, mat: gbMat, ...sp });
    });

    // Little green frog sitting on a shoreline stone
    const frogGroup = new THREE.Group();
    const frogBaseX = POND_X - POND_RX * 0.78;
    const frogBaseZ = POND_Z - POND_RZ * 0.38;
    const frogBaseY = Math.max(WATER_Y + 0.03, getTerrainHeight(frogBaseX, frogBaseZ));
    frogGroup.position.set(frogBaseX, frogBaseY, frogBaseZ);
    frogGroup.rotation.y = 0.72;
    worldRoot.add(frogGroup);

    const frogMat = new THREE.MeshStandardMaterial({ color: 0x56b847, roughness: 0.45 });
    const frogBellyMat = new THREE.MeshStandardMaterial({ color: 0xd8f088, roughness: 0.55 });
    const frogEyeMat = new THREE.MeshStandardMaterial({ color: 0x151a12, roughness: 0.2 });

    const frogBody = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 12), frogMat);
    frogBody.scale.set(1.0, 0.78, 1.25);
    frogBody.position.y = 0.07;
    frogBody.castShadow = true;
    frogGroup.add(frogBody);

    const frogBelly = new THREE.Mesh(new THREE.SphereGeometry(0.098, 12, 10), frogBellyMat);
    frogBelly.scale.set(0.9, 0.65, 1.1);
    frogBelly.position.set(0, 0.055, 0.02);
    frogGroup.add(frogBelly);

    [-0.045, 0.045].forEach((ex) => {
      const eyeBump = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 10), frogMat);
      eyeBump.position.set(ex, 0.148, 0.075);
      frogGroup.add(eyeBump);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.019, 8, 8), frogEyeMat);
      pupil.position.set(ex, 0.155, 0.098);
      frogGroup.add(pupil);
    });

    // Golden-orange koi fish skimming right at the water surface
    const fishGroup = new THREE.Group();
    fishGroup.position.set(POND_X + 0.15, WATER_Y + 0.012, POND_Z + 0.1);
    worldRoot.add(fishGroup);

    const fishMat = new THREE.MeshStandardMaterial({
      color: 0xff9d33,
      emissive: 0xff6a00,
      emissiveIntensity: 0.55,
      roughness: 0.22
    });
    const fishBody = new THREE.Mesh(new THREE.ConeGeometry(0.072, 0.28, 12), fishMat);
    fishBody.rotation.x = Math.PI / 2;
    fishBody.scale.set(1.0, 1.0, 0.55);

    // Instanced bright white-blue splash water droplets
    const DROPLET_COUNT = 76;
    const dropletGeo = new THREE.SphereGeometry(0.068, 10, 10);
    const dropletMat = new THREE.MeshBasicMaterial({
      color: 0xf2fcff
    });
    const dropletInst = new THREE.InstancedMesh(dropletGeo, dropletMat, DROPLET_COUNT);
    dropletInst.visible = false;
    worldRoot.add(dropletInst);

    const dropletVel = [];
    const colDropWhite = new THREE.Color(0xffffff);
    const colDropCyan = new THREE.Color(0x88e2ff);
    for (let i = 0; i < DROPLET_COUNT; i++) {
      dropletVel.push({ vx: 0, vy: 0, vz: 0, sc: 1 });
      dropletInst.setColorAt(i, i % 3 === 0 ? colDropCyan : colDropWhite);
    }
    dropletInst.instanceColor.needsUpdate = true;

    let splashState = {
      active: false,
      startTime: -99999,
      originX: POND_X,
      originZ: POND_Z
    };

    function triggerPondSplash(now, hitPoint) {
      let sx = POND_X;
      let sz = POND_Z;
      if (hitPoint) {
        const dx = hitPoint.x - POND_X;
        const dz = hitPoint.z - POND_Z;
        const maxD = 0.75;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d > maxD) {
          sx = POND_X + (dx / d) * maxD;
          sz = POND_Z + (dz / d) * maxD;
        } else {
          sx = hitPoint.x;
          sz = hitPoint.z;
        }
      }

      splashState.active = true;
      splashState.startTime = now;
      splashState.originX = sx;
      splashState.originZ = sz;

      dropletInst.visible = true;
      for (let i = 0; i < DROPLET_COUNT; i++) {
        const ringLayer = i % 3;
        const ang = (i / DROPLET_COUNT) * Math.PI * 2 + randRange(-0.14, 0.14);
        const spd = ringLayer === 0 ? randRange(0.35, 0.95) : randRange(0.85, 2.25);
        dropletVel[i].vx = Math.cos(ang) * spd;
        dropletVel[i].vz = Math.sin(ang) * spd;
        dropletVel[i].vy = ringLayer === 0 ? randRange(3.0, 4.4) : randRange(2.1, 3.6);
        dropletVel[i].sc = randRange(0.85, 1.55);
      }

      splashCrownMesh.position.set(sx, WATER_Y + 0.018, sz);
      splashCrownMesh.visible = true;

      splashRings.forEach((r) => {
        r.mesh.position.set(sx, WATER_Y + 0.019, sz);
        r.mesh.visible = true;
      });
    }

    // --- GENEROUS INVISIBLE PROXY TARGETS FOR RAYCASTING (Easy tapping at 320px) ---
    const proxyMat = new THREE.MeshBasicMaterial({ visible: false });

    const cloudProxy = new THREE.Mesh(new THREE.SphereGeometry(3.1, 16, 12), proxyMat);
    cloudProxy.scale.set(1.42, 0.65, 1.18);
    cloudProxy.position.set(CLOUD_CENTER_X + 0.25, currentCloudCenterY + 0.25, CLOUD_CENTER_Z);
    cloudProxy.userData.targetType = 'cloud';
    worldRoot.add(cloudProxy);

    const pondProxy = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.9, 24), proxyMat);
    pondProxy.position.set(POND_X, WATER_Y + 0.12, POND_Z);
    pondProxy.userData.targetType = 'pond';
    worldRoot.add(pondProxy);

    const interactProxies = [cloudProxy, pondProxy];

    // --- POINTER / TOUCH RAYCASTING (Distinguish tap vs orbit drag) ---
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let downX = 0;
    let downY = 0;
    let downTime = 0;

    function updatePointerNDC(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      downX = e.clientX;
      downY = e.clientY;
      downTime = performance.now();
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      updatePointerNDC(e.clientX, e.clientY);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(interactProxies, false);
      renderer.domElement.classList.toggle('pointer-hover', hits.length > 0);
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const moveDist = Math.hypot(e.clientX - downX, e.clientY - downY);
      const elapsed = performance.now() - downTime;
      if (moveDist > 12 || elapsed > 600) return;

      updatePointerNDC(e.clientX, e.clientY);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(interactProxies, false);
      if (hits.length > 0) {
        const hit = hits[0];
        const now = performance.now();
        if (hit.object.userData.targetType === 'cloud') {
          triggerLightning(now);
        } else if (hit.object.userData.targetType === 'pond') {
          triggerPondSplash(now, hit.point);
        }
      }
    });

    // --- ASPECT-ADAPTIVE VERTICAL STACKING (HIGH ANVIL + WIDE AIR GAP + PRAIRIE) & CAMERA FIT ---
    const keyWorldSamples = [];
    const tempCorner = new THREE.Vector3();

    function rebuildKeySamples() {
      keyWorldSamples.length = 0;
      for (let i = 0; i < 16; i++) {
        const ang = (i / 16) * Math.PI * 2;
        const sx = Math.cos(ang) * SLAB_RADIUS;
        const sz = Math.sin(ang) * SLAB_RADIUS;
        keyWorldSamples.push(new THREE.Vector3(sx, 0.35, sz));
        keyWorldSamples.push(new THREE.Vector3(sx * 0.96, -1.06, sz * 0.96));
      }
      const cScaleX = cloudGroup.scale.x;
      const cScaleY = cloudGroup.scale.y;
      const cScaleZ = cloudGroup.scale.z;
      for (let i = 0; i < cloudPuffs.length; i++) {
        const cp = cloudPuffs[i];
        const wx = CLOUD_CENTER_X + cp.baseX * cScaleX;
        const wy = currentCloudCenterY + cp.baseY * cScaleY;
        const wz = CLOUD_CENTER_Z + cp.baseZ * cScaleZ;
        const rx = cp.sx * cScaleX * 1.03;
        const ry = cp.sy * cScaleY * 1.05;
        const rz = cp.sz * cScaleZ * 1.03;
        keyWorldSamples.push(new THREE.Vector3(wx + rx, wy, wz));
        keyWorldSamples.push(new THREE.Vector3(wx - rx, wy, wz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy + ry, wz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy - ry, wz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy, wz + rz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy, wz - rz));
      }
    }

    function fitCameraToScene() {
      const vw = Math.max(1, window.innerWidth);
      const vh = Math.max(1, window.innerHeight);
      renderer.setSize(vw, vh);

      const headerH = headerEl ? headerEl.getBoundingClientRect().height : 68;
      const footerH = footerEl ? footerEl.getBoundingClientRect().height : 32;

      const safeTopPx = headerH + 6;
      const safeBotPx = footerH + 6;
      const usableW = vw * 0.94;
      const usableH = Math.max(120, vh - safeTopPx - safeBotPx);
      const usableAspect = usableW / usableH;

      const portraitness = THREE.MathUtils.clamp((1.05 - usableAspect) / 0.52, 0, 1);

      const cloudScaleX = THREE.MathUtils.lerp(1.04, 0.96, portraitness);
      const cloudScaleY = THREE.MathUtils.lerp(0.95, 1.08, portraitness);
      const cloudScaleZ = THREE.MathUtils.lerp(1.02, 0.96, portraitness);
      cloudGroup.scale.set(cloudScaleX, cloudScaleY, cloudScaleZ);

      currentCloudBaseWorldY = THREE.MathUtils.lerp(3.95, 5.55, portraitness);
      currentCloudCenterY = currentCloudBaseWorldY + 0.88 * cloudScaleY;
      cloudGroup.position.set(CLOUD_CENTER_X, currentCloudCenterY, CLOUD_CENTER_Z);

      const shaftTopY = currentCloudBaseWorldY + 0.12;
      const shaftBotY = 0.15;
      const shaftHeight = shaftTopY - shaftBotY;
      rainCurtainGroup.scale.set(1, shaftHeight, 1);
      rainCurtainGroup.position.set(
        CLOUD_CENTER_X + 0.18,
        shaftBotY + shaftHeight * 0.5,
        CLOUD_CENTER_Z + 0.18
      );

      cloudProxy.scale.set(1.42 * cloudScaleX, 0.68 * cloudScaleY, 1.18 * cloudScaleZ);
      cloudProxy.position.set(CLOUD_CENTER_X + 0.25, currentCloudCenterY + 0.22 * cloudScaleY, CLOUD_CENTER_Z);
      cloudInternalLight.position.set(CLOUD_CENTER_X, currentCloudCenterY + 0.15, CLOUD_CENTER_Z);

      rebuildKeySamples();

      const aspect = vw / vh;
      camera.fov = aspect < 1.0 ? 43 : 36;
      camera.aspect = aspect;

      const viewDir = new THREE.Vector3(0.50, 0.34, 0.795).normalize();
      const camForward = viewDir.clone().negate();
      const worldUp = new THREE.Vector3(0, 1, 0);
      const camRight = new THREE.Vector3().crossVectors(camForward, worldUp).normalize();
      const camUp = new THREE.Vector3().crossVectors(camRight, camForward).normalize();

      let minU = Infinity, maxU = -Infinity;
      let minV = Infinity, maxV = -Infinity;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const p = keyWorldSamples[i];
        const u = p.dot(camRight);
        const v = p.dot(camUp);
        if (u < minU) minU = u;
        if (u > maxU) maxU = u;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      }

      const midU = (minU + maxU) * 0.5;
      const midV = (minV + maxV) * 0.5;
      const targetCenter = new THREE.Vector3()
        .addScaledVector(camRight, midU)
        .addScaledVector(camUp, midV);

      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const tanHalfVFov = Math.tan(vFovRad * 0.5) * (usableH / vh) * 0.96;
      const tanHalfHFov = Math.tan(vFovRad * 0.5) * aspect * (usableW / vw) * 0.96;

      let requiredDist = 6.0;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const rel = tempCorner.copy(keyWorldSamples[i]).sub(targetCenter);
        const zProj = rel.dot(viewDir);
        const xProj = Math.abs(rel.dot(camRight));
        const yProj = Math.abs(rel.dot(camUp));

        const dH = xProj / tanHalfHFov + zProj;
        const dV = yProj / tanHalfVFov + zProj;
        if (dH > requiredDist) requiredDist = dH;
        if (dV > requiredDist) requiredDist = dV;
      }

      let topSlopeMax = -Infinity, botSlopeMin = Infinity;
      let rightSlopeMax = -Infinity, leftSlopeMin = Infinity;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const rel = tempCorner.copy(keyWorldSamples[i]).sub(targetCenter);
        const depth = Math.max(1.0, requiredDist - rel.dot(viewDir));
        const slopeX = rel.dot(camRight) / depth;
        const slopeY = rel.dot(camUp) / depth;
        if (slopeX > rightSlopeMax) rightSlopeMax = slopeX;
        if (slopeX < leftSlopeMin) leftSlopeMin = slopeX;
        if (slopeY > topSlopeMax) topSlopeMax = slopeY;
        if (slopeY < botSlopeMin) botSlopeMin = slopeY;
      }
      const slopeMidOffsetX = (rightSlopeMax + leftSlopeMin) * 0.5 * requiredDist;
      const slopeMidOffsetY = (topSlopeMax + botSlopeMin) * 0.5 * requiredDist;
      targetCenter.addScaledVector(camRight, slopeMidOffsetX * 0.85);
      targetCenter.addScaledVector(camUp, slopeMidOffsetY * 0.85);

      requiredDist = 6.0;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const rel = tempCorner.copy(keyWorldSamples[i]).sub(targetCenter);
        const zProj = rel.dot(viewDir);
        const xProj = Math.abs(rel.dot(camRight));
        const yProj = Math.abs(rel.dot(camUp));

        const dH = xProj / tanHalfHFov + zProj;
        const dV = yProj / tanHalfVFov + zProj;
        if (dH > requiredDist) requiredDist = dH;
        if (dV > requiredDist) requiredDist = dV;
      }

      const finalDist = requiredDist * 1.02;

      const pixelOffsetY = (safeTopPx - safeBotPx) * 0.5;
      const worldPerPixel = (2 * finalDist * Math.tan(vFovRad * 0.5)) / vh;
      const shiftedTarget = targetCenter.clone().addScaledVector(camUp, pixelOffsetY * worldPerPixel);

      controls.target.copy(shiftedTarget);
      camera.position.copy(shiftedTarget).addScaledVector(viewDir, finalDist);
      camera.updateProjectionMatrix();

      controls.minDistance = finalDist * 0.88;
      controls.maxDistance = finalDist * 1.16;
      controls.update();
    }

    fitCameraToScene();
    window.addEventListener('resize', fitCameraToScene);

    // --- ANIMATION LOOP (All motion driven by performance.now()) ---
    const tempMat = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function animate(nowMs) {
      requestAnimationFrame(animate);
      const t = nowMs * 0.001;

      // 1. CLOUD IDLE BOIL, DRIFT & OCCASIONAL INTERNAL RUMBLE GLOW
      const driftX = Math.sin(t * 0.45) * 0.12;
      const driftY = Math.cos(t * 0.6) * 0.05;
      cloudGroup.position.set(
        CLOUD_CENTER_X + driftX,
        currentCloudCenterY + driftY,
        CLOUD_CENTER_Z + Math.sin(t * 0.35) * 0.07
      );
      rainCurtainGroup.position.x = CLOUD_CENTER_X + 0.18 + driftX * 0.8;

      for (let i = 0; i < cloudPuffs.length; i++) {
        const cp = cloudPuffs[i];
        const boil = 1.0 + 0.036 * Math.sin(t * 1.55 + cp.phase);
        cp.mesh.scale.set(cp.sx * boil, cp.sy * (2.0 - boil * 0.96), cp.sz * boil);
        cp.mesh.position.y = cp.baseY + Math.sin(t * 1.2 + cp.phase) * 0.032;
      }

      const idlePulse = Math.pow(Math.max(0, Math.sin(t * 1.15) * Math.sin(t * 2.7 + 1.2)), 6.0);

      // 2. LIGHTNING STRIKE FLICKER, RAIN CURTAIN FLASH & SCENE ILLUMINATION
      let strikeIntensity = 0;
      let groundGlow = 0;
      if (strikeState.active) {
        const dt = nowMs - strikeState.startTime;
        if (dt < 850) {
          let boltAlpha = 0;
          if (dt < 65) boltAlpha = 1.0;
          else if (dt < 110) boltAlpha = 0.22;
          else if (dt < 185) boltAlpha = 0.98;
          else if (dt < 240) boltAlpha = 0.16;
          else if (dt < 310) boltAlpha = 0.80;
          else if (dt < 480) boltAlpha = Math.max(0, 1 - (dt - 310) / 170) * 0.50;

          boltCoreMat.opacity = boltAlpha;
          boltHaloMat.opacity = boltAlpha * 0.92;
          strikeIntensity = boltAlpha;
          groundGlow = Math.max(0, 1 - dt / 780);
          impactDiscMat.opacity = groundGlow * 0.78;
          const discScale = 0.65 + 0.82 * Math.sin(Math.min(1, dt / 380) * Math.PI * 0.5);
          impactDiscMesh.scale.setScalar(discScale);
        } else {
          strikeState.active = false;
          boltCoreMat.opacity = 0;
          boltHaloMat.opacity = 0;
          impactDiscMat.opacity = 0;
          for (let i = 0; i < MAX_BOLT_SEGS; i++) {
            boltSegments[i].core.visible = false;
            boltSegments[i].halo.visible = false;
          }
        }
      }

      const totalCloudGlow = idlePulse * 1.2 + strikeIntensity * 5.8;
      cloudInternalLight.intensity = 0.5 + totalCloudGlow * 2.4;
      strikeFlashLight.intensity = strikeIntensity * 15.0;
      matAnvilCrown.emissiveIntensity = 0.22 + totalCloudGlow * 0.18;
      matMidTower.emissiveIntensity = 0.25 + totalCloudGlow * 0.28;
      matRaggedBase.emissiveIntensity = 0.28 + totalCloudGlow * 0.44;

      outerShaftMat.opacity = 0.18 + strikeIntensity * 0.34;
      innerShaftMat.opacity = 0.16 + strikeIntensity * 0.38;
      streakMat.opacity = 0.78 + strikeIntensity * 0.22;

      // Update procedural water shader uniforms
      pondUniforms.uTime.value = t;
      pondUniforms.uFlash.value = strikeIntensity;

      // 3. FALLING RAIN STREAKS THROUGH THE OPEN AIR GAP & IDLE POND RAIN RINGS
      const rainTopY = currentCloudBaseWorldY + 0.05;
      const rainSpan = Math.max(2.2, rainTopY - 0.15);
      tempEuler.set(0, 0, -0.09);
      tempQuat.setFromEuler(tempEuler);
      for (let i = 0; i < RAIN_COUNT; i++) {
        const rd = rainDrops[i];
        const curY = rainTopY - ((t * rd.speed + rd.y) % rainSpan);
        const slantOffset = (rainTopY - curY) * 0.09;
        tempPos.set(
          CLOUD_CENTER_X + 0.18 + driftX * 0.7 + rd.ox + slantOffset,
          curY,
          CLOUD_CENTER_Z + 0.18 + rd.oz
        );
        tempScale.set(1, rd.len, 1);
        tempMat.compose(tempPos, tempQuat, tempScale);
        rainInst.setMatrixAt(i, tempMat);
      }
      rainInst.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < IDLE_RIPPLE_COUNT; i++) {
        const ir = idleRipples[i];
        const prog = (t * 0.78 + ir.phase) % 1.0;
        ir.mesh.position.set(ir.x, WATER_Y + 0.016, ir.z);
        ir.mesh.scale.setScalar(0.55 + prog * 3.1);
        ir.mat.opacity = Math.sin(prog * Math.PI) * 0.82;
      }

      // 4. WIND-SWEPT GRASS WAVES & LIGHTNING STRIKE GRASS GLOW
      let needsColorUpdate = false;
      for (let i = 0; i < GRASS_COUNT; i++) {
        const gd = grassData[i];
        const windWave = Math.sin(t * 2.85 + gd.x * 0.95 + gd.z * 0.65 + gd.phase) * 0.19
          + Math.sin(t * 5.2 + gd.x * 1.4) * 0.05;
        tempPos.set(gd.x, gd.y, gd.z);
        tempEuler.set(windWave * 0.3, gd.rotY, -(gd.baseTilt + windWave));
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(gd.scaleXZ, gd.scaleY, gd.scaleXZ);
        tempMat.compose(tempPos, tempQuat, tempScale);
        grassInst.setMatrixAt(i, tempMat);

        if (groundGlow > 0.005) {
          const dx = gd.x - strikeState.targetX;
          const dz = gd.z - strikeState.targetZ;
          const distSq = dx * dx + dz * dz;
          if (distSq < 2.5) {
            const prox = (1.0 - distSq / 2.5) * groundGlow;
            gd.curCol.copy(gd.baseCol).lerp(glowGrassCol, prox * 0.95);
            grassInst.setColorAt(i, gd.curCol);
            needsColorUpdate = true;
          }
        } else if (!gd.curCol.equals(gd.baseCol)) {
          gd.curCol.copy(gd.baseCol);
          grassInst.setColorAt(i, gd.curCol);
          needsColorUpdate = true;
        }
      }
      grassInst.instanceMatrix.needsUpdate = true;
      if (needsColorUpdate) grassInst.instanceColor.needsUpdate = true;

      // 5. WILDFLOWERS TREMBLING IN THE WIND
      for (let i = 0; i < FLOWER_COUNT; i++) {
        const fd = flowerData[i];
        const tremor = Math.sin(t * 4.2 + fd.x * 1.2 + fd.phase) * 0.16;
        tempPos.set(fd.x, fd.y, fd.z);
        tempEuler.set(tremor * 0.5, fd.phase, -0.15 - tremor);
        tempQuat.setFromEuler(tempEuler);
        tempScale.setScalar(fd.sc);
        tempMat.compose(tempPos, tempQuat, tempScale);
        flowerInst.setMatrixAt(i, tempMat);
      }
      flowerInst.instanceMatrix.needsUpdate = true;

      // 6. POND SURFACE GLINTS & SPLASH INTERACTION
      for (let i = 0; i < GLINT_BAR_COUNT; i++) {
        const gb = glintBars[i];
        const wave = Math.sin(t * 2.1 + gb.phase);
        gb.mesh.position.x = POND_X + gb.ox + Math.sin(t * 1.4 + gb.phase) * 0.12;
        gb.mesh.position.z = POND_Z + gb.oz + Math.cos(t * 1.1 + gb.phase) * 0.07;
        gb.mesh.scale.set(gb.sx * (0.75 + 0.35 * (wave * 0.5 + 0.5)), 1, gb.sz);
        gb.mat.opacity = 0.42 + 0.48 * (wave * 0.5 + 0.5);
      }

      if (splashState.active) {
        const dt = nowMs - splashState.startTime;
        const sec = dt * 0.001;

        if (dt < 1500) {
          if (dt < 420) {
            const cProg = dt / 420;
            splashCrownMesh.scale.setScalar(0.5 + cProg * 2.8);
            splashCrownMat.opacity = (1 - cProg) * 0.92;
          } else {
            splashCrownMat.opacity = 0;
          }

          for (let i = 0; i < SPLASH_RINGS; i++) {
            const r = splashRings[i];
            const rTime = (dt - r.delay) * 0.001;
            if (rTime > 0 && rTime < 1.15) {
              const prog = rTime / 1.15;
              const sc = 0.55 + prog * 10.6;
              r.mesh.scale.setScalar(sc);
              r.mat.opacity = Math.sin(prog * Math.PI) * (1 - prog * 0.45) * 0.98;
            } else {
              r.mat.opacity = 0;
            }
          }

          const gravity = 7.4;
          for (let i = 0; i < DROPLET_COUNT; i++) {
            const dv = dropletVel[i];
            const dy = dv.vy * sec - 0.5 * gravity * sec * sec;
            if (dy >= -0.05) {
              tempPos.set(
                splashState.originX + dv.vx * sec,
                WATER_Y + 0.03 + dy,
                splashState.originZ + dv.vz * sec
              );
              const shrink = Math.max(0.01, (1 - sec * 0.78) * dv.sc);
              tempScale.set(shrink * 0.9, shrink * 1.25, shrink * 0.9);
            } else {
              tempPos.set(0, -10, 0);
              tempScale.setScalar(0.001);
            }
            tempQuat.identity();
            tempMat.compose(tempPos, tempQuat, tempScale);
            dropletInst.setMatrixAt(i, tempMat);
          }
          dropletInst.instanceMatrix.needsUpdate = true;

          const hopCycle = Math.min(1, dt / 950);
          const hopArc = Math.abs(Math.sin(hopCycle * Math.PI * 2));
          frogGroup.position.set(
            frogBaseX + Math.sin(hopCycle * Math.PI) * 0.24,
            frogBaseY + hopArc * 0.38,
            frogBaseZ + Math.sin(hopCycle * Math.PI) * 0.16
          );
          frogGroup.rotation.x = -hopArc * 0.45;

          const fishAng = sec * 5.2;
          fishGroup.position.set(
            POND_X + Math.cos(fishAng) * 0.62,
            WATER_Y + 0.01 + Math.sin(Math.min(1, sec * 1.4) * Math.PI) * 0.20,
            POND_Z + Math.sin(fishAng) * 0.48
          );
          fishGroup.rotation.y = -fishAng + Math.PI;
          fishMat.emissiveIntensity = 0.95;
        } else {
          splashState.active = false;
          dropletInst.visible = false;
          splashCrownMesh.visible = false;
          splashCrownMat.opacity = 0;
          splashRings.forEach((r) => {
            r.mesh.visible = false;
            r.mat.opacity = 0;
          });
          frogGroup.position.set(frogBaseX, frogBaseY, frogBaseZ);
          frogGroup.rotation.x = 0;
          fishMat.emissiveIntensity = 0.55;
        }
      } else {
        frogBody.scale.y = 0.78 + Math.sin(t * 3.5) * 0.04;
        const slowAng = t * 0.75;
        fishGroup.position.set(
          POND_X + Math.cos(slowAng) * 0.52,
          WATER_Y + 0.012,
          POND_Z + Math.sin(slowAng) * 0.40
        );
        fishGroup.rotation.y = -slowAng + Math.PI;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
