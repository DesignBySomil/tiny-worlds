<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thunderstorm Cell - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#2e3540; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 0; z-index:5; }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#cfd8e2; text-transform:uppercase; text-shadow:0 1px 8px rgba(10,14,20,.7); }
  header .rule { width:44px; height:1px; background:rgba(207,216,226,.5); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#dbe4ee; transition:opacity 1.2s ease; text-shadow:0 1px 2px rgba(10,14,20,1), 0 0 12px rgba(10,14,20,.85); }
  #hint.faded { opacity:.42; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(159,176,192,.55); }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Thunderstorm Cell</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// pass markers for deploy verification
// pass 1: first thunderstorm-cell build - storm day palette, hero cumulonimbus, drag-to-steer, tap lightning, rain-fed pond
// pass 2: legibility + form - lifted storm light, lighter greys, wider lower cloud, clearer header, lighter pond bed/canopy
// pass 3: root form pass - cloud rebuilt as interpenetrating wide-base cumulonimbus (no coil stack), irregular mud-ring pond with visible water from start, hint contrast lifted
// pass 4: coherent form - cloud is ONE sculpted lathe+value-noise volume with vertical vertex-color gradient (no ball seams), pond gets sandy mud shore + wider visible water, cloud shadow off (was blacking out the pond), lower cloud altitude, stronger hint contrast
// pass 5: cloud billows - bigger low-frequency lumps (was a smooth cone/mound), composition lowered for header clearance
// pass 6: cauliflower lobes - mid-frequency dominant displacement for real lobe shading separation, stronger base->top value contrast
// pass 7: apex fix - radial displacement attenuated near the axis (pass 6 tore the top ring into an open cone)

// ---------- palette (brooding storm day, distinct from volcano dusk / mushroom night) ----------
const PAL = {
  skyTop: 0x39404d, skyHorizon: 0x8d9b8a,
  grassBase: 0x5d7048, grassDark: 0x46573a, grassBlade: 0x6d8053,
  strataTop: 0x5a4f3d, strataMid: 0x4a3f33, strataRock: 0x3a3a40,
  cloudDark: 0x4a515e, cloudMid: 0x646e7c, cloudRim: 0xa9b3c2,
  pondBed: 0x8a7d63, pondWater: 0x6b8a99,
  rain: 0xaab8c8, bolt: 0xeaf2ff, scorch: 0x141210
};

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.skyTop);
scene.fog = new THREE.Fog(0x55606c, 26, 60);

// vertical sky gradient dome
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0, '#39404d'); grad.addColorStop(0.55, '#5d6874'); grad.addColorStop(1, '#8d9b8a');
  g.fillStyle = grad; g.fillRect(0,0,2,256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(90, 24, 16),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false })
  );
  scene.add(dome);
}

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.52; controls.enablePan = false;

// ---------- lights ----------
const sun = new THREE.DirectionalLight(0xc4cfdb, 2.1);
sun.position.set(-9, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
sun.shadow.camera.far = 50; sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x7d8899, 0x4a5545, 1.15));
const flashLight = new THREE.PointLight(0xcfe0ff, 0, 40, 1.6);
scene.add(flashLight);

// ---------- slab ----------
const SLAB = 16, SLAB_H = 3.2;
const slabGroup = new THREE.Group(); scene.add(slabGroup);
function strataLayer(h, y, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(SLAB, h, SLAB),
    new THREE.MeshStandardMaterial({ color, roughness: 0.95 }));
  m.position.y = y; m.castShadow = false; m.receiveShadow = true;
  slabGroup.add(m); return m;
}
strataLayer(0.9, -SLAB_H + 0.45, PAL.strataRock);
strataLayer(1.1, -SLAB_H + 0.9 + 0.55, PAL.strataMid);
strataLayer(1.2, -SLAB_H + 2.0 + 0.6, PAL.strataTop);

// plain top: subtle two-tone grass patches (hand-placed circles, not noise camo)
const plainMat = new THREE.MeshStandardMaterial({ color: PAL.grassBase, roughness: 1 });
const plain = new THREE.Mesh(new THREE.BoxGeometry(SLAB, 0.28, SLAB), plainMat);
plain.position.y = -0.14; plain.receiveShadow = true;
slabGroup.add(plain);

const patchMats = [PAL.grassDark, PAL.grassBlade].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
const patches = [
  [-5.5,-4.5,2.6,0], [3.5,-6,2.2,1], [6,1.5,2.8,0], [-3,4.5,2.4,1],
  [0.5,-1.5,3.0,1], [-6.5,2.5,1.8,0], [5.5,5.5,2.0,1]
];
for (const [x,z,r,mi] of patches) {
  const p = new THREE.Mesh(new THREE.CircleGeometry(r, 20), patchMats[mi]);
  p.rotation.x = -Math.PI/2; p.position.set(x, 0.005, z);
  p.receiveShadow = true; slabGroup.add(p);
}

// ---------- pond (off-center dip, fills with rain) ----------
const POND = { x: 3.2, z: -2.6, maxR: 2.6, minR: 1.5, fill: 0.15 };
// irregular muddy shore ring (hand-wobbled outline, not a perfect disc)
const bedShape = new THREE.Shape();
for (let i = 0; i <= 26; i++) {
  const a = (i / 26) * Math.PI * 2;
  const wob = 1 + 0.14 * Math.sin(a*3 + 1.2) + 0.09 * Math.sin(a*5 + 0.4);
  const r = (POND.maxR + 0.55) * wob;
  const px = Math.cos(a) * r, py = Math.sin(a) * r;
  if (i === 0) bedShape.moveTo(px, py); else bedShape.lineTo(px, py);
}
const pondBed = new THREE.Mesh(new THREE.ShapeGeometry(bedShape),
  new THREE.MeshStandardMaterial({ color: 0x6f6450, roughness: 1 }));
pondBed.rotation.x = -Math.PI/2; pondBed.position.set(POND.x, 0.012, POND.z);
pondBed.receiveShadow = true; slabGroup.add(pondBed);
const pondWaterMat = new THREE.MeshStandardMaterial({
  color: PAL.pondWater, roughness: 0.12, metalness: 0.05,
  transparent: true, opacity: 0.92 });
const pondWater = new THREE.Mesh(new THREE.CircleGeometry(1, 28), pondWaterMat);
pondWater.rotation.x = -Math.PI/2; pondWater.position.set(POND.x, 0.03, POND.z);
pondWater.scale.setScalar(POND.minR); slabGroup.add(pondWater);

// ---------- hero cloud: layered cumulonimbus ----------
const cloud = new THREE.Group(); scene.add(cloud);
const CLOUD_Y = 6.1;
// deterministic 3D value noise (no texture deps)
function hash3(x, y, z) { const s = Math.sin(x*127.1 + y*311.7 + z*74.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y, z) {
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const l=(a,b,t)=>a+(b-a)*t;
  return l(
    l(l(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u), l(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u), v),
    l(l(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u), l(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u), v), w)*2-1;
}
// single closed volume: cumulonimbus lathe profile, noise-displaced, flat base
const cProfile = [[0.001,0],[1.9,0.02],[2.75,0.18],[3.15,0.55],[3.0,1.0],[2.55,1.5],[2.0,1.95],[1.55,2.4],[1.2,2.85],[0.95,3.25],[0.62,3.6],[0.001,3.85]];
const cGeo = new THREE.LatheGeometry(cProfile.map(([r,y]) => new THREE.Vector2(r,y)), 44);
{
  const pos = cGeo.attributes.position;
  const cols = [];
  const cBase = new THREE.Color(0x3a414e), cMid = new THREE.Color(0x717b8a), cTop = new THREE.Color(0xd0d9e3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const flat = THREE.MathUtils.smoothstep(y, 0.05, 1.1); // keep underside flat
    const radial = Math.hypot(x, z) || 1;
    const n = vnoise(x*0.7+7, y*0.85, z*0.7) * 1.1 + vnoise(x*1.7, y*1.9, z*1.7) * 0.5 + vnoise(x*3.2, y*3.2, z*3.2) * 0.18;
    const amp = 1.15 * flat * THREE.MathUtils.smoothstep(radial, 0.12, 0.9); // closed apex
    pos.setXYZ(i,
      x + (x/radial) * n * amp,
      y + vnoise(x*0.75+31, y*0.9, z*0.75) * 0.5 * flat,
      z + (z/radial) * n * amp);
    const t = THREE.MathUtils.clamp(y / 3.85, 0, 1);
    const c = t < 0.5 ? cBase.clone().lerp(cMid, t*2) : cMid.clone().lerp(cTop, (t-0.5)*2);
    cols.push(c.r, c.g, c.b);
  }
  cGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  cGeo.computeVertexNormals();
}
const cloudBody = new THREE.Mesh(cGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 1, metalness: 0, side: THREE.DoubleSide }));
cloudBody.castShadow = false; // a real cell darkens the ground diffusely; hard shadow was blacking out the pond
cloud.add(cloudBody);
cloud.position.set(-2.5, CLOUD_Y, 1.0);

// soft glow sprite inside cloud for idle flicker
function glowTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,4, 64,64,64);
  grad.addColorStop(0, inner); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const flickerTex = glowTexture('rgba(210,225,255,0.85)', 'rgba(210,225,255,0)');
const flicker = new THREE.Sprite(new THREE.SpriteMaterial({
  map: flickerTex, transparent: true, opacity: 0, depthWrite: false,
  blending: THREE.AdditiveBlending }));
flicker.scale.setScalar(4.2); flicker.position.set(0, 1.2, 0); cloud.add(flicker);

// ---------- rain shaft (follows cloud) ----------
const RAIN_N = 900;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_N * 6);
const rainSeed = [];
for (let i = 0; i < RAIN_N; i++) {
  rainSeed.push({ x: (Math.random()-0.5)*7, z: (Math.random()-0.5)*7, y: Math.random()*CLOUD_Y, v: 9 + Math.random()*5 });
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: PAL.rain, transparent: true, opacity: 0.34 });
const rain = new THREE.LineSegments(rainGeo, rainMat);
rain.frustumCulled = false; scene.add(rain);
const WIND = { x: 1.6, z: 0.4 };

// mist where rain hits ground
const mistTex = glowTexture('rgba(190,205,215,0.5)', 'rgba(190,205,215,0)');
const mists = [];
for (let i = 0; i < 3; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: mistTex, transparent: true,
    opacity: 0.16, depthWrite: false }));
  s.scale.setScalar(4 + i); s.position.y = 0.35; scene.add(s); mists.push(s);
}

// ---------- plain dressing: wind-bent grass tufts, fence posts, rocks, lone bent tree ----------
const grassMat = new THREE.MeshStandardMaterial({ color: PAL.grassBlade, roughness: 1, side: THREE.DoubleSide });
const grassTufts = [];
function tuft(x, z, s) {
  const g = new THREE.Group();
  const blades = 4 + Math.floor(Math.random()*3);
  for (let i = 0; i < blades; i++) {
    const b = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.55), grassMat);
    b.position.set((Math.random()-0.5)*0.16, 0.27, (Math.random()-0.5)*0.16);
    b.rotation.y = Math.random()*Math.PI;
    b.rotation.z = 0.28 + Math.random()*0.2; // all lean with the wind (+x)
    g.add(b);
  }
  g.position.set(x, 0, z); g.scale.setScalar(s);
  slabGroup.add(g); grassTufts.push(g); return g;
}
const tuftSpots = [];
for (let i = 0; i < 90; i++) {
  const x = (Math.random()-0.5)*(SLAB-1.6), z = (Math.random()-0.5)*(SLAB-1.6);
  if (Math.hypot(x-POND.x, z-POND.z) < POND.maxR + 0.6) continue;
  tuftSpots.push([x, z, 0.7 + Math.random()*0.7]);
}
tuftSpots.forEach(([x,z,s]) => tuft(x,z,s));

const postMat = new THREE.MeshStandardMaterial({ color: 0x4c4136, roughness: 1 });
for (let i = 0; i < 6; i++) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.85, 0.12), postMat);
  post.position.set(-6.8 + i*1.15, 0.42, 5.6 - i*0.35);
  post.rotation.z = (Math.random()-0.5)*0.12;
  post.castShadow = true; slabGroup.add(post);
  if (i > 0) {
    const prev = new THREE.Vector3(-6.8 + (i-1)*1.15, 0.68, 5.6 - (i-1)*0.35);
    const cur = new THREE.Vector3(-6.8 + i*1.15, 0.66, 5.6 - i*0.35);
    const wire = new THREE.Line(new THREE.BufferGeometry().setFromPoints([prev, cur]),
      new THREE.LineBasicMaterial({ color: 0x2c2620 }));
    slabGroup.add(wire);
  }
}
const rockMat = new THREE.MeshStandardMaterial({ color: 0x5c5a52, roughness: 0.95 });
[[-4.2,-5.8,0.5],[6.4,-4.2,0.4],[1.8,6.2,0.6],[-6.2,0.8,0.35],[5.2,2.8,0.3]].forEach(([x,z,s]) => {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
  r.position.set(x, s*0.45, z); r.rotation.set(Math.random(), Math.random(), Math.random());
  r.castShadow = true; r.receiveShadow = true; slabGroup.add(r);
});

// lone bent tree (wind-shaped, leaning +x like the grass)
const tree = new THREE.Group();
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x453a2e, roughness: 1 });
const trunkCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,0,0), new THREE.Vector3(0.28,0.9,0),
  new THREE.Vector3(0.8,1.7,0), new THREE.Vector3(1.5,2.2,0)
]);
tree.add(new THREE.Mesh(new THREE.TubeGeometry(trunkCurve, 12, 0.11, 6), trunkMat));
const branchCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.5,1.25,0), new THREE.Vector3(1.0,1.9,0.3), new THREE.Vector3(1.6,2.2,0.5)
]);
tree.add(new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 8, 0.06, 6), trunkMat));
const canopyMat = new THREE.MeshStandardMaterial({ color: 0x6d7f52, roughness: 1 });
[[1.75,2.35,0,0.75],[1.35,2.0,0.45,0.5],[2.05,2.1,-0.3,0.55]].forEach(([x,y,z,s]) => {
  const c = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 10), canopyMat);
  c.position.set(x,y,z); c.scale.set(1.5, 0.75, 1.2); c.castShadow = true; tree.add(c);
});
tree.position.set(-5.6, 0, -3.4); tree.traverse(o => { if (o.isMesh) o.castShadow = true; });
slabGroup.add(tree);

// ---------- lightning ----------
const boltMat = new THREE.LineBasicMaterial({ color: PAL.bolt, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending });
let bolt = null, boltLife = 0, scorch = null, scorchLife = 0;
function strike() {
  const from = new THREE.Vector3(cloud.position.x, CLOUD_Y - 1.2, cloud.position.z);
  const to = new THREE.Vector3(cloud.position.x + (Math.random()-0.5)*1.2, 0.05,
                               cloud.position.z + (Math.random()-0.5)*1.2);
  const pts = [from.clone()];
  const segs = 9;
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const p = from.clone().lerp(to, t);
    p.x += (Math.random()-0.5) * 0.9 * (1-t);
    p.z += (Math.random()-0.5) * 0.9 * (1-t);
    pts.push(p);
  }
  pts.push(to.clone());
  if (bolt) { scene.remove(bolt); bolt.geometry.dispose(); }
  bolt = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), boltMat.clone());
  bolt.material.opacity = 1; scene.add(bolt); boltLife = 1;
  flashLight.position.copy(to).y = 2.5; flashLight.intensity = 60;
  renderer.toneMappingExposure = 1.7;
  camShake = 0.35;
  if (scorch) { scene.remove(scorch); scorch.geometry.dispose(); }
  scorch = new THREE.Mesh(new THREE.CircleGeometry(0.55, 14),
    new THREE.MeshBasicMaterial({ color: PAL.scorch, transparent: true, opacity: 0.85 }));
  scorch.rotation.x = -Math.PI/2; scorch.position.copy(to).y = 0.045;
  scene.add(scorch); scorchLife = 1;
}

// ---------- camera framing (bounds-fit, portrait-aware) ----------
const frameBox = new THREE.Box3(
  new THREE.Vector3(-SLAB/2 - 1, -SLAB_H, -SLAB/2 - 1),
  new THREE.Vector3(SLAB/2 + 1, CLOUD_Y + 6.6, SLAB/2 + 1));
function frameInitialCamera() {
  const size = frameBox.getSize(new THREE.Vector3());
  const center = frameBox.getCenter(new THREE.Vector3());
  center.y = 2.5;
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const fovH = 2 * Math.atan(Math.tan(fovV/2) * camera.aspect);
  const distV = (size.y * 0.62) / Math.tan(fovV/2);
  const distH = (size.x * 0.62) / Math.tan(fovH/2);
  const dist = Math.max(distV, distH) * 1.08;
  const dir = new THREE.Vector3(0.62, 0.42, 1).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  controls.target.copy(center);
  camera.updateProjectionMatrix(); controls.update();
}
frameInitialCamera();

// ---------- hints ----------
const hintEl = document.getElementById('hint');
const HINTS = {
  idle: 'Drag the storm - tap the cloud for lightning',
  steering: 'Steering the cell - rain follows',
  struck: 'Struck - the plain smells of rain',
  full: 'The pond brims over'
};
function setHint(s) {
  hintEl.textContent = HINTS[s]; hintEl.classList.remove('faded');
  clearTimeout(setHint._t);
  setHint._t = setTimeout(() => hintEl.classList.add('faded'), 6000);
}
setHint('idle');

// ---------- interaction: drag cloud / tap lightning / orbit otherwise ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -CLOUD_Y);
let dragging = false, downAt = 0, downXY = [0,0], camShake = 0;
function toNDC(e) {
  ndc.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1);
}
function hitsCloud(e) {
  toNDC(e); ray.setFromCamera(ndc, camera);
  return ray.intersectObject(cloud, true).length > 0;
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  camera.updateMatrixWorld(true); cloud.updateMatrixWorld(true);
  downAt = performance.now(); downXY = [e.clientX, e.clientY];
  if (hitsCloud(e)) { dragging = true; controls.enabled = false; setHint('steering'); }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  toNDC(e); ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(dragPlane, p)) {
    const lim = SLAB/2 - 1.5;
    cloud.position.x = THREE.MathUtils.clamp(p.x, -lim, lim);
    cloud.position.z = THREE.MathUtils.clamp(p.z, -lim, lim);
  }
});
renderer.domElement.addEventListener('pointerup', (e) => {
  const dt = performance.now() - downAt;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  if (dragging) {
    dragging = false; controls.enabled = true;
    if (moved < 7 && dt < 450) { strike(); setHint('struck'); }
    else setHint('idle');
  }
});

// ---------- animate ----------
const clock = new THREE.Clock();
let flickerTimer = 2 + Math.random()*4, driftT = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // cloud idle drift + bob
  if (!dragging) {
    driftT += dt;
    cloud.position.x += Math.sin(driftT * 0.11) * dt * 0.35;
    cloud.position.z += Math.cos(driftT * 0.09) * dt * 0.3;
    const lim = SLAB/2 - 1.5;
    cloud.position.x = THREE.MathUtils.clamp(cloud.position.x, -lim, lim);
    cloud.position.z = THREE.MathUtils.clamp(cloud.position.z, -lim, lim);
  }
  cloud.position.y = CLOUD_Y + Math.sin(t * 0.5) * 0.12;

  // rain shaft follows cloud
  for (let i = 0; i < RAIN_N; i++) {
    const r = rainSeed[i];
    r.y -= r.v * dt;
    if (r.y < 0) { r.y = CLOUD_Y - 1.4; r.x = (Math.random()-0.5)*7; r.z = (Math.random()-0.5)*7; }
    const j = i * 6;
    const wx = cloud.position.x + r.x, wz = cloud.position.z + r.z;
    rainPos[j]   = wx;                 rainPos[j+1] = r.y;        rainPos[j+2] = wz;
    rainPos[j+3] = wx + WIND.x * 0.05; rainPos[j+4] = r.y - 0.42; rainPos[j+5] = wz + WIND.z * 0.05;
  }
  rainGeo.attributes.position.needsUpdate = true;
  mists.forEach((m, i) => {
    m.position.x = cloud.position.x + Math.sin(t*0.7 + i*2.1) * 1.2;
    m.position.z = cloud.position.z + Math.cos(t*0.6 + i*1.7) * 1.2;
    m.material.opacity = 0.12 + Math.sin(t*1.3 + i) * 0.05;
  });

  // pond fill: rises when cloud is over/near pond, drains otherwise
  const overPond = Math.hypot(cloud.position.x - POND.x, cloud.position.z - POND.z) < POND.maxR + 1.6;
  POND.fill = THREE.MathUtils.clamp(POND.fill + (overPond ? dt/90 : -dt/240), 0, 1);
  const r = THREE.MathUtils.lerp(POND.minR, POND.maxR, POND.fill);
  pondWater.scale.setScalar(r);
  pondWater.position.y = 0.03 + POND.fill * 0.045;
  pondWaterMat.opacity = 0.85 + Math.sin(t*2.2) * 0.04 * POND.fill;
  if (POND.fill >= 0.999 && hintEl.textContent !== HINTS.full) setHint('full');

  // grass sway (all lean +x, ripple phase by position)
  for (const g of grassTufts) {
    g.rotation.z = Math.sin(t * 1.8 + g.position.x * 0.5 + g.position.z * 0.3) * 0.09;
  }

  // idle internal flicker
  flickerTimer -= dt;
  if (flickerTimer < 0) { flickerTimer = 2 + Math.random()*5; flicker.material.opacity = 0.7; }
  flicker.material.opacity = Math.max(0, flicker.material.opacity - dt * 1.4);

  // lightning decay
  if (bolt && boltLife > 0) {
    boltLife -= dt * 4.5;
    bolt.material.opacity = Math.max(0, boltLife) * (0.7 + Math.random()*0.3);
    if (boltLife <= 0) { scene.remove(bolt); bolt = null; }
  }
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 260);
  renderer.toneMappingExposure += (1.15 - renderer.toneMappingExposure) * dt * 6;
  if (scorch && scorchLife > 0) {
    scorchLife -= dt / 30;
    scorch.material.opacity = Math.max(0, scorchLife) * 0.85;
    if (scorchLife <= 0) { scene.remove(scorch); scorch = null; }
  }
  if (camShake > 0) {
    camShake -= dt * 1.4;
    camera.position.x += (Math.random()-0.5) * camShake * 0.14;
    camera.position.y += (Math.random()-0.5) * camShake * 0.1;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();
});
setTimeout(() => hintEl.classList.add('faded'), 6000);
</script>
</body>
</html>
