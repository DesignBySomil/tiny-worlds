<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thunderstorm cell — a tiny world</title>
  <style>
    :root {
      --bg-top: #374a62;
      --bg-mid: #5c7691;
      --bg-bot: #adc0ce;
      --text-main: #f7fafc;
      --text-sub: #d7e3ec;
      --accent: #ffe082;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 54%, var(--bg-bot) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    canvas.pointer-hover {
      cursor: pointer;
    }
    .hud-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 8px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(180deg, rgba(22, 32, 44, 0.58) 0%, rgba(22, 32, 44, 0.24) 72%, rgba(22, 32, 44, 0) 100%);
    }
    .title {
      font-size: clamp(1.1rem, 3.6vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(10, 18, 28, 0.55);
    }
    .subtitle {
      font-size: clamp(0.75rem, 2.3vw, 0.88rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 2px;
      text-shadow: 0 1px 6px rgba(10, 18, 28, 0.6);
    }
    .hint {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 10px;
      font-size: clamp(0.68rem, 2.1vw, 0.78rem);
      font-weight: 500;
      color: #eef5fa;
      background: rgba(20, 32, 46, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }
    .hud-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 16px 10px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(245, 250, 255, 0.85);
      text-shadow: 0 1px 4px rgba(15, 25, 36, 0.65);
      background: linear-gradient(0deg, rgba(22, 32, 44, 0.42) 0%, rgba(22, 32, 44, 0) 100%);
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 20px;
      z-index: 100;
      background: rgba(22, 30, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="hud-header" id="hud-header">
    <h1 class="title">Thunderstorm cell</h1>
    <div class="subtitle">a tiny world</div>
    <div class="hint">tap the cloud for lightning - tap the pond to splash</div>
  </header>

  <div id="canvas-container"></div>

  <footer class="hud-footer" id="hud-footer">A tiny world</footer>

  <div id="fallback">
    <h2>WebGL Required</h2>
    <p>Unable to initialize the 3D miniature view on this device or browser.</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261103)
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261103);
    const randRange = (min, max) => min + (max - min) * rand();

    const container = document.getElementById('canvas-container');
    const fallbackEl = document.getElementById('fallback');
    const headerEl = document.getElementById('hud-header');
    const footerEl = document.getElementById('hud-footer');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: true });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x7d95ad, 0.0085);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(38);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(74);
    controls.minAzimuthAngle = THREE.MathUtils.degToRad(-55);
    controls.maxAzimuthAngle = THREE.MathUtils.degToRad(55);

    const worldRoot = new THREE.Group();
    scene.add(worldRoot);

    // --- LIGHTING (Dramatic sun break + bright readable cloud + fill) ---
    const hemiLight = new THREE.HemisphereLight(0xeef6ff, 0x627c54, 1.38);
    scene.add(hemiLight);

    const sunBreakLight = new THREE.DirectionalLight(0xfff1d0, 2.8);
    sunBreakLight.position.set(11.5, 18.0, 9.5);
    sunBreakLight.castShadow = true;
    sunBreakLight.shadow.mapSize.set(1024, 1024);
    sunBreakLight.shadow.camera.near = 2;
    sunBreakLight.shadow.camera.far = 42;
    const sc = 8.5;
    sunBreakLight.shadow.camera.left = -sc;
    sunBreakLight.shadow.camera.right = sc;
    sunBreakLight.shadow.camera.top = sc + 3.5;
    sunBreakLight.shadow.camera.bottom = -sc;
    sunBreakLight.shadow.bias = -0.0008;
    sunBreakLight.shadow.normalBias = 0.025;
    scene.add(sunBreakLight);

    // Silver-lining rim light from opposite upper side so cloud is sculpted & luminous
    const rimLight = new THREE.DirectionalLight(0xcce6ff, 1.45);
    rimLight.position.set(-10.0, 14.0, -8.5);
    scene.add(rimLight);

    // Soft uplift bounce light so under-cloud base is sculpted slate-blue, never a black blob
    const bounceLight = new THREE.DirectionalLight(0x9cb8d4, 0.95);
    bounceLight.position.set(0, -8, 4);
    scene.add(bounceLight);

    // Internal cloud point light (idle rumble + strike burst)
    const cloudInternalLight = new THREE.PointLight(0x9bd2ff, 0.5, 18, 1.3);
    cloudInternalLight.position.set(-0.6, 6.2, -0.5);
    worldRoot.add(cloudInternalLight);

    // Scene-wide lightning flash light
    const strikeFlashLight = new THREE.PointLight(0xd8ecff, 0.0, 32, 1.1);
    strikeFlashLight.position.set(-0.5, 3.4, 0.2);
    worldRoot.add(strikeFlashLight);

    // --- FOREGROUND POND & TERRAIN HEIGHT FUNCTION ---
    // Placed prominently in the right-front foreground so it is unmistakably readable and tappable in idle
    const SLAB_RADIUS = 4.15;
    const POND_X = 1.05;
    const POND_Z = 1.38;
    const POND_RX = 1.68;
    const POND_RZ = 1.34;
    const WATER_Y = 0.14;

    function getPondFactor(x, z) {
      const dx = (x - POND_X) / POND_RX;
      const dz = (z - POND_Z) / POND_RZ;
      return dx * dx + dz * dz;
    }

    function getTerrainHeight(x, z) {
      // Rolling prairie waves
      let h = 0.24
        + 0.12 * Math.sin(x * 0.55 + 0.4) * Math.cos(z * 0.5 - 0.3)
        + 0.07 * Math.cos((x - z) * 0.75);

      // Distant low hills rising toward back-left and back-right slab edges
      const distEdge = Math.sqrt(x * x + z * z);
      const backHill = Math.max(0, -z + 0.4) * 0.18 + Math.max(0, -x - 0.8) * 0.11;
      const hillBump = Math.exp(-((x + 1.85) * (x + 1.85) + (z + 2.05) * (z + 2.05)) * 0.28) * 0.65
        + Math.exp(-((x - 2.05) * (x - 2.05) + (z + 1.95) * (z + 1.95)) * 0.32) * 0.52;

      h += backHill * 0.36 + hillBump;

      // Foreground pond basin with a gentle tactile shore berm around pf = 1.05..1.35
      const pf = getPondFactor(x, z);
      if (pf < 2.1) {
        if (pf < 1.05) {
          const dip = Math.max(0, 1 - pf / 1.05);
          const smoothDip = dip * dip * (3 - 2 * dip);
          h = THREE.MathUtils.lerp(WATER_Y + 0.02, -0.26, smoothDip);
        } else {
          const t = Math.min(1, (pf - 1.05) / 1.05);
          const smoothT = t * t * (3 - 2 * t);
          const berm = Math.sin(t * Math.PI) * 0.07;
          h = THREE.MathUtils.lerp(WATER_Y + 0.02, h, smoothT) + berm;
        }
      }

      // Soft bevel near slab perimeter
      if (distEdge > SLAB_RADIUS - 0.45) {
        const t = Math.min(1, (distEdge - (SLAB_RADIUS - 0.45)) / 0.45);
        h = THREE.MathUtils.lerp(h, 0.04, t * t);
      }
      return h;
    }

    // --- DIORAMA SLAB & TERRAIN ---
    const slabGroup = new THREE.Group();
    worldRoot.add(slabGroup);

    // Base soil/stone plinth with rich bevel look
    const plinthGeo = new THREE.CylinderGeometry(SLAB_RADIUS, SLAB_RADIUS * 0.95, 0.95, 64, 1);
    const plinthMat = new THREE.MeshStandardMaterial({
      color: 0x52453b,
      roughness: 0.85,
      metalness: 0.05
    });
    const plinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
    plinthMesh.position.y = -0.475;
    plinthMesh.receiveShadow = true;
    plinthMesh.castShadow = true;
    slabGroup.add(plinthMesh);

    // Darker bottom rim ring for miniature pedestal finish
    const rimGeo = new THREE.CylinderGeometry(SLAB_RADIUS * 0.96, SLAB_RADIUS * 0.92, 0.24, 64);
    const rimMat = new THREE.MeshStandardMaterial({
      color: 0x362d26,
      roughness: 0.75,
      metalness: 0.1
    });
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    rimMesh.position.y = -0.94;
    slabGroup.add(rimMesh);

    // Sculpted top prairie surface
    const topGeo = new THREE.CylinderGeometry(SLAB_RADIUS, SLAB_RADIUS, 0.2, 76, 32);
    const posAttr = topGeo.attributes.position;
    const colorArr = new Float32Array(posAttr.count * 3);

    const colHill = new THREE.Color(0x639a46);
    const colMeadow = new THREE.Color(0x7cb855);
    const colSunGrass = new THREE.Color(0x98cf63);
    const colShoreRim = new THREE.Color(0xb8a47e); // Warm sandy/pebble shore rim so pond outline pops
    const colMud = new THREE.Color(0x2d4a5e);
    const tempCol = new THREE.Color();

    for (let i = 0; i < posAttr.count; i++) {
      const vx = posAttr.getX(i);
      const vy = posAttr.getY(i);
      const vz = posAttr.getZ(i);

      if (vy > 0) {
        const th = getTerrainHeight(vx, vz);
        posAttr.setY(i, th);

        const pf = getPondFactor(vx, vz);
        if (pf < 0.96) {
          tempCol.copy(colMud);
        } else if (pf < 1.18) {
          const t = (pf - 0.96) / 0.22;
          tempCol.copy(colMud).lerp(colShoreRim, Math.sin(t * Math.PI * 0.5));
        } else if (pf < 1.48) {
          const t = (pf - 1.18) / 0.30;
          tempCol.copy(colShoreRim).lerp(colMeadow, t);
        } else {
          const sunMix = THREE.MathUtils.clamp((vx + vz + 3.5) / 7.0, 0, 1);
          tempCol.copy(colHill).lerp(colMeadow, 0.65).lerp(colSunGrass, sunMix * 0.55);
        }
      } else {
        posAttr.setY(i, -0.04);
        tempCol.setHex(0x5a4c40);
      }
      colorArr[i * 3] = tempCol.r;
      colorArr[i * 3 + 1] = tempCol.g;
      colorArr[i * 3 + 2] = tempCol.b;
    }
    topGeo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
    topGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.82,
      metalness: 0.02
    });
    const terrainMesh = new THREE.Mesh(topGeo, terrainMat);
    terrainMesh.receiveShadow = true;
    terrainMesh.castShadow = true;
    slabGroup.add(terrainMesh);

    // --- RAIN-FED FOREGROUND POND (Bright Reflective Surface + Visible Shore Rim + Idle Rain Rings) ---
    const pondGroup = new THREE.Group();
    worldRoot.add(pondGroup);

    // Tactile sculpted pebble/stone shore rim around pond perimeter so it reads clearly at 320px
    const pondRimGeo = new THREE.RingGeometry(0.93, 1.06, 48);
    pondRimGeo.rotateX(-Math.PI / 2);
    pondRimGeo.scale(POND_RX, 1, POND_RZ);
    const pondRimMat = new THREE.MeshStandardMaterial({
      color: 0xa8997c,
      roughness: 0.72,
      metalness: 0.05
    });
    const pondRimMesh = new THREE.Mesh(pondRimGeo, pondRimMat);
    pondRimMesh.position.set(POND_X, WATER_Y + 0.008, POND_Z);
    pondRimMesh.receiveShadow = true;
    pondGroup.add(pondRimMesh);

    // Main water body with luminous sky reflection contrast
    const pondGeo = new THREE.CircleGeometry(0.95, 48);
    pondGeo.rotateX(-Math.PI / 2);
    pondGeo.scale(POND_RX, 1, POND_RZ);

    const pondMat = new THREE.MeshStandardMaterial({
      color: 0x26658c,
      emissive: 0x164466,
      emissiveIntensity: 0.65,
      roughness: 0.08,
      metalness: 0.28,
      transparent: true,
      opacity: 0.95
    });
    const pondMesh = new THREE.Mesh(pondGeo, pondMat);
    pondMesh.position.set(POND_X, WATER_Y, POND_Z);
    pondMesh.receiveShadow = true;
    pondGroup.add(pondMesh);

    // Bright sky-mirror highlight across the pond center
    const sheenGeo = new THREE.CircleGeometry(0.76, 40);
    sheenGeo.rotateX(-Math.PI / 2);
    sheenGeo.scale(POND_RX, 1, POND_RZ);
    const sheenMat = new THREE.MeshBasicMaterial({
      color: 0xaee2ff,
      transparent: true,
      opacity: 0.34
    });
    const sheenMesh = new THREE.Mesh(sheenGeo, sheenMat);
    sheenMesh.position.set(POND_X - 0.06, WATER_Y + 0.005, POND_Z - 0.04);
    pondGroup.add(sheenMesh);

    // Inner specular sun-glint patch
    const glintGeo = new THREE.CircleGeometry(0.42, 32);
    glintGeo.rotateX(-Math.PI / 2);
    glintGeo.scale(POND_RX, 1, POND_RZ);
    const glintMat = new THREE.MeshBasicMaterial({
      color: 0xe3f6ff,
      transparent: true,
      opacity: 0.38
    });
    const glintMesh = new THREE.Mesh(glintGeo, glintMat);
    glintMesh.position.set(POND_X + 0.14, WATER_Y + 0.007, POND_Z + 0.08);
    pondGroup.add(glintMesh);

    // Little green frog sitting on a shoreline stone
    const frogGroup = new THREE.Group();
    const frogBaseX = POND_X - POND_RX * 0.76;
    const frogBaseZ = POND_Z - POND_RZ * 0.38;
    const frogBaseY = Math.max(WATER_Y + 0.03, getTerrainHeight(frogBaseX, frogBaseZ));
    frogGroup.position.set(frogBaseX, frogBaseY, frogBaseZ);
    frogGroup.rotation.y = 0.72;
    worldRoot.add(frogGroup);

    const frogMat = new THREE.MeshStandardMaterial({ color: 0x56b847, roughness: 0.45 });
    const frogBellyMat = new THREE.MeshStandardMaterial({ color: 0xd8f088, roughness: 0.55 });
    const frogEyeMat = new THREE.MeshStandardMaterial({ color: 0x151a12, roughness: 0.2 });

    const frogBody = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 12), frogMat);
    frogBody.scale.set(1.0, 0.78, 1.25);
    frogBody.position.y = 0.07;
    frogBody.castShadow = true;
    frogGroup.add(frogBody);

    const frogBelly = new THREE.Mesh(new THREE.SphereGeometry(0.098, 12, 10), frogBellyMat);
    frogBelly.scale.set(0.9, 0.65, 1.1);
    frogBelly.position.set(0, 0.055, 0.02);
    frogGroup.add(frogBelly);

    [-0.045, 0.045].forEach((ex) => {
      const eyeBump = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 10), frogMat);
      eyeBump.position.set(ex, 0.148, 0.075);
      frogGroup.add(eyeBump);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.019, 8, 8), frogEyeMat);
      pupil.position.set(ex, 0.155, 0.098);
      frogGroup.add(pupil);
    });

    // Golden-orange koi/minnow fish under pond surface that flashes when pond is tapped
    const fishGroup = new THREE.Group();
    fishGroup.position.set(POND_X + 0.15, WATER_Y - 0.04, POND_Z + 0.1);
    worldRoot.add(fishGroup);

    const fishMat = new THREE.MeshStandardMaterial({
      color: 0xffa642,
      emissive: 0xff771a,
      emissiveIntensity: 0.45,
      roughness: 0.22
    });
    const fishBody = new THREE.Mesh(new THREE.ConeGeometry(0.072, 0.28, 12), fishMat);
    fishBody.rotation.x = Math.PI / 2;
    fishGroup.add(fishBody);
    const fishTail = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 4), fishMat);
    fishTail.rotation.x = -Math.PI / 2;
    fishTail.position.z = -0.16;
    fishGroup.add(fishTail);

    // --- SCATTERED ROCKS & LONELY FENCE POSTS ---
    const rockGeo = new THREE.DodecahedronGeometry(0.18, 1);
    const rockMat = new THREE.MeshStandardMaterial({
      color: 0x869098,
      roughness: 0.76,
      metalness: 0.08
    });

    const rockPlacements = [
      // Pond border stones framing the water edge
      [POND_X - 1.56, POND_Z - 0.25, 0.95, 0.58, 0.85],
      [POND_X - 1.38, POND_Z - 0.65, 0.68, 0.48, 0.60],
      [POND_X + 1.48, POND_Z - 0.42, 0.90, 0.54, 0.80],
      [POND_X + 0.68, POND_Z + 1.18, 0.78, 0.46, 0.70],
      [POND_X - 0.75, POND_Z + 1.14, 0.72, 0.44, 0.66],
      // Prairie field boulders
      [-2.35, 1.35, 1.25, 0.78, 1.1],
      [-2.02, 1.62, 0.72, 0.52, 0.68],
      [-2.62, -1.20, 1.35, 0.85, 1.15],
      [2.42, -1.55, 1.1, 0.68, 0.95],
      [0.35, -2.72, 1.4, 0.8, 1.2]
    ];

    rockPlacements.forEach(([rx, rz, sx, sy, sz]) => {
      const m = new THREE.Mesh(rockGeo, rockMat);
      const ry = getTerrainHeight(rx, rz);
      m.position.set(rx, ry + sy * 0.06, rz);
      m.scale.set(sx, sy, sz);
      m.rotation.set(rand() * 2, rand() * 3, rand() * 2);
      m.castShadow = true;
      m.receiveShadow = true;
      worldRoot.add(m);
    });

    // Lonely wooden fence posts & weathered rails along a curved prairie path
    const fenceGroup = new THREE.Group();
    worldRoot.add(fenceGroup);

    const woodMat = new THREE.MeshStandardMaterial({
      color: 0x7d583a,
      roughness: 0.86,
      metalness: 0.04
    });
    const postGeo = new THREE.CylinderGeometry(0.068, 0.078, 0.78, 10);
    const capGeo = new THREE.ConeGeometry(0.072, 0.09, 10);

    const postCoords = [
      { x: -2.72, z: 0.52, tiltX: 0.06, tiltZ: -0.08, rotY: 0.2 },
      { x: -1.85, z: 0.04, tiltX: -0.04, tiltZ: 0.05, rotY: 0.8 },
      { x: -0.98, z: -0.40, tiltX: 0.09, tiltZ: 0.11, rotY: 1.4 },
      { x: -0.10, z: -0.85, tiltX: -0.05, tiltZ: -0.04, rotY: 2.1 },
      { x: 1.58, z: -1.38, tiltX: 0.12, tiltZ: -0.09, rotY: 0.5 }
    ];

    const postTops = [];
    postCoords.forEach((p) => {
      const pGroup = new THREE.Group();
      const gy = getTerrainHeight(p.x, p.z);
      pGroup.position.set(p.x, gy, p.z);
      pGroup.rotation.set(p.tiltX, p.rotY, p.tiltZ);

      const post = new THREE.Mesh(postGeo, woodMat);
      post.position.y = 0.36;
      post.castShadow = true;
      post.receiveShadow = true;
      pGroup.add(post);

      const cap = new THREE.Mesh(capGeo, woodMat);
      cap.position.y = 0.79;
      cap.castShadow = true;
      pGroup.add(cap);

      fenceGroup.add(pGroup);
      postTops.push(new THREE.Vector3(p.x, gy + 0.52, p.z));
    });

    // Connect first three posts with rustic wooden rails
    for (let i = 0; i < 3; i++) {
      const a = postTops[i];
      const b = postTops[i + 1];
      [0, -0.22].forEach((offsetY, rIdx) => {
        if (i === 2 && rIdx === 1) return; // broken missing lower rail for character
        const start = a.clone().add(new THREE.Vector3(0, offsetY, 0));
        const end = b.clone().add(new THREE.Vector3(0, offsetY, 0));
        const dist = start.distanceTo(end);
        const railGeo = new THREE.CylinderGeometry(0.028, 0.028, dist, 8);
        railGeo.rotateX(Math.PI / 2);
        const rail = new THREE.Mesh(railGeo, woodMat);
        rail.position.copy(start).lerp(end, 0.5);
        rail.lookAt(end);
        rail.castShadow = true;
        fenceGroup.add(rail);
      });
    }

    // --- INSTANCED WIND-BENT GRASS TUFTS (Hundreds of blades, kept clear of pond front view) ---
    const GRASS_COUNT = 800;
    const bladeGeo = new THREE.ConeGeometry(0.048, 0.42, 4, 4);
    bladeGeo.translate(0, 0.21, 0);
    const bPos = bladeGeo.attributes.position;
    for (let i = 0; i < bPos.count; i++) {
      const y = bPos.getY(i);
      const t = y / 0.42;
      bPos.setX(i, bPos.getX(i) + t * t * 0.08);
    }
    bladeGeo.computeVertexNormals();

    const grassMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.68,
      metalness: 0.02
    });

    const grassInst = new THREE.InstancedMesh(bladeGeo, grassMat, GRASS_COUNT);
    grassInst.castShadow = true;
    grassInst.receiveShadow = true;
    worldRoot.add(grassInst);

    const grassData = [];
    const dummy = new THREE.Object3D();
    const baseGrassCol1 = new THREE.Color(0x63a644);
    const baseGrassCol2 = new THREE.Color(0x8fd158);
    const baseGrassCol3 = new THREE.Color(0x4e8c3c);
    const glowGrassCol = new THREE.Color(0xdfff9e);

    let gIdx = 0;
    while (gIdx < GRASS_COUNT) {
      const r = Math.sqrt(rand()) * (SLAB_RADIUS - 0.30);
      const theta = rand() * Math.PI * 2;
      const gx = Math.cos(theta) * r;
      const gz = Math.sin(theta) * r;
      const pf = getPondFactor(gx, gz);
      // Keep grass outside the pond rim so the water surface and shoreline rim are completely unobstructed
      if (pf < 1.18) continue;

      const gy = getTerrainHeight(gx, gz);
      const scaleY = randRange(0.65, 1.38) * (pf < 1.38 && gz < POND_Z ? 1.15 : 0.95);
      const scaleXZ = randRange(0.75, 1.25);
      const rotY = randRange(-0.45, 0.45) + 0.35;
      const baseTilt = randRange(0.18, 0.42);
      const phase = rand() * Math.PI * 2;

      const cMix = rand();
      const baseCol = new THREE.Color().copy(baseGrassCol1)
        .lerp(baseGrassCol2, cMix)
        .lerp(baseGrassCol3, rand() * 0.35);

      grassData.push({
        x: gx,
        y: gy - 0.02,
        z: gz,
        scaleY,
        scaleXZ,
        rotY,
        baseTilt,
        phase,
        baseCol,
        curCol: baseCol.clone()
      });

      dummy.position.set(gx, gy - 0.02, gz);
      dummy.rotation.set(0, rotY, -baseTilt);
      dummy.scale.set(scaleXZ, scaleY, scaleXZ);
      dummy.updateMatrix();
      grassInst.setMatrixAt(gIdx, dummy.matrix);
      grassInst.setColorAt(gIdx, baseCol);
      gIdx++;
    }
    grassInst.instanceMatrix.needsUpdate = true;
    grassInst.instanceColor.needsUpdate = true;

    // --- SCATTERED WILDFLOWERS (Warm Yellow & Violet Accents) ---
    const FLOWER_COUNT = 110;
    const flowerGeo = new THREE.DodecahedronGeometry(0.068, 0);
    flowerGeo.translate(0, 0.28, 0);
    const flowerMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.45,
      metalness: 0.05
    });
    const flowerInst = new THREE.InstancedMesh(flowerGeo, flowerMat, FLOWER_COUNT);
    flowerInst.castShadow = true;
    worldRoot.add(flowerInst);

    const flowerData = [];
    const colYellow = new THREE.Color(0xffd53d);
    const colGold = new THREE.Color(0xffae2b);
    const colViolet = new THREE.Color(0xa66cff);
    const colLavender = new THREE.Color(0xc996ff);

    let fIdx = 0;
    while (fIdx < FLOWER_COUNT) {
      const r = Math.sqrt(rand()) * (SLAB_RADIUS - 0.44);
      const theta = rand() * Math.PI * 2;
      const fx = Math.cos(theta) * r;
      const fz = Math.sin(theta) * r;
      if (getPondFactor(fx, fz) < 1.26) continue;

      const fy = getTerrainHeight(fx, fz);
      const sc = randRange(0.75, 1.3);
      const phase = rand() * Math.PI * 2;
      const isYellow = rand() > 0.42;
      const fCol = isYellow
        ? new THREE.Color().copy(colYellow).lerp(colGold, rand())
        : new THREE.Color().copy(colViolet).lerp(colLavender, rand());

      flowerData.push({ x: fx, y: fy, z: fz, sc, phase });
      dummy.position.set(fx, fy, fz);
      dummy.rotation.set(0, rand() * Math.PI * 2, 0);
      dummy.scale.setScalar(sc);
      dummy.updateMatrix();
      flowerInst.setMatrixAt(fIdx, dummy.matrix);
      flowerInst.setColorAt(fIdx, fCol);
      fIdx++;
    }
    flowerInst.instanceMatrix.needsUpdate = true;
    flowerInst.instanceColor.needsUpdate = true;

    // --- CUMULONIMBUS STORM CELL (Classic Wide Flat Anvil + Compact Darker Base Held HIGH Above Prairie) ---
    // Vertically compact (~2.6 units total thickness) and held high (base at y ~ 4.4..5.2) so there is a generous,
    // unmistakable open AIR GAP between the cloud base and the prairie below.
    const cloudGroup = new THREE.Group();
    const CLOUD_CENTER_X = -0.58;
    const CLOUD_CENTER_Z = -0.55;
    let currentCloudCenterY = 5.45;
    let currentCloudBaseWorldY = 4.35;
    cloudGroup.position.set(CLOUD_CENTER_X, currentCloudCenterY, CLOUD_CENTER_Z);
    worldRoot.add(cloudGroup);

    const matAnvilCrown = new THREE.MeshStandardMaterial({
      color: 0xeaf3fb,
      emissive: 0x354d66,
      emissiveIntensity: 0.22,
      roughness: 0.64,
      metalness: 0.03
    });
    const matMidTower = new THREE.MeshStandardMaterial({
      color: 0xb5c8db,
      emissive: 0x2a3f57,
      emissiveIntensity: 0.25,
      roughness: 0.7,
      metalness: 0.04
    });
    const matRaggedBase = new THREE.MeshStandardMaterial({
      color: 0x677c94,
      emissive: 0x1d3047,
      emissiveIntensity: 0.28,
      roughness: 0.76,
      metalness: 0.05
    });
    const cloudMaterials = [matAnvilCrown, matMidTower, matRaggedBase];

    // Sculpted low-poly beveled puff geometry
    const puffGeo = new THREE.IcosahedronGeometry(1.0, 2);
    const pAttr = puffGeo.attributes.position;
    for (let i = 0; i < pAttr.count; i++) {
      const vx = pAttr.getX(i);
      const vy = pAttr.getY(i);
      const vz = pAttr.getZ(i);
      const n = 1.0 + 0.06 * Math.sin(vx * 4.0) * Math.cos(vy * 4.0) * Math.sin(vz * 4.0);
      pAttr.setXYZ(i, vx * n, vy * n, vz * n);
    }
    puffGeo.computeVertexNormals();

    // Spec: [x, y, z, sx, sy, sz, tier (0=wide anvil crown, 1=sculpted mid neck, 2=compact ragged base)]
    // Local y spans only from -0.95 (base) to +1.45 (overshooting anvil top) -> classic wide anvil silhouette!
    const puffSpecs = [
      // Wide Flat Anvil Top & Forward-Spreading Shelf (local y: +0.82 to +1.28)
      [0.05, 1.24, 0.0, 1.55, 0.42, 1.38, 0],
      [0.42, 0.98, 0.08, 2.75, 0.38, 2.15, 0],
      [-1.55, 0.94, -0.12, 1.95, 0.36, 1.68, 0],
      [1.95, 0.96, 0.24, 2.15, 0.35, 1.68, 0], // Wide forward anvil wing
      [2.95, 1.00, 0.36, 1.45, 0.28, 1.28, 0], // Anvil leading edge tip
      [0.18, 0.92, 1.35, 1.78, 0.34, 1.28, 0],
      [-0.25, 0.92, -1.28, 1.82, 0.35, 1.28, 0],
      [-2.42, 0.90, 0.08, 1.35, 0.30, 1.18, 0],

      // Sculpted Convective Mid-Section (local y: +0.05 to +0.52)
      [-0.55, 0.38, 0.20, 1.48, 0.58, 1.35, 1],
      [0.65, 0.40, -0.18, 1.45, 0.56, 1.30, 1],
      [0.05, 0.22, 0.82, 1.32, 0.52, 1.15, 1],
      [-0.20, 0.25, -0.78, 1.35, 0.54, 1.18, 1],
      [-1.32, 0.14, -0.08, 1.18, 0.48, 1.06, 1],
      [1.28, 0.18, 0.28, 1.22, 0.48, 1.05, 1],

      // Compact Darker Ragged Rain Base (local y: -0.72 to -0.32)
      [0.0, -0.36, 0.0, 1.92, 0.36, 1.62, 2],
      [-1.08, -0.46, 0.18, 1.28, 0.32, 1.15, 2],
      [1.05, -0.44, -0.15, 1.28, 0.32, 1.14, 2],
      [0.22, -0.50, 0.78, 1.16, 0.30, 1.02, 2],
      [-0.30, -0.48, -0.75, 1.18, 0.30, 1.02, 2],
      [-0.55, -0.64, -0.12, 0.88, 0.26, 0.85, 2],
      [0.52, -0.66, 0.20, 0.86, 0.26, 0.82, 2],
      [0.0, -0.70, 0.32, 0.78, 0.24, 0.75, 2]
    ];

    const cloudPuffs = [];
    puffSpecs.forEach((spec, idx) => {
      const [px, py, pz, sx, sy, sz, tier] = spec;
      const mesh = new THREE.Mesh(puffGeo, cloudMaterials[tier]);
      mesh.position.set(px, py, pz);
      mesh.scale.set(sx, sy, sz);
      mesh.rotation.set(rand() * 0.5, rand() * Math.PI * 2, rand() * 0.5);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      cloudGroup.add(mesh);
      cloudPuffs.push({
        mesh,
        baseX: px,
        baseY: py,
        baseZ: pz,
        sx,
        sy,
        sz,
        phase: idx * 0.75 + rand() * 2.0
      });
    });

    // --- DISTINCT TRANSLUCENT RAIN CURTAIN SHAFT & FALLING RAIN STREAKS ---
    // Two nested translucent shafts (outer veil + inner core) spanning the open air gap under the cloud base
    const rainCurtainGroup = new THREE.Group();
    rainCurtainGroup.position.set(CLOUD_CENTER_X + 0.18, 2.2, CLOUD_CENTER_Z + 0.18);
    rainCurtainGroup.rotation.z = -0.09; // Gentle wind slant toward the foreground pond
    worldRoot.add(rainCurtainGroup);

    const outerShaftGeo = new THREE.CylinderGeometry(1.42, 1.78, 1.0, 32, 1, true);
    const outerShaftMat = new THREE.MeshBasicMaterial({
      color: 0xa8cbe8,
      transparent: true,
      opacity: 0.18,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const outerShaftMesh = new THREE.Mesh(outerShaftGeo, outerShaftMat);
    rainCurtainGroup.add(outerShaftMesh);

    const innerShaftGeo = new THREE.CylinderGeometry(0.92, 1.18, 1.0, 28, 1, true);
    const innerShaftMat = new THREE.MeshBasicMaterial({
      color: 0xd0e8ff,
      transparent: true,
      opacity: 0.16,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const innerShaftMesh = new THREE.Mesh(innerShaftGeo, innerShaftMat);
    rainCurtainGroup.add(innerShaftMesh);

    // Instanced falling rain streaks clearly visible inside the open air gap
    const RAIN_COUNT = 380;
    const streakGeo = new THREE.CylinderGeometry(0.013, 0.013, 0.58, 5);
    const streakMat = new THREE.MeshBasicMaterial({
      color: 0xe6f4ff,
      transparent: true,
      opacity: 0.78,
      depthWrite: false
    });
    const rainInst = new THREE.InstancedMesh(streakGeo, streakMat, RAIN_COUNT);
    worldRoot.add(rainInst);

    const rainDrops = [];
    for (let i = 0; i < RAIN_COUNT; i++) {
      const r = Math.sqrt(rand()) * 1.65;
      const a = rand() * Math.PI * 2;
      rainDrops.push({
        ox: Math.cos(a) * r,
        oz: Math.sin(a) * r,
        y: randRange(0.1, 4.8),
        speed: randRange(6.8, 9.4),
        len: randRange(0.82, 1.42)
      });
    }

    // Prominent idle rain rings across the foreground pond so the pond immediately reads as active water
    const IDLE_RIPPLE_COUNT = 8;
    const ringGeo = new THREE.RingGeometry(0.09, 0.14, 32);
    ringGeo.rotateX(-Math.PI / 2);
    const idleRipples = [];
    const idleRippleOffsets = [
      [-0.55, -0.25],
      [0.25, -0.35],
      [-0.20, 0.28],
      [0.52, 0.18],
      [-0.68, 0.22],
      [0.05, -0.05],
      [0.42, -0.18],
      [-0.32, -0.42]
    ];
    for (let i = 0; i < IDLE_RIPPLE_COUNT; i++) {
      const rMat = new THREE.MeshBasicMaterial({
        color: 0xeaf7ff,
        transparent: true,
        opacity: 0,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const rMesh = new THREE.Mesh(ringGeo, rMat);
      worldRoot.add(rMesh);
      idleRipples.push({
        mesh: rMesh,
        mat: rMat,
        phase: i / IDLE_RIPPLE_COUNT,
        x: POND_X + idleRippleOffsets[i][0],
        z: POND_Z + idleRippleOffsets[i][1]
      });
    }

    // --- INTERACTION 1: UNOCCLUDED CLOUD-TO-GROUND LIGHTNING STRIKE SYSTEM ---
    const lightningGroup = new THREE.Group();
    worldRoot.add(lightningGroup);

    const boltCoreMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0
    });
    const boltHaloMat = new THREE.MeshBasicMaterial({
      color: 0x6ec4ff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    // Ground impact glow disc
    const impactDiscGeo = new THREE.CircleGeometry(1.28, 32);
    impactDiscGeo.rotateX(-Math.PI / 2);
    const impactDiscMat = new THREE.MeshBasicMaterial({
      color: 0xa6e4ff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const impactDiscMesh = new THREE.Mesh(impactDiscGeo, impactDiscMat);
    worldRoot.add(impactDiscMesh);

    // Pre-build reusable segment meshes for main bolt + 2 forks
    const MAX_BOLT_SEGS = 18;
    const boltSegments = [];
    const segCylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 8);
    segCylinderGeo.translate(0, 0.5, 0);
    segCylinderGeo.rotateX(Math.PI / 2);

    for (let i = 0; i < MAX_BOLT_SEGS; i++) {
      const core = new THREE.Mesh(segCylinderGeo, boltCoreMat);
      const halo = new THREE.Mesh(segCylinderGeo, boltHaloMat);
      core.visible = false;
      halo.visible = false;
      lightningGroup.add(core);
      lightningGroup.add(halo);
      boltSegments.push({ core, halo });
    }

    // Foreground-left / mid-prairie strike points completely unoccluded from the default camera
    // and positioned right against the darker rain shaft / slate background for high contrast
    const strikeTargets = [
      { x: -0.68, z: 0.52 },
      { x: -1.18, z: 0.78 },
      { x: -0.28, z: 0.35 },
      { x: -0.92, z: 0.22 }
    ];
    let strikeCounter = 0;
    let strikeState = {
      active: false,
      startTime: -99999,
      targetX: -0.68,
      targetY: 0.24,
      targetZ: 0.52
    };

    function placeSegment(seg, pA, pB, radius) {
      const dist = pA.distanceTo(pB);
      seg.core.position.copy(pA);
      seg.core.lookAt(pB);
      seg.core.scale.set(radius, radius, dist);
      seg.core.visible = true;

      seg.halo.position.copy(pA);
      seg.halo.lookAt(pB);
      seg.halo.scale.set(radius * 3.1, radius * 3.1, dist);
      seg.halo.visible = true;
    }

    function triggerLightning(now) {
      const target = strikeTargets[strikeCounter % strikeTargets.length];
      strikeCounter++;
      const gy = getTerrainHeight(target.x, target.z);

      strikeState.active = true;
      strikeState.startTime = now;
      strikeState.targetX = target.x;
      strikeState.targetY = gy;
      strikeState.targetZ = target.z;

      impactDiscMesh.position.set(target.x, gy + 0.04, target.z);
      strikeFlashLight.position.set(target.x, currentCloudBaseWorldY * 0.65, target.z);

      // Originate bolt just below the front-bottom of the darker cloud base so the entire cloud-to-ground
      // jagged path is 100% visible across the open air gap & dark rain curtain from the default camera
      const startPt = new THREE.Vector3(
        target.x * 0.65 + CLOUD_CENTER_X * 0.35,
        currentCloudBaseWorldY - 0.04,
        target.z * 0.55 + (CLOUD_CENTER_Z + 0.45) * 0.45
      );
      const endPt = new THREE.Vector3(target.x, gy + 0.02, target.z);

      const mainSteps = 10;
      const mainPts = [startPt];
      for (let i = 1; i < mainSteps; i++) {
        const t = i / mainSteps;
        const p = new THREE.Vector3().lerpVectors(startPt, endPt, t);
        const spread = (1 - Math.abs(t - 0.5) * 1.5) * 0.48;
        p.x += randRange(-spread, spread);
        p.z += randRange(-spread * 0.6, spread * 0.6);
        mainPts.push(p);
      }
      mainPts.push(endPt);

      let sIdx = 0;
      for (let i = 0; i < mainSteps; i++) {
        // Bold, unmistakable bolt thickness at 320px
        const thick = THREE.MathUtils.lerp(0.095, 0.056, i / mainSteps);
        placeSegment(boltSegments[sIdx++], mainPts[i], mainPts[i + 1], thick);
      }

      // Branch fork 1 (splits left across the rain curtain)
      const fork1Start = mainPts[3].clone();
      let f1Prev = fork1Start;
      for (let i = 0; i < 4; i++) {
        const fNext = f1Prev.clone().add(new THREE.Vector3(
          randRange(-0.48, -0.18),
          randRange(-0.55, -0.35),
          randRange(-0.22, 0.25)
        ));
        placeSegment(boltSegments[sIdx++], f1Prev, fNext, 0.042 * (1 - i * 0.18));
        f1Prev = fNext;
      }

      // Branch fork 2 (splits right across the rain curtain)
      const fork2Start = mainPts[6].clone();
      let f2Prev = fork2Start;
      for (let i = 0; i < 4; i++) {
        const fNext = f2Prev.clone().add(new THREE.Vector3(
          randRange(0.18, 0.48),
          randRange(-0.50, -0.30),
          randRange(-0.22, 0.25)
        ));
        placeSegment(boltSegments[sIdx++], f2Prev, fNext, 0.038 * (1 - i * 0.18));
        f2Prev = fNext;
      }
    }

    // --- INTERACTION 2: POND SPLASH, EXPANDING RIPPLES, DROPLETS & FROG HOP ---
    const SPLASH_RINGS = 4;
    const splashRings = [];
    const splashRingGeo = new THREE.RingGeometry(0.11, 0.165, 36);
    splashRingGeo.rotateX(-Math.PI / 2);

    for (let i = 0; i < SPLASH_RINGS; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(splashRingGeo, mat);
      mesh.visible = false;
      worldRoot.add(mesh);
      splashRings.push({ mesh, mat, delay: i * 115 });
    }

    // Instanced splash water droplets
    const DROPLET_COUNT = 64;
    const dropletGeo = new THREE.SphereGeometry(0.046, 8, 8);
    const dropletMat = new THREE.MeshStandardMaterial({
      color: 0xe6f6ff,
      emissive: 0x6cb8ff,
      emissiveIntensity: 0.45,
      roughness: 0.15
    });
    const dropletInst = new THREE.InstancedMesh(dropletGeo, dropletMat, DROPLET_COUNT);
    dropletInst.visible = false;
    worldRoot.add(dropletInst);

    const dropletVel = [];
    for (let i = 0; i < DROPLET_COUNT; i++) {
      dropletVel.push({ vx: 0, vy: 0, vz: 0, sc: 1 });
    }

    let splashState = {
      active: false,
      startTime: -99999,
      originX: POND_X,
      originZ: POND_Z
    };

    function triggerPondSplash(now, hitPoint) {
      let sx = POND_X;
      let sz = POND_Z;
      if (hitPoint) {
        const dx = hitPoint.x - POND_X;
        const dz = hitPoint.z - POND_Z;
        const maxD = 0.72;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d > maxD) {
          sx = POND_X + (dx / d) * maxD;
          sz = POND_Z + (dz / d) * maxD;
        } else {
          sx = hitPoint.x;
          sz = hitPoint.z;
        }
      }

      splashState.active = true;
      splashState.startTime = now;
      splashState.originX = sx;
      splashState.originZ = sz;

      dropletInst.visible = true;
      for (let i = 0; i < DROPLET_COUNT; i++) {
        const ang = (i / DROPLET_COUNT) * Math.PI * 2 + randRange(-0.15, 0.15);
        const spd = randRange(0.55, 1.9);
        dropletVel[i].vx = Math.cos(ang) * spd;
        dropletVel[i].vz = Math.sin(ang) * spd;
        dropletVel[i].vy = randRange(2.2, 3.9);
        dropletVel[i].sc = randRange(0.7, 1.4);
      }

      splashRings.forEach((r) => {
        r.mesh.position.set(sx, WATER_Y + 0.014, sz);
        r.mesh.visible = true;
      });
    }

    // --- GENEROUS INVISIBLE PROXY TARGETS FOR RAYCASTING (Easy tapping at 320px) ---
    const proxyMat = new THREE.MeshBasicMaterial({ visible: false });

    const cloudProxy = new THREE.Mesh(new THREE.SphereGeometry(3.1, 16, 12), proxyMat);
    cloudProxy.scale.set(1.42, 0.65, 1.18);
    cloudProxy.position.set(CLOUD_CENTER_X + 0.25, currentCloudCenterY + 0.25, CLOUD_CENTER_Z);
    cloudProxy.userData.targetType = 'cloud';
    worldRoot.add(cloudProxy);

    const pondProxy = new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.15, 0.9, 24), proxyMat);
    pondProxy.position.set(POND_X, WATER_Y + 0.12, POND_Z);
    pondProxy.userData.targetType = 'pond';
    worldRoot.add(pondProxy);

    const interactProxies = [cloudProxy, pondProxy];

    // --- POINTER / TOUCH RAYCASTING (Distinguish tap vs orbit drag) ---
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let downX = 0;
    let downY = 0;
    let downTime = 0;

    function updatePointerNDC(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      downX = e.clientX;
      downY = e.clientY;
      downTime = performance.now();
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      updatePointerNDC(e.clientX, e.clientY);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(interactProxies, false);
      renderer.domElement.classList.toggle('pointer-hover', hits.length > 0);
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const moveDist = Math.hypot(e.clientX - downX, e.clientY - downY);
      const elapsed = performance.now() - downTime;
      if (moveDist > 12 || elapsed > 600) return; // Dragged orbit, not a tap

      updatePointerNDC(e.clientX, e.clientY);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(interactProxies, false);
      if (hits.length > 0) {
        const hit = hits[0];
        const now = performance.now();
        if (hit.object.userData.targetType === 'cloud') {
          triggerLightning(now);
        } else if (hit.object.userData.targetType === 'pond') {
          triggerPondSplash(now, hit.point);
        }
      }
    });

    // --- ASPECT-ADAPTIVE VERTICAL STACKING (HIGH ANVIL + WIDE AIR GAP + PRAIRIE) & CAMERA FIT ---
    const keyWorldSamples = [];
    const tempCorner = new THREE.Vector3();

    function rebuildKeySamples() {
      keyWorldSamples.length = 0;
      // 16 points around the slab top and plinth bottom rim
      for (let i = 0; i < 16; i++) {
        const ang = (i / 16) * Math.PI * 2;
        const sx = Math.cos(ang) * SLAB_RADIUS;
        const sz = Math.sin(ang) * SLAB_RADIUS;
        keyWorldSamples.push(new THREE.Vector3(sx, 0.35, sz));
        keyWorldSamples.push(new THREE.Vector3(sx * 0.96, -1.06, sz * 0.96));
      }
      // Every cloud puff's outer extents in world space
      const cScaleX = cloudGroup.scale.x;
      const cScaleY = cloudGroup.scale.y;
      const cScaleZ = cloudGroup.scale.z;
      for (let i = 0; i < cloudPuffs.length; i++) {
        const cp = cloudPuffs[i];
        const wx = CLOUD_CENTER_X + cp.baseX * cScaleX;
        const wy = currentCloudCenterY + cp.baseY * cScaleY;
        const wz = CLOUD_CENTER_Z + cp.baseZ * cScaleZ;
        const rx = cp.sx * cScaleX * 1.03;
        const ry = cp.sy * cScaleY * 1.05;
        const rz = cp.sz * cScaleZ * 1.03;
        keyWorldSamples.push(new THREE.Vector3(wx + rx, wy, wz));
        keyWorldSamples.push(new THREE.Vector3(wx - rx, wy, wz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy + ry, wz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy - ry, wz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy, wz + rz));
        keyWorldSamples.push(new THREE.Vector3(wx, wy, wz - rz));
      }
    }

    function fitCameraToScene() {
      const vw = Math.max(1, window.innerWidth);
      const vh = Math.max(1, window.innerHeight);
      renderer.setSize(vw, vh);

      const headerH = headerEl ? headerEl.getBoundingClientRect().height : 68;
      const footerH = footerEl ? footerEl.getBoundingClientRect().height : 32;

      const safeTopPx = headerH + 6;
      const safeBotPx = footerH + 6;
      const usableW = vw * 0.94;
      const usableH = Math.max(120, vh - safeTopPx - safeBotPx);
      const usableAspect = usableW / usableH;

      // Portrait presence comes from holding the compact, wide-anvil cumulonimbus HIGH above the prairie,
      // creating a dramatic vertical air gap for the translucent rain curtain & lightning bolt.
      const portraitness = THREE.MathUtils.clamp((1.05 - usableAspect) / 0.52, 0, 1);

      // Keep the cloud compact vertically (~half the previous height) with a wide anvil top
      const cloudScaleX = THREE.MathUtils.lerp(1.04, 0.96, portraitness);
      const cloudScaleY = THREE.MathUtils.lerp(0.95, 1.08, portraitness);
      const cloudScaleZ = THREE.MathUtils.lerp(1.02, 0.96, portraitness);
      cloudGroup.scale.set(cloudScaleX, cloudScaleY, cloudScaleZ);

      // Elevate the entire cloud high above the prairie so the open air gap between cloud base (y ~ 4.2..5.55)
      // and the prairie (y ~ 0.25) is huge, clear, and never occludes the pond or bolt!
      currentCloudBaseWorldY = THREE.MathUtils.lerp(3.95, 5.55, portraitness);
      currentCloudCenterY = currentCloudBaseWorldY + 0.88 * cloudScaleY;
      cloudGroup.position.set(CLOUD_CENTER_X, currentCloudCenterY, CLOUD_CENTER_Z);

      // Span the translucent dual-layer rain curtain through the open air gap from cloud base to prairie
      const shaftTopY = currentCloudBaseWorldY + 0.12;
      const shaftBotY = 0.15;
      const shaftHeight = shaftTopY - shaftBotY;
      rainCurtainGroup.scale.set(1, shaftHeight, 1);
      rainCurtainGroup.position.set(
        CLOUD_CENTER_X + 0.18,
        shaftBotY + shaftHeight * 0.5,
        CLOUD_CENTER_Z + 0.18
      );

      // Update cloud raycast proxy to match elevated compact anvil cloud
      cloudProxy.scale.set(1.42 * cloudScaleX, 0.68 * cloudScaleY, 1.18 * cloudScaleZ);
      cloudProxy.position.set(CLOUD_CENTER_X + 0.25, currentCloudCenterY + 0.22 * cloudScaleY, CLOUD_CENTER_Z);
      cloudInternalLight.position.set(CLOUD_CENTER_X, currentCloudCenterY + 0.15, CLOUD_CENTER_Z);

      rebuildKeySamples();

      const aspect = vw / vh;
      camera.fov = aspect < 1.0 ? 43 : 36;
      camera.aspect = aspect;

      // Slightly elevated three-quarter view direction that looks down onto the foreground pond
      // and straight through the open rain gap under the high anvil cloud
      const viewDir = new THREE.Vector3(0.50, 0.34, 0.795).normalize();
      const camForward = viewDir.clone().negate();
      const worldUp = new THREE.Vector3(0, 1, 0);
      const camRight = new THREE.Vector3().crossVectors(camForward, worldUp).normalize();
      const camUp = new THREE.Vector3().crossVectors(camRight, camForward).normalize();

      // Find initial centroid in camera-plane coordinates
      let minU = Infinity, maxU = -Infinity;
      let minV = Infinity, maxV = -Infinity;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const p = keyWorldSamples[i];
        const u = p.dot(camRight);
        const v = p.dot(camUp);
        if (u < minU) minU = u;
        if (u > maxU) maxU = u;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      }

      const midU = (minU + maxU) * 0.5;
      const midV = (minV + maxV) * 0.5;
      const targetCenter = new THREE.Vector3()
        .addScaledVector(camRight, midU)
        .addScaledVector(camUp, midV);

      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const tanHalfVFov = Math.tan(vFovRad * 0.5) * (usableH / vh) * 0.96;
      const tanHalfHFov = Math.tan(vFovRad * 0.5) * aspect * (usableW / vw) * 0.96;

      // Perspective-exact distance required so every sample projects inside [usableW x usableH]
      let requiredDist = 6.0;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const rel = tempCorner.copy(keyWorldSamples[i]).sub(targetCenter);
        const zProj = rel.dot(viewDir);
        const xProj = Math.abs(rel.dot(camRight));
        const yProj = Math.abs(rel.dot(camUp));

        const dH = xProj / tanHalfHFov + zProj;
        const dV = yProj / tanHalfVFov + zProj;
        if (dH > requiredDist) requiredDist = dH;
        if (dV > requiredDist) requiredDist = dV;
      }

      // Refine vertical & horizontal centering for perspective depth differences
      let topSlopeMax = -Infinity, botSlopeMin = Infinity;
      let rightSlopeMax = -Infinity, leftSlopeMin = Infinity;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const rel = tempCorner.copy(keyWorldSamples[i]).sub(targetCenter);
        const depth = Math.max(1.0, requiredDist - rel.dot(viewDir));
        const slopeX = rel.dot(camRight) / depth;
        const slopeY = rel.dot(camUp) / depth;
        if (slopeX > rightSlopeMax) rightSlopeMax = slopeX;
        if (slopeX < leftSlopeMin) leftSlopeMin = slopeX;
        if (slopeY > topSlopeMax) topSlopeMax = slopeY;
        if (slopeY < botSlopeMin) botSlopeMin = slopeY;
      }
      const slopeMidOffsetX = (rightSlopeMax + leftSlopeMin) * 0.5 * requiredDist;
      const slopeMidOffsetY = (topSlopeMax + botSlopeMin) * 0.5 * requiredDist;
      targetCenter.addScaledVector(camRight, slopeMidOffsetX * 0.85);
      targetCenter.addScaledVector(camUp, slopeMidOffsetY * 0.85);

      // Recompute exact tight distance around perspective-centered target
      requiredDist = 6.0;
      for (let i = 0; i < keyWorldSamples.length; i++) {
        const rel = tempCorner.copy(keyWorldSamples[i]).sub(targetCenter);
        const zProj = rel.dot(viewDir);
        const xProj = Math.abs(rel.dot(camRight));
        const yProj = Math.abs(rel.dot(camUp));

        const dH = xProj / tanHalfHFov + zProj;
        const dV = yProj / tanHalfVFov + zProj;
        if (dH > requiredDist) requiredDist = dH;
        if (dV > requiredDist) requiredDist = dV;
      }

      const finalDist = requiredDist * 1.02;

      // Shift target vertically so the usable viewport center sits exactly between header and footer
      const pixelOffsetY = (safeTopPx - safeBotPx) * 0.5;
      const worldPerPixel = (2 * finalDist * Math.tan(vFovRad * 0.5)) / vh;
      const shiftedTarget = targetCenter.clone().addScaledVector(camUp, pixelOffsetY * worldPerPixel);

      controls.target.copy(shiftedTarget);
      camera.position.copy(shiftedTarget).addScaledVector(viewDir, finalDist);
      camera.updateProjectionMatrix();

      // Lock zoom range around the computed optimal distance
      controls.minDistance = finalDist * 0.88;
      controls.maxDistance = finalDist * 1.16;
      controls.update();
    }

    fitCameraToScene();
    window.addEventListener('resize', fitCameraToScene);

    // --- ANIMATION LOOP (All motion driven by performance.now()) ---
    const tempMat = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function animate(nowMs) {
      requestAnimationFrame(animate);
      const t = nowMs * 0.001;

      // 1. CLOUD IDLE BOIL, DRIFT & OCCASIONAL INTERNAL RUMBLE GLOW
      const driftX = Math.sin(t * 0.45) * 0.12;
      const driftY = Math.cos(t * 0.6) * 0.05;
      cloudGroup.position.set(
        CLOUD_CENTER_X + driftX,
        currentCloudCenterY + driftY,
        CLOUD_CENTER_Z + Math.sin(t * 0.35) * 0.07
      );
      rainCurtainGroup.position.x = CLOUD_CENTER_X + 0.18 + driftX * 0.8;

      for (let i = 0; i < cloudPuffs.length; i++) {
        const cp = cloudPuffs[i];
        const boil = 1.0 + 0.036 * Math.sin(t * 1.55 + cp.phase);
        cp.mesh.scale.set(cp.sx * boil, cp.sy * (2.0 - boil * 0.96), cp.sz * boil);
        cp.mesh.position.y = cp.baseY + Math.sin(t * 1.2 + cp.phase) * 0.032;
      }

      // Faint periodic internal cloud glow in idle state
      const idlePulse = Math.pow(Math.max(0, Math.sin(t * 1.15) * Math.sin(t * 2.7 + 1.2)), 6.0);

      // 2. LIGHTNING STRIKE FLICKER, RAIN CURTAIN FLASH & SCENE ILLUMINATION
      let strikeIntensity = 0;
      let groundGlow = 0;
      if (strikeState.active) {
        const dt = nowMs - strikeState.startTime;
        if (dt < 850) {
          let boltAlpha = 0;
          if (dt < 65) boltAlpha = 1.0;
          else if (dt < 110) boltAlpha = 0.22;
          else if (dt < 185) boltAlpha = 0.98;
          else if (dt < 240) boltAlpha = 0.16;
          else if (dt < 310) boltAlpha = 0.80;
          else if (dt < 480) boltAlpha = Math.max(0, 1 - (dt - 310) / 170) * 0.50;

          boltCoreMat.opacity = boltAlpha;
          boltHaloMat.opacity = boltAlpha * 0.92;
          strikeIntensity = boltAlpha;
          groundGlow = Math.max(0, 1 - dt / 780);
          impactDiscMat.opacity = groundGlow * 0.78;
          const discScale = 0.65 + 0.82 * Math.sin(Math.min(1, dt / 380) * Math.PI * 0.5);
          impactDiscMesh.scale.setScalar(discScale);
        } else {
          strikeState.active = false;
          boltCoreMat.opacity = 0;
          boltHaloMat.opacity = 0;
          impactDiscMat.opacity = 0;
          for (let i = 0; i < MAX_BOLT_SEGS; i++) {
            boltSegments[i].core.visible = false;
            boltSegments[i].halo.visible = false;
          }
        }
      }

      // Apply internal cloud pulse + scene flash + illuminated rain curtain during lightning
      const totalCloudGlow = idlePulse * 1.2 + strikeIntensity * 5.8;
      cloudInternalLight.intensity = 0.5 + totalCloudGlow * 2.4;
      strikeFlashLight.intensity = strikeIntensity * 15.0;
      matAnvilCrown.emissiveIntensity = 0.22 + totalCloudGlow * 0.18;
      matMidTower.emissiveIntensity = 0.25 + totalCloudGlow * 0.28;
      matRaggedBase.emissiveIntensity = 0.28 + totalCloudGlow * 0.44;

      // Light up the rain curtain shaft & streaks when lightning flashes
      outerShaftMat.opacity = 0.18 + strikeIntensity * 0.34;
      innerShaftMat.opacity = 0.16 + strikeIntensity * 0.38;
      streakMat.opacity = 0.78 + strikeIntensity * 0.22;

      // 3. FALLING RAIN STREAKS THROUGH THE OPEN AIR GAP & IDLE POND RAIN RINGS
      const rainTopY = currentCloudBaseWorldY + 0.05;
      const rainSpan = Math.max(2.2, rainTopY - 0.15);
      tempEuler.set(0, 0, -0.09);
      tempQuat.setFromEuler(tempEuler);
      for (let i = 0; i < RAIN_COUNT; i++) {
        const rd = rainDrops[i];
        const curY = rainTopY - ((t * rd.speed + rd.y) % rainSpan);
        const slantOffset = (rainTopY - curY) * 0.09;
        tempPos.set(
          CLOUD_CENTER_X + 0.18 + driftX * 0.7 + rd.ox + slantOffset,
          curY,
          CLOUD_CENTER_Z + 0.18 + rd.oz
        );
        tempScale.set(1, rd.len, 1);
        tempMat.compose(tempPos, tempQuat, tempScale);
        rainInst.setMatrixAt(i, tempMat);
      }
      rainInst.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < IDLE_RIPPLE_COUNT; i++) {
        const ir = idleRipples[i];
        const prog = (t * 0.82 + ir.phase) % 1.0;
        ir.mesh.position.set(ir.x, WATER_Y + 0.01, ir.z);
        ir.mesh.scale.setScalar(0.45 + prog * 2.5);
        ir.mat.opacity = Math.sin(prog * Math.PI) * 0.62;
      }

      // 4. WIND-SWEPT GRASS WAVES & LIGHTNING STRIKE GRASS GLOW
      let needsColorUpdate = false;
      for (let i = 0; i < GRASS_COUNT; i++) {
        const gd = grassData[i];
        const windWave = Math.sin(t * 2.85 + gd.x * 0.95 + gd.z * 0.65 + gd.phase) * 0.19
          + Math.sin(t * 5.2 + gd.x * 1.4) * 0.05;
        tempPos.set(gd.x, gd.y, gd.z);
        tempEuler.set(windWave * 0.3, gd.rotY, -(gd.baseTilt + windWave));
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(gd.scaleXZ, gd.scaleY, gd.scaleXZ);
        tempMat.compose(tempPos, tempQuat, tempScale);
        grassInst.setMatrixAt(i, tempMat);

        if (groundGlow > 0.005) {
          const dx = gd.x - strikeState.targetX;
          const dz = gd.z - strikeState.targetZ;
          const distSq = dx * dx + dz * dz;
          if (distSq < 2.5) {
            const prox = (1.0 - distSq / 2.5) * groundGlow;
            gd.curCol.copy(gd.baseCol).lerp(glowGrassCol, prox * 0.95);
            grassInst.setColorAt(i, gd.curCol);
            needsColorUpdate = true;
          }
        } else if (!gd.curCol.equals(gd.baseCol)) {
          gd.curCol.copy(gd.baseCol);
          grassInst.setColorAt(i, gd.curCol);
          needsColorUpdate = true;
        }
      }
      grassInst.instanceMatrix.needsUpdate = true;
      if (needsColorUpdate) grassInst.instanceColor.needsUpdate = true;

      // 5. WILDFLOWERS TREMBLING IN THE WIND
      for (let i = 0; i < FLOWER_COUNT; i++) {
        const fd = flowerData[i];
        const tremor = Math.sin(t * 4.2 + fd.x * 1.2 + fd.phase) * 0.16;
        tempPos.set(fd.x, fd.y, fd.z);
        tempEuler.set(tremor * 0.5, fd.phase, -0.15 - tremor);
        tempQuat.setFromEuler(tempEuler);
        tempScale.setScalar(fd.sc);
        tempMat.compose(tempPos, tempQuat, tempScale);
        flowerInst.setMatrixAt(i, tempMat);
      }
      flowerInst.instanceMatrix.needsUpdate = true;

      // 6. POND SPLASH INTERACTION (Expanding Ripple Rings, Droplet Arc, Frog Hop & Fish Flash)
      sheenMesh.scale.set(
        POND_RX * (0.94 + 0.03 * Math.sin(t * 1.8)),
        1,
        POND_RZ * (0.94 + 0.03 * Math.cos(t * 1.5))
      );
      glintMesh.scale.set(
        POND_RX * (0.90 + 0.05 * Math.cos(t * 2.2)),
        1,
        POND_RZ * (0.90 + 0.05 * Math.sin(t * 1.9))
      );

      if (splashState.active) {
        const dt = nowMs - splashState.startTime;
        const sec = dt * 0.001;

        if (dt < 1450) {
          for (let i = 0; i < SPLASH_RINGS; i++) {
            const r = splashRings[i];
            const rTime = (dt - r.delay) * 0.001;
            if (rTime > 0 && rTime < 1.05) {
              const prog = rTime / 1.05;
              const sc = 0.4 + prog * 8.4;
              r.mesh.scale.setScalar(sc);
              r.mat.opacity = Math.sin(prog * Math.PI) * (1 - prog * 0.65) * 0.88;
            } else {
              r.mat.opacity = 0;
            }
          }

          const gravity = 7.6;
          for (let i = 0; i < DROPLET_COUNT; i++) {
            const dv = dropletVel[i];
            const dy = dv.vy * sec - 0.5 * gravity * sec * sec;
            if (dy >= -0.05) {
              tempPos.set(
                splashState.originX + dv.vx * sec,
                WATER_Y + 0.02 + dy,
                splashState.originZ + dv.vz * sec
              );
              const shrink = Math.max(0.01, (1 - sec * 0.85) * dv.sc);
              tempScale.setScalar(shrink);
            } else {
              tempPos.set(0, -10, 0);
              tempScale.setScalar(0.001);
            }
            tempQuat.identity();
            tempMat.compose(tempPos, tempQuat, tempScale);
            dropletInst.setMatrixAt(i, tempMat);
          }
          dropletInst.instanceMatrix.needsUpdate = true;

          const hopCycle = Math.min(1, dt / 950);
          const hopArc = Math.abs(Math.sin(hopCycle * Math.PI * 2));
          frogGroup.position.set(
            frogBaseX + Math.sin(hopCycle * Math.PI) * 0.24,
            frogBaseY + hopArc * 0.36,
            frogBaseZ + Math.sin(hopCycle * Math.PI) * 0.16
          );
          frogGroup.rotation.x = -hopArc * 0.45;

          const fishAng = sec * 5.2;
          fishGroup.position.set(
            POND_X + Math.cos(fishAng) * 0.62,
            WATER_Y - 0.03 + Math.sin(Math.min(1, sec * 1.4) * Math.PI) * 0.19,
            POND_Z + Math.sin(fishAng) * 0.48
          );
          fishGroup.rotation.y = -fishAng + Math.PI;
          fishMat.emissiveIntensity = 0.90;
        } else {
          splashState.active = false;
          dropletInst.visible = false;
          splashRings.forEach((r) => {
            r.mesh.visible = false;
            r.mat.opacity = 0;
          });
          frogGroup.position.set(frogBaseX, frogBaseY, frogBaseZ);
          frogGroup.rotation.x = 0;
          fishMat.emissiveIntensity = 0.45;
        }
      } else {
        frogBody.scale.y = 0.78 + Math.sin(t * 3.5) * 0.04;
        const slowAng = t * 0.75;
        fishGroup.position.set(
          POND_X + Math.cos(slowAng) * 0.52,
          WATER_Y - 0.04,
          POND_Z + Math.sin(slowAng) * 0.40
        );
        fishGroup.rotation.y = -slowAng + Math.PI;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
