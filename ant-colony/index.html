<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Colony - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#d9c49d; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; background: radial-gradient(circle at 50% 35%, #f5ebd4 0%, #dec79e 58%, #b8986b 100%); }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 20px; z-index:5;
    background: linear-gradient(rgba(38,24,11,.68), rgba(38,24,11,.32) 58%, rgba(38,24,11,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#fdf8ee; text-transform:uppercase; text-shadow:0 1px 10px rgba(32,19,8,.85); }
  header .rule { width:44px; height:1px; background:rgba(253,248,238,.6); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#fffdf6; transition:opacity 1.2s ease, transform 0.4s ease; padding:5px 14px; border-radius:4px;
    background:rgba(38,24,11,.50); border:1px solid rgba(253,248,238,.18);
    text-shadow:0 1px 3px rgba(20,12,5,.98), 0 0 10px rgba(20,12,5,.9); }
  #hint.faded { opacity:.42; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:14px 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    background: linear-gradient(rgba(38,24,11,0), rgba(38,24,11,.45));
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(253,248,238,.75);
    text-shadow:0 1px 4px rgba(20,12,5,.8); }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Ant Colony</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// argon p1 (Gemini 4 Argon rework)
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Deterministic PRNG ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
function rand(a, b) { return a + rng() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

// ---------- Scene & Renderer ----------
const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xdfc8a2, 0.0115);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 36 : (a >= 0.62 ? 44 : 54);
  camera.updateProjectionMatrix();
}
pickFov();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.12;
controls.maxPolarAngle = Math.PI * 0.56;
controls.minDistance = 8;
controls.maxDistance = 48;

// ---------- Layered Lighting ----------
const sun = new THREE.DirectionalLight(0xfff1d0, 2.75);
sun.position.set(11, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -11;
sun.shadow.camera.right = 11;
sun.shadow.camera.top = 11;
sun.shadow.camera.bottom = -11;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xfdf2dc, 0x5c3c20, 1.15);
scene.add(hemi);

const rimLight = new THREE.DirectionalLight(0xffdfa8, 0.85);
rimLight.position.set(-12, 9, -10);
scene.add(rimLight);

const frontCutawayFill = new THREE.DirectionalLight(0xffe4bc, 0.72);
frontCutawayFill.position.set(2, -1, 14);
scene.add(frontCutawayFill);

// ---------- Helper: Vertex Color Noise & Displacement ----------
function hashNoise(x, y, z) {
  const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  return s - Math.floor(s);
}
function smoothNoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const n000 = hashNoise(ix, iy, iz), n100 = hashNoise(ix + 1, iy, iz);
  const n010 = hashNoise(ix, iy + 1, iz), n110 = hashNoise(ix + 1, iy + 1, iz);
  const n001 = hashNoise(ix, iy, iz + 1), n101 = hashNoise(ix + 1, iy, iz + 1);
  const n011 = hashNoise(ix, iy + 1, iz + 1), n111 = hashNoise(ix + 1, iy + 1, iz + 1);
  const nx00 = n000 + ux * (n100 - n000), nx10 = n010 + ux * (n110 - n010);
  const nx01 = n001 + ux * (n101 - n001), nx11 = n011 + ux * (n111 - n011);
  const nxy0 = nx00 + uy * (nx10 - nx00), nxy1 = nx01 + uy * (nx11 - nx01);
  return nxy0 + uz * (nxy1 - nxy0);
}

// ---------- Diorama Dimensions & Coordinates ----------
const W = 12.0;          // X from -6 to +6
const D = 10.4;          // Z from -5.2 to +5.2 (front cutaway face at Z = +5.2)
const FRONT_Z = D / 2;   // +5.2
const DEPTH = 6.6;       // Underground soil from Y = 0 down to Y = -6.6
const HILL = { x: 0.35, z: -0.25, r: 1.85, h: 1.75 };

function getSurfaceHeight(x, z) {
  const dx = x - HILL.x, dz = z - HILL.z;
  const dHill = Math.hypot(dx, dz);
  let h = 0;
  if (dHill < HILL.r * 1.35) {
    const t = Math.max(0, 1 - dHill / (HILL.r * 1.15));
    const cone = Math.pow(t, 1.45) * HILL.h;
    const crater = dHill < 0.42 ? Math.pow(1 - dHill / 0.42, 1.6) * 0.48 : 0;
    const rim = Math.exp(-Math.pow((dHill - 0.36) / 0.16, 2)) * 0.16;
    h += cone - crater + rim;
  }
  h += (smoothNoise(x * 0.45 + 5, 0, z * 0.45 + 5) - 0.5) * 0.22;
  h += (smoothNoise(x * 1.3 + 12, 0, z * 1.3 + 9) - 0.5) * 0.07;
  return h;
}

const worldGroup = new THREE.Group();
scene.add(worldGroup);

// ---------- Chamber & Tunnel Layout on Front Cutaway & Interior ----------
const CHAMBERS = [
  { id: 'nursery', name: 'Brood Nursery', x: -2.85, y: -1.75, rx: 1.55, ry: 0.92, rz: 1.35, lightCol: 0xffd79e, lightInt: 1.5 },
  { id: 'grain',   name: 'Seed Granary',  x:  3.05, y: -1.65, rx: 1.50, ry: 0.88, rz: 1.30, lightCol: 0xffca7a, lightInt: 1.4 },
  { id: 'queen',   name: 'Royal Chamber', x: -2.25, y: -4.45, rx: 1.95, ry: 1.12, rz: 1.60, lightCol: 0xffae62, lightInt: 2.1 },
  { id: 'fungus',  name: 'Fungus Garden', x:  2.55, y: -4.35, rx: 1.85, ry: 1.10, rz: 1.55, lightCol: 0x64f5c8, lightInt: 2.6 }
];

// Define tunnel spline networks (both cutaway front-face tunnels & side cross-section tunnels)
const TUNNEL_PATHS = [
  // Main vertical shaft from anthill crater down to central crossroads
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(HILL.x, 1.45, HILL.z),
    new THREE.Vector3(HILL.x, 0.2, 1.8),
    new THREE.Vector3(0.25, -0.75, FRONT_Z - 0.18),
    new THREE.Vector3(0.05, -2.05, FRONT_Z - 0.16),
    new THREE.Vector3(-0.10, -3.35, FRONT_Z - 0.18),
    new THREE.Vector3(-0.05, -4.40, FRONT_Z - 0.18)
  ]),
  // Upper-left branch to Nursery
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.12, -1.35, FRONT_Z - 0.16),
    new THREE.Vector3(-1.15, -1.45, FRONT_Z - 0.14),
    new THREE.Vector3(-2.05, -1.72, FRONT_Z - 0.16),
    new THREE.Vector3(-2.85, -1.80, FRONT_Z - 0.22)
  ]),
  // Upper-right branch to Seed Granary
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.15, -1.20, FRONT_Z - 0.16),
    new THREE.Vector3(1.35, -1.28, FRONT_Z - 0.14),
    new THREE.Vector3(2.20, -1.58, FRONT_Z - 0.16),
    new THREE.Vector3(3.05, -1.68, FRONT_Z - 0.22)
  ]),
  // Lower-left branch to Queen Chamber
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.08, -3.55, FRONT_Z - 0.16),
    new THREE.Vector3(-0.95, -3.95, FRONT_Z - 0.14),
    new THREE.Vector3(-1.75, -4.38, FRONT_Z - 0.18),
    new THREE.Vector3(-2.45, -4.50, FRONT_Z - 0.24)
  ]),
  // Lower-right branch to Fungus Garden
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.05, -3.45, FRONT_Z - 0.16),
    new THREE.Vector3(1.05, -3.82, FRONT_Z - 0.14),
    new THREE.Vector3(1.85, -4.25, FRONT_Z - 0.18),
    new THREE.Vector3(2.55, -4.40, FRONT_Z - 0.24)
  ]),
  // Side loop connecting Nursery down to Queen Chamber
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(-3.65, -2.05, FRONT_Z - 0.18),
    new THREE.Vector3(-4.35, -3.15, FRONT_Z - 0.14),
    new THREE.Vector3(-3.60, -4.25, FRONT_Z - 0.18)
  ]),
  // Side loop connecting Granary down to Fungus Garden
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(3.85, -1.95, FRONT_Z - 0.18),
    new THREE.Vector3(4.45, -3.05, FRONT_Z - 0.14),
    new THREE.Vector3(3.75, -4.15, FRONT_Z - 0.18)
  ])
];

// Pre-sample tunnel points in 2D (X, Y) for fast front-wall carving
const tunnelSamples2D = [];
for (let tIdx = 0; tIdx < TUNNEL_PATHS.length; tIdx++) {
  const curve = TUNNEL_PATHS[tIdx];
  const steps = 42;
  for (let i = 0; i <= steps; i++) {
    const p = curve.getPoint(i / steps);
    if (p.z > FRONT_Z - 1.2 && p.y < 0.25) {
      tunnelSamples2D.push({ x: p.x, y: p.y, r: tIdx === 0 ? 0.44 : 0.36 });
    }
  }
}

// Compute how deeply carved a point (x, y) on the front cutaway face is (0 = solid soil, >0 = recessed cavity depth)
function getCutawayCarve(x, y) {
  let maxDepth = 0;
  // Chambers
  for (const ch of CHAMBERS) {
    const dx = (x - ch.x) / ch.rx;
    let dy = (y - ch.y) / ch.ry;
    // Flatten chamber floors slightly and dome the ceilings
    if (dy < 0) dy *= 1.35;
    const wob = (smoothNoise(x * 2.2, y * 2.2, 1.5) - 0.5) * 0.14;
    const distSq = dx * dx + dy * dy + wob;
    if (distSq < 1.0) {
      const d = Math.sqrt(1.0 - distSq) * ch.rz;
      if (d > maxDepth) maxDepth = d;
    }
  }
  // Tunnels
  for (const ts of tunnelSamples2D) {
    const dx = x - ts.x, dy = y - ts.y;
    const d2 = dx * dx + dy * dy;
    const r2 = ts.r * ts.r;
    if (d2 < r2) {
      const d = Math.sqrt(r2 - d2) * 1.15;
      if (d > maxDepth) maxDepth = d;
    }
  }
  return maxDepth;
}

// ---------- Build Layered Soil Block & Sculpted Cutaway Face ----------
const soilGroup = new THREE.Group();
worldGroup.add(soilGroup);

{
  // 1. Top Surface Terrain Mesh (with anthill mound & vertex colors)
  const topGeo = new THREE.PlaneGeometry(W, D, 72, 64);
  topGeo.rotateX(-Math.PI / 2);
  const pos = topGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const cSand = new THREE.Color(0xd7b377);
  const cLoam = new THREE.Color(0xb68b52);
  const cHill = new THREE.Color(0x8c5a32);
  const cCrater = new THREE.Color(0x281509);
  const tmpC = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = getSurfaceHeight(x, z);
    pos.setY(i, y);

    const dHill = Math.hypot(x - HILL.x, z - HILL.z);
    const n = smoothNoise(x * 0.9, y * 0.9, z * 0.9);
    tmpC.copy(cSand).lerp(cLoam, n * 0.65);
    if (dHill < HILL.r * 1.25) {
      const t = Math.max(0, 1 - dHill / (HILL.r * 1.2));
      tmpC.lerp(cHill, Math.min(1, t * 1.25));
    }
    if (dHill < 0.36) {
      tmpC.lerp(cCrater, Math.pow(1 - dHill / 0.36, 1.4));
    }
    cols[i * 3] = tmpC.r;
    cols[i * 3 + 1] = tmpC.g;
    cols[i * 3 + 2] = tmpC.b;
  }
  topGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  topGeo.computeVertexNormals();
  const topMesh = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.94, metalness: 0.02
  }));
  topMesh.receiveShadow = true;
  topMesh.castShadow = true;
  soilGroup.add(topMesh);

  // 2. Sculpted Front Cutaway Wall (Z = +FRONT_Z, recessed into chambers & tunnels)
  const frontGeo = new THREE.PlaneGeometry(W, DEPTH, 148, 92);
  frontGeo.translate(0, -DEPTH / 2, FRONT_Z);
  const fPos = frontGeo.attributes.position;
  const fCols = new Float32Array(fPos.count * 3);

  const cStrataTop = new THREE.Color(0xb88b54);
  const cStrataMid = new THREE.Color(0x8c5830);
  const cStrataDeep = new THREE.Color(0x59341a);
  const cStrataBed = new THREE.Color(0x3b2210);
  const cCavityWall = new THREE.Color(0x2d180a);
  const cFungusTint = new THREE.Color(0x284e3f);

  for (let i = 0; i < fPos.count; i++) {
    const x = fPos.getX(i);
    let y = fPos.getY(i);
    const surfY = getSurfaceHeight(x, FRONT_Z);

    // Match top edge seamlessly to surface terrain height
    const depthRatio = -y / DEPTH; // 0 at top, 1 at bottom
    y = surfY * (1 - depthRatio) + (-DEPTH) * depthRatio;

    const carve = getCutawayCarve(x, y);
    const microRough = (smoothNoise(x * 3.5, y * 3.5, 2.1) - 0.5) * 0.09;
    let z = FRONT_Z - carve + microRough;

    // Slight lip bevel right along tunnel/chamber rims
    if (carve > 0.01 && carve < 0.25) {
      z += 0.04;
    }

    fPos.setXYZ(i, x, y, z);

    // Stratified soil coloring + cavity interior darkening
    const wave = Math.sin(x * 0.7 + smoothNoise(x, y, 0) * 2.5) * 0.18;
    const dNorm = Math.max(0, Math.min(1, (-y + wave) / DEPTH));
    if (dNorm < 0.28) {
      tmpC.copy(cStrataTop).lerp(cStrataMid, dNorm / 0.28);
    } else if (dNorm < 0.68) {
      tmpC.copy(cStrataMid).lerp(cStrataDeep, (dNorm - 0.28) / 0.40);
    } else {
      tmpC.copy(cStrataDeep).lerp(cStrataBed, (dNorm - 0.68) / 0.32);
    }

    const grain = (hashNoise(x * 19, y * 19, 1) - 0.5) * 0.08;
    tmpC.offsetHSL(0, 0, grain);

    if (carve > 0.02) {
      const cFactor = Math.min(1, carve / 0.85);
      tmpC.lerp(cCavityWall, cFactor * 0.78);
      // Subtle bioluminescent tint inside fungus garden cavity
      const dFungus = Math.hypot(x - 2.55, y - (-4.35));
      if (dFungus < 2.1) {
        tmpC.lerp(cFungusTint, Math.max(0, 1 - dFungus / 2.1) * cFactor * 0.55);
      }
    }

    fCols[i * 3] = tmpC.r;
    fCols[i * 3 + 1] = tmpC.g;
    fCols[i * 3 + 2] = tmpC.b;
  }
  frontGeo.setAttribute('color', new THREE.BufferAttribute(fCols, 3));
  frontGeo.computeVertexNormals();
  const frontMesh = new THREE.Mesh(frontGeo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.96, metalness: 0.03
  }));
  frontMesh.receiveShadow = true;
  frontMesh.castShadow = true;
  soilGroup.add(frontMesh);

  // 3. Left, Right, and Back Soil Walls (matching surface profile & strata)
  function makeSideWall(isLeft, isBack) {
    const span = isBack ? W : D;
    const wGeo = new THREE.PlaneGeometry(span, DEPTH, 48, 36);
    const wPos = wGeo.attributes.position;
    const wCols = new Float32Array(wPos.count * 3);
    for (let i = 0; i < wPos.count; i++) {
      const u = wPos.getX(i);
      const v = wPos.getY(i); // +DEPTH/2 to -DEPTH/2
      const depthRatio = (DEPTH / 2 - v) / DEPTH;
      let wx, wz;
      if (isBack) {
        wx = -u; wz = -FRONT_Z;
      } else if (isLeft) {
        wx = -W / 2; wz = u;
      } else {
        wx = W / 2; wz = -u;
      }
      const sy = getSurfaceHeight(wx, wz);
      const wy = sy * (1 - depthRatio) + (-DEPTH) * depthRatio;
      wPos.setXYZ(i, wx, wy, wz);

      const dNorm = Math.max(0, Math.min(1, -wy / DEPTH));
      if (dNorm < 0.3) tmpC.copy(cStrataTop).lerp(cStrataMid, dNorm / 0.3);
      else if (dNorm < 0.7) tmpC.copy(cStrataMid).lerp(cStrataDeep, (dNorm - 0.3) / 0.4);
      else tmpC.copy(cStrataDeep).lerp(cStrataBed, (dNorm - 0.7) / 0.3);
      wCols[i * 3] = tmpC.r; wCols[i * 3 + 1] = tmpC.g; wCols[i * 3 + 2] = tmpC.b;
    }
    wGeo.setAttribute('color', new THREE.BufferAttribute(wCols, 3));
    wGeo.computeVertexNormals();
    const m = new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.96, side: THREE.DoubleSide
    }));
    m.receiveShadow = true;
    soilGroup.add(m);
  }
  makeSideWall(true, false);
  makeSideWall(false, false);
  makeSideWall(false, true);

  // 4. Museum-style Dark Plinth Base Framing the Bottom
  const plinthMat = new THREE.MeshStandardMaterial({ color: 0x2b190d, roughness: 0.85 });
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(W + 0.36, 0.55, D + 0.36), plinthMat);
  plinth.position.set(0, -DEPTH - 0.27, 0);
  plinth.receiveShadow = true;
  plinth.castShadow = true;
  soilGroup.add(plinth);

  const trimMat = new THREE.MeshStandardMaterial({ color: 0x472b16, roughness: 0.75 });
  const trim = new THREE.Mesh(new THREE.BoxGeometry(W + 0.16, 0.14, D + 0.16), trimMat);
  trim.position.set(0, -DEPTH + 0.04, 0);
  soilGroup.add(trim);
}

// ---------- Embedded Subsurface Stones, Strata Pebbles & Hanging Roots ----------
{
  const rockMats = [
    new THREE.MeshStandardMaterial({ color: 0x7c6d5c, roughness: 0.92 }),
    new THREE.MeshStandardMaterial({ color: 0x635446, roughness: 0.95 }),
    new THREE.MeshStandardMaterial({ color: 0x8f7e6a, roughness: 0.88 }),
    new THREE.MeshStandardMaterial({ color: 0x4e4237, roughness: 0.96 })
  ];
  const rockGeo = new THREE.DodecahedronGeometry(1, 1);
  // Perturb rockGeo slightly for organic stones
  const rPos = rockGeo.attributes.position;
  for (let i = 0; i < rPos.count; i++) {
    const vx = rPos.getX(i), vy = rPos.getY(i), vz = rPos.getZ(i);
    const s = 0.85 + 0.3 * hashNoise(vx * 3, vy * 3, vz * 3);
    rPos.setXYZ(i, vx * s, vy * s * 0.72, vz * s);
  }
  rockGeo.computeVertexNormals();

  // Stones embedded along cutaway soil face (avoiding deep chamber centers)
  for (let i = 0; i < 68; i++) {
    const rx = rand(-W / 2 + 0.35, W / 2 - 0.35);
    const ry = rand(-DEPTH + 0.25, -0.25);
    const carve = getCutawayCarve(rx, ry);
    if (carve > 0.32) continue; // Keep out of middle of chambers
    const sz = rand(0.08, 0.28) * (ry < -4.5 ? 1.35 : 1.0);
    const stone = new THREE.Mesh(rockGeo, pick(rockMats));
    stone.scale.set(sz * rand(0.8, 1.3), sz * rand(0.6, 1.1), sz * 0.65);
    stone.position.set(rx, ry, FRONT_Z - carve + rand(-0.04, 0.05));
    stone.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
    stone.castShadow = true;
    stone.receiveShadow = true;
    soilGroup.add(stone);
  }

  // Gnarled Tree & Plant Roots penetrating ceiling of underground chambers & soil
  const rootMat = new THREE.MeshStandardMaterial({ color: 0x5e3c1e, roughness: 0.9 });
  const fineRootMat = new THREE.MeshStandardMaterial({ color: 0x78502b, roughness: 0.88 });
  for (let i = 0; i < 28; i++) {
    const startX = rand(-5.3, 5.3);
    const startZ = rand(FRONT_Z - 0.9, FRONT_Z - 0.05);
    const len = rand(1.1, 3.4);
    const pts = [];
    let cx = startX, cy = getSurfaceHeight(startX, startZ) - 0.05, cz = startZ;
    const segs = 6;
    for (let s = 0; s <= segs; s++) {
      pts.push(new THREE.Vector3(cx, cy, cz));
      cx += rand(-0.28, 0.28);
      cy -= len / segs;
      cz = Math.min(FRONT_Z + 0.02, Math.max(FRONT_Z - 1.1, cz + rand(-0.12, 0.12)));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const rGeo = new THREE.TubeGeometry(curve, 16, rand(0.022, 0.055), 6, false);
    // Taper root radius along its length
    const rp = rGeo.attributes.position;
    for (let k = 0; k < rp.count; k++) {
      const py = rp.getY(k);
      const t = Math.max(0.15, Math.min(1, (py - (pts[segs].y)) / len));
      const center = curve.getPoint(1 - t);
      rp.setX(k, center.x + (rp.getX(k) - center.x) * t);
      rp.setZ(k, center.z + (rp.getZ(k) - center.z) * t);
    }
    rGeo.computeVertexNormals();
    const rootMesh = new THREE.Mesh(rGeo, i % 2 === 0 ? rootMat : fineRootMat);
    rootMesh.castShadow = true;
    soilGroup.add(rootMesh);
  }
}

// ---------- Articulated Realistic Ant Builder ----------
const antMaterials = {
  workerThorax: new THREE.MeshStandardMaterial({ color: 0x5c220e, roughness: 0.42, metalness: 0.08 }),
  workerHead:   new THREE.MeshStandardMaterial({ color: 0x3b1307, roughness: 0.36, metalness: 0.10 }),
  workerGaster: new THREE.MeshStandardMaterial({ color: 0x260b04, roughness: 0.30, metalness: 0.12 }),
  soldierHead:  new THREE.MeshStandardMaterial({ color: 0x78280e, roughness: 0.38, metalness: 0.10 }),
  queenGaster:  new THREE.MeshStandardMaterial({ color: 0x3d1407, roughness: 0.26, metalness: 0.15, emissive: 0x1a0600, emissiveIntensity: 0.2 }),
  eyeMat:       new THREE.MeshStandardMaterial({ color: 0x090504, roughness: 0.15, metalness: 0.3 }),
  legMat:       new THREE.MeshStandardMaterial({ color: 0x331106, roughness: 0.48 })
};

function makeAnt(role = 'worker') {
  const scale = role === 'queen' ? 2.15 : (role === 'soldier' ? 1.32 : rand(0.88, 1.08));
  const root = new THREE.Group();
  root.scale.setScalar(scale);

  // Body container lifted off ground by leg height
  const body = new THREE.Group();
  body.position.y = 0.14;
  root.add(body);

  // 1. Mesosoma (Thorax) - elongated bi-lobed capsule look
  const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), antMaterials.workerThorax);
  thorax.scale.set(0.82, 0.78, 1.55);
  thorax.castShadow = true;
  body.add(thorax);

  // 2. Petiole (narrow waist node between thorax and gaster)
  const petiole = new THREE.Mesh(new THREE.SphereGeometry(0.032, 7, 6), antMaterials.workerThorax);
  petiole.position.set(0, -0.01, -0.125);
  body.add(petiole);

  // 3. Gaster (Abdomen) - teardrop / ovate rear segment
  const gasterPivot = new THREE.Group();
  gasterPivot.position.set(0, 0.01, -0.15);
  body.add(gasterPivot);

  const gasterMat = role === 'queen' ? antMaterials.queenGaster : antMaterials.workerGaster;
  const gaster = new THREE.Mesh(new THREE.SphereGeometry(0.115, 12, 10), gasterMat);
  if (role === 'queen') {
    gaster.scale.set(1.18, 1.08, 1.68);
    gaster.position.set(0, 0.03, -0.14);
  } else {
    gaster.scale.set(0.95, 0.88, 1.32);
    gaster.position.set(0, 0.015, -0.10);
  }
  gaster.castShadow = true;
  gasterPivot.add(gaster);

  // Subtle lighter tergite bands on the queen's gaster
  if (role === 'queen') {
    const bandMat = new THREE.MeshStandardMaterial({ color: 0x8f4319, roughness: 0.35 });
    for (let b = 0; b < 3; b++) {
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.105 - b * 0.012, 0.012, 6, 14), bandMat);
      band.position.set(0, 0.035, -0.08 - b * 0.07);
      gasterPivot.add(band);
    }
  }

  // 4. Head + Compound Eyes + Mandibles + Elbowed Antennae
  const headPivot = new THREE.Group();
  headPivot.position.set(0, 0.02, 0.125);
  body.add(headPivot);

  const headMat = role === 'soldier' ? antMaterials.soldierHead : antMaterials.workerHead;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), headMat);
  const hScale = role === 'soldier' ? 1.28 : 1.0;
  head.scale.set(0.96 * hScale, 0.84 * hScale, 1.08 * hScale);
  head.position.set(0, 0, 0.045);
  head.castShadow = true;
  headPivot.add(head);

  // Compound eyes
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 5), antMaterials.eyeMat);
    eye.position.set(s * 0.068 * hScale, 0.018, 0.065);
    headPivot.add(eye);

    // Curved mandibles
    const mand = new THREE.Mesh(new THREE.ConeGeometry(0.022 * hScale, 0.075 * hScale, 5), headMat);
    mand.position.set(s * 0.036 * hScale, -0.022, 0.125 * hScale);
    mand.rotation.x = Math.PI * 0.46;
    mand.rotation.z = s * 0.38;
    headPivot.add(mand);
  }

  // Elbowed (geniculate) antennae: scape + funiculus
  const antennae = [];
  for (const s of [-1, 1]) {
    const antPivot = new THREE.Group();
    antPivot.position.set(s * 0.035, 0.035, 0.105);
    headPivot.add(antPivot);

    const scape = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, 0.11, 5), antMaterials.legMat);
    scape.position.set(s * 0.035, 0.035, 0.035);
    scape.rotation.z = -s * 0.55;
    scape.rotation.x = 0.55;
    antPivot.add(scape);

    const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.008, 0.10, 5), antMaterials.legMat);
    tip.position.set(s * 0.065, 0.055, 0.095);
    tip.rotation.x = 1.25;
    tip.rotation.z = -s * 0.25;
    antPivot.add(tip);

    antennae.push(antPivot);
  }

  // 5. Six 2-Segment Articulated Legs (Femur + Tibia/Tarsus)
  const legs = [];
  const zOffsets = [0.068, 0.0, -0.068];
  const zAngles = [0.32, 0.0, -0.36];

  for (let l = 0; l < 6; l++) {
    const side = l < 3 ? 1 : -1;
    const idx = l % 3;
    const hip = new THREE.Group();
    hip.position.set(side * 0.052, -0.015, zOffsets[idx]);
    hip.rotation.y = side * zAngles[idx];
    body.add(hip);

    // Upper femur angling upward and outward
    const femur = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.014, 0.13, 5), antMaterials.legMat);
    femur.position.set(side * 0.048, 0.032, 0);
    femur.rotation.z = -side * 1.05;
    hip.add(femur);

    // Lower tibia angling steeply down to ground
    const tibia = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.011, 0.17, 5), antMaterials.legMat);
    tibia.position.set(side * 0.118, -0.042, 0);
    tibia.rotation.z = -side * 0.35;
    hip.add(tibia);

    legs.push({ hip, side, idx, baseY: hip.rotation.y });
  }

  root.userData = { legs, antennae, headPivot, gasterPivot, body, role };
  return root;
}

// Helper to create natural carried burdens (leaf fragments, seeds, white eggs)
function attachBurden(antGroup, type) {
  const headPivot = antGroup.userData.headPivot;
  if (type === 'leaf') {
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0, 0);
    leafShape.quadraticCurveTo(0.12, 0.10, 0.04, 0.28);
    leafShape.quadraticCurveTo(-0.08, 0.22, -0.06, 0.08);
    leafShape.closePath();
    const lGeo = new THREE.ShapeGeometry(leafShape);
    const lMat = new THREE.MeshStandardMaterial({
      color: pick([0x5da844, 0x74bf52, 0x4b9436]),
      roughness: 0.65, side: THREE.DoubleSide
    });
    const leaf = new THREE.Mesh(lGeo, lMat);
    leaf.position.set(0, 0.02, 0.13);
    leaf.rotation.x = -0.35;
    leaf.rotation.y = 0.2;
    leaf.castShadow = true;
    headPivot.add(leaf);
  } else if (type === 'seed') {
    const sMat = new THREE.MeshStandardMaterial({ color: 0xe3a83b, roughness: 0.45 });
    const seed = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), sMat);
    seed.scale.set(0.8, 0.75, 1.35);
    seed.position.set(0, -0.01, 0.15);
    seed.castShadow = true;
    headPivot.add(seed);
  } else if (type === 'egg') {
    const eMat = new THREE.MeshStandardMaterial({
      color: 0xfff8eb, roughness: 0.25, emissive: 0x3b2812, emissiveIntensity: 0.25
    });
    const egg = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), eMat);
    egg.scale.set(0.85, 0.8, 1.3);
    egg.position.set(0, -0.005, 0.145);
    headPivot.add(egg);
  }
}

// 2. Surface Foraging & Patrol Ants (conforming to 3D surface terrain & anthill slopes)
function makeSurfaceLoop(cx, cz, rx, rz, wobble) {
  const pts = [];
  const count = 10;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const px = THREE.MathUtils.clamp(cx + Math.cos(a) * (rx + rand(-wobble, wobble)), -5.3, 5.3);
    const pz = THREE.MathUtils.clamp(cz + Math.sin(a) * (rz + rand(-wobble, wobble)), -4.6, 4.6);
    const py = getSurfaceHeight(px, pz);
    pts.push(new THREE.Vector3(px, py, pz));
  }
  return new THREE.CatmullRomCurve3(pts, true, 'centripetal');
}

function makeRadialTex(innerCol, midCol, outerCol) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, innerCol);
  g.addColorStop(0.5, midCol);
  g.addColorStop(1, outerCol);
  cx.fillStyle = g;
  cx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}

// ---------- Responsive Camera Framing (Any Viewport Aspect Ratio) ----------
const FIT_CENTER = new THREE.Vector3(0, -2.15, 0.35);
const FIT_PTS = [
  new THREE.Vector3(-6.2,  1.8, -5.2),
  new THREE.Vector3( 6.2,  1.8, -5.2),
  new THREE.Vector3(-6.2,  1.4,  5.4),
  new THREE.Vector3( 6.2,  1.4,  5.4),
  new THREE.Vector3(-6.2, -DEPTH - 0.6,  5.4),
  new THREE.Vector3( 6.2, -DEPTH - 0.6,  5.4),
  new THREE.Vector3(-6.2, -DEPTH - 0.6, -5.2),
  new THREE.Vector3( 6.2, -DEPTH - 0.6, -5.2),
  new THREE.Vector3(HILL.x, HILL.h + 0.55, HILL.z)
];

function fitDir() {
  const a = innerWidth / innerHeight;
  // Slightly elevated frontal-3/4 cutaway angle so BOTH surface world & underground chambers read clearly
  if (a < 0.62) return new THREE.Vector3(0.12, 0.38, 1.0).normalize();
  if (a < 0.9)  return new THREE.Vector3(0.20, 0.36, 1.0).normalize();
  return new THREE.Vector3(0.26, 0.34, 1.0).normalize();
}

const _rel = new THREE.Vector3();
function requiredDistance(right, up, fwd, target) {
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const halfV = fovV / 2;
  const halfH = Math.atan(Math.tan(halfV) * camera.aspect);

  // Reserve safe vertical margins for the fixed header (top) and footer (bottom)
  const headerPx = 96;
  const footerPx = 48;
  const vSafe = Math.max(0.56, 1 - (headerPx + footerPx) / Math.max(innerHeight, 320));
  const hSafe = 0.92;

  const tanH = Math.tan(halfH) * hSafe;
  const tanV = Math.tan(halfV) * vSafe;

  let d = 6;
  for (const c of FIT_PTS) {
    _rel.copy(c).sub(target);
    const cf = _rel.dot(fwd);
    const rx = Math.abs(_rel.dot(right));
    const ry = Math.abs(_rel.dot(up));
    d = Math.max(d, rx / tanH - cf, ry / tanV - cf);
  }
  return d;
}

function frameInitialCamera() {
  pickFov();
  const fd = fitDir();
  const fwd = fd.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const dist = requiredDistance(right, up, fwd, FIT_CENTER) * 1.04;
  camera.position.copy(FIT_CENTER).addScaledVector(fd, dist);
  controls.target.copy(FIT_CENTER);
  camera.updateProjectionMatrix();
  controls.update();
}

// ---------- Animation Loop ----------
const clock = new THREE.Clock();
const _p = new THREE.Vector3();
const _tan = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _lookTarget = new THREE.Vector3();

function animateAntPose(antGroup, t, ph, speedMul) {
  const ud = antGroup.userData;
  const freq = 15 * Math.min(speedMul, 2.2);
  const phase = t * freq + ph;

  // Tripod gait across 6 articulated legs
  for (let i = 0; i < ud.legs.length; i++) {
    const leg = ud.legs[i];
    const tripod = (i % 2 === 0) ? 1 : -1;
    const swing = Math.sin(phase * 1.1 + (i % 2) * Math.PI) * 0.28 * Math.min(speedMul, 1.8);
    const lift = Math.max(0, Math.cos(phase * 1.1 + (i % 2) * Math.PI)) * 0.18;
    leg.hip.rotation.y = leg.baseY + swing * tripod;
    leg.hip.rotation.z = leg.side * lift;
  }

  // Expressive antennae & gaster bobbing
  ud.antennae[0].rotation.x = Math.sin(t * 9 + ph) * 0.18;
  ud.antennae[1].rotation.x = Math.cos(t * 9.5 + ph) * 0.18;
  ud.gasterPivot.rotation.x = Math.sin(t * 7 + ph) * 0.08;
  ud.headPivot.rotation.y = Math.sin(t * 5.5 + ph) * 0.09;
}

function walkSurfaceAnt(a, dt, t, speedMul) {
  a.u = (a.u + a.sp * speedMul * dt) % 1;
  a.curve.getPointAt(a.u, _p);
  a.curve.getTangentAt(a.u, _tan);
  const y = getSurfaceHeight(_p.x, _p.z);
  a.g.position.set(_p.x, y, _p.z);

  // Align ant with 3D slope tangent
  const nextX = _p.x + _tan.x * 0.15;
  const nextZ = _p.z + _tan.z * 0.15;
  const nextY = getSurfaceHeight(nextX, nextZ);
  _lookTarget.set(nextX, nextY, nextZ);
  a.g.lookAt(_lookTarget);

  animateAntPose(a.g, t, a.ph, speedMul);
}

function walkUndergroundAnt(a, dt, t, speedMul) {
  if (a.stationary) {
    animateAntPose(a.g, t, a.ph, 0.45 * speedMul);
    a.g.rotation.y = a.baseRotY + Math.sin(t * 1.8 + a.ph) * 0.18;
    return;
  }
  a.u = (a.u + a.sp * speedMul * dt) % 1;
  a.curve.getPointAt(a.u, _p);
  a.curve.getTangentAt(a.u, _tan);
  a.g.position.copy(_p);
  _lookTarget.copy(_p).add(_tan);
  a.g.up.copy(_up);
  a.g.lookAt(_lookTarget);

  animateAntPose(a.g, t, a.ph, speedMul);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  const now = performance.now();

  // Wall-clock swarm phase (4500ms)
  let speedMul = 1;
  let swarmPulse = 0;
  if (swarm.t0 > 0) {
    const e = (now - swarm.t0) / SWARM_MS;
    if (e >= 1) {
      swarm.t0 = -1;
      for (const s of swarmAnts) s.g.visible = false;
    } else {
      swarmPulse = Math.sin(Math.min(e, 1) * Math.PI);
      speedMul = 1 + swarmPulse * 2.3;
    }
  }

  // Update surface, underground, and emerging swarm ants
  for (const a of surfaceAnts) walkSurfaceAnt(a, dt, t, speedMul);
  for (const u of undergroundAnts) walkUndergroundAnt(u, dt, t, speedMul);
  if (swarm.t0 > 0) {
    for (const s of swarmAnts) walkSurfaceAnt(s, dt, t, 1.25);
  }

  // Animate Queen breathing & subtle royal grooming
  if (queenMeshRef.group) {
    const q = queenMeshRef.group;
    q.userData.gasterPivot.scale.set(
      1 + Math.sin(t * 2.4) * 0.035,
      1 + Math.sin(t * 2.4) * 0.04,
      1 + Math.cos(t * 2.4) * 0.025
    );
    q.userData.headPivot.rotation.y = Math.sin(t * 1.6) * 0.14;
    q.userData.antennae[0].rotation.x = Math.sin(t * 4.2) * 0.2;
    q.userData.antennae[1].rotation.x = Math.cos(t * 4.5) * 0.2;
  }

  // Gentle wriggle on nursery larvae
  for (const lg of broodPiles) {
    lg.rotation.z = Math.sin(t * 2.2 + lg.userData.phase) * 0.06;
  }

  // Bioluminescent fungus garden breathing & chamber light warmth
  for (const fp of fungusPods) {
    const s = 1 + Math.sin(t * 2.1 + fp.userData.phase) * 0.06;
    fp.scale.set(s, 1 + Math.cos(t * 2.1 + fp.userData.phase) * 0.08, s);
  }
  for (const cl of chamberLights) {
    const flicker = Math.sin(t * 2.8 + (cl.id === 'fungus' ? 1.5 : 0)) * 0.12;
    cl.light.intensity = cl.baseInt + flicker + swarmPulse * 0.55;
  }

  // Surface grass tufts & wildflowers swaying in the breeze
  for (const f of swayingFoliage) {
    f.rotation.z = Math.sin(t * 1.65 + f.userData.phase) * f.userData.amp;
    f.rotation.x = Math.cos(t * 1.25 + f.userData.phase) * f.userData.amp * 0.5;
  }

  // Sky dandelion puffs & seeds drifting
  for (const p of puffs) {
    p.position.x += p.userData.vx * dt;
    p.position.y += Math.sin(t * p.userData.bobFreq + p.userData.phase) * dt * p.userData.bobAmp;
    p.rotation.z = Math.sin(t * 1.2 + p.userData.phase) * p.userData.swayAmp;
    if (p.position.x > 9.0) p.position.x = -9.0;
  }

  // High portrait-sky clouds drifting slowly
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    c.position.y += Math.sin(t * 0.4 + c.userData.bob) * dt * 0.04;
    if (c.position.x > 11.5) c.position.x = -11.5;
  }

  // Underground spores & dust motes floating inside chambers
  for (const m of undergroundMotes) {
    const ud = m.userData;
    m.position.x = ud.baseX + Math.sin(t * ud.speed + ud.phase) * 0.22;
    m.position.y = ud.baseY + Math.cos(t * ud.speed * 0.85 + ud.phase) * 0.18;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
