<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canal Lock - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#bcd8ea; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 18px; z-index:5;
    background: linear-gradient(rgba(40,62,84,.5), rgba(40,62,84,.24) 55%, rgba(40,62,84,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#f5fafd; text-transform:uppercase; text-shadow:0 1px 8px rgba(24,40,58,.8); }
  header .rule { width:44px; height:1px; background:rgba(245,250,253,.55); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#f6fbfe; transition:opacity 1.2s ease; padding:5px 12px; border-radius:3px;
    background:rgba(34,54,74,.45);
    text-shadow:0 1px 3px rgba(18,32,46,.98), 0 0 8px rgba(18,32,46,.95), 0 0 18px rgba(18,32,46,.85); }
  #hint.faded { opacity:.45; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(245,250,253,.65); }
  canvas { display:block; touch-action:none; }
  @media (max-width: 380px) {
    header h1 { font-size:12px; letter-spacing:.3em; }
    #hint { font-size:10px; letter-spacing:.2em; }
  }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Canal Lock</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// pass 1
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20261101);

const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd8ea);
scene.fog = new THREE.Fog(0xbcd8ea, 30, 90);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);
  camera.updateProjectionMatrix();
}
pickFov();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.maxPolarAngle = Math.PI * 0.55;

const sun = new THREE.DirectionalLight(0xfff2dc, 1.9);
sun.position.set(6, 11, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -11; sun.shadow.camera.right = 11;
sun.shadow.camera.top = 11; sun.shadow.camera.bottom = -11;
sun.shadow.camera.far = 60;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xd4e4f0, 0.95));
scene.add(new THREE.HemisphereLight(0xeaf4fc, 0x6a7a68, 0.55));

// ---------- materials ----------
const M = {
  grass: new THREE.MeshStandardMaterial({ color: 0x6fa25c, roughness: .9 }),
  grass2: new THREE.MeshStandardMaterial({ color: 0x82b468, roughness: .9 }),
  stone: new THREE.MeshStandardMaterial({ color: 0x9a948a, roughness: .9 }),
  stoneDark: new THREE.MeshStandardMaterial({ color: 0x7d786e, roughness: .9 }),
  slab: new THREE.MeshStandardMaterial({ color: 0x5e6a74, roughness: .95 }),
  waterUp: new THREE.MeshStandardMaterial({ color: 0x4a92a8, roughness: .25, metalness: .1, transparent: true, opacity: .92 }),
  waterLow: new THREE.MeshStandardMaterial({ color: 0x3d8499, roughness: .25, metalness: .1, transparent: true, opacity: .92 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x6b4e32, roughness: .9 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x54402a, roughness: .9 }),
  hull: new THREE.MeshStandardMaterial({ color: 0xa8352e, roughness: .6 }),
  hullTrim: new THREE.MeshStandardMaterial({ color: 0x2e5c46, roughness: .6 }),
  cabin: new THREE.MeshStandardMaterial({ color: 0xe8ddc4, roughness: .8 }),
  win: new THREE.MeshStandardMaterial({ color: 0x3a3325, emissive: 0xffc36b, emissiveIntensity: 1.3 }),
  roofSlate: new THREE.MeshStandardMaterial({ color: 0x54687e, roughness: .8 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x3c4048, roughness: .5, metalness: .6 }),
  foam: new THREE.MeshBasicMaterial({ color: 0xeaf6fc, transparent: true, opacity: .8 }),
  reed: new THREE.MeshStandardMaterial({ color: 0x5c8a4a, roughness: .9 }),
  duck: new THREE.MeshStandardMaterial({ color: 0xf2ede2, roughness: .8 }),
  duckHead: new THREE.MeshStandardMaterial({ color: 0x3e6b48, roughness: .8 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0x2e3238, emissive: 0xffd88a, emissiveIntensity: 1.5 }),
};

// ---------- base ----------
const base = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.7, 10.4), M.slab);
base.position.y = -2.0; base.receiveShadow = true;
scene.add(base);

// banks (left/right grass) with stone quay edges along the canal channel (z axis)
for (const side of [-1, 1]) {
  const bank = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.1, 10.2), M.grass);
  bank.position.set(side * (1.55 + 1.6), -1.1, 0);
  bank.receiveShadow = true;
  scene.add(bank);
  const quay = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.3, 10.2), M.stone);
  quay.position.set(side * 1.8, -1.05, 0);
  quay.receiveShadow = true; quay.castShadow = true;
  scene.add(quay);
}
// grass tufts
for (let i = 0; i < 16; i++) {
  const side = i % 2 ? 1 : -1;
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.11 + rand() * 0.07, 7, 5), M.grass2);
  tuft.scale.y = 0.6;
  tuft.position.set(side * (2.2 + rand() * 1.6), -0.52, (rand() - 0.5) * 9.4);
  scene.add(tuft);
}

// ---------- canal levels ----------
const UP_Y = -0.42, LOW_Y = -1.28;
// upper reach (back, z -5..-0.5)
const upWater = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.5, 4.7), M.waterUp);
upWater.position.set(0, UP_Y - 0.25, -2.85);
scene.add(upWater);
// lower reach (front, z 1.3..5)
const lowWater = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.5, 3.9), M.waterLow);
lowWater.position.set(0, LOW_Y - 0.25, 3.2);
scene.add(lowWater);
// chamber water (z -0.5..1.3), animates
const chamberWater = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.5, 1.9), M.waterLow.clone());
chamberWater.position.set(0, LOW_Y - 0.25, 0.4);
scene.add(chamberWater);
// underwater chamber floor + walls
const chamberFloor = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.3, 1.9), M.stoneDark);
chamberFloor.position.set(0, -1.62, 0.4);
scene.add(chamberFloor);
for (const side of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.5, 1.9), M.stoneDark);
  wall.position.set(side * 1.62, -0.95, 0.4);
  wall.castShadow = true; wall.receiveShadow = true;
  scene.add(wall);
}
// stone caps on chamber walls
for (const side of [-1, 1]) {
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.14, 2.0), M.stone);
  cap.position.set(side * 1.62, -0.26, 0.4);
  scene.add(cap);
}

// ---------- lock gates ----------
function makeGatePair(z, mirror) {
  const gates = [];
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 1.45, -0.95, z);
    const gate = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.35, 0.09), M.wood);
    gate.position.set(-side * 0.72, 0, mirror * 0.18);
    gate.rotation.y = mirror * side * 0.12; // slight miter angle when closed
    gate.castShadow = true;
    // plank grooves
    for (let i = 0; i < 3; i++) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.11), M.woodDark);
      beam.position.set(0, -0.45 + i * 0.45, 0);
      gate.add(beam);
    }
    pivot.add(gate);
    scene.add(pivot);
    gates.push({ pivot, side, mirror });
  }
  return gates;
}
const upperGates = makeGatePair(-0.45, -1);
const lowerGates = makeGatePair(1.25, 1);

// gate proxy for taps (covers chamber area)
const gateProxy = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.0, 2.4),
  new THREE.MeshBasicMaterial({ visible: false }));
gateProxy.position.set(0, -0.8, 0.4);
scene.add(gateProxy);

// ---------- narrowboat ----------
const boat = new THREE.Group();
{
  const hull = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.3, 1.35), M.hull);
  hull.castShadow = true;
  boat.add(hull);
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.31, 0.45, 4), M.hull);
  bow.rotation.x = -Math.PI / 2; bow.rotation.y = Math.PI / 4;
  bow.position.set(0, 0, -0.9); bow.scale.y = 0.48;
  boat.add(bow);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.06, 1.35), M.hullTrim);
  trim.position.y = 0.16;
  boat.add(trim);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.32, 0.7), M.cabin);
  cabin.position.set(0, 0.32, 0.15); cabin.castShadow = true;
  boat.add(cabin);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.76), M.hullTrim);
  roof.position.set(0, 0.5, 0.15);
  boat.add(roof);
  const winF = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.12), M.win);
  winF.position.set(0, 0.34, -0.21); winF.rotation.y = Math.PI;
  boat.add(winF);
  for (const sx of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.12), M.win);
    w.position.set(sx * 0.235, 0.34, 0.15); w.rotation.y = sx * Math.PI / 2;
    boat.add(w);
  }
  const chim = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.14, 6), M.metal);
  chim.position.set(0.1, 0.58, 0.3);
  boat.add(chim);
}
const BOAT_HOME = new THREE.Vector3(0, LOW_Y + 0.14, 0.45);
boat.position.copy(BOAT_HOME);
scene.add(boat);

// ---------- lock-keeper cottage ----------
const cottage = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.0, 1.1), M.cabin);
  body.position.y = 0.5; body.castShadow = true; body.receiveShadow = true;
  cottage.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.05, 0.6, 4), M.roofSlate);
  roof.position.y = 1.3; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
  cottage.add(roof);
  const chim = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.16), M.stoneDark);
  chim.position.set(0.35, 1.35, -0.2); chim.castShadow = true;
  cottage.add(chim);
  const win1 = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.24), M.win);
  win1.position.set(-0.3, 0.55, 0.56);
  cottage.add(win1);
  const win2 = win1.clone(); win2.position.x = 0.3; cottage.add(win2);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.5), M.woodDark);
  door.position.set(0, 0.3, 0.56);
  cottage.add(door);
}
cottage.position.set(-3.1, -0.55, -2.9);
cottage.rotation.y = 0.45;
scene.add(cottage);

// ---------- paddle gear / winch wheels ----------
for (const [x, z] of [[-1.62, -0.75], [1.62, -0.75], [-1.62, 1.55], [1.62, 1.55]]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 6), M.metal);
  post.position.set(x, -0.05, z);
  scene.add(post);
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.03, 6, 12), M.metal);
  wheel.position.set(x, 0.22, z); wheel.rotation.x = Math.PI / 2;
  scene.add(wheel);
}

// ---------- bollards + lamppost ----------
for (const [x, z] of [[-2.0, -1.2], [2.0, -0.2], [-2.0, 2.0], [2.0, 2.6], [-2.0, -3.4], [2.0, -4.2]]) {
  const bol = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.28, 8), M.metal);
  bol.position.set(x, -0.4, z); bol.castShadow = true;
  scene.add(bol);
}
const lampPost = new THREE.Group();
{
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.7, 8), M.metal);
  pole.position.y = 0.85; pole.castShadow = true;
  lampPost.add(pole);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), M.lamp);
  head.position.y = 1.78;
  lampPost.add(head);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.14, 8), M.metal);
  cap.position.y = 1.94;
  lampPost.add(cap);
}
lampPost.position.set(2.35, -0.55, -1.1);
scene.add(lampPost);
const lampLight = new THREE.PointLight(0xffd88a, 0.9, 4);
lampLight.position.set(2.35, 1.2, -1.1);
scene.add(lampLight);

// ---------- reeds ----------
for (let i = 0; i < 12; i++) {
  const side = i % 2 ? 1 : -1;
  const r = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.5 + rand() * 0.35, 4), M.reed);
  r.position.set(side * 1.62, -1.05 + 0.25, -3.8 + rand() * 8);
  r.rotation.z = (rand() - 0.5) * 0.2;
  scene.add(r);
}

// ---------- ducks ----------
const ducks = [];
for (let i = 0; i < 2; i++) {
  const d = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), M.duck);
  body.scale.set(1.25, 0.85, 0.9);
  d.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.06, 7, 6), M.duckHead);
  head.position.set(0, 0.09, -0.11);
  d.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.06, 4), new THREE.MeshStandardMaterial({ color: 0xe0a33c }));
  beak.rotation.x = -Math.PI / 2; beak.position.set(0, 0.08, -0.18);
  d.add(beak);
  scene.add(d);
  ducks.push({ g: d, ph: i * 2.6, cx: i ? 0.5 : -0.6, cz: 3.0 + i * 0.8, r: 0.5 + i * 0.2, sp: 0.25 + i * 0.08 });
}

// ---------- fill/drain foam ----------
const FOAM_N = 40;
const foamGeo = new THREE.BufferGeometry();
const foamPos = new Float32Array(FOAM_N * 3);
const foamSeed = [];
for (let i = 0; i < FOAM_N; i++) {
  foamSeed.push({ x: (rand() - 0.5) * 2.6, z: -0.4 + rand() * 1.6, ph: rand(), sp: 0.5 + rand() * 0.5 });
}
foamGeo.setAttribute('position', new THREE.BufferAttribute(foamPos, 3));
const foam = new THREE.Points(foamGeo, new THREE.PointsMaterial({ color: 0xeaf6fc, size: 0.09, transparent: true, opacity: 0, depthWrite: false }));
scene.add(foam);

// ---------- birds ----------
const birds = [];
for (let i = 0; i < 3; i++) {
  const b = new THREE.Group();
  const w1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.05), new THREE.MeshBasicMaterial({ color: 0x3a4a5c }));
  w1.position.x = -0.09; w1.rotation.z = 0.35;
  const w2 = w1.clone(); w2.position.x = 0.09; w2.rotation.z = -0.35;
  b.add(w1); b.add(w2);
  scene.add(b);
  birds.push({ g: b, w1, w2, r: 3.4 + rand() * 1.2, h: 2.6 + rand() * 1.0, ph: rand() * 6, sp: 0.22 + rand() * 0.15 });
}

// ---------- fitCamera ----------
const fitBox = new THREE.Box3(
  new THREE.Vector3(-4.9, -2.35, -5.3),
  new THREE.Vector3(4.9, 2.4, 5.3));
const fitDir = new THREE.Vector3(0.52, 0.55, 1).normalize();
function fitCamera() {
  const center = fitBox.getCenter(new THREE.Vector3());
  const corners = [];
  for (const x of [fitBox.min.x, fitBox.max.x])
    for (const y of [fitBox.min.y, fitBox.max.y])
      for (const z of [fitBox.min.z, fitBox.max.z])
        corners.push(new THREE.Vector3(x, y, z));
  const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 240);
  probe.position.copy(center).addScaledVector(fitDir, 0.001); probe.lookAt(center); probe.updateMatrixWorld();
  const inv = probe.matrixWorldInverse;
  let need = 0;
  for (const c of corners) {
    const v = c.clone().applyMatrix4(inv);
    const d = Math.max(
      Math.abs(v.y) / Math.tan(THREE.MathUtils.degToRad(probe.fov / 2)),
      Math.abs(v.x) / (Math.tan(THREE.MathUtils.degToRad(probe.fov / 2)) * probe.aspect));
    need = Math.max(need, d + Math.abs(v.z));
  }
  const dist = need * 1.1 + 0.2;
  camera.position.copy(center).addScaledVector(fitDir, dist);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.target.y += -0.35; camera.position.y += -0.35;
  camera.lookAt(controls.target);
  controls.update();
}
fitCamera();

// ---------- hints / interaction ----------
const hintIdle = 'Open the lock';
const hintRise = 'Watch the boat rise';
let hintOwner = null;
function setHint(text, owner) {
  if (owner) hintOwner = owner;
  hintEl.textContent = text;
  hintEl.classList.remove('faded');
}
function resetHintIf(owner) {
  if (hintOwner === owner) { hintOwner = null; setHint(hintIdle, null); }
}
setHint(hintIdle, null);
setTimeout(() => hintEl.classList.add('faded'), 6000);

let cycleT = -1;
const CYCLE = 13.0;

const ray = new THREE.Raycaster();
function onTap(e) {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(new THREE.Vector2(x, y), camera);
  if (cycleT < 0 && ray.intersectObject(gateProxy, false).length) {
    cycleT = performance.now() / 1000;
    setHint(hintRise, 'user');
  }
}
renderer.domElement.addEventListener('pointerdown', onTap);

// ---------- resize ----------
addEventListener('resize', () => {
  pickFov();
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
function smooth(t) { return t * t * (3 - 2 * t); }
function seg(p, a, b) { return smooth(Math.min(Math.max((p - a) / (b - a), 0), 1)); }
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.3);
  const now = performance.now() / 1000;

  // lock cycle phases (p in 0..1 over CYCLE):
  // 0.00-0.08 idle closed
  // 0.08-0.42 chamber fills, boat rises
  // 0.42-0.55 upper gates swing open
  // 0.55-0.72 boat glides into upper reach
  // 0.72-0.80 hold
  // 0.80-0.90 boat returns, gates close
  // 0.90-1.00 chamber drains back
  let fill = 0, upperOpen = 0, boatFwd = 0, foamAmt = 0;
  if (cycleT >= 0) {
    const p = (now - cycleT) / CYCLE;
    if (p >= 1) {
      cycleT = -1;
      chamberWater.position.y = LOW_Y - 0.25;
      boat.position.copy(BOAT_HOME);
      for (const g of upperGates) g.pivot.rotation.y = 0;
      resetHintIf('user');
    } else {
      const fillUp = seg(p, 0.08, 0.42);
      const drain = seg(p, 0.90, 1.0);
      fill = fillUp * (1 - drain);
      upperOpen = seg(p, 0.42, 0.55) * (1 - seg(p, 0.80, 0.90));
      boatFwd = seg(p, 0.55, 0.72) * (1 - seg(p, 0.80, 0.90));
      foamAmt = Math.max(seg(p, 0.08, 0.2) * (1 - seg(p, 0.42, 0.55)), seg(p, 0.88, 0.94));
      const wy = LOW_Y + (UP_Y - LOW_Y) * fill;
      chamberWater.position.y = wy - 0.25;
      boat.position.y = wy + 0.14;
      boat.position.z = BOAT_HOME.z - boatFwd * 2.6;
      for (const g of upperGates) g.pivot.rotation.y = g.side * upperOpen * 1.35;
      boat.rotation.z = Math.sin(now * 2.2) * 0.02 * (1 + fill);
    }
  } else {
    boat.position.y = BOAT_HOME.y + Math.sin(now * 1.6) * 0.02;
    boat.rotation.z = Math.sin(now * 2.0) * 0.02;
  }

  // foam particles
  const fa = foamGeo.attributes.position;
  for (let i = 0; i < FOAM_N; i++) {
    const s = foamSeed[i];
    const t = ((now * s.sp + s.ph) % 1);
    fa.setXYZ(i, s.x, chamberWater.position.y + 0.28 + t * 0.12, s.z + t * 0.3);
  }
  fa.needsUpdate = true;
  foam.material.opacity = foamAmt * 0.85;

  // water shimmer
  upWater.position.y = UP_Y - 0.25 + Math.sin(now * 1.3) * 0.008;
  lowWater.position.y = LOW_Y - 0.25 + Math.sin(now * 1.5 + 1) * 0.008;

  // ducks paddle in the lower reach
  for (const d of ducks) {
    const a = now * d.sp + d.ph;
    d.g.position.set(d.cx + Math.cos(a) * d.r, LOW_Y + 0.06, d.cz + Math.sin(a) * d.r * 0.6);
    d.g.rotation.y = -a;
    d.g.position.y += Math.sin(now * 3 + d.ph) * 0.008;
  }

  // birds
  for (const b of birds) {
    const a = now * b.sp + b.ph;
    b.g.position.set(Math.cos(a) * b.r, b.h + Math.sin(now * 0.6 + b.ph) * 0.25, Math.sin(a) * b.r * 0.8 - 0.5);
    b.g.rotation.y = -a;
    const flap = Math.sin(now * 7 + b.ph) * 0.45;
    b.w1.rotation.z = 0.35 + flap;
    b.w2.rotation.z = -0.35 - flap;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
