<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mangrove tide — a tiny world</title>
  <style>
    :root {
      --bg-top: #d8f3f8;
      --bg-mid: #eef9f4;
      --bg-bot: #cbe8e0;
      --ink-dark: #15322f;
      --ink-mid: #2d5953;
      --accent-coral: #e85a34;
      --pill-bg: rgba(255, 253, 247, 0.86);
      --pill-border: rgba(21, 50, 47, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 56%, var(--bg-bot) 100%);
      font-family: "Avenir Next", "Nunito", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-dark);
      touch-action: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hud-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(8px, 1.8vh, 16px) 12px 6px;
      text-align: center;
      background: linear-gradient(180deg, rgba(226, 246, 249, 0.88) 0%, rgba(226, 246, 249, 0.45) 72%, rgba(226, 246, 249, 0) 100%);
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-title {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: clamp(1.18rem, 2.7vw, 1.62rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--ink-dark);
      line-height: 1.1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .hud-subtitle {
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-style: italic;
      font-size: clamp(0.84rem, 1.9vw, 1.04rem);
      font-weight: 500;
      color: var(--ink-mid);
      letter-spacing: 0.01em;
    }

    .hud-hint {
      margin-top: 5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 11px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      box-shadow: 0 2px 8px rgba(21, 50, 47, 0.06);
      font-size: clamp(0.68rem, 1.65vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.015em;
      color: var(--ink-dark);
      line-height: 1.25;
      max-width: calc(100vw - 20px);
    }

    .hud-hint-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-coral);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(232, 90, 52, 0.22);
    }

    .hud-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 12px clamp(7px, 1.6vh, 14px);
      background: linear-gradient(0deg, rgba(208, 235, 228, 0.82) 0%, rgba(208, 235, 228, 0.35) 68%, rgba(208, 235, 228, 0) 100%);
    }

    .hud-footer-text {
      font-size: clamp(0.68rem, 1.5vw, 0.78rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-mid);
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(21, 50, 47, 0.1);
    }

    #fallback-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #dff4f8 0%, #cbe8e0 100%);
      color: #15322f;
      text-align: center;
    }

    .fallback-card {
      max-width: 360px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(21, 50, 47, 0.16);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(21, 50, 47, 0.12);
    }

    .fallback-card h2 {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }

    .fallback-card p {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #2d5953;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="hud-header" id="hudHeader">
    <div class="title-row">
      <h1 class="hud-title">Mangrove tide</h1>
      <span class="hud-subtitle">a tiny world</span>
    </div>
    <div class="hud-hint">
      <span class="hud-hint-dot"></span>
      <span>tap a crab to scuttle - tap the water to splash</span>
    </div>
  </header>

  <div id="app"></div>

  <footer class="hud-footer" id="hudFooter">
    <span class="hud-footer-text">A tiny world</span>
  </footer>

  <div id="fallback-msg">
    <div class="fallback-card">
      <h2>WebGL Required</h2>
      <p>Unable to initialize the 3D mangrove tide flat renderer on this device or browser. Please ensure hardware acceleration and WebGL are enabled.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // DETERMINISTIC SEEDED PRNG: mulberry32(20261103) — ZERO Math.random()
    // =========================================================================
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const rand = mulberry32(20261103);
    const randRange = (min, max) => min + (max - min) * rand();
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };

    // =========================================================================
    // TERRAIN & CHANNEL ANALYTICAL HEIGHT / WATER FIELD
    // =========================================================================
    const SLAB_RX = 5.45;
    const SLAB_RZ = 4.65;
    const WATER_Y = 0.04;

    // Winding channel center X for a given Z in [-4.7, 4.7]
    function getChannelCenterX(z) {
      return 1.32 * Math.sin(z * 0.62 + 0.35) - 0.38 * Math.cos(z * 1.18 - 0.45);
    }

    function getChannelHalfWidth(z) {
      return 0.92 + 0.24 * Math.sin(z * 0.95 + 1.1) + 0.14 * Math.cos(z * 1.7);
    }

    // Two shallow tidal pools connected/adjacent to the mud flat
    const POOLS = [
      { x: -2.55, z: 1.25, rx: 1.22, rz: 0.92, depth: 0.32 },
      { x: 2.48, z: -1.35, rx: 1.15, rz: 0.88, depth: 0.30 }
    ];

    // Raised mangrove island mounds for strong vertical presence
    const MOUNDS = [
      { x: -2.15, z: -1.65, r: 2.25, h: 0.68 },
      { x: 2.35, z: 1.55, r: 2.10, h: 0.56 },
      { x: -0.25, z: -2.55, r: 1.75, h: 0.52 },
      { x: -2.95, z: -0.15, r: 1.55, h: 0.42 },
      { x: 2.75, z: -0.10, r: 1.45, h: 0.38 }
    ];

    // Returns signed water metric (< 0 means inside water channel or pool)
    function getWaterSignedMetric(x, z) {
      const cx = getChannelCenterX(z);
      const cw = getChannelHalfWidth(z);
      const dChan = (Math.abs(x - cx) - cw) / cw;

      let dPool = 999;
      for (let i = 0; i < POOLS.length; i++) {
        const p = POOLS[i];
        const dx = (x - p.x) / p.rx;
        const dz = (z - p.z) / p.rz;
        const dist = Math.sqrt(dx * dx + dz * dz) - 1.0;
        if (dist < dPool) dPool = dist;
      }
      return Math.min(dChan, dPool);
    }

    function isInsideSlab(x, z, margin = 0.0) {
      const rx = SLAB_RX - margin;
      const rz = SLAB_RZ - margin;
      if (rx <= 0.1 || rz <= 0.1) return false;
      const nx = x / rx;
      const nz = z / rz;
      // Superellipse with subtle organic contour
      const angle = Math.atan2(z, x);
      const wobble = 1.0 + 0.035 * Math.sin(angle * 3 + 0.6) + 0.025 * Math.cos(angle * 5 - 0.4);
      const rVal = Math.pow(Math.abs(nx), 2.5) + Math.pow(Math.abs(nz), 2.5);
      return rVal <= Math.pow(wobble, 2.5);
    }

    function getSlabEdgeFactor(x, z) {
      const nx = x / SLAB_RX;
      const nz = z / SLAB_RZ;
      const angle = Math.atan2(z, x);
      const wobble = 1.0 + 0.035 * Math.sin(angle * 3 + 0.6) + 0.025 * Math.cos(angle * 5 - 0.4);
      const r = Math.pow(Math.pow(Math.abs(nx), 2.5) + Math.pow(Math.abs(nz), 2.5), 1 / 2.5) / wobble;
      return r;
    }

    function getTerrainHeight(x, z) {
      // Base mud height
      let h = 0.24
        + 0.06 * Math.sin(x * 0.85 + z * 0.65)
        + 0.04 * Math.cos(x * 1.4 - z * 1.1)
        + 0.022 * Math.sin(x * 2.9 + z * 2.4);

      // Add raised mounds
      for (let i = 0; i < MOUNDS.length; i++) {
        const m = MOUNDS[i];
        const d2 = (x - m.x) * (x - m.x) + (z - m.z) * (z - m.z);
        const r2 = m.r * m.r;
        if (d2 < r2) {
          const f = 1.0 - d2 / r2;
          h += m.h * f * f * (3 - 2 * f);
        }
      }

      // Carve winding channel
      const cx = getChannelCenterX(z);
      const cw = getChannelHalfWidth(z);
      const distChan = Math.abs(x - cx);
      if (distChan < cw * 1.55) {
        const t = smoothstep(0, cw * 1.45, distChan);
        const carved = -0.34 + 0.05 * Math.cos((x - cx) * 2.0);
        h = lerp(carved, h, t);
      }

      // Carve shallow pools
      for (let i = 0; i < POOLS.length; i++) {
        const p = POOLS[i];
        const dx = (x - p.x) / p.rx;
        const dz = (z - p.z) / p.rz;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < 1.38) {
          const t = smoothstep(0.0, 1.35, d);
          h = lerp(-p.depth, h, t);
        }
      }

      // Tactile bevel near slab rim
      const edgeR = getSlabEdgeFactor(x, z);
      if (edgeR > 0.88) {
        const bevel = smoothstep(0.88, 1.02, edgeR);
        h = lerp(h, -0.18, bevel * 0.68);
      }

      return h;
    }

    function isDryMudSpot(x, z, edgeBuffer = 0.72) {
      if (!isInsideSlab(x, z, edgeBuffer)) return false;
      const h = getTerrainHeight(x, z);
      return h > WATER_Y + 0.065 && h < 0.66;
    }

    // =========================================================================
    // INITIALIZE SCENE, CAMERA, RENDERER
    // =========================================================================
    const container = document.getElementById('app');
    const fallbackEl = document.getElementById('fallback-msg');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: true
      });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    if (!renderer || !renderer.getContext()) {
      fallbackEl.style.display = 'flex';
      throw new Error('WebGL context unavailable');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Create procedural sunny morning sky environment texture for glossy water & wet mud
    function createSkyEnvironment(pmremGen) {
      const envScene = new THREE.Scene();
      const skyGeo = new THREE.SphereGeometry(20, 32, 16);
      const pos = skyGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const cTop = new THREE.Color(0x7fd8f5);
      const cHorizon = new THREE.Color(0xf9f7e4);
      const cGround = new THREE.Color(0x287c6e);
      const tmp = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i) / 20;
        if (y >= 0) {
          tmp.lerpColors(cHorizon, cTop, Math.pow(y, 0.55));
        } else {
          tmp.lerpColors(cHorizon, cGround, Math.min(1, -y * 2.2));
        }
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }
      skyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const skyMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide });
      envScene.add(new THREE.Mesh(skyGeo, skyMat));

      // Bright sun disc in environment for crisp water specular highlights
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xfffbe6 })
      );
      sunMesh.position.set(10, 13, 8);
      envScene.add(sunMesh);

      return pmremGen.fromScene(envScene, 0.03).texture;
    }

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = createSkyEnvironment(pmremGenerator);
    pmremGenerator.dispose();

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 80);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.7;

    // =========================================================================
    // BRIGHT, SUNNY, LUMINOUS HIGH-CONTRAST MORNING LIGHTING
    // =========================================================================
    const hemiLight = new THREE.HemisphereLight(0xeafaff, 0x7a654b, 1.35);
    hemiLight.position.set(0, 15, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7e2, 2.55);
    sunLight.position.set(8.5, 13.5, 7.2);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 2.0;
    sunLight.shadow.camera.far = 28.0;
    const shadowExtent = 7.4;
    sunLight.shadow.camera.left = -shadowExtent;
    sunLight.shadow.camera.right = shadowExtent;
    sunLight.shadow.camera.top = shadowExtent;
    sunLight.shadow.camera.bottom = -shadowExtent;
    sunLight.shadow.bias = -0.0006;
    sunLight.shadow.normalBias = 0.022;
    scene.add(sunLight);

    // Warm teal/sun fill from opposite side so no murky or dark shadows exist
    const fillLight = new THREE.DirectionalLight(0xb8f2e6, 0.95);
    fillLight.position.set(-8.0, 6.8, -5.5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffe9b5, 0.65);
    rimLight.position.set(0.0, 5.5, -9.5);
    scene.add(rimLight);

    // Root diorama group
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // =========================================================================
    // SHARED MATERIALS (TACTILE, HIGH-CONTRAST, HAND-CRAFTED LOOK)
    // =========================================================================
    const slabWallMat = new THREE.MeshStandardMaterial({
      color: 0x5c3e2b,
      roughness: 0.78,
      metalness: 0.04
    });

    const slabTrimMat = new THREE.MeshStandardMaterial({
      color: 0x3e281b,
      roughness: 0.65,
      metalness: 0.06
    });

    const barkMat = new THREE.MeshStandardMaterial({
      color: 0x6e4b34,
      roughness: 0.62,
      metalness: 0.04
    });

    const rootArchMat = new THREE.MeshStandardMaterial({
      color: 0x7d553a,
      roughness: 0.54,
      metalness: 0.05
    });

    // =========================================================================
    // 1. SCULPTURAL DIORAMA SLAB ( MUD TOP + BEVELED GEOLOGICAL SIDES )
    // =========================================================================
    function buildDioramaSlab() {
      const group = new THREE.Group();

      // Top mud mesh: high-resolution polar-adaptive grid conforming to the superellipse slab
      const segX = 112;
      const segZ = 96;
      const topGeo = new THREE.PlaneGeometry(SLAB_RX * 2, SLAB_RZ * 2, segX, segZ);
      topGeo.rotateX(-Math.PI / 2);

      const pos = topGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);

      const colHighMud = new THREE.Color(0x9a6d4c);   // Warm sunlit dry-ish mud bank
      const colWetMud = new THREE.Color(0x6e472f);    // Glossy wet tidal mud
      const colSiltEdge = new THREE.Color(0x523726);  // Rich dark wet shore silt
      const colChannelBed = new THREE.Color(0x1f645d);// Teal-tinted submerged bed
      const colMossHint = new THREE.Color(0x657b42);  // Subtle warm moss tint near roots
      const tmpCol = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let z = pos.getZ(i);

        // Softly clamp vertices outside superellipse onto the organic perimeter
        const rFactor = getSlabEdgeFactor(x, z);
        if (rFactor > 1.0) {
          x /= rFactor;
          z /= rFactor;
        }

        const y = getTerrainHeight(x, z);
        pos.setXYZ(i, x, y, z);

        // Color by elevation and moisture
        const micro = 0.5 + 0.5 * Math.sin(x * 3.7 + z * 4.1);
        if (y < WATER_Y - 0.04) {
          const depthT = clamp((WATER_Y - y) / 0.36, 0, 1);
          tmpCol.lerpColors(colSiltEdge, colChannelBed, depthT);
        } else if (y < WATER_Y + 0.08) {
          const shoreT = clamp((y - (WATER_Y - 0.04)) / 0.12, 0, 1);
          tmpCol.lerpColors(colSiltEdge, colWetMud, shoreT);
        } else {
          const bankT = clamp((y - (WATER_Y + 0.08)) / 0.52, 0, 1);
          tmpCol.lerpColors(colWetMud, colHighMud, bankT);
          if (y > 0.42 && micro > 0.55) {
            tmpCol.lerp(colMossHint, (y - 0.42) * 0.55);
          }
        }

        // Subtle bevel darkening at outer rim
        if (rFactor > 0.92) {
          tmpCol.multiplyScalar(lerp(1.0, 0.82, clamp((rFactor - 0.92) / 0.08, 0, 1)));
        }

        colors[i * 3] = tmpCol.r;
        colors[i * 3 + 1] = tmpCol.g;
        colors[i * 3 + 2] = tmpCol.b;
      }

      topGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      topGeo.computeVertexNormals();

      const mudMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.34,
        metalness: 0.08,
        envMapIntensity: 0.85
      });

      const mudMesh = new THREE.Mesh(topGeo, mudMat);
      mudMesh.receiveShadow = true;
      mudMesh.castShadow = false;
      group.add(mudMesh);

      // Sculptural perimeter wall & stepped plinth base matching exact superellipse contour
      const wallSegs = 160;
      const wallTopY = -0.15;
      const wallBotY = -0.92;
      const wallGeo = new THREE.BufferGeometry();
      const wallPositions = [];
      const wallIndices = [];
      const wallColors = [];

      const cTopLayer = new THREE.Color(0x6d4a33);
      const cMidLayer = new THREE.Color(0x523624);
      const cBotLayer = new THREE.Color(0x3a2518);

      const rings = [
        { y: wallTopY, scale: 1.0, col: cTopLayer },
        { y: -0.38, scale: 1.012, col: cMidLayer },
        { y: -0.76, scale: 0.985, col: cBotLayer },
        { y: wallBotY, scale: 0.95, col: cBotLayer }
      ];

      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];
        for (let s = 0; s <= wallSegs; s++) {
          const theta = (s / wallSegs) * Math.PI * 2;
          const ct = Math.cos(theta);
          const st = Math.sin(theta);
          const wobble = 1.0 + 0.035 * Math.sin(theta * 3 + 0.6) + 0.025 * Math.cos(theta * 5 - 0.4);
          // Parametric superellipse point
          const denom = Math.pow(Math.pow(Math.abs(ct), 2.5) + Math.pow(Math.abs(st), 2.5), 1 / 2.5);
          const x = (ct / denom) * SLAB_RX * wobble * ring.scale;
          const z = (st / denom) * SLAB_RZ * wobble * ring.scale;
          // At top ring, match terrain rim height smoothly
          const y = r === 0 ? getTerrainHeight(x * 0.99, z * 0.99) - 0.01 : ring.y;

          wallPositions.push(x, y, z);
          wallColors.push(ring.col.r, ring.col.g, ring.col.b);
        }
      }

      const stride = wallSegs + 1;
      for (let r = 0; r < rings.length - 1; r++) {
        for (let s = 0; s < wallSegs; s++) {
          const a = r * stride + s;
          const b = a + 1;
          const c = (r + 1) * stride + s;
          const d = c + 1;
          wallIndices.push(a, c, b);
          wallIndices.push(b, c, d);
        }
      }

      // Bottom cap
      const centerIdx = wallPositions.length / 3;
      wallPositions.push(0, wallBotY, 0);
      wallColors.push(cBotLayer.r, cBotLayer.g, cBotLayer.b);
      const lastRingStart = (rings.length - 1) * stride;
      for (let s = 0; s < wallSegs; s++) {
        wallIndices.push(lastRingStart + s + 1, lastRingStart + s, centerIdx);
      }

      wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallPositions, 3));
      wallGeo.setAttribute('color', new THREE.Float32BufferAttribute(wallColors, 3));
      wallGeo.setIndex(wallIndices);
      wallGeo.computeVertexNormals();

      const wallMesh = new THREE.Mesh(
        wallGeo,
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.72,
          metalness: 0.05
        })
      );
      wallMesh.castShadow = true;
      wallMesh.receiveShadow = true;
      group.add(wallMesh);

      worldGroup.add(group);
      return { mudMesh, wallMesh };
    }

    buildDioramaSlab();

    // =========================================================================
    // 2. MIRROR-LIKE TEAL WATER SURFACE + GENEROUS INVISIBLE WATER PROXY
    // =========================================================================
    const waterSegX = 96;
    const waterSegZ = 84;
    const waterGeo = new THREE.PlaneGeometry(SLAB_RX * 1.96, SLAB_RZ * 1.96, waterSegX, waterSegZ);
    waterGeo.rotateX(-Math.PI / 2);

    const waterPos = waterGeo.attributes.position;
    const waterBaseXZ = new Float32Array(waterPos.count * 2);
    const waterColors = new Float32Array(waterPos.count * 3);

    const colShallowTeal = new THREE.Color(0x41c9b6);
    const colDeepTeal = new THREE.Color(0x11857b);
    const colSkyReflect = new THREE.Color(0x8beae2);
    const tmpWaterCol = new THREE.Color();

    for (let i = 0; i < waterPos.count; i++) {
      let x = waterPos.getX(i);
      let z = waterPos.getZ(i);
      const rFactor = getSlabEdgeFactor(x, z);
      if (rFactor > 0.975) {
        x = (x / rFactor) * 0.975;
        z = (z / rFactor) * 0.975;
      }
      waterPos.setXYZ(i, x, WATER_Y, z);
      waterBaseXZ[i * 2] = x;
      waterBaseXZ[i * 2 + 1] = z;

      const bedY = getTerrainHeight(x, z);
      const depth = clamp((WATER_Y - bedY) / 0.36, 0, 1);
      tmpWaterCol.lerpColors(colShallowTeal, colDeepTeal, depth);
      if (depth > 0.55) {
        tmpWaterCol.lerp(colSkyReflect, (depth - 0.55) * 0.35);
      }
      waterColors[i * 3] = tmpWaterCol.r;
      waterColors[i * 3 + 1] = tmpWaterCol.g;
      waterColors[i * 3 + 2] = tmpWaterCol.b;
    }

    waterGeo.setAttribute('color', new THREE.BufferAttribute(waterColors, 3));
    waterGeo.computeVertexNormals();

    const waterMat = new THREE.MeshPhysicalMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.86,
      roughness: 0.06,
      metalness: 0.08,
      reflectivity: 0.95,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.45
    });

    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.receiveShadow = true;
    worldGroup.add(waterMesh);

    // Generous invisible water hit proxy covering the winding channel & pools
    const waterProxyGeo = new THREE.PlaneGeometry(SLAB_RX * 1.95, SLAB_RZ * 1.95, 1, 1);
    waterProxyGeo.rotateX(-Math.PI / 2);
    const waterProxyMat = new THREE.MeshBasicMaterial({ visible: false });
    const waterProxyMesh = new THREE.Mesh(waterProxyGeo, waterProxyMat);
    waterProxyMesh.position.y = WATER_Y + 0.05;
    worldGroup.add(waterProxyMesh);

    // =========================================================================
    // 3. MANGROVE TREES: ARCHING STILT ROOTS + LAYERED CANOPIES + INSTANCED LEAVES
    // =========================================================================
    const TREE_CONFIGS = [
      // Tall signature mangrove on raised back-left bank for strong vertical presence
      {
        x: -2.10,
        z: -1.65,
        height: 3.15,
        trunkRadius: 0.22,
        rootCount: 16,
        rootSpread: 1.75,
        canopyClusters: 9,
        canopyRadius: 1.72,
        tiltX: 0.14,
        tiltZ: 0.12
      },
      // Right-front/mid arching mangrove leaning toward channel
      {
        x: 2.35,
        z: 1.48,
        height: 2.68,
        trunkRadius: 0.19,
        rootCount: 14,
        rootSpread: 1.58,
        canopyClusters: 8,
        canopyRadius: 1.52,
        tiltX: -0.18,
        tiltZ: -0.08
      },
      // Back-center sculptural mangrove framing the upper channel curve
      {
        x: 0.05,
        z: -2.58,
        height: 2.85,
        trunkRadius: 0.18,
        rootCount: 13,
        rootSpread: 1.52,
        canopyClusters: 7,
        canopyRadius: 1.44,
        tiltX: 0.06,
        tiltZ: 0.15
      },
      // Left-mid young mangrove near shallow pool
      {
        x: -3.15,
        z: 0.08,
        height: 2.12,
        trunkRadius: 0.14,
        rootCount: 10,
        rootSpread: 1.22,
        canopyClusters: 6,
        canopyRadius: 1.15,
        tiltX: 0.16,
        tiltZ: 0.05
      },
      // Right-back mangrove near the second pool
      {
        x: 2.85,
        z: -0.22,
        height: 2.28,
        trunkRadius: 0.15,
        rootCount: 11,
        rootSpread: 1.28,
        canopyClusters: 6,
        canopyRadius: 1.20,
        tiltX: -0.14,
        tiltZ: 0.08
      }
    ];

    const treeCanopyGroups = [];
    const leafSpawnPoints = [];
    const perchPoints = [];

    function createTaperedTube(curve, tubularSegments, radStart, radEnd, radialSegments = 7) {
      const geo = new THREE.TubeGeometry(curve, tubularSegments, 1.0, radialSegments, false);
      const pos = geo.attributes.position;
      const center = new THREE.Vector3();
      const v = new THREE.Vector3();

      for (let i = 0; i <= tubularSegments; i++) {
        const u = i / tubularSegments;
        curve.getPointAt(u, center);
        const r = lerp(radStart, radEnd, Math.pow(u, 0.75));
        for (let j = 0; j <= radialSegments; j++) {
          const idx = i * (radialSegments + 1) + j;
          v.fromBufferAttribute(pos, idx);
          v.sub(center).multiplyScalar(r).add(center);
          pos.setXYZ(idx, v.x, v.y, v.z);
        }
      }
      geo.computeVertexNormals();
      return geo;
    }

    const foliageClusterGeo = new THREE.IcosahedronGeometry(1.0, 2);
    // Perturb cluster geometry slightly for organic puffy crown silhouette
    {
      const fPos = foliageClusterGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < fPos.count; i++) {
        v.fromBufferAttribute(fPos, i);
        const n = 1.0 + 0.12 * Math.sin(v.x * 4.2 + v.y * 3.5) + 0.08 * Math.cos(v.z * 4.8);
        v.multiplyScalar(n);
        v.y *= 0.62; // Flattened sunlit canopy cushions
        fPos.setXYZ(i, v.x, v.y, v.z);
      }
      foliageClusterGeo.computeVertexNormals();
    }

    const foliageLightMat = new THREE.MeshStandardMaterial({
      color: 0x4ca644,
      roughness: 0.52,
      metalness: 0.02
    });
    const foliageMidMat = new THREE.MeshStandardMaterial({
      color: 0x2f8538,
      roughness: 0.56,
      metalness: 0.02
    });
    const foliageDeepMat = new THREE.MeshStandardMaterial({
      color: 0x1f682d,
      roughness: 0.60,
      metalness: 0.02
    });

    function buildMangroveTrees() {
      const treesRoot = new THREE.Group();

      for (let t = 0; t < TREE_CONFIGS.length; t++) {
        const cfg = TREE_CONFIGS[t];
        const baseGroundY = Math.max(WATER_Y + 0.12, getTerrainHeight(cfg.x, cfg.z));
        const treeGroup = new THREE.Group();

        // Trunk starts elevated on stilt roots!
        const collarY = baseGroundY + randRange(0.58, 0.82);
        const topX = cfg.x + cfg.tiltX * cfg.height;
        const topZ = cfg.z + cfg.tiltZ * cfg.height;
        const topY = baseGroundY + cfg.height;

        const trunkCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(cfg.x, collarY - 0.18, cfg.z),
          new THREE.Vector3(
            cfg.x + cfg.tiltX * cfg.height * 0.35 + randRange(-0.12, 0.12),
            lerp(collarY, topY, 0.36),
            cfg.z + cfg.tiltZ * cfg.height * 0.35 + randRange(-0.12, 0.12)
          ),
          new THREE.Vector3(
            cfg.x + cfg.tiltX * cfg.height * 0.72 + randRange(-0.10, 0.10),
            lerp(collarY, topY, 0.72),
            cfg.z + cfg.tiltZ * cfg.height * 0.72 + randRange(-0.10, 0.10)
          ),
          new THREE.Vector3(topX, topY, topZ)
        ]);

        const trunkGeo = createTaperedTube(trunkCurve, 18, cfg.trunkRadius, cfg.trunkRadius * 0.42, 8);
        const trunkMesh = new THREE.Mesh(trunkGeo, barkMat);
        trunkMesh.castShadow = true;
        trunkMesh.receiveShadow = true;
        treeGroup.add(trunkMesh);

        // Dense arching stilt roots radiating into mud and water
        for (let r = 0; r < cfg.rootCount; r++) {
          const angle = (r / cfg.rootCount) * Math.PI * 2 + randRange(-0.22, 0.22);
          const tier = r % 3; // High, mid, low root arches
          const startFrac = 0.04 + tier * 0.11 + randRange(0.0, 0.07);
          const originPt = trunkCurve.getPointAt(clamp(startFrac, 0.02, 0.38));

          const reach = cfg.rootSpread * (0.62 + 0.38 * (tier / 2) + randRange(-0.12, 0.18));
          const endX = cfg.x + Math.cos(angle) * reach;
          const endZ = cfg.z + Math.sin(angle) * reach;
          const endY = getTerrainHeight(endX, endZ) - 0.08;

          const archPeakX = lerp(originPt.x, endX, 0.46);
          const archPeakZ = lerp(originPt.z, endZ, 0.46);
          const archPeakY = Math.max(originPt.y + randRange(0.06, 0.22), lerp(originPt.y, endY, 0.35) + 0.38);

          const kneeX = lerp(originPt.x, endX, 0.78);
          const kneeZ = lerp(originPt.z, endZ, 0.78);
          const kneeY = lerp(archPeakY, endY, 0.58) + 0.12;

          const rootCurve = new THREE.CatmullRomCurve3([
            originPt,
            new THREE.Vector3(archPeakX, archPeakY, archPeakZ),
            new THREE.Vector3(kneeX, kneeY, kneeZ),
            new THREE.Vector3(endX, endY, endZ)
          ]);

          const rootThick = randRange(0.042, 0.068);
          const rootGeo = createTaperedTube(rootCurve, 14, rootThick, rootThick * 0.48, 6);
          const rootMesh = new THREE.Mesh(rootGeo, rootArchMat);
          rootMesh.castShadow = true;
          rootMesh.receiveShadow = true;
          treeGroup.add(rootMesh);

          // Save a prominent root arch perch on the first tree for an egret
          if (t === 0 && r === 2) {
            perchPoints.push(new THREE.Vector3(archPeakX, archPeakY + 0.03, archPeakZ));
          }

          // Secondary prop fork on outer roots for extra mangrove intricacy
          if (r % 2 === 0) {
            const subOrigin = rootCurve.getPointAt(0.55);
            const subAngle = angle + randRange(-0.35, 0.35);
            const subEndX = subOrigin.x + Math.cos(subAngle) * randRange(0.35, 0.62);
            const subEndZ = subOrigin.z + Math.sin(subAngle) * randRange(0.35, 0.62);
            const subEndY = getTerrainHeight(subEndX, subEndZ) - 0.06;
            const subCurve = new THREE.CatmullRomCurve3([
              subOrigin,
              new THREE.Vector3(lerp(subOrigin.x, subEndX, 0.5), subOrigin.y - 0.05, lerp(subOrigin.z, subEndZ, 0.5)),
              new THREE.Vector3(subEndX, subEndY, subEndZ)
            ]);
            const subGeo = createTaperedTube(subCurve, 9, rootThick * 0.68, rootThick * 0.35, 5);
            const subMesh = new THREE.Mesh(subGeo, rootArchMat);
            subMesh.castShadow = true;
            subMesh.receiveShadow = true;
            treeGroup.add(subMesh);
          }
        }

        // Swaying canopy group with branches & leaf clusters
        const canopyGroup = new THREE.Group();
        canopyGroup.position.set(topX, topY, topZ);
        treeGroup.add(canopyGroup);

        treeCanopyGroups.push({
          group: canopyGroup,
          baseX: topX,
          baseY: topY,
          baseZ: topZ,
          phase: randRange(0, Math.PI * 2),
          speed: randRange(0.85, 1.25)
        });

        for (let c = 0; c < cfg.canopyClusters; c++) {
          const bAngle = (c / cfg.canopyClusters) * Math.PI * 2 + randRange(-0.25, 0.25);
          const bDist = c === 0 ? 0.08 : randRange(0.38, cfg.canopyRadius * 0.72);
          const bx = Math.cos(bAngle) * bDist;
          const bz = Math.sin(bAngle) * bDist;
          const by = c === 0 ? 0.28 : randRange(-0.12, 0.32);

          // Branch connecting trunk crown to foliage pad
          const branchCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.18, 0),
            new THREE.Vector3(bx * 0.55, by * 0.4 + 0.08, bz * 0.55),
            new THREE.Vector3(bx, by, bz)
          ]);
          const branchGeo = createTaperedTube(branchCurve, 8, cfg.trunkRadius * 0.45, cfg.trunkRadius * 0.18, 5);
          const branchMesh = new THREE.Mesh(branchGeo, barkMat);
          branchMesh.castShadow = true;
          canopyGroup.add(branchMesh);

          // Foliage pad cluster
          const padRadius = randRange(0.42, 0.68) * (cfg.canopyRadius / 1.45);
          const matChoice = c % 3 === 0 ? foliageLightMat : (c % 3 === 1 ? foliageMidMat : foliageDeepMat);
          const padMesh = new THREE.Mesh(foliageClusterGeo, matChoice);
          padMesh.position.set(bx, by + 0.08, bz);
          padMesh.scale.set(padRadius * 1.15, padRadius * 0.85, padRadius * 1.1);
          padMesh.rotation.y = randRange(0, Math.PI * 2);
          padMesh.castShadow = true;
          padMesh.receiveShadow = true;
          canopyGroup.add(padMesh);

          // Record leaf spawn centers in world coordinates for dense instanced leaves
          leafSpawnPoints.push({
            wx: topX + bx,
            wy: topY + by + 0.1,
            wz: topZ + bz,
            radius: padRadius,
            treeIndex: t
          });
        }

        treesRoot.add(treeGroup);
      }

      worldGroup.add(treesRoot);
    }

    buildMangroveTrees();

    // =========================================================================
    // 4. INSTANCED PNEUMATOPHORES, MARSH GRASS, CANOPY LEAVES & DRIFTING LEAVES
    // =========================================================================
    const dummy = new THREE.Object3D();

    // 4A. Instanced Pneumatophore spikes (420 vertical breathing root spikes)
    const PNEUMA_COUNT = 420;
    const pneumaGeo = new THREE.ConeGeometry(0.026, 0.34, 6);
    pneumaGeo.translate(0, 0.17, 0);
    const pneumaMat = new THREE.MeshStandardMaterial({
      color: 0x563b28,
      roughness: 0.55,
      metalness: 0.05
    });
    const pneumaInst = new THREE.InstancedMesh(pneumaGeo, pneumaMat, PNEUMA_COUNT);
    pneumaInst.castShadow = true;
    pneumaInst.receiveShadow = true;

    {
      const cTip = new THREE.Color(0x886748);
      const cBase = new THREE.Color(0x4a3121);
      const tmpC = new THREE.Color();
      let placed = 0;
      let attempts = 0;

      while (placed < PNEUMA_COUNT && attempts < 4500) {
        attempts++;
        // Cluster around trees and mud banks
        const tCfg = TREE_CONFIGS[placed % TREE_CONFIGS.length];
        const useCluster = rand() < 0.76;
        let px, pz;
        if (useCluster) {
          const ang = randRange(0, Math.PI * 2);
          const rad = randRange(0.45, 2.25);
          px = tCfg.x + Math.cos(ang) * rad;
          pz = tCfg.z + Math.sin(ang) * rad;
        } else {
          px = randRange(-SLAB_RX * 0.86, SLAB_RX * 0.86);
          pz = randRange(-SLAB_RZ * 0.86, SLAB_RZ * 0.86);
        }

        if (!isInsideSlab(px, pz, 0.45)) continue;
        const py = getTerrainHeight(px, pz);
        // Pneumatophores thrive in shallow water edges and mud banks
        if (py < WATER_Y - 0.11 || py > 0.62) continue;

        dummy.position.set(px, py - 0.03, pz);
        dummy.rotation.set(randRange(-0.14, 0.14), randRange(0, Math.PI * 2), randRange(-0.14, 0.14));
        const hScale = randRange(0.55, 1.38);
        const rScale = randRange(0.75, 1.25);
        dummy.scale.set(rScale, hScale, rScale);
        dummy.updateMatrix();
        pneumaInst.setMatrixAt(placed, dummy.matrix);

        tmpC.lerpColors(cBase, cTip, randRange(0.15, 0.9));
        pneumaInst.setColorAt(placed, tmpC);
        placed++;
      }
      pneumaInst.instanceMatrix.needsUpdate = true;
      if (pneumaInst.instanceColor) pneumaInst.instanceColor.needsUpdate = true;
      worldGroup.add(pneumaInst);
    }

    // 4B. Instanced Coastal Marsh Grass Blades (360 blades in lush tufts)
    const GRASS_COUNT = 360;
    const grassGeo = new THREE.ConeGeometry(0.022, 0.42, 4);
    grassGeo.translate(0, 0.21, 0);
    const grassMat = new THREE.MeshStandardMaterial({
      color: 0x67b848,
      roughness: 0.48,
      metalness: 0.02
    });
    const grassInst = new THREE.InstancedMesh(grassGeo, grassMat, GRASS_COUNT);
    grassInst.castShadow = true;
    grassInst.receiveShadow = true;

    const grassClumps = [
      { x: -1.45, z: -0.65 },
      { x: -3.25, z: 0.85 },
      { x: -1.85, z: 2.35 },
      { x: 1.55, z: 2.15 },
      { x: 3.15, z: 0.65 },
      { x: 1.65, z: -0.55 },
      { x: 0.95, z: -2.25 },
      { x: -0.95, z: -2.10 },
      { x: -2.65, z: -2.15 },
      { x: 2.65, z: -2.15 }
    ];

    {
      const gCol1 = new THREE.Color(0x7cd152);
      const gCol2 = new THREE.Color(0x3f9138);
      const tmpG = new THREE.Color();

      for (let i = 0; i < GRASS_COUNT; i++) {
        const clump = grassClumps[i % grassClumps.length];
        const ang = randRange(0, Math.PI * 2);
        const rad = randRange(0.02, 0.45);
        const gx = clump.x + Math.cos(ang) * rad;
        const gz = clump.z + Math.sin(ang) * rad;
        const gy = Math.max(WATER_Y - 0.02, getTerrainHeight(gx, gz) - 0.02);

        dummy.position.set(gx, gy, gz);
        dummy.rotation.set(
          Math.sin(ang) * randRange(0.15, 0.48),
          randRange(0, Math.PI * 2),
          -Math.cos(ang) * randRange(0.15, 0.48)
        );
        dummy.scale.set(randRange(0.8, 1.3), randRange(0.65, 1.45), randRange(0.8, 1.3));
        dummy.updateMatrix();
        grassInst.setMatrixAt(i, dummy.matrix);

        tmpG.lerpColors(gCol2, gCol1, rand());
        grassInst.setColorAt(i, tmpG);
      }
      grassInst.instanceMatrix.needsUpdate = true;
      if (grassInst.instanceColor) grassInst.instanceColor.needsUpdate = true;
      worldGroup.add(grassInst);
    }

    // 4C. Instanced Mangrove Canopy Leaves (720 detailed sunlit leaves across crowns)
    const CANOPY_LEAF_COUNT = 720;
    const leafGeo = new THREE.OctahedronGeometry(0.11, 1);
    leafGeo.scale(0.55, 0.16, 1.35);
    const leafMat = new THREE.MeshStandardMaterial({
      color: 0x6bd14e,
      roughness: 0.38,
      metalness: 0.04
    });
    const canopyLeafInst = new THREE.InstancedMesh(leafGeo, leafMat, CANOPY_LEAF_COUNT);
    canopyLeafInst.castShadow = true;
    canopyLeafInst.receiveShadow = true;

    const canopyLeafData = [];
    {
      const lBright = new THREE.Color(0x9be65a);
      const lMid = new THREE.Color(0x4eb33e);
      const lDark = new THREE.Color(0x287832);
      const lGold = new THREE.Color(0xdbe048); // Sunlit golden-green mangrove leaf accent
      const tmpL = new THREE.Color();

      for (let i = 0; i < CANOPY_LEAF_COUNT; i++) {
        const sp = leafSpawnPoints[i % leafSpawnPoints.length];
        const theta = randRange(0, Math.PI * 2);
        const phi = Math.acos(randRange(-0.65, 1.0));
        const r = sp.radius * randRange(0.68, 1.24);

        const lx = sp.wx + r * Math.sin(phi) * Math.cos(theta);
        const ly = sp.wy + r * 0.68 * Math.cos(phi);
        const lz = sp.wz + r * Math.sin(phi) * Math.sin(theta);

        const rx = randRange(-0.8, 0.8);
        const ry = randRange(0, Math.PI * 2);
        const rz = randRange(-0.8, 0.8);
        const sc = randRange(0.82, 1.48);

        canopyLeafData.push({
          lx, ly, lz, rx, ry, rz, sc,
          treeIndex: sp.treeIndex
        });

        dummy.position.set(lx, ly, lz);
        dummy.rotation.set(rx, ry, rz);
        dummy.scale.setScalar(sc);
        dummy.updateMatrix();
        canopyLeafInst.setMatrixAt(i, dummy.matrix);

        const pick = rand();
        if (pick < 0.08) {
          tmpL.copy(lGold);
        } else if (pick < 0.48) {
          tmpL.lerpColors(lMid, lBright, (ly - 1.5) / 2.2);
        } else {
          tmpL.lerpColors(lDark, lMid, rand());
        }
        canopyLeafInst.setColorAt(i, tmpL);
      }
      canopyLeafInst.instanceMatrix.needsUpdate = true;
      if (canopyLeafInst.instanceColor) canopyLeafInst.instanceColor.needsUpdate = true;
      worldGroup.add(canopyLeafInst);
    }

    // 4D. Instanced Drifting Leaf Litter on the Water Channel & Pools (56 floating leaves)
    const DRIFT_LEAF_COUNT = 56;
    const driftLeafMat = new THREE.MeshStandardMaterial({
      color: 0xd4a638,
      roughness: 0.35,
      metalness: 0.05
    });
    const driftLeafInst = new THREE.InstancedMesh(leafGeo, driftLeafMat, DRIFT_LEAF_COUNT);
    const driftLeaves = [];

    {
      const cYellow = new THREE.Color(0xe6be43);
      const cOlive = new THREE.Color(0x7ab53b);
      const cRusset = new THREE.Color(0xc96f32);
      const tmpD = new THREE.Color();

      for (let i = 0; i < DRIFT_LEAF_COUNT; i++) {
        const inPool = i >= 42;
        const poolIdx = i % 2;
        const u = (i / 42) + randRange(-0.015, 0.015);
        driftLeaves.push({
          inPool,
          poolIdx,
          u: ((u % 1) + 1) % 1,
          speed: randRange(0.018, 0.036),
          lateralOffset: randRange(-0.58, 0.58),
          poolAngle: randRange(0, Math.PI * 2),
          poolRad: randRange(0.15, 0.72),
          rotY: randRange(0, Math.PI * 2),
          rotSpeed: randRange(-0.45, 0.45),
          scale: randRange(0.85, 1.35),
          phase: randRange(0, Math.PI * 2)
        });

        const r = rand();
        if (r < 0.45) tmpD.copy(cYellow);
        else if (r < 0.8) tmpD.copy(cOlive);
        else tmpD.copy(cRusset);
        driftLeafInst.setColorAt(i, tmpD);
      }
      if (driftLeafInst.instanceColor) driftLeafInst.instanceColor.needsUpdate = true;
      worldGroup.add(driftLeafInst);
    }

    // =========================================================================
    // 5. FIDDLER CRABS (SCULPTED WITH OVERSIZED MAJOR CLAW + TAP-TO-SCUTTLE)
    // =========================================================================
    const crabs = [];
    const crabHitProxies = [];

    const crabShellMat = new THREE.MeshStandardMaterial({
      color: 0xe84422,
      roughness: 0.28,
      metalness: 0.08
    });

    // Shared crab geometries

    const CRAB_SPAWNS = [
      { x: -0.92, z: 0.48, scale: 1.38, isHero: true },   // Hero oversized-claw fiddler crab front-center!
      { x: 0.88, z: 1.25, scale: 1.12, isHero: false },
      { x: -1.68, z: 2.38, scale: 1.14, isHero: false },
      { x: 1.48, z: -0.25, scale: 1.15, isHero: false },
      { x: -1.15, z: -1.05, scale: 1.10, isHero: false },

      { x: -2.42, z: -0.45, scale: 1.06, isHero: false },

    function buildCrabs() {
      for (let i = 0; i < CRAB_SPAWNS.length; i++) {
        const sp = CRAB_SPAWNS[i];
        const root = new THREE.Group();
        const bodyPivot = new THREE.Group();
        bodyPivot.position.y = 0.095;
        root.add(bodyPivot);

        // Carapace shell
        const shellMesh = new THREE.Mesh(carapaceGeo, sp.isHero ? crabKingShellMat : crabShellMat);
        shellMesh.castShadow = true;
        shellMesh.receiveShadow = true;
        bodyPivot.add(shellMesh);

        // High-contrast turquoise/cream dorsal marking
        const markMesh = new THREE.Mesh(carapaceMarkingGeo, crabTurquoiseSpotMat);
        markMesh.position.set(0, 0.055, -0.01);
        bodyPivot.add(markMesh);

        // Tall fiddler crab eyestalks
        for (let side = -1; side <= 1; side += 2) {
          const stalk = new THREE.Mesh(eyeStalkGeo, crabShellMat);
          stalk.position.set(side * 0.055, 0.05, 0.085);
          stalk.rotation.z = -side * 0.14;
          stalk.rotation.x = 0.15;
          const eye = new THREE.Mesh(eyeBallGeo, eyeDarkMat);
          eye.position.set(0, 0.095, 0);
          stalk.add(eye);
          bodyPivot.add(stalk);
        }

        // Oversized Major Fiddle Claw (extra huge on hero crab, clearly visible on all male fiddlers)
        const majorClawPivot = new THREE.Group();
        const clawHandedness = i % 2 === 0 ? 1 : -1;
        majorClawPivot.position.set(clawHandedness * 0.13, 0.01, 0.10);
        const majorScale = sp.isHero ? 1.42 : 1.08;
        majorClawPivot.scale.set(clawHandedness * majorScale, majorScale, majorScale);

        const palm = new THREE.Mesh(majorPalmGeo, crabBigClawMat);
        palm.position.set(0.06, 0.02, 0.02);
        palm.castShadow = true;
        majorClawPivot.add(palm);

        const dactylPivot = new THREE.Group();
        dactylPivot.position.set(0.11, 0.02, 0.02);
        const upperPin = new THREE.Mesh(majorPincerUpperGeo, crabClawTipMat);
        upperPin.castShadow = true;
        dactylPivot.add(upperPin);
        majorClawPivot.add(dactylPivot);

        const lowerPin = new THREE.Mesh(majorPincerLowerGeo, crabClawTipMat);
        lowerPin.position.set(0.11, 0.01, 0.02);
        lowerPin.castShadow = true;
        majorClawPivot.add(lowerPin);

        bodyPivot.add(majorClawPivot);

        // Minor feeding claw on opposite side
        const minorClawPivot = new THREE.Group();
        minorClawPivot.position.set(-clawHandedness * 0.12, -0.01, 0.095);
        const minorClawMesh = new THREE.Mesh(minorClawGeo, crabBigClawMat);
        minorClawPivot.add(minorClawMesh);
        bodyPivot.add(minorClawPivot);

        // 8 Articulated Walking Legs (4 per side)
        const legs = [];
        for (let side = -1; side <= 1; side += 2) {
          for (let l = 0; l < 4; l++) {
            const legGroup = new THREE.Group();
            const zOff = 0.055 - l * 0.042;
            legGroup.position.set(side * 0.12, -0.01, zOff);

            const upper = new THREE.Mesh(legUpperGeo, crabLegMat);
            upper.rotation.z = side * 0.85;
            upper.castShadow = true;

            const lower = new THREE.Mesh(legLowerGeo, crabLegMat);
            lower.position.set(0, -0.10, 0);
            lower.rotation.z = -side * 0.52;
            upper.add(lower);

            legGroup.add(upper);
            bodyPivot.add(legGroup);
            legs.push({ group: legGroup, side, index: l });
          }
        }

        // Generous invisible tap proxy attached to crab
        const proxy = new THREE.Mesh(crabProxyGeo, invisibleProxyMat);
        proxy.position.set(0, 0.18, 0);
        proxy.userData.crabIndex = i;
        root.add(proxy);
        crabHitProxies.push(proxy);

        const groundY = getTerrainHeight(sp.x, sp.z);
        root.position.set(sp.x, groundY, sp.z);
        root.scale.setScalar(sp.scale);
        const startYaw = randRange(0, Math.PI * 2);
        root.rotation.y = startYaw;
        worldGroup.add(root);

        crabs.push({
          index: i,
          root,
          bodyPivot,
          majorClawPivot,
          dactylPivot,
          minorClawPivot,
          legs,
          clawHandedness,
          scale: sp.scale,
          x: sp.x,
          z: sp.z,
          yaw: startYaw,
          state: 'idle', // 'idle' | 'scuttle' | 'edgePause'
          scuttleStartTime: 0,
          scuttleDuration: 420,
          startX: sp.x,
          startZ: sp.z,
          targetX: sp.x,
          targetZ: sp.z,
          stoppedAtWater: false,
          edgePauseEndTime: 0,
          nextWanderTime: randRange(1200, 3800),
          wanderStartX: sp.x,
          wanderStartZ: sp.z,
          wanderTargetX: sp.x,
          wanderTargetZ: sp.z,
          wanderStartTime: 0,
          wanderDuration: 1500,
          isWandering: false,
          phase: randRange(0, Math.PI * 2),
          lastPuffTime: 0
        });
      }
    }

    buildCrabs();

    // =========================================================================
    // 6. MUDSKIPPERS AT THE WATER EDGE + FLASH FISH UNDER THE SURFACE
    // =========================================================================
    const mudskippers = [];
    const mudskipperBodyMat = new THREE.MeshStandardMaterial({
      color: 0x6f7d54,
      roughness: 0.25,
      metalness: 0.08
    });
    const mudskipperBellyMat = new THREE.MeshStandardMaterial({
      color: 0xd6dec2,
      roughness: 0.32
    });
    const mudskipperFinMat = new THREE.MeshStandardMaterial({
      color: 0x3ca69a,
      roughness: 0.30,
      side: THREE.DoubleSide
    });

    const MUDSKIPPER_SPAWNS = [
      { x: -0.52, z: -0.25, yaw: 0.65, bankSign: -1 },
      { x: 0.56, z: 0.82, yaw: -2.15, bankSign: 1 },
      { x: -1.68, z: 1.05, yaw: -0.45, bankSign: -1 }
    ];

    function buildMudskippers() {
      const headGeo = new THREE.SphereGeometry(0.085, 12, 10);
      headGeo.scale(1.15, 0.85, 1.35);
      const tailGeo = new THREE.ConeGeometry(0.072, 0.32, 10);
      tailGeo.rotateX(-Math.PI / 2);
      tailGeo.translate(0, 0, -0.18);
      const dorsalGeo = new THREE.PlaneGeometry(0.22, 0.12, 3, 1);
      dorsalGeo.rotateY(Math.PI / 2);
      dorsalGeo.translate(0, 0.08, -0.08);
      const pecFinGeo = new THREE.SphereGeometry(0.048, 8, 6);
      pecFinGeo.scale(1.3, 0.25, 0.75);

      for (let i = 0; i < MUDSKIPPER_SPAWNS.length; i++) {
        const sp = MUDSKIPPER_SPAWNS[i];
        const group = new THREE.Group();
        const animPivot = new THREE.Group();
        animPivot.position.y = 0.055;
        group.add(animPivot);

        const head = new THREE.Mesh(headGeo, mudskipperBodyMat);
        head.castShadow = true;
        animPivot.add(head);

        const belly = new THREE.Mesh(headGeo, mudskipperBellyMat);
        belly.scale.set(0.92, 0.55, 0.92);
        belly.position.y = -0.025;
        animPivot.add(belly);

        const tailPivot = new THREE.Group();
        const tail = new THREE.Mesh(tailGeo, mudskipperBodyMat);
        tail.castShadow = true;
        tailPivot.add(tail);
        animPivot.add(tailPivot);

        const dorsalFin = new THREE.Mesh(dorsalGeo, mudskipperFinMat);
        animPivot.add(dorsalFin);

        // Bulging periscope eyes on top of head
        for (let side = -1; side <= 1; side += 2) {
          const eyeTurret = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), mudskipperBodyMat);
          eyeTurret.position.set(side * 0.034, 0.072, 0.068);
          const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.017, 8, 8), eyeDarkMat);
          pupil.position.set(0, 0.006, 0.018);
          eyeTurret.add(pupil);
          animPivot.add(eyeTurret);

          const pecFin = new THREE.Mesh(pecFinGeo, mudskipperFinMat);
          pecFin.position.set(side * 0.085, -0.025, 0.02);
          pecFin.rotation.z = -side * 0.28;
          animPivot.add(pecFin);
        }

        const gy = Math.max(WATER_Y + 0.01, getTerrainHeight(sp.x, sp.z));
        group.position.set(sp.x, gy, sp.z);
        group.rotation.y = sp.yaw;
        group.scale.setScalar(1.18);
        worldGroup.add(group);

        mudskippers.push({
          group,
          animPivot,
          tailPivot,
          dorsalFin,
          homeX: sp.x,
          homeY: gy,
          homeZ: sp.z,
          homeYaw: sp.yaw,
          x: sp.x,
          y: gy,
          z: sp.z,
          yaw: sp.yaw,
          state: 'idle',
          leapStartTime: 0,
          leapDuration: 680,
          startX: sp.x,
          startY: gy,
          startZ: sp.z,
          targetX: sp.x,
          targetY: gy,
          targetZ: sp.z,
          phase: randRange(0, Math.PI * 2)
        });
      }
    }

    buildMudskippers();

    // Flash fish under the water surface (silvery-gold & turquoise darting fish)
    const flashFishes = [];
    const fishBodyMat = new THREE.MeshStandardMaterial({
      color: 0xffdf7a,
      roughness: 0.14,
      metalness: 0.65,
      emissive: 0x3b8c7c,
