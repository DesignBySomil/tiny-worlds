    function buildFlashFishes() {
      const fishGeo = new THREE.ConeGeometry(0.055, 0.28, 8);
      fishGeo.rotateX(Math.PI / 2);
      fishGeo.scale(0.65, 1.0, 1.0);
      const tailFinGeo = new THREE.ConeGeometry(0.05, 0.10, 4);
      tailFinGeo.rotateX(-Math.PI / 2);
      tailFinGeo.scale(0.3, 1.0, 1.0);
      tailFinGeo.translate(0, 0, -0.16);

      for (let i = 0; i < 4; i++) {
        const fishGroup = new THREE.Group();
        const body = new THREE.Mesh(fishGeo, fishBodyMat);
        const tail = new THREE.Mesh(tailFinGeo, fishBodyMat);
        fishGroup.add(body);
        fishGroup.add(tail);

        const u = (i + 0.5) / 4;
        const z = lerp(-SLAB_RZ * 0.72, SLAB_RZ * 0.72, u);
        const x = getChannelCenterX(z);
        fishGroup.position.set(x, WATER_Y - 0.06, z);
        worldGroup.add(fishGroup);

        flashFishes.push({
          group: fishGroup,
          tail,
          u,
          speed: randRange(0.05, 0.08),
          dartStartTime: -9999,
          dartDuration: 620,
          dartFromX: x,
          dartFromZ: z,
          dartToX: x,
          dartToZ: z,
          phase: randRange(0, Math.PI * 2)
        });
      }
    }

    buildFlashFishes();

    // =========================================================================
    // 7. WHITE EGRETS (PERCHED & WADING, GRACEFUL HEAD-DIPPING IDLE)
    // =========================================================================
    const egrets = [];
    const egretWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xfdfdfb,
      roughness: 0.34,
      metalness: 0.02
    });
    const egretBillMat = new THREE.MeshStandardMaterial({
      color: 0xffb624,
      roughness: 0.28
    });
    const egretLegMat = new THREE.MeshStandardMaterial({
      color: 0x222c2a,
      roughness: 0.45
    });

    function buildEgretMesh(isPerched) {
      const root = new THREE.Group();
      const legHeight = isPerched ? 0.34 : 0.44;

      // Long slender dark wading legs
      for (let side = -1; side <= 1; side += 2) {
        const leg = new THREE.Mesh(
          new THREE.CylinderGeometry(0.012, 0.010, legHeight, 6),
          egretLegMat
        );
        leg.position.set(side * 0.045, legHeight * 0.5, 0);
        leg.castShadow = true;
        root.add(leg);
      }

      // Body pivot
      const bodyPivot = new THREE.Group();
      bodyPivot.position.set(0, legHeight, 0);
      root.add(bodyPivot);

      const torsoGeo = new THREE.SphereGeometry(0.14, 14, 12);
      torsoGeo.scale(0.82, 0.88, 1.52);
      const torso = new THREE.Mesh(torsoGeo, egretWhiteMat);
      torso.position.set(0, 0.02, -0.03);
      torso.rotation.x = -0.18;
      torso.castShadow = true;
      torso.receiveShadow = true;
      bodyPivot.add(torso);

      // Folded wing plumes
      for (let side = -1; side <= 1; side += 2) {
        const wingGeo = new THREE.SphereGeometry(0.11, 10, 8);
        wingGeo.scale(0.35, 0.72, 1.55);
        const wing = new THREE.Mesh(wingGeo, egretWhiteMat);
        wing.position.set(side * 0.095, 0.03, -0.05);
        wing.rotation.x = -0.22;
        wing.castShadow = true;
        bodyPivot.add(wing);
      }

      // Tail feathers
      const tailGeo = new THREE.ConeGeometry(0.075, 0.24, 6);
      tailGeo.rotateX(-Math.PI * 0.62);
      const tail = new THREE.Mesh(tailGeo, egretWhiteMat);
      tail.position.set(0, -0.04, -0.24);
      bodyPivot.add(tail);

      // Articulated S-curve neck + head + yellow dagger bill
      const neckPivot = new THREE.Group();
      neckPivot.position.set(0, 0.08, 0.14);
      bodyPivot.add(neckPivot);

      const neckCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0.13, 0.06),
        new THREE.Vector3(0, 0.26, -0.02),
        new THREE.Vector3(0, 0.36, 0.04)
      ]);
      const neckGeo = createTaperedTube(neckCurve, 12, 0.038, 0.026, 7);
      const neckMesh = new THREE.Mesh(neckGeo, egretWhiteMat);
      neckMesh.castShadow = true;
      neckPivot.add(neckMesh);

      const headPivot = new THREE.Group();
      headPivot.position.set(0, 0.37, 0.045);
      neckPivot.add(headPivot);

      const headGeo = new THREE.SphereGeometry(0.048, 10, 10);
      headGeo.scale(0.85, 0.9, 1.25);
      const headMesh = new THREE.Mesh(headGeo, egretWhiteMat);
      headMesh.castShadow = true;
      headPivot.add(headMesh);

      const billGeo = new THREE.ConeGeometry(0.018, 0.19, 6);
      billGeo.rotateX(Math.PI / 2);
      billGeo.translate(0, -0.005, 0.12);
      const billMesh = new THREE.Mesh(billGeo, egretBillMat);
      billMesh.castShadow = true;
      headPivot.add(billMesh);

      for (let side = -1; side <= 1; side += 2) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.011, 6, 6), eyeDarkMat);
        eye.position.set(side * 0.034, 0.01, 0.025);
        headPivot.add(eye);
      }

      return { root, bodyPivot, neckPivot, headPivot };
    }

    function buildEgrets() {
      // Egret 1: Wading in the left shallow pool
      const eg1 = buildEgretMesh(false);
      eg1.root.position.set(-2.35, getTerrainHeight(-2.35, 1.15), 1.15);
      eg1.root.rotation.y = 0.85;
      eg1.root.scale.setScalar(1.12);
      worldGroup.add(eg1.root);
      egrets.push({ ...eg1, phase: 0.4, speed: 0.95, isPerched: false });

      // Egret 2: Wading at the shallow bend of the main channel
      const eg2 = buildEgretMesh(false);
      eg2.root.position.set(2.22, getTerrainHeight(2.22, -1.15), -1.15);
      eg2.root.rotation.y = -1.15;
      eg2.root.scale.setScalar(1.10);
      worldGroup.add(eg2.root);
      egrets.push({ ...eg2, phase: 2.3, speed: 1.15, isPerched: false });

      // Egret 3: Perched high on the signature mangrove root arch
      const eg3 = buildEgretMesh(true);
      const perch = perchPoints[0] || new THREE.Vector3(-1.35, 0.72, -1.15);
      eg3.root.position.copy(perch);
      eg3.root.rotation.y = 0.55;
      eg3.root.scale.setScalar(1.06);
      worldGroup.add(eg3.root);
      egrets.push({ ...eg3, phase: 4.1, speed: 0.82, isPerched: true });
    }

    buildEgrets();

    // =========================================================================
    // 8. DYNAMIC FX POOLS: INSTANCED DROPLETS / MUD PUFFS, RIPPLE RINGS, BUBBLES
    // =========================================================================
    // 8A. Instanced Droplets & Mud Puff Particles (320 dynamic particles)
    const PARTICLE_COUNT = 320;
    const particleGeo = new THREE.SphereGeometry(0.036, 7, 7);
    const particleMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.18,
      metalness: 0.05
    });
    const particleInst = new THREE.InstancedMesh(particleGeo, particleMat, PARTICLE_COUNT);
    worldGroup.add(particleInst);

    const particles = [];
    const colWaterDrop = new THREE.Color(0xcffaf6);
    const colSplashFoam = new THREE.Color(0xffffff);
    const colMudPuff = new THREE.Color(0x8c5e3c);
    const colCrabSpark = new THREE.Color(0xff9f59);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        active: false,
        startTime: 0,
        duration: 500,
        x0: 0,
        y0: -10,
        z0: 0,
        vx: 0,
        vy: 0,
        vz: 0,
        gravity: 9.5,
        scale: 1.0,
        isWater: true
      });
      dummy.position.set(0, -10, 0);
      dummy.scale.setScalar(0.001);
      dummy.updateMatrix();
      particleInst.setMatrixAt(i, dummy.matrix);
      particleInst.setColorAt(i, colWaterDrop);
    }
    particleInst.instanceMatrix.needsUpdate = true;
    if (particleInst.instanceColor) particleInst.instanceColor.needsUpdate = true;

    let nextParticleCursor = 0;
    function spawnParticle(opts, now) {
      const idx = nextParticleCursor;
      nextParticleCursor = (nextParticleCursor + 1) % PARTICLE_COUNT;
      const p = particles[idx];
      p.active = true;
      p.startTime = now;
      p.duration = opts.duration || 520;
      p.x0 = opts.x;
      p.y0 = opts.y;
      p.z0 = opts.z;
      p.vx = opts.vx;
      p.vy = opts.vy;
      p.vz = opts.vz;
      p.gravity = opts.gravity !== undefined ? opts.gravity : 9.8;
      p.scale = opts.scale || 1.0;
      p.isWater = !!opts.isWater;
      particleInst.setColorAt(idx, opts.color || colWaterDrop);
      if (particleInst.instanceColor) particleInst.instanceColor.needsUpdate = true;
    }

    // 8B. Expanding Concentric Ripple Rings + Splash Crown Pool
    const MAX_RIPPLES = 24;
    const rippleRingGeo = new THREE.RingGeometry(0.82, 1.0, 36);
    rippleRingGeo.rotateX(-Math.PI / 2);
    const ripples = [];

    for (let i = 0; i < MAX_RIPPLES; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0xe8fffe : 0x6ef2e6,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(rippleRingGeo, mat);
      mesh.visible = false;
      mesh.position.y = WATER_Y + 0.012;
      worldGroup.add(mesh);
      ripples.push({
        mesh,
        mat,
        active: false,
        startTime: 0,
        duration: 1200,
        x: 0,
        z: 0,
        startRadius: 0.05,
        maxRadius: 1.0,
        maxOpacity: 0.85
      });
    }

    let nextRippleCursor = 0;
    function spawnRippleRing(x, z, startTime, duration, startRadius, maxRadius, maxOpacity) {
      const r = ripples[nextRippleCursor];
      nextRippleCursor = (nextRippleCursor + 1) % MAX_RIPPLES;
      r.active = true;
      r.startTime = startTime;
      r.duration = duration;
      r.x = x;
      r.z = z;
      r.startRadius = startRadius;
      r.maxRadius = maxRadius;
      r.maxOpacity = maxOpacity;
      r.mesh.position.set(x, WATER_Y + 0.012, z);
      r.mesh.scale.setScalar(startRadius);
      r.mesh.visible = true;
    }

    // Active water wave impulses (deform the actual 3D water mesh vertices!)
    const waterWaves = [];

    // 8C. Rising Bubble Trails in Channel & Pools
    const BUBBLE_COUNT = 36;
    const bubbleGeo = new THREE.SphereGeometry(0.025, 8, 8);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: 0xdffef9,
      transparent: true,
      opacity: 0.78,
      roughness: 0.05,
      metalness: 0.1,
      clearcoat: 1.0
    });
    const bubbleInst = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_COUNT);
    worldGroup.add(bubbleInst);

    const bubbles = [];
    for (let i = 0; i < BUBBLE_COUNT; i++) {
      const z = randRange(-SLAB_RZ * 0.76, SLAB_RZ * 0.76);
      const cx = getChannelCenterX(z) + randRange(-0.45, 0.45);
      bubbles.push({
        x: cx,
        z,
        yOffset: rand(),
        speed: randRange(0.32, 0.65),
        scale: randRange(0.65, 1.35),
        phase: randRange(0, Math.PI * 2),
        popTriggered: false
      });
    }

    // =========================================================================
    // 9. INTERACTION HANDLERS: CRAB SCUTTLE & WATER SPLASH
    // =========================================================================
    function triggerCrabScuttle(crab, now) {
      crab.state = 'scuttle';
      crab.isWandering = false;
      crab.scuttleStartTime = now;
      crab.scuttleDuration = randRange(360, 460);
      crab.startX = crab.x;
      crab.startZ = crab.z;

      // Pick a brisk sideways destination a short distance away on the mud flat
      let chosenX = crab.x;
      let chosenZ = crab.z;
      let stoppedNearWater = false;

      for (let attempt = 0; attempt < 22; attempt++) {
        // Sideways scurry angle relative to crab's current facing or random lively direction
        const dirSign = attempt % 2 === 0 ? 1 : -1;
        const baseAngle = crab.yaw + dirSign * (Math.PI * 0.5) + randRange(-0.55, 0.55);
        const dist = randRange(0.95, 1.65);

        // Step along ray to see if it approaches water channel or pool edge
        let prevX = crab.x;
        let prevZ = crab.z;
        let hitWaterEdge = false;
        let validSteps = 0;

        const steps = 12;
        for (let s = 1; s <= steps; s++) {
          const frac = s / steps;
          const sx = crab.x + Math.cos(baseAngle) * dist * frac;
          const sz = crab.z + Math.sin(baseAngle) * dist * frac;

          if (!isInsideSlab(sx, sz, 0.72)) break;

          // Avoid colliding directly into tree trunks
          let nearTrunk = false;
          for (let t = 0; t < TREE_CONFIGS.length; t++) {
            const tc = TREE_CONFIGS[t];
            const dTrunk = Math.hypot(sx - tc.x, sz - tc.z);
            if (dTrunk < 0.58) {
              nearTrunk = true;
              break;
            }
          }
          if (nearTrunk) break;

          const h = getTerrainHeight(sx, sz);
          if (h <= WATER_Y + 0.045) {
            // Reached water's edge! Pause right at the shore!
            hitWaterEdge = true;
            break;
          }

          prevX = sx;
          prevZ = sz;
          validSteps = s;
        }

        const moveDist = Math.hypot(prevX - crab.x, prevZ - crab.z);
        if (validSteps >= 4 && moveDist >= 0.48) {
          chosenX = prevX;
          chosenZ = prevZ;
          stoppedNearWater = hitWaterEdge;
          break;
        }
      }

      // Fallback if boxed in: scuttle toward nearest open mud bank
      if (Math.hypot(chosenX - crab.x, chosenZ - crab.z) < 0.35) {
        for (let k = 0; k < CRAB_SPAWNS.length; k++) {
          const sp = CRAB_SPAWNS[(crab.index + k + 1) % CRAB_SPAWNS.length];
          const d = Math.hypot(sp.x - crab.x, sp.z - crab.z);
          if (d > 0.55 && d < 2.2) {
            chosenX = sp.x + randRange(-0.18, 0.18);
            chosenZ = sp.z + randRange(-0.18, 0.18);
            break;
          }
        }
      }

      crab.targetX = chosenX;
      crab.targetZ = chosenZ;
      crab.stoppedAtWater = stoppedNearWater;

      // Orient crab so its lateral axis aligns with the sideways scuttle direction!
      const moveAngle = Math.atan2(chosenX - crab.x, chosenZ - crab.z);
      crab.yaw = moveAngle + (crab.clawHandedness > 0 ? Math.PI * 0.5 : -Math.PI * 0.5);

      // Burst of startle mud puffs & golden-orange sand flecks
      const baseH = getTerrainHeight(crab.x, crab.z);
      for (let p = 0; p < 18; p++) {
        const ang = randRange(0, Math.PI * 2);
        const spd = randRange(0.65, 1.85);
        spawnParticle({
          x: crab.x + Math.cos(ang) * 0.08,
          y: baseH + 0.04,
          z: crab.z + Math.sin(ang) * 0.08,
          vx: Math.cos(ang) * spd,
          vy: randRange(1.25, 2.55),
          vz: Math.sin(ang) * spd,
          gravity: 9.2,
          duration: randRange(340, 520),
          scale: randRange(0.9, 1.55),
          isWater: false,
          color: p % 4 === 0 ? colCrabSpark : colMudPuff
        }, now);
      }
    }

    function triggerWaterSplash(wx, wz, now) {
      // Snap tap point to nearest water channel/pool if slightly on mud bank
      let sx = wx;
      let sz = wz;
      if (getWaterSignedMetric(sx, sz) > 0.08) {
        const cx = getChannelCenterX(sz);
        sx = lerp(sx, cx, 0.72);
      }

      // 1. Add dynamic wave deformation to water surface
      waterWaves.push({
        x: sx,
        z: sz,
        startTime: now,
        duration: 1850,
        amplitude: 0.095
      });
      if (waterWaves.length > 8) waterWaves.shift();

      // 2. Spawn 4 concentric expanding ripple rings with staggered timing
      spawnRippleRing(sx, wz, now, 880, 0.08, 0.95, 0.95);
      spawnRippleRing(sx, sz, now + 90, 1150, 0.06, 1.42, 0.82);
      spawnRippleRing(sx, sz, now + 210, 1420, 0.05, 1.85, 0.68);
      spawnRippleRing(sx, sz, now + 340, 1650, 0.04, 2.20, 0.48);

      // 3. Scatter glossy water droplets in lively crown & arcs
      for (let i = 0; i < 34; i++) {
        const ang = (i / 34) * Math.PI * 2 + randRange(-0.12, 0.12);
        const isCrown = i < 16;
        const hSpeed = isCrown ? randRange(0.55, 1.25) : randRange(1.15, 2.35);
        const vSpeed = isCrown ? randRange(2.35, 3.55) : randRange(1.45, 2.85);
        spawnParticle({
          x: sx + Math.cos(ang) * 0.06,
          y: WATER_Y + 0.03,
          z: sz + Math.sin(ang) * 0.06,
          vx: Math.cos(ang) * hSpeed,
          vy: vSpeed,
          vz: Math.sin(ang) * hSpeed,
          gravity: 9.8,
          duration: randRange(440, 740),
          scale: isCrown ? randRange(1.15, 1.75) : randRange(0.75, 1.35),
          isWater: true,
          color: i % 3 === 0 ? colSplashFoam : colWaterDrop
        }, now);
      }

      // 4. Nearest mudskipper leaps in an unmistakable joyful arc!
      let bestSkipper = mudskippers[0];
      let bestDist = 999;
      for (let i = 0; i < mudskippers.length; i++) {
        const m = mudskippers[i];
        const d = Math.hypot(m.x - sx, m.z - sz);
        if (d < bestDist) {
          bestDist = d;
          bestSkipper = m;
        }
      }

      if (bestSkipper) {
        bestSkipper.state = 'leap';
        bestSkipper.leapStartTime = now;
        bestSkipper.leapDuration = 660;
        bestSkipper.startX = bestSkipper.x;
        bestSkipper.startY = bestSkipper.y;
        bestSkipper.startZ = bestSkipper.z;

        // Leap playfully near the splash or back toward its home bank
        const distFromHome = Math.hypot(bestSkipper.x - bestSkipper.homeX, bestSkipper.z - bestSkipper.homeZ);
        if (distFromHome > 0.75) {
          bestSkipper.targetX = bestSkipper.homeX + randRange(-0.22, 0.22);
          bestSkipper.targetZ = bestSkipper.homeZ + randRange(-0.22, 0.22);
        } else {
          const leapAng = Math.atan2(sx - bestSkipper.x, sz - bestSkipper.z) + randRange(-0.45, 0.45);
          const leapDist = clamp(bestDist * 0.55, 0.55, 1.25);
          bestSkipper.targetX = clamp(bestSkipper.x + Math.sin(leapAng) * leapDist, -SLAB_RX * 0.78, SLAB_RX * 0.78);
          bestSkipper.targetZ = clamp(bestSkipper.z + Math.cos(leapAng) * leapDist, -SLAB_RZ * 0.78, SLAB_RZ * 0.78);
        }
        bestSkipper.targetY = Math.max(WATER_Y + 0.01, getTerrainHeight(bestSkipper.targetX, bestSkipper.targetZ));
        bestSkipper.yaw = Math.atan2(bestSkipper.targetX - bestSkipper.startX, bestSkipper.targetZ - bestSkipper.startZ);
      }

      // 5. Nearest subsurface flash-fish darts rapidly past the tap point!
      let bestFish = flashFishes[0];
      let bestFishDist = 999;
      for (let i = 0; i < flashFishes.length; i++) {
        const f = flashFishes[i];
        const d = Math.hypot(f.group.position.x - sx, f.group.position.z - sz);
        if (d < bestFishDist) {
          bestFishDist = d;
          bestFish = f;
        }
      }
      if (bestFish) {
        bestFish.dartStartTime = now;
        bestFish.dartDuration = 580;
        bestFish.dartFromX = sx + randRange(-0.35, 0.35);
        bestFish.dartFromZ = sz + randRange(-0.45, 0.45);
        const nextZ = clamp(sz + (rand() < 0.5 ? 1.35 : -1.35), -SLAB_RZ * 0.74, SLAB_RZ * 0.74);
        bestFish.dartToZ = nextZ;
        bestFish.dartToX = getChannelCenterX(nextZ) + randRange(-0.25, 0.25);
      }
    }

    // =========================================================================
    // 10. POINTER / RAYCASTER SETUP (TAP VS DRAG DISTINCTION, 320PX FRIENDLY)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;
    let isPointerDown = false;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;

      const moveDist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      const elapsed = performance.now() - pointerDownTime;
      // Distinguish tap from orbit drag
      if (moveDist > 9 || elapsed > 550) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNDC, camera);
      const now = performance.now();

      // Priority 1: Check generous crab proxies (and closest crab in screen/world space)
      const crabHits = raycaster.intersectObjects(crabHitProxies, false);
      if (crabHits.length > 0) {
        // Pick the crab whose center is closest to the ray
        let bestCrab = crabs[crabHits[0].object.userData.crabIndex];
        let minRayDist = 999;
        for (let h = 0; h < crabHits.length; h++) {
          const c = crabs[crabHits[h].object.userData.crabIndex];
          const d = raycaster.ray.distanceToPoint(c.root.position);
          if (d < minRayDist) {
            minRayDist = d;
            bestCrab = c;
          }
        }
        triggerCrabScuttle(bestCrab, now);
        return;
      }

      // Priority 2: Check water channel or pools
      const waterHits = raycaster.intersectObject(waterProxyMesh, false);
      if (waterHits.length > 0) {
        const pt = waterHits[0].point;
        if (isInsideSlab(pt.x, pt.z, 0.25)) {
          const waterMetric = getWaterSignedMetric(pt.x, pt.z);
          // Generous water hit tolerance around channel & pools
          if (waterMetric < 0.36) {
            triggerWaterSplash(pt.x, pt.z, now);
            return;
          }

          // If user tapped on the mud bank near a crab, check if a crab is within generous reach
          let closestCrab = null;
          let closestDist = 0.88;
          for (let i = 0; i < crabs.length; i++) {
            const c = crabs[i];
            const d = Math.hypot(c.x - pt.x, c.z - pt.z);
            if (d < closestDist) {
              closestDist = d;
              closestCrab = c;
            }
          }
          if (closestCrab) {
            triggerCrabScuttle(closestCrab, now);
            return;
          }

          // Otherwise if reasonably close to water channel, splash the nearest water point
          if (waterMetric < 0.85) {
            triggerWaterSplash(pt.x, pt.z, now);
          }
        }
      }
    });

    // =========================================================================
    // 11. RESPONSIVE FRAMING & ASPECT-AWARE CAMERA FIT (616x562, 390x844, 320x700)
    // =========================================================================
    // Collect all critical 3D points that must stay strictly inside the safe area
    // between header and footer (full slab perimeter, tallest canopies, root arches,
    // channel extremes, crab scuttle bounds, splash & mudskipper leap heights)
    const framingPoints = [];
    {
      // Slab perimeter & base points
      for (let i = 0; i < 24; i++) {
        const ang = (i / 24) * Math.PI * 2;
        const px = Math.cos(ang) * (SLAB_RX + 0.15);
        const pz = Math.sin(ang) * (SLAB_RZ + 0.15);
        framingPoints.push(new THREE.Vector3(px, -0.95, pz));
        framingPoints.push(new THREE.Vector3(px, 0.45, pz));
      }
      // All tree canopy tops & outer leaf crowns
      for (let i = 0; i < TREE_CONFIGS.length; i++) {
        const tc = TREE_CONFIGS[i];
        const baseH = Math.max(WATER_Y + 0.12, getTerrainHeight(tc.x, tc.z));
        const topX = tc.x + tc.tiltX * tc.height;
        const topZ = tc.z + tc.tiltZ * tc.height;
        const topY = baseH + tc.height + 0.68;
        framingPoints.push(new THREE.Vector3(topX, topY, topZ));
        framingPoints.push(new THREE.Vector3(topX - tc.canopyRadius * 0.9, topY - 0.2, topZ));
        framingPoints.push(new THREE.Vector3(topX + tc.canopyRadius * 0.9, topY - 0.2, topZ));
        framingPoints.push(new THREE.Vector3(topX, topY - 0.2, topZ - tc.canopyRadius * 0.9));
        framingPoints.push(new THREE.Vector3(topX, topY - 0.2, topZ + tc.canopyRadius * 0.9));
      }
      // Max splash & leap height along channel
      framingPoints.push(new THREE.Vector3(0, WATER_Y + 1.45, 0));
    }

    const baseCamDir = new THREE.Vector3(0.36, 0.56, 0.88).normalize();

    function fitCameraToViewport() {
      const vw = Math.max(window.innerWidth, 1);
      const vh = Math.max(window.innerHeight, 1);

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(vw, vh);

      const headerEl = document.getElementById('hudHeader');
      const footerEl = document.getElementById('hudFooter');
      const headerH = headerEl ? headerEl.getBoundingClientRect().height : 58;
      const footerH = footerEl ? footerEl.getBoundingClientRect().height : 34;

      const aspect = vw / vh;
      const isPortrait = aspect < 0.88;

      // On tall portrait viewports (e.g. 390x844, 320x700), give the diorama slightly enhanced
      // vertical stature so canopies and root arches command the vertical space gracefully
      const verticalPresenceScale = isPortrait ? clamp(1.0 + (0.88 - aspect) * 0.34, 1.0, 1.15) : 1.0;
      worldGroup.scale.set(1.0, verticalPresenceScale, 1.0);
      worldGroup.updateMatrixWorld(true);

      // Aspect-aware vertical FOV
      const fovDeg = isPortrait ? clamp(38 + (0.85 - aspect) * 20, 38, 46) : 34;
      camera.fov = fovDeg;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Safe screen fractions with breathing room away from header, footer, and side edges
      const topSafePx = headerH + (isPortrait ? 12 : 10);
      const botSafePx = footerH + (isPortrait ? 12 : 10);
      const sidePadFrac = isPortrait ? 0.042 : 0.048;

      const ndcTopLimit = 1.0 - (topSafePx / vh) * 2.0;
      const ndcBotLimit = -1.0 + (botSafePx / vh) * 2.0;
      const ndcCenterY = (ndcTopLimit + ndcBotLimit) * 0.5;
      const availHalfNdcY = Math.max(0.25, (ndcTopLimit - ndcBotLimit) * 0.5);
      const availHalfNdcX = 1.0 - sidePadFrac * 2.0;

      // Compute exact bounding distance in camera space
      const lookCenter = new THREE.Vector3(0.0, 0.82 * verticalPresenceScale, 0.08);
      const tempCam = camera.clone();

      // Binary/iterative search for exact tight camera distance & vertical target shift
      let dist = isPortrait ? 16.5 : 13.8;
      const ptWorld = new THREE.Vector3();
      const ptNdc = new THREE.Vector3();

      for (let iter = 0; iter < 10; iter++) {
        tempCam.position.copy(lookCenter).addScaledVector(baseCamDir, dist);
        tempCam.lookAt(lookCenter);
        tempCam.updateMatrixWorld(true);

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;

        for (let i = 0; i < framingPoints.length; i++) {
          ptWorld.copy(framingPoints[i]);
          ptWorld.y *= verticalPresenceScale;
          ptNdc.copy(ptWorld).project(tempCam);
          if (ptNdc.x < minX) minX = ptNdc.x;
          if (ptNdc.x > maxX) maxX = ptNdc.x;
          if (ptNdc.y < minY) minY = ptNdc.y;
          if (ptNdc.y > maxY) maxY = ptNdc.y;
        }

        const spanX = (maxX - minX) * 0.5;
        const spanY = (maxY - minY) * 0.5;
        const curCenterY = (maxY + minY) * 0.5;

        // Adjust lookCenter.y so projected vertical center matches safe area center
        const errY = curCenterY - ndcCenterY;
        lookCenter.y += errY * dist * 0.24;

        const scaleNeeded = Math.max(spanX / availHalfNdcX, spanY / availHalfNdcY);
        dist *= Math.pow(scaleNeeded, 0.85);
      }

      camera.position.copy(lookCenter).addScaledVector(baseCamDir, dist);
      controls.target.copy(lookCenter);

      // Protect the sculptural composition with restrained polar, azimuth, and zoom limits
      const basePolar = Math.acos(clamp(baseCamDir.y, -1, 1));
      const baseAzimuth = Math.atan2(baseCamDir.x, baseCamDir.z);

      controls.minPolarAngle = Math.max(0.45, basePolar - 0.22);
      controls.maxPolarAngle = Math.min(1.26, basePolar + 0.16);
      controls.minAzimuthAngle = baseAzimuth - 0.52;
      controls.maxAzimuthAngle = baseAzimuth + 0.52;
      controls.minDistance = dist * 0.90;
      controls.maxDistance = dist * 1.14;
      controls.update();
    }

    fitCameraToViewport();
    window.addEventListener('resize', fitCameraToViewport);

    // =========================================================================
    // 12. CONTINUOUS PROCEDURAL ANIMATION LOOP (ALL FROM performance.now())
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const tSec = now * 0.001;

      controls.update();

      // -----------------------------------------------------------------------
      // A. WATER SHIMMER & DYNAMIC SPLASH WAVE DEFORMATION
      // -----------------------------------------------------------------------
      for (let w = waterWaves.length - 1; w >= 0; w--) {
        if (now - waterWaves[w].startTime > waterWaves[w].duration) {
          waterWaves.splice(w, 1);
        }
      }

      for (let i = 0; i < waterPos.count; i++) {
        const bx = waterBaseXZ[i * 2];
        const bz = waterBaseXZ[i * 2 + 1];

        // Gentle idle tidal shimmer ripples
        let wy = WATER_Y
          + 0.007 * Math.sin(bx * 2.8 + bz * 2.2 + tSec * 2.3)
          + 0.005 * Math.cos(bx * 3.6 - bz * 3.1 + tSec * 1.8);

        // Add active tap splash waves
        for (let w = 0; w < waterWaves.length; w++) {
          const wave = waterWaves[w];
          const age = (now - wave.startTime) / wave.duration;
          const dist = Math.hypot(bx - wave.x, bz - wave.z);
          const waveFront = age * 2.35;
          const env = Math.exp(-Math.pow(dist - waveFront, 2) * 14.0) * (1.0 - age);
          wy += Math.sin((dist - waveFront) * 22.0) * wave.amplitude * env;
        }

        waterPos.setY(i, wy);
      }
      waterPos.needsUpdate = true;
      waterGeo.computeVertexNormals();

      // -----------------------------------------------------------------------
      // B. EXPANDING RIPPLE RINGS
      // -----------------------------------------------------------------------
      for (let i = 0; i < MAX_RIPPLES; i++) {
        const r = ripples[i];
        if (!r.active) continue;
        if (now < r.startTime) {
          r.mesh.visible = false;
          continue;
        }
        const p = (now - r.startTime) / r.duration;
        if (p >= 1.0) {
          r.active = false;
          r.mesh.visible = false;
          continue;
        }
        r.mesh.visible = true;
        const easeP = 1.0 - Math.pow(1.0 - p, 2.2);
        const rad = lerp(r.startRadius, r.maxRadius, easeP);
        r.mesh.scale.setScalar(rad);
        r.mat.opacity = r.maxOpacity * Math.sin(Math.min(1, p * 4.5) * Math.PI * 0.5) * Math.pow(1.0 - p, 1.45);
      }

      // -----------------------------------------------------------------------
      // C. DRIFTING LEAF LITTER ALONG CHANNEL & POOLS
      // -----------------------------------------------------------------------
      for (let i = 0; i < DRIFT_LEAF_COUNT; i++) {
        const dl = driftLeaves[i];
        let lx, lz;
        if (dl.inPool) {
          const pool = POOLS[dl.poolIdx];
          const ang = dl.poolAngle + tSec * 0.22 * (dl.poolIdx === 0 ? 1 : -1);
          lx = pool.x + Math.cos(ang) * pool.rx * dl.poolRad;
          lz = pool.z + Math.sin(ang) * pool.rz * dl.poolRad;
        } else {
          const curU = (dl.u + tSec * dl.speed) % 1.0;
          lz = lerp(-SLAB_RZ * 0.82, SLAB_RZ * 0.82, curU);
          const cx = getChannelCenterX(lz);
          const cw = getChannelHalfWidth(lz);
          lx = cx + dl.lateralOffset * cw * 0.72 + 0.06 * Math.sin(tSec * 1.4 + dl.phase);
        }

        const ly = WATER_Y + 0.012 + 0.006 * Math.sin(tSec * 2.5 + dl.phase);
        dummy.position.set(lx, ly, lz);
        dummy.rotation.set(
          0.08 * Math.sin(tSec * 2.1 + dl.phase),
          dl.rotY + tSec * dl.rotSpeed,
          0.08 * Math.cos(tSec * 1.9 + dl.phase)
        );
        dummy.scale.setScalar(dl.scale);
        dummy.updateMatrix();
        driftLeafInst.setMatrixAt(i, dummy.matrix);
      }
      driftLeafInst.instanceMatrix.needsUpdate = true;

      // -----------------------------------------------------------------------
      // D. RISING BUBBLE TRAILS
      // -----------------------------------------------------------------------
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const b = bubbles[i];
        const cycle = (b.yOffset + tSec * b.speed) % 1.0;
        const bedY = Math.min(WATER_Y - 0.22, getTerrainHeight(b.x, b.z));
        const by = lerp(bedY + 0.02, WATER_Y + 0.015, cycle);
        const bx = b.x + 0.025 * Math.sin(cycle * 10.0 + b.phase);
        const bz = b.z + 0.025 * Math.cos(cycle * 9.0 + b.phase);

        const popScale = cycle > 0.92 ? (1.0 - (cycle - 0.92) / 0.08) : Math.min(1.0, cycle * 4.0);
        dummy.position.set(bx, by, bz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(b.scale * popScale);
        dummy.updateMatrix();
        bubbleInst.setMatrixAt(i, dummy.matrix);
      }
      bubbleInst.instanceMatrix.needsUpdate = true;

      // -----------------------------------------------------------------------
      // E. MANGROVE CANOPY GENTLE BREEZE SWAY
      // -----------------------------------------------------------------------
      for (let t = 0; t < treeCanopyGroups.length; t++) {
        const cg = treeCanopyGroups[t];
        cg.group.rotation.z = 0.024 * Math.sin(tSec * cg.speed + cg.phase);
        cg.group.rotation.x = 0.018 * Math.cos(tSec * cg.speed * 0.85 + cg.phase);
      }

      // -----------------------------------------------------------------------
      // F. FIDDLER CRABS: IDLE WANDER + CLAW WAVING + RAPID SIDEWAYS SCUTTLE
      // -----------------------------------------------------------------------
      for (let i = 0; i < crabs.length; i++) {
        const c = crabs[i];

        if (c.state === 'scuttle') {
          const p = clamp((now - c.scuttleStartTime) / c.scuttleDuration, 0, 1);
          // Smooth yet snappy sideways dash curve
          const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

          c.x = lerp(c.startX, c.targetX, ease);
          c.z = lerp(c.startZ, c.targetZ, ease);
          const groundY = getTerrainHeight(c.x, c.z);

          // Initial startle hop + rapid scuttling bounce
          const startleHop = Math.sin(Math.min(1, p * 3.2) * Math.PI) * 0.085;
          const scurryBob = Math.abs(Math.sin(p * Math.PI * 10)) * 0.025;
          c.root.position.set(c.x, groundY + startleHop + scurryBob, c.z);
          c.root.rotation.y = c.yaw;

          // Body tilts dynamically into the sideways scuttle
          c.bodyPivot.rotation.z = -c.clawHandedness * 0.18 * Math.sin(p * Math.PI);
          c.bodyPivot.rotation.x = 0.08;

          // Major claw raised defensively while scuttling
          c.majorClawPivot.rotation.z = 0.45 + 0.22 * Math.sin(now * 0.045);
          c.majorClawPivot.rotation.y = 0.25;
          c.dactylPivot.rotation.z = 0.28 + 0.15 * Math.sin(now * 0.05);

          // High-frequency leg blurring!
          for (let l = 0; l < c.legs.length; l++) {
            const leg = c.legs[l];
            const blurWave = Math.sin(now * 0.075 + l * 1.45);
            leg.group.rotation.z = leg.side * 0.36 * blurWave;
            leg.group.rotation.x = 0.28 * Math.cos(now * 0.075 + l * 1.45);
          }

          // Emit continuous trail of tiny mud puffs while scuttling
          if (now - c.lastPuffTime > 42 && p < 0.88) {
            c.lastPuffTime = now;
            spawnParticle({
              x: c.x + randRange(-0.08, 0.08),
              y: groundY + 0.03,
              z: c.z + randRange(-0.08, 0.08),
              vx: (c.startX - c.targetX) * 0.8 + randRange(-0.4, 0.4),
              vy: randRange(0.75, 1.45),
              vz: (c.startZ - c.targetZ) * 0.8 + randRange(-0.4, 0.4),
              gravity: 9.0,
              duration: 320,
              scale: randRange(0.75, 1.25),
              isWater: false,
              color: colMudPuff
            }, now);
          }

          if (p >= 1.0) {
            c.x = c.targetX;
            c.z = c.targetZ;
            c.root.position.set(c.x, getTerrainHeight(c.x, c.z), c.z);
            c.bodyPivot.rotation.set(0, 0, 0);

            if (c.stoppedAtWater) {
              c.state = 'edgePause';
              c.edgePauseEndTime = now + 950;
              // Spawn a tiny water ripple where crab paused at the shore
              const cx = getChannelCenterX(c.z);
              const shoreX = lerp(c.x, cx, 0.25);
              spawnRippleRing(shoreX, c.z, now, 850, 0.04, 0.48, 0.55);
            } else {
              c.state = 'idle';
              c.nextWanderTime = now + randRange(1400, 3200);
            }
          }
        } else if (c.state === 'edgePause') {
          // Crab pauses at water edge, peering in and waving its claw proudly
          const wave = Math.sin(tSec * 5.2 + c.phase);
          c.bodyPivot.rotation.x = 0.12;
          c.majorClawPivot.rotation.z = 0.35 + 0.25 * wave;
          c.dactylPivot.rotation.z = 0.22 + 0.14 * Math.max(0, wave);
          if (now >= c.edgePauseEndTime) {
            c.state = 'idle';
            c.nextWanderTime = now + randRange(900, 2200);
          }
        } else {
          // IDLE: gentle autonomous wandering + signature fiddler claw waving
          if (!c.isWandering && now >= c.nextWanderTime) {
            // Pick a nearby micro-wander point on dry mud
            const ang = c.yaw + (c.clawHandedness > 0 ? Math.PI * 0.5 : -Math.PI * 0.5) + randRange(-0.8, 0.8);
            const dist = randRange(0.18, 0.42);
            const wx = c.x + Math.sin(ang) * dist;
            const wz = c.z + Math.cos(ang) * dist;
            if (isDryMudSpot(wx, wz, 0.72)) {
              c.isWandering = true;
              c.wanderStartTime = now;
              c.wanderDuration = randRange(1100, 1750);
              c.wanderStartX = c.x;
              c.wanderStartZ = c.z;
              c.wanderTargetX = wx;
              c.wanderTargetZ = wz;
            } else {
              c.nextWanderTime = now + randRange(1200, 2500);
            }
          }

          if (c.isWandering) {
            const wp = clamp((now - c.wanderStartTime) / c.wanderDuration, 0, 1);
            const wease = smoothstep(0, 1, wp);
            c.x = lerp(c.wanderStartX, c.wanderTargetX, wease);
            c.z = lerp(c.wanderStartZ, c.wanderTargetZ, wease);
            c.root.position.set(c.x, getTerrainHeight(c.x, c.z), c.z);

            for (let l = 0; l < c.legs.length; l++) {
              const leg = c.legs[l];
              leg.group.rotation.z = leg.side * 0.14 * Math.sin(tSec * 14.0 + l * 1.3 + c.phase);
            }
            if (wp >= 1.0) {
              c.isWandering = false;
              c.nextWanderTime = now + randRange(1800, 4200);
            }
          } else {
            for (let l = 0; l < c.legs.length; l++) {
              c.legs[l].group.rotation.z = 0;
              c.legs[l].group.rotation.x = 0;
            }
          }

          // Iconic fiddler crab major claw beckoning wave + minor claw mud-feeding motion
          const beckon = Math.sin(tSec * 2.6 + c.phase);
          const lift = Math.max(0, beckon);
          c.bodyPivot.position.y = 0.095 + 0.008 * lift;
          c.bodyPivot.rotation.z = -c.clawHandedness * 0.05 * lift;
          c.bodyPivot.rotation.x = 0;

          c.majorClawPivot.rotation.z = 0.12 + 0.42 * lift;
          c.majorClawPivot.rotation.y = 0.15 * Math.cos(tSec * 2.6 + c.phase);
          c.dactylPivot.rotation.z = 0.10 + 0.24 * lift;

          // Minor claw dips to mud and up to mouthparts
          c.minorClawPivot.rotation.x = 0.25 * Math.sin(tSec * 4.2 + c.phase);
        }
      }

      // -----------------------------------------------------------------------
      // G. MUDSKIPPERS: IDLE THROAT/FIN TWITCH + ENERGETIC WATER-TAP LEAP ARC
      // -----------------------------------------------------------------------
      for (let i = 0; i < mudskippers.length; i++) {
        const m = mudskippers[i];
        if (m.state === 'leap') {
          const p = clamp((now - m.leapStartTime) / m.leapDuration, 0, 1);
          m.x = lerp(m.startX, m.targetX, p);
          m.z = lerp(m.startZ, m.targetZ, p);
          const baseArcY = lerp(m.startY, m.targetY, p);
          const arcHeight = 0.62 * 4.0 * p * (1.0 - p);
          m.y = baseArcY + arcHeight;

          m.group.position.set(m.x, m.y, m.z);
          m.group.rotation.y = m.yaw;
          // Pitch nose up on ascent, down on descent
          m.animPivot.rotation.x = -(0.5 - p) * 0.95;
          m.tailPivot.rotation.y = 0.42 * Math.sin(now * 0.055);
          m.dorsalFin.scale.y = 1.45;

          if (p >= 1.0) {
            m.state = 'idle';
            m.y = m.targetY;
            m.group.position.set(m.x, m.y, m.z);
            m.animPivot.rotation.x = 0;
            m.dorsalFin.scale.y = 1.0;
            // Landing plop ripple if near water
            if (getWaterSignedMetric(m.x, m.z) < 0.25) {
              spawnRippleRing(m.x, m.z, now, 780, 0.05, 0.62, 0.65);
            }
          }
        } else {
          // Idle breathing & dorsal fin display
          const pulse = Math.sin(tSec * 3.1 + m.phase);
          m.tailPivot.rotation.y = 0.12 * Math.sin(tSec * 2.2 + m.phase);
          m.dorsalFin.scale.y = 0.85 + 0.35 * Math.max(0, pulse);
        }
      }

      // -----------------------------------------------------------------------
      // H. SUBSURFACE FLASH FISH: IDLE GLIDE + HIGH-SPEED SPLASH DART
      // -----------------------------------------------------------------------
      for (let i = 0; i < flashFishes.length; i++) {
        const f = flashFishes[i];
        const dartElapsed = now - f.dartStartTime;
        if (dartElapsed >= 0 && dartElapsed < f.dartDuration) {
          const p = dartElapsed / f.dartDuration;
          const ease = 1.0 - Math.pow(1.0 - p, 3);
          const fx = lerp(f.dartFromX, f.dartToX, ease);
          const fz = lerp(f.dartFromZ, f.dartToZ, ease);
          const fy = WATER_Y - 0.025 + 0.03 * Math.sin(p * Math.PI);
          f.group.position.set(fx, fy, fz);
          f.group.rotation.y = Math.atan2(f.dartToX - f.dartFromX, f.dartToZ - f.dartFromZ);
          f.group.rotation.z = 0.35 * Math.sin(p * Math.PI);
          f.tail.rotation.y = 0.55 * Math.sin(now * 0.07);
        } else {
          const curU = (f.u + tSec * f.speed) % 1.0;
          const pingPong = curU < 0.5 ? curU * 2.0 : (1.0 - curU) * 2.0;
          const fz = lerp(-SLAB_RZ * 0.72, SLAB_RZ * 0.72, pingPong);
          const fx = getChannelCenterX(fz) + 0.18 * Math.sin(tSec * 1.7 + f.phase);
          const prevZ = f.group.position.z;
          const prevX = f.group.position.x;
          f.group.position.set(fx, WATER_Y - 0.065, fz);
          if (Math.hypot(fx - prevX, fz - prevZ) > 0.0005) {
            f.group.rotation.y = Math.atan2(fx - prevX, fz - prevZ);
          }
          f.group.rotation.z = 0;
          f.tail.rotation.y = 0.22 * Math.sin(tSec * 9.5 + f.phase);
        }
      }

      // -----------------------------------------------------------------------
      // I. WHITE EGRETS: GRACEFUL HEAD DIPPING & FORAGING STALK
      // -----------------------------------------------------------------------
      for (let i = 0; i < egrets.length; i++) {
        const eg = egrets[i];
        const cyc = (tSec * eg.speed + eg.phase) % (Math.PI * 2);
        // Smooth periodic head-dip toward the water / foliage
        const dipWindow = smoothstep(1.2, 2.1, cyc) * (1.0 - smoothstep(2.4, 3.3, cyc));
        eg.neckPivot.rotation.x = dipWindow * (eg.isPerched ? 0.42 : 0.78) + 0.04 * Math.sin(tSec * 1.8 + eg.phase);
        eg.headPivot.rotation.x = -dipWindow * 0.32;
        eg.headPivot.rotation.y = 0.22 * Math.sin(tSec * 0.9 + eg.phase);
        eg.bodyPivot.rotation.x = dipWindow * 0.14;
      }

      // -----------------------------------------------------------------------
      // J. UPDATE BALLISTIC DROPLETS & MUD PUFF PARTICLES
      // -----------------------------------------------------------------------
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        if (!p.active) continue;
        const elapsed = now - p.startTime;
        if (elapsed >= p.duration) {
          p.active = false;
          dummy.position.set(0, -10, 0);
          dummy.scale.setScalar(0.001);
          dummy.updateMatrix();
          particleInst.setMatrixAt(i, dummy.matrix);
          continue;
        }
        const dt = elapsed * 0.001;
        const frac = elapsed / p.duration;
        const px = p.x0 + p.vx * dt;
        const py = p.y0 + p.vy * dt - 0.5 * p.gravity * dt * dt;
        const pz = p.z0 + p.vz * dt;

        const sc = p.scale * (1.0 - Math.pow(frac, 1.8));
        dummy.position.set(px, py, pz);
        dummy.rotation.set(dt * 4, dt * 5, 0);
        dummy.scale.setScalar(Math.max(0.001, sc));
        dummy.updateMatrix();
        particleInst.setMatrixAt(i, dummy.matrix);
      }
      particleInst.instanceMatrix.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
