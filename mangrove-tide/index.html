<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mangrove Tide - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#bfe0dd; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 18px; z-index:5;
    background: linear-gradient(rgba(10,40,44,.62), rgba(10,40,44,.30) 55%, rgba(10,40,44,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#f2fafa; text-transform:uppercase; text-shadow:0 1px 8px rgba(6,28,32,.75); }
  header .rule { width:44px; height:1px; background:rgba(242,250,250,.55); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#f6fcfc; transition:opacity 1.2s ease; padding:5px 12px; border-radius:3px;
    background:rgba(8,34,38,.45);
    text-shadow:0 1px 3px rgba(4,22,26,.98), 0 0 8px rgba(4,22,26,.95), 0 0 18px rgba(4,22,26,.85); }
  #hint.faded { opacity:.45; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(242,250,250,.6); }
  canvas { display:block; touch-action:none; }
  @media (max-width: 380px) {
    header h1 { font-size:12px; letter-spacing:.3em; }
    #hint { font-size:10px; letter-spacing:.2em; }
  }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Mangrove Tide</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// pass 1
const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0dd);
scene.fog = new THREE.Fog(0xbfe0dd, 26, 80);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);
  camera.updateProjectionMatrix();
}
pickFov();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.maxPolarAngle = Math.PI * 0.52;

const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.set(7, 10, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
sun.shadow.camera.far = 60; sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xd8f0ec, 0x4a4436, 1.5));

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
function rand(a, b) { return a + rng() * (b - a); }

function makeSoftTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// ---------- slab + mud ----------
const SLAB_H = 1.4;
const slabGroup = new THREE.Group(); scene.add(slabGroup);
{
  const top = new THREE.Mesh(new THREE.BoxGeometry(7.5, 0.22, 7.5), new THREE.MeshStandardMaterial({ color: 0x8a7a5e, roughness: 0.95 }));
  top.position.y = -0.11; top.receiveShadow = true; slabGroup.add(top);
  const mid = new THREE.Mesh(new THREE.BoxGeometry(7.5, SLAB_H, 7.5),
    new THREE.MeshStandardMaterial({ color: 0x5e5240, roughness: 1 }));
  mid.position.y = -SLAB_H/2 - 0.2; slabGroup.add(mid);
  const base = new THREE.Mesh(new THREE.BoxGeometry(7.9, 0.5, 7.9),
    new THREE.MeshStandardMaterial({ color: 0x40382c, roughness: 1 }));
  base.position.y = -SLAB_H - 0.45; slabGroup.add(base);
}

// ---------- winding water channel ----------
const waterMat = new THREE.MeshStandardMaterial({ color: 0x2e7a72, roughness: 0.15, metalness: 0.4 });
{
  // channel as a series of overlapping circles along an S curve
  const pts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    pts.push(new THREE.Vector3(-3.2 + t * 6.4, 0, Math.sin(t * Math.PI * 1.6) * 1.6 - 0.4));
  }
  for (const p of pts) {
    const w = new THREE.Mesh(new THREE.CircleGeometry(1.05, 20), waterMat);
    w.rotation.x = -Math.PI/2; w.position.set(p.x, 0.03, p.z); w.receiveShadow = true;
    slabGroup.add(w);
  }
}
// shallow pools
for (const [px, pz, pr] of [[-2.4, 2.2, 0.8], [2.5, 2.0, 0.65], [0.6, -2.6, 0.7]]) {
  const w = new THREE.Mesh(new THREE.CircleGeometry(pr, 18), waterMat);
  w.rotation.x = -Math.PI/2; w.position.set(px, 0.03, pz); w.receiveShadow = true;
  slabGroup.add(w);
}

// ---------- mangrove trees with stilt roots ----------
const canopyMat = new THREE.MeshStandardMaterial({ color: 0x3e6b34, roughness: 0.9 });
const canopyMat2 = new THREE.MeshStandardMaterial({ color: 0x4d7d3c, roughness: 0.9 });
const rootMat = new THREE.MeshStandardMaterial({ color: 0x5c4630, roughness: 0.95 });
function makeMangrove(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = rand(0, 6.3);
  const nR = 9;
  for (let i = 0; i < nR; i++) {
    const a = (i / nR) * Math.PI * 2 + rand(-0.15, 0.15);
    const len = rand(0.9, 1.3);
    const root = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, len, 5), rootMat);
    root.position.set(Math.cos(a) * 0.42, 0.42, Math.sin(a) * 0.42);
    root.rotation.z = Math.cos(a) * 0.75; root.rotation.x = -Math.sin(a) * 0.75;
    root.castShadow = true; g.add(root);
  }
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 1.2, 7), rootMat);
  trunk.position.y = 1.35; trunk.castShadow = true; g.add(trunk);
  const blobs = 5;
  for (let i = 0; i < blobs; i++) {
    const r = rand(0.5, 0.75);
    const c = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), i % 2 ? canopyMat : canopyMat2);
    const a = (i / blobs) * Math.PI * 2;
    c.position.set(Math.cos(a) * rand(0.3, 0.6), rand(2.0, 2.6), Math.sin(a) * rand(0.3, 0.6));
    c.scale.y = 0.75; c.castShadow = true; g.add(c);
  }
  slabGroup.add(g);
}
makeMangrove(-2.2, -1.9, 1.0);
makeMangrove(2.3, -1.8, 0.85);
makeMangrove(-0.4, 1.6, 0.9);
makeMangrove(2.6, 1.5, 0.7);

// ---------- pneumatophore spikes (root snorkels) ----------
{
  const spikeMat = new THREE.MeshStandardMaterial({ color: 0x6b5844, roughness: 1 });
  for (let i = 0; i < 40; i++) {
    const x = rand(-3.2, 3.2), z = rand(-3.2, 3.2);
    const h = rand(0.12, 0.35);
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.025, h, 5), spikeMat);
    sp.position.set(x, h / 2, z); slabGroup.add(sp);
  }
}

// ---------- crabs ----------
const crabs = [];
const crabProxies = [];
function makeCrab(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0.06, z); g.rotation.y = rand(0, 6.3);
  const shellMat = new THREE.MeshStandardMaterial({ color: 0xc4502e, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), shellMat);
  body.scale.set(1.3, 0.6, 1); body.castShadow = true; g.add(body);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x9c3c22, roughness: 0.7 });
  for (const side of [1, -1]) {
    for (let i = 0; i < 3; i++) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.16, 4), legMat);
      leg.position.set(-0.05 + i * 0.06, -0.02, side * 0.14);
      leg.rotation.x = side * 1.1; g.add(leg);
    }
    const claw = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), shellMat);
    claw.position.set(0.16, 0, side * 0.1); claw.scale.set(1.2, 0.8, 1); g.add(claw);
  }
  // eye stalks
  for (const side of [1, -1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 5, 4),
      new THREE.MeshStandardMaterial({ color: 0x1c1008 }));
    eye.position.set(0.12, 0.08, side * 0.045); g.add(eye);
  }
  const proxy = new THREE.Mesh(new THREE.SphereGeometry(0.55, 6, 5),
    new THREE.MeshBasicMaterial({ visible: false }));
  g.add(proxy); crabProxies.push(proxy);
  const crab = { g, proxy, state: 'idle', t0: 0, from: new THREE.Vector3(), to: new THREE.Vector3(), dur: 0.9 };
  proxy.userData.crab = crab;
  crabs.push(crab);
  slabGroup.add(g);
  return crab;
}
makeCrab(-1.2, 0.4); makeCrab(1.4, 0.9); makeCrab(0.2, -1.3); makeCrab(-2.8, 1.2); makeCrab(1.9, -2.4);

// ---------- egrets ----------
function makeEgret(x, z, yaw) {
  const g = new THREE.Group(); g.position.set(x, 0.03, z); g.rotation.y = yaw;
  const white = new THREE.MeshStandardMaterial({ color: 0xf4f6f2, roughness: 0.7 });
  for (const side of [1, -1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 4),
      new THREE.MeshStandardMaterial({ color: 0x2c2c24 }));
    leg.position.set(0, 0.25, side * 0.05); g.add(leg);
  }
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), white);
  body.position.y = 0.58; body.scale.set(1.4, 0.9, 0.9); body.castShadow = true; g.add(body);
  const neckCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(0.18, 0.62, 0), new THREE.Vector3(0.34, 0.9, 0), new THREE.Vector3(0.28, 1.1, 0));
  const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 8, 0.035, 6), white);
  neck.castShadow = true; g.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), white);
  head.position.set(0.28, 1.12, 0); g.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.18, 5),
    new THREE.MeshStandardMaterial({ color: 0xd8a83c }));
  beak.position.set(0.38, 1.12, 0); beak.rotation.z = -Math.PI / 2; g.add(beak);
  slabGroup.add(g);
}
makeEgret(-1.7, -0.7, 0.4);
makeEgret(2.0, 0.2, -2.2);

// ---------- gull sprites + shimmer ----------
const gulls = [];
{
  const tex = makeSoftTexture('rgba(70,90,92,0.95)', 'rgba(70,90,92,0)');
  for (let i = 0; i < 5; i++) {
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.75, depthWrite: false });
    const s = new THREE.Sprite(mat);
    const sc = rand(0.12, 0.2); s.scale.set(sc * 2.2, sc, 1);
    scene.add(s);
    gulls.push({ s, ax: rand(-2, 2), ay: rand(3.4, 4.6), az: rand(-2, 1), r: rand(1.5, 3), spd: rand(0.15, 0.35), ph: rand(0, 6.3) });
  }
}

// ---------- hint ----------
const hintIdle = 'Tap a crab';
const hintScuttle = 'Scuttle!';
let hintOwner = 'idle';
function setHint(text, owner) { hintEl.textContent = text; hintEl.classList.remove('faded'); hintOwner = owner; }
function resetHintIf(owner) { if (hintOwner === owner) setHint(hintIdle, 'idle'); }
setHint(hintIdle, 'idle');

// ---------- crab scuttle ----------
let lastTap = 0;
function scuttle(crab, now) {
  if (crab.state !== 'idle') return;
  lastTap = now;
  crab.state = 'scuttle'; crab.t0 = now;
  crab.from.copy(crab.g.position);
  // dash sideways (crabs run sideways), away from slab center, clamped
  const dirA = crab.g.rotation.y + Math.PI / 2 * (rng() > 0.5 ? 1 : -1);
  let nx = crab.g.position.x + Math.cos(dirA) * rand(0.9, 1.5);
  let nz = crab.g.position.z + Math.sin(dirA) * rand(0.9, 1.5);
  nx = Math.max(-3.2, Math.min(3.2, nx)); nz = Math.max(-3.2, Math.min(3.2, nz));
  crab.to.set(nx, 0.06, nz);
  crab.g.rotation.y = -Math.atan2(nz - crab.g.position.z, nx - crab.g.position.x) + Math.PI / 2;
  setHint(hintScuttle, 'user');
}

// ---------- interaction ----------
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) return;
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(crabProxies, false);
  if (hits.length) {
    const now = performance.now() / 1000;
    if (now - lastTap > 0.5) scuttle(hits[0].object.userData.crab, now);
  }
});

// ---------- camera containment ----------
const fitBox = new THREE.Box3(
  new THREE.Vector3(-3.6, -1.6, -3.6),
  new THREE.Vector3(3.6, 4.0, 3.6));
function fitCamera() {
  const center = fitBox.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  const dir = new THREE.Vector3(0.14, 0.6, 1).normalize();
  const corners = [];
  for (const x of [fitBox.min.x, fitBox.max.x])
    for (const y of [fitBox.min.y, fitBox.max.y])
      for (const z of [fitBox.min.z, fitBox.max.z])
        corners.push(new THREE.Vector3(x, y, z));
  const probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 240);
  probe.position.copy(center).addScaledVector(dir, 0.001); probe.lookAt(center); probe.updateMatrixWorld();
  const inv = probe.matrixWorldInverse;
  let need = 0;
  const vFov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const hFov = Math.atan(Math.tan(vFov) * camera.aspect);
  for (const c of corners) {
    const p = c.clone().applyMatrix4(inv);
    const d = -p.z;
    need = Math.max(need, d + Math.abs(p.y) / Math.tan(vFov), d + Math.abs(p.x) / Math.tan(hFov));
  }
  const dist = need * 1.06 + 0.2;
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.lookAt(center); controls.update();
}
fitCamera();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; pickFov();
  renderer.setSize(innerWidth, innerHeight); fitCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
const ndcV = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.3);
  const now = performance.now() / 1000;
  // crabs (wall clock)
  for (const c of crabs) {
    if (c.state === 'scuttle') {
      const k = Math.min(1, (now - c.t0) / c.dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      c.g.position.lerpVectors(c.from, c.to, e);
      c.g.position.y = 0.06 + Math.abs(Math.sin(k * 14)) * 0.05;
      if (k >= 1) { c.state = 'idle'; c.g.position.y = 0.06; resetHintIf('user'); }
    }
  }
  // gulls circle, faded in title band
  for (const gu of gulls) {
    const a = now * gu.spd + gu.ph;
    gu.s.position.set(gu.ax + Math.cos(a) * gu.r, gu.ay + Math.sin(now * 0.9 + gu.ph) * 0.15, gu.az + Math.sin(a) * gu.r);
    ndcV.copy(gu.s.position).project(camera);
    gu.s.material.opacity = (ndcV.y > 0.45 && Math.abs(ndcV.x) < 0.62) ? 0.12 : 0.75;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
