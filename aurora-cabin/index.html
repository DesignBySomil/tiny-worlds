<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Cabin - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d1338; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 18px; z-index:5;
    background: linear-gradient(rgba(6,9,26,.62), rgba(6,9,26,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#e8ecff; text-transform:uppercase; text-shadow:0 1px 8px rgba(4,8,24,.85); }
  header .rule { width:44px; height:1px; background:rgba(232,236,255,.5); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#f2f4ff; transition:opacity 1.2s ease; text-shadow:0 1px 2px rgba(4,8,24,.95), 0 0 12px rgba(4,8,24,.8); }
  #hint.faded { opacity:.45; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(232,236,255,.5); }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Aurora Cabin</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101938);
scene.fog = new THREE.Fog(0x101938, 60, 150);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 260);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);
  camera.updateProjectionMatrix();
}
pickFov();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * 0.52; controls.enablePan = false;

// ---------- lights (moonlit night, warm cabin spill) ----------
const moonLight = new THREE.DirectionalLight(0x8fa8d8, 1.45);
moonLight.position.set(-18, 24, -10); moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -13; moonLight.shadow.camera.right = 13;
moonLight.shadow.camera.top = 13; moonLight.shadow.camera.bottom = -13;
moonLight.shadow.camera.near = 4; moonLight.shadow.camera.far = 70;
moonLight.shadow.bias = -0.0012;
scene.add(moonLight);
const hemi = new THREE.HemisphereLight(0x2a3a6a, 0x1a1626, 1.25);
scene.add(hemi);
const HEMI_SKY_BASE = new THREE.Color(0x2a3a6a);
const HEMI_SKY_GREEN = new THREE.Color(0x2f6a58);
const fireLight = new THREE.PointLight(0xffa54f, 2.0, 10, 2);
fireLight.position.set(-2.2, 1.3, -0.6); scene.add(fireLight);

// ---------- seeded rng + noise ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
const rand = (a, b) => a + rng() * (b - a);
function n2(x, z, s) {
  return Math.sin(x * 1.9 + s) * Math.sin(z * 2.2 + s * 0.4)
       + 0.5 * Math.sin(x * 4.3 + z * 2.8 + s + 2.2)
       + 0.25 * Math.sin(x * 7.1 - z * 5.9 + s + 4.1);
}

// ---------- palette ----------
const PAL = {
  snow: 0xdfe8f7, strata1: 0x3a3550, strata2: 0x2a2540, strata3: 0x1c1830,
  wood: 0x4a3226, woodDark: 0x38251c, roof: 0x2e2233, roofSnow: 0xe8eefb,
  window: 0xffb65c, door: 0x2a1b12, pine: 0x16301f, pineDark: 0x102417,
  pineSnow: 0xe8eefb, pond: 0x9fd4e8, stone: 0x4c4662, trunk: 0x2c1e14
};

const SLAB_HALF = 7.5, SLAB_H = 1.5;
const slabGroup = new THREE.Group(); scene.add(slabGroup);

// ---------- slab strata ----------
{
  const layers = [
    [PAL.strata1, 0.42, -0.21],
    [PAL.strata2, 0.52, -0.68],
    [PAL.strata3, 0.56, -1.22]
  ];
  for (const [color, h, cy] of layers) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(SLAB_HALF*2, h, SLAB_HALF*2),
      new THREE.MeshStandardMaterial({ color, roughness: 0.95, flatShading: true }));
    m.position.y = cy; m.receiveShadow = true; slabGroup.add(m);
  }
}

// ---------- snow field (low-freq grain, lifted above strata top) ----------
{
  const g = new THREE.PlaneGeometry(SLAB_HALF*2 - 0.24, SLAB_HALF*2 - 0.24, 56, 56);
  g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const edge = Math.max(Math.abs(x), Math.abs(z)) / (SLAB_HALF - 0.12);
    let y = 0.10 + 0.05 * n2(x * 0.45, z * 0.45, 3.3);
    y -= Math.max(0, edge - 0.86) * 1.4;               // round the slab lip
    p.setY(i, y);
  }
  g.computeVertexNormals();
  const snow = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: PAL.snow, roughness: 0.92, flatShading: true }));
  snow.receiveShadow = true; slabGroup.add(snow);
}

// ---------- cabin ----------
const cabin = new THREE.Group(); cabin.position.set(-2.2, 0, -2.3); slabGroup.add(cabin);
const tapTargets = [];
{
  const woodMat = new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.9, flatShading: true });
  const darkMat = new THREE.MeshStandardMaterial({ color: PAL.woodDark, roughness: 0.92, flatShading: true });
  // log walls: stacked horizontal logs with slight offsets
  for (let i = 0; i < 7; i++) {
    const y = 0.24 + i * 0.26;
    const mat = i % 2 ? darkMat : woodMat;
    const front = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 3.2, 7), mat);
    front.rotation.z = Math.PI/2; front.position.set(0, y, 1.2);
    front.castShadow = front.receiveShadow = true; cabin.add(front);
    const back = front.clone(); back.position.z = -1.2; cabin.add(back);
    const left = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 2.4, 7), mat);
    left.rotation.x = Math.PI/2; left.position.set(-1.6, y, 0);
    left.castShadow = left.receiveShadow = true; cabin.add(left);
    const right = left.clone(); right.position.x = 1.6; cabin.add(right);
  }
  // core body (blocks window light leaks, tap surface)
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.1, 1.95, 2.3),
    new THREE.MeshStandardMaterial({ color: PAL.woodDark, roughness: 0.95, flatShading: true }));
  body.position.y = 1.0; body.castShadow = body.receiveShadow = true; cabin.add(body);
  // gabled roof: triangle prism, ridge along z
  const tri = new THREE.Shape();
  tri.moveTo(-1.95, 0); tri.lineTo(1.95, 0); tri.lineTo(0, 1.35); tri.closePath();
  const roofG = new THREE.ExtrudeGeometry(tri, { depth: 3.0, bevelEnabled: false });
  roofG.translate(0, 0, -1.5);
  const roof = new THREE.Mesh(roofG, new THREE.MeshStandardMaterial({
    color: PAL.roof, roughness: 0.92, flatShading: true }));
  roof.position.y = 1.98; roof.castShadow = roof.receiveShadow = true; cabin.add(roof);
  // snow on roof slopes
  for (const s of [-1, 1]) {
    const sn = new THREE.Mesh(new THREE.BoxGeometry(2.16, 0.12, 3.25),
      new THREE.MeshStandardMaterial({ color: PAL.roofSnow, roughness: 0.9, flatShading: true }));
    const ang = Math.atan2(1.35, 1.95);
    sn.rotation.z = -s * ang;
    sn.position.set(s * 0.95, 1.98 + 0.72, 0);
    sn.castShadow = sn.receiveShadow = true; cabin.add(sn);
  }
  // chimney + cap
  const chim = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.5, 0.42),
    new THREE.MeshStandardMaterial({ color: PAL.stone, roughness: 0.95, flatShading: true }));
  chim.position.set(0.95, 3.1, -0.75); chim.castShadow = true; cabin.add(chim);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.14, 0.56),
    new THREE.MeshStandardMaterial({ color: PAL.roofSnow, roughness: 0.9, flatShading: true }));
  cap.position.set(0.95, 3.9, -0.75); cabin.add(cap);
  // door
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.25, 0.1), darkMat);
  door.position.set(-0.7, 0.72, 1.36); cabin.add(door);
  // windows (emissive, pane crossbars)
  const winMat = new THREE.MeshStandardMaterial({ color: 0x513009,
    emissive: PAL.window, emissiveIntensity: 1.55, roughness: 0.6 });
  cabin.userData.winMat = winMat;
  const barMat = new THREE.MeshStandardMaterial({ color: PAL.woodDark, roughness: 0.9 });
  function window(x, y, z, ry) {
    const grp = new THREE.Group(); grp.position.set(x, y, z); grp.rotation.y = ry;
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.55), winMat);
    grp.add(pane);
    const bh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.055, 0.02), barMat); bh.position.z = 0.012; grp.add(bh);
    const bv = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.55, 0.02), barMat); bv.position.z = 0.012; grp.add(bv);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.66, 0.05), barMat);
    frame.position.z = -0.015; grp.add(frame);
    cabin.add(grp);
  }
  window(0.45, 1.25, 1.42, 0);
  window(-1.15, 1.25, 1.42, 0);
  window(1.61, 1.25, 0.2, Math.PI/2);
  // tap surface: invisible box over whole cabin
  const tapBox = new THREE.Mesh(new THREE.BoxGeometry(4.2, 4.4, 3.4),
    new THREE.MeshBasicMaterial({ visible: false }));
  tapBox.position.y = 2.0; tapBox.userData.cabin = true; cabin.add(tapBox);
  tapTargets.push(tapBox);
}

// ---------- chimney smoke ----------
const SMOKE_N = 22; const smoke = [];
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const cx = cv.getContext('2d');
  const grad = cx.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(226,232,246,0.85)'); grad.addColorStop(1, 'rgba(226,232,246,0)');
  cx.fillStyle = grad; cx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  for (let i = 0; i < SMOKE_N; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, transparent: true, opacity: 0, depthWrite: false }));
    sp.userData = { t: rand(0, 5.5), life: rand(4.2, 5.8), seed: rng() * 10 };
    scene.add(sp); smoke.push(sp);
  }
}
function smokeStep(dt) {
  for (const sp of smoke) {
    const u = sp.userData; u.t += dt;
    if (u.t > u.life) { u.t = 0; u.life = rand(4.2, 5.8); }
    const k = u.t / u.life;
    sp.position.set(
      -2.2 + 0.95 + Math.sin(u.seed + u.t * 0.9) * 0.35 * k + k * 0.9,
      3.95 + u.t * 0.62,
      -2.3 - 0.75 + Math.sin(u.seed * 2.1 + u.t * 0.6) * 0.22 * k);
    const s = 0.45 + k * 1.35; sp.scale.set(s, s, 1);
    sp.material.opacity = 0.42 * (k < 0.12 ? k / 0.12 : 1 - (k - 0.12) / 0.88);
  }
}

// ---------- pines (snow-capped tiers) ----------
const pines = [];
{
  const trunkMat = new THREE.MeshStandardMaterial({ color: PAL.trunk, roughness: 0.95, flatShading: true });
  function pine(x, z, s) {
    const g = new THREE.Group(); g.position.set(x, 0.08, z); g.scale.setScalar(s);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.5, 6), trunkMat);
    trunk.position.y = 0.25; trunk.castShadow = true; g.add(trunk);
    const green = new THREE.MeshStandardMaterial({
      color: rng() < 0.5 ? PAL.pine : PAL.pineDark, roughness: 0.92, flatShading: true });
    const snowMat = new THREE.MeshStandardMaterial({ color: PAL.pineSnow, roughness: 0.9, flatShading: true });
    for (let i = 0; i < 3; i++) {
      const r = 0.78 - i * 0.22, h = 0.85 - i * 0.1, y = 0.55 + i * 0.62;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), green);
      cone.position.y = y; cone.castShadow = cone.receiveShadow = true; g.add(cone);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.62, h * 0.52, 7), snowMat);
      cap.position.y = y + h * 0.28; cap.castShadow = true; g.add(cap);
    }
    slabGroup.add(g); pines.push({ x, z, top: 2.6 * s, s });
    return g;
  }
  const spots = [
    [3.1, -4.6, 1.25], [4.6, -2.2, 1.0], [5.6, 0.8, 1.35], [4.9, 3.4, 0.9],
    [2.4, 5.2, 1.15], [-0.6, 5.8, 0.95], [-3.6, 5.0, 1.3], [-5.4, 2.8, 1.0],
    [-5.9, 0.2, 1.4], [-5.2, -4.4, 1.1], [-4.4, -5.6, 0.85], [0.8, -5.9, 1.2],
    [3.4, -5.8, 0.8], [-0.9, -0.4, 0.62]
  ];
  for (const [x, z, s] of spots) pine(x + rand(-0.25, 0.25), z + rand(-0.25, 0.25), s * rand(0.92, 1.1));
}

// ---------- frozen pond + stones + fence + woodpile + lantern ----------
{
  const pond = new THREE.Mesh(new THREE.CircleGeometry(1.7, 22),
    new THREE.MeshStandardMaterial({ color: 0xcfe8f4, roughness: 0.12, metalness: 0.35, flatShading: true }));
  pond.rotation.x = -Math.PI/2; pond.position.set(3.2, 0.16, 2.6);
  pond.receiveShadow = true; slabGroup.add(pond);
  const rim = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.95, 22),
    new THREE.MeshStandardMaterial({ color: PAL.roofSnow, roughness: 0.9, flatShading: true }));
  rim.rotation.x = -Math.PI/2; rim.position.set(3.2, 0.15, 2.6); rim.receiveShadow = true; slabGroup.add(rim);
  // path stones to the door
  for (let i = 0; i < 5; i++) {
    const st = new THREE.Mesh(new THREE.CylinderGeometry(rand(0.2, 0.3), rand(0.24, 0.34), 0.07, 6),
      new THREE.MeshStandardMaterial({ color: PAL.stone, roughness: 0.95, flatShading: true }));
    st.position.set(-2.9 + rand(-0.3, 0.3) + i * 0.28, 0.15, 0.4 + i * 0.62);
    st.castShadow = st.receiveShadow = true; slabGroup.add(st);
  }
  // fence along front-left
  const fenceMat = new THREE.MeshStandardMaterial({ color: PAL.woodDark, roughness: 0.95, flatShading: true });
  for (let i = 0; i < 6; i++) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.75, 5), fenceMat);
    post.position.set(-6.4 + i * 0.95, 0.45, 4.6 + Math.sin(i * 0.9) * 0.35);
    post.castShadow = true; slabGroup.add(post);
  }
  for (const ry of [0.32, 0.62]) {
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 5.4, 5), fenceMat);
    rail.rotation.z = Math.PI/2; rail.rotation.y = 0.06;
    rail.position.set(-4.05, ry + 0.12, 4.62); rail.castShadow = true; slabGroup.add(rail);
  }
  // woodpile
  for (let i = 0; i < 6; i++) {
    const row = i < 3 ? 0 : 1, k = i % 3;
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 6),
      new THREE.MeshStandardMaterial({ color: i % 2 ? PAL.wood : PAL.trunk, roughness: 0.95, flatShading: true }));
    log.rotation.x = Math.PI/2;
    log.position.set(0.1 + (k - 1) * 0.24 + row * 0.12, 0.2 + row * 0.2, -1.2);
    log.castShadow = log.receiveShadow = true; slabGroup.add(log);
  }
  // lantern post by the path
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.1, 5), fenceMat);
  post.position.set(-1.2, 0.65, 1.9); post.castShadow = true; slabGroup.add(post);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x513009, emissive: 0xffc878, emissiveIntensity: 2.0 }));
  lamp.position.set(-1.2, 1.28, 1.9); slabGroup.add(lamp);
  const lampLight = new THREE.PointLight(0xffc878, 1.4, 4.5, 2);
  lampLight.position.set(-1.2, 1.35, 1.9); slabGroup.add(lampLight);
  // scattered rocks + snow lumps
  for (let i = 0; i < 26; i++) {
    const r = rand(0.08, 0.3);
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0),
      new THREE.MeshStandardMaterial({ color: rng() < 0.55 ? PAL.stone : PAL.roofSnow, roughness: 0.95, flatShading: true }));
    const a = rng() * Math.PI * 2, d = rand(2.2, 6.9);
    rock.position.set(Math.cos(a) * d, 0.12 + r * 0.4, Math.sin(a) * d);
    rock.rotation.set(rng() * 3, rng() * 3, rng() * 3);
    rock.castShadow = rock.receiveShadow = true; slabGroup.add(rock);
  }
}

// ---------- distant night plain + far pines (fills below-horizon void) ----------
{
  const plainG = new THREE.PlaneGeometry(440, 440, 44, 44);
  plainG.rotateX(-Math.PI/2);
  const pp = plainG.attributes.position;
  for (let i = 0; i < pp.count; i++) {
    const x = pp.getX(i), z = pp.getZ(i);
    pp.setY(i, 0.9 * n2(x * 0.045, z * 0.045, 8.8));
  }
  plainG.computeVertexNormals();
  const plain = new THREE.Mesh(plainG,
    new THREE.MeshStandardMaterial({ color: 0x51679c, roughness: 1, flatShading: true }));
  plain.position.y = -1.62; scene.add(plain);
  const farMat = new THREE.MeshStandardMaterial({ color: 0x1b2b4a, roughness: 1, flatShading: true });
  for (let i = 0; i < 30; i++) {
    const a = rng() * Math.PI * 2, d = rand(48, 115);
    const h = rand(2.2, 4.2) + d * 0.035;
    const t = new THREE.Mesh(new THREE.ConeGeometry(h * 0.34, h, 6), farMat);
    t.position.set(Math.cos(a) * d, -1.42 + h / 2, Math.sin(a) * d);
    scene.add(t);
  }
}

// ---------- night sky: stars, moon, shooting stars ----------
{
  const N = 2200; const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = rng() * Math.PI * 2, e = Math.asin(rand(0.10, 0.64));
    const r = rand(92, 130);
    pos[i*3] = Math.cos(a) * Math.cos(e) * r;
    pos[i*3+1] = Math.sin(e) * r;
    pos[i*3+2] = Math.sin(a) * Math.cos(e) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const scv = document.createElement('canvas'); scv.width = scv.height = 32;
  const scx = scv.getContext('2d');
  const sgrad = scx.createRadialGradient(16, 16, 1, 16, 16, 15);
  sgrad.addColorStop(0, 'rgba(255,255,255,1)'); sgrad.addColorStop(0.4, 'rgba(230,238,255,0.8)');
  sgrad.addColorStop(1, 'rgba(230,238,255,0)');
  scx.fillStyle = sgrad; scx.fillRect(0, 0, 32, 32);
  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xdde6ff, size: 1.6, sizeAttenuation: true, transparent: true,
    map: new THREE.CanvasTexture(scv), alphaTest: 0.02,
    opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  scene.add(stars);
}
const shooters = [];
for (let i = 0; i < 2; i++) {
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  scene.add(head);
  shooters.push({ head, t: -1, dur: 0.9, from: new THREE.Vector3(), to: new THREE.Vector3(), next: rand(6, 14) + i * 7 });
}
function shootStep(dt) {
  for (const s of shooters) {
    if (s.t < 0) {
      s.next -= dt;
      if (s.next <= 0) {
        s.t = 0;
        const a = rand(-1.2, 1.2);
        s.from.set(Math.cos(a) * 34, rand(24, 34), Math.sin(a) * 34 - 12);
        s.to.copy(s.from).add(new THREE.Vector3(rand(-14, -8), rand(-7, -4), rand(-4, 4)));
      }
    } else {
      s.t += dt;
      const k = s.t / s.dur;
      if (k >= 1) { s.t = -1; s.next = rand(9, 18); s.head.material.opacity = 0; }
      else {
        s.head.position.lerpVectors(s.from, s.to, k);
        s.head.material.opacity = 0.85 * Math.sin(Math.PI * k);
      }
    }
  }
}

// ---------- aurora ribbons (vertex-animated, additive, boosted by taps) ----------
const ribbons = [];
let auroraBoost = 1, boostTarget = 1, boostHold = 0;
{
  const RIBS = [
    { y: 13.5, z: -36, op: 0.68, spd: 0.55, ph: 0.0, hue: [0.30, 0.85] },  // green -> violet
    { y: 15.5, z: -44, op: 0.55, spd: 0.38, ph: 2.1, hue: [0.45, 0.72] },  // teal -> violet
    { y: 18, z: -53, op: 0.46, spd: 0.27, ph: 4.4, hue: [0.28, 0.55] }   // green -> teal
  ];
  const W = 160, H = 17, SX = 130, SY = 12;
  for (const R of RIBS) {
    const g = new THREE.PlaneGeometry(W, H, SX, SY);
    const p = g.attributes.position;
    const base = new Float32Array(p.count * 3);
    const colors = new Float32Array(p.count * 3);
    const cA = new THREE.Color().setHSL(R.hue[0], 0.9, 0.55);
    const cB = new THREE.Color().setHSL(R.hue[1], 0.85, 0.6);
    const tmp = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      base[i*3] = x; base[i*3+1] = y;
      base[i*3+2] = -6 * Math.cos((x / (W/2)) * Math.PI * 0.5);  // arc away at the ends
      const gpos = (y + H/2) / H;
      tmp.copy(cA).lerp(cB, gpos);
      let fall = Math.pow(Math.sin(Math.PI * gpos), 0.75);      // soft edges for additive
      const rayk = 0.55 + 0.45 * Math.sin(x * 0.55 + R.ph * 3) + 0.25 * Math.sin(x * 1.7 + R.ph);  // vertical rays
      fall *= Math.max(0.15, rayk);
      colors[i*3] = tmp.r * fall; colors[i*3+1] = tmp.g * fall; colors[i*3+2] = tmp.b * fall;
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    p.setUsage(THREE.DynamicDrawUsage);
    const mat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true,
      opacity: R.op, blending: THREE.AdditiveBlending, depthWrite: false,
      side: THREE.DoubleSide, fog: false });
    const mesh = new THREE.Mesh(g, mat);
    mesh.position.set(0, R.y, R.z);
    mesh.rotation.x = -0.3;
    scene.add(mesh);
    ribbons.push({ mesh, base, R });
  }
}
function auroraStep(t) {
  const amp = 1 + (auroraBoost - 1) * 0.8;
  const aspK = camera.aspect < 0.62 ? 0.6 : (camera.aspect < 0.9 ? 0.85 : 1);
  for (const rb of ribbons) {
    const p = rb.mesh.geometry.attributes.position;
    const { base, R } = rb;
    for (let i = 0; i < p.count; i++) {
      const x = base[i*3], yl = base[i*3+1];
      const taper = 1 - Math.pow(Math.abs(yl) / 6.5, 2) * 0.35;
      const wave = (Math.sin(x * 0.07 + t * R.spd + R.ph) * 1.7
                  + Math.sin(x * 0.023 - t * R.spd * 0.45 + R.ph * 2) * 4.0) * taper * amp;
      p.setY(i, yl * 0.9 + wave);
      p.setZ(i, base[i*3+2] + Math.sin(x * 0.05 + t * 0.33 + R.ph) * 2.1 * taper);
    }
    p.needsUpdate = true;
    rb.mesh.material.opacity = Math.min(0.8, R.op * (0.72 + 0.28 * Math.sin(t * 0.4 + R.ph)) * auroraBoost * aspK);
  }
}

// ---------- hints ----------
const HINTS = {
  idle: 'Tap the cabin to wake the lights',
  flare: 'The fire roars - the lights answer',
  auto: 'The lights dance on their own'
};
function setHint(s) {
  hintEl.textContent = HINTS[s]; hintEl.classList.remove('faded');
  clearTimeout(setHint._t);
  setHint._t = setTimeout(() => hintEl.classList.add('faded'), 6000);
}
setHint('idle');

// ---------- camera framing (point-set fit, portrait-aware) ----------
const FIT_CENTER = new THREE.Vector3(0, 2.3, 0);
const FIT_PTS = [];
for (const x of [-7.5, 7.5]) for (const y of [-SLAB_H, 0.6]) for (const z of [-7.5, 7.5])
  FIT_PTS.push(new THREE.Vector3(x, y, z));
FIT_PTS.push(new THREE.Vector3(-2.2, 4.4, -2.3));            // chimney cap
FIT_PTS.push(new THREE.Vector3(-1.2, 6.9, -3.0));            // smoke apex
for (const p of pines) FIT_PTS.push(new THREE.Vector3(p.x, p.top + 0.6, p.z));
function fitDir() {
  const a = innerWidth / innerHeight;
  if (a < 0.62) return new THREE.Vector3(0.1, 0.42, 1).normalize();
  if (a < 0.9) return new THREE.Vector3(0.42, 0.4, 1).normalize();
  return new THREE.Vector3(0.62, 0.42, 1).normalize();
}
const _rel = new THREE.Vector3();
function requiredDistance(right, up, fwd, target) {
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const tanH = Math.tan(Math.atan(Math.tan(fovV/2) * camera.aspect));
  const tanV = Math.tan(fovV/2);
  let d = 4;
  for (const c of FIT_PTS) {
    _rel.copy(c).sub(target);
    const cf = _rel.dot(fwd);
    d = Math.max(d,
      Math.abs(_rel.dot(right)) / tanH - cf,
      Math.abs(_rel.dot(up)) / tanV - cf);
  }
  return d;
}
function frameInitialCamera() {
  pickFov();
  const fd = fitDir();
  const fwd = fd.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const dist = requiredDistance(right, up, fwd, FIT_CENTER) * 1.06;
  camera.position.copy(FIT_CENTER).addScaledVector(fd, dist);
  controls.target.copy(FIT_CENTER);
  camera.updateProjectionMatrix(); controls.update();
}
frameInitialCamera();

// ---------- tap handling ----------
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
let flareT = -1;
function flare() {
  flareT = 0; boostTarget = 1.9; boostHold = 7;
  setHint('flare');
  for (let i = 0; i < 6; i++) {                       // smoke burst
    const sp = smoke[i]; sp.userData.t = sp.userData.life * (i / 8);
  }
}
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 7 || performance.now() - downT > 450) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(tapTargets, false);
  if (hits.length) flare();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
let nextAuto = rand(10, 16);
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // aurora boost lifecycle (tap flare + natural surges)
  if (boostHold > 0) { boostHold -= dt; if (boostHold <= 0) boostTarget = 1; }
  auroraBoost += (boostTarget - auroraBoost) * Math.min(1, dt * 1.4);
  if (flareT >= 0) {
    flareT += dt;
    if (flareT > 7) { flareT = -1; if (boostHold <= 0) setHint('idle'); }
  }
  nextAuto -= dt;
  if (nextAuto <= 0) {
    nextAuto = rand(15, 24);
    if (flareT < 0) { boostTarget = 1.5; boostHold = 5.5; setHint('auto'); setTimeout(() => { if (flareT < 0) setHint('idle'); }, 7000); }
  }

  // window + fire flicker
  const flareK = flareT >= 0 ? 1 + 0.9 * Math.max(0, 1 - flareT / 7) : 1;
  const flick = 1 + 0.12 * Math.sin(t * 7.3) + 0.07 * Math.sin(t * 13.7);
  cabin.userData.winMat.emissiveIntensity = 1.55 * flick * flareK;
  fireLight.intensity = 2.0 * flick * flareK;

  smokeStep(dt);
  shootStep(dt);
  auroraStep(t);

  // faint aurora wash on the world
  hemi.color.copy(HEMI_SKY_BASE).lerp(HEMI_SKY_GREEN, Math.min(0.45, (auroraBoost - 1) * 0.45));

  // keep zoom inside the fit while the camera moves
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up2 = new THREE.Vector3().crossVectors(right, fwd).normalize();
  controls.minDistance = Math.min(requiredDistance(right, up2, fwd, controls.target) * 1.04, 26);

  controls.update();
  renderer.render(scene, camera);
}
animate();
