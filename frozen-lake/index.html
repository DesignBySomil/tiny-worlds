<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frozen Lake - a tiny world</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#b8cfdd; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none;
    padding: max(18px, env(safe-area-inset-top)) 16px 18px; z-index:5;
    background: linear-gradient(rgba(40,58,72,.42), rgba(40,58,72,0)); }
  header h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:400;
    color:#f4f8fb; text-transform:uppercase; text-shadow:0 1px 8px rgba(35,50,62,.7); }
  header .rule { width:44px; height:1px; background:rgba(244,248,251,.55); margin:9px auto; }
  #hint { display:inline-block; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#fbfdfe; transition:opacity 1.2s ease; text-shadow:0 1px 2px rgba(35,50,62,.85), 0 0 12px rgba(35,50,62,.6); }
  #hint.faded { opacity:.45; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; pointer-events:none;
    padding:0 16px max(14px, env(safe-area-inset-bottom)); z-index:5;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(244,248,251,.55); }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Frozen Lake</h1>
  <div class="rule"></div>
  <span id="hint"></span>
</header>
<footer>A tiny world</footer>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8cfdd);
scene.fog = new THREE.Fog(0xb8cfdd, 55, 130);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 38 : (a >= 0.62 ? 46 : 58);
  camera.updateProjectionMatrix();
}
pickFov();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * 0.52; controls.enablePan = false;

// ---------- lights (pale winter sun) ----------
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(-12, 18, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13; sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0012;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe2f0, 0x7a8a96, 1.15));

// ---------- seeded rng + noise ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
const rand = (a, b) => a + rng() * (b - a);
function n2(x, z, s) {
  return Math.sin(x * 1.9 + s) * Math.sin(z * 2.2 + s * 0.4)
       + 0.5 * Math.sin(x * 4.3 + z * 2.8 + s + 2.2)
       + 0.25 * Math.sin(x * 7.1 - z * 5.9 + s + 4.1);
}

// ---------- palette ----------
const PAL = {
  ice: 0xcfe4f2, iceDeep: 0x5f8fb4, snow: 0xeef4fb, strata1: 0x6a6a72,
  strata2: 0x4e4e58, strata3: 0x36363f, pine: 0x2a4a38, pineSnow: 0xeef4fb,
  trunk: 0x3a2c1e, red: 0xc23a2e, blue: 0x2e5aa8, wood: 0x6b5638
};

const SLAB_HALF = 7.5, SLAB_H = 1.5;
const slabGroup = new THREE.Group(); scene.add(slabGroup);

// ---------- strata ----------
{
  const layers = [[PAL.strata1, 0.42, -0.21], [PAL.strata2, 0.52, -0.68], [PAL.strata3, 0.56, -1.22]];
  for (const [color, h, cy] of layers) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(SLAB_HALF*2, h, SLAB_HALF*2),
      new THREE.MeshStandardMaterial({ color, roughness: 0.95, flatShading: true }));
    m.position.y = cy; m.receiveShadow = true; slabGroup.add(m);
  }
}

// ---------- under-ice world: dark water, bubbles, fish ----------
const fish = [];
{
  const dcv = document.createElement('canvas'); dcv.width = dcv.height = 256;
  const dctx = dcv.getContext('2d');
  const dg = dctx.createRadialGradient(128, 128, 8, 128, 128, 128);
  dg.addColorStop(0, '#0b2b52'); dg.addColorStop(0.55, '#16477e'); dg.addColorStop(1, '#3d7ab3');
  dctx.fillStyle = dg; dctx.fillRect(0, 0, 256, 256);
  const deep = new THREE.Mesh(new THREE.PlaneGeometry(11, 11),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(dcv), fog: false }));
  deep.rotation.x = -Math.PI/2; deep.position.y = -0.25; slabGroup.add(deep);
  const bubbleMat = new THREE.MeshBasicMaterial({ color: 0xeef8ff, transparent: true, opacity: 0.9, fog: false });
  for (let i = 0; i < 40; i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(rand(0.03, 0.08), 5, 4), bubbleMat);
    b.position.set(rand(-5, 5), rand(-0.3, -0.08), rand(-5, 5));
    slabGroup.add(b);
  }
  const fishMat = new THREE.MeshBasicMaterial({ color: 0x2e5070, transparent: true, opacity: 0.95, fog: false });
  for (let i = 0; i < 8; i++) {
    const f = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.6, 5), fishMat);
    body.rotation.z = Math.PI/2; f.add(body);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 4), fishMat);
    tail.rotation.z = -Math.PI/2; tail.position.x = -0.37; tail.scale.setScalar(1.4); f.add(tail);
    f.position.y = rand(-0.26, -0.12);
    f.userData = { a: rand(0, 6.28), r: rand(1.5, 4.4), spd: rand(0.15, 0.4) * (rng() < 0.5 ? 1 : -1), wob: rng() * 6 };
    slabGroup.add(f); fish.push(f);
  }
}

// ---------- ice sheet (translucent, low-freq snow dust patches) ----------
const iceMat = new THREE.MeshStandardMaterial({
  color: 0x8fc3e8, roughness: 0.1, metalness: 0.05, transparent: true, opacity: 0.28, flatShading: true, fog: false });
let iceMesh;
{
  const g = new THREE.PlaneGeometry(SLAB_HALF*2 - 0.24, SLAB_HALF*2 - 0.24, 52, 52);
  g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const edge = Math.max(Math.abs(x), Math.abs(z)) / (SLAB_HALF - 0.12);
    const lake = Math.hypot(x, z) < 5.2 ? 0 : 0.10;   // snowy shore ring sits higher
    let y = 0.10 + lake + (lake ? 0.06 * n2(x * 0.6, z * 0.6, 2.2) : 0.015 * n2(x * 0.8, z * 0.8, 4.4));
    y -= Math.max(0, edge - 0.86) * 1.4;
    p.setY(i, y);
  }
  g.computeVertexNormals();
  iceMesh = new THREE.Mesh(g, iceMat);
  iceMesh.receiveShadow = true; slabGroup.add(iceMesh);
}
// snow dust patches on the ice
{
  const dustMat = new THREE.MeshStandardMaterial({ color: PAL.snow, roughness: 0.9, transparent: true, opacity: 0.55, flatShading: true });
  for (let i = 0; i < 9; i++) {
    const d = new THREE.Mesh(new THREE.CircleGeometry(rand(0.4, 1.1), 10), dustMat);
    d.rotation.x = -Math.PI/2;
    const a = rng() * 6.28, r = rand(2.6, 5);
    d.position.set(Math.cos(a) * r, 0.125 + i * 0.004, Math.sin(a) * r);
    d.scale.set(1, rand(0.5, 0.8), 1);
    d.receiveShadow = true; slabGroup.add(d);
  }
}

// ---------- skate trail curves on the ice ----------
{
  const trailMat = new THREE.MeshBasicMaterial({ color: 0xf4fafd, transparent: true, opacity: 0.7 });
  for (let i = 0; i < 5; i++) {
    const pts = [];
    const ca = rng() * 6.28, cr = rand(1.2, 3.6), cx = rand(-1.5, 1.5), cz = rand(-1.5, 1.5);
    for (let k = 0; k <= 40; k++) {
      const a = ca + k / 40 * rand(2.5, 4.5);
      pts.push(new THREE.Vector3(cx + Math.cos(a) * cr * (1 + 0.15 * Math.sin(a * 3)), 0.128 + i * 0.003, cz + Math.sin(a) * cr * 0.7));
    }
    const line = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.016, 4), trailMat);
    slabGroup.add(line);
  }
}

// ---------- crack burst (tap interaction) ----------
const cracks = [];
{
  const crackMat = new THREE.MeshBasicMaterial({ color: 0xf8fcff, transparent: true, opacity: 0 });
  for (let c = 0; c < 3; c++) {
    const grp = new THREE.Group(); grp.visible = false;
    const segs = [];
    for (let arm = 0; arm < 7; arm++) {
      const a = arm / 7 * Math.PI * 2 + rand(-0.3, 0.3);
      const len = rand(1.2, 2.6);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.05), crackMat.clone());
      m.rotation.x = -Math.PI/2;
      m.userData = { a, len };
      grp.add(m); segs.push(m);
      // branch
      if (arm % 2 === 0) {
        const b = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.035), m.material);
        b.rotation.x = -Math.PI/2;
        b.userData = { a: a + rand(0.5, 0.9) * (rng() < 0.5 ? 1 : -1), len: len * 0.5, from: len * 0.55 };
        grp.add(b); segs.push(b);
      }
    }
    grp.userData = { t: -1, segs };
    slabGroup.add(grp); cracks.push(grp);
  }
}
let crackIdx = 0;
function fireCrack(x, z) {
  const grp = cracks[crackIdx++ % cracks.length];
  grp.position.set(x, 0.135, z);
  grp.visible = true; grp.userData.t = 0;
}
function crackStep(dt) {
  for (const grp of cracks) {
    const u = grp.userData;
    if (u.t < 0) continue;
    u.t += dt;
    const grow = Math.min(1, u.t / 0.7);
    const fade = u.t < 6 ? 1 : Math.max(0, 1 - (u.t - 6) / 2.5);
    for (const m of u.segs) {
      const d = (m.userData.from || 0) + m.userData.len * 0.5 * grow;
      m.position.set(Math.cos(m.userData.a) * d, 0, Math.sin(m.userData.a) * d);
      m.scale.x = m.userData.len * grow;
      m.rotation.z = -m.userData.a;
      m.material.opacity = 0.9 * fade * (grow > 0.05 ? 1 : 0);
    }
    if (fade <= 0) { grp.visible = false; u.t = -1; }
  }
}

// ---------- skaters (two, gliding ellipses, lean into turns) ----------
const skaters = [];
{
  function skater(coat, cx, cz, rx, rz, spd, ph) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.23, 0.78, 6),
      new THREE.MeshStandardMaterial({ color: coat, roughness: 0.85, flatShading: true }));
    body.position.y = 0.6; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 7, 6),
      new THREE.MeshStandardMaterial({ color: 0xe8c39a, roughness: 0.8, flatShading: true }));
    head.position.y = 1.1; head.castShadow = true; g.add(head);
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.22, 6),
      new THREE.MeshStandardMaterial({ color: coat === PAL.red ? PAL.blue : PAL.red, roughness: 0.85, flatShading: true }));
    hat.position.y = 1.27; g.add(hat);
    g.userData = { cx, cz, rx, rz, spd, ph, scatter: 0 };
    slabGroup.add(g); skaters.push(g);
  }
  skater(PAL.red, -1.2, 0.4, 2.6, 1.7, 0.55, 0);
  skater(PAL.blue, 1.4, -0.8, 1.9, 1.3, -0.7, 2.1);
}
function skaterStep(dt, t) {
  for (const s of skaters) {
    const u = s.userData;
    const sc = 1 + u.scatter;
    const a = u.ph + t * u.spd;
    const x = u.cx + Math.cos(a) * u.rx * sc, z = u.cz + Math.sin(a) * u.rz * sc;
    const dx = -Math.sin(a) * u.rx * u.spd, dz = Math.cos(a) * u.rz * u.spd;
    s.position.set(x, 0.12, z);
    s.rotation.y = Math.atan2(dx, dz);
    s.rotation.z = -0.18 * Math.sign(u.spd);
    if (u.scatter > 0) u.scatter = Math.max(0, u.scatter - dt * 0.25);
  }
}

// ---------- fishing hole + stool + rod + bucket ----------
{
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.52, 12),
    new THREE.MeshBasicMaterial({ color: 0x16324a }));
  hole.rotation.x = -Math.PI/2; hole.position.set(3.4, 0.132, 2.4); slabGroup.add(hole);
  const rim = new THREE.Mesh(new THREE.RingGeometry(0.52, 0.68, 12),
    new THREE.MeshStandardMaterial({ color: PAL.snow, roughness: 0.9, flatShading: true }));
  rim.rotation.x = -Math.PI/2; rim.position.set(3.4, 0.128, 2.4); slabGroup.add(rim);
  const stool = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.38, 0.44),
    new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.92, flatShading: true }));
  stool.position.set(2.7, 0.31, 3.0); stool.castShadow = true; slabGroup.add(stool);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.032, 1.6, 4),
    new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.9 }));
  rod.position.set(3.0, 0.85, 2.85); rod.rotation.z = -0.7; rod.rotation.x = 0.3; rod.castShadow = true;
  slabGroup.add(rod);
  const bucket = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.32, 8),
    new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.5, metalness: 0.4, flatShading: true }));
  bucket.position.set(4.0, 0.28, 3.0); bucket.rotation.z = 0.35; bucket.castShadow = true; slabGroup.add(bucket);
}

// ---------- shore pines + signpost + rocks ----------
{
  const trunkMat = new THREE.MeshStandardMaterial({ color: PAL.trunk, roughness: 0.95, flatShading: true });
  const greenMat = new THREE.MeshStandardMaterial({ color: PAL.pine, roughness: 0.92, flatShading: true });
  const snowMat = new THREE.MeshStandardMaterial({ color: PAL.pineSnow, roughness: 0.9, flatShading: true });
  function pine(x, z, s) {
    const g = new THREE.Group(); g.position.set(x, 0.16, z); g.scale.setScalar(s);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.5, 6), trunkMat);
    trunk.position.y = 0.25; trunk.castShadow = true; g.add(trunk);
    for (let i = 0; i < 3; i++) {
      const r = 0.72 - i * 0.2, h = 0.8 - i * 0.09, y = 0.55 + i * 0.58;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), greenMat);
      cone.position.y = y; cone.castShadow = true; g.add(cone);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.6, h * 0.5, 7), snowMat);
      cap.position.y = y + h * 0.28; g.add(cap);
    }
    slabGroup.add(g);
  }
  const ring = [[6.4,-3.4,1.2],[5.9,-5.4,0.95],[3.2,-6.3,1.3],[0.6,-6.6,1.0],[-2.4,-6.2,1.25],
    [-5.2,-4.8,1.05],[-6.4,-2.2,1.35],[-6.5,0.9,1.0],[-5.6,3.4,1.2],[-3.4,5.6,0.9],
    [-0.8,6.4,1.3],[2.2,6.2,1.05],[5.2,4.9,1.15],[6.5,2.4,0.95],[6.6,-0.6,1.25]];
  for (const [x, z, s] of ring) pine(x + rand(-0.2, 0.2), z + rand(-0.2, 0.2), s * rand(0.92, 1.08));
  // signpost
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.3, 5), trunkMat);
  post.position.set(5.4, 0.8, 4.4); post.castShadow = true; slabGroup.add(post);
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.3, 0.05),
    new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.9, flatShading: true }));
  board.position.set(5.4, 1.35, 4.4); board.rotation.y = -0.5; board.castShadow = true; slabGroup.add(board);
  // shore rocks
  for (let i = 0; i < 18; i++) {
    const r = rand(0.09, 0.26);
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0),
      new THREE.MeshStandardMaterial({ color: rng() < 0.6 ? PAL.strata1 : PAL.snow, roughness: 0.95, flatShading: true }));
    const a = rng() * 6.28, d = rand(5.3, 7);
    rock.position.set(Math.cos(a) * d, 0.16 + r * 0.4, Math.sin(a) * d);
    rock.rotation.set(rng() * 3, rng() * 3, rng() * 3);
    rock.castShadow = rock.receiveShadow = true; slabGroup.add(rock);
  }
}

// ---------- snow gusts (auto event) ----------
const gusts = [];
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const cx = cv.getContext('2d');
  const grad = cx.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(238,246,252,0.8)'); grad.addColorStop(1, 'rgba(238,246,252,0)');
  cx.fillStyle = grad; cx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  for (let i = 0; i < 34; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false }));
    sp.userData = { y: rand(0.15, 1.6), z: rand(-6, 6), spd: rand(4, 7), s: rand(0.25, 0.7), off: rng() * 20 };
    scene.add(sp); gusts.push(sp);
  }
}
let gustK = 0;
function gustStep(dt, t) {
  for (const sp of gusts) {
    const u = sp.userData;
    const x = ((t * u.spd + u.off * 7) % 22) - 11;
    sp.position.set(x, u.y + 0.2 * Math.sin(t * 2 + u.off), u.z);
    sp.scale.set(u.s, u.s, 1);
    sp.material.opacity = gustK * 0.55 * Math.sin(Math.PI * Math.min(1, (x + 11) / 22));
  }
}

// ---------- hints ----------
const HINTS = {
  idle: 'Tap the ice to crack it',
  crack: 'The ice groans and cracks',
  wind: 'A cold wind sweeps the lake'
};
function setHint(s) {
  hintEl.textContent = HINTS[s]; hintEl.classList.remove('faded');
  clearTimeout(setHint._t);
  setHint._t = setTimeout(() => hintEl.classList.add('faded'), 6000);
}
setHint('idle');

// ---------- camera framing ----------
const FIT_CENTER = new THREE.Vector3(0, 1.2, 0);
const FIT_PTS = [];
for (const x of [-7.5, 7.5]) for (const y of [-SLAB_H, 0.6]) for (const z of [-7.5, 7.5])
  FIT_PTS.push(new THREE.Vector3(x, y, z));
FIT_PTS.push(new THREE.Vector3(-6.4, 3.4, -2.2));   // tallest pines
FIT_PTS.push(new THREE.Vector3(6.6, 3.2, -0.6));
FIT_PTS.push(new THREE.Vector3(5.4, 1.6, 4.4));     // signpost
function fitDir() {
  const a = innerWidth / innerHeight;
  if (a < 0.62) return new THREE.Vector3(0.1, 0.42, 1).normalize();
  if (a < 0.9) return new THREE.Vector3(0.42, 0.4, 1).normalize();
  return new THREE.Vector3(0.62, 0.42, 1).normalize();
}
const _rel = new THREE.Vector3();
function requiredDistance(right, up, fwd, target) {
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const tanH = Math.tan(Math.atan(Math.tan(fovV/2) * camera.aspect));
  const tanV = Math.tan(fovV/2);
  let d = 4;
  for (const c of FIT_PTS) {
    _rel.copy(c).sub(target);
    const cf = _rel.dot(fwd);
    d = Math.max(d, Math.abs(_rel.dot(right)) / tanH - cf, Math.abs(_rel.dot(up)) / tanV - cf);
  }
  return d;
}
function frameInitialCamera() {
  pickFov();
  const fd = fitDir();
  const fwd = fd.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const dist = requiredDistance(right, up, fwd, FIT_CENTER) * 1.06;
  camera.position.copy(FIT_CENTER).addScaledVector(fd, dist);
  controls.target.copy(FIT_CENTER);
  camera.updateProjectionMatrix(); controls.update();
}
frameInitialCamera();

// ---------- tap ----------
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 7 || performance.now() - downT > 450) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(iceMesh, false);
  if (!hits.length) return;
  const p = hits[0].point;
  if (Math.hypot(p.x, p.z) > 5.2) return;         // shore snow doesn't crack
  fireCrack(p.x, p.z);
  for (const s of skaters) s.userData.scatter = 1.2;
  setHint('crack');
  clearTimeout(fireCrack._t);
  fireCrack._t = setTimeout(() => setHint('idle'), 7000);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();
});

// ---------- animate ----------
const clock = new THREE.Clock();
let nextGust = rand(12, 18);
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  nextGust -= dt;
  if (nextGust <= 0) {
    nextGust = rand(14, 24);
    gustK = 1; setHint('wind');
    setTimeout(() => { gustK = 0; setHint('idle'); }, 5200);
  }

  skaterStep(dt, t);
  crackStep(dt);
  gustStep(dt, t);
  for (const f of fish) {
    const u = f.userData;
    const a = u.a + t * u.spd;
    f.position.x = Math.cos(a) * u.r;
    f.position.z = Math.sin(a) * u.r * 0.8;
    f.rotation.y = -a + (u.spd > 0 ? 0 : Math.PI);
    f.position.y = -0.2 + 0.08 * Math.sin(t * 0.9 + u.wob);
  }

  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const up2 = new THREE.Vector3().crossVectors(right, fwd).normalize();
  controls.minDistance = Math.min(requiredDistance(right, up2, fwd, controls.target) * 1.04, 26);

  controls.update();
  renderer.render(scene, camera);
}
animate();
