<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Deterministic PRNG ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261101);
function rand(a, b) { return a + rng() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

// ---------- Scene, Camera, Renderer ----------
const container = document.getElementById('app');
const hintEl = document.getElementById('hint');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x231b38, 0.0115);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 240);
function pickFov() {
  const a = innerWidth / innerHeight;
  camera.fov = a >= 0.9 ? 35 : (a >= 0.62 ? 41 : 46);
  camera.updateProjectionMatrix();
}
pickFov();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.12;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- Procedural Canvas Textures ----------
function makeLavaTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#e83d00';
  cx.fillRect(0, 0, 256, 256);

  for (let i = 0; i < 190; i++) {
    const x = rand(0, 256), y = rand(0, 256), r = rand(8, 38);
    const g = cx.createRadialGradient(x, y, 1, x, y, r);
    const hot = rng() > 0.34;
    g.addColorStop(0, hot ? 'rgba(255, 250, 175, 0.65)' : 'rgba(70, 16, 6, 0.52)');
    g.addColorStop(0.55, hot ? 'rgba(255, 145, 25, 0.35)' : 'rgba(155, 32, 8, 0.25)');
    g.addColorStop(1, 'rgba(255, 70, 0, 0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
  }

  cx.strokeStyle = 'rgba(255, 246, 165, 0.65)';
  cx.lineWidth = 2.4;
  for (let i = 0; i < 32; i++) {
    cx.beginPath();
    let px = rand(0, 256), py = rand(0, 256);
    cx.moveTo(px, py);
    for (let s = 0; s < 5; s++) {
      px += rand(-28, 28); py += rand(-28, 28);
      cx.lineTo(px, py);
    }
    cx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  return tex;
}

function makeRockBumpTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#808080';
  cx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 420; i++) {
    const v = randInt(60, 210);
    cx.fillStyle = `rgb(${v},${v},${v})`;
    cx.fillRect(rand(0, 128), rand(0, 128), rand(2, 10), rand(2, 10));
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeParticleSprite(innerCol, midCol, outerCol) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(32, 32, 1.5, 32, 32, 30);
  g.addColorStop(0, innerCol);
  g.addColorStop(0.42, midCol);
  g.addColorStop(1, outerCol);
  cx.fillStyle = g;
  cx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}

const lavaTex = makeLavaTexture();
const rockBump = makeRockBumpTexture();
const haloSpriteTex = makeParticleSprite(
  'rgba(235, 255, 255, 1.0)',
  'rgba(70, 210, 255, 0.58)',
  'rgba(95, 70, 255, 0.0)'
);
const sparkSpriteTex = makeParticleSprite(
  'rgba(255, 255, 255, 1.0)',
  'rgba(110, 240, 255, 0.9)',
  'rgba(120, 80, 255, 0.0)'
);

// ---------- Lighting (Clear Upper Facets, Atmospheric Purple-Blue vs Warm Up-Light) ----------
// Strong cool sky/vault fill + warm magma bounce so upper rocks & stalactites never crush to black
scene.add(new THREE.HemisphereLight(0xaec4ff, 0x6b3528, 1.45));

// Cool moonlight key from upper front-right to sculpt every upper arch & stalactite facet
const moon = new THREE.DirectionalLight(0xbfd4ff, 1.75);
moon.position.set(8.5, 16, 11);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -9.5;
moon.shadow.camera.right = 9.5;
moon.shadow.camera.top = 12.5;
moon.shadow.camera.bottom = -9.5;
moon.shadow.camera.near = 2;
moon.shadow.camera.far = 40;
moon.shadow.bias = -0.0005;
scene.add(moon);

// Vivid violet-indigo side/top rim light for rich purple contrast on upper cliffs & stalactites
const violetRim = new THREE.DirectionalLight(0x9f7aff, 1.35);
violetRim.position.set(-11, 13, 5);
scene.add(violetRim);

// Warm orange-amber under-fill directional light simulating magma reflection onto upper ceiling
const warmUpFill = new THREE.DirectionalLight(0xff7b3a, 1.05);
warmUpFill.position.set(0, -10, 4);
scene.add(warmUpFill);

// Dedicated upper vault & stalactite fill light so the arch crown & stalactites have crisp facet separation
const vaultCrownLight = new THREE.PointLight(0x8fa8ff, 18, 15, 1.35);
vaultCrownLight.position.set(0, 7.6, -0.5);
scene.add(vaultCrownLight);

// Warm bounce light directly beneath the upper arch & stalactites
const archUnderWarm = new THREE.PointLight(0xff6d2e, 22, 13, 1.45);
archUnderWarm.position.set(0, 4.8, -1.8);
scene.add(archUnderWarm);

// Primary lava pool light
const lavaLight = new THREE.PointLight(0xff621a, 36, 17, 1.5);
lavaLight.position.set(0.1, 1.4, 1.85);
lavaLight.castShadow = true;
lavaLight.shadow.bias = -0.001;
scene.add(lavaLight);

// Cavern throat magma glow
const throatLight = new THREE.PointLight(0xff4c12, 26, 13, 1.5);
throatLight.position.set(-0.2, 2.1, -2.5);
scene.add(throatLight);

// Cool crystal ambient point lights
const gemLightL = new THREE.PointLight(0x4deeea, 15, 10, 1.5);
gemLightL.position.set(-3.2, 1.8, -1.2);
scene.add(gemLightL);

const gemLightR = new THREE.PointLight(0x9b72ff, 14, 10, 1.5);
gemLightR.position.set(3.2, 1.9, -1.3);
scene.add(gemLightR);

// ---------- Shared Materials (Lifted Stone Values + Subtle Emissive Tint, Never Black) ----------
const basaltDarkMat = new THREE.MeshStandardMaterial({
  color: 0x3f4359,
  emissive: 0x161329,
  emissiveIntensity: 0.42,
  roughness: 0.82,
  metalness: 0.12,
  bumpMap: rockBump,
  bumpScale: 0.035,
  flatShading: true
});
const basaltMidMat = new THREE.MeshStandardMaterial({
  color: 0x545a75,
  emissive: 0x1d1836,
  emissiveIntensity: 0.45,
  roughness: 0.76,
  metalness: 0.12,
  bumpMap: rockBump,
  bumpScale: 0.04,
  flatShading: true
});
const basaltLightMat = new THREE.MeshStandardMaterial({
  color: 0x6c7496,
  emissive: 0x241e42,
  emissiveIntensity: 0.48,
  roughness: 0.70,
  metalness: 0.10,
  bumpMap: rockBump,
  bumpScale: 0.04,
  flatShading: true
});
const purpleCliffMat = new THREE.MeshStandardMaterial({
  color: 0x635685,
  emissive: 0x281c47,
  emissiveIntensity: 0.52,
  roughness: 0.74,
  metalness: 0.11,
  bumpMap: rockBump,
  bumpScale: 0.04,
  flatShading: true
});
const warmStoneMat = new THREE.MeshStandardMaterial({
  color: 0x6b5258,
  emissive: 0x2e1618,
  emissiveIntensity: 0.46,
  roughness: 0.78,
  metalness: 0.08,
  flatShading: true
});
const stalactiteMat = new THREE.MeshStandardMaterial({
  color: 0x756c96,
  emissive: 0x33203d,
  emissiveIntensity: 0.55,
  roughness: 0.66,
  metalness: 0.14,
  flatShading: true
});
const stalactiteWarmMat = new THREE.MeshStandardMaterial({
  color: 0x82626c,
  emissive: 0x451d18,
  emissiveIntensity: 0.58,
  roughness: 0.68,
  metalness: 0.12,
  flatShading: true
});
const crustMat = new THREE.MeshStandardMaterial({
  color: 0x322424,
  emissive: 0x4d1707,
  emissiveIntensity: 0.45,
  roughness: 0.88,
  flatShading: true
});
const sulfurMat = new THREE.MeshStandardMaterial({
  color: 0xefd046,
  emissive: 0x805606,
  emissiveIntensity: 0.48,
  roughness: 0.68,
  flatShading: true
});
const obsidianMat = new THREE.MeshStandardMaterial({
  color: 0x242c44,
  emissive: 0x1e294a,
  emissiveIntensity: 0.42,
  roughness: 0.16,
  metalness: 0.65,
  flatShading: true
});

// Brightest feature in scene: layered incandescent lava
const lavaMat = new THREE.MeshStandardMaterial({
  color: 0xff6218,
  emissive: 0xff5a0e,
  emissiveIntensity: 2.15,
  roughness: 0.26,
  metalness: 0.04,
  map: lavaTex,
  emissiveMap: lavaTex
});
const hotEdgeOuterMat = new THREE.MeshBasicMaterial({
  color: 0xff9424, transparent: true, opacity: 0.92
});
const hotEdgeCoreMat = new THREE.MeshBasicMaterial({
  color: 0xfff099, transparent: true, opacity: 0.95
});

// ---------- Geometry Helpers ----------
function jitterGeometry(geo, amount, yScale = 1) {
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const map = new Map();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const key = `${v.x.toFixed(3)}_${v.y.toFixed(3)}_${v.z.toFixed(3)}`;
    let offset = map.get(key);
    if (!offset) {
      offset = new THREE.Vector3(
        rand(-amount, amount),
        rand(-amount, amount) * yScale,
        rand(-amount, amount)
      );
      map.set(key, offset);
    }
    v.add(offset);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

function makeHexColumn(radius, height, mat, bevel = 0.08) {
  const g = new THREE.CylinderGeometry(radius * (1 - bevel), radius, height, 6, 2);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const py = pos.getY(i);
    if (py > height * 0.38) {
      pos.setY(i, py + rand(-0.06, 0.06));
    }
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ---------- Root Diorama Group ----------
// Compact horizontal footprint (radius ~4.95) + tall vertical cliff architecture (up to Y=8.55)
// so portrait viewports fill 90-95% width while making the cave tall and monumental.
const SLAB_H = 1.65;
const BASE_R = 4.85;
const slabGroup = new THREE.Group();
scene.add(slabGroup);

// ---------- 1. Compact Stratified Cutaway Base Slab ----------
{
  // Bottom pedestal plinth
  const plinthGeo = new THREE.CylinderGeometry(BASE_R - 0.15, BASE_R - 0.48, 0.55, 8);
  plinthGeo.rotateY(Math.PI / 8);
  jitterGeometry(plinthGeo, 0.07, 0.22);
  const plinth = new THREE.Mesh(plinthGeo, basaltDarkMat);
  plinth.position.y = -SLAB_H - 0.22;
  plinth.receiveShadow = true;
  slabGroup.add(plinth);

  // Incandescent magma seam inside cutaway slab
  const veinGeo = new THREE.CylinderGeometry(BASE_R - 0.18, BASE_R - 0.22, 0.16, 16);
  const veinMat = new THREE.MeshBasicMaterial({ color: 0xff7824 });
  const vein = new THREE.Mesh(veinGeo, veinMat);
  vein.position.y = -0.94;
  slabGroup.add(vein);

  // Main middle basalt stratum
  const midSlabGeo = new THREE.CylinderGeometry(BASE_R, BASE_R - 0.22, SLAB_H, 12, 2);
  midSlabGeo.rotateY(Math.PI / 12);
  jitterGeometry(midSlabGeo, 0.12, 0.2);
  const midSlab = new THREE.Mesh(midSlabGeo, basaltMidMat);
  midSlab.position.y = -SLAB_H * 0.5 - 0.08;
  midSlab.castShadow = true;
  midSlab.receiveShadow = true;
  slabGroup.add(midSlab);

  // Upper cavern floor table
  const topSlabGeo = new THREE.CylinderGeometry(BASE_R - 0.05, BASE_R + 0.08, 0.36, 12, 1);
  topSlabGeo.rotateY(Math.PI / 12);
  jitterGeometry(topSlabGeo, 0.09, 0.18);
  const topSlab = new THREE.Mesh(topSlabGeo, basaltLightMat);
  topSlab.position.y = -0.14;
  topSlab.receiveShadow = true;
  topSlab.castShadow = true;
  slabGroup.add(topSlab);

  // Perimeter columnar basalt skirting around the slab edges
  const skirtCount = 32;
  for (let i = 0; i < skirtCount; i++) {
    const a = (i / skirtCount) * Math.PI * 2 + rand(-0.04, 0.04);
    const isFront = Math.sin(a) > 0.80 && Math.abs(Math.cos(a)) < 0.42;
    const rDist = rand(BASE_R - 0.35, BASE_R - 0.02);
    const h = isFront ? rand(0.95, 1.35) : rand(1.3, 2.1);
    const rad = rand(0.32, 0.50);
    const colMat = i % 3 === 0 ? basaltLightMat : (i % 2 === 0 ? purpleCliffMat : basaltMidMat);
    const col = makeHexColumn(rad, h, colMat);
    col.position.set(
      Math.cos(a) * rDist,
      -SLAB_H + h * 0.5 - rand(0.05, 0.22),
      Math.sin(a) * rDist
    );
    col.rotation.y = rand(0, Math.PI);
    slabGroup.add(col);
  }
}

// ---------- 2. Tall Portrait Cavern Architecture: Stacked Rear Cliffs, Middle Ledges & Readable Stalactites ----------
{
  // Recessed cavern throat backdrop (dark warm-violet depth, not pitch black)
  const throatGeo = new THREE.SphereGeometry(2.35, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.65);
  const throatMat = new THREE.MeshBasicMaterial({ color: 0x160a1c, side: THREE.DoubleSide });
  const throat = new THREE.Mesh(throatGeo, throatMat);
  throat.position.set(0, 0.45, -2.55);
  throat.scale.set(1.08, 1.42, 0.82);
  slabGroup.add(throat);

  // Warm inner magma glow inside the cavern mouth
  const mouthGlow = new THREE.Mesh(
    new THREE.CircleGeometry(2.05, 24),
    new THREE.MeshBasicMaterial({ color: 0xff5a18, transparent: true, opacity: 0.52 })
  );
  mouthGlow.position.set(0, 1.45, -3.12);
  slabGroup.add(mouthGlow);

  const mouthCoreGlow = new THREE.Mesh(
    new THREE.CircleGeometry(1.25, 20),
    new THREE.MeshBasicMaterial({ color: 0xffb84d, transparent: true, opacity: 0.45 })
  );
  mouthCoreGlow.position.set(0, 1.15, -3.08);
  slabGroup.add(mouthCoreGlow);

  // Varied Middle Ledges & Stepped Terraces (bridging cavern floor to tall cliffs)
  const middleLedges = [
    // Left stepped ledges
    [-3.1, 0.45, -1.6, 1.05, 0.9], [-2.5, 1.05, -2.2, 0.95, 1.3],
    [-3.5, 0.75, -0.3, 0.92, 1.1], [-2.8, 1.65, -2.6, 0.88, 1.6],
    // Right stepped ledges
    [3.1, 0.45, -1.6, 1.05, 0.9],  [2.5, 1.10, -2.2, 0.95, 1.35],
    [3.5, 0.75, -0.3, 0.92, 1.1],  [2.8, 1.70, -2.6, 0.88, 1.65],
    // Foreground-mid flanking rock shelves
    [-3.6, 0.32, 1.05, 0.95, 0.65], [3.6, 0.32, 1.05, 0.95, 0.65]
  ];
  for (const [lx, ly, lz, lrad, lh] of middleLedges) {
    const ledgeMat = rng() > 0.5 ? basaltLightMat : (rng() > 0.4 ? purpleCliffMat : warmStoneMat);
    const ledge = makeHexColumn(lrad, lh, ledgeMat, 0.05);
    ledge.position.set(lx, ly, lz);
    ledge.rotation.y = rand(0, Math.PI);
    slabGroup.add(ledge);
  }

  // Tall Stacked Rear & Flanking Basalt Organ-Pipe Cliffs (creating strong verticality up to Y=8.4)
  const tallPillarClusters = [
    // Left tiered cliff wall
    [-4.15, -0.4, 2.6, 0.50], [-4.05, -1.4, 3.8, 0.56], [-3.75, -2.3, 5.0, 0.62],
    [-3.25, -3.0, 6.1, 0.66], [-2.55, -3.5, 7.0, 0.70],
    // Right tiered cliff wall
    [4.15, -0.4, 2.6, 0.50],  [4.05, -1.4, 3.8, 0.56],  [3.75, -2.3, 5.0, 0.62],
    [3.25, -3.0, 6.1, 0.66],  [2.55, -3.5, 7.0, 0.70],
    // High rear cathedral spire columns framing the upper arch
    [-1.75, -3.85, 7.6, 0.74], [-0.85, -4.05, 8.15, 0.78],
    [0.0,   -4.15, 8.45, 0.82],
    [0.85,  -4.05, 8.10, 0.78], [1.75, -3.85, 7.55, 0.74],
    // Mid-height inner buttress columns
    [-2.95, -2.1, 4.4, 0.52], [2.95, -2.1, 4.4, 0.52],
    [-2.15, -2.8, 5.5, 0.56], [2.15, -2.8, 5.5, 0.56]
  ];

  for (const [x, z, h, r] of tallPillarClusters) {
    const matChoice = rng();
    const mat = matChoice > 0.55 ? basaltLightMat : (matChoice > 0.25 ? purpleCliffMat : warmStoneMat);
    const col = makeHexColumn(r, h, mat);
    col.position.set(x + rand(-0.06, 0.06), h * 0.5 - 0.08, z + rand(-0.06, 0.06));
    col.rotation.set(rand(-0.03, 0.03), rand(0, Math.PI), rand(-0.03, 0.03));
    slabGroup.add(col);

    // Stepped companion column in front of each main cliff pillar for rich layered facets
    const h2 = h * rand(0.54, 0.78);
    const mat2 = rng() > 0.45 ? basaltLightMat : purpleCliffMat;
    const col2 = makeHexColumn(r * rand(0.68, 0.84), h2, mat2);
    const ang = Math.atan2(-z, -x) + rand(-0.28, 0.28);
    col2.position.set(
      x + Math.cos(ang) * r * 0.72,
      h2 * 0.5 - 0.08,
      z + Math.sin(ang) * r * 0.72
    );
    col2.rotation.y = rand(0, Math.PI);
    slabGroup.add(col2);
  }

  // Sculpted Vaulted Arch & High Crag Crown (Faceted, well-lit, rising to Y=8.55)
  const archBlocks = [
    // Lower arch shoulders
    [-2.85, 4.8, -2.4, 1.18], [2.85, 4.8, -2.4, 1.18],
    [-2.20, 5.7, -2.5, 1.24], [2.20, 5.7, -2.5, 1.24],
    // Upper vaulted arch span
    [-1.40, 6.45, -2.55, 1.28], [1.40, 6.45, -2.55, 1.28],
    [-0.50, 6.95, -2.60, 1.32], [0.50, 6.95, -2.60, 1.32],

  for (let i = 0; i < EMBERS; i++) {
    arr[i * 3]     = rand(-3.3, 3.3);
    arr[i * 3 + 1] = rand(0.15, EMBER_CEIL);
    arr[i * 3 + 2] = rand(-2.8, 3.3);
    emberPhase[i] = rand(0, Math.PI * 2);
  }
  emberGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
}
const emberMat = new THREE.PointsMaterial({
  map: makeParticleSprite('rgba(255,248,190,1)', 'rgba(255,140,35,0.88)', 'rgba(255,60,0,0)'),
  size: 0.20,
  transparent: true,
  depthWrite: false,
  color: 0xffbe72,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const embers = new THREE.Points(emberGeo, emberMat);
embers.frustumCulled = false;
scene.add(embers);

const SHIMMERS = 32;
const shimmerGeo = new THREE.BufferGeometry();
const shimmerPhase = new Float32Array(SHIMMERS);
{
  const sArr = new Float32Array(SHIMMERS * 3);
  for (let i = 0; i < SHIMMERS; i++) {
    sArr[i * 3]     = rand(-1.7, 1.7);
    sArr[i * 3 + 1] = rand(0.2, 4.6);
    sArr[i * 3 + 2] = rand(-2.2, 3.0);
    shimmerPhase[i] = rand(0, Math.PI * 2);
  }
  shimmerGeo.setAttribute('position', new THREE.BufferAttribute(sArr, 3));
}
const shimmerMat = new THREE.PointsMaterial({
  map: makeParticleSprite('rgba(255,155,75,0.30)', 'rgba(255,95,35,0.14)', 'rgba(255,50,10,0)'),
  size: 0.78,
  transparent: true,
  depthWrite: false,
  color: 0xff823e,
  opacity: 0.44,
  blending: THREE.AdditiveBlending
});
const shimmers = new THREE.Points(shimmerGeo, shimmerMat);
shimmers.frustumCulled = false;
scene.add(shimmers);

const emberBoost = { t0: -1 };
const EMBER_BOOST_MS = 2600;

// ---------- Hints (Supports Idle, Lava Bubble, and 4s Crystal Flare with Clean Reset) ----------
const HINTS = {
  idle: 'Tap lava or crystals',
  bubble: 'Watch it bubble',
  crystal: 'Crystal resonance',
};
let hintResetTimer = null;
function setHint(s, durationMs = 0) {
  hintEl.textContent = HINTS[s] || HINTS.idle;
  hintEl.dataset.s = s;
  hintEl.classList.remove('faded');
  clearTimeout(setHint._fadeT);
  setHint._fadeT = setTimeout(() => hintEl.classList.add('faded'), 6000);

  if (hintResetTimer) {
    clearTimeout(hintResetTimer);
    hintResetTimer = null;
  }
  if (durationMs > 0) {
    hintResetTimer = setTimeout(() => {
      if (hintEl.dataset.s === s) setHint('idle');
    }, durationMs);
  }
}
setHint('idle');

// ---------- Responsive Camera Fit (Verified across 616x562, 390x844, 320x700) ----------
const FIT_CENTER = new THREE.Vector3(0, 2.35, 0);

// Exact bounding points of physical geometry + high cathedral cliffs + bottom plinth
const SCENE_PTS = [
  // Full base slab & bottom plinth edges (never cropped)
  new THREE.Vector3(-5.05, -SLAB_H - 0.58, -5.05),
  new THREE.Vector3( 5.05, -SLAB_H - 0.58, -5.05),
  new THREE.Vector3(-5.05, -SLAB_H - 0.58,  5.05),
  new THREE.Vector3( 5.05, -SLAB_H - 0.58,  5.05),
  new THREE.Vector3(-5.12,  0.35,  0.0),
  new THREE.Vector3( 5.12,  0.35,  0.0),
  new THREE.Vector3( 0.0,  -SLAB_H - 0.58,  5.15),
  // Tall rear basalt cliffs, arch crown & particle ceiling
  new THREE.Vector3(-3.35,  7.4, -3.5),
  new THREE.Vector3( 3.35,  7.4, -3.5),
  new THREE.Vector3( 0.0,   8.65, -4.15),
  new THREE.Vector3( 0.0,   EMBER_CEIL + 0.35, 0.0)
];

function fitDir() {
  const a = innerWidth / innerHeight;
  if (a < 0.62) return new THREE.Vector3(0.12, 0.44, 1.0).normalize();
  if (a < 0.9)  return new THREE.Vector3(0.28, 0.42, 1.0).normalize();
  return new THREE.Vector3(0.44, 0.40, 1.0).normalize();
}

const _rel = new THREE.Vector3();
function frameInitialCamera() {
  camera.aspect = innerWidth / innerHeight;
  pickFov();

  const a = camera.aspect;
  const fd = fitDir();
  const fwd = fd.clone().negate();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(fwd, worldUp).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();

  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const tanV = Math.tan(fovV / 2);
  const tanH = tanV * a;

  const headerEl = document.querySelector('header');
  const footerEl = document.querySelector('footer');
  const headerPx = headerEl ? headerEl.getBoundingClientRect().height : 88;
  const footerPx = footerEl ? footerEl.getBoundingClientRect().height : 36;

  // On portrait phones (390x844, 320x700), fill 92-94% of viewport width while keeping
  // all upper cliffs & embers below the header and the entire base above the footer.
  const horizFill = a < 0.62 ? 0.93 : (a < 0.9 ? 0.88 : 0.84);
  const topSafeFrac = Math.max(0.54, 1.0 - ((headerPx + 24) / innerHeight) * 2.0);
  const botSafeFrac = Math.max(0.68, 1.0 - ((footerPx + 18) / innerHeight) * 2.0);

  const targetY = a < 0.62 ? 2.55 : 2.35;
  FIT_CENTER.set(0, targetY, 0);

  let dist = 5.0;
  for (const pt of SCENE_PTS) {
    _rel.copy(pt).sub(FIT_CENTER);
    const cf = _rel.dot(fwd);
    const cx = Math.abs(_rel.dot(right));
    const cy = _rel.dot(up);

    const dHoriz = cx / (tanH * horizFill) - cf;
    const dVert = cy >= 0
      ? cy / (tanV * topSafeFrac) - cf
      : (-cy) / (tanV * botSafeFrac) - cf;

    dist = Math.max(dist, dHoriz, dVert);
  }

  camera.position.copy(FIT_CENTER).addScaledVector(fd, dist);
  controls.target.copy(FIT_CENTER);
  controls.minDistance = dist * 0.58;
  controls.maxDistance = dist * 1.45;
  camera.updateProjectionMatrix();
  controls.update();
}
frameInitialCamera();

// ---------- Tap Interactions (Crystal 4s Resonance Flare & Lava Eruption) ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;

function triggerCrystalFlare(cry, now) {
  cry.flareT0 = now;
  // Reset rising jewel sparks to base of cluster so retrigger always starts cleanly
  const posAttr = cry.sparkGeo.attributes.position;
  for (let k = 0; k < cry.sparkSeeds.length; k++) {
    const sd = cry.sparkSeeds[k];
    const r = sd.rad * 0.65;
    posAttr.setXYZ(k, Math.cos(sd.ang) * r, rand(0.08, 0.45), Math.sin(sd.ang) * r);
  }
  posAttr.needsUpdate = true;
  cry.sparks.visible = true;
  setHint('crystal', CRYSTAL_FLARE_MS);
}

renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX;
  downY = e.clientY;
  downT = performance.now();
});

renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10 || performance.now() - downT > 500) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);

  const crystalTargets = [];
  crystals.forEach(c => {
    crystalTargets.push(c.m);
    c.cluster.children.forEach(ch => {
      if (ch.userData && ch.userData.crystalRef) crystalTargets.push(ch);
    });
  });

  const cryHits = ray.intersectObjects(crystalTargets, false);
  if (cryHits.length) {
    const ref = cryHits[0].object.userData.crystalRef;
    if (ref) {
      triggerCrystalFlare(ref, performance.now());
      return;
    }
  }

  const lavaHits = ray.intersectObject(lavaGroup.userData.proxy, false);
  if (lavaHits.length) {
    for (let k = 0; k < 8; k++) spawnBubble(k * 135, true);
    emberBoost.t0 = performance.now();
    setHint('bubble', 3500);
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  frameInitialCamera();
});

// ---------- Animation Loop ----------
const clock = new THREE.Clock();
let nextAmbientBubble = performance.now() + 650;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  const now = performance.now();

  // Narrow-viewport scale factor so particle & crystal effects remain bold at 320px width
  const narrowBoost = innerWidth <= 380 ? 1.28 : 1.0;

  // Scroll procedural lava river texture
  lavaTex.offset.y = -t * 0.095;
  lavaTex.offset.x = Math.sin(t * 0.45) * 0.04;

  // Lava glow pulse + wall-clock eruption boost after tap
  let glow = 2.15 + Math.sin(t * 2.2) * 0.25;
  let lightI = 36 + Math.sin(t * 2.2) * 6;
  let throatI = 26 + Math.cos(t * 1.9) * 4;

  if (emberBoost.t0 > 0) {
    const e = (now - emberBoost.t0) / EMBER_BOOST_MS;
    if (e >= 1) {
      emberBoost.t0 = -1;
    } else {
      const k = Math.sin(e * Math.PI);
      glow += k * 1.45;
      lightI += k * 34;
      throatI += k * 20;
    }
  }
  lavaMat.emissiveIntensity = glow;
  lavaLight.intensity = lightI;
  throatLight.intensity = throatI;
  hotEdgeOuterMat.opacity = Math.min(1, 0.86 + (glow - 2.15) * 0.2);

  // Ambient + tap-burst lava bubbles (wall-clock lifetimes)
  if (now > nextAmbientBubble) {
    spawnBubble(0, false);
    nextAmbientBubble = now + rand(800, 1850);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    const e = (now - b.t0) / b.life;
    if (e < 0) {
      b.m.visible = false;
      b.ring.visible = false;
      continue;
    }
    if (e >= 1) {
      slabGroup.remove(b.m);
      slabGroup.remove(b.ring);
      bubbles.splice(i, 1);
      continue;
    }
    b.m.visible = true;
    b.ring.visible = true;
    const k = e < 0.72 ? e / 0.72 : (1 - e) / 0.28;
    const scale = Math.max(0.001, k * (b.big ? 1.35 : 1.15));
    b.m.scale.set(scale, scale * (0.85 + e * 0.35), scale);
    b.m.position.y = b.baseY + e * (b.big ? 0.38 : 0.25);

    const rScale = 0.6 + e * (b.big ? 2.45 : 1.65);
    b.ring.scale.setScalar(rScale);
    b.ring.material.opacity = (1 - e) * 0.8;
  }

  // Cooled crust islands drifting on the pool
  for (const c of crustBlobs) {
    c.userData.a += c.userData.sp * dt;
    c.position.x = LAVA.x + Math.cos(c.userData.a) * c.userData.rr;
    c.position.z = LAVA.z + Math.sin(c.userData.a) * c.userData.rr;
    c.position.y = 0.074 + Math.sin(t * 2.4 + c.userData.a) * 0.008;
    c.rotation.y += c.userData.rotSp * dt;
  }

  // Crystal shimmer + 4-second unmistakable tap flare (wall-clock driven, zero permanent buildup)
  let maxFlareL = 0;
  let maxFlareR = 0;
  for (const c of crystals) {
    const idlePulse = 0.98 + Math.sin(t * 1.8 + c.ph) * 0.20;

    if (c.flareT0 > 0) {
      const elapsed = now - c.flareT0;
      const e = elapsed / CRYSTAL_FLARE_MS;
      if (e >= 1) {
        // Cleanly settle back to idle state with no buildup
        c.flareT0 = -1;
        c.mat.color.copy(c.baseColor);
        c.mat.emissive.copy(c.baseEmissive);
        c.mat.emissiveIntensity = idlePulse;
        c.coreMat.opacity = 0.0;
        c.haloMat.opacity = 0.28;
        c.haloSprite.scale.set(c.baseHaloScale, c.baseHaloScale, 1);
        c.shockMat.opacity = 0.0;
        c.sparks.visible = false;
        c.sparkMat.opacity = 0.0;
        c.cluster.scale.setScalar(1.0);
      } else {
        // Fast attack (first 12%), sustained bright resonance with shimmer, smooth settle (last 28%)
        const env = e < 0.12
          ? (e / 0.12)
          : (e < 0.72 ? 1.0 - 0.12 * Math.sin((e - 0.12) * Math.PI * 5) : (1.0 - e) / 0.28);
        const f = Math.max(0, Math.min(1, env));

        // Shift crystal shards toward brilliant cyan-white core
        c.mat.color.copy(c.baseColor).lerp(c.flareColor, f * 0.85);
        c.mat.emissive.copy(c.baseEmissive).lerp(c.flareEmissive, f * 0.9);
        c.mat.emissiveIntensity = idlePulse + f * 3.8;

        // Inner cyan-white core blaze
        c.coreMat.opacity = f * 0.95;
        c.coreMesh.rotation.y = t * 3.2;
        const coreS = (0.85 + f * 0.55) * narrowBoost;
        c.coreMesh.scale.set(coreS * 0.75, coreS * 1.45, coreS * 0.75);

        // Large blue-cyan halo expansion
        c.haloMat.opacity = 0.28 + f * 0.72;
        const hScale = c.baseHaloScale * (1.0 + f * 1.65 * narrowBoost);
        c.haloSprite.scale.set(hScale, hScale, 1);

        // Subtle cluster scale pulse
        c.cluster.scale.setScalar(1.0 + f * 0.12);

        // Expanding ground ring pulse (two waves across 4 seconds)
        const wave = (e * 2.0) % 1.0;
        c.shockRing.scale.setScalar(0.6 + wave * 4.2 * c.scale);
        c.shockMat.opacity = (1.0 - wave) * f * 0.85;

        // Rising jewel sparks
        c.sparks.visible = true;
        c.sparkMat.opacity = f * 0.98;
        c.sparkMat.size = (0.28 + f * 0.14) * narrowBoost;
        const posAttr = c.sparkGeo.attributes.position;
        for (let k = 0; k < c.sparkSeeds.length; k++) {
          const sd = c.sparkSeeds[k];
          let py = posAttr.getY(k) + dt * sd.spd * (1.2 + f * 0.9);
          const swirl = sd.ang + t * 2.4 + sd.phase;
          const rad = sd.rad * (0.65 + (py / sd.maxH) * 0.85);
          if (py > sd.maxH) py = 0.12;
          posAttr.setXYZ(k, Math.cos(swirl) * rad, py, Math.sin(swirl) * rad);
        }
        posAttr.needsUpdate = true;

        if (c.cluster.position.x < 0) maxFlareL = Math.max(maxFlareL, f);
        else maxFlareR = Math.max(maxFlareR, f);
      }
    } else {
      c.mat.emissiveIntensity = idlePulse;
      const idleHalo = c.baseHaloScale * (0.95 + Math.sin(t * 2.0 + c.ph) * 0.06);
      c.haloSprite.scale.set(idleHalo, idleHalo, 1);
    }
  }
  gemLightL.intensity = 15 + Math.sin(t * 1.7) * 3 + maxFlareL * 32;
  gemLightR.intensity = 14 + Math.cos(t * 1.6) * 2.5 + maxFlareR * 32;

  // Rising embers & swirling heat shimmer (strictly bounded under EMBER_CEIL)
  const boost = emberBoost.t0 > 0 ? 2.35 : 1.0;
  const ep = emberGeo.attributes.position;
  for (let i = 0; i < EMBERS; i++) {
    let y = ep.getY(i) + dt * (0.48 + (i % 5) * 0.14) * boost;
    const ph = emberPhase[i] + t * 1.4;
    let x = ep.getX(i) + Math.sin(ph) * dt * 0.20;
    let z = ep.getZ(i) + Math.cos(ph * 0.8) * dt * 0.20;
    if (y > EMBER_CEIL) {
      y = rand(0.1, 0.45);
      x = rand(-3.1, 3.1);
      z = rand(-2.5, 3.1);
    }
    ep.setXYZ(i, x, y, z);
  }
  ep.needsUpdate = true;
  emberMat.opacity = emberBoost.t0 > 0 ? 1.0 : 0.80 + Math.sin(t * 1.5) * 0.12;
  emberMat.size = (emberBoost.t0 > 0 ? 0.25 : 0.19) * narrowBoost;

  const sp = shimmerGeo.attributes.position;
  for (let i = 0; i < SHIMMERS; i++) {
    let sy = sp.getY(i) + dt * 0.38 * boost;
    const sph = shimmerPhase[i] + t * 1.1;
    let sx = sp.getX(i) + Math.sin(sph) * dt * 0.14;
    if (sy > 4.6) {
      sy = 0.2;
      sx = rand(-1.6, 1.6);
    }
    sp.setX(i, sx);
    sp.setY(i, sy);
  }
  sp.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
