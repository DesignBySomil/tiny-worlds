<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Steam Train Loop - Tiny Worlds</title>
<meta name="description" content="A railway circling the base through a tunnel. Tap the whistle, hear the crossing gates drop, and watch the smoke puffs stack up over the hills."/>
<style>
  html,body{margin:0;height:100%;background:#101812;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #app{position:fixed;inset:0;touch-action:none}
  .hud{position:fixed;left:0;right:0;pointer-events:none;color:#eaf1e6;text-align:center;z-index:2}
  .hud.top{top:max(14px,env(safe-area-inset-top))}
  .hud h1{font-size:15px;font-weight:650;letter-spacing:.02em;margin:0;opacity:.95}
  .hud p{font-size:11.5px;margin:4px 0 0;opacity:.55}
  .hud.bottom{bottom:max(14px,env(safe-area-inset-bottom));font-size:11.5px;opacity:.6;transition:opacity 1s}
  .hud.bottom.gone{opacity:0}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.45) 100%);z-index:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div class="hud top"><h1>Steam Train Loop</h1><p>a tiny world, one of fifty</p></div>
<div class="hud bottom" id="hint">Tap the engine for the whistle</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101812);
scene.fog = new THREE.Fog(0x101812, 26, 60);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, .1, 120);
camera.position.set(10.5, 8.5, 10.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .8, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 7; controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * .47;
controls.autoRotate = true; controls.autoRotateSpeed = .35;

scene.add(new THREE.HemisphereLight(0xcfd8c2, 0x1a2015, .7));
const sun = new THREE.DirectionalLight(0xffe9c4, 1.2);
sun.position.set(7, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
scene.add(sun);

// base
const top = new THREE.Mesh(new THREE.BoxGeometry(11, .7, 11), new THREE.MeshStandardMaterial({ color:0x567c3f, roughness:1 }));
top.position.y = -.35; top.receiveShadow = true; scene.add(top);
const soil = new THREE.Mesh(new THREE.BoxGeometry(11, 1.5, 11), new THREE.MeshStandardMaterial({ color:0x54402c, roughness:1 }));
soil.position.y = -1.45; scene.add(soil);

// hills (one holds the tunnel)
const hillMat = new THREE.MeshStandardMaterial({ color:0x4c7139, roughness:1, flatShading:true });
const hill1 = new THREE.Mesh(new THREE.SphereGeometry(2.4, 8, 6), hillMat);
hill1.scale.set(1.3, .8, 1); hill1.position.set(-2.4, 0, -2.9); hill1.castShadow = true; hill1.receiveShadow = true;
scene.add(hill1);
const hill2 = new THREE.Mesh(new THREE.SphereGeometry(1.7, 8, 6), hillMat);
hill2.scale.set(1.1, .7, 1); hill2.position.set(3.4, 0, 3.2); hill2.castShadow = true; hill2.receiveShadow = true;
scene.add(hill2);
// tunnel mouth through hill1 (dark arch + brick rim)
const tunnelMouth = new THREE.Group();
const mouth = new THREE.Mesh(new THREE.CircleGeometry(.55, 12, 0, Math.PI), new THREE.MeshStandardMaterial({ color:0x0a0d08, roughness:1 }));
tunnelMouth.add(mouth);
const rim = new THREE.Mesh(new THREE.TorusGeometry(.58, .12, 6, 12, Math.PI), new THREE.MeshStandardMaterial({ color:0x8a4a3a, roughness:.9 }));
tunnelMouth.add(rim);
tunnelMouth.position.set(-2.4, .0, -1.32);
scene.add(tunnelMouth);
const tunnelMouth2 = tunnelMouth.clone();
tunnelMouth2.position.set(-2.4, 0, -4.48);
tunnelMouth2.rotation.y = Math.PI;
scene.add(tunnelMouth2);

// trees
const trunkMat = new THREE.MeshStandardMaterial({ color:0x5a4128, roughness:1 });
const pineMat = new THREE.MeshStandardMaterial({ color:0x3d6030, roughness:1, flatShading:true });
for (let i = 0; i < 14; i++){
  const a = Math.random() * Math.PI * 2, r = 3.4 + Math.random() * 1.8;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.abs(x) > 5.2 || Math.abs(z) > 5.2) continue;
  const tr = new THREE.Group();
  const tk = new THREE.Mesh(new THREE.CylinderGeometry(.06, .09, .4, 5), trunkMat);
  tk.position.y = .2; tk.castShadow = true; tr.add(tk);
  const p1 = new THREE.Mesh(new THREE.ConeGeometry(.34, .7, 6), pineMat);
  p1.position.y = .65; p1.castShadow = true; tr.add(p1);
  const p2 = new THREE.Mesh(new THREE.ConeGeometry(.24, .5, 6), pineMat);
  p2.position.y = 1.05; p2.castShadow = true; tr.add(p2);
  tr.position.set(x, 0, z);
  scene.add(tr);
}

// track: ellipse loop
const RX = 4.1, RZ = 3.3;
function trackPoint(t){
  return new THREE.Vector3(Math.cos(t) * RX, .06, Math.sin(t) * RZ);
}
const loopPts = [];
for (let i = 0; i <= 96; i++) loopPts.push(trackPoint(i / 96 * Math.PI * 2));
const loopCurve = new THREE.CatmullRomCurve3(loopPts, true);
const railMat = new THREE.MeshStandardMaterial({ color:0x6f6f74, roughness:.4, metalness:.7 });
[-.16, .16].forEach(off => {
  const pts = loopPts.map(p => {
    const tangent = loopCurve.getTangentAt(loopPts.indexOf(p) / 96).normalize();
    const n = new THREE.Vector3(-tangent.z, 0, tangent.x).multiplyScalar(off);
    return p.clone().add(n);
  });
  const c = new THREE.CatmullRomCurve3(pts, true);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(c, 96, .035, 5, true), railMat));
});
// sleepers
const sleeperMat = new THREE.MeshStandardMaterial({ color:0x4a3826, roughness:1 });
for (let i = 0; i < 40; i++){
  const t = i / 40;
  const p = loopCurve.getPointAt(t);
  const tan = loopCurve.getTangentAt(t);
  const sl = new THREE.Mesh(new THREE.BoxGeometry(.5, .04, .12), sleeperMat);
  sl.position.copy(p); sl.position.y = .03;
  sl.rotation.y = Math.atan2(tan.x, tan.z);
  scene.add(sl);
}

// level crossing: road + two gates
const road = new THREE.Mesh(new THREE.BoxGeometry(1.4, .02, 11), new THREE.MeshStandardMaterial({ color:0x5c5648, roughness:1 }));
road.position.set(4.15, .012, 0);
road.rotation.y = .1;
road.receiveShadow = true;
scene.add(road);
const gates = [];
function makeGate(z){
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .7, 6), new THREE.MeshStandardMaterial({ color:0xb8b2a2 }));
  post.position.y = .35; g.add(post);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.5, .07, .07), new THREE.MeshStandardMaterial({ color:0xc44b3f, roughness:.8 }));
  arm.position.set(-.75, .68, 0);
  g.add(arm);
  g.userData.arm = arm;
  g.position.set(4.55, 0, z);
  scene.add(g);
  gates.push(g);
  return g;
}
makeGate(1.15); makeGate(-1.15);

// train
const train = new THREE.Group();
const loco = new THREE.Group();
const boiler = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .75, 10), new THREE.MeshStandardMaterial({ color:0x27313d, roughness:.5, metalness:.3 }));
boiler.rotation.z = Math.PI/2; boiler.position.y = .34; boiler.castShadow = true; loco.add(boiler);
const cab = new THREE.Mesh(new THREE.BoxGeometry(.34, .42, .4), new THREE.MeshStandardMaterial({ color:0x8a2f28, roughness:.7 }));
cab.position.set(-.42, .5, 0); cab.castShadow = true; loco.add(cab);
const chimney = new THREE.Mesh(new THREE.CylinderGeometry(.07, .1, .28, 8), new THREE.MeshStandardMaterial({ color:0x1a1f26, roughness:.6 }));
chimney.position.set(.3, .62, 0); loco.add(chimney);
const dome = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), new THREE.MeshStandardMaterial({ color:0xb98a3a, metalness:.6, roughness:.35 }));
dome.position.set(.05, .56, 0); loco.add(dome);
for (let i = 0; i < 3; i++){
  const w = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .06, 10), new THREE.MeshStandardMaterial({ color:0x15181d, roughness:.5 }));
  w.rotation.x = Math.PI/2;
  w.position.set(-.3 + i * .3, .11, .19);
  loco.add(w);
  const w2 = w.clone(); w2.position.z = -.19; loco.add(w2);
}
train.add(loco);
const wagons = [];
for (let w = 0; w < 2; w++){
  const wag = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(.6, .32, .38), new THREE.MeshStandardMaterial({ color: w ? 0x3f5a74 : 0x716331, roughness:.8 }));
  body.position.y = .32; body.castShadow = true; wag.add(body);
  for (let i = 0; i < 2; i++){
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .06, 10), new THREE.MeshStandardMaterial({ color:0x15181d }));
    wheel.rotation.x = Math.PI/2;
    wheel.position.set(-.18 + i * .36, .1, .19);
    wag.add(wheel);
    const wheel2 = wheel.clone(); wheel2.position.z = -.19; wag.add(wheel2);
  }
  train.add(wag);
  wagons.push(wag);
}
scene.add(train);

// smoke puffs
const SMAX = 90;
const puffs = [];
const puffMat = new THREE.MeshStandardMaterial({ color:0xd9d9d4, transparent:true, opacity:.75, roughness:1 });
for (let i = 0; i < SMAX; i++){
  const p = new THREE.Mesh(new THREE.IcosahedronGeometry(.12, 0), puffMat.clone());
  p.visible = false;
  scene.add(p);
  puffs.push({ mesh: p, life: 1e9 });
}

// whistle (WebAudio, synthesized)
let actx = null;
function whistle(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  const t0 = actx.currentTime;
  [622, 740].forEach(f => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.12, t0 + .05);
    g.gain.setValueAtTime(.12, t0 + .7);
    g.gain.exponentialRampToValueAtTime(.001, t0 + 1.1);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + 1.15);
  });
  whistleBurst = .9;
}
let whistleBurst = 0;

let downAt = null;
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY, t:performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const dt = performance.now() - downAt.t;
  downAt = null;
  if (moved > 8 || dt > 500) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(loco, true).length){ whistle(); controls.autoRotate = true; }
});
const hint = document.getElementById('hint');
setTimeout(() => hint.classList.add('gone'), 7000);

let trainT = 0;
let puffTimer = 0;
const clock = new THREE.Clock();
function placeOnTrack(obj, t){
  const p = loopCurve.getPointAt(((t % 1) + 1) % 1);
  const tan = loopCurve.getTangentAt(((t % 1) + 1) % 1);
  obj.position.set(p.x, p.y + .02, p.z);
  obj.rotation.y = Math.atan2(tan.x, tan.z) - Math.PI/2;
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  controls.update();

  trainT += dt * .028;
  placeOnTrack(loco, trainT);
  placeOnTrack(wagons[0], trainT - .028);
  placeOnTrack(wagons[1], trainT - .055);

  // crossing gates near the road crossing (track t where x ~ +RX)
  const pos = loopCurve.getPointAt(trainT % 1);
  const nearCrossing = Math.abs(pos.x - RX) < 1.6 && Math.abs(pos.z) < 2.4;
  gates.forEach(g => {
    const target = nearCrossing ? 0 : Math.PI/2 - .12;
    g.userData.arm.rotation.z += (target - g.userData.arm.rotation.z) * Math.min(dt * 4, 1);
  });

  // smoke
  whistleBurst = Math.max(0, whistleBurst - dt);
  puffTimer -= dt;
  if (puffTimer <= 0){
    puffTimer = whistleBurst > 0 ? .06 : .22;
    const free = puffs.find(p => p.life > 6);
    if (free){
      const cp = new THREE.Vector3(.3, .8, 0).applyEuler(loco.rotation).add(loco.position);
      free.mesh.position.copy(cp);
      free.mesh.scale.setScalar(.6);
      free.mesh.visible = true;
      free.mesh.material.opacity = .8;
      free.life = 0;
      free.vy = whistleBurst > 0 ? 1.8 : .9;
    }
  }
  puffs.forEach(p => {
    if (p.life > 6) return;
    p.life += dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.x += dt * .3;
    p.mesh.scale.multiplyScalar(1 + dt * .5);
    p.mesh.material.opacity = Math.max(.8 * (1 - p.life / 6), 0);
    if (p.life > 6) p.mesh.visible = false;
  });

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
